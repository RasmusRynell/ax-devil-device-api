    getConfiguration; after 'cameras' and 'profiles' in capabilities) - not valid JSON.
  - Visual feedback example uses apiVersion '1.3.' and has '"active":' without value; response method 'setCOnfiguration'.
  - Capabilities example key 'validAlarmDirection' vs table 'validAlarmDirections'; presets example 'maxNbrPresets'
    vs table 'maxNbrPresetsPerProfile'; 'defautActive' typo in table.
  - alarmOverlayEnabled type listed as 'int' but values true/false.
  - Capabilities example lists no sizePerspective filter entry; its limits are not documented.
  - getSupportedVersions curl omits Content-Type header.
