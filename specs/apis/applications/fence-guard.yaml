  sha256_md: ceeae911557831b61cca46370c37408f1542ea1526fcde13d639e402e3a93250
  retrieved_at: '2026-10-11'

provenance:
  completeness: complete
  open_questions:
  - The docs' examples contain placeholder variables (w,h,t,x,y,p,r) and missing commas, so they are not valid JSON; the examples here fill placeholders with sample values.
  - The visual feedback example uses apiVersion '1.3.', has '"active":' without a value, and the response method is 'setCOnfiguration'.
  - The capabilities example uses 'validAlarmDirection' and 'maxNbrPresets' while the tables say 'validAlarmDirections' and 'maxNbrPresetsPerProfile' (the tables are used); the table also misspells 'defautActive'.
  - The docs list alarmOverlayEnabled as type 'int' but its values are true/false (boolean used).
  - The capabilities example lists no sizePerspective filter entry; its limits are not documented.
  - The docs say all properties are mandatory unless noted but also give defaults for several; required fields of Camera and Profile follow the example responses, so a device omitting one would raise ResponseFormatError.
  - The docs give EmbeddedDevelopment >= 2.13 (Properties.EmbeddedDevelopment.Version) as the identification, which the discovery format cannot express (exact value only); no discovery entry is set.
  - The get_event_stream RTSP request mentioned by the v1 corpus is not a JSON-RPC method and is not modelled.
  migrated_from: v1
  curated: true
