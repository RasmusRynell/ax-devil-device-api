format: 2
id: fence-guard
name: Fence guard
summary: Configure the AXIS Fence Guard ACAP (virtual fence lines, crossing direction, exclusion filters, perspective, PTZ presets, alarm overlay).
section: applications
family: jsonrpc
status: released
python:
  module: fence_guard
  class: FenceGuard
docs:
- https://developer.axis.com/vapix/applications/fence-guard/
access: admin
requires:
  application: AXIS Fence Guard

binding:
  path: /local/fenceguard/control.cgi
  major: 1
  versions: ['1.1', '1.2', '1.3']
  negotiation:
    get_supported_versions: {key: apiVersions}
  params_placement: params

errors:
  1000: {description: Application error; the application failed to handle the request (see the server log; a restart may help)., kind: internal}
  2000: {description: Unsupported version; the major version number isn't supported., kind: unsupported}
  2001: {description: Invalid format; the request does not follow the JSON schema., kind: invalid_argument}
  2002: {description: Incoherent format; parts of the request contradict each other or refer to something that does not exist., kind: invalid_argument}
  2003: {description: Missing parameter; a mandatory parameter is missing., kind: invalid_argument}
  2004: {description: Invalid parameter; a parameter has an invalid value., kind: invalid_argument}
  8000: {description: Unsupported product; the camera is not supported by this version of the application., kind: unsupported}
  9000: {description: Invalid license; the license file is invalid or missing., kind: access_denied}
  1001-1999: {description: "Reserved for camera application (server) errors, e.g. could not read configuration from file.", kind: internal}
  2005-2999: {description: "Reserved for client errors, e.g. wrong format of configuration file or invalid parameter.", kind: invalid_argument}
  9001-9999: {description: "Reserved for license related errors, e.g. license invalid or missing.", kind: access_denied}

types:
  Point:
    type: array
    items: {type: number, minimum: -1, maximum: 1}
    description: '[x, y] normalized to the image size; the visible view spans -1..1. (minItems=2, maxItems=2)'
  Camera:
    type: object
    required: [active, id, rotation]
    description: General settings of one camera, shared by all profiles using it.
    properties:
      active:
        type: boolean
        default: true
        description: Profiles for the camera may be active if true; all profiles for the camera are inactivated if false.
      id:
        type: integer
        minimum: 1
        default: 1
        description: Camera value used with media.amp (starts at 1).
      rotation:
        type: integer
        enum: [0, 90, 180, 270]
        default: 0
        description: Rotation of the camera in degrees; should match Image.I<camera>.Appearance.Rotation.
      overlayResolution:
        type: string
        pattern: ^[0-9]+x[0-9]+$
        description: Resolution <width>x<height> of the video streams with the alarm overlay burnt in. Optional if alarmOverlayEnabled is not active. Since 1.3.
  FilterType:
    enum: [sizePercentage, sizePerspective, timeShortLivedLimit]
  Filter:
    type: object
    required: [type, data]
    description: >-
      Exclusion filter. A filter that is not present is disabled. Only one size filter (sizePercentage or
      sizePerspective) can be active at a time.
    properties:
      type: {$ref: '#/types/FilterType'}
      data:
        description: >-
          Depends on the type. sizePercentage: [w, h] in percent of the image, each 3..100 (default [5, 5]); objects
          at or below are ignored. sizePerspective: [w, h] real-world size in cm; needs perspective bars.
          timeShortLivedLimit: integer seconds 1..5 (default 1).
        oneOf:
          - type: array
            items: {type: integer}
          - type: integer
      active: {type: boolean, description: If the filter is active.}
  Trigger:
    type: object
    required: [type, data, alarmDirection]
    properties:
      type: {const: fence}
      data:
        type: array
        items: {$ref: '#/types/Point'}
        description: Fence polyline [[x0,y0], ..., [xn,yn]].
      alarmDirection:
        type: string
        enum: [leftToRight, rightToLeft, both]
        description: Left/right from a viewer at the segment start looking towards its end.
  PerspectiveBar:
    type: object
    required: [type, data, height]
    properties:
      type: {const: bar, description: A vertical line in the rotation of the camera.}
      data:
        type: array
        items: {$ref: '#/types/Point'}
        description: Start (touches the ground plane) and end point. (minItems=2, maxItems=2)
      height:
        type: integer
        description: Real-world height (cm) of an object at the same location and with the same perceived height.
  Profile:
    type: object
    required: [name, uid, camera, triggers]
    properties:
      name:
        type: string
        maxLength: 15
        default: Profile <uid>
        description: 'Unicode, up to 15 characters; part of the event nice name. Invalid: ''&&'', ''<'', ''>''.'
      uid: {type: integer, default: 1, description: Unique id of the profile.}
      camera: {type: integer, default: 1, description: Shall match the id of the corresponding camera.}
      alarmOverlayEnabled:
        type: boolean
        default: false
        description: True if the profile's alarming objects are shown in an alarm overlay video stream. Since 1.3.
      filters:
        type: array
        items: {$ref: '#/types/Filter'}
        description: Exclusion filters; all optional; a filter not present is disabled.
      triggers:
        type: array
        items: {$ref: '#/types/Trigger'}
        description: Exactly one fence (may change in the future). (minItems=1, maxItems=1)
      presets:
        type: array
        items: {type: integer}
        default: []
        description: >-
          Since 1.1. PTZ only (error on non-PTZ; absent on other cameras). At most one preset index
          (PTZ.Preset.P0.Position.P<index>), -1 any preset, -2 anywhere; empty means always active.
      perspective:
        type: array
        items: {$ref: '#/types/PerspectiveBar'}
        default: []
        description: Perspective bars calibrating the view; needed for the sizePerspective filter.
  Configuration:
    type: object
    required: [cameras, profiles]
    x-read-only: [configurationStatus]
    description: The complete ACAP configuration, as read by get_configuration and written by set_configuration.
    properties:
      cameras:
        type: array
        items: {$ref: '#/types/Camera'}
      profiles:
        type: array
        items: {$ref: '#/types/Profile'}
        description: To remove a profile, remove it from the array.
      configurationStatus:
        type: integer
        minimum: 0
        description: Read-only (ignored by setConfiguration). 0 is the default configuration; incremented by each set; reset to 1 after MAX_INT.
  AlarmOverlayCamera:
    type: object
    properties:
      id: {type: integer, description: "Same as cameras[i].id in the configuration (starts at 1)."}
      availableResolutions:
        type: array
        items: {type: string}
        description: Resolutions <width>x<height> for which the alarm overlay can be used on this camera.
  AlarmOverlayCapabilities:
    type: object
    properties:
      isSupported: {type: boolean, description: True if the camera supports the burnt-in overlay feature.}
      maxNbrActiveCameras: {type: integer, description: Number of cameras of a multichannel device that can use the feature at once; 0 if not supported.}
      cameras:
        type: array
        items: {$ref: '#/types/AlarmOverlayCamera'}
  FilterCapability:
    type: object
    properties:
      type: {$ref: '#/types/FilterType'}
      min:
        description: Minimum allowed value; [w, h] percent for sizePercentage, seconds for timeShortLivedLimit.
        oneOf:
          - type: array
            items: {type: integer}
          - type: integer
      max:
        description: Maximum allowed value; same shape as min.
        oneOf:
          - type: array
            items: {type: integer}
          - type: integer
      default:
        description: Default value; same shape as min.
        oneOf:
          - type: array
            items: {type: integer}
          - type: integer
      defaultActive: {type: boolean, description: If the filter is active by default. The docs table misspells it defautActive for timeShortLivedLimit.}
  TriggerCapability:
    type: object
    properties:
      type: {const: fence}
      min:
        type: array
        items: {type: number}
        description: '[xPos, yPos] minimum allowed values for the fence.'
      max:
        type: array
        items: {type: number}
        description: '[xPos, yPos] maximum allowed values for the fence.'
      minNbrVertices: {type: integer}
      maxNbrVertices: {type: integer}
      minNbrInstances: {type: integer}
      maxNbrInstances: {type: integer}
      validAlarmDirections:
        type: array
        items: {type: string}
        x-python-name: valid_alarm_directions
      defaultInstance:
        type: array
        items: {$ref: '#/types/Point'}
      defaultAlarmDirection: {type: string}
  ProfileCapabilities:
    type: object
    properties:
      minNbrProfilesPerCamera: {type: integer}
      maxNbrProfilesPerCamera: {type: integer}
      minLengthName: {type: integer}
      maxLengthName: {type: integer}
  PresetCapabilities:
    type: object
    description: Only for mechanical PTZ cameras.
    properties:
      maxNbrPresetsPerProfile: {type: integer}
      defaultPreset: {type: integer}
  ConfigurationCapabilities:
    type: object
    properties:
      alarmOverlay: {$ref: '#/types/AlarmOverlayCapabilities'}
      filters:
        type: array
        items: {$ref: '#/types/FilterCapability'}
      triggers:
        type: array
        items: {$ref: '#/types/TriggerCapability'}
      profiles: {$ref: '#/types/ProfileCapabilities'}
      presets: {$ref: '#/types/PresetCapabilities'}
  SendAlarmEventRequest:
    type: object
    required: [profile]
    properties:
      profile:
        type: integer
        description: The unique id (uid) of the profile that will send the alarm event. There must be a profile with the specified uid.

operations:
  get_configuration:
    summary: Request the current configuration of the ACAP.
    effect: read
    binding: {method: getConfiguration}
    result: {$ref: '#/types/Configuration'}
    examples:
      - title: Get the configuration (placeholders filled in)
        request: {params: {}}
        response:
          data:
            cameras:
              - {active: true, id: 1, rotation: 0, overlayResolution: 1280x720}
            profiles:
              - name: Profile 1
                uid: 1
                camera: 1
                alarmOverlayEnabled: true
                filters:
                  - {type: sizePerspective, data: [50, 100], active: true}
                  - {type: sizePercentage, data: [5, 5], active: false}
                  - {type: timeShortLivedLimit, data: 2, active: true}
                triggers:
                  - {type: fence, data: [[-0.5, 0.2], [0.5, 0.2]], alarmDirection: both}
                presets: [1]
                perspective:
                  - {type: bar, data: [[-0.4, 0.5], [-0.4, 0.2]], height: 180}
                  - {type: bar, data: [[0.4, 0.5], [0.4, 0.2]], height: 180}
            configurationStatus: 0
        source: https://developer.axis.com/vapix/applications/fence-guard/#getconfiguration
      - title: Application error
        request: {params: {}}
        response: {error: {code: 1000, message: A descriptive error message}}
        source: https://developer.axis.com/vapix/applications/fence-guard/#getconfiguration
  set_configuration:
    summary: Set the complete configuration of the ACAP.
    description: >-
      Replaces the whole configuration, so send everything that should stay; to remove a profile, leave it out of
      profiles. If the ACAP is not restarted beforehand, ongoing events are set inactive when the new configuration
      is applied, stopping ongoing recordings; on multichannel products all cameras are affected simultaneously.
      Prefer a minified body, as POST requests have a size limit. apiVersion 1.2 or older clients cannot change
      alarmOverlayEnabled and overlayResolution: those values are ignored and the existing ones are kept.
    effect: write
    write: replace
    binding: {method: setConfiguration}
    params: {$ref: '#/types/Configuration'}
    round_trip:
      from: Configuration
    since_fields:
      params.cameras.overlayResolution: '1.3'
      params.profiles.alarmOverlayEnabled: '1.3'
      params.profiles.presets: '1.1'
    errors:
      2002: {description: "Incoherent format; parts of the configuration contradict each other, e.g. several profiles have the same uid.", kind: invalid_argument}
    examples:
      - title: Enable the alarm overlay (placeholders filled in)
        request:
          params:
            cameras:
              - {active: true, id: 1, rotation: 0, overlayResolution: 1280x720}
            profiles:
              - name: Profile 1
                uid: 1
                camera: 1
                alarmOverlayEnabled: true
                filters:
                  - {type: sizePercentage, data: [10, 20], active: true}
                triggers:
                  - {type: fence, data: [[-0.5, 0.2], [0.5, 0.2]], alarmDirection: leftToRight}
        response: {data: {}}
        source: https://developer.axis.com/vapix/applications/fence-guard/#setconfiguration
      - title: Invalid license
        request:
          params:
            cameras: []
            profiles: []
        response: {error: {code: 9000, message: A descriptive error message}}
        source: https://developer.axis.com/vapix/applications/fence-guard/#setconfiguration
  get_configuration_capabilities:
    summary: Request the boundaries and default values of the ACAP (constant per camera).
    effect: read
    binding: {method: getConfigurationCapabilities}
    result: {$ref: '#/types/ConfigurationCapabilities'}
    examples:
      - title: Get the capabilities (placeholders filled in)
        request: {params: {}}
        response:
          data:
            alarmOverlay:
              isSupported: true
              cameras:
                - {id: 1, availableResolutions: [1280x720, 640x360]}
              maxNbrActiveCameras: 1
            filters:
              - {type: sizePercentage, min: [3, 3], max: [100, 100], default: [5, 5], defaultActive: true}
              - {type: timeShortLivedLimit, min: 1, max: 5, default: 1, defaultActive: true}
            triggers:
              - type: fence
                min: [-1, -1]
                max: [1, 1]
                minNbrVertices: 2
                maxNbrVertices: 10
                minNbrInstances: 1
                maxNbrInstances: 1
                validAlarmDirections: [leftToRight, rightToLeft, both]
                defaultInstance: [[-0.5, -0.5], [-0.5, 0.5], [0.5, 0.5], [0.5, -0.5]]
                defaultAlarmDirection: both
            profiles:
              minNbrProfilesPerCamera: 1
              maxNbrProfilesPerCamera: 10
              minLengthName: 1
              maxLengthName: 15
            presets:
              maxNbrPresetsPerProfile: 1
              defaultPreset: 1
        source: https://developer.axis.com/vapix/applications/fence-guard/#getconfigurationcapabilities
  send_alarm_event:
    summary: Send a stateful alarm event (active for a few seconds) for a profile, for VMS testing.
    description: >-
      The response is returned immediately. All events related to the profile are sent, independent of its current
      state (e.g. PTZ profiles connected to other presets).
    access: operator
    effect: action
    binding: {method: sendAlarmEvent}
    params: {$ref: '#/types/SendAlarmEventRequest'}
    positional: [profile]
    errors:
      2002: {description: "Incoherent format; the request cannot be handled, e.g. the profile id does not exist or is on an inactive camera.", kind: not_found}
    examples:
      - title: Send an alarm event for profile 1
        request: {params: {profile: 1}}
        response: {data: {}}
        source: https://developer.axis.com/vapix/applications/fence-guard/#sendalarmevent

sources:
