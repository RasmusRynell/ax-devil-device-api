provenance:
  completeness: complete
  open_questions:
  - 'Security level: each method says Administrator but ''Parameter description'' says Operator. https://developer.axis.com/vapix/applications/video-motion-detection-4-api/#parameter-description'
  - Examples are not valid JSON (placeholders, getConfiguration response 'profiles' array missing '{', example configuration
    has stray ']', capabilities example missing comma after alarmOverlay).
  - Capabilities example uses 'maxNbrPresets' while the table uses 'maxNbrPresetsPerProfile'.
  - presets table says '-1 means that the profile is active on any profile' (presumably any preset).
  - alarmOverlay capability introduced in 1.3, but no configuration properties for enabling alarm overlay (alarmOverlayEnabled/overlayResolution)
    are documented on this page.
  - configurationStatus valid values listed only as 'INT_MAX'.
  - ONVIF MotionAlarm parameter table lists 'Property=<Source>' twice (second presumably State).
  - Legacy VMD3 event element is 'VMD3_video_1' (capital) vs 'vmd3_video_1' on the VMD3 page.
  - 'migration: skipped-op: get_event_stream (rtsp_request) is not a JSON-RPC method; skipped'
  - 'migration: effect-guessed: write semantics guessed from the method name: set_configuration=write/patch'
  - 'migration: discovery: discovery method http_probe dropped'
  - 'migration: discovery: param_property ''Properties.EmbeddedDevelopment.Version>=2.12'' is not a Name=value pair:
    dropped'
  - 'migration: dropped-keywords: maxProperties x1, since x1, title x4'
