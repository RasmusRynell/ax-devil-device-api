provenance:
  completeness: partial
  open_questions:
  - Events section says 'The cross line detection 2.1 event' on a 1.1 page. https://developer.axis.com/vapix/applications/cross-line-detection-1.1-api/#events
  - Event 'object' is described as 'the ID of the virtual line which the moving object has crossed' but its nice name is 'Passed
    object id'; type string although described as integer.
  - Table uses attribute 'knownTypeName' while XML uses 'knownNameType'.
  - Modify example XML is malformed (<event name="timer" hiddenFromTriggerList="true"> not closed) and omits the <config>
    wrapper used in Application configuration API.
  - Response Content-Type is application/xml here vs text/xml in Application configuration API.
  - Start application example uses GET while Application API documents POST.
  - 'BLOCKED(raw-body): modify_configuration: POST /axis-cgi/vaconfig.cgi sends ''action=modify&name=CrossLineDetection'',
    a newline and the raw <application> XML as one form-encoded body; the XML is not a key=value pair. Only CrossLine0 and
    the Direction parameter should change.'
  - 'BLOCKED(rtsp-url): get_event_stream: rtsp://<servername>/axis-media/media.amp?event=on&video=0&eventtopic=onvif:RuleEngine/axis:CrossLineDetection//.
    delivers the linetouched events.'
  - The documented get reply has <application> directly under <reply>, while the Application configuration API shows <config
    version> in between; the result type reads the application from either place only if the device matches the documented
    shape (root '.').
  - 'BLOCKED(raw-body): modify_configuration: POST /axis-cgi/vaconfig.cgi sends ''action=modify&name=CrossLineDetection'',
