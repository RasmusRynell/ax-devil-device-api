format: 2
id: application-configuration-api
name: Application configuration API
summary: 'Obsolete vaconfig.cgi API: get the XML configuration of Axis-developed applications (for example Video Motion Detection
  and Cross Line Detection) and list installed applications.'
section: applications
family: cgi
status: deprecated
python:
  module: application_configuration
  class: ApplicationConfiguration
docs:
- https://developer.axis.com/vapix/applications/application-configuration-api/
access: admin
discovery:
- param:
    name: Properties.EmbeddedDevelopment.Version
    value: '1.00'
    compare: '>='
requires:
  firmware: '5.11'
binding:
  path: /axis-cgi/vaconfig.cgi
errors:
  bad_request:
    description: Bad request. The request URL was not formatted correctly.
    kind: invalid_argument
  no_such_application:
    description: There is no application with the given name.
    kind: not_found
  internal:
    description: The action could not be performed, for example because the application failed to restart after a configuration
      modification.
    kind: internal
types:
  Point:
    type: object
    required:
    - x
    - y
    properties:
      x:
        type: number
        description: X coordinate, -1.0 to 1.0. The top right corner of the camera view is x=1.0, y=1.0.
      y:
        type: number
        description: Y coordinate, -1.0 to 1.0.
  IntValue:
    type: object
    required:
    - value
    properties:
      value:
        type: integer
  NamedObjectData:
    type: object
    properties:
      knownNameType:
        type: string
        description: Type of the data, for example geometry.polygon or core.int. The docs' attribute table spells it knownTypeName.
      polygon:
        type: array
        items:
          $ref: '#/types/Point'
        x-xml:
          path: polygon/point
        description: Corner points of a polygon object; empty for other object types.
      segment:
        type: array
        items:
          $ref: '#/types/Point'
        x-xml:
          path: segment/point
        description: End points of a virtual line (geometry.segment); empty for other object types.
      int:
        $ref: '#/types/IntValue'
        x-python-name: integer
        description: Integer data of a core.int object, such as a filter value or a view area number.
  NamedObject:
    type: object
    required:
    - name
    properties:
      name:
        type: string
        description: Name of the object. Rule parameters refer to it by this name.
      data:
        $ref: '#/types/NamedObjectData'
  RuleParameter:
    type: object
    required:
    - name
    - value
    properties:
      name:
        type: string
        description: Name of a parameter used by the rule function.
      value:
        type: string
        description: Value of the parameter; the name of the named object to use.
  Rule:
    type: object
    required:
    - name
    properties:
      name:
        type: string
        description: Name of the rule.
      function:
        type: string
        description: Name of the rule function, defined in a script file.
      parameter:
        type: array
        items:
          $ref: '#/types/RuleParameter'
        x-xml:
          path: parameter
        x-python-name: parameters
  Script:
    type: object
    properties:
      name:
        type: string
        x-xml: text
        description: Name of the script file.
      encryption:
        type: string
        enum:
        - '0'
        - '1'
        description: 1 = the script is encrypted, 0 = not encrypted.
  EventAttribute:
    type: object
    properties:
      key:
        type: string
      nicename:
        type: string
      tag:
        type: string
        enum:
        - source
        - data
        - property-state
        description: source = source info of the event metadata, data = data info, property-state = stateful event (0 or 1).
      value:
        type: string
  Event:
    type: object
    required:
    - name
    properties:
      name:
        type: string
        description: Name of an event emitted by the application.
      nicename:
        type: string
      attr:
        type: array
        items:
          $ref: '#/types/EventAttribute'
        x-xml:
          path: attr
        x-python-name: attributes
  MoteOption:
    type: object
    required:
    - name
    - value
    properties:
      name:
        type: string
        description: 'Option name: boundingBox, polygon or velocity.'
      value:
        type: string
        enum:
        - 'true'
        - 'false'
  NameValue:
    type: object
    properties:
      name:
        type: string
      value:
        type: string
  Library:
    type: object
    properties:
      name:
        type: string
  RuleEngine:
    type: object
    properties:
      status:
        type: string
        enum:
        - enabled
        - disabled
        description: Whether the AXIS OS parses this configuration (AXIS OS 5.61 and later).
      namedObjects:
        type: array
        items:
          $ref: '#/types/NamedObject'
        x-xml:
          path: namedObjects/namedObject
        description: All named objects used by the application.
      rules:
        type: array
        items:
          $ref: '#/types/Rule'
        x-xml:
          path: rules/rule
        description: All rules used by the application.
      scripts:
        type: array
        items:
          $ref: '#/types/Script'
        x-xml:
          path: scripts/script
      events:
        type: array
        items:
          $ref: '#/types/Event'
        x-xml:
          path: events/event
      analyticSources:
        type: array
        items:
          $ref: '#/types/NameValue'
        x-xml:
          path: analyticSources/analyticSource
      moteConfig:
        type: array
        items:
          $ref: '#/types/MoteOption'
        x-xml:
          path: moteConfig/option
        description: MOTE configuration options.
      libraries:
        type: array
        items:
          $ref: '#/types/Library'
        x-xml:
          path: libraries/library
  Application:
    type: object
    required:
    - name
    properties:
      name:
        type: string
        description: Name of the application.
      nicename:
        type: string
      ruleEngine:
        $ref: '#/types/RuleEngine'
  ApplicationConfig:
    type: object
    x-xml:
      root: config
    description: Application configuration. Most parts define how the application runs and should not be modified.
    properties:
      version:
        type: string
        description: Version of the configuration format.
      application:
        $ref: '#/types/Application'
  InstalledApplication:
    type: object
    required:
    - name
    properties:
      name:
        type: string
        description: Application name.
  ApplicationList:
    type: object
    properties:
      applications:
        type: array
        items:
          $ref: '#/types/InstalledApplication'
        x-xml:
          path: application
operations:
  get_configuration:
    summary: Retrieve the configuration of an application.
    description: Obsolete; removed in AXIS OS 12.0. The configuration of a particular application is described in that application's
      API documentation.
    effect: read
    binding:
      method: GET
      query:
        action: get
      reply: &id001
        xml:
          status_error:
            attribute: result
            value: error
    params:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: Application name.
    positional:
    - name
    result:
      $ref: '#/types/ApplicationConfig'
    examples:
    - title: Get the application configuration
      request:
        query:
          action: get
          name: ExampleApp
      response:
        status: 200
        text: |
          <reply result="ok">
              <config version="1.0">
                  <application name="ExampleApp">
                      <ruleEngine>
                          <namedObjects>
                              <namedObject name="ExampleLine1">
                                  <data knownNameType="geometry.segment">
                                      <segment>
                                          <point x="-0.5" y="0.0" />
                                          <point x="0.5" y="0.0" />
                                      </segment>
                                  </data>
                              </namedObject>
                              <namedObject name="ExamplePolygon1">
                                  <data knownNameType="geometry.polygon">
                                      <polygon>
                                          <point x="0.60" y="0.60" />
                                          <point x="0.60" y="-0.60" />
                                          <point x="-0.60" y="-0.60" />
                                          <point x="-0.60" y="0.60" />
                                      </polygon>
                                  </data>
                              </namedObject>
                          </namedObjects>
                          <rules>
                              <rule name="example_rule" function="example_function">
                                  <parameter name="ExampleLineParameter" value="ExampleLine1" />
                                  <parameter name="ExamplePolygonParameter" value="ExamplePolygon1" />
                              </rule>
                          </rules>
                          <scripts>
                              <script encryption="1">example.lua</script>
                          </scripts>
                          <events>
                              <event name="example_event">
                                  <attr key="example_state" nicename="Example State" tag="property_state" />
                              </event>
                          </events>
                          <moteConfig>
                              <option name="boundingBox" value="false" />
                              <option name="polygon" value="true" />
                              <option name="velocity" value="true" />
                          </moteConfig>
                      </ruleEngine>
                  </application>
              </config>
          </reply>
      source: https://developer.axis.com/vapix/applications/application-configuration-api/#get-the-application-configuration
    - title: Application not found
      request:
        query:
          action: get
          name: hello_glib
      response:
        status: 200
        text: |
          <reply result="error">
              <script />
              <error type="no_such_application" message="No application 'hello_glib' exists" />
          </reply>
      source: https://developer.axis.com/vapix/applications/application-configuration-api/#get-application-configuration
  list_applications:
    summary: List the installed applications.
    description: Obsolete; removed in AXIS OS 12.0. Replaced by /axis-cgi/applications/list.cgi in the Application API.
    effect: read
    binding:
      method: GET
      query:
        action: list
      reply: *id001
    result:
      $ref: '#/types/ApplicationList'
    examples:
    - title: List installed applications
      request:
        query:
          action: list
      response:
        status: 200
        text: |
          <reply result="ok">
              <application name="Name1"/>
              <application name="Name2"/>
          </reply>
      source: https://developer.axis.com/vapix/applications/application-configuration-api/#list-installed-applications
      x-contract:
        template: true
  modify_configuration:
    summary: Modify the configuration of an application.
    description: >-
      Obsolete; removed in AXIS OS 12.0. Posts the application's <config version="1.0"> XML. The device answers with a failure
      reply only if the request failed.
    effect: write
    write: replace
    binding:
      method: POST
      encoding: body
      content_type: text/xml
      query: {action: modify}
      reply:
        xml:
          status_error:
            attribute: result
            value: error
    params:
      type: object
      required: [name, config]
      properties:
        name: {type: string, description: The application name.}
        config:
          type: string
          x-in: body
          description: The <config version="1.0"> XML document holding the <application> configuration.
    positional: [name, config]
    examples:
    - title: Modify the application configuration (success reply body assumed, not shown in the docs)
      request:
        query: {action: modify, name: ExampleApp}
        body: |
          <config version="1.0">
            <application name="ExampleApp">
              <ruleEngine>
                <scripts>
                  <script encryption="1">example.lua</script>
                </scripts>
              </ruleEngine>
            </application>
          </config>
        content_type: text/xml
      response:
        status: 200
        content_type: text/xml
        text: '<reply result="ok"/>'
      source: https://developer.axis.com/vapix/applications/application-configuration-api/#modify-application-configuration
    - title: Application not found
      request:
        query: {action: modify, name: hello_glib}
        body: '<config version="1.0"/>'
        content_type: text/xml
      response:
        status: 200
        content_type: text/xml
        text: |
          <reply result="error">
              <script />
              <error type="no_such_application" message="No application 'hello_glib' exists" />
          </reply>
      source: https://developer.axis.com/vapix/applications/application-configuration-api/#modify-application-configuration
  get_rtsp_stream_with_event_topic_filter:
    summary: Build the RTSP URL of a stream with an event topic filter.
    description: >-
      Builds the URL only. Event topic filters: AXIS Video Motion Detection 3 ``onvif:RuleEngine/axis:VMD3//.``, Video Motion
      Detection 2.1 ``onvif:RuleEngine/axis:VideoMotionDetection//motion``, Digital Autotracking
      ``onvif:RuleEngine/axis:DigitalAutotracking/tracking//.``, Cross Line Detection 1.1 ``onvif:RuleEngine/axis:CrossLineDetection//.``.
      For more arguments see the RTSP URL parameters of the Video streaming API.
    effect: read
    binding:
      rtsp: {}
    params:
      type: object
      properties:
        video: {type: boolean, description: Whether video is available in the stream.}
        event:
          type: string
          enum: ['on', 'off']
          description: Whether event metadata is included in the stream.
        eventtopic: {type: string, description: The event topic filter to include.}
sources:
- url: https://developer.axis.com/vapix/applications/application-configuration-api/
  sha256_md: f4d00857089b9b103301934cd7507e66c6cb80e28e1c745f8fcb38272ea16d52
  retrieved_at: '2026-10-11'
provenance:
  completeness: partial
  open_questions:
  - Event example topic is spelled 'tns1:RuleEnginge/...' (typo for RuleEngine?). https://developer.axis.com/vapix/applications/application-configuration-api/#events
  - 'modify_configuration is sent as the syntax block says (POST ?action=modify&name=<name>, the XML as the raw body, text/xml). The examples instead put action=...&name=... and the XML into one application/x-www-form-urlencoded body (with a stray </reply> in the curl sample); which the device accepts is not verified.'
  - Event attr tag value is 'property-state' in the table but 'property_state' in the XML examples.
  - Success response bodies for modify are not shown; XSDs modify_response1.xsd/list1.xsd are referenced at www.axis.com but
    not mirrored.
  - The 'Manage I/O ports' (port.cgi) section appears unrelated to application configuration and its examples 1-2 use param.cgi.
  - Table says moteConfig option 'velocity' value true/false without description.
  - The failure reply <reply result="error"><error type message/></reply> is detected through the result attribute only; the
    runtime cannot read the type and message attributes of the child error element, so the error message is generic.
  - 'The ''Manage I/O ports'' section (/axis-cgi/io/port.cgi: check, checkactive, checkdirection, action, monitor) is unrelated
    to application configuration and is covered by the io-port-api spec, so the migrated io_port operation was removed here.'
  - The failure reply <reply result="error"><error type message/></reply> is detected through the result attribute only; the
    runtime cannot read the type and message attributes of the child error element, so the error message is generic.
  migrated_from: v1
  curated: true
