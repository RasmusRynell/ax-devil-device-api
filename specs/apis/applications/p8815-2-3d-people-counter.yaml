provenance:
  completeness: partial
  open_questions:
  - "BLOCKED(jsonrpc-in-cgi): adjust_occupancy: POST /axis-cgi/a3dpc.cgi takes a Google JSON envelope (apiVersion, context, method adjustOccupancy, params.occupancy) and answers {apiVersion, context, method, data} or {error: {code, message}} with error 1200 (secondary device, or occupancy estimation off); Operator access. A raw body would send the envelope but the cgi family cannot read the error member of a 200 reply, and the spec family is cgi for the GET exports, so the method needs a jsonrpc-family binding (own spec or per-operation family)."
  - "BLOCKED(jsonrpc-in-cgi): restart_passthrough_countdown: same /axis-cgi/a3dpc.cgi envelope with method restartPassthroughCountdown and no params; the reply data is {}; error 1200; Operator access. Blocked for the same reason as adjust_occupancy."
  - Generic data push is pushed by the device to a configured HTTPS endpoint, so it is not an operation. The field table names Data and Sensor as arrays but the sample uses plain objects, and it says sensor[].timeZone while the sample uses timezone.
  - Error code 1200 of the a3dpc.cgi methods is used for three different conditions and is missing from the general error code list.
  - Occupancy example 2 text says current day but uses start=yesterday&end=today.
  - AXIS OS and application version requirements and the access level of the GET export endpoints are not documented, so access stays admin.
  migrated_from: v1
  curated: true
