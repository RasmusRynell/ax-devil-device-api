format: 2
id: p8815-2-3d-people-counter
name: P8815-2 3D people counter API
summary: Export foot traffic and occupancy statistics (CSV/JSON) and read real-time occupancy on the AXIS P8815-2 3D People Counter.
section: applications
family: cgi
status: released
python:
  module: p8815_2_3d_people_counter
  class: P8815PeopleCounter3D
docs:
- https://developer.axis.com/vapix/applications/p8815-2-3d-people-counter-api/
access: admin
requires:
  application: AXIS 3D People Counter

binding: {path: /a3dpc/api/export/csv}

types:
  StatisticsDate:
    type: string
    pattern: ^([0-9]{8}|yesterday|today|now)$
    description: 'YYYYMMDD (start-of-day), yesterday (start-of-day), today (start-of-day) or now (current time).'
  TrafficResolution:
    type: string
    enum: [minute, hour, day]
  OccupancyResolution:
    type: string
    enum: [hour, day]
  TrafficRecord:
    type: object
    required: [start, end, in, out]
    properties:
      start: {type: string, description: 'Interval start, YYYY-MM-DD hh:mm:ss.'}
      end: {type: string, description: 'Interval end, YYYY-MM-DD hh:mm:ss.'}
      in: {type: integer, description: People counted in during the interval.}
      out: {type: integer, description: People counted out during the interval.}
  TrafficStatistics:
    type: object
    required: [data]
    properties:
      data:
        type: array
        items: {$ref: '#/types/TrafficRecord'}
  OccupancyRecord:
    type: object
    required: [start, end, peak]
    properties:
      start: {type: string, description: 'Interval start, YYYY-MM-DD hh:mm:ss.'}
      end: {type: string, description: 'Interval end, YYYY-MM-DD hh:mm:ss.'}
      peak: {type: integer, description: Peak occupancy during the interval.}
  OccupancyStatistics:
    type: object
    required: [data]
    properties:
      data:
        type: array
        items: {$ref: '#/types/OccupancyRecord'}
  RealTimeOccupancy:
    type: object
    description: Real-time estimated occupancy and counting statistics for the primary camera and its connected secondary cameras.
    required: [occupancy, serial, timestamp, total_in, total_out]
    properties:
      occupancy: {type: integer, description: Estimated occupancy.}
      serial: {type: string, description: 'Serial of the camera, for example 00:40:8c:18:82:27.'}
      timestamp: {type: string, description: 'Time of the reading, ISO 8601 with offset.'}
      total_in: {type: integer, description: Total people counted in.}
      total_out: {type: integer, description: Total people counted out.}

operations:
  export_traffic_csv:
    summary: Download foot traffic statistics (In/Out) as CSV.
    description: 'The first line names the columns: start, end, in, out.'
    effect: read
    binding: {path: /a3dpc/api/export/csv, method: GET, reply: text}
    params:
      type: object
      x-name: TrafficExportRequest
      required: [start, end, resolution]
      properties:
        start: {$ref: '#/types/StatisticsDate'}
        end: {$ref: '#/types/StatisticsDate'}
        resolution: {$ref: '#/types/TrafficResolution'}
    result: {type: string}
    errors:
      400: {description: 'Bad Request. Validation failed; the error list gives the field and reason.', kind: invalid_argument}
    examples:
    - title: 'Example 2: current day, minute intervals'
      request:
        query: {start: today, end: now, resolution: minute}
      response:
        status: 200
        text: |-
          start,end,in,out
          2020-09-23 00:00:00,2020-09-23 00:01:00,0,0
          2020-09-23 00:01:00,2020-09-23 00:02:00,0,0
          2020-09-23 00:02:00,2020-09-23 00:03:00,0,0
          2020-09-23 00:03:00,2020-09-23 00:04:00,0,0
          2020-09-23 00:04:00,2020-09-23 00:05:00,0,0
          2020-09-23 00:05:00,2020-09-23 00:06:00,0,0
          2020-09-23 00:06:00,2020-09-23 00:07:00,0,0
          2020-09-23 00:07:00,2020-09-23 00:08:00,0,0
          2020-09-23 00:08:00,2020-09-23 00:09:00,0,0
      source: https://developer.axis.com/vapix/applications/p8815-2-3d-people-counter-api/#download-foot-traffic-statistics
    - title: 'Example 3: 2020-08-01 until today, daily intervals'
      request:
        query: {start: '20200801', end: today, resolution: day}
      response:
        status: 200
        text: |-
          start,end,in,out
          2020-08-01 00:00:00,2020-08-02 00:00:00,0,0
          2020-08-02 00:00:00,2020-08-03 00:00:00,0,0
          2020-08-03 00:00:00,2020-08-04 00:00:00,0,0
          2020-08-04 00:00:00,2020-08-05 00:00:00,0,0
          2020-08-05 00:00:00,2020-08-06 00:00:00,0,0
          2020-08-06 00:00:00,2020-08-07 00:00:00,0,0
          2020-08-07 00:00:00,2020-08-08 00:00:00,0,0
          2020-08-08 00:00:00,2020-08-09 00:00:00,0,0
          2020-08-09 00:00:00,2020-08-10 00:00:00,0,0
      source: https://developer.axis.com/vapix/applications/p8815-2-3d-people-counter-api/#download-foot-traffic-statistics
  export_traffic_json:
    summary: Download foot traffic statistics (In/Out) as JSON.
    effect: read
    binding: {path: /a3dpc/api/export/json, method: GET, reply: json}
    params:
      type: object
      x-name: TrafficExportRequest
      required: [start, end, resolution]
      properties:
        start: {$ref: '#/types/StatisticsDate'}
        end: {$ref: '#/types/StatisticsDate'}
        resolution: {$ref: '#/types/TrafficResolution'}
    result: {$ref: '#/types/TrafficStatistics'}
    errors:
      400: {description: 'Bad Request. Validation failed; the error list gives the field and reason.', kind: invalid_argument}
    examples:
    - title: 'Example 1: yesterday, hourly intervals'
      request:
        query: {start: yesterday, end: today, resolution: hour}
      response:
        status: 200
        text: |-
          {
              "data": [
                  {
                      "start": "2020-06-23 00:00:00",
                      "end": "2020-06-23 01:00:00",
                      "in": 0,
                      "out": 0
                  }
              ]
          }
      source: https://developer.axis.com/vapix/applications/p8815-2-3d-people-counter-api/#download-foot-traffic-statistics
  export_occupancy_csv:
    summary: Download occupancy statistics as CSV.
    description: 'The first line names the columns: start, end, peak.'
    effect: read
    binding: {path: /a3dpc/api/export_occupancy/csv, method: GET, reply: text}
    params:
      type: object
      x-name: OccupancyExportRequest
      required: [start, end, resolution]
      properties:
        start: {$ref: '#/types/StatisticsDate'}
        end: {$ref: '#/types/StatisticsDate'}
        resolution: {$ref: '#/types/OccupancyResolution'}
    result: {type: string}
    errors:
      400: {description: 'Bad Request. Validation failed; the error list gives the field and reason.', kind: invalid_argument}
    examples:
    - title: 'Example 2: hour intervals'
      request:
        query: {start: yesterday, end: today, resolution: hour}
      response:
        status: 200
        text: |-
          start,end,peak
          2023-01-09 00:00:00,2023-01-09 01:00:00,0
          2023-01-09 01:00:00,2023-01-09 02:00:00,0
          2023-01-09 02:00:00,2023-01-09 03:00:00,0
          2023-01-09 03:00:00,2023-01-09 04:00:00,0
          2023-01-09 04:00:00,2023-01-09 05:00:00,0
          2023-01-09 05:00:00,2023-01-09 06:00:00,0
          2023-01-09 06:00:00,2023-01-09 07:00:00,0
          2023-01-09 07:00:00,2023-01-09 08:00:00,3
          2023-01-09 08:00:00,2023-01-09 09:00:00,17
          2023-01-09 09:00:00,2023-01-09 10:00:00,21
      source: https://developer.axis.com/vapix/applications/p8815-2-3d-people-counter-api/#download-occupancy-statistics
    - title: 'Example 3: 2022-12-31 until today, daily intervals'
      request:
        query: {start: '20221231', end: today, resolution: day}
      response:
        status: 200
        text: |-
          start,end,peak
          2022-12-31 00:00:00,2023-01-01 00:00:00,1
          2023-01-01 00:00:00,2023-01-02 00:00:00,2
          2023-01-02 00:00:00,2023-01-03 00:00:00,17
          2023-01-03 00:00:00,2023-01-04 00:00:00,21
          2023-01-04 00:00:00,2023-01-05 00:00:00,26
          2023-01-05 00:00:00,2023-01-06 00:00:00,19
          2023-01-06 00:00:00,2023-01-07 00:00:00,5
          2023-01-07 00:00:00,2023-01-08 00:00:00,2
          2023-01-08 00:00:00,2023-01-09 00:00:00,1
      source: https://developer.axis.com/vapix/applications/p8815-2-3d-people-counter-api/#download-occupancy-statistics
  export_occupancy_json:
    summary: Download occupancy statistics as JSON.
    effect: read
    binding: {path: /a3dpc/api/export_occupancy/json, method: GET, reply: json}
    params:
      type: object
      x-name: OccupancyExportRequest
      required: [start, end, resolution]
      properties:
        start: {$ref: '#/types/StatisticsDate'}
        end: {$ref: '#/types/StatisticsDate'}
        resolution: {$ref: '#/types/OccupancyResolution'}
    result: {$ref: '#/types/OccupancyStatistics'}
    errors:
      400: {description: 'Bad Request. Validation failed; the error list gives the field and reason.', kind: invalid_argument}
    examples:
    - title: 'Example 1: yesterday, hourly intervals'
      request:
        query: {start: yesterday, end: today, resolution: hour}
      response:
        status: 200
        text: |-
          {
              "data": [
                  {
                      "start": "2023-01-08 00:00:00",
                      "end": "2023-01-08 01:00:00",
                      "peak": 0
                  },
                  {
                      "start": "2023-01-08 01:00:00",
                      "end": "2023-01-08 02:00:00",
                      "peak": 0
                  }
              ]
          }
      source: https://developer.axis.com/vapix/applications/p8815-2-3d-people-counter-api/#download-occupancy-statistics
  get_occupancy:
    summary: Request real-time estimated occupancy and counting statistics (primary camera and connected secondary cameras).
    effect: read
    binding: {path: /a3dpc/api/occupancy, method: GET, reply: json}
    result: {$ref: '#/types/RealTimeOccupancy'}
    examples:
    - title: Request real-time data
      request: {query: {}}
      response:
        status: 200
        text: |-
          {
              "occupancy": 15,
              "serial": "00:40:8c:18:82:27",
              "timestamp": "2020-12-03T16:28:05+01:00",
              "total_in": 100,
              "total_out": 85
          }
      source: https://developer.axis.com/vapix/applications/p8815-2-3d-people-counter-api/#request-real-time-data

