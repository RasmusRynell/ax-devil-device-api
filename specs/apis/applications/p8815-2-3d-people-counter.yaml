provenance:
  completeness: complete
  open_questions:
  - Data push field table names 'Data' and 'Sensor' as arrays and uses data[]./sensor[]. paths, but the sample shows
    plain objects; table says sensor[].timeZone while the sample uses 'timezone'. https://developer.axis.com/vapix/applications/p8815-2-3d-people-counter-api/#generic-data-push
  - Request apiVersion is '1' while responses report '1.0'; supported versions and version negotiation not documented.
  - Error code 1200 is used for three different conditions; it is not in the general error code list.
  - restartPassthroughCountdown response table describes 'data' as 'An array containing the counting data information'
    but the example is an empty object.
  - Occupancy Example 2 text says 'current day' but uses start=yesterday&end=today.
  - AXIS OS / application version requirements and access level of the GET export endpoints are not documented.
