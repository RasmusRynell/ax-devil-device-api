  sha256_md: 3b7ba4859361e2730007dc72727ba43025da64778825f5018317f1d9f0d7a8a6
  retrieved_at: '2026-10-11'

provenance:
  completeness: complete
  open_questions:
    - "The documented examples contain placeholders (r, w, h, t, resolution) and are not valid JSON; the examples here use concrete values that follow the field tables."
    - "The ACAP Name reported by applications/list.cgi is not documented (the docs only say to use list.cgi; the example for the related VMD 3 shows name=\"VMD3\"). The acap discovery name MotionGuard is inferred from the application's /local/motionguard/control.cgi path; verify on a device. The docs' additional identification by Properties.EmbeddedDevelopment.Version is not used."
    - "The visual feedback example uses 'overlayRotation' instead of overlayResolution, and the text 'OverlayResolution' with a capital O; the table name overlayResolution is used."
    - "Capabilities example uses maxNbrPresets while the table says maxNbrPresetsPerProfile; the table name is used. The table also misspells defaultActive as 'defautActive' for timeShortLivedLimit."
    - "alarmOverlayEnabled is typed int in the table but documented as true/false; modelled as boolean."
    - "configurationStatus valid values are listed as MAX_INT only; modelled as a non-negative integer."
    - "Which fields the device always returns is not stated beyond 'all properties are mandatory unless otherwise specified'; only cameras, profiles, camera id and profile uid/camera are required."
    - "The docs say a profile has exactly one include area, 'but this can change in the future'."
    - "The docs describe an event stream over RTSP; that is not a JSON-RPC method and is not modelled."
  migrated_from: v1
  curated: true
