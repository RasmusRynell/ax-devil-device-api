                  <THRESHOLD>0.701837122440338</THRESHOLD>
                  <ROI_X>96</ROI_X>
                  <ROI_Y>54</ROI_Y>
                  <ROI_W>1728</ROI_W>
                  <ROI_H>972</ROI_H>
                  <LP_X>564</LP_X>
                  <LP_Y>478</LP_Y>
                  <LP_W>220</LP_W>
                  <LP_H>32</LP_H>
                  <ROI_ID>1</ROI_ID>
                  <ROI_IDU>0</ROI_IDU>
                  <FRAMES>0</FRAMES>
                  <DIRECTION>2</DIRECTION>

                  <LP_BMP>
                      tools.cgi?action=getImage &amp; name=53/20231212161204_601572lp_MSR1669_8565355.jpg
                  </LP_BMP>

                  <ROI_BMP>
                      tools.cgi?action=getImage &amp; name=51/20231212161204_259638roi_MSR1669_8565354.jpg
                  </ROI_BMP>
                  <COUNTRY>DEU</COUNTRY>
                  <LP_LIST_MODE>1</LP_LIST_MODE>
                  <LP_DESCRIPTION>car_test_2</LP_DESCRIPTION>
                  <LP_REGION_UTF8>München</LP_REGION_UTF8>
                  <ISO3166_2_CODE />
                  <LP_TYPE>0</LP_TYPE>
                  <EXT1 />
                  <EXT2 />
                  <EXT3 />
                  <CAR_M_TYPE>CAR</CAR_M_TYPE>
                  <CAR_COLOR>BLUE</CAR_COLOR>
                  <CAR_CONF>55.8820610046387</CAR_CONF>
                  <CAR_VIEW>0</CAR_VIEW>
              </event>
              <event>
                  <TS>CAR</TS>
                  <MOD_TS>2023-12-12 16:11:58 EET</MOD_TS>
                  <END_TS>0</END_TS>
                  <CAR_ID>42627</CAR_ID>
                  <LPR>111WR6677</LPR>
                  <LPR_UTF8>111WR6677</LPR_UTF8>
                  <LPR_UNICODE>\u004d\u0036\u0036\u0037\u0037</LPR_UNICODE>
                  <RTIME>286.0</RTIME>
                  <ACTION>100</ACTION>
                  <ACT_PARAM />
                  <THRESHOLD>0.739800155162811</THRESHOLD>
                  <ROI_X>96</ROI_X>
                  <ROI_Y>54</ROI_Y>
