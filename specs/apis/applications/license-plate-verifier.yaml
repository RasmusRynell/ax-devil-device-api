  set_2n_config:
    summary: Configure the 2N integration.
    effect: write
    write: replace
    binding:
      path: /local/fflprapp/config_2n.cgi
      method: POST
      encoding: body
      content_type: application/xml
      reply: text
    params:
      type: object
      required: [config]
      properties:
        config:
          type: string
          x-in: body
          description: The <tn_config> XML document (url, user, password, enable, https, accessPoint, event_on_direction).
    positional: [config]
    examples:
    - title: Configure 2N integration in ALPV
      request:
        body: |
          <?xml version="1.0" encoding="utf-8" ?>
          <tn_config>
              <url>127.0.0.11</url>
              <user>operator</user>
              <password>YWQ=</password>
              <enable>true</enable>
              <https>false</https>
              <accessPoint>1</accessPoint>
              <event_on_direction>2</event_on_direction>
          </tn_config>
        content_type: application/xml
      response: {status: 200, text: ''}
      source: https://developer.axis.com/vapix/applications/license-plate-verifier-api/#configure-2n-integration-in-alpv
