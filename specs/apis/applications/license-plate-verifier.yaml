- url: https://developer.axis.com/vapix/applications/license-plate-verifier-api/
  sha256_md: e32ea8e2030be85ae8e336452a37ec32da858c8c11495dea50e7089aa7503728
  retrieved_at: '2026-10-11'
provenance:
  completeness: partial
  open_questions:
  - Access levels, error responses and ALPV/AXIS OS version requirements (other than 2.9.19 fields) are not documented. https://developer.axis.com/vapix/applications/license-plate-verifier-api/
  - Event names differ between the table and the topics (ALPV.ALLPlates vs ALPV.AllPlates; PlateIN/PlateOUT vs PlateIn/PlateOut).
  - 'Event search: table keys ''from''/''to'' vs query timestampfrom/timestampto; ''place desc'' key unclear; timestamps documented
    as ms but examples are µs.'
  - 'List names inconsistent: ''allow list | block list | custom list'', allow_list/block_list/custom_list, and allow/block/custom
    for api.cgi.'
  - upload.cgi 'list' is documented as '<file name>.csv' but the shell script passes the list name; HTTP method/body for upload
    not shown in the step examples.
  - http_auth_type and second_image_type values are undocumented; Genetec table describes URL as 'The 2N device URL'.
  - Set Area of Interest posts to config.cgi; whether partial configuration posts merge with existing settings is not stated.
  - direction 'angle' range '<0-360000>' unit not stated.
  - 'XML request bodies are modeled as in: json_body with a schema; clients must serialize to the documented XML element names.'
  - 'BLOCKED(raw-body): set_2n_config: POST /local/fflprapp/config_2n.cgi with an application/xml <tn_config> body.'
  - 'BLOCKED(raw-body): set_genetec_config: POST /local/fflprapp/config_gsc.cgi with an application/xml <gsc_config> body.'
  - 'BLOCKED(raw-body): set_settings: POST /local/fflprapp/config.cgi with an application/xml <configuration> body (the Set
    Area of Interest example posts partial configuration).'
  - 'BLOCKED(raw-body): set_push_config: POST /local/fflprapp/cloud.cgi (cloud2.cgi, cloud3.cgi) with an application/xml <cloud_config>
    body.'
  - 'BLOCKED(path-param): get_push_config: GET /local/fflprapp/cloud.cgi, cloud2.cgi or cloud3.cgi for the first, second and
    third push profile; returns <cloud_config> XML.'
  - 'BLOCKED(raw-body): set_heartbeat_config: POST with an application/xml body.'
  - 'BLOCKED(raw-body): set_heartbeat_data: POST with an application/json body.'
  - 'BLOCKED(raw-body): set_direction: POST with an application/json body (change direction angle).'
  - 'BLOCKED(raw-body): set_list_settings: POST /local/fflprapp/list_mgmt.cgi with an application/json body (change list settings,
    rename lists).'
  - 'BLOCKED(path-param): get_list: GET /local/fflprapp/<list name>.cgi (allow list, block list, custom list) returns <bw_list
    mode> XML.'
  - 'BLOCKED(raw-body): add_plates: POST /local/fflprapp/<list name>.cgi (allow_list, block_list, custom_list) with an application/xml
    <bw_list> body.'
  - get_settings has no field table in the docs (the sample also repeats elements), so it returns the raw XML element.
  - The event record fields (TS, MOD_TS, ACTION, ...) have no description in the docs; types and names come from the sample
    reply and the search filters.
  migrated_from: v1
  curated: true
