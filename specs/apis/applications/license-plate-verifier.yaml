      reply: xml
    params:
      type: object
      properties:
        limit:
          type: integer
          description: The example uses limit=0 to get statistics only.
    result:
      $ref: '#/types/Statistics'
    examples:
    - title: Statistics
      request:
        query:
          limit: '0'
      response:
        status: 200
        content_type: application/xml
        text: |
          <events>
              <currentTimestampUs>1702306482677809</currentTimestampUs>
              <vcount>
                  <direction>
                      <in>978</in>
                      <out>0</out>
                      <unk>22</unk>
                  </direction>
                  <list>
                      <blocklist>0</blocklist>
                      <allowlist>0</allowlist>
                      <customlist>0</customlist>
                      <nonelist>1000</nonelist>
                  </list>
                  <roi>
                      <roi1>1000</roi1>
                      <roi2>0</roi2>
                  </roi>
                  <total>1000</total>
