provenance:
  completeness: partial
  open_questions:
  - 'Occupancy endpoints use inconsistent paths: occupancy-export-json example uses /tvpc/.apioperator, export templates
    use /local/tvpc/.api, live-occupancy and occupancy-reset use /tvpc/.api. https://developer.axis.com/vapix/applications/people-counter-api/#occupancy-data'
  - occupancy-reset 'occ' parameter is undocumented beyond the '[value]' placeholder.
  - Occupancy export date parameter documented only as YYYYMMDD but the example uses date=all; required-ness of
    date/res for occupancy exports not stated.
  - live-occupancy.json, export-json and occupancy-reset response formats are not documented.
  - Template for list-cnt.json is malformed (extra closing brace); 'days' description is truncated ('an array of
    days where there exists').
  - cntpos radius description ends '... on both axes, or if the area is not curved' — the value for non-curved (presumably
    0) is missing.
  - Occupancy types table says 'Average time' while the JSON uses 'Average Time'; the meaning of the integer values
    under counter.types (64, 66, 67) is not explained.
  - Error responses, access levels and ACAP version requirements are not documented.
  - 'migration: json-untyped: export_json: JSON reply without schema; result is untyped'
  - 'migration: xml-unmapped: export_xml: no response schema in v1; result is the raw XML element'
  - 'migration: object-param: set_params.<Parameter.Name>: object-valued query parameter kept as a free-form map'
  - 'migration: object-param: set_params.p<n>/v<n>: object-valued query parameter kept as a free-form map'
  - 'migration: json-untyped: get_live_occupancy: JSON reply without schema; result is untyped'
  - 'migration: xml-unmapped: occupancy_export_xml: no response schema in v1; result is the raw XML element'
  migrated_from: v1
  curated: false
