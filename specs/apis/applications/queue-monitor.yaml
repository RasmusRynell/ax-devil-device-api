# Migrated from the v1 corpus by codegen/migrate_v1.py; not yet curated.
format: 2
id: queue-monitor
name: Queue monitor API
summary: Read live people-in-queue counts per region, export historical queue data as CSV, clear data, read/set
  application parameters and fetch logs from the Queue...
section: applications
family: cgi
status: released
python:
  module: queue_monitor
  class: QueueMonitor
docs:
- https://developer.axis.com/vapix/applications/queue-monitor-api/
access: admin
requires:
  application: Queue Monitor ACAP

binding: {path: /local/queue/.api}

types:
  LiveSumPeople:
    type: object
    description: Region fields repeat for region1..region3 in the examples.
    properties:
      serial: {type: string, description: camera serial number}
      name: {type: string, description: name of the counter}
      timestamp: {type: string, description: time in the camera in the format YYYYMMDDhhmmss}
      region1name: {type: string, description: name of region 1}
      region1people: {type: integer, description: number of people standing in region 1}
      region2name: {type: string}
      region2people: {type: integer}
      region3name: {type: string}
      region3people: {type: integer}

operations:
  get_live_sum_people:
    summary: Get real time people in queue data (number of people standing in queue at this moment).
    effect: read
    binding:
      method: GET
      query: {live-sum-people.json: ''}
      reply: json
    result: {$ref: '#/types/LiveSumPeople'}
    examples:
    - title: Get real time people in queue data (template)
      request:
        query: {}
      response:
        status: 200
        text: |-
          {
            "serial":"<camera-serial>",
            "name":"<counter-name>",
            "timestamp":"<timestamp>",
            "region1name":"<name1>",
            "region1people":<people1>,
            "region2name":"<name2>",
            "region2people":<people2>,
            "region3name":"<name3>",
            "region3people":<people3>
          }
      source: https://developer.axis.com/vapix/applications/queue-monitor-api/#get-real-time-people-in-queue-data
  export_csv_minutes:
    summary: Request CSV minute data — minutes per region with High/Mid/Low queue.
    description: Returns plain text comma-separated values. The first line is a comma-separated header describing
      each column. Each integer value states the number of minutes for which there has been a certain amount of
      queue (High/Mid/Low) for a certain region.
    effect: read
    binding:
      method: GET
      query: {export-csv-minutes: ''}
      reply: text
    params:
      type: object
      properties:
        date:
          type: string
          pattern: ^(all|[0-9]{8}(-[0-9]{8})?|[0-9]{8}(,[0-9]{8})*)$
          default: all
          description: a date YYYYMMDD; a date interval YYYYMMDD-YYYYMMDD; comma separated dates YYYYMMDD,[..],YYYYMMDD;
            or all (default) for all available data.
        res:
          type: string
          enum: [15m, 1h, 24h]
          default: 15m
          description: 'Bin resolution. Note: the example uses res=5h, which is not in the documented list. Values:
            15m: data in 15 minute bins (default); 1h: data in 1 hour bins; 24h: data in 1 day bins'
    result: {type: string}
    examples:
    - title: Historical minutes of queue data for 1st and 3rd May 2017 with a 5 hour resolution
      request:
        query: {date: '20170501,20170503', res: 5h}
      response:
        status: 200
        text: |-
          Interval start,Interval stop,Camera serial number,Name,Region1 High,Region1 Mid,Region1 Low,Region2 High,Region2 Mid,Region2 Low,Region3 High,Region3 Mid,Region3 Low
          2017-05-01 00:00:00,2017-05-01 05:00:00,00XXXXXXXXXX,Camera1,0,0,300,0,0,300,0,0,300
          2017-05-01 05:00:00,2017-05-01 10:00:00,00XXXXXXXXXX,Camera1,0,0,300,0,0,300,0,20,280
          2017-05-01 10:00:00,2017-05-01 15:00:00,00XXXXXXXXXX,Camera1,0,0,300,0,0,300,0,174,126
          2017-05-01 15:00:00,2017-05-01 20:00:00,00XXXXXXXXXX,Camera1,0,0,300,0,0,300,0,109,191
          2017-05-01 20:00:00,2017-05-02 01:00:00,00XXXXXXXXXX,Camera1,0,0,300,0,0,300,0,0,300
          2017-05-03 00:00:00,2017-05-03 05:00:00,00XXXXXXXXXX,Camera1,0,0,300,0,0,300,0,0,300
          2017-05-03 05:00:00,2017-05-03 10:00:00,00XXXXXXXXXX,Camera1,0,34,266,0,17,283,8,67,225
      source: https://developer.axis.com/vapix/applications/queue-monitor-api/#request-csv-minute-data
  export_csv_people:
    summary: Request CSV people data — average number of people per region.
    description: Returns plain text comma-separated values. The first line is a comma separated header describing
      each column. Each integer value states the average number of people within a certain region of interest.
    effect: read
    binding:
      method: GET
      query: {export-csv-people: ''}
      reply: text
    params:
      type: object
      properties:
        date:
          type: string
          pattern: ^(all|[0-9]{8}(-[0-9]{8})?|[0-9]{8}(,[0-9]{8})*)$
          default: all
          description: a date YYYYMMDD; a date interval YYYYMMDD-YYYYMMDD; comma separated dates YYYYMMDD,[..],YYYYMMDD;
            or all (default) for all available data.
        res:
          type: string
          enum: [1m, 15m, 1h, 24h]
          default: 15m
          description: 'Bin resolution. Note: the example uses res=120m, which is not in the documented list. Values:
            1m: data in 1 minute bins; 15m: data in 15 minute bins (default); 1h: data in 1 hour bins; 24h: data
            in 1 day bins'
    result: {type: string}
    examples:
    - title: Historical people in queue data with a 120 minute resolution
      request:
        query: {date: '20170428,20170503', res: 120m}
      response:
        status: 200
        text: |-
          Interval start,Interval stop,Camera serial number,Name,People in Region1,People in Region2,People in Region3
          2017-05-03 00:00:00,2017-05-03 02:00:00,00XXXXXXXXXX,Camera2,0,0,2
          2017-05-03 02:00:00,2017-05-03 04:00:00,00XXXXXXXXXX,Camera2,1,1,1
          2017-05-03 04:00:00,2017-05-03 06:00:00,00XXXXXXXXXX,Camera2,1,0,1
          2017-05-03 06:00:00,2017-05-03 08:00:00,00XXXXXXXXXX,Camera2,1,0,2
          2017-05-03 08:00:00,2017-05-03 10:00:00,00XXXXXXXXXX,Camera2,1,0,1
      source: https://developer.axis.com/vapix/applications/queue-monitor-api/#request-csv-people-data
  clear_data:
    summary: Clear local queue data.
    effect: write
    write: delete
    binding:
      path: /local/queue/.apioperator
      method: GET
      query: {clear-data: ''}
      reply: text_ok
    examples:
    - title: Clear local queue data
      request:
        query: {}
      response: {status: 200, text: OK}
      source: https://developer.axis.com/vapix/applications/queue-monitor-api/#clear-local-queue-data
  get_params:
    summary: List application parameters.
    effect: read
    binding:
      method: GET
      query: {params.json: ''}
      reply: json
    result: {type: object, additionalProperties: true}
  set_params:
    summary: Set application related parameters.
    description: The post format specifies pairs of parameter names and values, e.g. &p1=Counter.Enabled&v1=1&p2=WebReportUpload.Enabled&v2=1.
    effect: write
    write: patch
    binding:
      path: /local/queue/.apioperator
      method: POST
      query: {setparams: ''}
      reply: text_ok
    params:
      type: object
      required: [p<n>, v<n>]
      properties:
        p<n>:
          type: object
          x-python-name: params
          description: Parameter name for pair n (n = 1, 2,...), e.g.
        v<n>: {type: string, x-python-name: values, description: 'Value for pair n, e.g. v1=1.'}
  show_logs:
    summary: Show the system log.
    effect: read
    binding:
      path: /local/queue/.apioperator
      method: GET
      query: {show-logs: ''}
      reply: text
    result: {type: string}
  generate_logs:
    summary: Generate a log archive (tar.gz).
    effect: read
    binding:
      path: /local/queue/.apioperator
      method: GET
      query: {generate-logs: ''}
      reply:
        binary: {media_types: [application/gzip]}
    result: {type: string, format: binary}

