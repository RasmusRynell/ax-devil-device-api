provenance:
  completeness: partial
  open_questions:
  - Examples use res=5h and res=120m, which are not in the documented res value lists (15m/1h/24h and 1m/15m/1h/24h).
    https://developer.axis.com/vapix/applications/queue-monitor-api/#common-examples
  - Example title says '4th of April' but the request uses date=20170428,20170503 and the output only shows 2017-05-03.
  - 'setparams: the curl example carries no p/v pairs and no body; unclear whether pairs are query or form parameters.'
  - params.json response structure, error responses, access levels and AXIS OS/ACAP version requirements are not
    documented.
  - Return value table only lists region1 fields; number of regions not stated (examples show 3).
  - 'migration: object-param: set_params.p<n>: object-valued query parameter kept as a free-form map'
  migrated_from: v1
  curated: false
