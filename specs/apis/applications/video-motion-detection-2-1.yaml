format: 2
id: video-motion-detection-2-1
name: Video motion detection 2.1 API
summary: Read the configuration of the AXIS Video Motion Detection 2.1 ACAP (detection area and optional exclude area) via
  vaconfig.cgi.
section: applications
family: cgi
status: deprecated
python:
  module: video_motion_detection_2_1
  class: VideoMotionDetection21
docs:
- https://developer.axis.com/vapix/applications/video-motion-detection-2.1-api/
access: admin
discovery:
- acap:
    name: VideoMotionDetection
requires:
  firmware: '5.40'
  application: AXIS Video Motion Detection 2.1 (ACAP, package name VideoMotionDetection)
binding:
  path: /axis-cgi/vaconfig.cgi
errors:
  bad_request:
    description: Bad request. The request URL was not formatted correctly.
    kind: invalid_argument
  no_such_application:
    description: There is no application with the given name.
    kind: not_found
  internal:
    description: The action could not be performed, for example because the application failed to restart after a configuration
      modification.
    kind: internal
types:
  Point:
    type: object
    required:
    - x
    - y
    properties:
      x:
        type: number
        description: X coordinate, -1.0 to 1.0. The top right corner of the camera view is x=1.0, y=1.0.
      y:
        type: number
        description: Y coordinate, -1.0 to 1.0.
  IntValue:
    type: object
    required:
    - value
    properties:
      value:
        type: integer
  NamedObjectData:
    type: object
    properties:
      knownNameType:
        type: string
        description: Type of the data, for example geometry.polygon or core.int. The docs' attribute table spells it knownTypeName.
      polygon:
        type: array
        items:
          $ref: '#/types/Point'
        x-xml:
          path: polygon/point
        description: Corner points of a polygon object; empty for other object types.
      int:
        $ref: '#/types/IntValue'
        x-python-name: integer
        description: Integer data of a core.int object, such as a filter value or a view area number.
  NamedObject:
    type: object
    required:
    - name
    properties:
      name:
        type: string
        description: Name of the object. Rule parameters refer to it by this name.
      data:
        $ref: '#/types/NamedObjectData'
  RuleParameter:
    type: object
    required:
    - name
    - value
    properties:
      name:
        type: string
        description: Name of a parameter used by the rule function.
      value:
        type: string
        description: Value of the parameter; the name of the named object to use.
  Rule:
    type: object
    required:
    - name
    properties:
      name:
        type: string
        description: Name of the rule.
      function:
        type: string
        description: Name of the rule function, defined in a script file.
      parameter:
        type: array
        items:
          $ref: '#/types/RuleParameter'
        x-xml:
          path: parameter
        x-python-name: parameters
  Script:
    type: object
    properties:
      name:
        type: string
        x-xml: text
        description: Name of the script file.
      encryption:
        type: string
        enum:
        - '0'
        - '1'
        description: 1 = the script is encrypted, 0 = not encrypted.
  EventAttribute:
    type: object
    properties:
      key:
        type: string
      nicename:
        type: string
      tag:
        type: string
        enum:
        - source
        - data
        - property-state
        description: source = source info of the event metadata, data = data info, property-state = stateful event (0 or 1).
      value:
        type: string
  Event:
    type: object
    required:
    - name
    properties:
      name:
        type: string
        description: Name of an event emitted by the application.
      nicename:
        type: string
      attr:
        type: array
        items:
          $ref: '#/types/EventAttribute'
        x-xml:
          path: attr
        x-python-name: attributes
  MoteOption:
    type: object
    required:
    - name
    - value
    properties:
      name:
        type: string
        description: 'Option name: boundingBox, polygon or velocity.'
      value:
        type: string
        enum:
        - 'true'
        - 'false'
  NameValue:
    type: object
    properties:
      name:
        type: string
      value:
        type: string
  Library:
    type: object
    properties:
      name:
        type: string
  RuleEngine:
    type: object
    properties:
      status:
        type: string
        enum:
        - enabled
        - disabled
        description: Whether the AXIS OS parses this configuration (AXIS OS 5.61 and later).
      namedObjects:
        type: array
        items:
          $ref: '#/types/NamedObject'
        x-xml:
          path: namedObjects/namedObject
        description: All named objects used by the application.
      rules:
        type: array
        items:
          $ref: '#/types/Rule'
        x-xml:
          path: rules/rule
        description: All rules used by the application.
      scripts:
        type: array
        items:
          $ref: '#/types/Script'
        x-xml:
          path: scripts/script
      events:
        type: array
        items:
          $ref: '#/types/Event'
        x-xml:
          path: events/event
      analyticSources:
        type: array
        items:
          $ref: '#/types/NameValue'
        x-xml:
          path: analyticSources/analyticSource
      moteConfig:
        type: array
        items:
          $ref: '#/types/MoteOption'
        x-xml:
          path: moteConfig/option
        description: MOTE configuration options.
      libraries:
        type: array
        items:
          $ref: '#/types/Library'
        x-xml:
          path: libraries/library
  Application:
    type: object
    required:
    - name
    properties:
      name:
        type: string
        description: Name of the application.
      nicename:
        type: string
      ruleEngine:
        $ref: '#/types/RuleEngine'
  ApplicationConfig:
    type: object
    x-xml:
      root: config
    properties:
      version:
        type: string
        description: Version of the configuration format.
      application:
        $ref: '#/types/Application'
operations:
  get_configuration:
    summary: Retrieve the application configuration.
    description: Deprecated. The area of interest is the named object Detection Area; an optional Exclude Area is referenced
      by the Exclude rule parameter.
    effect: read
    binding:
      method: GET
      query:
        action: get
        name: VideoMotionDetection
      reply:
        xml:
          status_error:
            attribute: result
            value: error
    result:
      $ref: '#/types/ApplicationConfig'
    examples:
    - title: Retrieve the application configuration
      request:
        query:
          action: get
          name: VideoMotionDetection
      response:
        status: 200
        text: |
          <reply result="ok">
              <config version="1.0">
                  <application name="VideoMotionDetection">
                      <ruleEngine>
                          <namedObjects>
                              <namedObject name="Detection Area">
                                  <data knownNameType="geometry.polygon">
                                      <polygon>
                                          <point x="0.60" y="0.60" />
                                          <point x="0.60" y="-0.60" />
                                          <point x="-0.60" y="-0.60" />
                                          <point x="-0.60" y="0.60" />
                                      </polygon>
                                  </data>
                              </namedObject>
                          </namedObjects>
                          <rules>
                              <rule name="detection_0" function="monitor_area">
                                  <parameter name="Include" value="Detection Area" />
                              </rule>
                          </rules>
                          <scripts>
                              <script encryption="1">detection.lua</script>
                          </scripts>
                          <events>
                              <event name="motion">
                                  <attr key="areaid" nicename="Area ID" tag="source" value="0" />
                                  <attr key="areapolygon" nicename="Polygon info" tag="data" />
                                  <attr key="active" nicename="Motion detected" tag="property-state" />
                              </event>
                          </events>
                          <moteConfig>
                              <option name="boundingBox" value="false" />
                              <option name="polygon" value="true" />
                              <option name="velocity" value="true" />
                          </moteConfig>
                      </ruleEngine>
                  </application>
              </config>
          </reply>
      source: https://developer.axis.com/vapix/applications/video-motion-detection-2.1-api/#getting-started
sources:
