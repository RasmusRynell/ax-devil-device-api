provenance:
  completeness: partial
  open_questions:
  - Table uses attribute 'knownTypeName' while XML uses 'knownNameType'. https://developer.axis.com/vapix/applications/video-motion-detection-2.1-api/#application-configuration
  - Start application example uses GET while Application API documents POST.
  - RTSP eventtopic uses 'onvif:RuleEngine/axis:VideoMotionDetection//motion' while the declared topic is tns1:RuleEngine/tnsaxis:VideoMotionDetection/tnsaxis:motion.
  - 'BLOCKED(raw-body): modify_configuration: POST /axis-cgi/vaconfig.cgi sends ''action=modify&name=VideoMotionDetection'',
    a newline and the raw configuration XML as one form-encoded body; the XML is not a key=value pair.'
  - 'BLOCKED(rtsp-url): get_event_stream: the motion event is delivered in the RTSP stream rtsp://<servername>/axis-media/media.amp?event=on&video=0&eventtopic=onvif:RuleEngine/axis:VideoMotionDetection//motion.'
  migrated_from: v1
  curated: true
