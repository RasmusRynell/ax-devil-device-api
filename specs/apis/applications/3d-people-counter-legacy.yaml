      serial: {type: string, description: The Mac address for the camera.}
      timestamp: {type: string, description: Time in the camera in the format YYYYMMDDhhmmss.}
  Fps:
    type: object
    properties:
      fps: {type: number, description: real time fps}
      fps_100: {type: number, description: average FPS for the last 100 frames}
      fps_1000: {type: number, description: average FPS for the last 1000 frames}
      fps_5: {type: number, description: average FPS for the last 5 frames}
      fps_50: {type: number, description: average FPS for the last 50 frames}
      frames: {type: integer, description: frame counter}

