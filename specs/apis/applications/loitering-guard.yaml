  sha256_md: 480aa221cfd9f58367e9df28936d3fbf42f3265a27dcaa38ec15a77e77733b75
  retrieved_at: '2026-10-11'

provenance:
  completeness: complete
  open_questions:
    - "The documented examples contain placeholders (r, w, h, resolution) and are not valid JSON; the examples here use concrete values that follow the field tables."
    - "The ACAP Name reported by applications/list.cgi is not documented (the docs only say to use list.cgi; the example for the related VMD 3 shows name=\"VMD3\"). The acap discovery name LoiteringGuard is inferred from the application's /local/loiteringguard/control.cgi path; verify on a device. The docs' additional identification by Properties.EmbeddedDevelopment.Version is not used."
    - "Capabilities example uses maxNbrPresets while the table says maxNbrPresetsPerProfile; the table name is used."
    - "alarmOverlayEnabled is typed int in the table but documented as true/false; modelled as boolean."
    - "configurationStatus valid values are listed as INT_MAX only; modelled as a non-negative integer."
    - "Which fields the device always returns is not stated beyond 'all properties are mandatory unless otherwise specified'; only cameras, profiles, camera id and profile uid/camera are required."
    - "The docs' 2002 text for sendAlarmEvent is a copy of the setConfiguration text; a missing profile uid probably returns it."
    - "RTSP event URLs use '/axismedia/media.amp' (missing hyphen) and topic prefix 'tnsaxis:' (docs typos)."
    - "The docs describe an event stream over RTSP; that is not a JSON-RPC method and is not modelled."
  migrated_from: v1
  curated: true
