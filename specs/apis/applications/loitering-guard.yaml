  - 'Example configuration trigger is malformed (''"conditions"['' and ''{"type": "group": ...''); capabilities
    example misses a comma after context.'
  - Event example namespace typo 'http://www.onvig.org/ver10/schema'.
  - configurationStatus valid values listed as 'INT_MAX' only.
  - Loitering area trigger 'data' has no description in the table.
  - Capabilities 'maxNbrPresets' vs table 'maxNbrPresetsPerProfile'; alarmOverlayEnabled typed 'int' but boolean.
  - Description mentions short-lived filter for 'anywhere' preset profiles but no timeShortLivedLimit filter is
    documented for Loitering Guard.
  - 'migration: skipped-op: get_event_stream (rtsp_request) is not a JSON-RPC method; skipped'
