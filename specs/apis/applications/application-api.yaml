provenance:
  completeness: complete
  open_questions:
  - 'license.cgi uploadlicensekey: the page shows only query params (action, package); how the license key file
    is sent (multipart field name) is not documented. https://developer.axis.com/vapix/applications/application-api/#manage-license-keys'
  - config.cgi value param is marked Optional in the table though required for action=set. https://developer.axis.com/vapix/applications/application-api/#configure-applications
  - list.cgi example XML has a stray '>' after ValidationResult, putting SignatureStatus outside the tag; attribute
    table says SignatureStatus while XSD defines SignedStatus (plus VendorHomePage, LicenseName not in table). https://developer.axis.com/vapix/applications/application-api/#list-installed-applications
  - Attribute table lists 'CompatibleOsVersions/@VersionRange' and 'VersionRange/@Min' as attributes, but example/XSD
    use child elements.
  - info.cgi has no XSD and no error documentation; Upload-application 'Version history' (2024-05-03) mentions new
    error codes without saying which.
  - The intro's 'Identification' gives no AXIS OS minimum for the API as a whole.
  - 'migration: op-skipped: upload_application: request body of type multipart/form-data is not supported by the
    cgi binding'
  - 'migration: reply-ok: start_application: notes mention OK; reply read as plain text (check)'
  - 'migration: reply-ok: stop_application: notes mention OK; reply read as plain text (check)'
  - 'migration: reply-ok: restart_application: notes mention OK; reply read as plain text (check)'
  - 'migration: reply-ok: remove_application: notes mention OK; reply read as plain text (check)'
  - 'migration: xml-partial: get_application_config: not found in the sample reply (left as attributes of the mapped
    element): error'
  - 'migration: xml-partial: set_application_config: not found in the sample reply (left as attributes of the mapped
