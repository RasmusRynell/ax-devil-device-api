# Migrated from the v1 corpus by codegen/migrate_v1.py; not yet curated.
format: 2
id: application-api
name: Application API
summary: Upload, control (start/stop/restart/remove), configure and list ACAP applications and manage their license
  keys.
section: applications
family: cgi
status: released
python:
  module: application_api
  class: Application
docs:
- https://developer.axis.com/vapix/applications/application-api/
access: admin

binding: {path: /axis-cgi/applications/control.cgi}

types:
  ConfigReply:
    type: object
    description: XML <reply result="ok|error"> with <param name value/> or <error type message/>.
    properties:
      result: {type: string, enum: [ok, error]}
      param:
        type: object
        x-name: ConfigReplyParam
        properties:
          name: {type: string}
          value: {type: string}
      error:
        type: object
        x-name: ConfigReplyError
        properties:
          type: {type: string}
          message: {type: string}
  GetInfoResult:
    type: object
    properties:
      result: {type: string}
      supportedSdks:
        type: array
        items: {type: string}
        description: SDKs whose applications are able to run on the device (<sdk> elements), e.g. acap3, acap4-cv,
          acap4-native.

operations:
  start_application:
    summary: Start the application.
    effect: action
    binding:
      method: POST
      query: {action: start}
      reply: text
    params:
      type: object
      required: [package]
      properties:
        package:
          type: string
          description: The application package to perform the action on (<package name>).
        returnpage:
          type: string
          description: The web page to return to after performing the action (<path to return page>).
    errors:
      1:
        description: Invalid application package. The package is not an Embedded Axis Package or it contains an
          invalid manifest.
        kind: invalid_argument
      4:
        description: Application not found. The specified application package could not be found.
        kind: not_found
      6: {description: The application is already running.}
      7: {description: Application not running. The application must be running to perform the action.}
      8:
        description: Application is in a failure state. The application must be stopped before it can start again.
      9:
        description: Too many applications are running. The application cannot be started. This limitation was removed
          in AXIS OS 12.6.
      10:
        description: Unspecified error. See the system log for more information.
        kind: invalid_argument
      15:
        description: Operation timed out. The outcome of the operation could not be determined. Check logs for more
          information.
        kind: invalid_argument
  stop_application:
    summary: Stop the application.
    effect: action
    binding:
      method: POST
      query: {action: stop}
      reply: text
    params:
      type: object
      required: [package]
      properties:
        package:
          type: string
          description: The application package to perform the action on (<package name>).
        returnpage:
          type: string
          description: The web page to return to after performing the action (<path to return page>).
    errors:
      1:
        description: Invalid application package. The package is not an Embedded Axis Package or it contains an
          invalid manifest.
        kind: invalid_argument
      4:
        description: Application not found. The specified application package could not be found.
        kind: not_found
      6: {description: The application is already running.}
      7: {description: Application not running. The application must be running to perform the action.}
      8:
        description: Application is in a failure state. The application must be stopped before it can start again.
      9:
        description: Too many applications are running. The application cannot be started. This limitation was removed
          in AXIS OS 12.6.
      10:
        description: Unspecified error. See the system log for more information.
        kind: invalid_argument
      15:
        description: Operation timed out. The outcome of the operation could not be determined. Check logs for more
          information.
        kind: invalid_argument
  restart_application:
    summary: Restart the application.
    effect: action
    binding:
      method: POST
      query: {action: restart}
      reply: text
    params:
      type: object
      required: [package]
      properties:
        package:
          type: string
          description: The application package to perform the action on (<package name>).
        returnpage:
          type: string
          description: The web page to return to after performing the action (<path to return page>).
    errors:
      1:
        description: Invalid application package. The package is not an Embedded Axis Package or it contains an
          invalid manifest.
        kind: invalid_argument
      4:
        description: Application not found. The specified application package could not be found.
        kind: not_found
      6: {description: The application is already running.}
      7: {description: Application not running. The application must be running to perform the action.}
      8:
        description: Application is in a failure state. The application must be stopped before it can start again.
      9:
        description: Too many applications are running. The application cannot be started. This limitation was removed
          in AXIS OS 12.6.
      10:
        description: Unspecified error. See the system log for more information.
        kind: invalid_argument
      15:
        description: Operation timed out. The outcome of the operation could not be determined. Check logs for more
          information.
        kind: invalid_argument
  remove_application:
    summary: Remove the application and its data.
    effect: write
    write: delete
    binding:
      method: POST
      query: {action: remove}
      reply: text
    params:
      type: object
      required: [package]
      properties:
        package:
          type: string
          description: The application package to perform the action on (<package name>).
        returnpage:
          type: string
          description: The web page to return to after performing the action (<path to return page>).
    errors:
      1:
        description: Invalid application package. The package is not an Embedded Axis Package or it contains an
