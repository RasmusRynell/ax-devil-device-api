# Migrated from the v1 corpus by codegen/migrate_v1.py; not yet curated.
format: 2
id: axis-object-analytics
name: AXIS Object Analytics API
summary: Configure object-detection scenarios (motion, fence, crossline counting, occupancy in area) of the AXIS
  Object Analytics (AOA) ACAP via a JSON-RPC style CGI.
section: applications
family: jsonrpc
status: released
python:
  module: axis_object_analytics
  class: AxisObjectAnalytics
docs:
- https://developer.axis.com/vapix/applications/axis-object-analytics-api/
access: operator
requires:
  application: AXIS Object Analytics

binding:
  path: /local/objectanalytics/control.cgi
  major: 1
  versions: ['1.2']
  negotiation:
    get_supported_versions: {key: apiVersions}
  params_placement: params

errors:
  1000: {description: An error occurred inside the application.}
  2000: {description: The requested version of the application is not supported., kind: unsupported}
  2002: {description: Incoherent configuration (such as mismatched ID).}
  2003: {description: A mandatory parameter is missing., kind: invalid_argument}
  2004: {description: Invalid parameter., kind: invalid_argument}
  2005: {description: The requested CGI method is not supported., kind: unsupported}

types:
  Point:
    type: array
    items: {type: number}
    description: '[x, y] in ONVIF coordinates. (minItems=2, maxItems=2)'
  Device:
    type: object
    required: [id, type, rotation]
    properties:
      id:
        type: integer
        description: The device id that should correspond to the id in data.devices in getConfigurationCapabilities.
      type: {type: string, enum: [camera], description: The device type (can only be camera).}
      rotation:
        type: integer
        enum: [0, 90, 180, 270]
        description: The camera rotation, measured in degrees.
      isActive:
        type: boolean
        default: true
        description: Optional. True if omitted. Excludes the device from being used if set to false; scenarios,
          perspectives or metadata overlays referring to it are ignored.
  MetadataOverlay:
    type: object
    required: [id]
    properties:
      id:
        type: integer
        minimum: 1
        description: The metadata overlay ID in the range [1... n]. Corresponds to the device ID.
      drawOnAllResolutions:
        type: boolean
        description: Whether the overlay should be drawn on all available resolutions. Not mandatory if resolutions
          is specified. (How-to example spells it drawnOnAllResolutions.)
      resolutions:
        type: array
        items: {type: string, pattern: '^[0-9]+x[0-9]+$'}
        description: Supported resolutions <width>x<height>. Should be empty or not specified if drawOnAllResolutions
          is true.
  Perspective:
    type: object
    required: [id, bars]
    properties:
      id: {type: integer, description: A unique ID identifying the perspective.}
      bars:
        type: array
        items:
          type: object
          x-name: PerspectiveBarsItem
          properties:
            height:
              type: integer
              description: Virtual height (in centimeters) of an object appearing at the same location and perceived
                height as the bar.
            points:
              type: array
              items: {$ref: '#/types/Point'}
              description: Start (pos 0, touches ground-plane) and end (pos 1) points in ONVIF coordinates. (minItems=2,
                maxItems=2)
        description: Bars contributing to the perspective calculation, limited by getConfigurationCapabilities.
  Trigger:
    oneOf:
    - type: object
      properties:
        type: {const: includeArea}
        vertices:
          type: array
          items: {$ref: '#/types/Point'}
          description: A list of vertices that forms the include area polygon.
    - type: object
      properties:
        type: {const: fence}
        alarmDirection:
          type: string
          enum: [leftToRight, rightToLeft]
          description: Direction in which the trigger activates the alarm for a crossing object (valid values from
            getConfigurationCapabilities).
        vertices:
          type: array
          items: {$ref: '#/types/Point'}
          description: Polyline.
    - type: object
      properties:
        type: {const: countingLine}
        countingDirection:
          type: string
          enum: [leftToRight, rightToLeft]
          description: Direction in which a crossing object is counted.
        vertices:
          type: array
          items: {$ref: '#/types/Point'}
    description: Scenario trigger; content depends on type. At least one trigger is needed.
  Filter:
    oneOf:
    - type: object
      properties:
        type: {const: sizePercentage}
        width: {type: integer, description: Horizontal upper limit (ONVIF coordinates / percent of view).}
        height: {type: integer, description: Vertical upper limit.}
    - type: object
      description: Scenario must point to a valid perspective.
      properties:
        type: {const: sizePerspective}
        width: {type: integer, description: Horizontal upper limit in centimeters.}
        height: {type: integer, description: Vertical upper limit in centimeters.}
    - type: object
      properties:
        type: {const: timeShortLivedLimit}
        time:
          type: number
          description: Waiting time in seconds until a detected object raises an alarm.
    - type: object
      properties:
        type: {const: distanceSwayingObject}
        distance:
          type: integer
          description: Distance an object may travel before raising an alarm, percent of the image.
    - type: object
      description: Ground speed range (m/s) where moving objects won't raise an alarm. Only with a secondary radar
        device. Several instances allowed.
      properties:
        type: {const: speed}
        minSpeed: {type: number}
        maxSpeed: {type: number}
    - type: object
      description: Areas where alarms can't be triggered; several allowed.
      properties:
        type: {const: excludeArea}
        vertices:
          type: array
          items: {$ref: '#/types/Point'}
    description: Scenario filter (optional rules excluding objects); content depends on type. Only one of sizePercentage/sizePerspective
      may be used.
  ObjectClassification:
    type: object
    required: [type]
    properties:
      type: {type: string, description: Identifies the object type.}
      subTypes:
        type: array
        items: {$ref: '#/types/ObjectClassification'}
        description: Optional list of sub classifiers (two-level depth currently supported; only if the camera supports
          subtypes).
  Scenario:
    type: object
    required: [id, name, type, devices, triggers]
    properties:
      id: {type: integer, description: A unique scenario ID.}
      name: {type: string, description: A user friendly scenario name.}
      type: {type: string, enum: [motion, fence, crosslinecounting, occupancyInArea]}
      metadataOverlay:
        type: integer
        description: Optional. Must point to a valid id in the metadataOverlay array; omitting disables overlay.
      alarmRate:
        type: string
        description: Optional. Valid rates in getConfigurationCapabilities.data.scenarios.alarmRates.
      devices:
        type: array
        items:
          type: object
          x-name: ScenarioDevicesItem
          properties:
            id: {type: integer, description: Device ID defined in the root devices list.}
      triggers:
        type: array
        items: {$ref: '#/types/Trigger'}
        description: minItems=1
      filters:
        type: array
        items: {$ref: '#/types/Filter'}
      objectClassifications:
        type: array
        items: {$ref: '#/types/ObjectClassification'}
        description: Empty array = alarm on any detected motion.
      perspectives:
        type: array
        items: {type: integer}
        description: Perspective IDs (from data.perspectives); mandatory if a perspective filter is configured.
      presets:
        type: array
        items: {type: integer}
        description: 'PTZ presets tracked: -2 always (except when moving), -1 all presets, 1 home, 2... specific
          presets. Not valid on non-PTZ devices.'
      accumulatedCounts:
        type: object
        x-name: ScenarioAccumulatedCounts
        description: crosslinecounting only.
        properties:
          timedResetEnabled: {type: boolean, description: Timed reset (at midnight) of accumulated counts enabled.}
      passthroughConfiguration:
        type: object
        x-name: ScenarioPassthroughConfiguration
        description: crosslinecounting only.
        properties:
          enabled: {type: boolean}
          period: {type: integer, description: Trigger an event for every <period> count.}
      thresholdConfiguration:
        type: object
        x-name: ScenarioThresholdConfiguration
        description: occupancyInArea only.
        properties:
          enabled: {type: boolean}
          triggerDelay:
            type: integer
            description: Seconds to wait after threshold reached before the alarm is triggered.
          thresholds:
            type: array
            items:
              type: object
              x-name: ScenarioThresholdConfigurationThresholdsItem
              properties:
                level: {type: integer, description: The number of threshold objects.}
                type: {type: string, enum: [moreThan, lessThan]}
  Configuration:
    type: object
    properties:
      devices:
        type: array
        items: {$ref: '#/types/Device'}
      metadataOverlay:
        type: array
        items: {$ref: '#/types/MetadataOverlay'}
        description: Size limited by capabilities metadataOverlay.min/maxNbrActiveCameras.
      perspectives:
        type: array
        items: {$ref: '#/types/Perspective'}
      scenarios:
        type: array
        items: {$ref: '#/types/Scenario'}
  AreaCapability:
    type: object
    properties:
      type: {type: string}
      minPosX: {type: number}
      maxPosX: {type: number}
      minPosY: {type: number}
      maxPosY: {type: number}
      minNbrVertices: {type: integer}
      maxNbrVertices: {type: integer}
      minNbrInstances: {type: integer}
      maxNbrInstances: {type: integer}
      defaultInstance:
        type: array
        items: {$ref: '#/types/Point'}
      validAlarmDirections:
        type: array
        items: {type: string}
        description: fence only
      defaultAlarmDirection: {type: string, description: fence only}
      validCountingDirections:
        type: array
        items: {type: string}
        description: countingLine only
      defaultCountingDirection: {type: string, description: countingLine only}
  ConfigurationCapabilities:
    type: object
    properties:
      devices:
        type: array
        items:
          type: object
          x-name: ConfigurationCapabilitiesDevicesItem
          properties:
            id: {type: integer}
            type: {type: string}
            imageIndex: {type: integer, description: The image source index.}
            name: {type: string}
            rotation: {type: integer, enum: [0, 90, 180, 270]}
            resolutions:
              type: array
              items: {type: string}
            tags:
              type: array
              items: {type: string, enum: [primary, secondary, fisheye]}
      filters:
        type: array
        items:
          type: object
          x-name: ConfigurationCapabilitiesFiltersItem
          properties:
            type: {type: string}
          additionalProperties: true
        description: 'Supported filters with limits: sizePercentage/sizePerspective {minWidth,maxWidth,minHeight,maxHeight,defaultWidth,defaultHeight}
          (percent / cm); timeShortLivedLimit (see open_questions); distanceSwayingObject...'
      metadataOverlay:
        type: object
        x-name: ConfigurationCapabilitiesMetadataOverlay
        properties:
          minNbrActiveCameras: {type: integer, description: 'If 0 cameras referenced, overlay disabled.'}
          maxNbrActiveCameras: {type: integer, description: 'If 0, feature not supported.'}
          cameras:
            type: array
            items:
              type: object
              x-name: ConfigurationCapabilitiesMetadataOverlayCamerasItem
              properties:
                id: {type: integer, description: 'Camera value used with media.amp, starting at 1.'}
                canDrawInSpecifiedResolutions: {type: boolean}
                resolutions:
                  type: array
                  items: {type: string}
      objectClassifications:
        type: array
        items: {$ref: '#/types/ObjectClassification'}
      perspective:
        type: object
        x-name: ConfigurationCapabilitiesPerspective
        properties:
          minNbrBars: {type: integer}
          maxNbrBars: {type: integer}
          minNbrPerspectivesPerScenario: {type: integer}
          maxNbrPerspectivesPerScenario: {type: integer}
          minHeight: {type: integer}
          maxHeight: {type: integer}
          defaultHeight: {type: integer}
          minNbrPerspectives: {type: integer}
          maxNbrPerspectives: {type: integer}
      scenarios:
        type: object
        x-name: ConfigurationCapabilitiesScenarios
        properties:
          minNbrScenariosPerCamera: {type: integer}
          maxNbrScenariosPerCamera: {type: integer}
          minNbrActiveDevices: {type: integer}
          maxNbrActiveDevices: {type: integer}
          minNbrDevices: {type: integer}
          maxNbrDevices: {type: integer}
          minLengthName: {type: integer}
          maxLengthName: {type: integer}
          defaultScenario: {type: string}
          defaultDeviceId: {type: string}
          supportedScenarios:
            type: array
            items: {type: string}
          alarmRates:
            type: array
            items: {type: string}
          defaultAlarmRate: {type: string}
          accumulatedCounts:
            type: object
            x-name: ConfigurationCapabilitiesScenariosAccumulatedCounts
            properties:
              defaultTimedResetEnabled: {type: boolean}
          passthroughConfiguration:
            type: object
            x-name: ConfigurationCapabilitiesScenariosPassthroughConfiguration
            properties:
              defaultEnabled: {type: boolean}
              minPeriod: {type: integer}
              maxPeriod: {type: integer}
          thresholdConfiguration:
            type: object
            x-name: ConfigurationCapabilitiesScenariosThresholdConfiguration
            properties:
              defaultEnabled: {type: boolean}
              minLevelWithMoreThanType: {type: integer}
              minLevelWithLessThanType: {type: integer}
              minTriggerDelay: {type: integer}
              maxTriggerDelay: {type: integer}
              defaultLevel: {type: integer}
              defaultType: {type: string}
              defaultTriggerDelay: {type: integer}
              maxLevel: {type: integer}
      triggers:
        type: array
        items: {$ref: '#/types/AreaCapability'}
      presets:
        type: object
        x-name: ConfigurationCapabilitiesPresets
        description: Only included if the camera supports PTZ presets.
        properties:
          minNbrPresetsPerScenario: {type: integer}
          maxNbrPresetsPerScenario: {type: integer}
          defaultPreset: {type: integer}
  Counts:
    type: object
    properties:
      resetTime:
        type: string
        description: Time when counting started or was last reset (ISO 8601 YYYY-MM-DDTHH:MM:SSZ). (format=date-time)
      timeStamp: {type: string, description: Time when count was read. (format=date-time)}
      total:
        description: Total number of counted objects of any category (example shows a string placeholder).
    additionalProperties:
      description: '<category> count: car, bus, bike, human, truck or otherVehicle depending on configuration.'

operations:
  get_configuration_capabilities:
    summary: Retrieve the configuration limits, capabilities and default/reference values of all configurable parameters.
    access: admin
    effect: read
    binding: {method: getConfigurationCapabilities}
    result: {$ref: '#/types/ConfigurationCapabilities'}
  get_configuration:
    summary: Retrieve the complete current application configuration.
    effect: read
    binding: {method: getConfiguration}
    result: {$ref: '#/types/Configuration'}
  set_configuration:
    summary: Apply a complete application configuration immediately.
    description: 'Any ongoing event is set inactive when a new configuration is applied, stopping ongoing recordings
      (all channels on multichannel cameras). Exception: if there is movement in the include area after the configuration
      is set and no exclusion filter hinders the alarm, the event is set active directly after the new configuration
      is applied. Values outside the camera capabilities result in an error.'
    effect: write
    write: patch
    binding: {method: setConfiguration}
    params:
      $ref: '#/types/Configuration'
      description: The complete configuration object (same structure as getConfiguration data).
  send_alarm_event:
    summary: Force a scenario to enter its alarm state for a 3 second duration (emits Axis and ONVIF events while
      high).
    effect: action
    binding: {method: sendAlarmEvent}
    params:
      type: object
      required: [scenario]
      properties:
        scenario:
          type: integer
          description: Defines which scenario will send the alarm event. <uid> represents the unique scenario ID
            (integer inferred from scenario id type).
  get_accumulated_counts:
    summary: Retrieve the accumulated counts (per configured class and total) for a Crossline Counting scenario.
    effect: read
    binding: {method: getAccumulatedCounts}
    params:
      type: object
      required: [scenario]
      properties:
        scenario: {type: integer, description: The unique scenario ID (<uid>).}
    result: {$ref: '#/types/Counts'}
    errors:
      2004: {description: The configuration contain an invalid parameter., kind: invalid_argument}
  reset_accumulated_counts:
    summary: Reset the object counts for a Crossline Counting scenario.
    effect: write
    write: replace
    binding: {method: resetAccumulatedCounts}
    params:
      type: object
      required: [scenario]
      properties:
        scenario: {type: integer, description: The unique scenario ID (<uid>).}
  reset_passthrough:
    summary: Reset the passthrough counter (event every N counts) for a Crossline Counting scenario.
    effect: write
    write: replace
    binding: {method: resetPassthrough}
    params:
      type: object
      required: [scenario]
      properties:
        scenario: {type: integer, description: The unique scenario ID (<uid>).}
  get_occupancy:
    summary: Retrieve the current object counts for an Occupancy in Area scenario.
    effect: read
    binding: {method: getOccupancy}
    params:
      type: object
      required: [scenario]
      properties:
        scenario: {type: integer, description: The unique scenario ID (<uid>).}
    result: {$ref: '#/types/Counts'}
    errors:
      2004: {description: The configuration contains an invalid parameter., kind: invalid_argument}

