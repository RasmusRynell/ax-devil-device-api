- url: https://developer.axis.com/vapix/applications/axis-object-analytics-api/
  sha256_md: cb2b4e0d21c8eff58eeab12a6357b4b5af1f08828b01312f48755ed4972df74c
  retrieved_at: '2026-10-11'

provenance:
  completeness: complete
  open_questions:
  - Method table names 'sendAlarm' while the section and request examples use 'sendAlarmEvent'; the latter is used. https://developer.axis.com/vapix/applications/axis-object-analytics-api/#send-alarm-event
  - 'Scenario feature matrix has 5 columns with ''occupancyinArea'' twice and rows shifted; trigger/filter applicability per scenario type is not encoded in the schema. #scenarios'
  - The getConfiguration response block lists capability containers (filters, perspective, triggers, ...) but the Configuration overview lists devices, metadataOverlay, perspectives, scenarios; the latter is used. The docs say all properties are mandatory unless noted, but Configuration fields are left optional because the docs also say optional parameters may be omitted.
  - 'The how-to example spells the overlay field drawnOnAllResolutions; the reference table drawOnAllResolutions is used.'
  - Short-lived objects capability block uses minDistance/maxDistance/defaultDistance while the table says minTime/maxTime/defaultTime; both are modelled. Exclude area block uses minNbrInstances/maxNbrInstances while the table says minNbrAreas/maxNbrAreas; both are modelled. Counting line capability table says validAlarmDirections/defaultAlarmDirection while the block uses validCountingDirections/defaultCountingDirection; both are modelled.
  - 'Counts: the table says resettime/timestamp while the example uses resetTime/timeStamp (camelCase used). Example values are string placeholders; counts are modelled as integers.'
  - sizePercentage filter width/height are described as 'ONVIF coordinates' in the configuration but as 'percentage of the image' in capabilities.
  - 'Scenario param scenario=<uid> has no stated type; integer inferred from the scenario id type. Events emitted by AOA scenarios are not documented on this page.'
  - "The ACAP Name reported by applications/list.cgi is not documented (the docs only say to use list.cgi; the example for the related VMD 3 shows name=\"VMD3\"). The acap discovery name objectanalytics is inferred from the application's /local/objectanalytics/control.cgi path; verify on a device. The docs' additional identification by Properties.EmbeddedDevelopment.Version is not used."
  - The request examples for setConfiguration and sendAlarmEvent lack a comma after the method field (invalid JSON); the documented examples use placeholder values and are not included, except the how-to scenario.
  migrated_from: v1
  curated: true
