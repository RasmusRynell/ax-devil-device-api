provenance:
  completeness: complete
  open_questions:
  - Method table names 'sendAlarm' while the section uses 'sendAlarmEvent'. https://developer.axis.com/vapix/applications/axis-object-analytics-api/#send-alarm-event
  - 'Scenario feature matrix has 5 columns with ''occupancyinArea'' twice and rows shifted (the feature name column
    holds ''Filters''/''Triggers''); the mapping in notes is a best reading. #scenarios'
  - getConfiguration response block lists capability containers (filters, objectClassifications, perspective, triggers,
    presets) but Configuration overview lists devices, metadataOverlay, perspectives, scenarios.
  - How-to example uses 'drawnOnAllResolutions'; reference uses 'drawOnAllResolutions'.
  - Short-lived objects capability block uses minDistance/maxDistance/defaultDistance while the table says minTime/maxTime/defaultTime.
  - Exclude area capability block uses min/maxNbrInstances but the table says minNbrAreas/maxNbrAreas. Counting-line
    capability table says validAlarmDirections/defaultAlarmDirection but block uses validCountingDirections/defaultCountingDirection.
  - 'Counts response field names: table uses ''resettime''/''timestamp'', example uses ''resetTime''/''timeStamp'';
    values shown as strings in example (''<number of counted objects>'').'
  - Counting line table names 'CountingDirection' (capital C) vs 'countingDirection' in block.
  - The setConfiguration and sendAlarmEvent request examples are missing a comma after the method field (invalid
    JSON).
  - Perspectives syntax block shows bars as an array containing key/value pairs (invalid JSON); interpreted as array
    of objects.
  - sizePercentage filter width/height described as 'ONVIF coordinates' in configuration but as 'percentage of the
    image' in capabilities.
  - Scenario param 'scenario=<uid>' type not stated; integer inferred from scenario id. Events emitted by AOA scenarios
    are not documented on this page.
  - No AXIS OS / AOA version requirements stated.
  - 'migration: effect-guessed: write semantics guessed from the method name: set_configuration=write/patch, reset_accumulated_counts=write/replace,
    reset_passthrough=write/replace'
  - 'migration: discovery: discovery method http_probe dropped'
  - 'migration: dropped-keywords: title x9'
  migrated_from: v1
  curated: false
