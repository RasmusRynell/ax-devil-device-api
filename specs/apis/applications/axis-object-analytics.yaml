format: 2
id: axis-object-analytics
name: AXIS Object Analytics API
summary: Configure object-detection scenarios (motion, fence, crossline counting, occupancy in area) of the AXIS Object Analytics (AOA) ACAP.
section: applications
family: jsonrpc
status: released
python:
  module: axis_object_analytics
  class: AxisObjectAnalytics
docs:
- https://developer.axis.com/vapix/applications/axis-object-analytics-api/
access: operator
discovery:
  - acap: {name: objectanalytics}
requires:
  application: AXIS Object Analytics

binding:
  path: /local/objectanalytics/control.cgi
  major: 1
  versions: ['1.2']
  negotiation:
    get_supported_versions: {key: apiVersions}
  params_placement: params

errors:
  1000: {description: An error occurred inside the application., kind: internal}
  2000: {description: The requested version of the application is not supported., kind: unsupported}
  2002: {description: Incoherent configuration (such as mismatched ID)., kind: invalid_argument}
  2003: {description: A mandatory parameter is missing., kind: invalid_argument}
  2004: {description: Invalid parameter., kind: invalid_argument}
  2005: {description: The requested CGI method is not supported., kind: unsupported}

types:
  Point:
    type: array
    items: {type: number}
    description: '[x, y] in ONVIF coordinates. (minItems=2, maxItems=2)'
  Device:
    type: object
    required: [id, type, rotation]
    properties:
      id:
        type: integer
        description: The device id that should correspond to the id in data.devices in getConfigurationCapabilities.
      type: {type: string, enum: [camera], description: The device type (can only be camera).}
      rotation:
        type: integer
        enum: [0, 90, 180, 270]
        description: The camera rotation, measured in degrees.
      isActive:
        type: boolean
        default: true
        description: True if omitted. Excludes the device from being used if set to false; scenarios, perspectives or metadata overlays referring to it are ignored.
  MetadataOverlay:
    type: object
    required: [id]
    properties:
      id:
        type: integer
        minimum: 1
        description: The metadata overlay ID in the range [1... n]. Corresponds to the device ID.
      drawOnAllResolutions:
        type: boolean
        description: Whether the overlay should be drawn on all available resolutions. Not mandatory if resolutions is specified.
      resolutions:
        type: array
        items: {type: string, pattern: '^[0-9]+x[0-9]+$'}
        description: Supported resolutions <width>x<height>. Should be empty or not specified if drawOnAllResolutions is true.
  PerspectiveBar:
    type: object
    required: [height, points]
    properties:
      height:
        type: integer
        description: Virtual height (in centimeters) of an object appearing at the same location and perceived height as the bar.
      points:
        type: array
        items: {$ref: '#/types/Point'}
        description: Start (pos 0, touches the ground plane) and end (pos 1) points in ONVIF coordinates. (minItems=2, maxItems=2)
  Perspective:
    type: object
    required: [id, bars]
    properties:
      id: {type: integer, description: A unique ID identifying the perspective.}
      bars:
        type: array
        items: {$ref: '#/types/PerspectiveBar'}
        description: Bars contributing to the perspective calculation, limited by getConfigurationCapabilities.
  Direction:
    enum: [leftToRight, rightToLeft]
  Trigger:
    type: object
    required: [type]
    description: >-
      Scenario trigger; the fields used depend on the type. At least one trigger is needed per scenario.
      includeArea uses vertices (polygon); fence uses vertices (polyline) and alarmDirection;
      countingLine uses vertices (polyline) and countingDirection.
    properties:
      type: {type: string, enum: [includeArea, fence, countingLine]}
      vertices:
        type: array
        items: {$ref: '#/types/Point'}
        description: Polygon (includeArea) or polyline (fence, countingLine) vertices.
      alarmDirection:
        $ref: '#/types/Direction'
        description: Fence only. Direction in which a crossing object raises the alarm (valid values from getConfigurationCapabilities).
      countingDirection:
        $ref: '#/types/Direction'
        description: countingLine only. Direction in which a crossing object is counted.
  Filter:
    type: object
    required: [type]
    description: >-
      Scenario filter (optional rules excluding objects); the fields used depend on the type.
      sizePercentage and sizePerspective use width and height (only one of the two may be used);
      timeShortLivedLimit uses time; distanceSwayingObject uses distance; speed uses minSpeed and maxSpeed
      (several allowed, only with a secondary radar device); excludeArea uses vertices (several allowed).
    properties:
      type: {type: string, enum: [sizePercentage, sizePerspective, timeShortLivedLimit, distanceSwayingObject, speed, excludeArea]}
      width: {type: integer, description: "Horizontal upper limit; ONVIF coordinates for sizePercentage, centimeters for sizePerspective."}
      height: {type: integer, description: "Vertical upper limit; ONVIF coordinates for sizePercentage, centimeters for sizePerspective."}
      time: {type: number, description: Waiting time in seconds until a detected object raises an alarm (timeShortLivedLimit).}
      distance: {type: integer, description: "Distance an object may travel before raising an alarm, percent of the image (distanceSwayingObject)."}
      minSpeed: {type: number, description: Ground speed (m/s) from which moving objects won't raise an alarm.}
      maxSpeed: {type: number, description: Ground speed (m/s) up to which moving objects won't raise an alarm.}
      vertices:
        type: array
        items: {$ref: '#/types/Point'}
        description: Exclude area polygon (excludeArea).
  ObjectClassification:
    type: object
    required: [type]
    properties:
      type: {type: string, description: Identifies the object type.}
      subTypes:
        type: array
        items: {$ref: '#/types/ObjectClassification'}
        description: Optional list of sub classifiers (two-level depth currently supported; only if the camera supports subtypes).
  ScenarioDevice:
    type: object
    required: [id]
    properties:
      id: {type: integer, description: Device ID defined in the root devices list.}
  AccumulatedCountsConfig:
    type: object
    description: Crossline counting only.
    properties:
      timedResetEnabled: {type: boolean, description: Timed reset (at midnight) of accumulated counts enabled.}
  PassthroughConfig:
    type: object
    description: Crossline counting only.
    properties:
      enabled: {type: boolean}
      period: {type: integer, description: Trigger an event for every <period> count.}
  Threshold:
    type: object
    properties:
      level: {type: integer, description: The number of threshold objects.}
      type: {type: string, enum: [moreThan, lessThan], description: Triggers if the number of objects in the area is more or less than the level.}
  ThresholdConfig:
    type: object
    description: Occupancy in area only.
    properties:
      enabled: {type: boolean}
      triggerDelay: {type: integer, description: Seconds to wait after the threshold is reached before the alarm is triggered.}
      thresholds:
        type: array
        items: {$ref: '#/types/Threshold'}
  Scenario:
    type: object
    required: [id, name, type, devices, triggers]
    properties:
      id: {type: integer, description: A unique scenario ID.}
      name: {type: string, description: A user friendly scenario name.}
      type: {type: string, enum: [motion, fence, crosslinecounting, occupancyInArea]}
      metadataOverlay:
        type: integer
        description: Must point to a valid id in the metadataOverlay array; omitting disables the overlay.
      alarmRate:
        type: string
        description: Valid rates are listed in getConfigurationCapabilities.data.scenarios.alarmRates.
      devices:
        type: array
        items: {$ref: '#/types/ScenarioDevice'}
      triggers:
        type: array
        items: {$ref: '#/types/Trigger'}
        description: At least one trigger is required.
      filters:
        type: array
        items: {$ref: '#/types/Filter'}
      objectClassifications:
        type: array
        items: {$ref: '#/types/ObjectClassification'}
        description: An empty array means an alarm can be triggered on any detected motion.
      perspectives:
        type: array
        items: {type: integer}
        description: Perspective IDs (from data.perspectives); mandatory if a perspective filter is configured.
      presets:
        type: array
        items: {type: integer}
        description: 'PTZ presets tracked: -2 always (except when moving), -1 all presets, 1 home, 2... specific presets. Not valid on non-PTZ devices.'
      accumulatedCounts: {$ref: '#/types/AccumulatedCountsConfig'}
      passthroughConfiguration: {$ref: '#/types/PassthroughConfig'}
      thresholdConfiguration: {$ref: '#/types/ThresholdConfig'}
  Configuration:
    type: object
    description: The complete application configuration, as read by get_configuration and written by set_configuration.
    properties:
      devices:
        type: array
        items: {$ref: '#/types/Device'}
      metadataOverlay:
        type: array
        items: {$ref: '#/types/MetadataOverlay'}
        description: Size limited by capabilities metadataOverlay.minNbrActiveCameras/maxNbrActiveCameras.
      perspectives:
        type: array
        items: {$ref: '#/types/Perspective'}
      scenarios:
        type: array
        items: {$ref: '#/types/Scenario'}
  TriggerCapability:
    type: object
    description: Limits of one trigger type (includeArea, fence or countingLine).
    properties:
      type: {type: string}
      minPosX: {type: number}
      maxPosX: {type: number}
      minPosY: {type: number}
      maxPosY: {type: number}
      minNbrVertices: {type: integer}
      maxNbrVertices: {type: integer}
      minNbrInstances: {type: integer}
      maxNbrInstances: {type: integer}
      defaultInstance:
        type: array
        items: {$ref: '#/types/Point'}
      validAlarmDirections:
        type: array
        items: {type: string}
        description: "Fence (and, per the docs table, counting line) only."
      defaultAlarmDirection: {type: string, description: "Fence (and, per the docs table, counting line) only."}
      validCountingDirections:
        type: array
        items: {type: string}
        description: Counting line only.
      defaultCountingDirection: {type: string, description: Counting line only.}
  FilterCapability:
    type: object
    description: Limits and defaults of one filter type; the fields present depend on the type.
    properties:
      type: {type: string}
      minWidth: {type: integer}
      maxWidth: {type: integer}
      minHeight: {type: integer}
      maxHeight: {type: integer}
      defaultWidth: {type: integer}
      defaultHeight: {type: integer}
      minTime: {type: integer, description: timeShortLivedLimit (docs table; see open questions).}
      maxTime: {type: integer}
      defaultTime: {type: integer}
      minDistance: {type: integer, description: distanceSwayingObject (also used by the timeShortLivedLimit example block).}
      maxDistance: {type: integer}
      defaultDistance: {type: integer}
      minSpeed: {type: number}
      maxSpeed: {type: number}
      defaultMinSpeed: {type: number}
      defaultMaxSpeed: {type: number}
      minPosX: {type: number}
      maxPosX: {type: number}
      minPosY: {type: number}
      maxPosY: {type: number}
      minNbrVertices: {type: integer}
      maxNbrVertices: {type: integer}
      minNbrInstances: {type: integer}
      maxNbrInstances: {type: integer}
      minNbrAreas: {type: integer}
      maxNbrAreas: {type: integer}
      defaultInstance:
        type: array
        items: {$ref: '#/types/Point'}
  DeviceCapability:
    type: object
    properties:
      id: {type: integer}
      type: {type: string}
      imageIndex: {type: integer, description: The image source index.}
      name: {type: string}
      rotation: {type: integer, enum: [0, 90, 180, 270]}
      resolutions:
        type: array
        items: {type: string}
      tags:
        type: array
        items: {type: string, enum: [primary, secondary, fisheye]}
        description: primary is the device to use when a secondary exists; secondary can only be used together with a primary; fisheye has a fisheye lens.
  MetadataOverlayCamera:
    type: object
    properties:
      id: {type: integer, description: 'Camera value used with media.amp, starting at 1.'}
      canDrawInSpecifiedResolutions: {type: boolean, description: False means only drawing on all resolutions at once is supported.}
      resolutions:
        type: array
        items: {type: string}
  MetadataOverlayCapabilities:
    type: object
    properties:
      minNbrActiveCameras: {type: integer, description: 'If 0 cameras are referenced, the overlay is disabled.'}
      maxNbrActiveCameras: {type: integer, description: 'If 0, the feature is not supported.'}
      cameras:
        type: array
        items: {$ref: '#/types/MetadataOverlayCamera'}
  PerspectiveCapabilities:
    type: object
    properties:
      minNbrBars: {type: integer}
      maxNbrBars: {type: integer}
      minNbrPerspectivesPerScenario: {type: integer}
      maxNbrPerspectivesPerScenario: {type: integer}
      minHeight: {type: integer}
      maxHeight: {type: integer}
      defaultHeight: {type: integer}
      minNbrPerspectives: {type: integer}
      maxNbrPerspectives: {type: integer}
  AccumulatedCountsCapabilities:
    type: object
    properties:
      defaultTimedResetEnabled: {type: boolean}
  PassthroughCapabilities:
    type: object
    properties:
      defaultEnabled: {type: boolean}
      minPeriod: {type: integer}
      maxPeriod: {type: integer}
  ThresholdCapabilities:
    type: object
    properties:
      defaultEnabled: {type: boolean}
      minLevelWithMoreThanType: {type: integer}
      minLevelWithLessThanType: {type: integer}
      minTriggerDelay: {type: integer}
      maxTriggerDelay: {type: integer}
      defaultLevel: {type: integer}
      defaultType: {type: string}
      defaultTriggerDelay: {type: integer}
      maxLevel: {type: integer}
  ScenarioCapabilities:
    type: object
    properties:
      minNbrScenariosPerCamera: {type: integer}
      maxNbrScenariosPerCamera: {type: integer}
      minNbrActiveDevices: {type: integer}
      maxNbrActiveDevices: {type: integer}
      minNbrDevices: {type: integer}
      maxNbrDevices: {type: integer}
      minLengthName: {type: integer}
      maxLengthName: {type: integer}
      defaultScenario: {type: string}
      defaultDeviceId: {type: string}
      supportedScenarios:
        type: array
        items: {type: string}
      alarmRates:
        type: array
        items: {type: string}
      defaultAlarmRate: {type: string}
      accumulatedCounts: {$ref: '#/types/AccumulatedCountsCapabilities'}
      passthroughConfiguration: {$ref: '#/types/PassthroughCapabilities'}
      thresholdConfiguration: {$ref: '#/types/ThresholdCapabilities'}
  PresetCapabilities:
    type: object
    description: Only included if the camera supports PTZ presets.
    properties:
      minNbrPresetsPerScenario: {type: integer}
      maxNbrPresetsPerScenario: {type: integer}
      defaultPreset: {type: integer}
  ConfigurationCapabilities:
    type: object
    properties:
      devices:
        type: array
        items: {$ref: '#/types/DeviceCapability'}
      filters:
        type: array
        items: {$ref: '#/types/FilterCapability'}
      metadataOverlay: {$ref: '#/types/MetadataOverlayCapabilities'}
      objectClassifications:
        type: array
        items: {$ref: '#/types/ObjectClassification'}
      perspective: {$ref: '#/types/PerspectiveCapabilities'}
      scenarios: {$ref: '#/types/ScenarioCapabilities'}
      triggers:
        type: array
        items: {$ref: '#/types/TriggerCapability'}
      presets: {$ref: '#/types/PresetCapabilities'}
  ScenarioRequest:
    type: object
    required: [scenario]
    properties:
      scenario: {type: integer, description: The unique scenario ID.}
  Counts:
    type: object
    required: [total]
    description: Object counts. Besides the named fields there is one entry per configured category.
    properties:
      resetTime:
        type: string
        description: Time when counting started or was last reset (ISO 8601 YYYY-MM-DDTHH:MM:SSZ). Only in accumulated counts.
      timeStamp: {type: string, description: Time when the count was read (ISO 8601).}
      total: {type: integer, description: Total number of counted objects of any category.}
    additionalProperties:
      type: integer
      description: '<category> count: car, bus, bike, human, truck or otherVehicle depending on configuration.'

operations:
  get_configuration_capabilities:
    summary: Retrieve the configuration limits, capabilities and default/reference values of all configurable parameters.
    access: admin
    effect: read
    binding: {method: getConfigurationCapabilities}
    result: {$ref: '#/types/ConfigurationCapabilities'}
  get_configuration:
    summary: Retrieve the complete current application configuration.
    effect: read
    binding: {method: getConfiguration}
    result: {$ref: '#/types/Configuration'}
  set_configuration:
    summary: Apply a complete application configuration immediately.
    description: >-
      Replaces the whole configuration. Any ongoing event is set inactive when a new configuration is applied,
      stopping ongoing recordings (all channels on multichannel cameras). Exception: if there is movement in the
      include area after the configuration is set and no exclusion filter hinders the alarm, the event is set
      active directly after the new configuration is applied. Values outside the camera capabilities result in an error.
    effect: write
    write: replace
    binding: {method: setConfiguration}
    params: {$ref: '#/types/Configuration'}
    round_trip:
      from: Configuration
    errors:
      2002: {description: Incoherent configuration (such as mismatched ID)., kind: invalid_argument}
    examples:
      - title: Create a scenario for object detection
        request:
          params:
            scenarios:
              - id: 1
                name: My Scenario
                type: motion
                devices: [{id: 1}]
                triggers:
                  - type: includeArea
                    vertices: [[-0.9, -0.9], [-0.9, 0.9], [0.9, 0.9], [0.9, -0.9]]
        response: {data: {}}
        source: https://developer.axis.com/vapix/applications/axis-object-analytics-api/#create-a-scenario-for-object-detection
      - title: Invalid parameter
        request:
          params: {scenarios: []}
        response: {error: {code: 2004, message: Invalid parameter}}
        source: https://developer.axis.com/vapix/applications/axis-object-analytics-api/#set-configuration
  send_alarm_event:
    summary: Force a scenario to enter its alarm state for a 3 second duration (emits Axis and ONVIF events while high).
    effect: action
    binding: {method: sendAlarmEvent}
    params: {$ref: '#/types/ScenarioRequest'}
    positional: [scenario]
  get_accumulated_counts:
    summary: Retrieve the accumulated counts (per configured class and total) for a Crossline Counting scenario.
    effect: read
    binding: {method: getAccumulatedCounts}
    params: {$ref: '#/types/ScenarioRequest'}
    positional: [scenario]
    result: {$ref: '#/types/Counts'}
  reset_accumulated_counts:
    summary: Reset the object counts for a Crossline Counting scenario.
    effect: action
    binding: {method: resetAccumulatedCounts}
    params: {$ref: '#/types/ScenarioRequest'}
    positional: [scenario]
  reset_passthrough:
    summary: Reset the passthrough counter (event every N counts) for a Crossline Counting scenario.
    effect: action
    binding: {method: resetPassthrough}
    params: {$ref: '#/types/ScenarioRequest'}
    positional: [scenario]
  get_occupancy:
    summary: Retrieve the current object counts for an Occupancy in Area scenario.
    effect: read
    binding: {method: getOccupancy}
    params: {$ref: '#/types/ScenarioRequest'}
    positional: [scenario]
    result: {$ref: '#/types/Counts'}

