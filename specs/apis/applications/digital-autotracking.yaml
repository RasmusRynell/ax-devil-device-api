format: 2
id: digital-autotracking
name: Digital autotracking API
summary: Read the configuration of the AXIS Digital Autotracking ACAP (view area, include and exclude areas, ignore filters)
  via vaconfig.cgi.
section: applications
family: cgi
status: released
python:
  module: digital_autotracking
  class: DigitalAutotracking
docs:
- https://developer.axis.com/vapix/applications/digital-autotracking-api/
access: admin
discovery:
- acap:
    name: DigitalAutotracking
requires:
  application: AXIS Digital Autotracking (package DigitalAutotracking, file AXISDigitalAutotracking.eap)
binding:
  path: /axis-cgi/vaconfig.cgi
errors:
  bad_request:
    description: Bad request. The request URL was not formatted correctly.
    kind: invalid_argument
  no_such_application:
    description: There is no application with the given name.
    kind: not_found
  internal:
    description: The action could not be performed, for example because the application failed to restart after a configuration
      modification.
    kind: internal
types:
  Point:
    type: object
    required:
    - x
    - y
    properties:
      x:
        type: number
        description: X coordinate, -1.0 to 1.0. The top right corner of the camera view is x=1.0, y=1.0.
      y:
        type: number
        description: Y coordinate, -1.0 to 1.0.
  IntValue:
    type: object
    required:
    - value
    properties:
      value:
        type: integer
  NamedObjectData:
    type: object
    properties:
      knownNameType:
        type: string
        description: Type of the data, for example geometry.polygon or core.int. The docs' attribute table spells it knownTypeName.
      polygon:
        type: array
        items:
          $ref: '#/types/Point'
        x-xml:
          path: polygon/point
        description: Corner points of a polygon object; empty for other object types.
      int:
        $ref: '#/types/IntValue'
        x-python-name: integer
        description: Integer data of a core.int object, such as a filter value or a view area number.
  NamedObject:
    type: object
    required:
    - name
    properties:
      name:
        type: string
        description: Name of the object. Rule parameters refer to it by this name.
      data:
        $ref: '#/types/NamedObjectData'
  RuleParameter:
    type: object
    required:
    - name
    - value
    properties:
      name:
        type: string
        description: Name of a parameter used by the rule function.
      value:
        type: string
        description: Value of the parameter; the name of the named object to use.
  Rule:
    type: object
    required:
    - name
    properties:
      name:
        type: string
        description: Name of the rule.
      function:
        type: string
        description: Name of the rule function, defined in a script file.
      parameter:
        type: array
        items:
          $ref: '#/types/RuleParameter'
        x-xml:
          path: parameter
        x-python-name: parameters
  Script:
    type: object
    properties:
      name:
        type: string
        x-xml: text
        description: Name of the script file.
      encryption:
        type: string
        enum:
        - '0'
        - '1'
        description: 1 = the script is encrypted, 0 = not encrypted.
  EventAttribute:
    type: object
    properties:
      key:
        type: string
      nicename:
        type: string
      tag:
        type: string
        enum:
        - source
        - data
        - property-state
        description: source = source info of the event metadata, data = data info, property-state = stateful event (0 or 1).
      value:
        type: string
  Event:
    type: object
    required:
    - name
    properties:
      name:
        type: string
        description: Name of an event emitted by the application.
      nicename:
        type: string
      attr:
        type: array
        items:
          $ref: '#/types/EventAttribute'
        x-xml:
          path: attr
        x-python-name: attributes
  MoteOption:
    type: object
    required:
    - name
    - value
    properties:
      name:
        type: string
        description: 'Option name: boundingBox, polygon or velocity.'
      value:
        type: string
        enum:
        - 'true'
        - 'false'
  NameValue:
    type: object
    properties:
      name:
        type: string
      value:
        type: string
  Library:
    type: object
    properties:
      name:
        type: string
  RuleEngine:
    type: object
    properties:
      status:
        type: string
        enum:
        - enabled
        - disabled
        description: Whether the AXIS OS parses this configuration (AXIS OS 5.61 and later).
      namedObjects:
        type: array
        items:
          $ref: '#/types/NamedObject'
        x-xml:
          path: namedObjects/namedObject
        description: All named objects used by the application.
      rules:
        type: array
        items:
          $ref: '#/types/Rule'
        x-xml:
          path: rules/rule
        description: All rules used by the application.
      scripts:
        type: array
        items:
          $ref: '#/types/Script'
        x-xml:
          path: scripts/script
      events:
        type: array
        items:
          $ref: '#/types/Event'
        x-xml:
          path: events/event
      analyticSources:
        type: array
        items:
          $ref: '#/types/NameValue'
        x-xml:
          path: analyticSources/analyticSource
      moteConfig:
        type: array
        items:
          $ref: '#/types/MoteOption'
        x-xml:
          path: moteConfig/option
        description: MOTE configuration options.
      libraries:
        type: array
        items:
          $ref: '#/types/Library'
        x-xml:
          path: libraries/library
  Application:
    type: object
    required:
    - name
    properties:
      name:
        type: string
        description: Name of the application.
      nicename:
        type: string
      ruleEngine:
        $ref: '#/types/RuleEngine'
  ApplicationConfig:
    type: object
    x-xml:
      root: config
    properties:
      version:
        type: string
        description: Version of the configuration format.
      application:
        $ref: '#/types/Application'
operations:
  get_configuration:
    summary: Retrieve the application configuration.
    description: Deprecated. Version 2 defines the view area, include area, exclude areas and the swaying, short-lived and
      small object filters as named objects; version 1 only has the view area, exclude areas and the swaying filter.
    effect: read
    binding:
      method: GET
      query:
        action: get
        name: DigitalAutotracking
      reply:
        xml:
          status_error:
            attribute: result
            value: error
    result:
      $ref: '#/types/ApplicationConfig'
    examples:
    - title: Retrieve the application configuration
      request:
        query:
          action: get
          name: DigitalAutotracking
      response:
        status: 200
        text: |
          <reply result="ok">
              <config version="1.0">
                  <application name="DigitalAutotracking" nicename="Digital Autotracking">
                      <ruleEngine>
                          <namedObjects>
                              <namedObject name="Detection Area">
                                  <data knownNameType="geometry.polygon">
                                      <polygon>
                                          <point x="0.97" y="0.97" />
                                          <point x="0.97" y="-0.97" />
                                          <point x="-0.97" y="-0.97" />
                                          <point x="-0.97" y="0.97" />
                                      </polygon>
                                  </data>
                              </namedObject>
                              <namedObject name="Object Duration">
                                  <data knownNameType="core.int">
                                      <int value="-10" />
                                  </data>
                              </namedObject>
                              <namedObject name="Object Width">
                                  <data knownNameType="core.int">
                                      <int value="-10" />
                                  </data>
                              </namedObject>
                              <namedObject name="Object Height">
                                  <data knownNameType="core.int">
                                      <int value="-10" />
                                  </data>
                              </namedObject>
                              <namedObject name="Swaying Object Suppression">
                                  <data knownNameType="core.int">
                                      <int value="0" />
                                  </data>
                              </namedObject>
                              <namedObject name="Visual Duration">
                                  <data knownNameType="core.int">
                                      <int value="1" />
                                  </data>
                              </namedObject>
                          </namedObjects>
                          <rules>
                              <rule name="detection_DigitalAutotracking" function="trackObjects">
                                  <parameter name="SwayingObjectSuppression" value="Swaying Object Suppression" />
                                  <parameter name="Duration" value="Visual Duration" />
                                  <parameter name="Time" value="Object Duration" />
                                  <parameter name="Width" value="Object Width" />
                                  <parameter name="Height" value="Object Height" />
                                  <parameter name="IncludeArea" value="Detection Area" />
                              </rule>
                          </rules>
                          <scripts>
                              <script encryption="1">combined.lua</script>
                          </scripts>
                          <events>
                              <event name="tracking" nicename="Tracking">
                                  <attr key="camera" nicename="View Area" tag="source" />
                                  <attr key="active" nicename="Active" tag="property-state" />
                              </event>
                          </events>
                          <moteConfig>
                              <option name="boundingBox" value="false" />
                              <option name="polygon" value="true" />
                              <option name="velocity" value="true" />
                          </moteConfig>
                          <libraries>
                              <library name="digitalAutotracking" />
                              <library name="system" />
                          </libraries>
                      </ruleEngine>
                  </application>
              </config>
          </reply>
      source: https://developer.axis.com/vapix/applications/digital-autotracking-api/#getting-started
  modify_configuration:
    summary: Modify the application configuration.
    description: Defines which view area to use, the size of the include area, exclude areas and the filter values; all other settings must be kept as is, and if a named object is renamed the matching parameter value must change too. Posts the XML as the raw request body with action and name in the URL, as the API syntax shows.
    effect: write
    write: replace
    binding:
      method: POST
      encoding: body
      content_type: text/xml
      query:
        action: modify
        name: DigitalAutotracking
      reply:
        xml:
          status_error:
            attribute: result
            value: error
    params:
      type: object
      required:
      - configuration
      properties:
        configuration:
          type: string
          x-in: body
          description: The complete configuration document to apply (the application element, or the config element around it,
            as returned by get_configuration), edited as described above. All settings that are not to change must be kept as is.
    examples:
    - title: Modify the application configuration
      request:
        query:
          action: modify
          name: DigitalAutotracking
        content_type: text/xml
        body: |
          <config version="1.0">
            <application name="DigitalAutotracking" nicename="Digital Autotracking">
              <ruleEngine>
                <namedObjects>
                  <namedObject name="Detection Area">
                    <data knownNameType="geometry.polygon">
                      <polygon>
                        <point x="0.97" y="0.97"/>
                        <point x="0.97" y="-0.97"/>
                        <point x="-0.97" y="-0.97"/>
                        <point x="-0.97" y="0.97"/>
                      </polygon>
                    </data>
                  </namedObject>
                  <namedObject name="Exclude Area 1">
                    <data knownNameType="geometry.polygon">
                      <polygon>
                        <point x="0.20" y="0.20"/>
                        <point x="0.20" y="-0.20"/>
                        <point x="-0.20" y="-0.20"/>
                        <point x="-0.20" y="0.20"/>
                      </polygon>
                    </data>
                  </namedObject>
                  <namedObject name="Object Duration">
                    <data knownNameType="core.int">
                      <int value="-10"/>
                    </data>
                  </namedObject>
                  <namedObject name="Object Width">
                    <data knownNameType="core.int">
                      <int value="-10"/>
                    </data>
                  </namedObject>
                  <namedObject name="Object Height">
                    <data knownNameType="core.int">
                      <int value="-10"/>
                    </data>
                  </namedObject>
                  <namedObject name="Swaying Object Suppression">
                    <data knownNameType="core.int">
                      <int value="0"/>
                    </data>
                  </namedObject>
                  <namedObject name="Visual Duration">
                    <data knownNameType="core.int">
                      <int value="1"/>
                    </data>
                  </namedObject>
                  <namedObject name="View Area">
                    <data knownNameType="core.int">
                      <int value="7"/>
                    </data>
                  </namedObject>
                </namedObjects>
                <rules>
                  <rule name="detection_0" function="guardIncludeArea">
                    <parameter name="SwayingObjectSuppression" value="Swaying Object Suppression"/>
                    <parameter name="Duration" value="Visual Duration"/>
                    <parameter name="Time" value="Object Duration"/>
                    <parameter name="Width" value="Object Width"/>
                    <parameter name="Height" value="Object Height"/>
                    <parameter name="VA" value="View Area"/>
                    <parameter name="IncludeArea" value="Detection Area"/>
                    <parameter name="EA1" value="Exclude Area 1"/>
                  </rule>
                </rules>
                <scripts>
                  <script encryption="1">combined.lua</script>
                </scripts>
                <events>
                  <event name="tracking" nicename="Tracking">
                    <attr key="camera" nicename="View Area" tag="source"/>
                    <attr key="active" nicename="Active" tag="property-state"/>
                  </event>
                </events>
                <moteConfig>
                  <option name="boundingBox" value="false"/>
                  <option name="polygon" value="true"/>
                  <option name="velocity" value="true"/>
                </moteConfig>
                <libraries>
                  <library name="digitalAutotracking"/>
                  <library name="system"/>
                </libraries>
              </ruleEngine>
            </application>
          </config>
      source: https://developer.axis.com/vapix/applications/digital-autotracking-api/#getting-started
  event_stream_url:
    summary: Build the RTSP URL of a stream with event metadata.
    description: RTSP stream that carries the tracking event as metadata. The library only builds the URL; use an RTSP client to read the stream.
    effect: read
    binding:
      rtsp:
        query:
          event: 'on'
          eventtopic: 'onvif:RuleEngine/axis:DigitalAutotracking/tracking//'
    params:
      type: object
      properties:
        video:
          type: integer
          description: Video source number (the documented example uses 0).
sources:
- url: https://developer.axis.com/vapix/applications/digital-autotracking-api/
  sha256_md: 99c6d88fd868ec27c1f762c0f41e2042630c8f9b388596945d694f6ae95bbf8f
  retrieved_at: '2026-10-11'
provenance:
  completeness: partial
  open_questions:
  - "modify_configuration: the page's example posts 'action=modify&name=<name>' and a newline in front of the XML as one form-encoded body, while the Application configuration API syntax puts action and name in the URL query. The spec follows the syntax (query arguments, raw XML body); if a device rejects it the body form may be needed. The documented success reply is not shown."
  - Event stream example topic is 'tns1:RuleEnginge/...' (typo). Event source SimpleItem Name is 'View Area' in the stream
    but 'camera' in the declaration.
  - Table uses attribute 'knownTypeName'/'knownType' while XML uses 'knownNameType'.
  - 'Example rule names differ: ''detection_DigitalAutotracking'' function ''trackObjects'' vs ''detection_0'' function ''guardIncludeArea''
    in modify example.'
  - The view-area enabling example sets PTZ.Various.V8.Locked=False for view area 7 (Image.I7); the index relation is not
    explained.
  - Event declaration block is malformed (<tracking wstop="true"> and unclosed <tracking>).
  - Default values of filters not stated beyond example values (-10 for Time/Width/Height, 0 for swaying).
  migrated_from: v1
  curated: true
