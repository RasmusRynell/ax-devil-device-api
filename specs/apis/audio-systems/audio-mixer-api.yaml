format: 2
id: audio-mixer-api
name: Audio mixer API
summary: Read the JSON schema of audio plugins, and read and apply the settings of the audio plugins in the audio chain.
section: audio-systems
family: jsonrpc
status: released
python:
  module: audio_mixer
  class: AudioMixer
docs:
- https://developer.axis.com/vapix/audio-systems/audio-mixer-api/
access: operator

binding:
  path: /axis-cgi/audiomixer.cgi
  major: 1
  versions: ['1.0', '1.3']
  negotiation:
    get_supported_versions: {key: apiVersions}
  params_placement: params

errors:
  1100: {description: INTERNAL_ERROR. Internal error., kind: internal}
  2100:
    description: UNSUPPORTED_API_VERSION. The requested API version is not supported.
    kind: unsupported
  2101:
    description: JSON_INVALID_ERROR. The provided JSON input was invalid.
    kind: invalid_argument
  2102: {description: METHOD_NOT_SUPPORTED. Method not supported., kind: unsupported}
  2103:
    description: JSON_KEY_NOT_FOUND. A mandatory input parameter was not found in the input.
    kind: invalid_argument
  2104:
    description: PARAM_INVALID_VALUE_ERROR. Invalid parameter value specified.
    kind: invalid_argument
  2105: {description: AUTHORIZATION_ERROR. Authorization failed., kind: access_denied}
  2106: {description: AUTHENTICATION_ERROR. Authentication failed., kind: access_denied}
  2107: {description: TRANSPORT_LEVEL_ERROR. Transport level error.}

types:
  PluginSettings:
    type: object
    description: The settings of one plugin instance.
    required: [id, settings]
    properties:
      id:
        type: string
        description: The plugin instance identification (e.g. automaticGainControl, voiceEnhancer, simpleEq).
      settings:
        type: object
        description: Settings parameters described by the response from getPluginSchema.
  IoPlugins:
    type: object
    description: The plugins of one audio input or output.
    required: [id]
    properties:
      id: {type: string, description: The input/output ID.}
      plugins:
        type: array
        items: {$ref: '#/types/PluginSettings'}
        description: List of plugin settings.
  AudioDevicePlugins:
    type: object
    description: The plugins of one audio device.
    required: [id]
    properties:
      id: {type: string, description: The audio device ID.}
      inputs:
        type: array
        items: {$ref: '#/types/IoPlugins'}
        description: List of device inputs.
      outputs:
        type: array
        items: {$ref: '#/types/IoPlugins'}
        description: List of outputs in a device.
  PluginsSettings:
    type: object
    description: The plugin settings of all audio devices.
    required: [devices]
    properties:
      devices:
        type: array
        items: {$ref: '#/types/AudioDevicePlugins'}
        description: List of available audio devices.
  PluginSchema:
    type: object
    description: The JSON schema of the settings object of one plugin.
    properties:
      $schema: {type: string, description: The URL to the core schema meta-schema.}
      title: {type: string, description: The schema title.}
      type: {type: string, description: 'The type of settings, most likely an object.'}
      properties:
        type: object
        description: A unique JSON schema describing the properties of the settings object returned by getPluginsSettings
          and sent to setPluginsSettings.
  SetPluginsSettingsRequest:
    type: object
    description: Arguments of ``set_plugins_settings``. Only changed parameters need to be specified.
    required: [devices]
    properties:
      devices:
        type: array
        items: {$ref: '#/types/AudioDevicePlugins'}
        description: List of audio devices and the plugin settings to apply.

operations:
  get_plugin_schema:
    summary: Retrieve the JSON schema for a plugin's settings object (as used by getPluginsSettings/setPluginsSettings).
    effect: read
    binding: {method: getPluginSchema}
    params:
      type: object
      x-name: GetPluginSchemaRequest
      required: [plugin]
      properties:
        plugin:
          type: string
          description: The name of the plugin that retrieves the settings object JSON schema.
    positional: [plugin]
    result: {$ref: '#/types/PluginSchema'}
    examples:
    - title: Retrieve the plugin schema
      request:
        params: {plugin: automaticGainControl}
      response:
        data:
          $schema: http://json-schema.org/draft-07/schema#
          title: automaticGainControl
          type: object
          properties:
            target: {type: number, description: Desired output level, minimum: -180, maximum: 0}
            dynamic_range: {type: number, description: Allowed dynamic range, minimum: 0}
      source: https://developer.axis.com/vapix/audio-systems/audio-mixer-api/#retrieve-the-plugin-schema
    - title: Internal error
      request:
        params: {plugin: automaticGainControl}
      response:
        error: {code: 1100, message: Internal error}
      source: https://developer.axis.com/vapix/audio-systems/audio-mixer-api/#retrieve-the-plugin-schema
  get_plugins_settings:
    summary: Retrieve the plugin settings for all plugin instances on all audio devices/inputs/outputs.
    effect: read
    binding: {method: getPluginsSettings}
    result: {$ref: '#/types/PluginsSettings'}
    examples:
    - title: Retrieve plugin settings
      request:
        params: {}
      response:
        data:
          devices:
          - id: '0'
            inputs:
            - id: '0'
              plugins:
              - id: automaticGainControl
                settings: {enabled: true, target: -6, dynamicRange: 3}
              - id: voiceEnhancer
                settings: {enabled: true, noiseSuppression: -6}
            outputs:
            - id: '0'
              plugins:
              - id: simpleEq
                settings: {enabled: true, band0: -16, band1: -12}
      source: https://developer.axis.com/vapix/audio-systems/audio-mixer-api/#retrieve-plugin-settings
  set_plugins_settings:
    summary: Configure plugin instances (structure as returned by getPluginsSettings).
    description: Only parameters that are changed need to be specified; non-specified parameters retain their existing
      values.
    effect: write
    write: patch
    binding: {method: setPluginsSettings}
    params: {$ref: '#/types/SetPluginsSettingsRequest'}
    round_trip:
      from: PluginsSettings
    examples:
    - title: Set plugin settings
      request:
        params:
          devices:
          - id: '0'
            inputs:
            - id: '0'
              plugins:
              - id: automaticGainControl
                settings: {enabled: true, target: -2, dynamicRange: 4}
              - id: voiceEnhancer
                settings: {enabled: false, noiseSuppression: -6}
            outputs:
            - id: '0'
              plugins:
              - id: simpleEq
                settings: {enabled: true, band0: -16, band1: -12}
      response: {data: {}}
      source: https://developer.axis.com/vapix/audio-systems/audio-mixer-api/#set-plugin-settings

