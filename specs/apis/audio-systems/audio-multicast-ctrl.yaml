format: 2
id: audio-multicast-ctrl
name: Audio Multicast Controller
summary: Configure audio devices to receive multicast audio and prioritize between multicast and internal sources (SIP, VAPIX audio, media clips).
section: audio-systems
family: dca
status: beta
python:
  module: audio_multicast_ctrl
  class: AudioMulticastCtrl
docs:
- https://developer.axis.com/vapix/audio-systems/audio-multicast-controller/
access: admin
discovery:
- dca: {api: audio-multicast-ctrl, version: v1beta}

binding: {root: /config/rest/audio-multicast-ctrl/v1beta}

types:
  ID: {type: string, maxLength: 63, description: A unique ID.}
  SRTPKey:
    type: string
    maxLength: 127
    description: An SRTP key used for encrypted multicast sources.
  Label: {type: string, maxLength: 31, description: A string used to describe entities.}
  Priority:
    type: integer
    minimum: 1
    maximum: 13
    description: The priority of the multicast source. The docs declare type string with minimum/maximum, but the
      text and examples use integers (see open_questions).
  LatencyProfile:
    type: string
    enum: [Normal, Low, UltraLow]
    description: The time delay between the audio input (RTP packets received from the multicast source) and audio
      output (sound played through the speaker). Different sources have different latency requirements.
  Port: {type: integer, minimum: 1024, maximum: 65534, description: The transport layer port.}
  AudioCodec: {type: string, enum: [PCMU, PCMA], description: The supported audio codecs.}
  SourceType:
    type: string
    enum: [Multicast, Internal]
    description: 'Internal: built-in media sources such as SIP, VAPIXAudio and VAPIXMediaClip; cannot be modified
      or removed apart from priority rank. Multicast: user created sources.'
  IpAddress:
    type: string
    maxLength: 39
    description: 'The IPv4 address. For sources: multicast address 224.0.0.0 - 239.255.255.255.'
  Source:
    type: object
    description: A multicast or internal audio source. Contains all sources except RTCP.
    required: [id, label]
    x-read-only: [id]
    x-masked: [srtpKey]
    properties:
      id: {$ref: '#/types/ID', description: A unique source ID generated by the backend.}
      ipAddress: {$ref: '#/types/IpAddress', description: The multicast address to listen to.}
      label: {$ref: '#/types/Label', description: The nicename of the source.}
      port: {$ref: '#/types/Port', description: The device port from which the audio source originates.}
      prio: {$ref: '#/types/Priority', description: Priority of the multicast source.}
      latencyProfile: {$ref: '#/types/LatencyProfile'}
      srtpKey: {$ref: '#/types/SRTPKey'}
      type: {$ref: '#/types/SourceType'}
  AudioMulticastCtrl:
    type: object
    description: The whole API tree.
    properties:
      audioCodec:
        $ref: '#/types/AudioCodec'
        description: Determines which audio codec should be used. Applies to all multicast sources.
      enabled: {type: boolean, description: Turns ON/OFF the Audio Multicast Controller.}
      sources:
        type: array
        items: {$ref: '#/types/Source'}
  AddSourceRequest:
    type: object
    description: Arguments of ``add_source``. Parameters left out are set to a default value; a unique ID is generated.
    required: [label]
    x-masked: [srtpKey]
    properties:
      label: {$ref: '#/types/Label'}
      ipAddress: {$ref: '#/types/IpAddress'}
      port: {$ref: '#/types/Port'}
      prio: {$ref: '#/types/Priority'}
      latencyProfile: {$ref: '#/types/LatencyProfile'}
      srtpKey: {$ref: '#/types/SRTPKey'}
      type: {$ref: '#/types/SourceType'}

operations:
  get_all:
    summary: All data of the Audio Multicast Controller API.
    effect: read
    binding: {method: GET, path: ''}
    result: {$ref: '#/types/AudioMulticastCtrl'}
  set_enabled:
    summary: Turn the Audio Multicast Controller on or off.
    effect: write
    write: patch
    binding: {method: PATCH, path: /enabled, body_field: enabled, body: value}
    params:
      type: object
      required: [enabled]
      properties:
        enabled: {type: boolean, description: Turns ON/OFF the Audio Multicast Controller.}
    examples:
    - title: Toggle Audio Multicast Controller
      request:
        path: /enabled
        body: {data: true}
      response:
        status: 200
        body: {status: success}
      source: https://developer.axis.com/vapix/audio-systems/audio-multicast-controller/#toggle-audio-multicast-controller
  set_audio_codec:
    summary: Set the audio codec expected from the multicast sources.
    effect: write
    write: patch
    binding: {method: PATCH, path: /audioCodec, body_field: audioCodec, body: value}
    params:
      type: object
      required: [audioCodec]
      properties:
        audioCodec:
          $ref: '#/types/AudioCodec'
          description: Determines which audio codec should be used. Applies to all multicast sources.
    examples:
    - title: Adjust the audio codec
      request:
        path: /audioCodec
        body: {data: PCMU}
      response:
        status: 200
        body: {status: success}
      source: https://developer.axis.com/vapix/audio-systems/audio-multicast-controller/#adjust-the-audio-codec
  list_sources:
    summary: List all sources.
    effect: read
    binding: {method: GET, path: /sources}
    result: {type: array, items: {$ref: '#/types/Source'}}
    examples:
    - title: List all sources
      request: {}
      response:
        status: 200
        body:
          status: success
          data:
          - {id: Unique ID, ipAddress: 239.0.0.1, label: This is a label, port: 4000, prio: 1, latencyProfile: Normal, type: Multicast}
          - {id: Unique ID, ipAddress: 239.0.0.1, label: This is a different label, port: 4002, prio: 2, latencyProfile: Low, type: Multicast}
      source: https://developer.axis.com/vapix/audio-systems/audio-multicast-controller/#list-all-sources
  get_source:
    summary: One source.
    effect: read
    binding: {method: GET, path: "/sources/{id}"}
    params:
      type: object
      x-name: SourceIdRequest
      required: [id]
      properties:
        id: {$ref: '#/types/ID'}
    result: {$ref: '#/types/Source'}
  add_source:
    summary: Add a multicast source.
    effect: write
    write: create
    binding: {method: POST, path: /sources, body: object}
    params: {$ref: '#/types/AddSourceRequest'}
    examples:
    - title: Add a new multicast source
      request:
        path: /sources
        body:
          data:
            ipAddress: 239.0.0.1
            label: This is a label
            port: 4000
            prio: 1
            latencyProfile: Normal
            srtpKey: A hexadecimal string that is 60 or 92 characters long
            type: Multicast
      response:
        status: 200
        body: {status: success}
      source: https://developer.axis.com/vapix/audio-systems/audio-multicast-controller/#add-a-new-multicast-source
  remove_source:
    summary: Delete a multicast source.
    description: Internal sources cannot be removed. The remaining sources are re-ranked so that no priority gaps remain.
    effect: write
    write: delete
    binding: {method: DELETE, path: "/sources/{id}"}
    params:
      type: object
      x-name: SourceIdRequest
      required: [id]
      properties:
        id: {$ref: '#/types/ID'}
  set_source_ip_address:
    summary: Set the ipAddress of a source.
    effect: write
    write: patch
    binding: {method: PATCH, path: "/sources/{id}/ipAddress", body_field: ipAddress, body: value}
    params:
      type: object
      x-name: SetSourceIpAddressRequest
      required: [id, ipAddress]
      properties:
        id: {$ref: '#/types/ID'}
        ipAddress: {$ref: '#/types/IpAddress', description: The multicast address to listen to. Valid values 224.0.0.0 - 239.255.255.255.}
  set_source_label:
    summary: Set the label of a source.
    effect: write
    write: patch
    binding: {method: PATCH, path: "/sources/{id}/label", body_field: label, body: value}
    params:
      type: object
      x-name: SetSourceLabelRequest
      required: [id, label]
      properties:
        id: {$ref: '#/types/ID'}
        label: {$ref: '#/types/Label', description: The nicename of the source.}
  set_source_latency_profile:
    summary: Set the latencyProfile of a source.
    effect: write
    write: patch
    binding: {method: PATCH, path: "/sources/{id}/latencyProfile", body_field: latencyProfile, body: value}
    params:
      type: object
      x-name: SetSourceLatencyProfileRequest
      required: [id, latencyProfile]
      properties:
        id: {$ref: '#/types/ID'}
        latencyProfile: {$ref: '#/types/LatencyProfile', description: Time delay between audio input (RTP packet from the multicast source) and audio output.}
  set_source_port:
    summary: Set the port of a source.
    effect: write
    write: patch
    binding: {method: PATCH, path: "/sources/{id}/port", body_field: port, body: value}
    params:
      type: object
      x-name: SetSourcePortRequest
      required: [id, port]
      properties:
        id: {$ref: '#/types/ID'}
        port: {$ref: '#/types/Port', description: The device port from which the audio source originates.}
  set_source_prio:
    summary: Set the prio of a source.
    description: Setting the priority keeps the source list consistent. The other sources are re-ranked so that there are no duplicate priorities or gaps; adding or removing a source does the same.
    effect: write
    write: patch
    binding: {method: PATCH, path: "/sources/{id}/prio", body_field: prio, body: value}
    params:
      type: object
      x-name: SetSourcePrioRequest
      required: [id, prio]
      properties:
        id: {$ref: '#/types/ID'}
        prio: {$ref: '#/types/Priority', description: Priority of the multicast source.}
    examples:
    - title: Prioritize a source
      request:
        path: /sources/ID/prio
        body: {data: 1}
      response:
        status: 200
        body: {status: success}
      source: https://developer.axis.com/vapix/audio-systems/audio-multicast-controller/#prioritize-a-source
  set_source_srtp_key:
    summary: Set the srtpKey of a source.
    effect: write
    write: patch
    binding: {method: PATCH, path: "/sources/{id}/srtpKey", body_field: srtpKey, body: value}
    params:
      type: object
      x-name: SetSourceSrtpKeyRequest
      required: [id, srtpKey]
      x-masked: [srtpKey]
      properties:
        id: {$ref: '#/types/ID'}
        srtpKey: {$ref: '#/types/SRTPKey', description: The SRTP key for encrypted multicast sources.}
  set_source_type:
    summary: Set the type of a source.
    effect: write
    write: patch
    binding: {method: PATCH, path: "/sources/{id}/type", body_field: type, body: value}
    params:
      type: object
      x-name: SetSourceTypeRequest
      required: [id, type]
      properties:
        id: {$ref: '#/types/ID'}
        type: {$ref: '#/types/SourceType', description: 'Internal (SIP, VAPIXAudio, VAPIXMediaClip; only priority changeable) or Multicast (user created).'}

sources:
- url: https://developer.axis.com/vapix/audio-systems/audio-multicast-controller/
  sha256_md: 80150a5aeb3ae1c3c571846cc609e51a66b2342c9b3aa16f896e65b6c839d804
  retrieved_at: '2026-10-11'

provenance:
  completeness: complete
  open_questions:
  - 'Property naming: the API objects table uses ''audioCodec'' and ''latencyProfile''; examples use path ''audiocodec''
    and body/response key ''profile''. The table names are used and the examples were corrected to match.'
  - 'Required fields for add: the text says ipAddress, label and port are required; the API objects table lists only
    label. The table is followed.'
  - 'Priority is declared ''type: string'' with minimum/maximum 1-13, but the text and examples use integers; modelled
    as integer.'
  - 'Delete example URL omits the source ID (DELETE /config/rest/audio-multicast-ctrl/v1beta/sources) although the
    text says the ID is the key; the path /sources/{id} is used.'
  - 'The add example response is only {status: success}; the generated ID is not returned, so it has to be found
    with list_sources.'
  - The list example lacks srtpKey; whether it is masked or omitted in responses is not stated.
  - 'SourceState event: possible State values are not documented; the topic''s root namespace (tns1:...?) is not
    shown, only tnsaxis:AudioMulticastController/SourceState.'
  - IpAddress type says 'The IPv4 address' with maxLength 39 (IPv6 length).
  - AXIS OS minimum version not stated; the API is BETA (v1beta).
  - Per-property GET operations are not generated; get_all and get_source return the values.
  migrated_from: v1
  curated: true
