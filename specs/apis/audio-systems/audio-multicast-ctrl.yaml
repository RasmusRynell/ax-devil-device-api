format: 2
id: audio-multicast-ctrl
name: Audio Multicast Controller
summary: Configure audio devices to receive multicast audio and prioritize between multicast and internal sources
  (SIP, VAPIX audio, media clips).
section: audio-systems
family: dca
status: beta
python:
  module: audio_multicast_ctrl
  class: AudioMulticastCtrl
docs:
- https://developer.axis.com/vapix/audio-systems/audio-multicast-controller/
access: admin
discovery:
- dca: {api: audio-multicast-ctrl, version: v1beta}

binding: {root: /config/rest/audio-multicast-ctrl/v1beta}

types:
  ID: {type: string, maxLength: 63, description: A unique ID.}
  SRTPKey:
    type: string
    maxLength: 127
    description: An SRTP key used for encrypted multicast sources.
  Label: {type: string, maxLength: 31, description: A string used to describe entities.}
  Priority:
    type: string
    minimum: 1
    maximum: 13
    description: The priority of the multicast source. Doc declares type string with minimum/maximum, but examples
      use integers (see open_questions).
  LatencyProfile:
    type: string
    enum: [Normal, Low, UltraLow]
    description: The time delay between the audio input (RTP packets received from the multicast source) and audio
      output (sound played through the speaker). Different sources have different latency requirements.
  Port: {type: integer, minimum: 1024, maximum: 65534, description: The transport layer port.}
  AudioCodec: {type: string, enum: [PCMU, PCMA], description: The supported audio codecs.}
  SourceType:
    type: string
    enum: [Multicast, Internal]
    description: 'Internal: built-in media sources such as SIP, VAPIXAudio and VAPIXMediaClip; cannot be modified
      or removed apart from priority rank.'
  IpAddress:
    type: string
    maxLength: 39
    description: 'The IPv4 address. For sources: multicast address 224.0.0.0 - 239.255.255.255.'
  Source:
    type: object
    properties:
      id: {$ref: '#/types/ID'}
      ipAddress: {$ref: '#/types/IpAddress'}
      label: {$ref: '#/types/Label'}
      port: {$ref: '#/types/Port'}
      prio: {$ref: '#/types/Priority'}
      profile:
        $ref: '#/types/LatencyProfile'
        description: Name used in examples; the API objects table calls this property latencyProfile (see open_questions).
      latencyProfile: {$ref: '#/types/LatencyProfile'}
      srtpKey: {$ref: '#/types/SRTPKey'}
      type: {$ref: '#/types/SourceType'}
  AudioMulticastCtrl:
    type: object
    description: The whole API tree.
    properties:
      audioCodec:
        $ref: '#/types/AudioCodec'
        description: Determines which audio codec should be used. Applies to all multicast sources.
      enabled: {type: boolean, description: Turns ON/OFF the Audio Multicast Controller.}
      sources:
        type: array
        items: {$ref: '#/types/AudioMulticastCtrlSource'}
  AudioMulticastCtrlSource:
    type: object
    description: A multicast source. Contains all sources except RTCP.
    required: [id]
    x-read-only: [id]
    properties:
      id: {description: A unique source ID generated by the backend.}
      ipAddress: {description: The multicast address to listen to. Valid values 224.0.0.0 - 239.255.255.255.}
      label: {description: The nicename of the source.}
      latencyProfile:
        description: Time delay between audio input (RTP packet from the multicast source) and audio output.
      port: {description: The device port from which the audio source originates.}
      prio: {description: Priority of the multicast source.}
      srtpKey: {description: The SRTP key for encrypted multicast sources.}
      type:
        description: Internal (SIP, VAPIXAudio, VAPIXMediaClip; only priority changeable) or Multicast (user created).

operations:
  get_all:
    summary: All data of the Audio Multicast Controller API.
    effect: read
    binding: {method: GET, path: ''}
    result:
      type: object
      properties:
        audioCodec: {$ref: '#/types/AudioCodec'}
        enabled: {type: boolean}
        sources:
          type: array
          items: {$ref: '#/types/Source'}
  set_enabled:
    summary: Set the enabled of the device.
    effect: write
    write: patch
    binding: {method: PATCH, path: /enabled, body_field: enabled, body: value}
    params:
      type: object
      required: [enabled]
      properties:
        enabled: {type: boolean, description: Turns ON/OFF the Audio Multicast Controller.}
    examples:
    - title: Toggle Audio Multicast Controller
      request:
        path: /enabled
        body: {data: true}
      response:
        status: 200
        body: {status: success}
      source: https://developer.axis.com/vapix/audio-systems/audio-multicast-controller/#toggle-audio-multicast-controller
  set_audio_codec:
    summary: Set the audio codec of the device.
    effect: write
    write: patch
    binding: {method: PATCH, path: /audioCodec, body_field: audioCodec, body: value}
    params:
      type: object
      required: [audioCodec]
      properties:
        audioCodec:
          $ref: '#/types/AudioCodec'
          description: Determines which audio codec should be used. Applies to all multicast sources.
    examples:
    - title: Adjust the audio codec
      request:
        path: /audiocodec
        body: {data: PCMU}
      response:
        status: 200
        body: {status: success}
      source: https://developer.axis.com/vapix/audio-systems/audio-multicast-controller/#adjust-the-audio-codec

