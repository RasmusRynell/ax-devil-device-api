    topics /topic/audiofiles, /topic/audioSessions, /topic/targets, /topic/volumeControllers, /topic/pagingConfigurations)
    speaks STOMP 1.0/1.1/1.2; the session runtime has no STOMP codec, and the payload formats are not documented.'
  - 'BLOCKED(binary-audio-format): the audio frame format (codec, sample rate) of the ws/recv, ws/send and ws/sendrecv
    connections is not documented here (see the "How To AXIS Audio Manager Pro API" document), so the session carries
    raw bytes only; the examples check the handshake path, not any audio.'
  - 'The server is not a device: Digest over HTTPS only, with the account set in the Audio Manager Pro System settings;
    the access level above is a placeholder.'
