format: 2
id: axis-audio-manager-pro-ws
name: AXIS Audio Manager Pro WebSocket audio
summary: Send and receive binary audio of an Audio Manager Pro audio session over a WebSocket.
section: audio-systems
family: ws
status: released
python:
  module: axis_audio_manager_pro_ws
  class: AxisAudioManagerProWs
docs:
- https://developer.axis.com/vapix/audio-systems/axis-audio-manager-pro-api/
access: admin
requires:
  application: AXIS Audio Manager Pro (server software)

binding: {}

operations:
  receive_audio:
    summary: Open a WebSocket that receives binary audio from a WS audio session.
    description: Audio is only transmitted over this connection if a duplex device is configured within the audio session.
      The frames are binary audio; the session passes them through unchanged (`bytes`). The audio session is a WS audio
      session created with the audio sessions REST API.
    effect: read
    binding:
      session: {path: '/api/v1.2/audioSessions/{audioSessionId}/ws/recv'}
    params:
      type: object
      required: [audioSessionId]
      properties:
        audioSessionId: {type: string, description: The ID of the WebSocket audio session.}
    examples:
    - title: Receive audio from a session
      request: {params: {audioSessionId: abc}, path: /api/v1.2/audioSessions/abc/ws/recv}
      source: https://developer.axis.com/vapix/audio-systems/axis-audio-manager-pro-api/#establish-websocket-connection-to-receive-audio-data
  send_audio:
    summary: Open a WebSocket that sends binary audio to a WS audio session.
    description: The audio stream must be sent in binary format (binary frames).
    effect: action
    binding:
      session: {path: '/api/v1.2/audioSessions/{audioSessionId}/ws/send'}
    params:
      type: object
      required: [audioSessionId]
      properties:
        audioSessionId: {type: string, description: The ID of the WebSocket audio session.}
    examples:
    - title: Send audio to a session
      request: {params: {audioSessionId: abc}, path: /api/v1.2/audioSessions/abc/ws/send}
      source: https://developer.axis.com/vapix/audio-systems/axis-audio-manager-pro-api/#establish-websocket-connection-to-send-audio-data
  send_receive_audio:
    summary: Open a bidirectional WebSocket that sends and receives binary audio of a WS audio session.
    description: Audio in both directions is binary frames.
    effect: action
    binding:
      session: {path: '/api/v1.2/audioSessions/{audioSessionId}/ws/sendrecv'}
    params:
      type: object
      required: [audioSessionId]
      properties:
        audioSessionId: {type: string, description: The ID of the WebSocket audio session.}
    examples:
    - title: Send and receive audio of a session
      request: {params: {audioSessionId: abc}, path: /api/v1.2/audioSessions/abc/ws/sendrecv}
      source: https://developer.axis.com/vapix/audio-systems/axis-audio-manager-pro-api/#establish-a-bidirectional-websocket-connection-to-send-audio-data

