format: 2
id: media-clip-api
name: Media clip API
summary: Play, stop, upload, remove, rename and download audio media clips stored on the device.
section: audio-systems
family: cgi
status: released
python: {module: media_clip, class: MediaClip}
docs:
- https://developer.axis.com/vapix/audio-systems/media-clip-api/
access: operator
discovery:
- {param: {name: Properties.Audio.Audio, value: 'yes'}}
requires: {firmware: '5.40'}
binding: {path: /axis-cgi/mediaclip.cgi}
operations:
  play_clip:
    summary: Play a clip (operator and above).
    description: The result is the device reply, for example OK followed by playing=0.
    effect: action
    binding: {method: GET, query: {action: play}, reply: text}
    positional: [clip]
    params:
      type: object
      properties:
        clip:
          type: integer
          minimum: 0
          description: The media clip to play (the number of MediaClip.M#). Not needed when location is used.
        audiooutput:
          type: integer
          minimum: 1
          description: Deprecated as of AXIS OS 11.7; use audiodeviceid and audiooutputid. The audio output that
            plays the clip (index + 1 of Properties.Audio.Source.A[index].Output = yes). Cannot be combined with
            audiodeviceid.
        repeat:
          type: integer
          minimum: -1
          description: 'Times to repeat the clip: -1 repeats forever, 0 (default) plays once. Only supported if
            Properties.AudioClip.PlayOptions includes repeat.'
        volume:
          type: integer
          minimum: 0
          maximum: 1000
          description: Clip volume in percent on a linear scale; 0 mutes, 100 is the default. Only supported if
            PlayOptions includes volume.
        location:
          type: string
          description: Location of the clip; clip is then not needed. * is a wildcard that plays a random matching
            clip. Only supported if PlayOptions includes location.
        audiodeviceid:
          type: integer
          minimum: 0
          description: The audio device that plays the clip. An alternative to audiooutput; it must be paired with
            audiooutputid. Only supported if PlayOptions includes audiodeviceid.
        audiooutputid:
          type: integer
          minimum: 0
          description: The output on the audio device that plays the clip. Required when audiodeviceid is given.
    result: {type: string}
    examples:
    - title: Play clip 0
      request: {query: {clip: '0'}}
      response:
        status: 200
        text: |-
          OK
          playing=0
      source: https://developer.axis.com/vapix/audio-systems/media-clip-api/#common-examples
    - title: Play clip 0 on audio device 0, output 0
      request: {query: {clip: '0', audiodeviceid: '0', audiooutputid: '0'}}
      response:
        status: 200
        text: |-
          OK
          playing=0
      source: https://developer.axis.com/vapix/audio-systems/media-clip-api/#common-examples
  stop_clip:
    summary: Stop any currently playing clip (operator and above).
    effect: action
    binding: {method: GET, query: {action: stop}, reply: text}
    result: {type: string}
    examples:
    - title: Stop a media clip
      request: {query: {}}
      response:
        status: 200
        text: |-
          OK
          stopping
      source: https://developer.axis.com/vapix/audio-systems/media-clip-api/#common-examples
  remove_clip:
    summary: Remove a clip.
    effect: write
    write: delete
    binding: {method: GET, query: {action: remove}, reply: text}
    positional: [clip]
    params: {type: object, required: [clip], properties: {clip: {type: integer, minimum: 0, description: The media
            clip to remove.}}}
    result: {type: string}
    examples:
    - title: Remove clip 2
      request: {query: {clip: '2'}}
      response:
        status: 200
        text: |-
          OK
          removed=2
      source: https://developer.axis.com/vapix/audio-systems/media-clip-api/#common-examples
  set_clip_name:
    summary: Change the name of a clip.
    effect: write
    write: patch
    binding: {method: GET, query: {action: update}, reply: text}
    positional: [clip, name]
    params: {type: object, required: [clip, name], properties: {clip: {type: integer, minimum: 0, description: The
            media clip to rename.}, name: {type: string, description: The new name of the media clip.}}}
    result: {type: string}
  download_clip:
    summary: Download a clip (for backup or editing).
    description: The device sends the stored audio file; the docs name audio/basic (au format).
    effect: read
    binding: {method: GET, query: {action: download}, reply: binary}
    positional: [clip]
    params: {type: object, required: [clip], properties: {clip: {type: integer, minimum: 0, description: The media
            clip to download.}}}
    result: {type: string, format: binary}
  play_clip_as_viewer:
    summary: Play a clip (viewer and above), through playclip.cgi.
    access: viewer
    effect: action
    binding: {path: /axis-cgi/playclip.cgi, method: GET, reply: text}
    positional: [clip]
    params:
      type: object
      properties:
        clip:
          type: integer
          minimum: 0
          description: The media clip to play (the number of MediaClip.M#). Not needed when location is used.
        audiooutput:
          type: integer
          minimum: 1
          description: Deprecated as of AXIS OS 11.7; use audiodeviceid and audiooutputid. The audio output that
            plays the clip (index + 1 of Properties.Audio.Source.A[index].Output = yes). Cannot be combined with
            audiodeviceid.
        repeat:
          type: integer
          minimum: -1
          description: 'Times to repeat the clip: -1 repeats forever, 0 (default) plays once. Only supported if
            Properties.AudioClip.PlayOptions includes repeat.'
        volume:
          type: integer
          minimum: 0
          maximum: 1000
          description: Clip volume in percent on a linear scale; 0 mutes, 100 is the default. Only supported if
            PlayOptions includes volume.
        location:
          type: string
          description: Location of the clip; clip is then not needed. * is a wildcard that plays a random matching
            clip. Only supported if PlayOptions includes location.
        audiodeviceid:
          type: integer
          minimum: 0
          description: The audio device that plays the clip. An alternative to audiooutput; it must be paired with
            audiooutputid. Only supported if PlayOptions includes audiodeviceid.
        audiooutputid:
          type: integer
          minimum: 0
          description: The output on the audio device that plays the clip. Required when audiodeviceid is given.
    result: {type: string}
  stop_clip_as_viewer:
    summary: Stop any currently playing clip (viewer and above), through stopclip.cgi.
    description: Supported if Properties.AudioClip.StopClip is yes.
    access: viewer
    effect: action
    binding: {path: /axis-cgi/stopclip.cgi, method: GET, reply: text}
    result: {type: string}
  list_clips:
    summary: 'List the media clips as ``{"MediaClip.M0.Name": "value"}`` (``root.`` removed).'
    description: Goes through the parameter management CGI. Each clip has Name, Location and Type; MaxGroups and
      MaxUploadSize are also in the MediaClip group.
    access: viewer
    effect: read
    binding: {path: /axis-cgi/param.cgi, method: GET, query: {action: list, group: MediaClip}, reply: {text_kv: {
          strip_prefix: root.}}}
    result: {type: object, additionalProperties: {type: string}}
    examples:
    - title: List all media clips
      request: {query: {}}
      response:
        status: 200
        text: |-
          root.MediaClip.M0.Name=My new clip
          root.MediaClip.M0.Location=/etc/audioclips/MediaClip.M0.au
          root.MediaClip.M0.Type=audio
          root.MediaClip.M1.Name=My new clip1
          root.MediaClip.M1.Location=/etc/audioclips/MediaClip.M1.au
          root.MediaClip.M1.Type=audio
          root.MediaClip.M2.Name=My new clip2
          root.MediaClip.M2.Location=/etc/audioclips/MediaClip.M2.au
          root.MediaClip.M2.Type=audio
      source: https://developer.axis.com/vapix/audio-systems/media-clip-api/#common-examples
sources:
