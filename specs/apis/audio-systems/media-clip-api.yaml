  retrieved_at: '2026-10-11'
provenance:
  completeness: partial
  open_questions:
  - 'BLOCKED(multipart upload): upload_clip - POST /axis-cgi/mediaclip.cgi?action=upload&media=audio&name=<name>
    with the audio file as multipart/form-data in the body (mixed query and multipart).'
  - The docs give no explicit required parameters; clip is required for remove, update and download, and name for
    update, by the nature of the action.
  - The upload curl example omits media=audio although it is required for action=upload.
  - The success reply is OK followed by playing=<clip>, removed=<clip>, uploaded=<clip>, updated=<clip> or stopping;
    the examples reconstruct it from that syntax. The reply is returned as text.
  - Download is documented as audio/basic (au format) although clips can be wav, mp3, opus or vorbis; the media
    type is not checked.
  - mediaclip.cgi is documented for Administrator and Operator; the access of param.cgi listing is taken as viewer
    from the MediaClip.M# read access.
  - The discovery property Properties.Audio.Source.A#.Output=yes and Properties.AudioClip.PlayOptions are not name=value
    pairs and are not used for discovery; Properties.AudioClip.StopClip=yes says whether stopclip.cgi exists.
  - The docs write 'medicalips' in the audiooutput description (typo for media clips).
  migrated_from: v1
  curated: true
