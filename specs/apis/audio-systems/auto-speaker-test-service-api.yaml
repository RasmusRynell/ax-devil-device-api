  retrieved_at: '2026-10-11'

provenance:
  completeness: complete
  open_questions:
  - The page does not state the endpoint; /vapix/axast is taken from the curl examples in the Call service API and
    network-video pages.
  - Faults are documented as env:Receiver/ter:Action/<subcode> triples; they are keyed here by the subcode.
  - The event declaration lists only OK and Failed values for SpeakerTestStatus, while the enum has seven values.
  - Timestamps are typed dateTime but are empty strings when not set, so they are modelled as strings.
  - AXIS OS minimum version not stated.
  migrated_from: v1
  curated: true
