provenance:
  completeness: complete
  open_questions:
  - 'transmit.cgi: text says ''There are no arguments and values'' but an argument table (audiodeviceid, audiooutputid)
    is given; syntax shows ''[&=<value>]'' without ''?''. Modelled with the two arguments in the URL query.'
  - transmit.cgi success response body/status not documented ('will generate a server response for every successful
    playback'); returned as text.
  - receive.cgi 400 failed-request bodies are not modelled as examples (errors are raised before a stream is returned).
  - 'BLOCKED(stream-multipart-audio): multipart receive.cgi parts are returned as raw bytes (the stream decoder
    is for JPEG parts); the caller must split the boundaries.'
  - AudioSource.A#.AudioEncoding valid values list 'lcpm' (probably lpcm).
  - MicrophonePowerType description references 'MicrphonePower' (typo).
  - Audio.DuplexMode table lists 'get' and 'post' meanings opposite to Properties.Audio.DuplexMode wording ('post'
    = product can transmit simplex audio vs 'post' = send audio to the product).
  - Event data nice name rendered as 'Above alarm leve`l' (typo).
  - Gain parameters accept 'mute'/'inherit' or numbers; typed as string.
  migrated_from: v1
  curated: true
