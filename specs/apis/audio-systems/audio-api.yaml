format: 2
id: audio-api
name: Audio API
summary: Receive (receive.cgi) and transmit (transmit.cgi) audio over HTTP, and build RTSP URLs with audio. Audio settings
  are the Audio and AudioSource parameter groups (Parameter management API).
section: audio-systems
family: cgi
status: released
python:
  module: audio
  class: Audio
docs:
- https://developer.axis.com/vapix/audio-systems/audio-api/
access: viewer
discovery:
- param: {name: Properties.API.HTTP.Version, value: '3'}
- param: {name: Properties.Audio.Audio, value: 'yes'}
- {api_discovery: audio-device-control}
requires:
  firmware: '5.00'

binding: {path: /axis-cgi/audio/receive.cgi}

errors:
  400: {description: 'Bad request. The request had a bad syntax, or could not be implemented (an invalid parameter value).', kind: invalid_argument}
  405: {description: 'Method not allowed. The GET/POST is not allowed in the current (duplex) mode.', kind: unsupported}
  415: {description: 'Unsupported media type. The request is not in an acceptable format and can not be processed.', kind: invalid_argument}
  503: {description: 'Service unavailable. The maximum number of clients are already connected.', kind: unavailable}

operations:
  receive_audio:
    summary: Request and configure an audio stream from the device (singlepart or multipart).
    description: Singlepart (default) streams a continuous flow of audio packets in the codec's MIME type, with the content
      type only set at the start of the connection; multipart (`httptype=multipart`) answers `multipart/x-mixed-replace`
      with one audio block per part (G.711 512 bytes, G.726 32 kbit/s 256 bytes, G.726 24 kbit/s 192 bytes; AAC is not
      supported). The stream is returned as raw bytes, also for multipart, so split the parts yourself.
    effect: read
    binding: {method: GET, reply: stream}
    params:
      type: object
      properties:
        audio: {type: integer, enum: [0, 1], description: Enable (1) or disable (0) audio.}
        audiobitrate: {type: integer, minimum: 8000, description: The audio bit rate in bps. (unit=bps)}
        audiocodec:
          type: string
          enum: [g711, g726, aac, opus, lpcm]
          description: The audio codec type.
        audiosamplerate: {type: integer, minimum: 8000, description: The audio sample rate in Hz. (unit=Hz)}
        camera:
          type: integer
          minimum: 1
          description: Select the audio configuration in Audio.A#. camera=1 -> Audio.A0. Number of configurations
            is product-dependent.
        httptype:
          type: string
          enum: [singlepart, multipart]
          description: 'Choose streaming method. Some proxies require multipart. Default: parameter Audio.A#.HTTPMessageType.'
        audiochannel:
          type: integer
          minimum: 1
          description: Select the audio source in AudioSource.A#. audiochannel=2 -> AudioSource.A1. Mutually exclusive
            with audiodeviceid+audioinputid.
        audiodeviceid:
          type: string
          description: The audio device ID (id from Audio Device Control API). Supported only if audio-device-control
            status is official in API discovery. Mutually exclusive with audiochannel.
        audioinputid:
          type: string
          description: The audio device input ID (id from Audio Device Control API). Same support condition as audiodeviceid.
        audionbrofchannels: {type: integer, minimum: 1, description: The number of audio channels.}
    examples:
    - title: Request an audio stream
      request: {query: {}}
      response: {status: 200, content_type: audio/basic, text: AUDIO}
      source: https://developer.axis.com/vapix/audio-systems/audio-api/#audio-data-request
    - title: Request a singlepart audio stream using HTTP
      request: {query: {httptype: singlepart}}
      response: {status: 200, content_type: audio/basic, text: AUDIO}
      source: https://developer.axis.com/vapix/audio-systems/audio-api/#singlepart-audio-data-response
    - title: Request a multipart audio stream using HTTP
      request: {query: {httptype: multipart}}
      response:
        status: 200
        content_type: multipart/x-mixed-replace; boundary=myboundary
        text: "--myboundary\r\nContent-Type: audio/G726-32\r\nContent-Length: 5\r\n\r\nAUDIO\r\n--myboundary\r\n"
      source: https://developer.axis.com/vapix/audio-systems/audio-api/#multipart-audio-data-response
  transmit_audio:
    summary: Transmit an audio stream to the device (POST audio data to transmit.cgi).
    description: 'Sends the audio as the request body. The content type is set once at the start of the connection and
      defaults to `audio/basic` (G.711 mu-law); pass an `Upload` with another `content_type` (for example `audio/axis-mulaw-128`,
      `audio/G726-32`, `audio/opus`) for other formats. Check the supported decoders in `Properties.Audio.Decoder.Format`.
      The server answers every successful playback; if playback fails, the connection is closed without a response.'
    access: viewer
    effect: action
    binding:
      path: /axis-cgi/audio/transmit.cgi
      method: POST
      encoding: body
      reply: text
    params:
      type: object
      required: [audio]
      properties:
        audio: {type: string, format: binary, x-in: body, x-upload: {content_type: audio/basic}, description: The audio data.}
        audiodeviceid:
          type: string
          description: The audio device ID (id from Audio Device Control API). Supported only if audio-device-control status is official in API discovery.
        audiooutputid:
          type: string
          description: The audio device output ID. Same support condition as audiodeviceid.
    result: {type: string}
    examples:
    - title: Transmit singlepart audio using G.711 mu-law
      request: {body: AUDIO, content_type: audio/basic}
      response: {status: 200, text: ''}
      source: https://developer.axis.com/vapix/audio-systems/audio-api/#transmit-audio-data
  rtsp_audio_stream_url:
    summary: Request an RTSP stream including audio.
    description: RTSP streams include audio if the request contains audio=1 or if Audio.A#.Enabled and AudioSource.A#.AudioSupport
      are enabled; audio=0 excludes audio. When AudioSource.A#.AudioSupport is enabled, the camera and audiochannel
      arguments of receive.cgi can be used; camera specifies both video source and audio configuration.
    effect: read
    binding:
      rtsp: {}
    params:
      type: object
      properties:
        videocodec: {type: string, description: 'The video codec of the media stream, for example h264 (the docs example requests video and audio).'}
        audio: {type: integer, enum: [0, 1], description: '1 includes audio, 0 excludes it even when the parameters enable it.'}
        camera: {type: integer, minimum: 1, description: 'Video source and audio configuration (Audio.A#; camera=1 is Audio.A0).'}
        audiochannel: {type: integer, minimum: 1, description: 'The audio source (AudioSource.A#; audiochannel=2 is AudioSource.A1). Only when AudioSource.A#.AudioSupport is enabled.'}
    examples:
    - title: Request an RTSP stream with video and audio
      request: {params: {videocodec: h264, audio: 1}}
      response: {url: 'rtsp://camera.test:554/axis-media/media.amp?videocodec=h264&audio=1'}
      source: https://developer.axis.com/vapix/audio-systems/audio-api/#common-examples

