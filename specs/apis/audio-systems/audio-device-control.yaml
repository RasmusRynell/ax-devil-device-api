  retrieved_at: '2026-10-11'

provenance:
  completeness: complete
  open_questions:
  - 'The getDevicesCapabilities example uses ''signalTypes'' for the first connection type and ''signalingTypes'' elsewhere;
    the response syntax uses ''signalingTypes''. The example was corrected.'
  - 'The getDevicesSettings response syntax uses ''signalingTypesSelected'' for outputs vs ''signalingTypeSelected''
    for inputs; the parameter table and examples use ''signalingTypeSelected'' for both.'
  - The setDevicesSettings table rows for outputs.id/name/connectionTypeSelected have wrong descriptions (channel
    ID/gain/mute), a copy error.
  - Example device id 'Q1615-MkIII' with name 'Q1655-MkIII Audio Device' (inconsistent model).
  - Units and semantics of gainValues (integers 1, 2, 4) and channel gain are not documented. Whether setDevicesSettings
    accepts partial structures is not stated; modelled as patch.
  - 'Versions: examples use apiVersion 1.0, getSupportedVersions returns ["1.3", "2.1"], and differences between
    versions are not documented. Modelled as major 1 (1.0, 1.3); major 2 is not covered.'
  - Obsoletes list says 'MicrophoneBalance' while the Audio API parameter is 'MicrophoneBalanced'.
  - AXIS OS minimum version not stated.
  migrated_from: v1
  curated: true
