format: 2
id: audio-device-control
name: Audio Device Control
summary: List audio device capabilities and read or change audio device input/output settings (connection type, signaling type, power type, per-channel gain and mute).
section: audio-systems
family: jsonrpc
status: released
python:
  module: audio_device_control
  class: AudioDeviceControl
docs:
- https://developer.axis.com/vapix/audio-systems/audio-device-control/
access: operator
discovery:
- {api_discovery: audio-device-control}

binding:
  path: /axis-cgi/audiodevicecontrol.cgi
  major: 1
  versions: ['1.0', '1.3']
  negotiation:
    get_supported_versions: {key: apiVersions}
  params_placement: params

errors:
  1100: {description: INTERNAL_ERROR. Internal error., kind: internal}
  2100:
    description: UNSUPPORTED_API_VERSION. The requested API version is not supported.
    kind: unsupported
  2101:
    description: JSON_INVALID_ERROR. The provided JSON input was invalid.
    kind: invalid_argument
  2102: {description: METHOD_NOT_SUPPORTED. Method not supported., kind: unsupported}
  2103:
    description: JSON_KEY_NOT_FOUND. A mandatory input parameter was not found in the input.
    kind: invalid_argument
  2104:
    description: PARAM_INVALID_VALUE_ERROR. Invalid parameter value specified.
    kind: invalid_argument
  2105: {description: AUTHORIZATION_ERROR. Authorization failed., kind: access_denied}
  2106: {description: AUTHENTICATION_ERROR. Authentication failed., kind: access_denied}
  2107: {description: TRANSPORT_LEVEL_ERROR. Transport level error.}

types:
  SignalingTypeCapability:
    type: object
    description: One signal configuration (for example balanced or unbalanced) of a connection type.
    required: [id]
    properties:
      id: {type: string, description: 'The signal ID (e.g. balanced, unbalanced). Cannot be changed.'}
      gainValues:
        type: array
        items: {type: integer}
        description: The gain capabilities for the signaling type.
      powerTypes:
        type: array
        items: {type: string}
        description: The power types available for the signal (inputs only; e.g. On, Off, P48, 5V).
  ConnectionTypeCapability:
    type: object
    description: One input or output type (for example mic, line or external) and its signal configurations.
    required: [id]
    properties:
      id: {type: string, description: 'Input/output type ID (e.g. internal, mic, line, external).'}
      signalingTypes:
        type: array
        items: {$ref: '#/types/SignalingTypeCapability'}
        description: Lists the signal configuration settings.
  IoCapability:
    type: object
    description: The capabilities of one audio input or output.
    required: [id]
    properties:
      id: {type: string, description: The input/output ID.}
      connectionTypes:
        type: array
        items: {$ref: '#/types/ConnectionTypeCapability'}
        description: Lists the input or output types.
  DeviceCapability:
    type: object
    description: The capabilities of one audio device.
    required: [id]
    properties:
      id: {type: string, description: The audio device ID.}
      inputs:
        type: array
        items: {$ref: '#/types/IoCapability'}
        description: Lists the inputs on a device.
      outputs:
        type: array
        items: {$ref: '#/types/IoCapability'}
        description: Lists the outputs on a device.
  DevicesCapabilities:
    type: object
    description: The capabilities of all audio devices.
    required: [devices]
    properties:
      devices:
        type: array
        items: {$ref: '#/types/DeviceCapability'}
        description: Lists available audio devices.
  Channel:
    type: object
    description: One audio channel.
    required: [id]
    properties:
      id: {type: integer, description: The channel ID.}
      gain: {type: integer, description: The channel gain.}
      mute: {type: boolean, description: The channel mute.}
  SignalingTypeSettings:
    type: object
    description: The settings of one signal configuration.
    required: [id]
    properties:
      id: {type: string, description: The signal ID. Not changeable.}
      powerType: {type: string, description: The selected power type for a signal (inputs only).}
      channels:
        type: array
        items: {$ref: '#/types/Channel'}
        description: Lists the channels.
  ConnectionTypeSettings:
    type: object
    description: The settings of one input or output type.
    required: [id]
    properties:
      id: {type: string, description: Input/output type ID.}
      signalingTypeSelected: {type: string, description: The selected signal.}
      signalingTypes:
        type: array
        items: {$ref: '#/types/SignalingTypeSettings'}
        description: Lists the signal configuration settings.
  IoSettings:
    type: object
    description: The settings of one audio input or output.
    required: [id]
    properties:
      id: {type: string, description: The input/output ID.}
      name: {type: string, description: The input/output name.}
      connectionTypeSelected: {type: string, description: The selected input/output type.}
      connectionTypes:
        type: array
        items: {$ref: '#/types/ConnectionTypeSettings'}
        description: Lists the input or output types.
  DeviceSettings:
    type: object
    description: The settings of one audio device.
    required: [id]
    properties:
      id: {type: string, description: The audio device ID.}
      name: {type: string, description: The audio device name.}
      inputs:
        type: array
        items: {$ref: '#/types/IoSettings'}
        description: Lists the inputs on a device.
      outputs:
        type: array
        items: {$ref: '#/types/IoSettings'}
        description: Lists the outputs on a device.
  DevicesSettings:
    type: object
    description: The settings of all audio devices.
    required: [devices]
    properties:
      devices:
        type: array
        items: {$ref: '#/types/DeviceSettings'}
        description: Lists available audio devices.
  SetDevicesSettingsRequest:
    type: object
    description: Arguments of ``set_devices_settings``.
    required: [devices]
    properties:
      devices:
        type: array
        items: {$ref: '#/types/DeviceSettings'}
        description: The audio devices to configure (same structure as get_devices_settings).
  HazardousSettings:
    type: object
    description: Settings that may harm the hardware if used incorrectly. They are global.
    required: [powerTypes]
    properties:
      powerTypes:
        type: array
        items: {type: string}
        description: The hazardous power types, e.g. ["R12"].

operations:
  get_devices_capabilities:
    summary: Lists all audio capabilities (accepted gain values and power types) of the device's audio devices.
    effect: read
    binding: {method: getDevicesCapabilities}
    result: {$ref: '#/types/DevicesCapabilities'}
    examples:
    - title: Retrieve audio capabilities
      request:
        params: {}
      response:
        data:
          devices:
          - id: Q1615-MkIII
            inputs:
            - id: '0'
              connectionTypes:
              - id: internal
                signalingTypes:
                - {id: unbalanced, gainValues: [1, 2, 4], powerTypes: ['On', 'Off']}
              - id: mic
                signalingTypes:
                - {id: balanced, gainValues: [1, 2, 4], powerTypes: [P48, 'Off']}
                - {id: unbalanced, gainValues: [1, 2, 4], powerTypes: [5V, 'Off']}
              - id: line
                signalingTypes:
                - {id: balanced, gainValues: [1, 2, 4], powerTypes: ['On', 'Off']}
                - {id: unbalanced, gainValues: [1, 2, 4], powerTypes: ['On', 'Off']}
            - id: '1'
              connectionTypes:
              - id: mic
                signalingTypes:
                - {id: balanced, gainValues: [1, 2, 4], powerTypes: [P48, 'Off']}
                - {id: unbalanced, gainValues: [1, 2, 4], powerTypes: [5V, 'Off']}
            outputs:
            - id: '0'
              connectionTypes:
              - id: external
                signalingTypes:
                - {id: unbalanced, gainValues: [1, 2, 4]}
      source: https://developer.axis.com/vapix/audio-systems/audio-device-control/#retrieve-audio-capabilities
  get_devices_settings:
    summary: Lists all available and currently applied audio settings.
    access: viewer
    effect: read
    binding: {method: getDevicesSettings}
    result: {$ref: '#/types/DevicesSettings'}
    examples:
    - title: Retrieve current device settings
      request:
        params: {}
      response:
        data:
          devices:
          - id: Q1615-MkIII
            name: Q1655-MkIII Audio Device
            inputs:
            - id: '0'
              name: Conference Room 42
              connectionTypeSelected: internal
              connectionTypes:
              - id: internal
                signalingTypeSelected: unbalanced
                signalingTypes:
                - id: unbalanced
                  powerType: 'Off'
                  channels:
                  - {id: 1, gain: 0, mute: false}
                  - {id: 3, gain: 0, mute: false}
              - id: mic
                signalingTypeSelected: balanced
                signalingTypes:
                - id: balanced
                  powerType: P48
                  channels:
                  - {id: 1, gain: 0, mute: false}
                - id: unbalanced
                  powerType: 'Off'
                  channels:
                  - {id: 1, gain: 0, mute: false}
              - id: line
                signalingTypeSelected: balanced
                signalingTypes:
                - id: balanced
                  powerType: 'Off'
                  channels:
                  - {id: 1, gain: 0, mute: false}
                - id: unbalanced
                  powerType: 'Off'
                  channels:
                  - {id: 1, gain: 0, mute: false}
            - id: '1'
              name: Dining Room
              connectionTypeSelected: internal
              connectionTypes:
              - id: mic
                signalingTypeSelected: balanced
                signalingTypes:
                - id: balanced
                  powerType: P48
                  channels:
                  - {id: 1, gain: 0, mute: false}
                - id: unbalanced
                  powerType: 5V
                  channels:
                  - {id: 1, gain: 0, mute: false}
            outputs:
            - id: '0'
              name: Loudspeaker 2
              connectionTypeSelected: external
              connectionTypes:
              - id: external
                signalingTypeSelected: unbalanced
                signalingTypes:
                - id: unbalanced
                  channels:
                  - {id: 1, gain: 0, mute: false}
                  - {id: 0, gain: 4, mute: false}
      source: https://developer.axis.com/vapix/audio-systems/audio-device-control/#retrieve-current-device-settings
  set_devices_settings:
    summary: Change the audio settings for one or multiple audio devices.
    effect: write
    write: patch
    binding: {method: setDevicesSettings}
    params: {$ref: '#/types/SetDevicesSettingsRequest'}
    round_trip:
      from: DevicesSettings
    examples:
    - title: Change device settings
      request:
        params:
          devices:
          - id: Q1615-MkIII
            name: Q1615-MkIII Audio Device
            inputs:
            - id: '0'
              name: Conference Room 42
              connectionTypeSelected: internal
              connectionTypes:
              - id: internal
                signalingTypeSelected: unbalanced
                signalingTypes:
                - id: unbalanced
                  powerType: 'Off'
                  channels:
                  - {id: 1, gain: 0, mute: false}
                  - {id: 3, gain: 0, mute: false}
              - id: mic
                signalingTypeSelected: balanced
                signalingTypes:
                - id: balanced
                  powerType: P48
                  channels:
                  - {id: 1, gain: 0, mute: false}
                - id: unbalanced
                  powerType: 'Off'
                  channels:
                  - {id: 1, gain: 0, mute: false}
              - id: line
                signalingTypeSelected: balanced
                signalingTypes:
                - id: balanced
                  powerType: 'Off'
                  channels:
                  - {id: 1, gain: 0, mute: false}
                - id: unbalanced
                  powerType: 'Off'
                  channels:
                  - {id: 1, gain: 0, mute: false}
            - id: '1'
              name: Dining Room
              connectionTypeSelected: internal
              connectionTypes:
              - id: mic
                signalingTypeSelected: balanced
                signalingTypes:
                - id: balanced
                  powerType: P48
                  channels:
                  - {id: 1, gain: 0, mute: false}
                - id: unbalanced
                  powerType: 5V
                  channels:
                  - {id: 1, gain: 0, mute: false}
            outputs:
            - id: '0'
              name: Loudspeaker 2
              connectionTypeSelected: external
              connectionTypes:
              - id: external
                signalingTypeSelected: unbalanced
                signalingTypes:
                - id: unbalanced
                  channels:
                  - {id: 1, gain: 0, mute: false}
                  - {id: 0, gain: 4, mute: false}
      response:
        data: {}
      source: https://developer.axis.com/vapix/audio-systems/audio-device-control/#change-device-settings
  get_hazardous_settings:
    summary: List settings that may harm the hardware if used incorrectly (global, not per device/input/output).
    access: operator
    effect: read
    binding: {method: getHazardousSettings}
    result: {$ref: '#/types/HazardousSettings'}
    examples:
    - title: Retrieve hazardous settings
      request:
        params: {}
      response:
        data: {powerTypes: [R12]}
      source: https://developer.axis.com/vapix/audio-systems/audio-device-control/#retrieve-hazardous-settings

sources:
- url: https://developer.axis.com/vapix/audio-systems/audio-device-control/
