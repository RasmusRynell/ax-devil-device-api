provenance:
  completeness: partial
  open_questions:
  - 'Session codec field: tables say ''codecs=<object>'' for HTTP and ''codec=<object>'' for WS; examples use ''codec''
    (object) for HTTP/WS and ''codecs'' (array) for RTP.'
  - One-shot parameter table omits 'targets' though the example body includes it.
  - customId is marked Optional in path-parameter tables for /custom/{customId} endpoints although it is a path
    segment.
  - 'Target table types: children/issues.major/minor documented with odd syntax (e.g. ''0=MULTICAST_ERROR''); lowestPriorityAvailable
    documented as ''0=LOW,1=MEDIUM,...'' — unclear whether wire values are strings or integers.'
  - Status 'playbackStarted' format '2023-01-12 12:53:32+0100' is not ISO 8601; availableDevices typed <string>
    but is an array.
  - 'Delete/stop/update responses: 200 with application/json declared, body not documented.'
  - Visual profile textTimeLimit references 'textAudioSync' which is not otherwise defined (field is audioSync).
  - Paths all use /api/v1.2 while version history mentions API 1.0 and 1.1; status endpoint 'introduced in 1.1'.
  - STOMP notification message payloads not documented.
  - curl examples use http:// while only HTTPS is supported.
  - Example responses for create session, one-shot, get session (by id), get audio file and get volume controller
    are JSON arrays although a single object is described; schema follows the prose (single object).
  - 'migration: allof: allOf mixing $ref and inline parts: $ref ignored'
  - 'migration: op-skipped: ws_recv_audio: kind ws_message (WebSocket or streaming) is deferred to phase 5'
  - 'migration: op-skipped: ws_send_audio: kind ws_message (WebSocket or streaming) is deferred to phase 5'
  - 'migration: op-skipped: ws_sendrecv_audio: kind ws_message (WebSocket or streaming) is deferred to phase 5'
  - 'migration: op-skipped: notifications: kind ws_message (WebSocket or streaming) is deferred to phase 5'
  - 'migration: discovery: discovery method http_probe dropped'
  - 'migration: types-dropped: types not referenced by any migrated operation: AudioSessionCommon, Priority'
  - 'migration: dropped-section: v1 section versioning not carried over'
  - 'migration: dropped-keywords: title x4'
  migrated_from: v1
  curated: false
