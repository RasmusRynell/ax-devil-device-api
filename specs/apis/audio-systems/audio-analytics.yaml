types:
  PluginSchema:
    type: object
    properties:
      $schema:
        type: string
        description: The URL for the core schema meta-schema (plugins use draft/2020-12, e.g. http://json-schema.org/draft/2020-12/schema#).
      title: {type: string, description: The schema title.}
      id: {type: string, description: Identification of the plugin.}
      type: {type: string, description: 'The settings type, usually an object.'}
      properties:
        type: object
        description: A unique JSON schema describing the properties of the settings objects returned by getPluginsSettings
          and sent by setPluginsSettings. Deviations from draft/2020-12 will be explained.
  PluginSettings:
    type: object
    required: [id, settings]
    properties:
      id:
        type: string
        description: The plugin instance id (e.g. AdaptiveAudioDetection, DirectionOfArrival, AggressionDetection).
      settings:
        type: object
        description: Settings parameters detailed by the response from getPluginsSchemas.
  IoPlugins:
    type: object
    properties:
      id: {type: string, description: The input/output id.}
      plugins:
        type: array
        items: {$ref: '#/types/PluginSettings'}
  AudioDevicePlugins:
    type: object
    properties:
      id: {type: string, description: The audio device id (as in Audio Device Control).}
      inputs:
        type: array
        items: {$ref: '#/types/IoPlugins'}
        description: Lists the device inputs.
      outputs:
        type: array
        items: {$ref: '#/types/IoPlugins'}
        description: Lists the device outputs.

operations:
  get_plugins_schemas:
    summary: Lists the JSON schema for all settings related to the analytics plugins.
    effect: read
    binding: {method: getPluginsSchemas}
    params:
      type: object
      properties:
        plugin:
          type: string
          description: The plugin name. Listed in the API specification table, but the common example sends empty
            params and gets all schemas (see open_questions).
    result:
      type: object
      properties:
        schemas:
          type: array
          items: {$ref: '#/types/PluginSchema'}
  get_plugins_settings:
    summary: Lists the plugin settings for all plugin instances for all audio sources.
    effect: read
    binding: {method: getPluginsSettings}
    result:
      type: object
      properties:
        devices:
          type: array
          items: {$ref: '#/types/AudioDevicePlugins'}
    examples:
    - title: getPluginsSettings
      request:
        params: {}
      response:
        data:
          devices:
          - id: '0'
            inputs:
            - id: '0'
              plugins:
              - id: AdaptiveAudioDetection
                settings: {enabled: true, threshold: -6}
              - id: DirectionOfArrival
                settings: {enable: true}
            outputs:
            - id: '0'
              plugins:
              - id: AggressionDetection
                settings: {enable: true, level: 0}
      source: https://developer.axis.com/vapix/audio-systems/audio-analytics/#audio-analytics-plugin
  set_plugins_settings:
    summary: Applies the plugin settings for plugin instances.
    effect: write
    write: patch
    binding: {method: setPluginsSettings}
    params:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items: {$ref: '#/types/AudioDevicePlugins'}
          description: List containing audio devices (table labels this data.devices[]).

