format: 2
id: audio-relay-service-api
name: Audio relay service API
summary: Configure an audio relay network (leader + follower peers), monitor peer status and set master volume via
  /vapix/audiorelay.
section: audio-systems
family: service_json
status: deprecated
python:
  module: audio_relay_service
  class: AudioRelayService
docs:
- https://developer.axis.com/vapix/audio-systems/audio-relay-service-api/
access: admin
discovery:
- param: {name: Properties.API.AudioRelay.Version, value: '1.2', compare: '>='}

binding: {path: /vapix/audiorelay}

types:
  AudioPeerId: {type: string, minLength: 0, maxLength: 64, description: Identifier of an Audio peer.}
  AudioPeerConnectionStatus:
    type: string
    enum:
    - Initiating
    - Offline
    - Online
    - AuthenticationFailed
    - InOtherPeerNetwork
    description: 'Non-normative enum (may be extended): Initiating = initial state; Offline = cannot establish connection;
      Online = connection established; AuthenticationFailed = invalid credentials; InOtherPeerNetwork = already
      allocated to other Audio Peer Network.'
  Range:
    type: object
    properties:
      Unit: {type: string, description: The unit of the value (e.g. dB).}
      MaxValue: {type: integer}
      MinValue: {type: integer}
  ServiceCapabilities:
    type: object
    description: Static optional functionality of the service.
    properties:
      MasterVolumeRanges: {$ref: '#/types/Range', description: Master volume ranges as supported by this service.}
  AudioPeerCredentials:
    type: object
    description: Credentials for accessing an audio peer at setup time. Password is never returned by GetAudioPeers
      (null).
    x-nullable: [Password]
    properties:
      User: {type: string, description: The user account name.}
      Password: {type: string, description: The un-encrypted password.}
  AudioPeerAddress:
    type: object
    description: Address of an audio peer; each field optional.
    properties:
      IPAddress: {type: string, description: The IP address.}
      MAC: {type: string, description: 'The MAC address in the form 00:00:00:00:00:00.'}
  GainDefinition:
    type: object
    properties:
      Name: {type: string, description: 'Name of the gain, e.g. AudioSource.A0.OutputGain'}
      Range:
        type: array
        items: {type: string}
        description: Valid gain values as retrieved from param.cgi action=listdefinitions (documented as String;
          examples show an array e.g. [Mute, -57,..., 6]).
  AudioPeerMetaData:
    type: object
    properties:
      Type: {type: string, description: The product type.}
  Gain:
    type: object
    properties:
      Name: {type: string, description: 'Name of the gain to set, e.g. AudioSource.A0.OutputGain'}
      Value:
        type: string
        description: The gain value. Must be valid according to the gain definition range.
  AudioPeerConfiguration:
    type: object
    description: Peer identified by IP or MAC.
    required: [Address]
    properties:
      Address: {$ref: '#/types/AudioPeerAddress', description: The audio peer network address.}
      OutputGain:
        type: array
        items: {$ref: '#/types/Gain'}
        description: Optional output gain for the audio peer, as described by its parameters retrieved with param.cgi.
      Id:
        $ref: '#/types/AudioPeerId'
        description: Optional. Unique within the network; generated by the device if empty or missing.
      Name: {type: string, description: Optional. A descriptive name for the audio peer.}
      Leader:
        type: boolean
        description: Optional. Set if this peer is the leader. False if not provided at creation; unchanged when
          modifying.
      Credentials:
        $ref: '#/types/AudioPeerCredentials'
        description: Optional; default credentials assumed if not available.
  AudioPeer:
    type: object
    properties:
      Configuration: {$ref: '#/types/AudioPeerConfiguration'}
      MetaData: {$ref: '#/types/AudioPeerMetaData'}
      ConnectionStatus: {$ref: '#/types/AudioPeerConnectionStatus'}
      OutputGainDefinitions:
        type: array
        items: {$ref: '#/types/GainDefinition'}
  DiscoveredAudioPeer:
    type: object
    properties:
      Address: {$ref: '#/types/AudioPeerAddress'}
      MetaData: {$ref: '#/types/AudioPeerMetaData'}
  AudioNetworkConfiguration:
    type: object
    description: All fields optional.
    properties:
      Name: {type: string, description: A descriptive name for the audio relay network.}
      Description: {type: string}
      MulticastEnabled: {type: boolean, description: Unicast (false/unset) or multicast.}
      MulticastGroup: {type: string, description: Multicast group address; default generated if unset.}
  AudioPeerStatus:
    type: object
    properties:
      Id: {$ref: '#/types/AudioPeerId'}
      ConnectionStatus: {$ref: '#/types/AudioPeerConnectionStatus'}
  SoundConfiguration:
    type: object
    description: All fields optional; valid values may be defined by service capabilities.
    properties:
      MasterVolume: {type: integer, description: The master volume of the Audio Relay network.}
      MasterVolumeUnit: {type: string, description: Unit of the master volume; optional if default unit used.}
      MasterVolumeMute: {type: boolean, description: Mutes the master volume of the Audio Relay Network.}

operations:
  get_service_capabilities:
    summary: Returns the capabilities of the service (master volume ranges).
    effect: read
    binding: {operation: 'axar:GetServiceCapabilities'}
    result:
      type: object
      required: [Capabilities]
      properties:
        Capabilities: {$ref: '#/types/ServiceCapabilities', description: The AudioRelay service capabilities.}
  set_audio_peer_configurations:
    summary: Set a list of audio peers as the Audio Relay network (replaces all existing configurations on the receiving
      device).
    description: Must not contain more than one leader and must always contain the address of the device receiving
      the request; otherwise the request fails. Optional AudioNetworkConfiguration (MulticastEnabled, MulticastGroup).
    effect: write
    write: replace
    binding: {operation: 'axar:SetAudioPeerConfigurations'}
    params:
      type: object
      required: [Configuration]
      properties:
        Configuration:
          type: array
          items: {$ref: '#/types/AudioPeerConfiguration'}
          description: AudioPeerConfiguration(s) to set.
        AudioNetworkConfiguration: {$ref: '#/types/AudioNetworkConfiguration'}
    result:
      type: object
      required: [AudioPeerId]
      properties:
        AudioPeerId:
          type: array
          items: {$ref: '#/types/AudioPeerId'}
          description: The IDs of the items provided.
    examples:
    - title: cURL JSON request for SetAudioPeerConfigurations
      request:
        params:
          Configuration:
          - Id: '1'
            Address: {IPAddress: 192.168.0.90}
            Leader: true
          - Id: '2'
            Address: {MAC: '00:40:8C:18:00:01'}
            Leader: false
      response:
        data: {AudioPeerId: ['1', '2']}
      source: https://developer.axis.com/vapix/audio-systems/audio-relay-service-api/#simple-curl-examples
    - title: Setup audio relay network using multicast
      request:
        params:
          Configuration:
          - Id: '1'
            Address: {IPAddress: 192.168.0.90}
            Leader: true
          - Id: '2'
            Address: {IPAddress: 192.168.0.91}
          AudioNetworkConfiguration: {MulticastEnabled: true}
      response:
        data: {AudioPeerId: ['1', '2']}
      source: https://developer.axis.com/vapix/audio-systems/audio-relay-service-api/#setup-audio-relay-network-using-multicast
  set_audio_peer_configuration:
    summary: Add or modify an audio peer in the Audio Relay network.
    description: If Id is not set or set to a non-existing ID, the call adds a new peer; if set to an existing ID,
      it modifies it. Must not leave the network with more or less than one leader.
    effect: write
    write: patch
    binding: {operation: 'axar:SetAudioPeerConfiguration'}
    params:
      type: object
      required: [Configuration]
      properties:
        Configuration: {$ref: '#/types/AudioPeerConfiguration'}
    result:
      type: object
      required: [AudioPeerId]
      properties:
        AudioPeerId: {$ref: '#/types/AudioPeerId', description: The ID of the added or modified audio peer.}
    examples:
    - title: Add audio peer (JSON)
      request:
        params:
          Configuration:
            Name: lobby speaker left
            Address: {IPAddress: 192.168.0.92}
      response:
        data: {AudioPeerId: AudioPeer_03}
      source: https://developer.axis.com/vapix/audio-systems/audio-relay-service-api/#add-audio-peer
    - title: Rename audio peer and change its output gain
      request:
        params:
          Configuration:
            Id: AudioPeer_01
            Name: lobby speaker left
            OutputGain:
            - {Name: AudioSource.A0.OutputGain, Value: '-6'}
            Address: {}
      response:
        data: {AudioPeerId: AudioPeer_01}
      source: https://developer.axis.com/vapix/audio-systems/audio-relay-service-api/#rename-audio-peer-and-change-its-output-gain
  get_audio_peers:
    summary: Returns the current Audio Relay network configuration of the receiving device.
    description: Unresolvable AudioPeerIds are ignored; if no AudioPeerId is supplied all peers are returned.
    effect: read
    binding: {operation: 'axar:GetAudioPeers'}
    params:
      type: object
      properties:
        AudioPeerId:
          type: array
          items: {$ref: '#/types/AudioPeerId'}
          description: IDs of the audio peers to get.
    result:
      type: object
      properties:
        Peer:
          type: array
          items: {$ref: '#/types/AudioPeer'}
          description: The peers of the Audio Relay network.
    examples:
    - title: cURL JSON request for GetAudioPeers (abridged; doc shows '...' inside Range)
      request:
        params: {}
      response:
        data:
          Peer:
          - Configuration:
              Id: '1'
              Address: {IPAddress: 192.168.0.90, MAC: '00:40:8C:18:00:00'}
              Leader: true
              Credentials: {User: root, Password: null}
              OutputGain:
              - {Name: AudioSource.A0.OutputGain, Value: '0'}
            MetaData: {Type: C2005}
            ConnectionStatus: Online
            OutputGainDefinitions:
            - {Name: AudioSource.A0.OutputGain, Range: [Mute, '-57', '...', '6']}
          - Configuration:
              Id: '2'
              Address: {IPAddress: 192.168.0.91, MAC: '00:40:8C:18:00:01'}
              Leader: false
              Credentials: {User: root, Password: null}
              OutputGain:
              - {Name: AudioSource.A0.OutputGain, Value: '0'}
            MetaData: {Type: C1004-E}
            ConnectionStatus: Online
            OutputGainDefinitions:
            - {Name: AudioSource.A0.OutputGain, Range: [Mute, '-57', '...', '6']}
      source: https://developer.axis.com/vapix/audio-systems/audio-relay-service-api/#simple-curl-examples
  get_discovered_audio_peers:
    summary: Returns a snapshot of Audio Relay peers discovered by the receiving device.
    effect: read
    binding: {operation: 'axar:GetDiscoveredAudioPeers'}
    result:
      type: object
      properties:
        Peer:
          type: array
          items: {$ref: '#/types/DiscoveredAudioPeer'}
          description: The discovered Audio Relay peers.
  remove_audio_peer:
    summary: Remove an audio peer (other than the recipient) from the network.
    effect: write
    write: delete
    binding: {operation: 'axar:RemoveAudioPeer'}
    params:
      type: object
      required: [AudioPeerId]
      properties:
        AudioPeerId: {type: string, maxLength: 64, description: Id of audio peer to remove.}
    errors:
      ter:InvalidArgVal: {description: Supplied ID is invalid (invalid values)., kind: invalid_argument}
    examples:
    - title: Remove audio peer (JSON)
      request:
        params: {AudioPeerId: AudioPeer_03}
      response:
        data: {}
      source: https://developer.axis.com/vapix/audio-systems/audio-relay-service-api/#remove-audio-peer
  set_audio_network_configuration:
    summary: Modify unicast/multicast network configuration without re-transmitting all peers (call the leader).
    effect: write
    write: patch
    binding: {operation: 'axar:SetAudioNetworkConfiguration'}
    params:
      type: object
      required: [AudioNetworkConfiguration]
      properties:
        AudioNetworkConfiguration: {$ref: '#/types/AudioNetworkConfiguration'}
    result:
      type: object
      properties:
        MulticastGroup:
          type: string
          description: Optional. Multicast group address if enabled (generated one returned if not specified).
    examples:
    - title: Enable multicast (JSON)
      request:
        params:
          AudioNetworkConfiguration: {MulticastEnabled: true}
      response:
        data: {MulticastGroup: 239.168.0.90}
      source: https://developer.axis.com/vapix/audio-systems/audio-relay-service-api/#change-multicast-settings-in-existing-audio-relay-network
  get_audio_peer_status:
    summary: Returns the status of the link between leader and followers (tracked by the leader).
    effect: read
    binding: {operation: 'axar:GetAudioPeerStatus'}
    params:
      type: object
      properties:
        AudioPeerId:
          type: array
          items: {$ref: '#/types/AudioPeerId'}
          description: IDs of audio peers to get; all if omitted.
    result:
      type: object
      properties:
        PeerStatus:
          type: array
          items: {$ref: '#/types/AudioPeerStatus'}
          description: The status of the Audio Relay peers.
    examples:
    - title: Monitor audio relay peers status
      request:
        params: {}
      response:
        data:
          PeerStatus:
          - {Id: AudioPeer_02, ConnectionStatus: Offline}
          - {Id: AudioPeer_01, ConnectionStatus: Online}
      source: https://developer.axis.com/vapix/audio-systems/audio-relay-service-api/#monitor-audio-relay-peers-status
  set_sound_configuration:
    summary: Set the SoundConfiguration (master volume) on all peers.
    effect: write
    write: patch
    binding: {operation: 'axar:SetSoundConfiguration'}
    params:
      type: object
      required: [Configuration]
      properties:
        Configuration:
          $ref: '#/types/SoundConfiguration'
          description: All members optional; empty changes nothing.
    examples:
    - title: Adjust the master volume (JSON)
      request:
        params:
          Configuration: {MasterVolume: 0, MasterVolumeUnit: dB}
      response:
        data: {}
      source: https://developer.axis.com/vapix/audio-systems/audio-relay-service-api/#adjust-the-master-volume
  get_sound_configuration:
    summary: Returns the SoundConfiguration of the Audio Relay network.
    effect: read
    binding: {operation: 'axar:GetSoundConfiguration'}
    result:
      type: object
      required: [Configuration]
      properties:
        Configuration: {$ref: '#/types/SoundConfiguration', description: The returned SoundConfiguration.}

sources:
- url: https://developer.axis.com/vapix/audio-systems/audio-relay-service-api/
  sha256_md: 0b5577eb08b8d3e59124c94a8e3ccf458f73a1b1a6cb238ed5589d05eb2671e0
  retrieved_at: '2026-10-11'

provenance:
  completeness: complete
  open_questions:
  - 'Command name inconsistencies in the prose: ''axar:SetAudioPeers'' vs SetAudioPeerConfigurations (used in the
    examples), ''GetDiscoveredPeers'' vs GetDiscoveredAudioPeers, ''GetServices'' vs GetServiceCapabilities. The
    names used in the examples and command sections are bound.'
  - The AudioPeerConfiguration table spells 'OutPutGain' with type Gain; examples use 'OutputGain' as an array of
    Gain, which is modelled.
  - GainDefinition.Range is documented as String but returned as an array of strings (modelled as an array).
  - The SetAudioPeerConfigurations response syntax shows AudioPeerId as a single string, the examples return an array
    (modelled as an array).
  - Access levels per command and the fault wire format are not documented; only ter:InvalidArgVal for RemoveAudioPeer.
  - Whether GetAudioPeers returns Peer when no peer matches is not stated, so Peer is optional.
  migrated_from: v1
  curated: true
