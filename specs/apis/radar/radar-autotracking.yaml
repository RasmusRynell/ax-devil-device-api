  retrieved_at: '2026-10-11'

provenance:
  completeness: complete
  open_questions:
  - The first camera connection example sends getCameraConnection with curl --request GET and a JSON body; all other requests use POST, which is used here. https://developer.axis.com/vapix/radar/radar-autotracking/#camera-connection
  - The setCameraPanOffset syntax shows the path /axi-cgi/radar-autotracking.cgi (typo); /axis-cgi/radar-autotracking.cgi is used.
  - The setCameraMountingHeight response syntax shows method setMountingHeight (typo).
  - The getCapabilities syntax uses returnToHomeTimeOut while the example uses returnToHomeTimeout; the example spelling is used.
  - The getReturnToHomeTimeout example uses minValue/maxValue while the table uses minTimeout/maxTimeout; the table is used and the example is corrected.
  - The getSupportedVersions syntax uses apiVersion 1.1 and its failure example uses the key apiVersions; only 1.0 appears elsewhere.
  - The getCameraZoomDegree table describes minValue and maxValue both as the zoom degree in percent (copy error).
  - The camera connection state event (RTSP event topic axis:RadarAutotracking/CameraConnection) is not a JSON-RPC method and is not modelled; its payload is not documented.
  - Which result fields are always present is not stated; only the value and state fields are modelled as required.
  migrated_from: v1
  curated: true
