provenance:
  completeness: complete
  open_questions:
  - The Analytics API getLanes/setLanes sections show the endpoint /axis-cgi/radar/control.cgi, while the examples and the API overview use radaranalytics.cgi. radaranalytics.cgi is used here. https://developer.axis.com/vapix/radar/radar-configuration/#setlanes
  - Lane examples use apiVersion 2.4 and radar profile examples use 1.4, while the API is documented as 2.2; 2.4 is listed as a version and the lanes operations are gated on it (inferred).
  - The getLanes success table describes data.value as the detection sensitivity (copy error), and the getLanes example response is keyed params instead of data; lane examples send enabled as the string "true"/"false" although the table says boolean. Booleans and data are used.
  - The setRadarProfile table describes value as the radar channel (copy error), and the radar profile error example uses errorCode/errorMsg instead of error.code/error.message.
  - getCoexistence documents maxNeighboringRadars as a number but shows it as {value}; the group in the response is not documented. Both are modelled as objects with value.
  - The frequency channel capabilities example uses minValue/maxValue/default while the table uses automatic/values/default; the table is used.
  - The getMountingTilt request example has a malformed apiVersion ("2.2,"); ignored.
  - The setCoexistence and setFrequencyChannel channel descriptions mention "frequency channel set to params.value" (copy error).
  - setGlobalFilters semantics are not stated; assumed to change only the listed filters (patch). setLanes is assumed to replace the stored lanes.
  - The documented getSupportedVersions method (listed under control.cgi in this section) is not modelled; version negotiation uses it.
  migrated_from: v1
  curated: true
