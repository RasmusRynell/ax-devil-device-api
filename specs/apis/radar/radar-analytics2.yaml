# Migrated from the v1 corpus by codegen/migrate_v1.py; not yet curated.
format: 2
id: radar-analytics2
name: Radar configuration - Analytics API
summary: 'Configure radar analytics via /axis-cgi/radar/radaranalytics.cgi: detection sensitivity, coexistence,
  frequency channel, global filters, mounting height/tilt...'
section: radar
family: jsonrpc
status: released
python:
  module: radar_analytics
  class: RadarAnalytics
docs:
- https://developer.axis.com/vapix/radar/radar-configuration/
access: operator
discovery:
- {api_discovery: radar-analytics2}

binding:
  path: /axis-cgi/radar/radaranalytics.cgi
  major: 2
  versions: ['2.2']
  negotiation:
    get_supported_versions: {key: apiVersions}
  params_placement: params

errors:
  1000: {description: Invalid parameter value., kind: invalid_argument}
  4000: {description: The provided input was not well-formed JSON.}
  4001: {description: A mandatory input parameter was not found in the input., kind: not_found}
  4002:
    description: The type of value of a provided JSON parameter was incorrect.
    kind: invalid_argument
  4004:
    description: The format of a provided JSON parameter was incorrect.
    kind: invalid_argument
  7000:
    description: The requested API version is not supported by this implementation.
    kind: unsupported
  8000: {description: Internal error., kind: internal}

types:
  Point:
    type: array
    items: {type: number, minimum: -1, maximum: 1}
    description: '[x, y] normalized so that the visible view spans -1..1 in both directions. (minItems=2, maxItems=2)'

operations:
  get_configuration_capabilities:
    summary: Request capabilities information from the Analytics API.
    access: admin
    effect: read
    binding: {method: getConfigurationCapabilities}
    result:
      type: object
      properties:
        coexistence:
          type: object
          x-name: GetConfigurationCapabilitiesResultCoexistence
          description: Present only if the device supports coexistence.
          properties:
            maxNeighboringRadars:
              type: object
              x-name: GetConfigurationCapabilitiesResultCoexistenceMaxNeighboringRadars
              properties:
                values:
                  type: array
                  items: {type: integer}
                default: {type: integer}
            group:
              type: object
              x-name: GetConfigurationCapabilitiesResultCoexistenceGroup
              properties:
                values:
                  type: array
                  items: {type: integer}
                default: {type: integer}
        frequencyChannel:
          type: object
          x-name: GetConfigurationCapabilitiesResultFrequencyChannel
          description: Present only if multiple frequency channels are supported.
          properties:
            automatic: {type: boolean}
            values:
              type: array
              items: {type: integer}
            default: {type: integer}
        mountingHeight:
          type: object
          x-name: GetConfigurationCapabilitiesResultMountingHeight
          properties:
            minValue: {type: number}
            maxValue: {type: number}
            default: {type: number}
        mountingTilt:
          type: object
          x-name: GetConfigurationCapabilitiesResultMountingTilt
          properties:
            minValue: {type: number}
            maxValue: {type: number}
            automatic: {type: boolean, description: Supports automatic mounting tilt measurement.}
            default: {type: number}
        detectionSensitivity:
          type: object
          x-name: GetConfigurationCapabilitiesResultDetectionSensitivity
          properties:
            values:
              type: array
              items: {type: string}
              description: e.g. low, medium, high
            default: {type: string}
        lanes:
          type: object
          x-name: GetConfigurationCapabilitiesResultLanes
          description: Only present if lanes are supported.
          properties:
            maxNameLength: {type: number}
            maxNodes: {type: number}
  set_detection_sensitivity:
    summary: Set the detection sensitivity.
    effect: write
    write: patch
    binding: {method: setDetectionSensitivity}
    params:
      type: object
      required: [value]
      properties:
        value:
          type: string
          description: Detection sensitivity (allowed values from getConfigurationCapabilities, e.g. low/medium/high).
        channel:
          type: integer
          description: Radar channel to set. If omitted, all radar channels use their default detection sensitivity.
  get_detection_sensitivity:
    summary: Get the current detection sensitivity.
    effect: read
    binding: {method: getDetectionSensitivity}
    params:
      type: object
      properties:
        channel: {type: integer, description: Radar channel to return (documented as param.channel).}
    result:
      type: object
      properties:
        value: {type: string}
  set_coexistence:
    summary: Set the coexistence mode to reduce interference between radars within each others' active area.
    effect: write
    write: patch
    binding: {method: setCoexistence}
    params:
      type: object
      required: [maxNeighboringRadars]
      properties:
        maxNeighboringRadars: {type: integer, description: The maximum number of neighboring radars.}
        channel: {type: integer, description: Radar channel. All radar channels are set if omitted.}
        group:
          type: integer
          description: Coexistence group the radar belongs to; optional if maxNeighboringRadars <= 2. Defaults to
            group 1.
  get_coexistence:
    summary: Get the current coexistence mode.
    effect: read
    binding: {method: getCoexistence}
    params:
      type: object
      properties:
        channel: {type: integer, description: Radar channel; channel 1 if omitted.}
    result:
      type: object
      properties:
        maxNeighboringRadars:
          type: object
          x-name: GetCoexistenceResultMaxNeighboringRadars
          properties:
            value: {type: integer}
        group:
          type: object
          x-name: GetCoexistenceResultGroup
          properties:
            value: {type: integer}
  set_frequency_channel:
    summary: Set the frequency channel to avoid interference between nearby radars.
    effect: write
    write: patch
    binding: {method: setFrequencyChannel}
    params:
      type: object
      properties:
        automatic:
          type: boolean
          description: Use automatic frequency channel selection; only true if supported (frequencyChannel.automatic),
            otherwise error.
        value:
          type: integer
          description: Frequency channel (integer or string; allowed values from getConfigurationCapabilities).
        channel: {type: integer, description: Radar channel; all radar channels set if omitted.}
  get_frequency_channel:
    summary: Get the current frequency channel.
    effect: read
    binding: {method: getFrequencyChannel}
    params:
      type: object
      properties:
        channel: {type: integer, description: Radar channel; channel 1 if omitted.}
    result:
      type: object
      properties:
        automatic: {type: boolean}
        value: {type: integer}
  set_global_filters:
    summary: Apply global filter configurations (e.g.
    access: admin
    effect: write
    write: patch
    binding: {method: setGlobalFilters}
    params:
      type: object
      required: [filters]
      properties:
        filters:
          type: array
          items:
            type: object
            x-name: SetGlobalFiltersRequestFiltersItem
            properties:
              type: {type: string}
              active: {type: boolean}
          description: 'List of {type: <FilterName>, active: bool}; supported names from getGlobalFilters.'
  get_global_filters:
    summary: Get the current global filter configuration.
    access: admin
    effect: read
    binding: {method: getGlobalFilters}
    result:
      type: object
      properties:
        filters:
          type: array
          items:
            type: object
            x-name: GetGlobalFiltersResultFiltersItem
            properties:
              type: {type: string}
              active: {type: boolean}
          description: FilterOne/FilterTwo in the example are placeholders.
  set_mounting_height:
    summary: Set the mounting height (affects the analytics algorithm; default 3.5 m).
    effect: write
    write: patch
    binding: {method: setMountingHeight}
    params:
      type: object
      required: [value]
      properties:
        value:
          type: number
          description: Vertical mounting height in meters (range from getConfigurationCapabilities).
        channel: {type: integer, description: Radar channel; all channels if omitted.}
  get_mounting_height:
    summary: Get the current mounting height.
    effect: read
    binding: {method: getMountingHeight}
    params:
      type: object
      properties:
        channel: {type: integer, description: Radar channel; channel 1 if omitted.}
    result:
      type: object
      properties:
        value: {type: number}
  set_mounting_tilt:
    summary: Set the mounting tilt (degrees, positive = tilted downwards; 0 = level with the surface; default 0).
    effect: write
    write: patch
    binding: {method: setMountingTilt}
    params:
      type: object
      properties:
        automatic:
          type: boolean
          description: Use automatic tilt measurement; only true if supported (mountingTilt.automatic).
        value: {type: number, description: Mounting tilt in degrees; ignored if automatic is true.}
        channel: {type: integer, description: Radar channel; all channels if omitted.}
  get_mounting_tilt:
    summary: Get the current mounting tilt and whether automatic tilt measurement is used.
    effect: read
    binding: {method: getMountingTilt}
    params:
      type: object
      properties:
        channel: {type: integer, description: Radar channel; channel 1 if omitted.}
    result:
      type: object
      properties:
        automatic: {type: boolean}
        value:
          type: number
          description: Updated per request when automatic is true and the physical tilt changes.
  get_radar_data_status:
    summary: Check data reception status from the radar sensor.
    effect: read
    binding: {method: getRadarDataStatus}
    result:
      type: object
      properties:
        value:
          type: boolean
          description: true = data received; false = no data (sensor may be malfunctioning).
  set_lanes:
    summary: Set the lane configuration (name, enabled, nodes) for road monitoring.
    effect: write
    write: patch
    binding: {method: setLanes}
    params:
      type: object
      required: [lanes]
      properties:
        lanes:
          type: array
          items:
            type: object
            x-name: SetLanesRequestLanesItem
            properties:
              name: {type: string}
              enabled: {type: boolean}
              nodes:
                type: array
                items: {$ref: '#/types/Point'}
          description: Lane array; limits from getConfigurationCapabilities lanes.maxNameLength/maxNodes.
  get_lanes:
    summary: Get the current lane setup while the radar is in road mode.
    effect: read
    binding: {method: getLanes}
    result:
      type: object
      properties:
        lanes:
          type: array
          items:
            type: object
            x-name: GetLanesResultLanesItem
            properties:
              name: {type: string, description: The lane name.}
              enabled: {type: boolean, description: Enable/disable lane.}
              nodes:
                type: array
                items: {$ref: '#/types/Point'}
                description: Polygon that describes lane outline.
  set_radar_profile:
    summary: Set the radar profile (e.g.
    effect: write
    write: patch
    binding: {method: setRadarProfile}
    params:
      type: object
      required: [value]
      properties:
        value: {type: string, description: Radar profile; allowed values from getRadarProfile.}
        channel: {type: integer, description: Radar channel to set.}
  get_radar_profile:
    summary: Get the radar profile in use and allowed values.
    effect: read
    binding: {method: getRadarProfile}
    result:
      type: object
      properties:
        value: {type: string}
        allowedValues:
          type: array
          items: {type: string}

