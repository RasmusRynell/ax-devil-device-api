format: 2
id: radar-control2
name: Radar configuration - Control API
summary: 'Configure radar motion detection event rules: channels and profiles with include areas, cross lines and
  filters. Also enables or disables the radar and sends test alarms.'
section: radar
family: jsonrpc
status: released
python:
  module: radar_control
  class: RadarControl
docs:
- https://developer.axis.com/vapix/radar/radar-configuration/
access: admin
discovery:
- {api_discovery: radar-control2}

binding:
  path: /axis-cgi/radar/control.cgi
  major: 2
  versions: ['2.2']
  negotiation:
    get_supported_versions: {key: apiVersions}
  params_placement: params

errors:
  1000: {description: "Internal error.", kind: internal}
  2000:
    description: The requested API version is not supported by this implementation.
    kind: unsupported
  2001:
    description: The format of a provided JSON parameter was incorrect.
    kind: invalid_argument
  2002:
    description: Conflicting input parameters, e.g. two profiles with the same uid.
    kind: invalid_argument
  2003: {description: "A mandatory input parameter was not found in the input.", kind: invalid_argument}
  2004: {description: "An input parameter has an incorrect type.", kind: invalid_argument}
  2005: {description: "An unexpected parameter was passed.", kind: invalid_argument}
  8000:
    description: The requested method is not supported by this implementation.
    kind: unsupported
  8003: {description: "The provided input was not well-formed JSON.", kind: invalid_argument}

types:
  Point:
    type: array
    items: {type: number, minimum: -1, maximum: 1}
    description: "[x, y] normalized so that the visible view spans -1..1 in both directions. Always two items."

  Channel:
    type: object
    required: [id]
    properties:
      active: {type: boolean, default: true, description: "Active profiles for the channel are set to true; inactive to false."}
      id: {type: integer, minimum: 1, default: 1, description: "Channel value applied when requesting video with ``media.amp``. Starts at 1."}

  ObjectTypeFilter:
    type: object
    description: Which kinds of objects generate events. For example, setting ``vehicle`` to false lets vehicles enter the alarm area without an event.
    required: [type]
    properties:
      type: {const: objectType}
      active: {type: boolean, description: Whether the filter is active.}
      small: {type: boolean, default: true, description: "Whether small objects (small animals such as rodents, small dogs and birds) generate events."}
      human: {type: boolean, default: true, description: Whether humans generate events.}
      vehicle: {type: boolean, default: true, description: Whether vehicles generate events.}
      unknown: {type: boolean, default: true, description: "Whether unknown objects (everything not covered by the other types) generate events."}

  TimeShortLivedLimitFilter:
    type: object
    description: Suppresses alarms for objects that are tracked for less than the set time.
    required: [type]
    properties:
      type: {const: timeShortLivedLimit}
      active: {type: boolean, description: Whether the filter is active.}
      data: {type: integer, minimum: 1, description: Seconds an object is tracked before an alarm is raised.}

  ExcludeAreaFilter:
    type: object
    description: An area where objects do not generate events.
    required: [type]
    properties:
      type: {const: excludeArea}
      data: {type: array, items: {$ref: "#/types/Point"}, description: The exclude area polygon.}
      trackPassingObjects: {type: boolean, description: Enable passing objects tracking.}

  MinimumSpeedLimitFilter:
    type: object
    description: The minimum speed an object must travel at to generate an event.
    required: [type]
    properties:
      type: {const: minimumSpeedLimit}
      active: {type: boolean, description: Whether the filter is active.}
      data: {type: number, minimum: 0, description: "The minimum speed in meters per second. The maximum comes from ``get_configuration_capabilities``."}

  MaximumSpeedLimitFilter:
    type: object
    description: The maximum speed an object may travel at to generate an event.
    required: [type]
    properties:
      type: {const: maximumSpeedLimit}
      active: {type: boolean, description: Whether the filter is active.}
      data: {type: number, minimum: 0, description: "The maximum speed in meters per second. The maximum comes from ``get_configuration_capabilities``."}

  Filter:
    description: "An exclusion filter. Filters are optional; a filter that is not present is created with the defaults from ``get_configuration_capabilities``."
    oneOf:
      - {$ref: "#/types/ObjectTypeFilter"}
      - {$ref: "#/types/TimeShortLivedLimitFilter"}
      - {$ref: "#/types/ExcludeAreaFilter"}
      - {$ref: "#/types/MinimumSpeedLimitFilter"}
      - {$ref: "#/types/MaximumSpeedLimitFilter"}

  AlarmDirection:
    enum: [leftToRight, rightToLeft]

  IncludeAreaTrigger:
    type: object
    required: [type]
    properties:
      type: {const: includeArea}
      data: {type: array, items: {$ref: "#/types/Point"}, description: The include area polygon.}

  CrossLineTrigger:
    type: object
    required: [type]
    properties:
      type: {const: crossLine}
      alarmDirection: {$ref: "#/types/AlarmDirection", description: The direction in which an object must cross the line to generate an event.}
      data: {type: array, items: {$ref: "#/types/Point"}, description: The cross line as a polyline.}

  MultipleLineCrossLineTrigger:
    type: object
    required: [type]
    properties:
      type: {const: multipleLineCrossLine}
      alarmDirection: {$ref: "#/types/AlarmDirection", description: The direction in which an object must cross the lines to generate an event.}
      data: {type: array, items: {type: array, items: {$ref: "#/types/Point"}}, description: "An array of lines, each ``[[x0, y0], ..., [xn, yn]]``."}
      crossingTimeLimit: {type: number, default: 0, description: "The maximum time in seconds an object may take to cross the two lines before an alarm is raised. 0 disables the time limit."}

  Trigger:
    description: What raises the profile's event. A profile holds at most one trigger.
    oneOf:
      - {$ref: "#/types/IncludeAreaTrigger"}
      - {$ref: "#/types/CrossLineTrigger"}
      - {$ref: "#/types/MultipleLineCrossLineTrigger"}

  Profile:
    type: object
    required: [uid]
    properties:
      name: {type: string, description: "Unicode string used in the event's nice name, visible in the action rule list. Defaults to ``Profile <uid>``."}
      channel: {type: integer, default: 1, description: "The ``id`` of the corresponding channel."}
      uid: {type: integer, default: 1, description: A unique profile id.}
      filters: {type: array, items: {$ref: "#/types/Filter"}, description: Exclusion filters.}
      triggers: {type: array, items: {$ref: "#/types/Trigger"}, description: The triggers; at most one.}
      minimumTriggerDuration: {type: number, minimum: 0, description: The minimum time in seconds that the profile remains active after it has been triggered.}

  Configuration:
    type: object
    description: The radar event configuration as reported by the device.
    required: [channels, profiles]
    x-read-only: [configurationStatus]
    properties:
      channels: {type: array, items: {$ref: "#/types/Channel"}, description: One entry per VAPIX channel.}
      profiles: {type: array, items: {$ref: "#/types/Profile"}, description: The event profiles.}
      configurationStatus: {type: integer, description: "Read-only. 0 for the default configuration, then increased by 1 on every set up to 2147483647, after which it restarts at 1."}

  SetConfigurationRequest:
    type: object
    description: Arguments of ``set_configuration``. A complete event configuration; remove a profile from ``profiles`` to delete it.
    required: [channels, profiles]
    properties:
      channels: {type: array, items: {$ref: "#/types/Channel"}, description: One entry per VAPIX channel.}
      profiles: {type: array, items: {$ref: "#/types/Profile"}, description: The event profiles. Profiles that are left out are removed.}

  Bound:
    description: A limit; a number, or an ``[x, y]`` pair for area and line limits.
    oneOf:
      - {type: number}
      - {type: array, items: {type: number}}

  FilterCapability:
    type: object
    description: Limits and defaults of one filter type. Which fields are present depends on ``type``.
    required: [type]
    properties:
      type: {enum: [excludeArea, objectType, timeShortLivedLimit, minimumSpeedLimit, maximumSpeedLimit]}
      min: {$ref: "#/types/Bound", description: The minimum allowed value.}
      max: {$ref: "#/types/Bound", description: The maximum allowed value.}
      default:
        description: The default value; for ``objectType``, the object types that generate an alarm.
        oneOf:
          - {type: number}
          - {type: array, items: {type: string}}
      defaultActive: {type: boolean, description: Whether the filter is active by default.}
      minNbrVertices: {type: integer, description: The minimum number of vertices of the area.}
      maxNbrVertices: {type: integer, description: The maximum number of vertices of the area.}
      defaultInstance: {type: array, items: {$ref: "#/types/Point"}, description: The default area vertices.}
      defaultTrackPassingObjects: {type: boolean, description: "The default value of ``trackPassingObjects``."}

  TriggerCapability:
    type: object
    description: Limits and defaults of one trigger type. Which fields are present depends on ``type``.
    required: [type]
    properties:
      type: {enum: [crossLine, multipleLineCrossLine, includeArea]}
      min: {type: array, items: {type: number}, description: "``[x, y]`` minimum allowed values."}
      max: {type: array, items: {type: number}, description: "``[x, y]`` maximum allowed values."}
      minNbrVertices: {type: integer}
      maxNbrVertices: {type: integer}
      minNbrLines: {type: integer, description: The minimum number of lines of a multiple line crossing.}
      maxNbrLines: {type: integer, description: The maximum number of lines of a multiple line crossing.}
      minNbrInstances: {type: integer}
      maxNbrInstances: {type: integer}
      validAlarmDirections: {type: array, items: {type: string}, description: The possible alarm directions.}
      defaultInstance:
        description: "The default vertices: a list of points, or for ``multipleLineCrossLine`` a list of lines."
        type: array
        items:
          oneOf:
            - {$ref: "#/types/Point"}
            - {type: array, items: {$ref: "#/types/Point"}}
      defaultAlarmDirection: {type: string}
      defaultAlarmDirections: {type: string, description: The default alarm direction of a multiple line crossing.}
      defaultCrossingTimeLimit: {type: number}
      minCrossingTimeLimit: {type: number}
      maxCrossingTimeLimit: {type: number}

  ProfileCapabilities:
    type: object
    properties:
      minNbrProfilesPerChannel: {type: number}
      maxNbrProfilesPerChannel: {type: number}
      minLengthName: {type: number, description: The minimum number of characters of a profile name.}
      maxLengthName: {type: number, description: The maximum number of characters of a profile name.}
      minMinimumTriggerDuration: {type: number}
      maxMinimumTriggerDuration: {type: number}
      defaultMinimumTriggerDuration: {type: number, description: "The default of ``minimumTriggerDuration`` when omitted."}

  RadarProfileCapabilities:
    type: object
    properties:
      values: {type: array, items: {type: string}, description: "The radar profiles, for example area and road."}
      default: {type: string}

  ConfigurationCapabilities:
    type: object
    properties:
      filters: {type: array, items: {$ref: "#/types/FilterCapability"}}
      triggers: {type: array, items: {$ref: "#/types/TriggerCapability"}}
      profiles: {$ref: "#/types/ProfileCapabilities"}
      radarProfile: {$ref: "#/types/RadarProfileCapabilities"}

  Enabled:
    type: object
    required: [enabled]
    properties:
      enabled: {type: boolean, description: Whether the radar is enabled.}

  SetEnabledRequest:
    type: object
    required: [enabled]
    properties:
      enabled: {type: boolean, description: "True to enable the radar, false to disable it."}

  SendAlarmEventRequest:
    type: object
    required: [profile]
    properties:
      profile: {type: integer, description: The uid of the profile that should raise an alarm.}

operations:
  get_configuration:
    summary: Get the current radar event configuration.
    effect: read
    binding: {method: getConfiguration}
    result: {$ref: "#/types/Configuration"}
    examples:
      - title: Get the configuration
        request: {params: {}}
        response:
          data:
            channels: [{active: true, id: 1}]
            profiles:
              - name: Zone 1
                uid: 1
                channel: 1
                filters:
                  - {type: objectType, small: false, human: true, vehicle: true, unknown: true, active: false}
                  - {type: timeShortLivedLimit, data: 2, active: true}
                  - {type: excludeArea, data: [[-0.5, -0.5], [0.5, -0.5], [0.0, 0.5]], trackPassingObjects: true}
                triggers:
                  - {type: includeArea, data: [[-0.9, -0.9], [0.9, -0.9], [0.9, 0.9], [-0.9, 0.9]]}
            configurationStatus: 0
        source: https://developer.axis.com/vapix/radar/radar-configuration/#getconfiguration
      - title: Get the configuration of a multichannel radar
        request: {params: {}}
        response:
          data:
            channels: [{active: true, id: 1}, {active: false, id: 2}, {active: false, id: 3}, {active: false, id: 4}]
            profiles:
              - name: Zone 1
                uid: 1
                channel: 1
                filters:
                  - {type: objectType, small: false, human: true, vehicle: true, unknown: true, active: false}
                triggers:
                  - {type: includeArea, data: [[-0.9, -0.9], [0.9, -0.9], [0.9, 0.9], [-0.9, 0.9]]}
            configurationStatus: 0
        source: https://developer.axis.com/vapix/radar/radar-configuration/#getconfiguration

  set_configuration:
    summary: Apply a new, complete event configuration.
    description: The configuration replaces the stored one; remove a profile from ``profiles`` to delete it. Remove an exclude area filter when it is not in use.
    effect: write
    write: replace
    binding: {method: setConfiguration}
    params: {$ref: "#/types/SetConfigurationRequest"}
    round_trip:
      from: Configuration
    examples:
      - title: Set a configuration with an include area
        request:
          params:
            channels: [{active: true, id: 1}]
            profiles:
              - name: Profile 1
                uid: 1
                channel: 1
                filters:
                  - {type: objectType, small: false, human: true, vehicle: true, unknown: true, active: false}
                  - {type: timeShortLivedLimit, data: 2, active: true}
                  - {type: excludeArea, data: [[-0.5, -0.5], [0.5, -0.5], [0.0, 0.5]], trackPassingObjects: true}
                triggers:
                  - {type: includeArea, data: [[-0.9, -0.9], [0.9, -0.9], [0.9, 0.9], [-0.9, 0.9]]}
        response: {data: {}}
        source: https://developer.axis.com/vapix/radar/radar-configuration/#setconfiguration
      - title: Set a configuration with a cross line
        request:
          params:
            channels: [{active: true, id: 1}]
            profiles:
              - name: Profile 1
                uid: 1
                channel: 1
                triggers:
                  - {type: crossLine, alarmDirection: leftToRight, data: [[-0.5, 0.0], [0.5, 0.0]]}
        response: {data: {}}
        source: https://developer.axis.com/vapix/radar/radar-configuration/#setconfiguration
      - title: Invalid configuration
        request: {params: {channels: [], profiles: []}}
        response: {error: {code: 2002, message: Conflicting input parameters}}
        source: https://developer.axis.com/vapix/radar/radar-configuration/#general-error-codes

  get_configuration_capabilities:
    summary: Get the boundaries and default values of the Control API configuration.
    effect: read
    binding: {method: getConfigurationCapabilities}
    result: {$ref: "#/types/ConfigurationCapabilities"}
    examples:
      - title: Get the configuration capabilities
        request: {params: {}}
        response:
          data:
            filters:
              - {type: excludeArea, min: [-1.0, -1.0], max: [1.0, 1.0], minNbrVertices: 3, maxNbrVertices: 10, defaultInstance: [[-0.5, -0.5], [0.5, -0.5], [0.0, 0.5]], defaultTrackPassingObjects: false}
              - {type: timeShortLivedLimit, min: 1, max: 60, default: 2, defaultActive: true}
              - {type: minimumSpeedLimit, min: 0.0, max: 50.0, default: 0.0, defaultActive: false}
            triggers:
              - {type: crossLine, min: [-1.0, -1.0], max: [1.0, 1.0], minNbrVertices: 2, maxNbrVertices: 10, minNbrInstances: 0, maxNbrInstances: 1, validAlarmDirections: [leftToRight, rightToLeft], defaultAlarmDirection: leftToRight}
            profiles: {minNbrProfilesPerChannel: 0, maxNbrProfilesPerChannel: 20, minLengthName: 1, maxLengthName: 50}
            radarProfile: {values: [area, road], default: area}
        source: https://developer.axis.com/vapix/radar/radar-configuration/#getconfigurationcapabilities
        x-contract: {template: true}

  get_enabled:
    summary: Determine whether the radar is enabled.
    effect: read
    binding: {method: getEnabled}
    result: {$ref: "#/types/Enabled"}
    examples:
      - title: Get the enabled state
        request: {params: {}}
        response: {data: {enabled: true}}
        source: https://developer.axis.com/vapix/radar/radar-configuration/#getenabled

  set_enabled:
    summary: Enable or disable the radar.
    effect: write
    write: patch
    binding: {method: setEnabled}
    params: {$ref: "#/types/SetEnabledRequest"}
    positional: [enabled]
    examples:
      - title: Disable the radar
        request: {params: {enabled: false}}
        response: {data: {}}
        source: https://developer.axis.com/vapix/radar/radar-configuration/#setenabled

  send_alarm_event:
    summary: Send a stateful alarm event for a profile uid, to test a configuration.
    description: The event stays active for a few seconds and the response returns immediately. Profile events are sent regardless of their current state.
    access: operator
    effect: action
    binding: {method: sendAlarmEvent}
    params: {$ref: "#/types/SendAlarmEventRequest"}
    positional: [profile]
    examples:
      - title: Send an alarm event for profile 1
        request: {params: {profile: 1}}
        response: {data: {}}
        source: https://developer.axis.com/vapix/radar/radar-configuration/#sendalarmevent

