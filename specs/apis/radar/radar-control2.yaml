- url: https://developer.axis.com/vapix/radar/radar-configuration/
  sha256_md: 972321519f60d398dbea52af43f10373ecdb87f0aec9308f1fbc4c49434e24bf
  retrieved_at: '2026-10-11'

provenance:
  completeness: complete
  open_questions:
  - The sendAlarmEvent table documents data.profile, while the request example uses params.profile; params.profile is used. https://developer.axis.com/vapix/radar/radar-configuration/#sendalarmevent
  - The documented examples use unknownType (objectType filter) and trackingPassingObjects, while the tables use unknown and trackPassingObjects; the tables are used.
  - The capabilities example uses validAlarmDirection while the table uses validAlarmDirections; the table is used. defaultAlarmDirections of multipleLineCrossLine is typed string.
  - The excludeArea table lists profiles[j].triggers[k].data for the exclude polygon; filters[k].data is assumed.
  - The docs say all configuration properties are mandatory unless marked optional, but also give defaults; only ids, uids, types, channels and profiles are modelled as required.
  - The getSupportedVersions method is documented but not modelled; version negotiation uses it.
  - The ONVIF/RTSP event and metadata streams are not JSON-RPC methods and are not modelled.
  migrated_from: v1
  curated: true
