format: 2
id: network-radar-pairing
name: Network Radar Pairing
summary: Pair a camera with a network-connected Axis radar so it appears as a built-in radar sensor.
section: radar
family: jsonrpc
status: released
python:
  module: network_radar_pairing
  class: NetworkRadarPairing
docs:
- https://developer.axis.com/vapix/radar/network-radar-pairing/
access: admin
discovery:
- {api_discovery: network-radar-pairing}

binding:
  path: /networkradarpairing.cgi
  major: 1
  versions: ['1.0']
  negotiation:
    get_supported_versions: {key: apiVersions}
  params_placement: params

errors:
  1100: {description: Internal error, kind: internal}
  2100: {description: API version not supported, kind: unsupported}
  2101: {description: Invalid JSON, kind: invalid_argument}
  2102: {description: Method not supported, kind: unsupported}
  2103: {description: Required parameter missing, kind: invalid_argument}
  2104: {description: Invalid parameter value specified, kind: invalid_argument}
  2105: {description: Authorization failed, kind: access_denied}
  2106: {description: Authentication failed, kind: access_denied}
  2107: {description: "Transport level error (HTTP 405, 411 or 413)", kind: invalid_argument}
  2200: {description: Configuration cannot be changed or removed while enabled, kind: unavailable}
  2201: {description: Missing configuration, kind: not_found}
  2202: {description: Usability test of the configuration failed, kind: invalid_argument}

types:
  ConnectionState:
    type: string
    enum:
    - failed
    - address-failed
    - connect-failed
    - authentication-failed
    - transfer-failed
    - not-configured
    - not-active
    - ok
    description: "``failed`` catches all failures; ``address-failed``: address resolution failed; ``connect-failed``: connecting to the radar failed; ``authentication-failed``: authentication to the radar failed; ``transfer-failed``: data transfer failed; ``not-configured``: nothing configured; ``not-active``: configured but not active; ``ok``: configured, active and no error."
  RadarConnection:
    type: object
    description: The network radar pairing configuration and state. The password is never returned.
    required: [state]
    properties:
      address: {type: string, description: The IP address.}
      user: {type: string, description: The user name.}
      state: {$ref: '#/types/ConnectionState'}

operations:
  get_radar_connection:
    summary: Retrieve the network radar pairing configuration and all of its setting information.
    effect: read
    binding: {method: getRadarConnection}
    result: {$ref: '#/types/RadarConnection'}
    examples:
    - title: Get the radar connection
      request: {params: {}}
      response:
        data: {address: 192.168.0.90, user: john, state: ok}
      source: https://developer.axis.com/vapix/radar/network-radar-pairing/#getradarconnection
  set_radar_connection:
    summary: Set the network radar pairing configuration (radar address and credentials).
    effect: write
    write: patch
    binding: {method: setRadarConnection}
    params:
      type: object
      required: [address, user, password]
      x-masked: [password]
      properties:
        address: {type: string, description: The IP address.}
        user: {type: string, description: The user name.}
        password:
          type: string
          minLength: 1
          maxLength: 64
          description: The remote radar account password.
        tls-certificate-cn:
          type: string
          description: The common name for which the remote radar's certificate is issued.
    examples:
    - title: Set the radar connection
      request:
        params:
          address: 192.168.0.90
          user: john
          password: doe
          tls-certificate-cn: axis-1234567890ab-eccp256-1
      response:
        data: {}
      source: https://developer.axis.com/vapix/radar/network-radar-pairing/#setradarconnection
  clear_configuration:
    summary: Clear all stored configurations from the network radar pairing.
    description: Fails with error 2200 while the pairing is active.
    effect: write
    write: delete
    binding: {method: clearConfiguration}
    examples:
    - title: Clear the configuration
      request: {params: {}}
      response:
        data: {}
      source: https://developer.axis.com/vapix/radar/network-radar-pairing/#clearconfiguration
  get_active:
    summary: Retrieve the activation state of the network radar pairing.
    effect: read
    binding: {method: getActive}
    description: Fails with error 2201 if no configuration exists.
    result:
      type: object
      required: [active]
      properties:
        active: {type: boolean}
    examples:
    - title: Get the activation state
      request: {params: {}}
      response:
        data: {active: true}
      source: https://developer.axis.com/vapix/radar/network-radar-pairing/#getactive
  set_active:
    summary: Activate (or deactivate) an already configured network radar pairing.
    description: Fails with error 2201 if no configuration exists. Succeeds if the active state already matches.
    effect: write
    write: patch
    binding: {method: setActive}
    params:
      type: object
      required: [active]
      properties:
        active: {type: boolean}
    examples:
    - title: Activate the pairing
      request:
        params: {active: true}
      response:
        data: {}
      source: https://developer.axis.com/vapix/radar/network-radar-pairing/#setactive

sources:
- url: https://developer.axis.com/vapix/radar/network-radar-pairing/
  sha256_md: c42dbbf50174baabdccaa47844f540dcfca9ebe6643ae4aaef736c7dc4f0c21d
  retrieved_at: '2026-10-11'

provenance:
  completeness: complete
  open_questions:
  - The page documents the endpoint as '/networkradarpairing.cgi#<method>' (no /axis-cgi/ prefix; the fragment is not part of the path). The path used here follows the docs literally and should be checked against a device.
  - setRadarConnection request example includes 'state' but the parameter table does not list it; the table is followed and the example here omits it.
  - Whether setRadarConnection replaces the whole configuration (for example clearing tls-certificate-cn when omitted) is not stated; treated as patch.
  - Per-method mapping of errors 2200-2202 is inferred from method descriptions, not stated per method; access level
    not stated.
  migrated_from: v1
  curated: true
