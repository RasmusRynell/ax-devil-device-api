  retrieved_at: '2026-10-11'

provenance:
  completeness: complete
  open_questions:
  - The setViewConfiguration table lists duration as a top-level Array, but the examples put an integer duration in each view; the examples are followed.
  - The capabilities table lists the video codec as H264, but the example returns H.264; codecs are kept as free strings.
  - The audioCodecs description says "List of video codecs" (typo in the docs).
  - Error descriptions say IDs must be positive integers, yet the examples use 0; the event schema says minimum 0.
  - Failures of setViewConfiguration come back in an "errors" array (and getSupportedVersions in "error" as an array), not the usual error object.
  - The minimum AXIS OS version is not stated. The API supports VAPIX 3 cameras only and not the P7701 decoder.
  migrated_from: v1
  curated: true
