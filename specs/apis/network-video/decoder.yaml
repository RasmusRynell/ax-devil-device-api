provenance:
  completeness: complete
  open_questions:
  - setViewConfiguration table describes 'duration' as a top-level Array, but examples put duration (integer) inside
    each view.
  - Capabilities table lists video codec 'H264' but the example returns 'H.264'; audioCodecs described as 'List
    of video codecs' (typo).
  - IDs must be 'positive integer' per error descriptions, yet examples use 0.
  - getSupportedVersions failure uses 'error' (array) whereas setViewConfiguration uses 'errors'.
  - AXIS OS minimum version not stated.
  - 'migration: effect-guessed: write semantics guessed from the method name: set_view_configuration=write/patch'
  migrated_from: v1
  curated: false
