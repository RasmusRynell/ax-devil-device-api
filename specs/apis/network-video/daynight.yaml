provenance:
  completeness: complete
  open_questions:
  - Parameter tables list channel and configuration keys at top level, but examples nest them under params; examples
    followed.
  - Responses' data is an array of per-channel objects; setConfiguration echoes the configuration.
  - getSupportedVersions parameter table lists apiVersion as a request parameter (unusual).
  - DayNightShiftLevel description says 'A higher value corresponds to a night to day switch when it is darker'
    in the spec table but overview says the day-to-night switch occurs when darker.
  - Range of NightDayShiftLevel not stated (DayNightShiftLevel is 0–100).
  - 'Error examples use "method": "method" placeholder. Error HTTP statuses vary (200/400/401/403/405/500) unlike
    most JSON APIs.'
  - AXIS OS minimum version not stated (API added 2024-04-26).
  - 'migration: effect-guessed: write semantics guessed from the method name: set_configuration=write/patch'
  migrated_from: v1
  curated: false
