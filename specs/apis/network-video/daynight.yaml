format: 2
id: daynight
name: DayNight API
summary: Manage day/night switching (shift levels, dwell times, autotune) when the IR-cut filter is Auto, and the
  night filter (clear glass / IR-pass) when Off.
section: network-video
family: jsonrpc
status: released
python:
  module: daynight
  class: DayNight
docs:
- https://developer.axis.com/vapix/network-video/daynight-api/
access: operator
discovery:
- {api_discovery: daynight}

binding:
  path: /axis-cgi/daynight.cgi
  major: 1
  versions: ['1.0', '1.2']
  negotiation:
    get_supported_versions: {key: apiVersions}
  params_placement: params

errors:
  1100: {description: Internal error. The details field may list the parameters that could not be set., kind: internal}
  2100: {description: API version not supported., kind: unsupported}
  2101: {description: Bad request. Invalid JSON., kind: invalid_argument}
  2102: {description: Method not supported., kind: unsupported}
  2103: {description: Missing parameter. Required parameter missing., kind: invalid_argument}
  2104: {description: Invalid parameter value specified., kind: invalid_argument}
  2105: {description: Authorization failed., kind: access_denied}
  2106: {description: Authentication failed., kind: access_denied}
  2107: {description: Method not allowed. Transport level error., kind: unsupported}

types:
  NightFilter:
    enum: [irpass, clear]

  Capabilities:
    type: object
    description: Day and night capabilities of one channel.
    required: [channel, AutotuneSupport, IrPassSupport, NightDayShiftLevelSupport]
    properties:
      channel: {type: integer}
      AutotuneSupport: {type: boolean, description: True if the channel supports autotune.}
      IrPassSupport: {type: boolean, description: True if the channel supports the IR-pass filter.}
      NightDayShiftLevelSupport: {type: boolean, description: True if the channel supports night to day shift levels.}

  Configuration:
    type: object
    description: Day and night configuration of one channel. Fields the channel does not support are absent.
    required: [channel]
    properties:
      channel: {type: integer}
      DayNightDwellTime:
        type: number
        minimum: 1
        maximum: 600
        description: Seconds that pass, once the ``DayNightShiftLevel`` threshold is reached, before the channel switches from day to night mode.
      DayNightShiftLevel:
        type: integer
        minimum: 0
        maximum: 100
        description: Day to night switch threshold. A higher value switches when the image is darker. Equivalent to the param.cgi parameter ``root.ImageSource.IX.DayNight.ShiftLevel``.
      NightDayDwellTime:
        type: number
        minimum: 1
        maximum: 600
        description: Seconds that pass, once the ``NightDayShiftLevel`` threshold is reached, before the channel switches from night to day mode.
      NightDayShiftLevel:
        type: integer
        description: Night to day threshold; only if ``NightDayShiftLevelSupport`` is true. A higher value switches when the image is darker; too high a value may cause day and night oscillation. Cannot be set while ``Autotune`` is true.
      Autotune:
        type: boolean
        description: "Only if ``AutotuneSupport`` is true. True lets an algorithm control ``NightDayShiftLevel``; false lets the operator set it."
      NightFilter:
        $ref: "#/types/NightFilter"
        description: "Only if ``IrPassSupport`` is true. ``irpass`` uses the IR-pass filter and ``clear`` uses clear glass when the IR-cut filter is Off."

  SetConfigurationRequest:
    type: object
    description: Arguments of ``set_configuration``. Only the given fields are changed.
    required: [channel]
    properties:
      channel: {type: integer, description: The channel that should be used for the operation.}
      DayNightDwellTime: {type: number, minimum: 1, maximum: 600, description: Seconds before switching from day to night mode.}
      DayNightShiftLevel: {type: integer, minimum: 0, maximum: 100, description: Day to night switch threshold. A higher value switches when the image is darker.}
      NightDayDwellTime: {type: number, minimum: 1, maximum: 600, description: Seconds before switching from night to day mode.}
      NightDayShiftLevel: {type: integer, description: Only if ``NightDayShiftLevelSupport`` is true and ``Autotune`` is false.}
      Autotune: {type: boolean, description: Only if ``AutotuneSupport`` is true.}
      NightFilter: {$ref: "#/types/NightFilter", description: Only if ``IrPassSupport`` is true.}

operations:
  get_capabilities:
    summary: List all day and night capabilities for a specific channel.
    effect: read
    binding: {method: getCapabilities}
    params:
      type: object
      x-name: ChannelRequest
      required: [channel]
      properties:
        channel: {type: integer, description: The channel that should be used for the operation.}
    result:
      type: array
      items: {$ref: '#/types/Capabilities'}
    examples:
    - title: getCapabilities
      request:
        params: {channel: 0}
      response:
        data:
        - {channel: 0, AutotuneSupport: true, IrPassSupport: true, NightDayShiftLevelSupport: true}
      source: https://developer.axis.com/vapix/network-video/daynight-api/#getcapabilities
  get_configuration:
    summary: Request configuration information for a channel.
    effect: read
    binding: {method: getConfiguration}
    params:
      type: object
      x-name: ChannelRequest
      required: [channel]
      properties:
        channel: {type: integer, description: The channel that should be used for the operation.}
    result:
      type: array
      items: {$ref: '#/types/Configuration'}
    examples:
    - title: getConfiguration
      request:
        params: {channel: 0}
      response:
        data:
        - channel: 0
          DayNightDwellTime: 3
          DayNightShiftLevel: 50
          NightDayDwellTime: 3
          NightDayShiftLevel: 50
          Autotune: true
          NightFilter: clear
      source: https://developer.axis.com/vapix/network-video/daynight-api/#getconfiguration
  set_configuration:
    summary: Apply day/night configuration to a channel.
    description: Returns the resulting configuration of the channel.
    effect: write
    write: patch
    binding: {method: setConfiguration}
    params: {$ref: "#/types/SetConfigurationRequest"}
    result:
      type: array
      items: {$ref: "#/types/Configuration"}
    examples:
    - title: setConfiguration
      request:
        params:
          channel: 0
          DayNightDwellTime: 3
          DayNightShiftLevel: 50
          NightDayDwellTime: 3
          NightDayShiftLevel: 50
          Autotune: true
          NightFilter: clear
      response:
        data:
        - channel: 0
          DayNightDwellTime: 3
          DayNightShiftLevel: 50
          NightDayDwellTime: 3
          NightDayShiftLevel: 50
          Autotune: true
          NightFilter: clear
      source: https://developer.axis.com/vapix/network-video/daynight-api/#setconfiguration
    - title: Setting an unsupported parameter
      request:
        params: {channel: 0, Autotune: true}
      response:
        error:
          code: 1100
          message: Internal error
          details: [{Autotune: "Can't set Autotune, Autotune is not supported.", channel: 0}]
      source: https://developer.axis.com/vapix/network-video/daynight-api/#error-responses

sources:
- url: https://developer.axis.com/vapix/network-video/daynight-api/
  sha256_md: 5b9dea7383f2390f174dd0a538a682274f30870970d241cb548544485c3fd7f4
  retrieved_at: '2026-10-11'

provenance:
  completeness: complete
  open_questions:
  - The overview and the getConfiguration table disagree on DayNightShiftLevel (a higher value switches day to night when darker, or night to day when darker); the overview wording is used.
  - The range of NightDayShiftLevel is not stated (DayNightShiftLevel is 0 to 100).
  - The minimum AXIS OS version is not stated.
  - What differs between API versions 1.0 and 1.2 is not documented.
  - Error HTTP statuses vary (200, 400, 401, 403, 405, 500), unlike most JSON APIs.
  - Setting NightDayShiftLevel while Autotune is true fails with error 1100; no round trip is generated for that reason.
  migrated_from: v1
  curated: true
