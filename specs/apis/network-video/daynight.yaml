# Migrated from the v1 corpus by codegen/migrate_v1.py; not yet curated.
format: 2
id: daynight
name: DayNight API
summary: Manage day/night switching (shift levels, dwell times, autotune) when the IR-cut filter is Auto, and the
  night filter (clear glass / IR-pass) when Off.
section: network-video
family: jsonrpc
status: released
python:
  module: daynight
  class: DayNight
docs:
- https://developer.axis.com/vapix/network-video/daynight-api/
access: operator
discovery:
- {api_discovery: daynight}

binding:
  path: /axis-cgi/daynight.cgi
  major: 1
  versions: ['1.0', '1.2']
  negotiation:
    get_supported_versions: {key: apiVersions}
  params_placement: params

errors:
  2100: {description: API version not supported. API version not supported., kind: unsupported}
  2101: {description: Bad request. Invalid JSON., kind: invalid_argument}
  2102: {description: Method not supported. Method not supported., kind: unsupported}
  2103: {description: Missing parameter. Required parameter missing., kind: invalid_argument}
  2104: {description: Invalid parameter. Invalid parameter value specified., kind: invalid_argument}
  2105: {description: Authorization failed. Authorization failed., kind: access_denied}
  2106: {description: Authentication failed. Authentication failed.}
  2107: {description: Method not allowed. Transport level error.}
  1100: {description: Internal error. Internal error (may include error.details)., kind: internal}

types:
  Capabilities:
    type: object
    properties:
      channel: {type: integer}
      AutotuneSupport: {type: boolean, description: True if the channel supports autotune.}
      IrPassSupport: {type: boolean, description: True if the channel supports IR-pass filter.}
      NightDayShiftLevelSupport: {type: boolean, description: True if the channel supports night to day shift levels.}
  Configuration:
    type: object
    properties:
      channel: {type: integer}
      DayNightDwellTime:
        type: number
        minimum: 1
        maximum: 600
        description: Seconds before switching from day to night mode once the DayNightShiftLevel threshold is reached
          (1–600 s; default typically 3–5 s).
      DayNightShiftLevel:
        type: integer
        minimum: 0
        maximum: 100
        description: Day to night switch threshold 0–100; higher = switch when darker. Equivalent to param.cgi root.ImageSource.IX.DayNight.ShiftLevel.
      NightDayDwellTime:
        type: number
        minimum: 1
        maximum: 600
        description: Seconds before switching from night to day mode once the NightDayShiftLevel threshold is reached
          (1–600 s).
      NightDayShiftLevel:
        type: integer
        description: Only if NightDayShiftLevelSupport is true. Night to day threshold; higher = switch when darker.
          Too high may cause day/night oscillation. Cannot be set while Autotune is true.
      Autotune:
        type: boolean
        description: 'Only if AutotuneSupport is true. true: an algorithm controls NightDayShiftLevel; false: NightDayShiftLevel
          can be set to a fixed value.'
      NightFilter:
        type: string
        enum: [irpass, clear]
        description: 'Only if IrPassSupport is true. irpass: IR-pass filter when IR-cut filter is Off; clear: clear
          glass.'

operations:
  get_capabilities:
    summary: List all day and night capabilities for a specific channel.
    effect: read
    binding: {method: getCapabilities}
    params:
      type: object
      required: [channel]
      properties:
        channel: {type: integer, description: The channel that should be used for the operation.}
    result:
      type: array
      items: {$ref: '#/types/Capabilities'}
    examples:
    - title: getCapabilities
      request:
        params: {channel: 0}
      response:
        data:
        - {channel: 0, AutotuneSupport: true, IrPassSupport: true, NightDayShiftLevelSupport: true}
      source: https://developer.axis.com/vapix/network-video/daynight-api/#getcapabilities
  get_configuration:
    summary: Request configuration information for a channel.
    effect: read
    binding: {method: getConfiguration}
    params:
      type: object
      required: [channel]
      properties:
        channel: {type: integer}
    result:
      type: array
      items: {$ref: '#/types/Configuration'}
    examples:
    - title: getConfiguration
      request:
        params: {channel: 0}
      response:
        data:
        - channel: 0
          DayNightDwellTime: 3
          DayNightShiftLevel: 50
          NightDayDwellTime: 3
          NightDayShiftLevel: 50
          Autotune: true
          NightFilter: clear
      source: https://developer.axis.com/vapix/network-video/daynight-api/#getconfiguration
  set_configuration:
    summary: Apply day/night configuration to a channel.
    effect: write
    write: patch
    binding: {method: setConfiguration}
    params:
      type: object
      required: [channel]
      properties:
        channel: {type: integer}
        DayNightDwellTime: {type: number, minimum: 1, maximum: 600, description: unit=s}
        DayNightShiftLevel: {type: integer, minimum: 0, maximum: 100}
        NightDayDwellTime: {type: number, minimum: 1, maximum: 600, description: unit=s}
        NightDayShiftLevel:
          type: integer
          description: Only if NightDayShiftLevelSupport is true and Autotune is false.
        Autotune: {type: boolean, description: Only if AutotuneSupport is true.}
        NightFilter: {type: string, enum: [irpass, clear], description: Only if IrPassSupport is true.}
    result:
      type: array
      items: {$ref: '#/types/Configuration'}
    errors:
      1100: {description: 'Internal error, autotune set to true.', kind: internal}
    examples:
    - title: setConfiguration
      request:
        params:
          channel: 0
          DayNightDwellTime: 3
          DayNightShiftLevel: 50
          NightDayDwellTime: 3
          NightDayShiftLevel: 50
          Autotune: true
          NightFilter: clear
      response:
        data:
        - channel: 0
          DayNightDwellTime: 3
          DayNightShiftLevel: 50
          NightDayDwellTime: 3
          NightDayShiftLevel: 50
          Autotune: true
          NightFilter: clear
      source: https://developer.axis.com/vapix/network-video/daynight-api/#setconfiguration

