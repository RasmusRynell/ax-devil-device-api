format: 2
id: regional-settings
name: Regional settings
summary: Store regional settings such as the length unit used when presenting values.
section: network-video
family: jsonrpc
status: released
python:
  module: regional_settings
  class: RegionalSettings
docs:
- https://developer.axis.com/vapix/network-video/regional-settings/
access: operator
discovery:
- {api_discovery: regional-settings}
- param: {name: root.Properties.RegionalSettings.RegionalSettings, value: 'yes'}
requires:
  firmware: '9.20'

binding:
  path: /axis-cgi/regionalsettings.cgi
  major: 1
  versions: ['1.0', '1.1']
  negotiation:
    get_supported_versions: {key: apiVersions}
  params_placement: params

errors:
  1000: {description: Internal error., kind: internal}
  1001: {description: The requested API version is not supported., kind: unsupported}
  1002: {description: Unknown method., kind: unsupported}
  1003: {description: Invalid argument., kind: invalid_argument}
  1004: {description: Invalid request., kind: invalid_argument}

types:
  LengthUnit:
    enum: [metric, us_customary]
    description: Unit used to present length values. The device default is ``metric``.

  Units:
    type: object
    required: [length]
    properties:
      length: {$ref: "#/types/LengthUnit"}

  RegionalSettings:
    type: object
    description: Regional settings stored on the device.
    properties:
      units: {$ref: "#/types/Units"}

  SetRegionalSettingsRequest:
    type: object
    description: Arguments of ``set_regional_settings``. The device answers 1003 if no parameters are given.
    required: [units]
    properties:
      units: {$ref: "#/types/Units"}

operations:
  get_regional_settings:
    summary: Retrieve the current regional settings, for example the length unit used in the GUI.
    effect: read
    binding: {method: getRegionalSettings}
    result: {$ref: "#/types/RegionalSettings"}
    examples:
      - title: Get regional settings
        request: {params: {}}
        response:
          data:
            units: {length: metric}
        source: https://developer.axis.com/vapix/network-video/regional-settings/#get-regional-settings

  set_regional_settings:
    summary: Set the regional settings used in the GUI.
    effect: write
    write: patch
    binding: {method: setRegionalSettings}
    params: {$ref: "#/types/SetRegionalSettingsRequest"}
    errors:
      1003: {description: Invalid argument. The request has no parameters or an invalid value., kind: invalid_argument}
    examples:
      - title: Use US customary length units
        request:
          params:
            units: {length: us_customary}
        response: {data: {}}
        source: https://developer.axis.com/vapix/network-video/regional-settings/#set-regional-settings

sources:
- url: https://developer.axis.com/vapix/network-video/regional-settings/
  sha256_md: 0d218cbf63f85e89be745cbda480dd49586818906af8e9e4e0b255e050f9f016
  retrieved_at: '2026-10-11'

provenance:
  completeness: complete
  open_questions:
  - Request syntax blocks for getRegionalSettings/setRegionalSettings use key 'apiVersions' while tables and examples
    use 'apiVersion' (doc typo).
  - params.units.length required-ness not stated; error 1003 is returned when the request contains no parameters,
    so treated as required.
  - Whether other unit categories than length exist is not stated.
  migrated_from: v1
  curated: true
