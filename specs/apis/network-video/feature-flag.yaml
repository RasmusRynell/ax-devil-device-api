format: 2
id: feature-flag
name: Feature Flag Service
summary: Set, get and list device feature flags (toggle experimental features, gradual roll-outs).
section: network-video
family: jsonrpc
status: released
python:
  module: feature_flag
  class: FeatureFlag
docs:
- https://developer.axis.com/vapix/network-video/feature-flag-service/
access: admin
discovery:
- {api_discovery: feature-flag}

binding:
  path: /axis-cgi/featureflag.cgi
  major: 1
  versions: ['1.0']
  negotiation:
    get_supported_versions: {key: apiVersions}
  params_placement: params

errors:
  1100: {description: Internal error., kind: internal}
  2100: {description: API version not supported., kind: unsupported}
  2101: {description: Invalid JSON., kind: invalid_argument}
  2102: {description: Method not supported., kind: unsupported}
  2103: {description: Required parameter missing., kind: invalid_argument}
  2104: {description: Invalid parameter value specified., kind: invalid_argument}
  2105: {description: Authorization failed., kind: access_denied}
  2106: {description: Authentication failed., kind: access_denied}
  2107: {description: Request too large., kind: invalid_argument}
  2200: {description: Flag does not exist; the message lists the unknown flags., kind: not_found}

types:
  FlagValues:
    type: object
    additionalProperties: {type: boolean}
    description: Flag name to flag value.

  Flag:
    type: object
    description: A feature flag with its metadata.
    required: [name, value, description, defaultValue]
    properties:
      name: {type: string, description: The name of the flag.}
      value: {type: boolean, description: The current flag value.}
      description: {type: string, description: A short description of the flag.}
      defaultValue: {type: boolean, description: The initial flag value.}

  SetFlagsRequest:
    type: object
    required: [flagValues]
    properties:
      flagValues: {$ref: "#/types/FlagValues", description: Flag name and value pairs. The flags are updated according to this map; other flags are unchanged.}

  SetFlagsResult:
    type: object
    required: [result]
    properties:
      result: {type: string, description: "``Success`` if the call was successful."}

  GetFlagsRequest:
    type: object
    required: [names]
    properties:
      names:
        type: array
        items: {type: string}
        description: The names of the flags to retrieve.

  GetFlagsResult:
    type: object
    required: [flagValues]
    properties:
      flagValues: {$ref: "#/types/FlagValues", description: "The flag names and values, corresponding to the requested names."}

  ListFlagsResult:
    type: object
    required: [flags]
    properties:
      flags:
        type: array
        description: All flags on the device with their metadata.
        items: {$ref: "#/types/Flag"}

operations:
  set_flags:
    summary: Set the value of one or multiple flags.
    effect: write
    write: patch
    binding: {method: set}
    params: {$ref: "#/types/SetFlagsRequest"}
    result: {$ref: "#/types/SetFlagsResult"}
    examples:
      - title: Set flags
        request:
          params:
            flagValues: {flag.name.1: true, flag.name.2: true}
        response:
          data: {result: Success}
        source: https://developer.axis.com/vapix/network-video/feature-flag-service/#set-flags
      - title: Invalid parameter value
        request:
          params:
            flagValues: {flag.name.1: true}
        response:
          error: {code: 2104, message: Invalid parameter value specified}
        source: https://developer.axis.com/vapix/network-video/feature-flag-service/#set-flags

  get_flags:
    summary: Retrieve the value of one or multiple flags.
    effect: read
    binding: {method: get}
    params: {$ref: "#/types/GetFlagsRequest"}
    result: {$ref: "#/types/GetFlagsResult"}
    examples:
      - title: Get flags
        request:
          params: {names: [flag.name.1, flag.name.2]}
        response:
          data:
            flagValues: {flag.name.1: true, flag.name.2: false}
        source: https://developer.axis.com/vapix/network-video/feature-flag-service/#get-flags
      - title: Unknown flag
        request:
          params: {names: [com.axis.remotesyslog.fax]}
        response:
          error: {code: 2200, message: "Flag(s) does not exist: com.axis.remotesyslog.fax"}
        source: https://developer.axis.com/vapix/network-video/feature-flag-service/#get-flags

  list_flags:
    summary: Retrieve the value and metadata of all flags.
    effect: read
    binding: {method: listAll}
    result: {$ref: "#/types/ListFlagsResult"}
    examples:
      - title: List all flags
        request: {params: {}}
        response:
          data:
            flags:
              - name: flag.name.1
                value: true
                description: Use both hands for parameter handling.
                defaultValue: false
              - name: flag.name.2
                value: false
                description: Run action engine on ethanol.
                defaultValue: false
        source: https://developer.axis.com/vapix/network-video/feature-flag-service/#list-all-flags
      - title: Internal error
        request: {params: {}}
        response:
          error: {code: 1100, message: Internal error}
        source: https://developer.axis.com/vapix/network-video/feature-flag-service/#list-all-flags

sources:
- url: https://developer.axis.com/vapix/network-video/feature-flag-service/
  sha256_md: ab0810b2c50d205327063e165f1b77132e6f13c0c5e45234b070af8315f49209
  retrieved_at: '2026-10-11'

provenance:
  completeness: complete
  open_questions:
  - The get parameter table names the request field params.flagValues (a list of names), but every example uses params.names; params.names is used.
  - The set success table documents a top-level result, but the examples return data.result.
  - The available flag names are device-specific and not documented.
  - The minimum AXIS OS version is not stated.
  - Whether error 2200 can also be returned by set is not stated.
  migrated_from: v1
  curated: true
