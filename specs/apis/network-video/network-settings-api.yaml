      response:
        error: {code: 4004, message: Invalid parameter(s)}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#assign-a-global-proxy-configuration
  set_resolver_configuration:
    summary: Configure how the device selects a DNS resolver configuration by either setting up a static configuration
      and/or enabling an auto-configuration by DHCP.
    description: This method is used to set a static domain name server (DNS) configuration on the device, but also
      to configure the device to use DNS servers supplied by a DHCP server.
    effect: write
    write: patch
    binding: {method: setResolverConfiguration}
    params:
      type: object
      properties:
        useDhcpResolverInfo:
          type: boolean
          description: Specifies whether the device should switch to using DHCP server provided DNS resolver configuration
            over the static DNS resolver configuration, in the event that a DHCP server provides such a configuration.
        staticNameServers:
          type: array
          items: {type: string}
          description: A list of name servers to use unless name servers are obtained from a DHCP server while the
            device is configured to prefer DHCP assigned DNS resolver configurations.
        staticSearchDomains:
          type: array
          items: {type: string}
          description: A list of search domains to use unless they are obtained from a DHCP server while the device
            is configured to prefer DHCP assigned DNS resolver configurations.
        staticDomainName:
          type: string
          description: A static domain name to use unless one is obtained from a DHCP server while the device is
            configured to prefer DHCP assigned DNS resolver configurations. If excluded, the current value remains
            unchanged.
    examples:
    - title: Assign a static DNS resolver configuration
      request:
        params:
          useDhcpResolverInfo: false
          staticNameServers: [208.67.222.222, 208.67.220.220]
          staticSearchDomains: [axis.com, axis.se]
          staticDomainName: mylocaldoma.in
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#assign-a-static-dns-resolver-configuration
    - title: Assign a static DNS resolver configuration (error response)
      request:
        params:
          useDhcpResolverInfo: false
          staticNameServers: [208.67.222.222, 208.67.220.220]
          staticSearchDomains: [axis.com, axis.se]
          staticDomainName: mylocaldoma.in
      response:
        error: {code: 4001, message: The specified version is not supported}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#assign-a-static-dns-resolver-configuration
    - title: Assign a static DNS resolver configuration (error response)
      request:
        params:
          useDhcpResolverInfo: false
          staticNameServers: [208.67.222.222, 208.67.220.220]
          staticSearchDomains: [axis.com, axis.se]
          staticDomainName: mylocaldoma.in
      response:
        error: {code: 4004, message: Invalid parameter(s)}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#assign-a-static-dns-resolver-configuration
    - title: Enable global proxy configuration
      request:
        params:
          useDhcpResolverInfo: false
          staticNameServers: [208.67.222.222, 208.67.220.220]
          staticSearchDomains: [axis.com, axis.se]
          staticDomainName: mylocaldoma.in
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#enable-global-proxy-configuration
    - title: Enable global proxy configuration (error response)
      request:
        params:
          useDhcpResolverInfo: false
          staticNameServers: [208.67.222.222, 208.67.220.220]
          staticSearchDomains: [axis.com, axis.se]
          staticDomainName: mylocaldoma.in
      response:
        error: {code: 4001, message: The specified version is not supported}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#enable-global-proxy-configuration
    - title: Enable global proxy configuration (error response)
      request:
        params:
          useDhcpResolverInfo: false
          staticNameServers: [208.67.222.222, 208.67.220.220]
          staticSearchDomains: [axis.com, axis.se]
          staticDomainName: mylocaldoma.in
      response:
        error: {code: 4004, message: Invalid parameter(s)}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#enable-global-proxy-configuration
  set_wired8021_x_configuration:
    summary: Configure how and if the device uses 802.1X authentication on the wired network interface.
    description: This method is used to configure 802.1X for a wired network interface device.
    effect: write
    write: patch
    binding: {method: setWired8021XConfiguration}
    params:
      type: object
      required: [deviceName]
      properties:
        deviceName:
          type: string
          description: The name of the device to configure. See [getNetworkInfo](#get-network-info-api-specification)
            on how to retrieve a list of all devices.
        enabled:
          type: boolean
          description: Specifies whether the device should enable 802.1X authentication. If excluded, the value
            remains unchanged.
        mode:
          type: string
          enum: [WPA-Enterprise-PEAP-MSCHAPv2, WPA-Enterprise-EAPTLS, MACsec PSK]
          description: The 802.1X authentication mode that should be used.
        identity:
          type: string
          description: The EAP identity that should be used. If excluded, the value remains unchanged.
        password:
          type: string
          description: The EAP password that should be used. If excluded, the value remains unchanged. This value
            is only used if the mode is set to `WPA-Enterprise-PEAP-MSCHAPv2`.
        eapolVersion:
          type: string
          enum: [EAPoLv1, EAPoLv2, EAPoLv3]
          description: The EAPoL version that should be used. See [IEEE 802.1X EAPoL version values](#ieee-8021x-eapol-version-values)
            for possible values. If excluded, the value remains unchanged. [enum from types.IEEE8021XEAPoLVersionValues]
        peapVersion:
          type: string
          enum: [PEAPv0, PEAPv1]
          description: The PEAP version that should be used.
        label: {type: integer, enum: [1, 2], description: The PEAP label version that should be used.}
        certClient:
          type: string
          description: The Client Certificate ID to identify the client towards the 802.1X radius server.
        certsCA:
          type: array
          items: {type: string}
          description: The CA Certificate IDs to identify the certificate chain of the 802.1X radius server. If
            excluded, the value remains unchanged. Use an empty list to unset the CA certificate.
        mkaCak:
          type: string
          description: The MACsec Key Agreement Connectivity Association Key to use for MACsec PSK.
        mkaCkn:
          type: string
          description: The MACsec Key Agreement Connectivity Association Key Name to use for MACsec PSK.
    examples:
    - title: Assign a wired 802.1X configuration
      request:
        params:
          deviceName: eth0
          enabled: true
          mode: WPA-Enterprise-EAPTLS
          identity: Lobby
          eapolVersion: EAPoLv2
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#assign-a-wired-8021x-configuration
    - title: Assign a wired 802.1X configuration (error response)
      request:
        params:
          deviceName: eth0
          enabled: true
          mode: WPA-Enterprise-EAPTLS
          identity: Lobby
          eapolVersion: EAPoLv2
      response:
        error: {code: 4001, message: The specified version is not supported}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#assign-a-wired-8021x-configuration
    - title: Assign a wired 802.1X configuration (error response)
      request:
        params:
          deviceName: eth0
          enabled: true
          mode: WPA-Enterprise-EAPTLS
          identity: Lobby
          eapolVersion: EAPoLv2
      response:
        error: {code: 4004, message: Invalid parameter(s)}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#assign-a-wired-8021x-configuration
    - title: Assign a wired MACsec PSK configuration
      request:
        params:
          deviceName: eth0
          enabled: true
          mode: MACsec-PSK
          mkaCAK: '00112233445566771111111111111111'
          mkaCKN: caffee
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#assign-a-wired-macsec-psk-configuration
    - title: Assign a wired MACsec PSK configuration (error response)
      request:
        params:
          deviceName: eth0
          enabled: true
          mode: MACsec-PSK
          mkaCAK: '00112233445566771111111111111111'
          mkaCKN: caffee
      response:
        error: {code: 4001, message: The specified version is not supported}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#assign-a-wired-macsec-psk-configuration
    - title: Assign a wired MACsec PSK configuration (error response)
      request:
        params:
          deviceName: eth0
          enabled: true
          mode: MACsec-PSK
          mkaCAK: '00112233445566771111111111111111'
          mkaCKN: caffee
      response:
        error: {code: 4004, message: Invalid parameter(s)}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#assign-a-wired-macsec-psk-configuration
  set_wlan_configuration:
    summary: Apply the WLAN configuration used by WLAN devices.
    description: This method is used to configure device independent WLAN settings and provides the ability to set
      the regular domain used by all WLAN devices in station mode. Apply the WLAN configuration used by WLAN devices.
      Only regulatory domains can be set.
    effect: write
    write: patch
    binding: {method: setWlanConfiguration}
    params:
      type: object
      properties:
        countryCode:
          type: string
          description: The country code used to configure the regulatory domain of WLAN network devices.
    examples:
    - title: Assign the WLAN country code
      request:
        params: {countryCode: DE}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#assign-the-wlan-country-code
    - title: Assign the WLAN country code (error response)
      request:
        params: {countryCode: DE}
      response:
        error: {code: 4004, message: Invalid parameter(s)}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#assign-the-wlan-country-code
  set_wlan_station_configuration:
    summary: Configure the connection to a WLAN access point.
    description: This method is used when you want to configure the WLAN station access control for a specified
      WLAN interface.
    effect: write
    write: patch
    binding: {method: setWLANStationConfiguration}
    params:
      type: object
      required: [deviceName, authentication]
      properties:
        deviceName:
          type: string
          description: The name of the network interface device to configure. See [getNetworkInfo](#get-network-info-api-specification)
            on how to retrieve a list of all network interface devices.
        ssid: {type: string, description: The ssid of the wireless access point.}
        authentication:
          type: object
          x-name: SetWlanStationConfigurationRequestAuthentication
          description: The CA Certificate IDs to use for EAP-TLS and MSCHAPv2 mode. If excluded, the current value
            remains unchanged.
          properties:
            mode: {type: string}
            params:
              type: object
              x-name: SetWlanStationConfigurationRequestAuthenticationParams
              properties:
                identity: {type: string}
                password: {type: string}
                eapolVersion: {type: string}
                peapVersion: {type: string}
                label: {type: integer}
                certClient: {type: string}
                certsCA:
                  type: array
                  items: {type: string}
    errors:
      5000: {description: No device found for the given device name}
    examples:
    - title: Test current WLAN station settings
      request:
        params:
          deviceName: wlan0
          ssid: lobby
          authentication:
            mode: WPA-Enterprise-PEAP-MSCHAPv2
            params:
              identity: user
              password: guest
              eapolVersion: EAPoLv2
              peapVersion: PEAPv1
              label: 1
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#test-current-wlan-station-settings
    - title: Test current WLAN station settings (error response)
      request:
        params:
          deviceName: wlan0
          ssid: lobby
          authentication:
            mode: WPA-Enterprise-PEAP-MSCHAPv2
            params:
              identity: user
              password: guest
              eapolVersion: EAPoLv2
              peapVersion: PEAPv1
              label: 1
      response:
        error: {code: 4001, message: The specified version is not supported}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#test-current-wlan-station-settings
    - title: Test current WLAN station settings (error response)
      request:
        params:
          deviceName: wlan0
          ssid: lobby
          authentication:
            mode: WPA-Enterprise-PEAP-MSCHAPv2
            params:
              identity: user
              password: guest
              eapolVersion: EAPoLv2
              peapVersion: PEAPv1
              label: 1
      response:
        error: {code: 4004, message: Invalid parameter(s)}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#test-current-wlan-station-settings
  test_wlan_station_settings:
    summary: Perform a test on the WLAN interface by trying to connect and authenticate using the current settings.
    description: This method triggers a test of the WLAN station settings on the network interface device to confirm
      that they are correct and it can connect to the WLAN Access Point.
    effect: action
    binding: {method: testWLANStationSettings}
    params:
      type: object
      required: [deviceName]
      properties:
        deviceName:
          type: string
          description: The name of the network interface device to run the rest on. See [getNetworkInfo](#get-network-info-api-specification)
            on how to retrieve a list of all network interface devices.
        timeout:
          type: integer
          default: 10
          description: The timeout for the call, measured in seconds. Default value is `10`.
    result:
      type: object
      properties:
        code:
          type: integer
          description: A code describing the result of the test. For additional information see the Success codes
            table below.
        message: {type: string, description: A message describing the test result code.}
    errors:
      0: {description: Authentication successful.}
      1: {description: Authentication failed.}
      2: {description: Timeout connecting to Access Point., kind: access_denied}
      3: {description: WLAN station configuration changed.}
      4: {description: Interrupted by interface change.}
      5: {description: WLAN configuration is incomplete.}
      5000: {description: No device found for the given device name.}
      5001: {description: Invalid device supplied., kind: invalid_argument}
    examples:
    - title: Test current WLAN station settings
      request:
        params: {deviceName: eth1, timeout: 5}
      response:
        data: {code: 0, message: Authentication successful}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#test-current-wlan-station-settings
    - title: Test current WLAN station settings (response 2)
      request:
        params: {deviceName: eth1, timeout: 5}
      response:
        data: {code: 1, message: Authentication failed}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#test-current-wlan-station-settings
    - title: Test current WLAN station settings (error response)
      request:
        params: {deviceName: eth1, timeout: 5}
      response:
        error: {code: 5001, message: Invalid device supplied}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#test-current-wlan-station-settings
  wlan_switch_ap_to_station:
    summary: Connect to a configured access point when your device is in installation mode.
    description: This method makes the Axis device in installation mode switch from AP to Station mode.
    effect: unknown
    binding: {method: wlanSwitchAPToStation}
    result:
      type: object
      properties:
        code:
          type: integer
          description: A code describing the result of the test. For additional information see the Success codes
            table below.
        message: {type: string, description: A message describing the test result code.}
    errors:
      0: {description: Connection process started.}
      5000: {description: No device found for the given device name.}
      5003: {description: Device is not in installation mode.}
      5004: {description: Incomplete WLAN configuration.}
      100: {description: Parameter `deviceName` error., kind: invalid_argument}
    examples:
    - title: Connect to an access point in installation mode
      request:
        params: {}
      response:
        data: {code: 0, message: Connection process started}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#connect-to-an-access-point-in-installation-mode
    - title: Connect to an access point in installation mode (error response)
      request:
        params: {}
      response:
        error: {code: 1000, message: Internal error}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#connect-to-an-access-point-in-installation-mode

