    summary: Configure how the device selects a DNS resolver configuration by either setting up a static configuration
      and/or enabling an auto-configuration by DHCP.
    description: This method is used to set a static domain name server (DNS) configuration on the device, but also
      to configure the device to use DNS servers supplied by a DHCP server.
    effect: write
    write: patch
    binding:
      method: setResolverConfiguration
    params:
      type: object
      properties:
        useDhcpResolverInfo:
          type: boolean
          description: Prefer the DHCP provided resolver configuration over the static one. Unchanged if omitted.
        staticNameServers:
          type: array
          items:
            type: string
          description: Static name servers; the maximum count is maxSupportedStaticNameServers. Unchanged if omitted.
        staticSearchDomains:
          type: array
          items:
            type: string
          description: Static search domains; the maximum count is maxSupportedStaticSearchDomains. Unchanged if
            omitted.
        staticDomainName:
