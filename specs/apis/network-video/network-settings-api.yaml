# Migrated from the v1 corpus by codegen/migrate_v1.py; not yet curated.
format: 2
id: network-settings-api
name: Network settings API
summary: JSON API (/axis-cgi/network_settings.cgi) to read network info and configure hostname, IPv4/IPv6, DNS resolver,
  proxy, VLAN, wired 802.1X/MACsec, WLAN and...
section: network-video
family: jsonrpc
status: released
python:
  module: network_settings_api
  class: NetworkSettings
docs:
- https://developer.axis.com/vapix/network-video/network-settings-api/
access: admin
discovery:
- {api_discovery: network-settings}
- param: {name: Properties.API.HTTP.Version, value: '3'}
requires:
  firmware: '8.50'

binding:
  path: /axis-cgi/network_settings.cgi
  major: 1
  versions:
  - '1.0'
  - '1.6'
  - '1.9'
  - '1.12'
  - '1.14'
  - '1.15'
  - '1.16'
  - '1.17'
  - '1.21'
  - '1.27'
  - '1.29'
  negotiation:
    get_supported_versions: {key: supportedVersions}
  params_placement: params

errors:
  1000: {description: Internal error., kind: internal}
  2000: {description: Invalid request., kind: invalid_argument}
  2001: {description: Request body too large., kind: invalid_argument}
  3000: {description: Invalid JSON data., kind: invalid_argument}
  4000: {description: Method does not exist., kind: not_found}
  4001: {description: The specified version is not supported., kind: unsupported}
  4002: {description: Authorization failed., kind: access_denied}
  4003: {description: Missing parameter(s)., kind: invalid_argument}
  4004: {description: Invalid parameter(s)., kind: invalid_argument}

types:
  TCPECNModeValues:
    type: string
    enum: [disabled, acceptAndInitiate, acceptOnly]
    description: 'TCP ECN mode values. disabled: Do not accept, nor initiate ECN.; acceptAndInitiate: Both accept
      and initiate ECN.; acceptOnly: Accept incoming ECN, but do not initiate.'
  DeviceSwitchingModeValues:
    type: string
    enum: [auto, manual, none]
    description: Device switching mode values.
  NetworkInterfaceDeviceTypes:
    type: string
    enum: [wired, wlan, wwan, bridged, switchPort]
    description: Network interface device types.
  IPAddressConfigurationModes:
    type: string
    enum: [static, dhcp]
    description: 'IP address configuration modes. static: Static configuration.; dhcp: DHCP assigned configuration.'
  LinkLocalModes: {type: string, enum: ['off', 'on', fallback], description: Link-local modes.}
  IPAddressOriginValues:
    type: string
    enum: [unknown, static, dhcp, linkLocal, RA]
    description: 'IP address origin values. unknown: Unknown string value.; static: Static configuration.; dhcp:
      DHCP assigned configuration.; linkLocal: Link-Local.; RA: Router Advertisement (Only applicable for IPv6 addresses.'
  IPAddressScopeValues:
    type: string
    enum: [nowhere, host, link, site, global]
    description: 'IP address scope values. nowhere: Not set.; host: Host.; link: Link-Local.; site: Site-Local.;
      global: Global.'
  WiredLinkModeValues:
    type: string
    enum:
    - auto
    - 10BaseT-HD
    - 10BaseT-FD
    - 100BaseTX-HD
    - 100BaseTX-FD
    - 1000BaseTX-HD
    - 1000BaseTX-FD
    description: Wired link mode values.
  Wired8021XAuthenticationModes:
    type: string
    enum: [WPA-Enterprise-PEAP-MSCHAPv2, WPA-Enterprise-EAPTLS, MACsec PSK]
    description: Wired 802.1X authentication modes.
  IEEE8021XPEAPVersion:
    type: string
    enum: [PEAPv0, PEAPv1]
    description: 'IEEE 802.1X PEAP version. PEAPv0: PEAP version 0.; PEAPv1: PEAP version 1. Specifies the PEAP
      label.'
  IEEE8021XPEAPLabel:
    type: integer
    enum: [1, 2]
    description: 'IEEE 802.1X PEAP label. 1: Use client EAP encryption.; 2: Use client PEAP encryption.'
  WLANStation8021XAuthenticationModes:
    type: string
    enum:
    - none
    - WPA-Personal-PSK
    - WPA-Personal-HEX
    - WPA-Enterprise-PEAP-MSCHAPv2
    - WPA-Enterprise-EAPTLS
    description: WLAN station 802.1X authentication modes.
  WLANAccessPoint8021XAuthenticationModes:
    type: string
    enum:
    - none
    - WPA-Personal-PSK
    - WPA-Personal-HEX
    - WPA-Enterprise-PEAP-MSCHAPv2
    - WPA-Enterprise-EAPTLS
    description: WLAN access point 802.1X authentication modes.
  IEEE8021XAuthenticationStatus:
    type: string
    enum: [Unknown, Stopped, Unauthorized, Authorized, Connecting]
    description: IEEE 802.1X authentication status.
  IEEE8021XEAPoLVersionValues:
    type: string
    enum: [EAPoLv1, EAPoLv2, EAPoLv3]
    description: 'IEEE 802.1X EAPoL version values. EAPoLv1: EAPoL version 1.; EAPoLv2: EAPoL version 2.; EAPoLv3:
      EAPoL version 3.'
  NetworkInterfaceDeviceStaticStateValues:
    type: string
    enum: [up, down]
    description: 'Network interface device static state values. up: Network interface device static state is up.;
      down: Network interface device static state is down.'
  NetworkInterfaceDeviceStateValues:
    type: string
    enum: [up, down]
    description: 'Network interface device state values. up: Network interface device state is up.; down: Network
      interface device state is down.'
  WlanFrequencyBand:
    type: string
    enum: [2.4GHz, 5GHz]
    description: 'scanWLANNetworks value table: 2.4GHz: 2.4 GHz; 5GHz: 5 GHz'
  WlanSecurityType:
    type: string
    enum: [None, PSK, IEEE 802.1X]
    description: 'scanWLANNetworks value table: None: Open system.; PSK: Pre-shared key.; IEEE 802.1X: Enterprise,
      EAP-TLS/PEAP-MSCHAPv2'
  WlanSecurityVersion:
    type: string
    enum: [WPA1, WPA2]
    description: 'scanWLANNetworks value table: WPA1: WPA (version 1).; WPA2: WPA 2.'

operations:
  add_vlan:
    summary: Adds a new VLAN.
    description: This method adds a new VLAN attached to an existing network interface. The maximum number of VLANs
      is limited, see [getNetworkInfo](#get-network-info-api-specification) to determine the allowed number. Adds
      a new VLAN. The call verifies that the master device that should be used as the main interface for the VLAN
      exists. It will also ensure that no duplicates are added if the VLAN already exists.
    effect: write
    write: create
    binding: {method: addVlan}
    params:
      type: object
      properties:
        masterDeviceName:
          type: string
          description: The network device that the VLAN should be attached to, for example ‘eth0’.
        VlanId:
          type: integer
          description: The numerical identifier for the VLAN. The VLAN will be named after its numerical identifier
            and master network device. An example is ‘eth0.4, where the masterDeviceName = "eth0" and VlanId = 4.
    errors:
      100: {description: Parameter `masterDeviceName` error., kind: invalid_argument}
      101: {description: Parameter `VlanId` error., kind: invalid_argument}
      201: {description: VLAN already exists.}
      202: {description: Maximum number of VLANs in use.}
    examples:
    - title: Add a new VLAN
      request:
        params: {masterDeviceName: eth0, VlanId: 4}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#add-a-new-vlan
    - title: Add a new VLAN (error response)
      request:
        params: {masterDeviceName: eth0, VlanId: 4}
      response:
        error: {code: 4004, message: Invalid parameter(s)}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#add-a-new-vlan
  get_network_info:
    summary: Retrieves the current network configuration and network-related parameters for the device.
    description: This method retrieves the network configuration and additional relevant information from the device.
    effect: read
    binding: {method: getNetworkInfo}
    result:
      type: object
      properties:
        system:
          type: object
          x-name: GetNetworkInfoResultSystem
          description: Contains network parameters that are not tied to a single network interface device.
          properties:
            tcpEcnMode:
              type: integer
              description: The TCP ECN mode makes it possible to notify the sender to reduce its transmission rate
                in order to limit network jams. Refer to table [TCP ECN mode values](#tcp-ecn-mode-values) for possible
                values.
            wlan:
              type: object
              x-name: GetNetworkInfoResultSystemWlan
              properties:
                countryCode:
                  type: string
                  description: The country code used to configure the regulatory domain of WLAN network devices.
                countryCodeLock:
                  type: boolean
                  description: Decides if setting the country code should be allowed. The code is based on product
                    regulatory requirements.
            deviceSwitching:
              type: object
              x-name: GetNetworkInfoResultSystemDeviceSwitching
              description: Contains the parameters related to the selection of active network interface devices(s).
              properties:
                mode:
                  type: string
                  description: Contains the mode specifying how network interface devices are activated. See [Device
                    switching mode values](#device-switching-mode-values) for possible modes.
                devices:
                  type: array
                  items: {type: string}
                  description: Contains a list of available network interface devices that the system can use. The
                    position of the devices in this list also determines their priority, where the left-most has
                    the highest priority.
                manualActiveDevices:
                  type: array
                  items: {type: string}
                  description: Contains a list of network interface devices that the system will always try to bring
                    to an active state if the device switching mode has been set to *manual*.
                activeDevices:
                  type: array
                  items: {type: string}
                  description: Contains a list of network interface devices that are currently in an active state.
            hostname:
              type: object
              x-name: GetNetworkInfoResultSystemHostname
              description: Contains the parameter related to hostname configurations.
              properties:
                useDhcpHostname:
                  type: boolean
                  description: Specifies whether the device should switch between using a DHCP server provided hostname
                    over the static hostname in the event that a DHCP server provides such a hostname.
                hostname: {type: string, description: The hostname currently used by the system.}
                staticHostname: {type: string, description: The static hostname.}
            resolver:
              type: object
              x-name: GetNetworkInfoResultSystemResolver
              description: Contains the parameters related to the DNS resolver configuration.
              properties:
                useDhcpResolverInfo:
                  type: boolean
                  description: Specifies whether the device should switch between using a DHCP server provided DNS
                    resolver configuration over the static configuration, in the event that a DHCP server provides
                    such a configuration.
                nameServers:
                  type: array
                  items: {type: string}
                  description: List of name servers currently in use by the system.
                staticNameServers:
                  type: array
                  items: {type: string}
                  description: The statistically configured list of name servers.
                maxSupportedStaticNameServers: {type: integer, description: The maximum number of simultaneous static
                    name servers.}
                searchDomains:
                  type: array
                  items: {type: string}
                  description: List of search domains currently in use by the system.
                staticSearchDomains:
                  type: array
                  items: {type: string}
                  description: The statistically configured list of search domains.
                maxSupportedStaticSearchDomains: {type: integer, description: The maximum number of simultaneous
                    static search domains.}
                domainName: {type: string, description: The domain name currently in use by the system.}
                staticDomainName: {type: string, description: The statically configured domain name.}
            globalProxies:
              type: object
              x-name: GetNetworkInfoResultSystemGlobalProxies
              description: Contains the parameters related to global proxies.
              properties:
                httpProxy:
                  type: string
                  description: The global HTTP proxy currently in use by the system. Please note that any sensitive
                    information such as passwords will be obscured.
                httpsProxy:
                  type: string
                  description: The global HTTPS proxy currently in use by the system. Please note that any sensitive
                    information such as passwords will be obscured.
                noProxy: {type: string, description: The global `no_proxy` currently in use by the system.}
            maxSupportedVlans: {type: integer, description: The maximum number of supported VLANs.}
        devices:
          type: array
          items:
            type: object
            x-name: GetNetworkInfoResultDevicesItem
            properties:
              name: {type: string, description: Name of the network interface device.}
              type:
                type: string
                description: Type of the network interface device. See [Network interface device types](#network-interface-device-types)
                  for possible values.
              macAddress: {type: string, description: Name of the network interface device.}
              partOfBridge:
                type: string
                description: Name of a bridge network interface device used if the device is part of a bridge or
                  as an empty string.
              link:
                type: boolean
                description: Indicates if a link has been detected for an interface device on either the physical
                  or lower layer on a stacked interface device.
              staticState: {type: string, description: Indicates if the network interface should be up or down.}
              state: {type: string, description: Indicates if the network interface device is up or down.}
              IPv4:
                type: object
                x-name: GetNetworkInfoResultDevicesItemIPv4
                description: If it is supported, contains the parameters related to IPv4 configuration.
                properties:
                  enabled: {type: boolean, description: Specifies if IPv4 is enabled on the network interface device.}
                  configurationMode:
                    type: string
                    description: Determines how the device decides which IPv4 addresses to select as active. See
                      [IP address configuration modes](#ip-address-configuration-modes) for possible values.
                  linkLocalMode:
                    type: string
                    description: Determines how the Axis device decides when to assign a link-local address. See
                      [Link-local modes](#link-local-modes) for a list of supported modes
                  useStaticDHCPFallback:
                    type: boolean
                    description: Specifies if the configured static default route should be used as a fallback when
                      a DHCP leased default router is unavailable.
                  useDHCPStaticRoutes:
                    type: boolean
                    description: Specifies if the DHCP classless static routes should be used. If enabled, the DHCP
                      leased default router will be ignored. Static routes provided by the DHCP server will be installed
                      on the device.
                  addresses:
                    type: array
                    items:
                      type: object
                      x-name: GetNetworkInfoResultDevicesItemIPv4AddressesItem
                      properties:
                        address:
                          type: string
                          description: An IPv4 address currently in use by the network interface device.
                        prefixLength: {type: integer, description: The subnet prefix length of the address.}
                        broadcast: {type: string, description: The broadcast address of the subnet. Not always available.}
                        origin:
                          type: string
                          description: The origin of the address. See [IP address origin values](#ip-address-origin-values)
                            for possible values.
                        scope:
                          type: string
                          description: The scope of the address. See [IP address scope values](#ip-address-scope-values)
                            for possible values.
                    description: List containing all IPv4 address configurations currently in use by the network
                      interface device.
                  staticAddressConfigurations:
                    type: array
                    items:
                      type: object
                      x-name: GetNetworkInfoResultDevicesItemIPv4StaticAddressConfigurationsItem
                      properties:
                        address:
                          type: string
                          description: An IPv4 address in the list of static IPv4 address configurations.
                        prefixLength: {type: integer, description: The subnet prefix length of the address.}
                        broadcast: {type: integer, description: The broadcast address of the subnet. Not always
                            available.}
                    description: List of static IPv4 address configurations.
                  defaultRouter:
                    type: string
                    description: The IPv4 address of the default router currently used by the system.
                  staticDefaultRouter: {type: string, description: The IPv4 address of the static default router.}
              ' IPv4':
                type: object
                x-name: GetNetworkInfoResultDevicesItemIPv42
                properties:
                  maxSupportedStaticAddressConfigurations:
                    type: integer
                    description: The maximum number of supported simultaneous static IPv4 address configurations.
                x-python-name: i_pv4_2
              IPv6:
                type: object
                x-name: GetNetworkInfoResultDevicesItemIPv6
                description: If it is supported, it contains the parameters related to IPv6 configuration.
                properties:
                  enabled:
                    type: boolean
                    description: Specifies whether IPv6 is enabled on the network interface device.
                  configurationMode:
                    type: string
                    description: Determines how the device decides which IPv6 addresses to select as active. See
                      [IP address configuration modes](#ip-address-configuration-modes) for supported values.
                  addresses:
                    type: array
                    items:
                      type: object
                      x-name: GetNetworkInfoResultDevicesItemIPv6AddressesItem
                      properties:
                        address:
                          type: string
                          description: An IPv6 address currently in use by the network interface device.
                        prefixLength: {type: integer, description: The subnet prefix length of the address.}
                        origin:
                          type: string
                          description: The origin of the address. See [IP address origin values](#ip-address-origin-values)
                            for possible values.
                        scope:
                          type: string
                          description: The scope of the address. See [IP address scope values](#ip-address-scope-values)
                            for possible values.
                    description: List containing all IPv4 address configurations currently used by the network interface
                      device.
                  maxSupportedStaticAddressConfigurations:
                    type: integer
                    description: The maximum number of simultaneous static IPv6 address configurations supported.
                  staticAddressConfigurations:
                    type: array
                    items:
                      type: object
                      x-name: GetNetworkInfoResultDevicesItemIPv6StaticAddressConfigurationsItem
                      properties:
                        address:
                          type: string
                          description: An IPv6 address in the list of static IPv4 address configurations.
                    description: List of static IPv6 address configurations.
                  defaultRouter:
                    type: string
                    description: The IPv6 address of the default router currently used by the system.
                  staticDefaultRouter: {type: string, description: The IPv6 address of the static default router.}
              IpV6:
                type: object
                x-name: GetNetworkInfoResultDevicesItemIpV6
                properties:
                  staticAddressConfigurations:
                    type: object
                    x-name: GetNetworkInfoResultDevicesItemIpV6StaticAddressConfigurations
                    properties:
                      prefixLength: {type: integer, description: The subnet prefix length of the address.}
              wired:
                type: object
                x-name: GetNetworkInfoResultDevicesItemWired
                description: Contains the parameters exclusive to wired network interface devices.
                properties:
                  linkMode:
                    type: string
                    description: Link mode determines the transmission speed and duplex mode of the Ethernet connection.
                      See [Wired link mode values](#wired-link-mode-values) for possible values.
                  isDownlink:
                    type: boolean
                    description: Downlink indicates if this wired device is used as a downlink or an uplink device
                      for network communication.
                  supportedLinkModes:
                    type: array
                    items: {type: string}
                    description: Link modes supported by the interface. See [Wired link mode values](#wired-link-mode-values)
                      for possible values.
                  8021X:
                    type: object
                    x-name: GetNetworkInfoResultDevicesItemWiredT8021X
                    description: Contains the parameters exclusive to the wired 802.1X configuration. Its presence
                      indicates support for this feature.
                    properties:
                      enabled: {type: boolean, description: Specifies if 802.1X has been enabled on the device interface.}
                      status:
                        type: string
                        description: Specifies the 802.1X authentication status. See [IEEE 802.1X authentication
                          status](#ieee-8021x-authentication-status) for possible values.
                      mode:
                        type: string
                        description: Specifies which 802.1X authentication mode that is currently active. See [Wired
                          802.1X authentication modes](#wired-8021x-authentication-modes) for possible values.
                      configurations:
                        type: array
                        items:
                          type: object
                          x-name: GetNetworkInfoResultDevicesItemWiredT8021XConfigurationsItem
                          properties:
                            mode:
                              type: string
                              description: Specifies the 802.1X authentication mode for this configuration. See
                                [Wired 802.1X authentication modes](#wired-8021x-authentication-modes) for possible
                                values.
                            params:
                              type: object
                              x-name: GetNetworkInfoResultDevicesItemWiredT8021XConfigurationsItemParams
                              properties:
                                identity: {type: string, description: The EAP identity.}
                                is_password_set: {type: boolean, description: Indicates if the password is set for
                                    this mode.}
                                eapolVersion:
                                  type: string
                                  description: The EAPoL version used in communication with the authenticator. See
                                    [IEEE 802.1X EAPoL version values](#ieee-8021x-eapol-version-values) for possible
                                    values.
                                peapVersion:
                                  type: string
                                  description: The PEAP version used in communication with the authenticator. See
                                    [IEEE 802.1X PEAP version](#ieee-8021x-peap-version) for possible values.
                                label:
                                  type: string
                                  description: The PEAP label used in communication with the authenticator. See
                                    [IEEE 802.1X PEAP label](#ieee-8021x-peap-label) for possible values.
                                is_mka_cak_set:
                                  type: boolean
                                  description: Indicates if the MACsec Key Agreement Connectivity Association Key
                                    is set.
                                mkaCkn: {type: boolean, description: The MACsec Key Agreement Connectivity Association
                                    Key name.}
                                certClient: {type: string, description: The Client Certificate ID to use for EAP-TLS
                                    mode.}
                                certsCA:
                                  type: array
                                  items: {type: string}
                                  description: The CA Certificate IDs to use for EAP-TLS and MSCHAPv2 mode.
                        description: An array of the configured 802.1X modes, which includes an identity and EAPoL
                          version parameters for each mode.
                      supportedModes:
                        type: array
                        items: {type: string}
                        description: Contains the supported authentication modes. See [Wired 802.1X authentication
                          modes](#wired-8021x-authentication-modes) for possible values.
                      MACsecSecured:
                        type: boolean
                        description: Indicates if the current connection is secured by MACsec. This is only applicable
