  set_global_proxy_configuration:
    summary: Configure how the Axis device connects to the network.
    description: This method configures the global proxy configuration on the Axis device. It can be used by all
      services supporting global proxy configuration. Please note that the Axis device must be rebooted for the
      global proxy settings to take effect.
    effect: write
    write: patch
    binding:
      method: setGlobalProxyConfiguration
    params:
      type: object
      properties:
        httpProxy:
          type: string
          description: The global HTTP proxy.
        httpsProxy:
          type: string
          description: The global HTTPS proxy.
        noProxy:
          type: string
          description: The global no_proxy list. Wildcards are not allowed; use a dot prefix (.axis.com) for subdomains
            and CIDR notation (192.168.0.0/24) for networks.
    examples:
    - title: Assign a global proxy configuration
      request:
        params:
          httpProxy: http://208.67.222.1:8080
          httpsProxy: https://208.67.222.2:8080
