  set_ipv4_address_configuration:
    summary: Configure how the device selects an IPv4 address.
    description: This method is used to set up a static IPv4 address configuration on a network interface device,
      but also to configure the network interface device to automatically switch to an IPv4 address configuration
      assigned by a DHCP server on the network.
    effect: write
    write: patch
    binding:
      method: setIPv4AddressConfiguration
    params:
      type: object
      required:
      - deviceName
      properties:
        deviceName:
          type: string
          description: The name of the network interface device; see get_network_info.
        enabled:
          type: boolean
          description: Whether IPv4 is enabled. IPv4 cannot be disabled while IPv6 is disabled. Unchanged if omitted.
        configurationMode:
          $ref: '#/types/ConfigurationMode'
          description: The IPv4 address configuration mode. Unchanged if omitted.
        linkLocalMode:
          $ref: '#/types/LinkLocalMode'
          description: The link-local mode. Unchanged if omitted.
        staticDefaultRouter:
          type: string
          description: The router address, used when the mode is static or dhcp but no router is advertised. Unchanged
            if omitted.
        useStaticDHCPFallback:
          type: boolean
          description: Use the static default router as fallback when a DHCP leased default router is unavailable.
        useDHCPStaticRoutes:
          type: boolean
          description: Use DHCP classless static routes; the DHCP leased default router is then ignored.
        staticAddressConfigurations:
          type: array
          items:
            $ref: '#/types/StaticIPv4Address'
          description: The static addresses. The maximum count is maxSupportedStaticAddressConfigurations. Unchanged
            if omitted.
    examples:
    - title: Assign a static IPv4 address
      request:
        params:
          deviceName: eth0
          configurationMode: static
          staticDefaultRouter: 192.168.0.1
          staticAddressConfigurations:
          - address: 192.168.0.90
            prefixLength: 16
            broadcast: 192.168.255.255
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#assign-a-static-ipv4-address
    - title: Assign a static IPv4 address (error response)
      request:
        params:
          deviceName: eth0
          configurationMode: static
          staticDefaultRouter: 192.168.0.1
          staticAddressConfigurations:
          - address: 192.168.0.90
            prefixLength: 16
            broadcast: 192.168.255.255
      response:
        error:
          code: 4004
          message: Invalid parameter(s)
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#assign-a-static-ipv4-address
    - title: Enable classless static routes via DHCP
      request:
        params:
          deviceName: eth0
          useDHCPStaticRoutes: true
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#enable-classless-static-routes-via-dhcp
    - title: Enable classless static routes via DHCP (error response)
      request:
        params:
          deviceName: eth0
          useDHCPStaticRoutes: true
      response:
        error:
          code: 4004
          message: Invalid parameter(s)
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#enable-classless-static-routes-via-dhcp
    since_fields:
      params.linkLocalMode: '1.21'
      params.useStaticDHCPFallback: '1.21'
      params.useDHCPStaticRoutes: '1.29'
    errors:
      5000:
        description: No device found for the given device name.
        kind: not_found
      4004/subCode 100:
        description: Parameter deviceName error.
        kind: invalid_argument
      4004/subCode 101:
        description: Parameter configurationMode error.
        kind: invalid_argument
      4004/subCode 102:
        description: Parameter staticDefaultRouter error.
        kind: invalid_argument
      4004/subCode 103:
        description: Parameter staticAddressConfigurations error.
        kind: invalid_argument
      4004/subCode 104:
        description: Parameter address error.
        kind: invalid_argument
      4004/subCode 105:
        description: Parameter prefixLength error.
        kind: invalid_argument
      4004/subCode 106:
        description: Parameter broadcast error.
        kind: invalid_argument
      4004/subCode 107:
        description: Parameter address/prefixLength/broadcast combination error.
        kind: invalid_argument
      4004/subCode 108:
        description: Parameter useStaticDHCPFallback error.
        kind: invalid_argument
      4004/subCode 109:
        description: Parameter linkLocalMode error.
        kind: invalid_argument
      4004/subCode 110:
        description: Parameter useDHCPStaticRoutes error.
        kind: invalid_argument
      4004/subCode 111:
        description: Parameter enabled error.
        kind: invalid_argument
  set_ipv6_address_configuration:
