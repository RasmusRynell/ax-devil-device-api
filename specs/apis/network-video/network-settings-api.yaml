                                    identity: {type: string, description: The EAP identity.}
                                    eapolVersion:
                                      type: string
                                      description: The EAPoL version used in communication with the authenticator.
                                        See [IEEE 802.1X EAPoL version values](#ieee-8021x-eapol-version-values)
