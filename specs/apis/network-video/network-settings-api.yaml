sources:
- url: https://developer.axis.com/vapix/network-video/network-settings-api/
  sha256_md: ffb2ee6a97d95d0c7f1f337b50004391fdf4ec46a6b3892d35edb15513aff6a4
  retrieved_at: '2026-10-11'
provenance:
  completeness: complete
  open_questions:
  - Wired 802.1X / WLAN enum tables quote some values ("WPA-Enterprise-EAPTLS") and not others; quotes stripped.
  - Per-method API version requirements (which minor version introduced which field) are only partly stated; versions
    listed are those used in examples.
  - Terminology table lists TCP ECN twice.
  - 'https://developer.axis.com/vapix/network-video/network-settings-api/#retrieve-supported-api-versions: example
    response shows apiVersion 3.1 and supportedVersions ["1.0","2.4","3.1"] (illustrative); api_versions lists the
    1.x versions used in request examples.'
  - 'getSupportedVersions syntax has typo "apiVersions: <major>.<minor>" (missing quote).'
  - Request parameters not marked *Optional* are treated as required only for the identifying fields (deviceName,
    VlanId, masterDeviceName, VlanName, countryCode); setGlobalProxyConfiguration marks none optional, but its example
    omits noProxy, so all three are optional.
  - Method versions come from the first example version of each method (setIPv6AddressConfiguration 1.6, setWLANStationConfiguration
    1.12, scanWLANNetworks 1.14, wlanSwitchAPToStation 1.16, setDeviceConfiguration 1.17, setWlanConfiguration 1.27);
    field gates linkLocalMode and useStaticDHCPFallback 1.21 and useDHCPStaticRoutes 1.29 come from example versions
    as well. The docs do not state them.
  - getNetworkInfo examples use 1.9 (switch ports) and 1.15; which result fields were added in which minor version
    is not stated, so result fields are not gated.
  - removeVlan lists masterDeviceName and VlanName as parameters, but its example sends only VlanName; the spec
    requires both and the example adds masterDeviceName.
  - tcpEcnMode is typed integer in the table, but the syntax and example give strings (see the TCP ECN mode values);
    modelled as an enum of strings.
  - setIPv4AddressConfiguration staticAddressConfigurations.prefixLength is typed string in the table but the example
    and the getNetworkInfo table use an integer; modelled as an integer.
  - setGlobalProxyConfiguration types the parameters as [<string>] in the table, but the example and getNetworkInfo
    use plain strings; modelled as strings.
  - The wired 802.1X mode MACsec PSK is written "MACsec PSK" in the mode table but MACsec-PSK in the parameter descriptions
    and the example; MACsec-PSK is used.
  - The setWired8021XConfiguration MACsec example uses mkaCAK and mkaCKN; the table names are mkaCak and mkaCkn,
    and the example is corrected.
  - getNetworkInfo wired 8021X params.mkaCkn is typed boolean in the table but string in the syntax; modelled as
    a string. The device table also has typos (IpV6, a blank key for wlan.station 8021X status) that were normalized.
  - The scanWLANNetworks example writes the band as 2.4Ghz; the spec example uses 2.4GHz. The security field is
    an object in the table but an array of objects in the syntax and example; modelled as an array.
  - Sub-codes are modelled as errors keyed "4004/subCode N" and assumed to accompany error 4004; the docs list them
    under each method without naming the main code.
  - The getNetworkInfo example returns peapVersion as the integer 1; the spec example uses PEAPv1 as in the tables.
  - Error code 5000 and the other 5xxx codes are method specific top-level codes; the test and switch result codes
    (0 to 5) are success codes, not errors.
  migrated_from: v1
  curated: true
