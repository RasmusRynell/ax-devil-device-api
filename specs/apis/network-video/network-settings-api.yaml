  set_wired_8021x_configuration:
    summary: Configure how and if the device uses 802.1X authentication on the wired network interface.
    description: This method is used to configure 802.1X for a wired network interface device.
    effect: write
    write: patch
    binding:
      method: setWired8021XConfiguration
    params:
      type: object
      required:
      - deviceName
      x-masked: [mkaCak, password]
      properties:
        deviceName:
          type: string
          description: The name of the network interface device; see get_network_info.
        enabled:
          type: boolean
          description: Enable 802.1X authentication. Unchanged if omitted.
        mode:
          $ref: '#/types/Wired8021xMode'
          description: The authentication mode. Unchanged if omitted.
        identity:
          type: string
          description: The EAP identity. Unchanged if omitted.
        password:
          type: string
          description: The EAP password; only used with WPA-Enterprise-PEAP-MSCHAPv2. Unchanged if omitted.
        eapolVersion:
          $ref: '#/types/EapolVersion'
          description: The EAPoL version. Unchanged if omitted.
        peapVersion:
          $ref: '#/types/PeapVersion'
          description: The PEAP version; only used with WPA-Enterprise-PEAP-MSCHAPv2. Unchanged if omitted.
        label:
          $ref: '#/types/PeapLabel'
          description: The PEAP label; only used with WPA-Enterprise-PEAP-MSCHAPv2. Unchanged if omitted.
        certClient:
          type: string
          description: The client certificate ID that identifies the client to the radius server; required to enable
            WPA-Enterprise-EAPTLS. An empty string unsets it. Unchanged if omitted.
        certsCA:
          type: array
          items:
            type: string
          description: The CA certificate IDs that identify the radius server certificate chain. An empty list unsets
            them. Unchanged if omitted.
        mkaCak:
          type: string
          description: 'The MACsec Key Agreement CAK for MACsec-PSK: 32 or 64 hexadecimal characters. Unchanged
            if omitted.'
        mkaCkn:
          type: string
          description: 'The MACsec Key Agreement CAK name for MACsec-PSK: 2 to 64 hexadecimal characters, an even
            count. Unchanged if omitted.'
    examples:
    - title: Assign a wired 802.1X configuration
      request:
        params:
          deviceName: eth0
          enabled: true
          mode: WPA-Enterprise-EAPTLS
          identity: Lobby
          eapolVersion: EAPoLv2
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#assign-a-wired-8021x-configuration
    - title: Assign a wired 802.1X configuration (error response)
      request:
        params:
          deviceName: eth0
          enabled: true
          mode: WPA-Enterprise-EAPTLS
          identity: Lobby
          eapolVersion: EAPoLv2
      response:
        error:
          code: 4001
          message: The specified version is not supported
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#assign-a-wired-8021x-configuration
    - title: Assign a wired 802.1X configuration (error response)
      request:
        params:
          deviceName: eth0
          enabled: true
          mode: WPA-Enterprise-EAPTLS
          identity: Lobby
          eapolVersion: EAPoLv2
      response:
        error:
          code: 4004
          message: Invalid parameter(s)
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#assign-a-wired-8021x-configuration
    - title: Assign a wired MACsec PSK configuration
      request:
        params:
          deviceName: eth0
          enabled: true
          mode: MACsec-PSK
          mkaCak: '00112233445566771111111111111111'
          mkaCkn: caffee
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#assign-a-wired-macsec-psk-configuration
    - title: Assign a wired MACsec PSK configuration (error response)
      request:
        params:
          deviceName: eth0
          enabled: true
          mode: MACsec-PSK
          mkaCak: '00112233445566771111111111111111'
          mkaCkn: caffee
      response:
        error:
          code: 4001
          message: The specified version is not supported
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#assign-a-wired-macsec-psk-configuration
    - title: Assign a wired MACsec PSK configuration (error response)
      request:
        params:
          deviceName: eth0
          enabled: true
          mode: MACsec-PSK
          mkaCak: '00112233445566771111111111111111'
          mkaCkn: caffee
      response:
        error:
          code: 4004
          message: Invalid parameter(s)
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#assign-a-wired-macsec-psk-configuration
    errors:
      4004/subCode 100:
        description: Parameter deviceName error.
        kind: invalid_argument
      4004/subCode 101:
        description: Parameter enabled error.
        kind: invalid_argument
      4004/subCode 102:
        description: Parameter mode error.
        kind: invalid_argument
      4004/subCode 103:
        description: Parameter identity error.
        kind: invalid_argument
      4004/subCode 104:
        description: Parameter eapolVersion error.
        kind: invalid_argument
      4004/subCode 112:
        description: Parameter certClient error.
        kind: invalid_argument
