  test_wlan_station_settings:
    summary: Perform a test on the WLAN interface by trying to connect and authenticate using the current settings.
    description: This method triggers a test of the WLAN station settings on the network interface device to confirm
      that they are correct and it can connect to the WLAN Access Point.
    effect: action
    binding:
      method: testWLANStationSettings
    params:
      type: object
      required:
      - deviceName
      properties:
        deviceName:
          type: string
          description: The network interface device to test; see get_network_info.
        timeout:
          type: integer
          default: 10
          description: The timeout of the call in seconds. Defaults to 10.
    result:
      $ref: '#/types/WlanTestResult'
    examples:
    - title: Test current WLAN station settings
      request:
        params:
          deviceName: eth1
          timeout: 5
      response:
        data:
          code: 0
          message: Authentication successful
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#test-current-wlan-station-settings
    - title: Test current WLAN station settings (response 2)
      request:
        params:
          deviceName: eth1
          timeout: 5
      response:
        data:
          code: 1
          message: Authentication failed
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#test-current-wlan-station-settings
    - title: Test current WLAN station settings (error response)
      request:
        params:
          deviceName: eth1
          timeout: 5
      response:
        error:
          code: 5001
          message: Invalid device supplied
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#test-current-wlan-station-settings
    errors:
      5000:
        description: No device found for the given device name.
        kind: not_found
      5001:
        description: Invalid device supplied.
        kind: invalid_argument
