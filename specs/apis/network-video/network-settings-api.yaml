              switchPort:
                type: object
                x-name: GetNetworkInfoResultDevicesItemSwitchPort
                description: Contains the parameters exclusive to network interface devices of the type `switchPort`.
                properties:
                  portNumber: {type: integer, description: The port number of the switch port.}
                  remoteAddresses:
                    type: array
                    items: {type: string}
                    description: A list containing all store remote MAC addresses that can be observed on the switch
