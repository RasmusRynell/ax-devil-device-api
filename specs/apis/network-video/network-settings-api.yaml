                                    peapVersion:
                                      type: string
                                      description: The PEAP version used in communication with the authenticator.
                                        See [IEEE 802.1X PEAP version](#ieee-8021x-peap-version) for possible values.
                                    label:
                                      type: string
                                      description: The PEAP label used in communication with the authenticator.
                                        See [IEEE 802.1X PEAP label](#ieee-8021x-peap-label) for possible values.
                                    certClient: {type: string, description: The Client Certificate ID to use for
                                        EAP-TLS and MSCHAPv2 mode.}
                                    certsCA:
                                      type: array
                                      items: {type: string}
                                      description: The CA Certificate IDs to use for EAP-TLS and MSCHAPv2 mode.
                            description: An array containing the configured WLAN station 802.1X modes with parameters
                              for each mode.
                          supportedModes:
                            type: array
                            items: {type: string}
                            description: Contains the supported authentication modes. See [WLAN station 802.1X authentication
                              modes](#wlan-station-8021x-authentication-modes) for possible values.
                      ? ''
                      : type: object
                        x-name: GetNetworkInfoResultDevicesItemWlanStationT
                        properties:
                          8021X:
                            type: object
                            x-name: GetNetworkInfoResultDevicesItemWlanStationTT8021X
                            properties:
                              status:
                                type: string
                                description: Specifies the WLAN station 802.1X authentication status. See [IEEE
                                  802.1X authentication status](#ieee-8021x-authentication-status) for possible
                                  values.
