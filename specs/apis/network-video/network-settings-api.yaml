format: 2
id: network-settings-api
name: Network settings API
summary: Read the network configuration and configure hostname, IPv4 and IPv6, DNS resolver, global proxy, VLANs,
  wired 802.1X and MACsec, and WLAN station and access point settings.
section: network-video
family: jsonrpc
status: released
python:
  module: network_settings_api
  class: NetworkSettings
docs:
- https://developer.axis.com/vapix/network-video/network-settings-api/
access: admin
discovery:
- api_discovery: network-settings
requires:
  firmware: '8.50'
binding:
  path: /axis-cgi/network_settings.cgi
  major: 1
  versions:
  - '1.0'
  - '1.6'
  - '1.9'
  - '1.12'
  - '1.14'
  - '1.15'
  - '1.16'
  - '1.17'
  - '1.21'
  - '1.27'
  - '1.29'
  negotiation:
    get_supported_versions:
      key: supportedVersions
  params_placement: params
errors:
  1000:
    description: Internal error.
    kind: internal
  2000:
    description: Invalid request.
    kind: invalid_argument
  2001:
    description: Request body too large.
    kind: invalid_argument
  3000:
    description: Invalid JSON data.
    kind: invalid_argument
  4000:
    description: Method does not exist.
    kind: not_found
  4001:
    description: The specified version is not supported.
    kind: unsupported
  4002:
    description: Authorization failed.
    kind: access_denied
  4003:
    description: Missing parameter(s).
    kind: invalid_argument
  4004:
    description: Invalid parameter(s).
    kind: invalid_argument
types:
  TcpEcnMode:
    enum:
    - disabled
    - acceptAndInitiate
    - acceptOnly
    description: 'disabled: neither accept nor initiate ECN. acceptAndInitiate: both. acceptOnly: accept incoming
      ECN but do not initiate.'
  DeviceSwitchingMode:
    enum:
    - auto
    - manual
    - none
    description: 'auto: the highest priority available device is active. manual: only manualActiveDevices are active.
      none: no device is active.'
  DeviceType:
    enum:
    - wired
    - wlan
    - wwan
    - bridged
    - switchPort
  ConfigurationMode:
    enum:
    - static
    - dhcp
  LinkLocalMode:
    enum:
    - 'off'
    - 'on'
    - fallback
    description: 'off: never assign a link-local IPv4 address. on: always assign one. fallback: only if the primary
      configuration mode fails.'
  AddressOrigin:
    enum:
    - unknown
    - static
    - dhcp
    - linkLocal
    - RA
    description: RA (router advertisement) only applies to IPv6 addresses.
  AddressScope:
    enum:
    - nowhere
    - host
    - link
    - site
    - global
  WiredLinkMode:
    enum:
    - auto
    - 10BaseT-HD
    - 10BaseT-FD
    - 100BaseTX-HD
    - 100BaseTX-FD
    - 1000BaseTX-HD
    - 1000BaseTX-FD
  Wired8021xMode:
    enum:
    - WPA-Enterprise-PEAP-MSCHAPv2
    - WPA-Enterprise-EAPTLS
    - MACsec-PSK
  PeapVersion:
    enum:
    - PEAPv0
    - PEAPv1
  PeapLabel:
    enum:
    - 1
    - 2
    description: '1: use client EAP encryption. 2: use client PEAP encryption.'
  WlanAuthenticationMode:
    enum:
    - none
    - WPA-Personal-PSK
    - WPA-Personal-HEX
    - WPA-Enterprise-PEAP-MSCHAPv2
    - WPA-Enterprise-EAPTLS
  Ieee8021xStatus:
    enum:
    - Unknown
    - Stopped
    - Unauthorized
    - Authorized
    - Connecting
  EapolVersion:
    enum:
    - EAPoLv1
    - EAPoLv2
    - EAPoLv3
  DeviceStaticState:
    enum:
    - up
    - down
  DeviceState:
    enum:
    - up
    - down
  WlanBand:
    enum:
    - 2.4GHz
    - 5GHz
  WlanSecurityType:
    enum:
    - None
    - PSK
    - IEEE 802.1X
  WlanSecurityVersion:
    enum:
    - WPA1
    - WPA2
  NetworkInfo:
    type: object
    required:
    - system
    - devices
    properties:
      system:
        $ref: '#/types/SystemInfo'
      devices:
        type: array
        items:
          $ref: '#/types/NetworkDevice'
        description: The network interface devices.
  SystemInfo:
    type: object
    description: Network parameters that are not tied to one network interface device.
    properties:
      tcpEcnMode:
        $ref: '#/types/TcpEcnMode'
        description: The TCP ECN mode.
      wlan:
        type: object
        description: WLAN settings that are not tied to one device.
        properties:
          countryCode:
            type: string
            description: The country code of the WLAN regulatory domain; XX means not configured. Only present when
              a WLAN device exists.
          countryCodeLock:
            type: boolean
            description: Whether setting the country code is disallowed, based on regulatory requirements.
      deviceSwitching:
        type: object
        description: Selection of active network interface devices.
        properties:
          mode:
            $ref: '#/types/DeviceSwitchingMode'
          devices:
            type: array
            items:
              type: string
            description: Available devices, highest priority first.
          manualActiveDevices:
            type: array
            items:
              type: string
            description: Devices brought up when the mode is manual.
          activeDevices:
            type: array
            items:
              type: string
            description: Devices that are currently active.
      hostname:
        type: object
        description: Hostname settings.
        properties:
          useDhcpHostname:
            type: boolean
            description: Prefer a DHCP provided hostname over the static hostname.
          hostname:
            type: string
            description: The hostname in use.
          staticHostname:
            type: string
            description: The static hostname.
      resolver:
        type: object
        description: DNS resolver settings.
        properties:
          useDhcpResolverInfo:
            type: boolean
            description: Prefer the DHCP provided resolver configuration over the static one.
          nameServers:
            type: array
            items:
              type: string
            description: Name servers in use.
          staticNameServers:
            type: array
            items:
              type: string
            description: The static name servers.
          maxSupportedStaticNameServers:
            type: integer
            description: Maximum number of static name servers.
          searchDomains:
            type: array
            items:
              type: string
            description: Search domains in use.
          staticSearchDomains:
            type: array
            items:
              type: string
            description: The static search domains.
          maxSupportedStaticSearchDomains:
            type: integer
            description: Maximum number of static search domains.
          domainName:
            type: string
            description: The domain name in use.
          staticDomainName:
            type: string
            description: The static domain name.
      globalProxies:
        type: object
        description: Global proxy settings.
        properties:
          httpProxy:
            type: string
            description: The global HTTP proxy. Sensitive information such as passwords is obscured.
          httpsProxy:
            type: string
            description: The global HTTPS proxy. Sensitive information such as passwords is obscured.
          noProxy:
            type: string
            description: The global no_proxy list.
      maxSupportedVlans:
        type: integer
        description: The maximum number of VLANs.
  IPv4Address:
    type: object
    description: An IPv4 address in use.
    required:
    - address
    properties:
      address:
        type: string
      prefixLength:
        type: integer
        description: The subnet prefix length.
      broadcast:
        type: string
        description: The broadcast address; not always available.
      origin:
        $ref: '#/types/AddressOrigin'
      scope:
        $ref: '#/types/AddressScope'
  StaticIPv4Address:
    type: object
    description: A static IPv4 address configuration.
    required:
    - address
    properties:
      address:
        type: string
      prefixLength:
        type: integer
        description: The subnet prefix length.
      broadcast:
        type: string
        description: The broadcast address; not always available.
  IPv4Settings:
    type: object
    description: IPv4 configuration of a device.
    properties:
      enabled:
        type: boolean
        description: Whether IPv4 is enabled.
      configurationMode:
        $ref: '#/types/ConfigurationMode'
      linkLocalMode:
        $ref: '#/types/LinkLocalMode'
      useStaticDHCPFallback:
        type: boolean
        description: Use the static default router as fallback when a DHCP leased default router is unavailable.
      useDHCPStaticRoutes:
        type: boolean
        description: Use DHCP classless static routes; the DHCP leased default router is then ignored.
      addresses:
        type: array
        items:
          $ref: '#/types/IPv4Address'
        description: All addresses in use.
      maxSupportedStaticAddressConfigurations:
        type: integer
        description: Maximum number of static address configurations.
      staticAddressConfigurations:
        type: array
        items:
          $ref: '#/types/StaticIPv4Address'
        description: The static address configurations.
      defaultRouter:
        type: string
        description: The default router in use.
      staticDefaultRouter:
        type: string
        description: The static default router.
  IPv6Address:
    type: object
    description: An IPv6 address in use.
    required:
    - address
    properties:
      address:
        type: string
      prefixLength:
        type: integer
        description: The subnet prefix length.
      origin:
        $ref: '#/types/AddressOrigin'
      scope:
        $ref: '#/types/AddressScope'
  StaticIPv6Address:
    type: object
    description: A static IPv6 address configuration.
    required:
    - address
    properties:
      address:
        type: string
      prefixLength:
        type: integer
        description: The subnet prefix length.
  IPv6Settings:
    type: object
    description: IPv6 configuration of a device.
    properties:
      enabled:
        type: boolean
        description: Whether IPv6 is enabled.
      configurationMode:
        $ref: '#/types/ConfigurationMode'
      addresses:
        type: array
        items:
          $ref: '#/types/IPv6Address'
        description: All addresses in use.
      maxSupportedStaticAddressConfigurations:
        type: integer
        description: Maximum number of static address configurations.
      staticAddressConfigurations:
        type: array
        items:
          $ref: '#/types/StaticIPv6Address'
        description: The static address configurations.
      defaultRouter:
        type: string
        description: The default router in use.
      staticDefaultRouter:
        type: string
        description: The static default router.
  Wired8021xParams:
    type: object
    description: Parameters of one wired 802.1X mode.
    properties:
      identity:
        type: string
        description: The EAP identity.
      is_password_set:
        type: boolean
        description: Whether a password is set.
      eapolVersion:
        $ref: '#/types/EapolVersion'
      peapVersion:
        $ref: '#/types/PeapVersion'
      label:
        $ref: '#/types/PeapLabel'
      is_mka_cak_set:
        type: boolean
        description: Whether the MACsec Key Agreement CAK is set.
      mkaCkn:
        type: string
        description: The MACsec Key Agreement CAK name.
      certClient:
        type: string
        description: The client certificate ID used for EAP-TLS.
      certsCA:
        type: array
        items:
          type: string
        description: The CA certificate IDs used for EAP-TLS and MSCHAPv2.
  Wired8021xConfiguration:
    type: object
    description: One configured wired 802.1X mode.
    properties:
      mode:
        $ref: '#/types/Wired8021xMode'
      params:
        $ref: '#/types/Wired8021xParams'
  Wired8021x:
    type: object
    description: Wired 802.1X state; its presence indicates support.
    properties:
      enabled:
        type: boolean
        description: Whether 802.1X is enabled on the interface.
      status:
        $ref: '#/types/Ieee8021xStatus'
      mode:
        $ref: '#/types/Wired8021xMode'
        description: The active mode.
      configurations:
        type: array
        items:
          $ref: '#/types/Wired8021xConfiguration'
        description: The configured modes.
      supportedModes:
        type: array
        items:
          $ref: '#/types/Wired8021xMode'
        description: The supported modes.
      MACsecSecured:
        type: boolean
        description: Whether the connection is secured by MACsec; applies to MACsec-PSK, or WPA-Enterprise-EAPTLS
          with EAPoL version 3.
  WiredSettings:
    type: object
    description: Parameters exclusive to wired devices.
    properties:
      linkMode:
        $ref: '#/types/WiredLinkMode'
      isDownlink:
        type: boolean
        description: Whether the device is a downlink (towards leaf devices) rather than an uplink.
      supportedLinkModes:
        type: array
        items:
          $ref: '#/types/WiredLinkMode'
        description: The supported link modes.
      8021X:
        $ref: '#/types/Wired8021x'
        x-python-name: ieee_8021x
  WlanStationParams:
    type: object
    description: Parameters of one WLAN station 802.1X mode.
    properties:
      is_psk_set:
        type: boolean
        description: Whether the pre-shared key is set.
      is_hex_set:
        type: boolean
        description: Whether the hex key is set.
      is_password_set:
        type: boolean
        description: Whether the password is set.
      identity:
        type: string
        description: The EAP identity.
      eapolVersion:
        $ref: '#/types/EapolVersion'
      peapVersion:
        $ref: '#/types/PeapVersion'
      label:
        $ref: '#/types/PeapLabel'
      certClient:
        type: string
        description: The client certificate ID.
      certsCA:
        type: array
        items:
          type: string
        description: The CA certificate IDs.
  WlanStationConfiguration:
    type: object
    description: One configured WLAN station mode.
    properties:
      mode:
        $ref: '#/types/WlanAuthenticationMode'
      params:
        $ref: '#/types/WlanStationParams'
  WlanStation8021x:
    type: object
    description: WLAN station authentication state.
    properties:
      enabled:
        type: boolean
        description: Whether the WLAN station is enabled on the interface.
      status:
        $ref: '#/types/Ieee8021xStatus'
      mode:
        $ref: '#/types/WlanAuthenticationMode'
        description: The active mode.
      configurations:
        type: array
        items:
          $ref: '#/types/WlanStationConfiguration'
        description: The configured modes.
      supportedModes:
        type: array
        items:
          $ref: '#/types/WlanAuthenticationMode'
        description: The supported modes.
  WlanStation:
    type: object
    description: WLAN station feature; its presence indicates support.
    properties:
      activeSsid:
        type: string
        description: The SSID of the configured station.
      8021X:
        $ref: '#/types/WlanStation8021x'
        x-python-name: ieee_8021x
  WlanAccessPoint:
    type: object
    description: WLAN access point feature; its presence indicates support.
    properties:
      ssid:
        type: string
        description: The access point SSID.
      enabled:
        type: boolean
        description: Whether the access point is enabled on the interface.
      authenticationMode:
        $ref: '#/types/WlanAuthenticationMode'
        description: The active authentication mode.
      installationModeSupported:
        type: boolean
        description: Present when the access point supports the installation mode.
  WlanSettings:
    type: object
    description: Parameters exclusive to WLAN devices.
    properties:
      station:
        $ref: '#/types/WlanStation'
      accessPoint:
        $ref: '#/types/WlanAccessPoint'
  SwitchPortSettings:
    type: object
    description: Parameters exclusive to switchPort devices.
    properties:
      portNumber:
        type: integer
        description: The switch port number.
      remoteAddresses:
        type: array
        items:
          type: string
        description: Remote MAC addresses seen on the port.
  NetworkDevice:
    type: object
    description: A network interface device.
    required:
    - name
    - type
    properties:
      name:
        type: string
        description: Name of the network interface device.
      type:
        $ref: '#/types/DeviceType'
      macAddress:
        type: string
        description: The MAC address.
      partOfBridge:
        type: string
        description: Name of the bridge device this device is part of, or an empty string.
      link:
        type: boolean
        description: Whether a link is detected.
      staticState:
        $ref: '#/types/DeviceStaticState'
        description: Whether the interface should be up or down.
      state:
        $ref: '#/types/DeviceState'
        description: Whether the interface is up or down.
      IPv4:
        $ref: '#/types/IPv4Settings'
        x-python-name: ipv4
      IPv6:
        $ref: '#/types/IPv6Settings'
        x-python-name: ipv6
      wired:
        $ref: '#/types/WiredSettings'
      wlan:
        $ref: '#/types/WlanSettings'
      switchPort:
        $ref: '#/types/SwitchPortSettings'
  WlanNetwork:
    type: object
    description: A WLAN network found by a scan.
    required:
    - ssid
    properties:
      ssid:
        type: string
        description: The SSID.
      band:
        $ref: '#/types/WlanBand'
      channel:
        type: integer
        description: The network channel.
      signalStrengthDBm:
        type: integer
        description: The signal strength in dBm.
      security:
        type: array
        items:
          $ref: '#/types/WlanSecurity'
        description: The security parameters available on the network.
  WlanSecurity:
    type: object
    description: One security option of a network.
    properties:
      authentication:
        $ref: '#/types/WlanSecurityType'
      version:
        $ref: '#/types/WlanSecurityVersion'
        description: Only applicable when authentication is PSK or IEEE 802.1X.
  WlanScanResult:
    type: object
    required:
    - networks
    properties:
      networks:
        type: array
        items:
          $ref: '#/types/WlanNetwork'
  WlanTestResult:
    type: object
    description: Outcome of a WLAN station test.
    required:
    - code
    - message
    properties:
      code:
        type: integer
        description: 'Result of the test: 0 authentication successful, 1 authentication failed, 2 timeout connecting
          to the access point, 3 WLAN station configuration changed, 4 interrupted by interface change, 5 WLAN configuration
          is incomplete.'
      message:
        type: string
        description: A message describing the result code.
  WlanSwitchResult:
    type: object
    description: Outcome of the switch from access point to station.
    required:
    - code
    - message
    properties:
      code:
        type: integer
        description: '0: the connection process started.'
      message:
        type: string
        description: A message describing the result code.
  WlanStationAuthParams:
    type: object
    description: WLAN station 802.1X authentication parameters.
    x-masked: [password]
    properties:
      identity:
        type: string
        description: The EAP identity. Unchanged if omitted.
      password:
        type: string
        description: The password. Unchanged if omitted.
      eapolVersion:
        $ref: '#/types/EapolVersion'
      peapVersion:
        $ref: '#/types/PeapVersion'
      label:
        $ref: '#/types/PeapLabel'
      certClient:
        type: string
        description: The client certificate ID for EAP-TLS. Unchanged if omitted.
      certsCA:
        type: array
        items:
          type: string
        description: The CA certificate IDs for EAP-TLS and MSCHAPv2. Unchanged if omitted.
  WlanStationAuthentication:
    type: object
    description: WLAN station authentication settings.
    properties:
      mode:
        $ref: '#/types/WlanAuthenticationMode'
        description: The authentication mode to use.
      params:
        $ref: '#/types/WlanStationAuthParams'
operations:
  add_vlan:
    summary: Adds a new VLAN.
    description: This method adds a new VLAN attached to an existing network interface. The maximum number of VLANs
      is limited, see [getNetworkInfo](#get-network-info-api-specification) to determine the allowed number. Adds
      a new VLAN. The call verifies that the master device that should be used as the main interface for the VLAN
      exists. It will also ensure that no duplicates are added if the VLAN already exists.
    effect: write
    write: create
    binding:
      method: addVlan
    params:
      type: object
      required:
      - masterDeviceName
      - VlanId
      properties:
        masterDeviceName:
          type: string
          description: The network device the VLAN is attached to, for example eth0.
        VlanId:
          type: integer
          description: The numerical VLAN identifier. The VLAN is named after its master device and ID, for example
            eth0.4.
    examples:
    - title: Add a new VLAN
      request:
        params:
          masterDeviceName: eth0
          VlanId: 4
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#add-a-new-vlan
    - title: Add a new VLAN (error response)
      request:
        params:
          masterDeviceName: eth0
          VlanId: 4
      response:
        error:
          code: 4004
          message: Invalid parameter(s)
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#add-a-new-vlan
    errors:
      4004/subCode 100:
        description: Parameter masterDeviceName error.
        kind: invalid_argument
      4004/subCode 101:
        description: Parameter VlanId error.
        kind: invalid_argument
      4004/subCode 201:
        description: VLAN already exists.
        kind: invalid_argument
      4004/subCode 202:
        description: Maximum number of VLANs in use.
        kind: unavailable
  get_network_info:
    summary: Retrieves the current network configuration and network-related parameters for the device.
    description: This method retrieves the network configuration and additional relevant information from the device.
    effect: read
    binding:
      method: getNetworkInfo
    result:
      $ref: '#/types/NetworkInfo'
    examples:
    - title: Read network configuration
      request:
        params: {}
      response:
        data:
          system:
            tcpEcnMode: acceptAndInitiate
            wlan:
              countryCode: DE
              countryCodeLock: false
            deviceSwitching:
              mode: auto
              devices:
              - eth0
              - eth1
              manualActiveDevices:
              - eth0
              activeDevices:
              - eth0
            hostname:
              useDhcpHostname: true
              hostname: somehostname
              staticHostname: somestatichostname
            resolver:
              useDhcpResolverInfo: true
              nameServers:
              - 192.168.0.1
              - fd::1
              staticNameServers:
              - 192.168.0.8
              - 192.168.0.4
              maxSupportedStaticNameServers: 3
              searchDomains:
              - example.com
              staticSearchDomains:
              - something.net
              - something-else.org
              maxSupportedStaticSearchDomains: 6
              domainName: axis.com
              staticDomainName: abczxcqwe.se
            globalProxies:
              httpProxy: http://user:pass@192.168.1.1:8080
              httpsProxy: https://user:pass@192.168.1.1:8080
              noProxy: 172.25.73.21,::1,.axis.com,localhost,169.254.0.0/16
          devices:
          - name: eth0
            type: wired
            macAddress: ac:cc:8e:68:8e:c4
            partOfBridge: ''
            link: true
            state: up
            staticState: up
            IPv4:
              enabled: true
              configurationMode: dhcp
              linkLocalMode: 'off'
              addresses:
              - address: 192.168.0.165
                prefixLength: 24
                origin: dhcp
                scope: global
                broadcast: 192.168.0.225
              - address: 169.254.211.16
                prefixLength: 16
                origin: linkLocal
                scope: link
              maxSupportedStaticAddressConfigurations: 1
              staticAddressConfigurations:
              - address: 192.168.0.90
                prefixLength: 24
                broadcast: 192.168.0.225
              defaultRouter: 192.168.0.1
              staticDefaultRouter: 192.168.0.1
              useDHCPStaticRoutes: true
            IPv6:
              enabled: true
              configurationMode: dhcp
              addresses:
              - address: fe80::249:8cff:fe1b:eef5
                prefixLength: 64
                origin: linkLocal
                scope: link
              - address: fd1c:360:4e4d:a5b2::e42
                prefixLength: 128
                origin: dhcp
                scope: site
              maxSupportedStaticAddressConfigurations: 1
              staticAddressConfigurations:
              - address: fe80::249:8cff:fe1b:eef5
                prefixLength: 64
              defaultRouter: ''
              staticDefaultRouter: ''
            wired:
              linkMode: auto
              supportedLinkModes:
              - auto
              - 10BaseT-HD
              - 10BaseT-FD
              - 100BaseTX-HD
              - 100BaseTX-FD
              - 1000BaseTX-HD
              - 1000BaseTX-FD
              isDownlink: false
              8021X:
                enabled: false
                status: Authorized
                mode: WPA-Enterprise-EAPTLS
                configurations:
                - mode: WPA-Enterprise-EAPTLS
                  params:
                    identity: Lobby
                    eapolVersion: EAPoLv2
                    certClient: Axis device ID RSA-2048 (802.1AR)
                    certsCA:
                    - Axis device ID Root CA ECC
                    - Axis device ID Intermediate CA RSA 2
                supportedModes:
                - WPA-Enterprise-EAPTLS
                MACsecSecured: false
          - name: eth1
            type: wlan
            macAddress: ac:cc:8e:68:8e:c4
            partOfBridge: ''
            link: false
            state: up
            staticState: up
            wlan:
              station:
                activeSsid: lobby
                8021X:
                  enabled: true
                  status: Stopped
                  mode: none
                  configurations:
