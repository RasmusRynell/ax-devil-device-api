                    properties:
                      activeSsid: {type: string, description: Contains the SSID of the currently configured WLAN
                          station.}
                      8021X:
                        type: object
                        x-name: GetNetworkInfoResultDevicesItemWlanStationT8021X
                        properties:
                          enabled:
                            type: boolean
                            description: Specifies if the WLAN station has been enabled on the device interface.
                          mode:
                            type: string
                            description: Specifies the WLAN station 802.1X authentication mode. See [WLAN station
                              802.1X authentication modes](#wlan-station-8021x-authentication-modes) for possible
                              values.
                          configurations:
                            type: array
                            items:
                              type: object
                              x-name: GetNetworkInfoResultDevicesItemWlanStationT8021XConfigurationsItem
                              properties:
                                mode:
                                  type: string
                                  description: Specifies the WLAN station 802.1X authentication mode for this particular
                                    configuration. See [WLAN station 802.1X authentication modes](#wlan-station-8021x-authentication-modes)
                                    for possible values.
                                params:
                                  type: object
                                  x-name: GetNetworkInfoResultDevicesItemWlanStationT8021XConfigurationsItemParams
                                  properties:
                                    is_psk_set: {type: boolean, description: Indicates if the pre-shared key has
