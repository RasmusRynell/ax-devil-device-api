  remove_vlan:
    summary: Removes an existing VLAN.
    description: This method removes the requested VLAN from the device.
    effect: write
    write: delete
    binding:
      method: removeVlan
    params:
      type: object
      required:
      - masterDeviceName
      - VlanName
      properties:
        masterDeviceName:
          type: string
          description: The network device the VLAN is attached to, for example eth0.
        VlanName:
          type: string
          description: The full name of the VLAN to remove, for example eth0.4.
    examples:
    - title: Remove a VLAN
      request:
        params:
          VlanName: eth0.4
          masterDeviceName: eth0
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#remove-a-vlan
    - title: Remove a VLAN (error response)
      request:
        params:
          VlanName: eth0.4
          masterDeviceName: eth0
      response:
        error:
          code: 1000
          message: Internal error
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#remove-a-vlan
    errors:
      4004/subCode 100:
        description: Parameter VlanName error.
        kind: invalid_argument
      4004/subCode 200:
        description: VLAN still present in manual active devices list.
        kind: invalid_argument
      4004/subCode 201:
        description: VLAN does not exist.
        kind: not_found
      4004/subCode 202:
        description: VLAN exists, but is not created by user.
        kind: invalid_argument
  scan_wlan_networks:
    summary: Scans for available WLAN networks.
    description: This method is used to scan for available WLAN networks for a specified WLAN network interface.
      Please note that this functionality is only available on interface devices of the WLAN type with indicated
      support for station in `getNetworkInfo`. See [Read network configuration](#read-network-configuration) for
      information on how to determine if your device has WLAN station support.
    effect: read
    binding:
      method: scanWLANNetworks
    params:
      type: object
      required:
      - deviceName
      properties:
        deviceName:
          type: string
          description: The name of the network interface device; see get_network_info.
        refresh:
          type: boolean
          description: Make a new scan (true) or fetch the previous scan. A new scan is made if none exists or if
            this is not set.
    result:
      $ref: '#/types/WlanScanResult'
    examples:
    - title: WLAN station configuration
      request:
        params:
          deviceName: wlan0
          refresh: true
      response:
        data:
          networks:
          - ssid: lobby
            band: 2.4GHz
            channel: 2
            signalStrengthDBm: -57
            security:
            - authentication: PSK
              version: WPA1
          - ssid: Conference
            band: 5GHz
            channel: 36
            signalStrengthDBm: -62
            security:
            - authentication: PSK
              version: WPA2
            - authentication: IEEE 802.1X
              version: WPA2
          - ssid: free
            band: 2.4GHz
            channel: 0
            signalStrengthDBm: -55
            security:
            - authentication: None
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#wlan-station-configuration
    - title: WLAN station configuration (error response)
      request:
        params:
          deviceName: wlan0
          refresh: true
      response:
        error:
          code: 4001
          message: The specified version is not supported
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#wlan-station-configuration
    - title: WLAN station configuration (error response)
      request:
        params:
          deviceName: wlan0
          refresh: true
      response:
        error:
          code: 4004
          message: Invalid parameter(s)
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#wlan-station-configuration
    since: '1.14'
    errors:
      5000:
        description: No device found for the given device name.
        kind: not_found
      4004/subCode 100:
        description: Parameter deviceName error.
        kind: invalid_argument
      4004/subCode 101:
        description: Parameter refresh error.
        kind: invalid_argument
  set_device_configuration:
    summary: Set the network interface device configuration.
    description: This method is used to configure network interface devices on an Axis device. It can, for example,
      be used to persistently disable network interface devices.
    effect: write
    write: patch
    binding:
      method: setDeviceConfiguration
    params:
      type: object
      required:
      - deviceName
      properties:
        deviceName:
          type: string
          description: The name of the network interface device; see get_network_info.
        staticState:
          $ref: '#/types/DeviceStaticState'
          description: Whether the interface should be up or down. When down, link is false and state is down, which
            persistently disables network traffic.
    examples:
    - title: Disable a network interface device
      request:
        params:
          deviceName: deviceName
          staticState: down
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#disable-a-network-interface-device
    - title: Disable a network interface device (error response)
      request:
        params:
          deviceName: deviceName
          staticState: down
      response:
        error:
          code: 4001
          message: The specified version is not supported
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#disable-a-network-interface-device
    - title: Disable a network interface device (error response)
      request:
        params:
          deviceName: deviceName
          staticState: down
      response:
        error:
          code: 4004
          message: Invalid parameter(s)
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#disable-a-network-interface-device
    since: '1.17'
    errors:
