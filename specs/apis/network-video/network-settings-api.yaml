              wlan:
                type: object
                x-name: GetNetworkInfoResultDevicesItemWlan
                description: Contains the parameters exclusive to wlan network interface devices.
                properties:
                  station:
                    type: object
                    x-name: GetNetworkInfoResultDevicesItemWlanStation
                    description: Contains the parameters for the WLAN station feature, with its presence indicating
