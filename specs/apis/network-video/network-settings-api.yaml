  scan_wlan_networks:
    summary: Scans for available WLAN networks.
    description: This method is used to scan for available WLAN networks for a specified WLAN network interface.
      Please note that this functionality is only available on interface devices of the WLAN type with indicated
      support for station in `getNetworkInfo`. See [Read network configuration](#read-network-configuration) for
      information on how to determine if your device has WLAN station support.
    effect: unknown
    binding: {method: scanWLANNetworks}
    params:
      type: object
      required: [deviceName]
      properties:
        deviceName:
          type: string
          description: The name of the network interface device that should be configured. See [getNetworkInfo](#get-network-info-api-specification)
            on how to retrieve a list of all available network interface devices.
        refresh:
          type: boolean
          description: Make a new scan or fetch data from the previous scan. In cases where no prior scan has been
            done or if this parameter is not set a new scan will be automatically performed.
    result:
      type: object
      properties:
        networks:
          type: array
          items:
            type: object
            x-name: ScanWlanNetworksResultNetworksItem
            properties:
              ssid: {type: string}
              band: {type: string}
              channel: {type: integer}
              signalStrengthDBm: {type: integer}
              security:
                type: array
                items:
                  type: object
                  x-name: ScanWlanNetworksResultNetworksItemSecurityItem
                  properties:
                    authentication: {type: string}
                    version: {type: string}
          description: Contains parameters related to the available WLAN networks.
    errors:
      5000: {description: No device found for the given device name.}
      100: {description: Parameter `deviceName` error., kind: invalid_argument}
      101: {description: Parameter refresh error., kind: invalid_argument}
    examples:
    - title: WLAN station configuration
      request:
        params: {deviceName: wlan0, refresh: true}
      response:
        data:
          networks:
          - ssid: lobby
            band: 2.4Ghz
            channel: 2
            signalStrengthDBm: -57
            security:
            - {authentication: PSK, version: WPA1}
          - ssid: Conference
            band: 5GHz
            channel: 36
            signalStrengthDBm: -62
            security:
            - {authentication: PSK, version: WPA2}
            - {authentication: IEEE 802.1X, version: WPA2}
          - ssid: free
            band: 2.4GHz
            channel: 0
            signalStrengthDBm: -55
            security:
            - {authentication: None}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#wlan-station-configuration
    - title: WLAN station configuration (error response)
      request:
        params: {deviceName: wlan0, refresh: true}
      response:
        error: {code: 4001, message: The specified version is not supported}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#wlan-station-configuration
    - title: WLAN station configuration (error response)
      request:
        params: {deviceName: wlan0, refresh: true}
      response:
        error: {code: 4004, message: Invalid parameter(s)}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#wlan-station-configuration
  set_device_configuration:
    summary: Set the network interface device configuration.
    description: This method is used to configure network interface devices on an Axis device. It can, for example,
      be used to persistently disable network interface devices.
    effect: write
    write: patch
    binding: {method: setDeviceConfiguration}
    params:
      type: object
      required: [deviceName]
      properties:
        deviceName:
          type: string
          description: The name of the network interface device that should be configured. See [getNetworkInfo](#get-network-info-api-specification)
            [doc syntax says <boolean>; string per description and other methods]
        staticState:
          type: string
          description: Specifies if the network interface device should be up or down. If `staticState` is down,
            `link` will be false and `state` will be down, which will result in persistent disabled network traffic.
    errors:
      5000: {description: No device found for the given device name.}
    examples:
    - title: Disable a network interface device
      request:
        params: {deviceName: deviceName, staticState: down}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#disable-a-network-interface-device
    - title: Disable a network interface device (error response)
      request:
        params: {deviceName: deviceName, staticState: down}
      response:
        error: {code: 4001, message: The specified version is not supported}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#disable-a-network-interface-device
    - title: Disable a network interface device (error response)
      request:
        params: {deviceName: deviceName, staticState: down}
      response:
        error: {code: 4004, message: Invalid parameter(s)}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#disable-a-network-interface-device
  set_hostname_configuration:
    summary: Configure how the device selects a hostname, with the possibility to set a static hostname and/or enable
      auto-configuration by DHCP.
    description: This method is used to configure a static hostname on the device or configure the device to automatically
      switch to a host name assigned to it by a DHCP server on the network. The latter only applies if a host name
      has been received.
    effect: write
    write: patch
    binding: {method: setHostnameConfiguration}
    params:
      type: object
      properties:
        useDhcpHostname:
          type: boolean
          description: Specifies whether to use the DHCP server provided hostname before the static hostname. If
            excluded, the current value remains unchanged.
        staticHostname:
          type: string
          description: A static hostname to use unless one is obtained from a DHCP server while the device is configured
            to prefer DHCP assigned hostnames. If excluded, the current value remains unchanged.
    examples:
    - title: Assign a static hostname
      request:
        params: {useDhcpHostname: false, staticHostname: mystatichostname}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#assign-a-static-hostname
    - title: Assign a static hostname (error response)
      request:
        params: {useDhcpHostname: false, staticHostname: mystatichostname}
      response:
        error: {code: 4001, message: The specified version is not supported}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#assign-a-static-hostname
    - title: Assign a static hostname (error response)
      request:
        params: {useDhcpHostname: false, staticHostname: mystatichostname}
      response:
        error: {code: 4004, message: Invalid parameter(s)}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#assign-a-static-hostname
  set_i_pv4_address_configuration:
    summary: Configure how the device selects an IPv4 address.
    description: This method is used to set up a static IPv4 address configuration on a network interface device,
      but also to configure the network interface device to automatically switch to an IPv4 address configuration
      assigned by a DHCP server on the network.
    effect: write
    write: patch
    binding: {method: setIPv4AddressConfiguration}
    params:
      type: object
      required: [deviceName]
      properties:
        deviceName:
          type: string
          description: The name of the network interface device to configure. See [getNetworkInfo](#get-network-info-api-specification)
            on how to retrieve a list of all network interface devices.
        enabled:
          type: boolean
          description: The enabled state of IPv4. If excluded, the current value will remain unchanged. IPv4 can
            not be deactivated while IPv6 is deactivated.
        configurationMode:
          type: string
          enum: [static, dhcp]
          description: The desired IPv4 address configuration mode.
        linkLocalMode: {type: string, enum: ['off', 'on', fallback], description: The desired link-local mode.}
        staticDefaultRouter:
          type: string
          description: The IPv4 address of the router on the network. This is used when the configuration mode is
            set to either static or DHCP, but no router is advertised. If excluded, the value remains unchanged.
        useStaticDHCPFallback:
          type: boolean
          description: Specifies if the configured static default route should be used as a fallback when a DHCP
            leased default router is unavailable.
        useDHCPStaticRoutes:
          type: boolean
          description: Specifies if the DHCP classless static routes should be used. If enabled, the DHCP leased
            default router will be ignored. Static routes provided by the DHCP server will be installed on the device.
        staticAddressConfigurations:
          type: array
          items:
            type: object
            x-name: SetIPv4AddressConfigurationRequestStaticAddressConfigurationsItem
            properties:
              address: {type: string, description: A static IPv4 address.}
              prefixLength: {type: string, description: The subnet prefix length associated with the address.}
              broadcast:
                type: string
                description: The broadcast address of the subnet. If excluded, it will be automatically calculated
                  using the address and prefix length.
          description: A list of objects each representing a static IPv4 address.
    errors:
      5000: {description: No device found for the given device name}
    examples:
    - title: Assign a static IPv4 address
      request:
        params:
          deviceName: eth0
          configurationMode: static
          staticDefaultRouter: 192.168.0.1
          staticAddressConfigurations:
          - {address: 192.168.0.90, prefixLength: 16, broadcast: 192.168.255.255}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#assign-a-static-ipv4-address
    - title: Assign a static IPv4 address (error response)
      request:
        params:
          deviceName: eth0
          configurationMode: static
          staticDefaultRouter: 192.168.0.1
          staticAddressConfigurations:
          - {address: 192.168.0.90, prefixLength: 16, broadcast: 192.168.255.255}
      response:
        error: {code: 4004, message: Invalid parameter(s)}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#assign-a-static-ipv4-address
    - title: Enable classless static routes via DHCP
      request:
        params: {deviceName: eth0, useDHCPStaticRoutes: true}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#enable-classless-static-routes-via-dhcp
    - title: Enable classless static routes via DHCP (error response)
      request:
        params: {deviceName: eth0, useDHCPStaticRoutes: true}
      response:
        error: {code: 4004, message: Invalid parameter(s)}
      source: https://developer.axis.com/vapix/network-video/network-settings-api/#enable-classless-static-routes-via-dhcp
