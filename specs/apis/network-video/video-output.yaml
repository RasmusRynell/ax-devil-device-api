- url: https://developer.axis.com/vapix/network-video/video-output-api/
  sha256_md: 33e5061c7144c771f386256272e6afabacc1ea62cc9d66bd2a2a1cda40328640
  retrieved_at: '2026-10-11'

provenance:
  completeness: complete
  open_questions:
  - The docs give no reply examples; all examples here are constructed from the documented body syntax with sample values.
  - Requiredness of id (set_video_source), mirroringenabled, rotation, mode, the quad view id and the source settings id/enabled is not stated; they are required because the calls are meaningless without them.
  - Video source Ids are documented as integer in some tables, string in others and [int] in the reply syntax; all are modelled as strings.
  - The getsequence syntax lacks the closing GetSequenceSuccess tag, and its note says sources appear as VideoSource tags while the syntax uses VideoSequenceElement (used here). Mirror is [int] in the reply and boolean in the request; it is modelled as a boolean (0/1 are accepted).
  - get_pip returns BorderWidth and SubView* elements while set_pip takes borderweight and pip* arguments; the reply values are strings (the border color and weights are comma-separated lists).
  - get_active_mode lists the modes none/source/quad/sequence while set_active_mode also accepts PiP.
  - The PiP rotation arguments are documented as strings with the valid values 0/180; they are modelled as integer enums. Border color and weight are modelled as comma-joined number arrays; the docs example puts spaces after the commas in the border weight.
  - The error code to CGI mapping column is mostly empty and several lists end with etc.
  - The documented discovery property Properties.VideoOutputControl.OutputType=[Output type] has no concrete value and is omitted from discovery.
  - The videooutput1 XML schema is not mirrored.
  migrated_from: v1
  curated: true
