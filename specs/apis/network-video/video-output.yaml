provenance:
  completeness: complete
  open_questions:
  - Requiredness of id (setvideosource), mirroringenabled, rotation, mode, setquadview id and setsourcesettingsenabled
    id/enabled is not stated; marked required (inferred).
  - 'getvideosources: <Id> shown as [int] in syntax but described as string in the table.'
  - getsequence response syntax is missing the closing </GetSequenceSuccess>; the note says sources show up as <VideoSource>
    tags while the syntax uses <VideoSequenceElement>; <Mirror> is [int] while mirror request param is boolean.
  - getpip lists BorderWidth while setpip uses borderweight; getpip uses SubView* while setpip uses pip* parameter
    names.
  - setpip description says 'configure the parameters and search for the PiP' (unclear).
  - getactivemode description lists modes none/source/quad/sequence while setactivemode accepts source/sequence/quad/PiP.
