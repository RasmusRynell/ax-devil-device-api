format: 2
id: dynamic-text
name: Dynamic text
summary: 'GET /axis-cgi/dynamicoverlay.cgi?action=settext|gettext sets/gets dynamic text slots mapped to overlay
  modifiers #D1..#D16.'
section: network-video
family: cgi
status: released
python:
  module: dynamic_text
  class: DynamicText
docs:
- https://developer.axis.com/vapix/network-video/overlay-api/
access: operator

binding: {path: /axis-cgi/dynamicoverlay.cgi}

operations:
  set_text:
    summary: Set the dynamic text.
    effect: write
    write: patch
    binding:
      method: GET
      query: {action: settext}
      reply: text
    params:
      type: object
      properties:
        text: {type: string, description: 'The overlay text to apply, only applicable with action=settext.'}
        text_index:
          type: integer
          minimum: 1
          maximum: 16
          description: Select a dynamic text slot. A text index for a slot maps text to the modifiers `#D1...#D16`.
            For example, `text_index=3&text=Hello` means that `Hello` will be mapped to `#D3`.
        camera:
          type: array
          items: {type: string}
          default: ['1']
          description: Selects the video channel.
  get_text:
    summary: Get the dynamic text.
    effect: read
    binding:
      method: GET
      query: {action: gettext}
      reply: text
    params:
      type: object
      properties:
        text_index:
          type: integer
          minimum: 1
          maximum: 16
          description: Select a dynamic text slot. A text index for a slot maps text to the modifiers `#D1...#D16`.
            For example, `text_index=3&text=Hello` means that `Hello` will be mapped to `#D3`.
        camera:
          type: array
          items: {type: string}
          default: ['1']
          description: Selects the video channel.
    result: {type: string}

