# Migrated from the v1 corpus by codegen/migrate_v1.py; not yet curated.
format: 2
id: light-control
name: Light control API
summary: 'JSON API (/axis-cgi/lightcontrol.cgi) to query and control IR/white light LED groups: activate, enable,
  intensity, angle of illumination, day/night sync, IR...'
section: network-video
family: jsonrpc
status: released
python:
  module: light_control
  class: LightControl
docs:
- https://developer.axis.com/vapix/network-video/light-control/
access: admin
discovery:
- {api_discovery: light-control}
- param: {name: Properties.API.HTTP.Version, value: '3'}
- param: {name: Properties.LightControl.LightControl2, value: 'yes'}
requires:
  firmware: '7.40'

binding:
  path: /axis-cgi/lightcontrol.cgi
  major: 1
  versions: ['1.0']
  negotiation:
    get_supported_versions: {key: apiVersions}
  params_placement: params

errors:
  1000: {description: PARAM_INVALID_VALUE_ERROR. Invalid parameter value., kind: invalid_argument}
  2000: {description: RESOURCE_MEM_ERROR. Failed to allocate memory.}
  2001: {description: ACCESS_FORBIDDEN. Access forbidden, kind: access_denied}
  2002:
    description: HTTP_METHOD_NOT_SUPPORTED. HTTP request type not supported. Only POST supported.
    kind: unsupported
  2003:
    description: API_VERSION_NOT_SUPPORTED. The requested API version is not supported.
    kind: unsupported
  2004: {description: METHOD_NOT_SUPPORTED. Method not supported., kind: unsupported}
  3000:
    description: UNSUPPORTED_API_VERSION. The requested API version is not supported.
    kind: unsupported
  4000:
    description: JSON_INVALID_ERROR. The provided JSON input was invalid.
    kind: invalid_argument
  4001:
    description: JSON_KEY_NOT_FOUND_ERROR. A mandatory input parameter was not found in the input.
    kind: not_found
  4002:
    description: JSON_INVALID_TYPE. The provided JSON parameter type was incorrect.
    kind: invalid_argument
  7000:
    description: UNSUPPORTED_API_VERSION. The requested API version is not supported by this implementation.
    kind: unsupported
  8000: {description: INTERNAL_ERROR. Internal error., kind: internal}
  8001: {description: UNEXPECTED_ERROR. Unexpected error., kind: internal}
  8002: {description: GENERIC_ERROR. Generic error.}

operations:
  get_service_capabilities:
    summary: Lists the capabilities of the light control.
    description: A CGI method that lists the light service capabilities.
    access: operator
    effect: read
    binding: {method: getServiceCapabilities}
    result:
      type: object
      properties:
        automaticIntensitySupport: {type: boolean, description: Indicates that `setAutomaticIntensityMode` is supported.}
        manualIntensitySupport:
          type: boolean
          description: Indicates that `getManualIntensity` and `setManualIntensity` are supported.
        individualIntensitySupport:
          type: boolean
          description: Indicates that `getIndividualIntensity` and `setIndividualIntensity` are supported.
        getCurrentIntensitySupport: {type: boolean, description: Indicates that `getCurrentIntensity` is supported.}
        manualAngleOfIlluminationSupport: {type: boolean, description: Indicates that `setManualAngleOfIllumination`
            is supported.}
        automaticAngleOfIlluminationSupport:
          type: boolean
          description: Indicates that `setAutomaticAngleOfIlluminationMode` is supported.
        dayNightSynchronizeSupport: {type: boolean, description: Indicates that `setLightSynchronizeDayNightMode`
            is supported.}
        multiIRWaveLengthSupport:
          type: boolean
          description: Indicates that `getValidIRWavelengths`, `setIRWavelength` and `getIRWavelength` are supported.
        capabilities:
          type: array
          items:
            type: object
            x-name: GetServiceCapabilitiesResultCapabilitiesItem
            properties:
              lightID: {type: string, description: The ID of the LEDgroup.}
              automaticIntensitySupport: {type: boolean, description: Indicates that `setAutomaticIntensityMode`
                  is supported.}
              manualIntensitySupport:
                type: boolean
                description: Indicates that `getManualIntensity` and `setManualIntensity` are supported.
              individualIntensitySupport:
                type: boolean
                description: Indicates that `getIndividualIntensity` and `setIndividualIntensity` are supported.
              getCurrentIntensitySupport: {type: boolean, description: Indicates that `getCurrentIntensity` is supported.}
              manualAngleOfIlluminationSupport: {type: boolean, description: Indicates that `setManualAngleOfIllumination`
                  is supported.}
              automaticAngleOfIlluminationSupport:
                type: boolean
                description: Indicates that `setAutomaticAngleOfIlluminationMode` is supported.
              dayNightSynchronizeSupport: {type: boolean, description: Indicates that `setLightSynchronizeDayNightMode`
                  is supported.}
              multiIRWaveLengthSupport:
                type: boolean
                description: Indicates that `getValidIRWavelengths`, `setIRWavelength` and `getIRWavelength` are
                  supported.
          description: Container for supported capabilities for each LEDgroup.
    examples:
    - title: Get service capabilities
      request:
        params: {}
      response:
        error: {code: 7000, message: The requested API version is not supported by this implementation.}
      source: https://developer.axis.com/vapix/network-video/light-control/#get-service-capabilities
  get_light_information:
    summary: Lists the light control information.
    description: A CGI method that lists the light control information.
    access: operator
    effect: read
    binding: {method: getLightInformation}
    result:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            x-name: GetLightInformationResultItemsItem
            properties:
              lightID: {type: string, description: Unique ID of the light.}
              lightType: {type: string, description: Type identifier of the light.}
              enabled: {type: boolean, description: Indicates if the light is enabled.}
              synchronizeDayNightMode: {type: boolean, description: Indicates if the light is synchronized with
                  day/night.}
              lightState: {type: boolean, description: Indicates if the light is ON or OFF.}
              automaticIntensityMode: {type: boolean, description: Indicates if the mode for automatic intensity
                  is active.}
              automaticAngleOfIlluminationMode:
                type: boolean
                description: Indicates if the mode for automatic angle of illumination is active.
              nrOfLEDs:
                type: string
                description: Number of configurable LEDs in a light group. The light groups are identified by their
                  Light ID.
              error: {type: boolean}
              errorInfo: {type: string, description: Error description.}
    errors:
      1005:
        description: CARD_MALFUNCTIONING_FAULT. Could not find light hardware, could not complete request.
      1006: {description: 'WRONG_POE_CLASS_FAULT. Wrong POE class, could not complete request.'}
    examples:
    - title: Get light information
      request:
        params: {}
      response:
        data:
          items:
          - lightID: led0
            lightType: IR
            enabled: true
            synchronizeDayNightMode: true
            lightState: false
            automaticIntensityMode: false
            automaticAngleOfIlluminationMode: false
            nrOfLEDs: 1
            error: false
            errorInfo: ''
          - lightID: led1
            lightType: IR
            enabled: true
            synchronizeDayNightMode: false
            lightState: false
            automaticIntensityMode: false
            automaticAngleOfIlluminationMode: false
            nrOfLEDs: 2
            error: false
            errorInfo: ''
      source: https://developer.axis.com/vapix/network-video/light-control/#get-light-information
    - title: Get light information (error response)
      request:
        params: {}
      response:
        error: {code: 2000, message: Failed to allocate memory for request.}
      source: https://developer.axis.com/vapix/network-video/light-control/#get-light-information
