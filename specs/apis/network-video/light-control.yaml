format: 2
id: light-control
name: Light control API
summary: 'Query and control the IR and white light LED groups: activate, enable, intensity, angle of illumination,
  day/night synchronization, IR wavelength and beam shape.'
section: network-video
family: jsonrpc
status: released
python:
  module: light_control
  class: LightControl
docs:
- https://developer.axis.com/vapix/network-video/light-control/
access: admin
discovery:
- api_discovery: light-control
- param:
    name: Properties.LightControl.LightControl2
    value: 'yes'
requires:
  firmware: '7.40'
binding:
  path: /axis-cgi/lightcontrol.cgi
  major: 1
  versions:
  - '1.0'
  - '1.2'
  - '1.7'
  negotiation:
    get_supported_versions:
      key: apiVersions
  params_placement: params
errors:
  1000:
    description: PARAM_INVALID_VALUE_ERROR. Invalid parameter value.
    kind: invalid_argument
  2000:
    description: RESOURCE_MEM_ERROR. Failed to allocate memory.
    kind: internal
  2001:
    description: ACCESS_FORBIDDEN. Access forbidden
    kind: access_denied
  2002:
    description: HTTP_METHOD_NOT_SUPPORTED. HTTP request type not supported. Only POST supported.
    kind: unsupported
  2003:
    description: API_VERSION_NOT_SUPPORTED. The requested API version is not supported.
    kind: unsupported
  2004:
    description: METHOD_NOT_SUPPORTED. Method not supported.
    kind: unsupported
  3000:
    description: UNSUPPORTED_API_VERSION. The requested API version is not supported.
    kind: unsupported
  4000:
    description: JSON_INVALID_ERROR. The provided JSON input was invalid.
    kind: invalid_argument
  4001:
    description: JSON_KEY_NOT_FOUND_ERROR. A mandatory input parameter was not found in the input.
    kind: invalid_argument
  4002:
    description: JSON_INVALID_TYPE. The provided JSON parameter type was incorrect.
    kind: invalid_argument
  7000:
    description: UNSUPPORTED_API_VERSION. The requested API version is not supported by this implementation.
    kind: unsupported
  8000:
    description: INTERNAL_ERROR. Internal error.
    kind: internal
  8001:
    description: UNEXPECTED_ERROR. Unexpected error.
    kind: internal
  8002:
    description: GENERIC_ERROR. Generic error.
    kind: internal
types:
  LedCapabilities:
    type: object
    description: Which methods a light supports.
    properties:
      automaticIntensitySupport:
        type: boolean
        description: Indicates that `setAutomaticIntensityMode` is supported.
      manualIntensitySupport:
        type: boolean
        description: Indicates that `getManualIntensity` and `setManualIntensity` are supported.
      individualIntensitySupport:
        type: boolean
        description: Indicates that `getIndividualIntensity` and `setIndividualIntensity` are supported.
      getCurrentIntensitySupport:
        type: boolean
        description: Indicates that `getCurrentIntensity` is supported.
      manualAngleOfIlluminationSupport:
        type: boolean
        description: Indicates that `setManualAngleOfIllumination` is supported.
      automaticAngleOfIlluminationSupport:
        type: boolean
        description: Indicates that `setAutomaticAngleOfIlluminationMode` is supported.
      dayNightSynchronizeSupport:
        type: boolean
        description: Indicates that `setLightSynchronizeDayNightMode` is supported.
      multiIRWaveLengthSupport:
        type: boolean
        description: Indicates that `getValidIRWavelengths`, `setIRWavelength` and `getIRWavelength` are supported.
  LightCapabilities:
    type: object
    description: Capabilities of one LED group.
    required:
    - lightID
    properties:
      lightID:
        type: string
        description: The ID of the LED group.
      automaticIntensitySupport:
        type: boolean
        description: Indicates that `setAutomaticIntensityMode` is supported.
      manualIntensitySupport:
        type: boolean
        description: Indicates that `getManualIntensity` and `setManualIntensity` are supported.
      individualIntensitySupport:
        type: boolean
        description: Indicates that `getIndividualIntensity` and `setIndividualIntensity` are supported.
      getCurrentIntensitySupport:
        type: boolean
        description: Indicates that `getCurrentIntensity` is supported.
      manualAngleOfIlluminationSupport:
        type: boolean
        description: Indicates that `setManualAngleOfIllumination` is supported.
      automaticAngleOfIlluminationSupport:
        type: boolean
        description: Indicates that `setAutomaticAngleOfIlluminationMode` is supported.
      dayNightSynchronizeSupport:
        type: boolean
        description: Indicates that `setLightSynchronizeDayNightMode` is supported.
      multiIRWaveLengthSupport:
        type: boolean
        description: Indicates that `getValidIRWavelengths`, `setIRWavelength` and `getIRWavelength` are supported.
  ServiceCapabilities:
    type: object
    description: Capabilities of the light service as a whole, and per LED group.
    properties:
      automaticIntensitySupport:
        type: boolean
        description: Indicates that `setAutomaticIntensityMode` is supported.
      manualIntensitySupport:
        type: boolean
        description: Indicates that `getManualIntensity` and `setManualIntensity` are supported.
      individualIntensitySupport:
        type: boolean
        description: Indicates that `getIndividualIntensity` and `setIndividualIntensity` are supported.
      getCurrentIntensitySupport:
        type: boolean
        description: Indicates that `getCurrentIntensity` is supported.
      manualAngleOfIlluminationSupport:
        type: boolean
        description: Indicates that `setManualAngleOfIllumination` is supported.
      automaticAngleOfIlluminationSupport:
        type: boolean
        description: Indicates that `setAutomaticAngleOfIlluminationMode` is supported.
      dayNightSynchronizeSupport:
        type: boolean
        description: Indicates that `setLightSynchronizeDayNightMode` is supported.
      multiIRWaveLengthSupport:
        type: boolean
        description: Indicates that `getValidIRWavelengths`, `setIRWavelength` and `getIRWavelength` are supported.
      capabilities:
        type: array
        items:
          $ref: '#/types/LightCapabilities'
        description: Supported capabilities for each LED group.
  LightInformation:
    type: object
    description: State of one light.
    required:
    - lightID
    properties:
      lightID:
        type: string
        description: Unique ID of the light.
      lightType:
        type: string
        description: Type identifier of the light.
      enabled:
        type: boolean
        description: Indicates if the light is enabled.
      synchronizeDayNightMode:
        type: boolean
        description: Indicates if the light is synchronized with day/night.
      lightState:
        type: boolean
        description: Indicates if the light is ON or OFF.
      automaticIntensityMode:
        type: boolean
        description: Indicates if the mode for automatic intensity is active.
      automaticAngleOfIlluminationMode:
        type: boolean
        description: Indicates if the mode for automatic angle of illumination is active.
      nrOfLEDs:
        type: integer
        description: Number of configurable LEDs in a light group. The light groups are identified by their Light
          ID.
      error:
        type: boolean
        description: An error has occurred.
      errorInfo:
        type: string
        description: Error description.
  LightInformationList:
    type: object
    properties:
      items:
        type: array
        items:
          $ref: '#/types/LightInformation'
  LightStatus:
    type: object
    required:
    - status
    properties:
      status:
        type: boolean
        description: Indicates if the light is ON or OFF.
  ValueRange:
    type: object
    required:
    - low
    - high
    properties:
      low:
        type: integer
        description: The lower limit of the range.
      high:
        type: integer
        description: The upper limit of the range.
  ValidRanges:
    type: object
    required:
    - ranges
    properties:
      ranges:
        type: array
        items:
          $ref: '#/types/ValueRange'
        description: The valid ranges.
  Intensity:
    type: object
    required:
    - intensity
    properties:
      intensity:
        type: integer
        description: The intensity of the light.
  AngleOfIllumination:
    type: object
    required:
    - angleOfIllumination
    properties:
      angleOfIllumination:
        type: integer
        description: The angle of illumination.
  DayNightSynchronization:
    type: object
    required:
    - enabled
    properties:
      enabled:
        type: boolean
        description: If the day/night cut filter synchronization of the light is active.
  ValidIrWavelengths:
    type: object
    properties:
      wavelengths:
        type: array
        items:
          type: string
        description: The valid wavelength settings, for example 850nm.
  IrWavelength:
    type: object
    required:
    - IRWavelength
    properties:
      IRWavelength:
        type: string
        description: The currently set infrared wavelength.
  BeamShape:
    type: object
    required:
    - beamShape
    properties:
      beamShape:
        type: string
        description: The beam shape.
  ValidBeamShapes:
    type: object
    properties:
      items:
        type: array
        items:
          $ref: '#/types/BeamShape'
        description: The valid beam shapes.
operations:
  get_service_capabilities:
    summary: Lists the capabilities of the light control.
    description: A CGI method that lists the light service capabilities.
    access: operator
    effect: read
    binding:
      method: getServiceCapabilities
    result:
      $ref: '#/types/ServiceCapabilities'
    examples:
    - title: Get service capabilities
      request:
        params: {}
      response:
        data:
          automaticIntensitySupport: true
          manualIntensitySupport: true
          individualIntensitySupport: false
          getCurrentIntensitySupport: true
          manualAngleOfIlluminationSupport: false
          automaticAngleOfIlluminationSupport: false
          dayNightSynchronizeSupport: true
          multiIRWaveLengthSupport: true
          capabilities:
          - lightID: led0
            automaticIntensitySupport: true
            manualIntensitySupport: true
            individualIntensitySupport: false
            getCurrentIntensitySupport: true
            manualAngleOfIlluminationSupport: false
            automaticAngleOfIlluminationSupport: false
            dayNightSynchronizeSupport: true
            multiIRWaveLengthSupport: true
          - lightID: led1
            automaticIntensitySupport: true
            manualIntensitySupport: true
            individualIntensitySupport: false
            getCurrentIntensitySupport: true
            manualAngleOfIlluminationSupport: false
            automaticAngleOfIlluminationSupport: false
            dayNightSynchronizeSupport: true
            multiIRWaveLengthSupport: true
      source: https://developer.axis.com/vapix/network-video/light-control/#get-service-capabilities
    - title: Get service capabilities (error response)
      request:
        params: {}
      response:
        error:
          code: 7000
          message: The requested API version is not supported by this implementation.
      source: https://developer.axis.com/vapix/network-video/light-control/#get-service-capabilities
  get_light_information:
    summary: Lists the light control information.
    description: A CGI method that lists the light control information.
    access: operator
    effect: read
    binding:
      method: getLightInformation
    result:
      $ref: '#/types/LightInformationList'
    errors:
      1005:
        description: CARD_MALFUNCTIONING_FAULT. Could not find light hardware, could not complete request.
        kind: unavailable
      1006:
        description: WRONG_POE_CLASS_FAULT. Wrong POE class, could not complete request.
        kind: unavailable
    examples:
    - title: Get light information
      request:
        params: {}
      response:
        data:
          items:
          - lightID: led0
            lightType: IR
            enabled: true
            synchronizeDayNightMode: true
            lightState: false
            automaticIntensityMode: false
            automaticAngleOfIlluminationMode: false
            nrOfLEDs: 1
            error: false
            errorInfo: ''
          - lightID: led1
            lightType: IR
            enabled: true
            synchronizeDayNightMode: false
            lightState: false
            automaticIntensityMode: false
            automaticAngleOfIlluminationMode: false
            nrOfLEDs: 2
            error: false
            errorInfo: ''
      source: https://developer.axis.com/vapix/network-video/light-control/#get-light-information
    - title: Get light information (error response)
      request:
        params: {}
      response:
        error:
          code: 2000
          message: Failed to allocate memory for request.
      source: https://developer.axis.com/vapix/network-video/light-control/#get-light-information
  activate_light:
    summary: Activates the light.
    description: A CGI method that activates the light.
    access: operator
    effect: action
    binding:
      method: activateLight
    params:
      type: object
      required:
      - lightID
      properties:
        lightID:
          type: string
          description: The light ID.
      x-name: LightIdRequest
    errors:
      1002:
        description: INVALID_LIGHT_ID_FAULT. Provided lightID parameter is not valid for the device.
        kind: invalid_argument
      1005:
        description: CARD_MALFUNCTIONING_FAULT. Could not find light hardware, could not complete request.
        kind: unavailable
      1006:
        description: WRONG_POE_CLASS_FAULT. Wrong POE class, could not complete request.
        kind: unavailable
      1008:
        description: UPDATE_IRCUTFILTER_FAULT. Could not update IR cut filter.
        kind: internal
      1009:
        description: LIGHT_DISABLED_FAULT. The light group is turned off and can’t be activated.
        kind: unavailable
    examples:
    - title: Activate light
      request:
        params:
          lightID: led0
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/light-control/#activate-light
    - title: Activate light (error response)
      request:
        params:
          lightID: led0
      response:
        error:
          code: 1002
          message: Provided lightID parameter is not valid for the device.
      source: https://developer.axis.com/vapix/network-video/light-control/#activate-light
  deactivate_light:
    summary: Deactivates the light.
    description: A CGI method that deactivates the light.
    access: operator
    effect: action
    binding:
      method: deactivateLight
    params:
      type: object
      required:
      - lightID
      properties:
        lightID:
          type: string
          description: The light ID.
      x-name: LightIdRequest
    errors:
      1002:
        description: INVALID_LIGHT_ID_FAULT. Provided lightID parameter is not valid for the device.
        kind: invalid_argument
      1005:
        description: CARD_MALFUNCTIONING_FAULT. Could not find light hardware, could not complete request.
        kind: unavailable
      1006:
        description: WRONG_POE_CLASS_FAULT. Wrong POE class, could not complete request.
        kind: unavailable
    examples:
    - title: Deactivate light
      request:
        params:
          lightID: led0
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/light-control/#deactivate-light
    - title: Deactivate light (error response)
      request:
        params:
          lightID: led0
      response:
        error:
          code: 1002
          message: Provided lightID parameter is not valid for the device.
      source: https://developer.axis.com/vapix/network-video/light-control/#deactivate-light
  enable_light:
    summary: Enables the light functionality on the device.
    description: A CGI method that enables the light functionality.
    access: operator
    effect: write
    binding:
      method: enableLight
    params:
      type: object
      required:
      - lightID
      properties:
        lightID:
          type: string
          description: The light ID.
      x-name: LightIdRequest
    errors:
      1002:
        description: INVALID_LIGHT_ID_FAULT. Provided lightID parameter is not valid for the device.
        kind: invalid_argument
      1005:
        description: CARD_MALFUNCTIONING_FAULT. Could not find light hardware, could not complete request.
        kind: unavailable
      1006:
        description: WRONG_POE_CLASS_FAULT. Wrong POE class, could not complete request.
        kind: unavailable
    examples:
    - title: Enable light
      request:
        params:
          lightID: led0
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/light-control/#enable-light
    - title: Enable light (error response)
      request:
        params:
          lightID: led0
      response:
        error:
          code: 1005
          message: Hardware failure, could not complete request.
      source: https://developer.axis.com/vapix/network-video/light-control/#enable-light
    write: patch
  disable_light:
    summary: Disables the light functionality on the device.
    description: A CGI method that disables the light functionality.
    access: operator
    effect: write
    binding:
      method: disableLight
    params:
      type: object
      required:
      - lightID
      properties:
        lightID:
          type: string
          description: The light ID.
      x-name: LightIdRequest
    errors:
      1002:
        description: INVALID_LIGHT_ID_FAULT. Provided lightID parameter is not valid for the device.
        kind: invalid_argument
      1005:
        description: CARD_MALFUNCTIONING_FAULT. Could not find light hardware, could not complete request.
        kind: unavailable
      1006:
        description: WRONG_POE_CLASS_FAULT. Wrong POE class, could not complete request.
        kind: unavailable
    examples:
    - title: Disable light
      request:
        params:
          lightID: led0
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/light-control/#disable-light
    - title: Disable light (error response)
      request:
        params:
          lightID: led0
      response:
        error:
          code: 1005
          message: Hardware failure, could not complete request.
      source: https://developer.axis.com/vapix/network-video/light-control/#disable-light
    write: patch
  get_light_status:
    summary: Retrieves the light status from a given Light ID.
    description: A CGI method that showcases the light status of a given Light ID.
    access: operator
    effect: read
    binding:
      method: getLightStatus
    params:
      type: object
      required:
      - lightID
      properties:
        lightID:
          type: string
          description: The light ID.
      x-name: LightIdRequest
    result:
      $ref: '#/types/LightStatus'
    errors:
      1002:
        description: INVALID_LIGHT_ID_FAULT. Provided lightID parameter is not valid for the device.
        kind: invalid_argument
      1005:
        description: CARD_MALFUNCTIONING_FAULT. Could not find light hardware, could not complete request.
        kind: unavailable
      1006:
        description: WRONG_POE_CLASS_FAULT. Wrong POE class, could not complete request.
        kind: unavailable
    examples:
    - title: Get light status
      request:
        params:
          lightID: led0
      response:
        data:
          status: true
      source: https://developer.axis.com/vapix/network-video/light-control/#get-light-status
    - title: Get light status (error response)
      request:
        params:
          lightID: led0
      response:
        error:
          code: 1002
          message: Provided lightID parameter is not valid for the device.
      source: https://developer.axis.com/vapix/network-video/light-control/#get-light-status
  set_automatic_intensity_mode:
    summary: Enables the automatic light intensity control.
    description: A CGI method that enables the automatic light intensity control.
    access: operator
    effect: write
    write: patch
    binding:
      method: setAutomaticIntensityMode
    params:
      type: object
      required:
      - lightID
      - enabled
      properties:
        lightID:
          type: string
          description: The light ID.
        enabled:
          type: boolean
          description: Enables automatic light intensity control.
    errors:
      1001:
        description: NOT_SUPPORTED_FAULT. Method call not supported by the device.
        kind: unsupported
      1002:
        description: INVALID_LIGHT_ID_FAULT. Provided lightID parameter is not valid for the device.
        kind: invalid_argument
      1005:
        description: CARD_MALFUNCTIONING_FAULT. Could not find light hardware, could not complete request.
        kind: unavailable
      1006:
        description: WRONG_POE_CLASS_FAULT. Wrong POE class, could not complete request.
        kind: unavailable
    examples:
    - title: Set automatic intensity mode
      request:
        params:
          lightID: led0
          enabled: true
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/light-control/#set-automatic-intensity-mode
    - title: Set automatic intensity mode (error response)
      request:
        params:
          lightID: led0
          enabled: true
      response:
        error:
          code: 1005
          message: Hardware failure, could not complete request.
      source: https://developer.axis.com/vapix/network-video/light-control/#set-automatic-intensity-mode
  get_valid_intensity:
    summary: Lists the valid light intensity values.
    description: A CGI method that lists the valid light intensity values.
    access: operator
    effect: read
    binding:
      method: getValidIntensity
    params:
      type: object
      required:
      - lightID
      properties:
        lightID:
          type: string
          description: The light ID.
      x-name: LightIdRequest
    result:
      $ref: '#/types/ValidRanges'
    errors:
      1001:
        description: NOT_SUPPORTED_FAULT. Method call not supported by the device.
        kind: unsupported
      1002:
        description: INVALID_LIGHT_ID_FAULT. Provided lightID parameter is not valid for the device.
        kind: invalid_argument
      1005:
        description: CARD_MALFUNCTIONING_FAULT. Could not find light hardware, could not complete request.
        kind: unavailable
      1006:
        description: WRONG_POE_CLASS_FAULT. Wrong POE class, could not complete request.
        kind: unavailable
    examples:
    - title: Get valid intensity
      request:
        params:
          lightID: led0
      response:
        data:
          ranges:
          - low: 0
            high: 50
      source: https://developer.axis.com/vapix/network-video/light-control/#get-valid-intensity
    - title: Get valid intensity (error response)
      request:
        params:
          lightID: led0
      response:
        error:
          code: 1002
          message: Provided lightID parameter is not valid for the device.
      source: https://developer.axis.com/vapix/network-video/light-control/#get-valid-intensity
  set_manual_intensity:
    summary: Manually sets the intensity.
    description: A CGI method that sets the intensity manually.
    access: operator
    effect: write
    write: patch
    binding:
      method: setManualIntensity
    params:
      type: object
      required:
      - lightID
      - intensity
      properties:
        lightID:
          type: string
          description: The light ID.
        intensity:
          type: integer
          description: The intensity level of the light; see get_valid_intensity for the valid ranges.
    errors:
      1001:
        description: NOT_SUPPORTED_FAULT. Method call not supported by the device.
        kind: unsupported
      1002:
        description: INVALID_LIGHT_ID_FAULT. Provided lightID parameter is not valid for the device.
        kind: invalid_argument
      1003:
        description: INVALID_INTENSITY_FAULT. Provided intensity level is out of the supported range.
        kind: invalid_argument
      1005:
        description: CARD_MALFUNCTIONING_FAULT. Could not find light hardware, could not complete request.
        kind: unavailable
      1006:
        description: WRONG_POE_CLASS_FAULT. Wrong POE class, could not complete request.
        kind: unavailable
    examples:
    - title: Set manual intensity
      request:
        params:
          lightID: led0
          intensity: 50
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/light-control/#set-manual-intensity
    - title: Set manual intensity (error response)
      request:
        params:
          lightID: led0
          intensity: 50
      response:
        error:
          code: 1002
          message: Provided lightID parameter is not valid for the device.
      source: https://developer.axis.com/vapix/network-video/light-control/#set-manual-intensity
  get_manual_intensity:
    summary: Retrieves the intensity from the `setManualIntensity` request.
    description: A CGI method that gets the intensity that was sent in the `setManualIntensity` request.
    access: operator
    effect: read
    binding:
      method: getManualIntensity
    params:
      type: object
      required:
      - lightID
      properties:
        lightID:
          type: string
          description: The light ID.
      x-name: LightIdRequest
    result:
      $ref: '#/types/Intensity'
    errors:
      1001:
        description: NOT_SUPPORTED_FAULT. Method call not supported by the device.
        kind: unsupported
      1002:
        description: INVALID_LIGHT_ID_FAULT. Provided lightID parameter is not valid for the device.
        kind: invalid_argument
      1005:
        description: CARD_MALFUNCTIONING_FAULT. Could not find light hardware, could not complete request.
        kind: unavailable
      1006:
        description: WRONG_POE_CLASS_FAULT. Wrong POE class, could not complete request.
        kind: unavailable
    examples:
    - title: Get manual intensity
      request:
        params:
          lightID: led0
      response:
        data:
          intensity: 50
      source: https://developer.axis.com/vapix/network-video/light-control/#get-manual-intensity
    - title: Get manual intensity (error response)
      request:
        params:
          lightID: led0
      response:
        error:
          code: 1002
          message: Provided lightID parameter is not valid for the device.
      source: https://developer.axis.com/vapix/network-video/light-control/#get-manual-intensity
  set_individual_intensity:
    summary: Manually sets the intensity for an individual LED.
    description: A CGI method that manually sets the intensity of an individual LED light.
    access: operator
    effect: write
    write: patch
    binding:
      method: setIndividualIntensity
    params:
      type: object
      required:
      - lightID
      - LEDID
      - intensity
      properties:
        lightID:
          type: string
          description: The light ID.
        LEDID:
          type: integer
          description: The ID of the LED.
        intensity:
          type: integer
          description: The intensity level of the light.
    errors:
      1001:
        description: NOT_SUPPORTED_FAULT. Method call not supported by the device.
        kind: unsupported
      1002:
        description: INVALID_LIGHT_ID_FAULT. Provided lightID parameter is not valid for the device.
        kind: invalid_argument
      1003:
        description: INVALID_INTENSITY_FAULT. Provided intensity level is out of the supported range.
        kind: invalid_argument
      1005:
        description: CARD_MALFUNCTIONING_FAULT. Could not find light hardware, could not complete request.
        kind: unavailable
      1006:
        description: WRONG_POE_CLASS_FAULT. Wrong POE class, could not complete request.
