sources:
- url: https://developer.axis.com/vapix/network-video/light-control/
  sha256_md: a98984664998d78ce8bb5d3371562495687accdd33734b7743a3be148d9beaff
  retrieved_at: '2026-10-11'
provenance:
  completeness: complete
  open_questions:
  - 'https://developer.axis.com/vapix/network-video/light-control/#set-light-synchronize-day-night-mode: example
    request uses method "setLightSynchronizationDayNightMode" while the response and API specification use "setLightSynchronizeDayNightMode".'
  - 'https://developer.axis.com/vapix/network-video/light-control/#getservicecapabilities: response table names
    manualAngleOfIlluminationsupport (lowercase s) while syntax uses manualAngleOfIlluminationSupport.'
  - 'https://developer.axis.com/vapix/network-video/light-control/#general-error-codes: codes 2003, 3000 and 7000
    all describe unsupported API version.'
  - 'The method pages carry no apiVersion lines. Gates are taken from the example versions: IR wavelength methods
    1.2, beam shape methods 1.7, everything else 1.0. The listed versions are the ones seen in the docs, not a full
    history.'
  - getValidIRWavelengths names its response list settings (syntax), wavelengths (table) and wavelength (example);
    the table name is modelled and the example is skipped. The setIRWavelength and getIRWavelength examples use
    a bare "wavelength" placeholder, so no examples are kept for them.
  - getValidIRWavelengths has no Security level in the docs; operator is assumed like the other methods.
  - The page also documents a legacy light control service API (AXIS OS 5.40, a separate SOAP-style service); it
    is not covered by this spec.
  - Which fields of getLightInformation items are always present is not stated; only lightID is required.
  migrated_from: v1
  curated: true
