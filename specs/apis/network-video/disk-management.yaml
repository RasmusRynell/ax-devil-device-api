# Migrated from the v1 corpus by codegen/migrate_v1.py; not yet curated.
format: 2
id: disk-management
name: Disk management API (Edge storage)
summary: List, format, check, repair, mount/unmount, lock disks (SD cards, network shares), track jobs, get capabilities
  and health via /axis-cgi/disks/*.cgi.
section: network-video
family: cgi
status: released
python:
  module: disk_management
  class: DiskManagement
docs:
- https://developer.axis.com/vapix/network-video/edge-storage-api/
access: admin
discovery:
- param: {name: Properties.API.HTTP.Version, value: '3'}
- param: {name: Properties.LocalStorage.LocalStorage, value: 'yes'}
- param: {name: Properties.LocalStorage.Version, value: '1.00'}
requires:
  firmware: '5.40'

binding: {path: /axis-cgi/disks/list.cgi}

operations:
  list_disks:
    summary: Retrieve information about available disks (formatted, mounted, ready) and their status.
    access: operator
    effect: read
    binding: {method: GET, reply: xml}
    params:
      type: object
      properties:
        diskid: {type: string, description: all = list all disks; or comma-separated Disk IDs to list.}
    result: {x-xml: true}
    examples:
    - title: Get a list of all disks
      request:
        query: {diskid: all}
      response:
        status: 200
        text: |-
          <?xml version="1.0" ?>
          <root xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
              xsi:noNamespaceSchemaLocation=
              "http://www.axis.com/vapix/http_cgi/disk/list1.xsd">
            <disks numberofdisks="2">
              <disk diskid="SD_DISK"
                name="My SD Card"
                totalsize="2097152"
                freesize="2097152"
                cleanuplevel="95"
                cleanupmaxage="1"
                cleanuppolicy="none"
                locked="no"
                full="no"
                readonly="no"
                filesystem="vfat"
                status="OK"
                group="S0"
                requiredfilesystem="none"
                diskencryptionenabled="false"
                diskencrypted="false"/>
              <disk diskid="NetworkShare"
                name="My Share"
                totalsize="4194304000"
                freesize="3670016000"
                cleanuplevel="95"
                cleanupmaxage="1"
                cleanuppolicy="none"
                locked="no"
                full="no"
                readonly="no"
                filesystem="cifs"
                status="OK"
                group="S1"
                requiredfilesystem="none"
                diskencryptionenabled="false"
                diskencrypted="false"/>
            </disks>
          </root>
    - title: List the network share disk
      request:
        query: {diskid: NetworkShare}
      response:
        status: 200
        text: |-
          <?xml version="1.0" ?>
          <root xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
              xsi:noNamespaceSchemaLocation=
              "http://www.axis.com/vapix/http_cgi/disk/list1.xsd">
            <disks numberofdisks="1">
              <disk diskid="NetworkShare"
                name="My Share"
                totalsize="4194304000"
                freesize="3355443200"
                cleanuplevel="95"
                cleanupmaxage="1"
                cleanuppolicy="none"
                locked="no"
                full="no"
                readonly="no"
                filesystem="cifs"
                status="OK"
                group="S1"
                requiredfilesystem="none"/>
            </disks>
          </root>
  format_disk:
    summary: Format a disk (starts a job).
    description: SD cards can be formatted with ext4 (recommended) or vfat. If required file system is set, the
      disk is formatted automatically when mounted. If disk encryption is enabled, the disk is encrypted when formatted.
    effect: action
    binding:
      path: /axis-cgi/disks/format.cgi
      method: GET
      reply:
        xml:
          status_error: {attribute: result, value: ERROR, message: description}
    params:
      type: object
      required: [diskid]
      properties:
        diskid: {type: string, description: Required. The Disk ID.}
        filesystem:
          type: string
          enum: [ext4, vfat, cifs]
          description: 'File system; available values from getcapabilities.cgi. Default: the file system present
            on the disk. cifs formats a network share (removes all data recorded by this product).'
  check_disk:
    summary: Check the integrity of the file system (starts a job).
    access: operator
    effect: read
    binding:
      path: /axis-cgi/disks/checkdisk.cgi
      method: GET
      reply:
        xml:
          status_error: {attribute: result, value: ERROR, message: description}
    params:
      type: object
      required: [diskid]
      properties:
        diskid: {type: string, description: Required. The Disk ID.}
    result: {x-xml: true}
  repair_disk:
    summary: Repair the file system (starts a job); may lose data.
    effect: action
    binding:
      path: /axis-cgi/disks/repair.cgi
      method: GET
      reply:
        xml:
          status_error: {attribute: result, value: ERROR, message: description}
    params:
      type: object
      required: [diskid]
      properties:
        diskid: {type: string, description: Required. The Disk ID.}
  mount_disk:
    summary: Mount or unmount a disk (starts a job).
    description: Mounting is automatic when an SD card is inserted, a network share is bound, or at boot. Manual
      mount only needed after an unmount without remount.
    effect: action
    binding:
      path: /axis-cgi/disks/mount.cgi
      method: GET
      reply:
        xml:
          status_error: {attribute: result, value: ERROR, message: description}
    params:
      type: object
      required: [action, diskid]
      properties:
        action: {type: string, enum: [mount, unmount], description: Required. mount or unmount.}
        diskid: {type: string, description: Required. The Disk ID.}
  job_progress:
    summary: Check the progress of a format, checkdisk, repair, mount or unmount job; run repeatedly until done.
    access: operator
    effect: read
    binding:
      path: /axis-cgi/disks/job.cgi
      method: GET
      reply:
        xml:
          status_error: {attribute: result, value: ERROR, message: description}
    params:
      type: object
      required: [jobid, diskid]
      properties:
        jobid: {type: integer, description: Required. The Job ID.}
        diskid: {type: string, description: Required. The Disk ID.}
    result: {x-xml: true}
    examples:
    - title: Check the progress of format job 4
      request:
        query: {jobid: '4', diskid: SD_DISK}
      response:
        status: 200
        text: |-
          <?xml version="1.0" ?>
          <root xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
              xsi:noNamespaceSchemaLocation=
              "http://www.axis.com/vapix/http_cgi/disk/checkjob1.xsd">
            <job jobid="4"
              diskid="SD_DISK"
              action="format"
              result="OK"
              progress="15"
          </root>
  lock_disk:
    summary: Lock or unlock a disk.
    effect: action
    binding: {path: /axis-cgi/disks/lock.cgi, method: GET, reply: xml}
    params:
      type: object
      required: [action, diskid]
      properties:
        action: {type: string, enum: [lock, unlock], description: Required. lock or unlock.}
        diskid: {type: string, description: Required. The Disk ID.}
  get_capabilities:
    summary: 'List disk capabilities: file systems it can be formatted with, required file system support, encryption
      support.'
    access: operator
    effect: read
    binding: {path: /axis-cgi/disks/getcapabilities.cgi, method: GET, reply: xml}
    params:
      type: object
      required: [diskid]
      properties:
        diskid: {type: string, description: Required. The Disk ID.}
    result: {x-xml: true}
    examples:
    - title: List file systems supported by the SD card
      request:
        query: {diskid: SD_DISK}
      response:
        status: 200
        text: |-
          <?xml version="1.0" encoding="UTF-8"?>
          <root xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
              xsi:noNamespaceSchemaLocation=
              "http://www.axis.com/vapix/http_cgi/disk/capabilities1.xsd">
            <disk diskid="SD_DISK" requiredfssupported="true" encryptionsupported="true">
              <filesystems>
                <filesystem name="vfat" nicename=" " requiredfssupported="false"/>
                <filesystem name="ext4" nicename=" " requiredfssupported="true"/>
              </filesystems>
            </disk>
          </root>
  get_health:
    summary: List health status (wear level, temperature, overall health) of all disks.
    description: Since AXIS OS 7.20.
    access: operator
    effect: read
    binding:
      path: /axis-cgi/disks/gethealth.cgi
      method: GET
      reply:
        xml: {error_elements: [GeneralError]}
    result: {x-xml: true}
    errors:
      10: {description: An error occurred while processing the request.}
    examples:
    - title: Get the wear level for all disks
      request:
        query: {}
      response:
        status: 200
        text: |-
          <?xml version="1.0" encoding="UTF-8" ?>
          <HealthStatusResponse
              xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
              xsi:noNamespaceSchemaLocation="http://www.axis.com/vapix/http_cgi/disk/gethealth1.xsd">
              <HealthStatusSuccess>
                  <HealthStatus diskid="SD_DISK" wear="25" />
                  <HealthStatus diskid="NetworkShare" wear="-1" />
                  <HealthStatus diskid="HDD_DISK" wear="13" temperature="315" overallhealth="1" />
              </HealthStatusSuccess>
          </HealthStatusResponse>
    - title: Check if an SD card is an Axis SD card
      request:
        query: {}
      response:
        status: 200
        text: |-
          <?xml version="1.0" encoding="UTF-8" ?>
          <HealthStatusResponse
              xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
              xsi:noNamespaceSchemaLocation="http://www.axis.com/vapix/http_cgi/disk/gethealth1.xsd">
              <HealthStatusSuccess>
                  <HealthStatus diskid="SD_DISK" wear="3" />
                  <HealthStatus diskid="NetworkShare" wear="-3" />
                  <HealthStatus diskid="EMMC" wear="0" overallhealth="1" />
              </HealthStatusSuccess>
          </HealthStatusResponse>

