  retrieved_at: '2026-10-11'

provenance:
  completeness: complete
  open_questions:
  - The docs show no reply examples for most operations; the examples here are constructed from the documented body syntax and PTRemoteCalibration1.xsd.
  - Example requests in the docs omit the required schemaversion argument.
  - The docs show SchemaVersionSuccess but the XSD (used here) has SchemaVersionsSuccess.
  - The error table says ErrorDescription while the body and XSD use Description; the runtime reads both.
  - x/y range -1..1 is taken from the coordinate description.
  - The documented methods are GET/POST; GET is used.
  - AXIS OS minimum not stated.
  migrated_from: v1
  curated: true
