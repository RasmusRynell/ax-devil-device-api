format: 2
id: pt-remote-calibration
name: Remote PT Coordinate Calibration API
summary: 'Calibrate pan/tilt coordinates of a remote PTZ camera against a local camera (AXIS Q6000-E): start/abort, select target, on target, save, status.'
section: network-video
family: cgi
status: released
python:
  module: pt_remote_calibration
  class: PtRemoteCalibration
docs:
- https://developer.axis.com/vapix/network-video/integrating-axis-q6000-e/
access: admin
discovery:
- param: {name: Properties.PTRemoteCalibration.PTRemoteCalibration, value: 'yes'}


binding: {path: /axis-cgi/ptremotecalibration/start.cgi}

errors:
  10: {description: Error while processing the request.}
  20: {description: Invalid request., kind: invalid_argument}
  40: {description: Specified version is not supported., kind: unsupported}

types:
  SchemaVersion:
    type: object
    required: [VersionNumber]
    properties:
      VersionNumber:
        type: string
        description: The version number of the XML schema, major.minor.
        x-xml: {child: VersionNumber}
      Deprecated:
        type: boolean
        description: If true, this version of the XML schema is deprecated and should not be used. Defaults to false.
        x-xml: {child: Deprecated}
  SchemaVersions:
    type: object
    x-xml: {root: SchemaVersionsSuccess}
    required: [SchemaVersion]
    properties:
      SchemaVersion:
        type: array
        items: {$ref: '#/types/SchemaVersion'}
        x-xml: {path: SchemaVersion}
  SelectTargetResult:
    type: object
    description: Empty for the first target of a calibration; later targets return the approximate remote pan/tilt.
    x-xml: {root: SelectTargetSuccess}
    properties:
      Pan: {type: number, description: 'Approximate value for the remote PTZ camera pan coordinate, in degrees.', x-xml: {child: Pan}}
      Tilt: {type: number, description: 'Approximate value for the remote PTZ camera tilt coordinate, in degrees.', x-xml: {child: Tilt}}
  CurrentTarget:
    type: object
    required: [X, Y]
    properties:
      X: {type: number, description: 'Normalized x pixel coordinate of the current calibration target (-1.0 is the left edge, 1.0 the right edge).', x-xml: {child: X}}
      Y: {type: number, description: 'Normalized y pixel coordinate of the current calibration target (-1.0 is the bottom edge, 1.0 the top edge).', x-xml: {child: Y}}
  CalibrationInformation:
    type: object
    x-xml: {root: GetInformationSuccess}
    required: [Camera, CurrentTarget]
    properties:
      Camera: {type: integer, description: The local camera (camera head) used in the calibration process., x-xml: {child: Camera}}
      CurrentTarget:
        $ref: '#/types/CurrentTarget'
        x-xml: {path: CurrentTarget}
  CameraCalibration:
    type: object
    required: [Id, Calibrated]
    properties:
      Id: {type: integer, description: The camera number., x-xml: {child: Id}}
      Calibrated: {type: integer, minimum: 0, description: '0 = the camera is not calibrated, 1 and above = calibrated.', x-xml: {child: Calibrated}}
  CalibrationStatus:
    type: object
    x-xml: {root: IsCalibratedSuccess}
    required: [Camera]
    properties:
      Camera:
        type: array
        items: {$ref: '#/types/CameraCalibration'}
        x-xml: {path: Camera}

operations:
  start:
    summary: Start calibration.
    effect: action
    binding: {method: GET, reply: xml}
    params:
      type: object
      required: [schemaversion]
      properties:
        schemaversion:
          type: string
          pattern: ^[0-9]+(\.[0-9]+)?$
          description: The version of the XML schema to use for the response, in the form major[.minor]. The major version is required; if the minor version is omitted the latest minor version is used.
        camera:
          type: integer
          minimum: 1
          default: 1
          description: The camera (camera head) to use for calibration; the number of cameras is given by ImageSource.NbrOfSources. Defaults to 1.
    errors:
      50: {description: Calibration is already ongoing. It is not possible to start a new calibration., kind: unavailable}
  abort:
    summary: Abort an ongoing calibration; all unsaved data will be lost.
    effect: action
    binding: {path: /axis-cgi/ptremotecalibration/abort.cgi, method: GET, reply: xml}
    params:
      type: object
      required: [schemaversion]
      properties:
        schemaversion:
          type: string
          pattern: ^[0-9]+(\.[0-9]+)?$
          description: The version of the XML schema to use for the response, in the form major[.minor]. The major version is required; if the minor version is omitted the latest minor version is used.
    errors:
      54: {description: No calibration is ongoing., kind: unavailable}
  select_target:
    summary: Select a calibration target (normalized x,y) in the image from the local product.
    description: >-
      Position the remote PTZ camera on the same point, then call on_target. Later calls before on_target replace the
      target. The first call of a calibration returns an empty result; later calls return an approximate pan/tilt
      for the remote camera.
    effect: action
    binding: {path: /axis-cgi/ptremotecalibration/selecttarget.cgi, method: GET, reply: xml}
    params:
      type: object
      required: [schemaversion, x, y]
      properties:
        schemaversion:
          type: string
          pattern: ^[0-9]+(\.[0-9]+)?$
          description: The version of the XML schema to use for the response, in the form major[.minor]. The major version is required; if the minor version is omitted the latest minor version is used.
        x:
          type: number
          minimum: -1.0
          maximum: 1.0
          description: Normalized x coordinate in the local product coordinate system; (-1,-1) is the bottom left, (0,0) the center and (1,1) the upper right corner.
        y:
          type: number
          minimum: -1.0
          maximum: 1.0
          description: Normalized y coordinate in the local product coordinate system.
    positional: [x, y]
    result: {$ref: '#/types/SelectTargetResult'}
    errors:
      54: {description: No calibration is ongoing., kind: unavailable}
    examples:
    - title: Second calibration target
      request:
        query: {schemaversion: '1.0', x: '0.5', y: '-0.25'}
      response:
        status: 200
        text: |-
          <?xml version="1.0" encoding="utf-8" ?>
          <PTRemoteCalibrationResponse SchemaVersion="1.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:noNamespaceSchemaLocation="http://www.axis.com/vapix/http_cgi/PTRemoteCalibration1.xsd">
            <SelectTargetSuccess>
              <Pan>12.5</Pan>
              <Tilt>-3.0</Tilt>
            </SelectTargetSuccess>
          </PTRemoteCalibrationResponse>
      source: https://developer.axis.com/vapix/network-video/integrating-axis-q6000-e/#select-calibration-target
  on_target:
    summary: Inform the local product that the remote PTZ camera is positioned at the selected calibration target.
    effect: action
    binding: {path: /axis-cgi/ptremotecalibration/ontarget.cgi, method: GET, reply: xml}
    params:
      type: object
      required: [schemaversion]
      properties:
        schemaversion:
          type: string
          pattern: ^[0-9]+(\.[0-9]+)?$
          description: The version of the XML schema to use for the response, in the form major[.minor]. The major version is required; if the minor version is omitted the latest minor version is used.
        pan:
          type: number
          description: 'Pan coordinate (degrees) of the remote PTZ camera; product dependent (see PTZ.Limit.MinPan and PTZ.Limit.MaxPan). If omitted, read from local status.'
        tilt:
          type: number
          description: 'Tilt coordinate (degrees) of the remote PTZ camera; product dependent (see PTZ.Limit.MinTilt and PTZ.Limit.MaxTilt). If omitted, read from local status.'
    errors:
      52: {description: The pan/tilt coordinates and the selected pixel coordinates (x and y) could not be matched., kind: invalid_argument}
      53: {description: No pixel coordinates are selected., kind: unavailable}
      54: {description: No calibration is ongoing., kind: unavailable}
  save:
    summary: 'Save calibration data: creates the coordinate transformation and stops the calibration process.'
    effect: action
    binding: {path: /axis-cgi/ptremotecalibration/save.cgi, method: GET, reply: xml}
    params:
      type: object
      required: [schemaversion]
      properties:
        schemaversion:
          type: string
          pattern: ^[0-9]+(\.[0-9]+)?$
          description: The version of the XML schema to use for the response, in the form major[.minor]. The major version is required; if the minor version is omitted the latest minor version is used.
    errors:
      51: {description: A satisfying coordinate matching could not be found., kind: unavailable}
      54: {description: No calibration is ongoing., kind: unavailable}
  get_information:
    summary: Retrieve information about an ongoing calibration.
    effect: read
    binding: {path: /axis-cgi/ptremotecalibration/getinformation.cgi, method: GET, reply: xml}
    params:
      type: object
      required: [schemaversion]
      properties:
        schemaversion:
          type: string
          pattern: ^[0-9]+(\.[0-9]+)?$
          description: The version of the XML schema to use for the response, in the form major[.minor]. The major version is required; if the minor version is omitted the latest minor version is used.
    result: {$ref: '#/types/CalibrationInformation'}
    errors:
      54: {description: No calibration is ongoing., kind: unavailable}
    examples:
    - title: Get calibration information
      request:
        query: {schemaversion: '1.0'}
      response:
        status: 200
        text: |-
          <?xml version="1.0" encoding="utf-8" ?>
          <PTRemoteCalibrationResponse SchemaVersion="1.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:noNamespaceSchemaLocation="http://www.axis.com/vapix/http_cgi/PTRemoteCalibration1.xsd">
            <GetInformationSuccess>
              <Camera>1</Camera>
              <CurrentTarget>
                <X>0.5</X>
                <Y>-0.25</Y>
              </CurrentTarget>
            </GetInformationSuccess>
          </PTRemoteCalibrationResponse>
      source: https://developer.axis.com/vapix/network-video/integrating-axis-q6000-e/#get-calibration-information
  is_calibrated:
    summary: List all cameras and whether they are calibrated.
    effect: read
    binding: {path: /axis-cgi/ptremotecalibration/iscalibrated.cgi, method: GET, reply: xml}
    params:
      type: object
      required: [schemaversion]
      properties:
        schemaversion:
          type: string
          pattern: ^[0-9]+(\.[0-9]+)?$
          description: The version of the XML schema to use for the response, in the form major[.minor]. The major version is required; if the minor version is omitted the latest minor version is used.
    result: {$ref: '#/types/CalibrationStatus'}
    errors:
      54: {description: No calibration is ongoing., kind: unavailable}
    examples:
    - title: Get calibration status
      request:
        query: {schemaversion: '1.0'}
      response:
        status: 200
        text: |-
          <?xml version="1.0" encoding="utf-8" ?>
          <PTRemoteCalibrationResponse SchemaVersion="1.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:noNamespaceSchemaLocation="http://www.axis.com/vapix/http_cgi/PTRemoteCalibration1.xsd">
            <IsCalibratedSuccess>
              <Camera>
                <Id>1</Id>
                <Calibrated>1</Calibrated>
              </Camera>
              <Camera>
                <Id>2</Id>
                <Calibrated>0</Calibrated>
              </Camera>
            </IsCalibratedSuccess>
          </PTRemoteCalibrationResponse>
      source: https://developer.axis.com/vapix/network-video/integrating-axis-q6000-e/#get-calibration-status
  get_schema_versions:
    summary: List supported XML schema versions.
    effect: read
    binding: {path: /axis-cgi/ptremotecalibration/schemaversions.cgi, method: GET, reply: xml}
    result: {$ref: '#/types/SchemaVersions'}
    examples:
    - title: List schema versions
      request:
        query: {}
      response:
        status: 200
        text: |-
          <?xml version="1.0" encoding="utf-8" ?>
          <PTRemoteCalibrationResponse SchemaVersion="1.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:noNamespaceSchemaLocation="http://www.axis.com/vapix/http_cgi/PTRemoteCalibration1.xsd">
            <SchemaVersionsSuccess>
              <SchemaVersion>
                <VersionNumber>1.0</VersionNumber>
                <Deprecated>false</Deprecated>
              </SchemaVersion>
            </SchemaVersionsSuccess>
          </PTRemoteCalibrationResponse>
      source: https://developer.axis.com/vapix/network-video/integrating-axis-q6000-e/#xml-schema-versions

sources:
- url: https://developer.axis.com/vapix/network-video/integrating-axis-q6000-e/
