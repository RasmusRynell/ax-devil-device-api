  sha256_md: c3498d11fb9fc947461323ec263f9af49c37444fab1bc1c41afb41a83e7981cf
  retrieved_at: '2026-10-11'

provenance:
  completeness: complete
  open_questions:
  - The id shock-detection is derived from the URL slug minus -api (no API Discovery id stated).
  - The docs identify the API by the property root.Properties.Tampering.ShockDetection=yes; discovery uses the name without the root. prefix, which the param reader strips.
  - Required-ness of enabled (set_enabled) and level (set_sensitivity_level) is not stated; both are required because the call is meaningless without them.
  - Deprecated is a string because the documented example sends an empty element, which the XML mapping hands over as an empty string and would fail boolean validation. It should become a boolean once empty elements map to absent.
  - No XSD for the shockdetection1 namespace is mirrored.
  - The docs show errors wrapped in an Error element; the runtime matches GeneralError anywhere in the document.
  migrated_from: v1
  curated: true
