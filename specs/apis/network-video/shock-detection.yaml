format: 2
id: shock-detection
name: Shock detection API
summary: Enable/disable shock detection and control its sensitivity on products with built-in orientation devices; emits tns1:Device/tnsaxis:Tampering/ShockDetected.
section: network-video
family: cgi
status: released
python:
  module: shock_detection
  class: ShockDetection
docs:
- https://developer.axis.com/vapix/network-video/shock-detection-api/
access: operator
discovery:
- param: {name: Properties.Tampering.ShockDetection, value: 'yes'}
requires:
  firmware: '5.50'

binding: {path: /axis-cgi/shockdetection/getenabled.cgi}

errors:
  10: {description: Error while processing the request.}
  20: {description: Invalid request., kind: invalid_argument}
  40: {description: Specified version is not supported., kind: unsupported}

types:
  ShockDetectionStatus:
    type: object
    x-xml: {root: Success/GetEnabledSuccess}
    required: [Enabled]
    properties:
      Enabled: {type: boolean, description: 'True if shock detection is enabled, false if it is disabled.', x-xml: {child: Enabled}}
  SensitivityLevel:
    type: object
    x-xml: {root: Success/GetSensitivityLevelSuccess/SensitivityLevel}
    required: [Level]
    properties:
      Level: {type: integer, minimum: 0, maximum: 100, description: 'The sensitivity level: 0 is low sensitivity and 100 is high.', x-xml: {child: Level}}
  SchemaVersion:
    type: object
    required: [VersionNumber]
    properties:
      VersionNumber:
        type: string
        description: Schema version in the form major.minor.
        x-xml: {child: VersionNumber}
      Deprecated:
        type: string
        description: '"true" if this version of the XML schema is deprecated and should not be used, otherwise "false". The device may send an empty element, which means false.'
        x-xml: {child: Deprecated}
  SchemaVersions:
    type: object
    x-xml: {root: Success/GetSchemaVersionsSuccess}
    required: [SchemaVersion]
    properties:
      SchemaVersion:
        type: array
        items: {$ref: '#/types/SchemaVersion'}
        x-xml: {path: SchemaVersion}

operations:
  get_enabled:
    summary: Check if shock detection is enabled.
    access: operator
    effect: read
    binding: {method: GET, reply: xml}
    params:
      type: object
      required: [schemaversion]
      properties:
        schemaversion: {type: integer, description: The major version of the XML schema to use for the response.}
    result: {$ref: '#/types/ShockDetectionStatus'}
    examples:
    - title: Check if shock detection is enabled
      request:
        query: {schemaversion: '1'}
      response:
        status: 200
        text: |-
          <?xml version="1.0" encoding="UTF-8"?>
          <ShockDetectionResponse xmlns="http://www.axis.com/vapix/http_cgi/shockdetection1" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://www.axis.com/vapix/http_cgi/shockdetection1 http://www.axis.com/vapix/http_cgi/shockdetection1" SchemaVersion="1.0">
            <Success>
              <GetEnabledSuccess>
                <Enabled>true</Enabled>
              </GetEnabledSuccess>
            </Success>
          </ShockDetectionResponse>
      source: https://developer.axis.com/vapix/network-video/shock-detection-api/#common-examples
  set_enabled:
    summary: Enable or disable shock detection.
    effect: write
    write: patch
    binding: {path: /axis-cgi/shockdetection/setenabled.cgi, method: GET, reply: xml}
    params:
      type: object
      required: [schemaversion, enabled]
      properties:
        schemaversion: {type: integer, description: The major version of the XML schema to use for the response.}
        enabled: {type: boolean, description: 'true enables shock detection, false disables it.'}
    examples:
    - title: Enable shock detection
      request:
        query: {schemaversion: '1', enabled: 'true'}
      response:
        status: 200
        text: |-
          <?xml version="1.0" encoding="UTF-8"?>
          <ShockDetectionResponse xmlns="http://www.axis.com/vapix/http_cgi/shockdetection1" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://www.axis.com/vapix/http_cgi/shockdetection1 http://www.axis.com/vapix/http_cgi/shockdetection1" SchemaVersion="1.0">
            <Success>
              <GeneralSuccess />
            </Success>
          </ShockDetectionResponse>
      source: https://developer.axis.com/vapix/network-video/shock-detection-api/#common-examples
  get_sensitivity_level:
    summary: Retrieve the current sensitivity level.
    effect: read
    binding: {path: /axis-cgi/shockdetection/getsensitivitylevel.cgi, method: GET, reply: xml}
    params:
      type: object
      required: [schemaversion]
      properties:
        schemaversion: {type: integer, description: The major version of the XML schema to use for the response.}
    result: {$ref: '#/types/SensitivityLevel'}
    examples:
    - title: Retrieve the sensitivity level
      request:
        query: {schemaversion: '1'}
      response:
        status: 200
        text: |-
          <?xml version="1.0" encoding="UTF-8"?>
          <ShockDetectionResponse xmlns="http://www.axis.com/vapix/http_cgi/shockdetection1" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://www.axis.com/vapix/http_cgi/shockdetection1 http://www.axis.com/vapix/http_cgi/shockdetection1" SchemaVersion="1.0">
            <Success>
              <GetSensitivityLevelSuccess>
                <SensitivityLevel>
                  <Level>60</Level>
                </SensitivityLevel>
              </GetSensitivityLevelSuccess>
            </Success>
          </ShockDetectionResponse>
      source: https://developer.axis.com/vapix/network-video/shock-detection-api/#common-examples
  set_sensitivity_level:
    summary: Set the shock detection sensitivity level (0 low to 100 high).
    effect: write
    write: patch
    binding: {path: /axis-cgi/shockdetection/setsensitivitylevel.cgi, method: GET, reply: xml}
    params:
      type: object
      required: [schemaversion, level]
      properties:
        schemaversion: {type: integer, description: The major version of the XML schema to use for the response.}
        level:
          type: integer
          minimum: 0
          maximum: 100
          description: 'The shock detection sensitivity level: 0 is low sensitivity and 100 is high.'
    errors:
      30: {description: Unable to set shock detection sensitivity. Specified value is out of range., kind: invalid_argument}
    examples:
    - title: Set the sensitivity level to 60
      request:
        query: {schemaversion: '1', level: '60'}
      response:
        status: 200
        text: |-
          <?xml version="1.0" encoding="UTF-8"?>
          <ShockDetectionResponse xmlns="http://www.axis.com/vapix/http_cgi/shockdetection1" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://www.axis.com/vapix/http_cgi/shockdetection1 http://www.axis.com/vapix/http_cgi/shockdetection1" SchemaVersion="1.0">
            <Success>
              <GeneralSuccess />
            </Success>
          </ShockDetectionResponse>
      source: https://developer.axis.com/vapix/network-video/shock-detection-api/#common-examples
  get_schema_versions:
    summary: Retrieve the supported XML schema versions.
    effect: read
    binding: {path: /axis-cgi/shockdetection/getschemaversion.cgi, method: GET, reply: xml}
    result: {$ref: '#/types/SchemaVersions'}
    examples:
    - title: Retrieve supported XML schema versions
      request:
        query: {}
      response:
        status: 200
        text: |-
          <?xml version="1.0" encoding="UTF-8"?>
          <ShockDetectionResponse xmlns="http://www.axis.com/vapix/http_cgi/shockdetection1" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://www.axis.com/vapix/http_cgi/shockdetection1 http://www.axis.com/vapix/http_cgi/shockdetection1" SchemaVersion="1.0">
            <Success>
              <GetSchemaVersionsSuccess>
                <SchemaVersion>
                  <VersionNumber>1.0</VersionNumber>
                  <Deprecated></Deprecated>
                </SchemaVersion>
              </GetSchemaVersionsSuccess>
            </Success>
          </ShockDetectionResponse>
      source: https://developer.axis.com/vapix/network-video/shock-detection-api/#common-examples

sources:
