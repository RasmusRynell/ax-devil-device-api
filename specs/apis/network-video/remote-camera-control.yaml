id: remote-camera-control
name: Remote camera control API
summary: 'Manage the connection from a local camera (AXIS Q6000-E) to a remote PTZ camera: get/set connection parameters,
  connection status, remote URL.'
section: network-video
family: cgi
status: released
python:
  module: remote_camera_control
  class: RemoteCameraControl
docs:
