operations:
  get_vapix_params:
    summary: Retrieve connection parameters used for the remote camera.
    effect: read
    binding: {method: GET, reply: xml}
    params:
      type: object
      required: [schemaversion]
      properties:
        schemaversion:
          type: string
          pattern: ^[0-9]+(\.[0-9]+)?$
          description: The version of the XML Schema to use for the response, form major[.minor]. The major version
            is required; if minor is not specified the latest minor version is used.
    result: {$ref: '#/types/GetVapixParamsResult'}
    examples:
    - title: Get the connection parameters
      request:
        query: {schemaversion: '1'}
      response:
        status: 200
        text: |-
          <?xml version="1.0" encoding="utf-8" ?>
          <RemoteCameraControlResponse
              SchemaVersion="1.0"
              xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
              xsi:noNamespaceSchemaLocation="http://www.axis.com/vapix/http_cgi/RemoteCameraControl1.xsd">
              <GetVapixParamsSuccess>
                  <BaseConnectionParams>
                      <MACAddress>ac:cc:8e:08:47:68</MACAddress>
                      <Host>169.254.0.123</Host>
                      <DiscoveryMode>auto</DiscoveryMode>
                  </BaseConnectionParams>
                  <VapixConnectionParams>
                      <HTTPPort>80</HTTPPort>
                      <HTTPSPort>443</HTTPSPort>
                      <RTSPPort>553</RTSPPort>
                      <Username>root</Username>
                  </VapixConnectionParams>
              </GetVapixParamsSuccess>
          </RemoteCameraControlResponse>
      source: https://developer.axis.com/vapix/network-video/integrating-axis-q6000-e/#common-examples
  set_vapix_params:
    summary: Set connection parameters (only used in the connection; remote camera settings are not changed).
    effect: write
    write: patch
    binding: {path: /axis-cgi/remotecameracontrol/setvapixparams.cgi, method: GET, reply: xml}
    params:
      type: object
      required: [schemaversion]
      properties:
        schemaversion:
          type: string
          pattern: ^[0-9]+(\.[0-9]+)?$
          description: The version of the XML Schema to use for the response, form major[.minor]. The major version
            is required; if minor is not specified the latest minor version is used.
        host: {type: string, description: 'The remote camera host address, IPv4 address or IPv6 address.'}
        discoverymode:
          type: string
          enum: [auto, manual]
          default: auto
          description: auto = local camera discovers the remote camera IPv4 address automatically; manual = address
            must be set using host. IPv6 requires manual mode and host.
        httpport:
          type: integer
          minimum: 1
          maximum: 65535
          description: 'The remote camera''s HTTP port. Default: the remote camera''s current HTTP port setting.'
        httpsport:
          type: integer
          minimum: 1
          maximum: 65535
          description: 'The remote camera''s HTTPS port. Default: current setting.'
        rtspport:
          type: integer
          minimum: 1
          maximum: 65535
          description: 'The remote camera''s RTSP port. Default: current setting.'
        username: {type: string, description: User name for a user account on the remote camera.}
        password: {type: string, description: Password for the user account.}
    examples:
    - title: Set connection parameters
      request:
        query: {schemaversion: '1', password: pass}
      response:
        status: 200
        text: |-
          <?xml version="1.0" encoding="utf-8" ?>
          <RemoteCameraControlResponse
              SchemaVersion="1.0"
              xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
              xsi:noNamespaceSchemaLocation="http://www.axis.com/vapix/http_cgi/RemoteCameraControl1.xsd">
              <GeneralSuccess />
          </RemoteCameraControlResponse>
      source: https://developer.axis.com/vapix/network-video/integrating-axis-q6000-e/#common-examples
  get_vapix_status:
    summary: Retrieve connection status.
    access: viewer
    effect: read
    binding: {path: /axis-cgi/remotecameracontrol/getvapixstatus.cgi, method: GET, reply: xml}
