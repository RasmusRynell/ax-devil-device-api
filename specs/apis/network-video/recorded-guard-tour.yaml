# Migrated from the v1 corpus by codegen/migrate_v1.py; not yet curated.
format: 2
id: recorded-guard-tour
name: Recorded tour API
summary: Record, play, pause/resume, stop, list, modify and remove recorded PTZ tours via /axis-cgi/recordedtour/*.cgi
  (XML responses).
section: network-video
family: cgi
status: released
python:
  module: recorded_guard_tour
  class: RecordedTour
docs:
- https://developer.axis.com/vapix/network-video/guard-tour-api/
access: operator
discovery:
- {api_discovery: recorded-guard-tour}
- param: {name: root.Properties.GuardTour.RecordedTour, value: 'yes'}
- param: {name: root.Properties.API.HTTP.Version, value: '3'}

binding: {path: /axis-cgi/recordedtour/getschemaversions.cgi}

operations:
  get_schema_versions:
    summary: Get supported XML Schema versions and whether they are deprecated.
    access: viewer
    effect: read
    binding: {method: GET, reply: xml}
    result: {x-xml: true}
    examples:
    - title: Example
      request:
        query: {}
      response:
        status: 200
        text: |-
          <?xml version="1.0" encoding="utf-8" ?>
          <RecordedTourResponse
              xmlns="http://www.axis.com/vapix/http_cgi/recordedtour1"
              xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
              xsi:SchemaLocation="http://www.axis.com/vapix/http_cgi/recordedtour1
              http://www.axis.com/vapix/http_cgi/recordedtour1.xsd"
              SchemaVersion="1.0">
              <Success>
                  <GetSchemaVersionsSuccess>
                      <SchemaVersion>
                          <VersionNumber>[major1].[minor1]</VersionNumber>
                          <Deprecated>[deprecated]</Deprecated>
                      </SchemaVersion>
                      ...
                  </GetSchemaVersionsSuccess>
              </Success>
          </RecordedTourResponse>
  list:
    summary: List recorded tours.
    access: viewer
    effect: read
    binding: {path: /axis-cgi/recordedtour/list.cgi, method: POST, reply: xml}
    params:
      type: object
      required: [schemaversion]
      properties:
        schemaversion:
          type: integer
          minimum: 1
          description: The major version of the XML Schema the response is structured according to. The latest supported
            minor version is always used.
        camera:
          type: integer
          minimum: 1
          description: Video channel or view area. If omitted, tours from all channels are listed.
        recordedtourid:
          type: integer
          minimum: 0
          maximum: 9999
          description: ID of the recorded tour to list. If omitted, all recorded tours are listed.
    result: {x-xml: true}
    examples:
    - title: Example
      request:
        query: {schemaversion: '1'}
      response:
        status: 200
        text: |-
          <?xml version="1.0" encoding="utf-8"?>
          <RecordedTourResponse
              xmlns="http://www.axis.com/vapix/http_cgi/recordedtour1"
              xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
              xsi:SchemaLocation="http://www.axis.com/vapix/http_cgi/recordedtour1
              http://www.axis.com/vapix/http_cgi/recordedtour1.xsd"
              SchemaVersion="1.0">
            <Success>
              <ListSuccess>
                <RecordingInformation>
                  <RecordingId>1</RecordingId>
                  <NiceName>MyFirstRecording</NiceName>
                  <Status>stopped</Status>
                  <Camera>1</Camera>
                  <DefaultLoopDelay>60</DefaultLoopDelay>
                </RecordingInformation>
              </ListSuccess>
            </Success>
          </RecordedTourResponse>
  record:
    summary: Start recording a tour.
    effect: action
    binding: {path: /axis-cgi/recordedtour/record.cgi, method: POST, reply: xml}
    params:
      type: object
      required: [schemaversion, camera]
      properties:
        schemaversion:
          type: integer
          minimum: 1
          description: The major version of the XML Schema the response is structured according to. The latest supported
            minor version is always used.
        nicename:
          type: string
          maxLength: 31
          pattern: ^[a-zA-Z0-9._-]*$
          description: Name of the recorded tour (max 31 characters; a-z, A-Z, 0-9,., -, _).
        camera: {type: integer, minimum: 1, description: Required. The video channel or view area.}
        recordedtourid:
          type: integer
          minimum: 0
          maximum: 9999
          description: Recorded tour ID; must be unique. If omitted, an autogenerated ID is assigned.
  stop_recording:
    summary: Stop an ongoing recording.
    effect: action
    binding: {path: /axis-cgi/recordedtour/stoprecording.cgi, method: POST, reply: xml}
    params:
      type: object
      required: [schemaversion]
      properties:
        schemaversion:
          type: integer
          minimum: 1
          description: The major version of the XML Schema the response is structured according to. The latest supported
            minor version is always used.
        recordedtourid:
          type: integer
          minimum: 0
          maximum: 9999
          description: ID of the recorded tour to stop. If omitted, all ongoing recordings are stopped.
  play:
    summary: Play a recorded tour.
    description: 'Security level: Administrator, Operator, Viewer with PTZ control access.'
    access: viewer
    effect: action
    binding: {path: /axis-cgi/recordedtour/play.cgi, method: POST, reply: xml}
    params:
      type: object
      required: [schemaversion, recordedtourid]
      properties:
        schemaversion:
          type: integer
          minimum: 1
          description: The major version of the XML Schema the response is structured according to. The latest supported
            minor version is always used.
        recordedtourid:
          type: integer
          minimum: 0
          maximum: 9999
          description: ID of the recorded tour to play.
        loop:
          type: integer
          enum: [0, 1]
          default: 0
          description: 0 = play once; 1 = loop until stopped, pausing loopdelay seconds at the end point before
            restarting.
        loopdelay:
          type: integer
          minimum: 0
          maximum: 9999
          description: Seconds to wait before continuing the loop. If omitted, the defaultloopdelay set by modify.cgi
            is used. (unit=s)
  stop_playback:
    summary: Stop playback of a recorded tour.
    description: 'Security level: Administrator, Operator, Viewer with PTZ control access.'
    access: viewer
    effect: action
    binding: {path: /axis-cgi/recordedtour/stopplayback.cgi, method: POST, reply: xml}
    params:
      type: object
      required: [schemaversion]
      properties:
        schemaversion:
          type: integer
          minimum: 1
          description: The major version of the XML Schema the response is structured according to. The latest supported
            minor version is always used.
        recordedtourid:
          type: integer
          minimum: 0
          maximum: 9999
          description: ID of the recorded tour to stop. If omitted, playback of all recorded tours is stopped.
  pause:
    summary: Pause playback of a recorded tour (resume with resume.cgi).
    description: 'Security level: Administrator, Operator, Viewer with PTZ control access.'
    access: viewer
    effect: action
    binding: {path: /axis-cgi/recordedtour/pause.cgi, method: POST, reply: xml}
    params:
      type: object
      required: [schemaversion]
      properties:
        schemaversion:
          type: integer
          minimum: 1
          description: The major version of the XML Schema the response is structured according to. The latest supported
            minor version is always used.
        recordedtourid:
          type: integer
          minimum: 0
          maximum: 9999
          description: ID of the recorded tour to pause. If omitted, all playing recorded tours are paused.
  resume:
    summary: Resume playback of a paused recorded tour.
    description: 'Security level: Administrator, Operator, Viewer with PTZ control access.'
    access: viewer
    effect: action
    binding: {path: /axis-cgi/recordedtour/resume.cgi, method: POST, reply: xml}
    params:
      type: object
      required: [schemaversion]
      properties:
        schemaversion:
          type: integer
          minimum: 1
          description: The major version of the XML Schema the response is structured according to. The latest supported
            minor version is always used.
        recordedtourid:
          type: integer
          minimum: 0
          maximum: 9999
          description: ID of the paused recorded tour to resume. If omitted, all paused recorded tours are resumed.
  modify:
    summary: Modify name and loop delay of an existing recorded tour.
    effect: write
    write: patch
    binding: {path: /axis-cgi/recordedtour/modify.cgi, method: POST, reply: xml}
    params:
      type: object
      required: [schemaversion, recordedtourid]
      properties:
        schemaversion:
          type: integer
          minimum: 1
          description: The major version of the XML Schema the response is structured according to. The latest supported
            minor version is always used.
        recordedtourid:
          type: integer
          minimum: 0
          maximum: 9999
          description: ID of the recorded tour to modify.
        nicename:
          type: string
          maxLength: 31
          pattern: ^[a-zA-Z0-9._-]*$
          description: New descriptive name. If omitted, the current name is kept. Max 31 characters; a-z, A-Z,
            0-9,., -, _.
        defaultloopdelay:
          type: integer
          minimum: 0
          maximum: 9999
          description: New loop delay in seconds. If omitted, current delay kept. Default value 60 seconds. (unit=s)
  remove:
    summary: Remove a recorded tour.
    effect: write
    write: delete
    binding: {path: /axis-cgi/recordedtour/remove.cgi, method: POST, reply: xml}
    params:
      type: object
      required: [schemaversion, recordedtourid]
      properties:
        schemaversion:
          type: integer
          minimum: 1
          description: The major version of the XML Schema the response is structured according to. The latest supported
            minor version is always used.
        recordedtourid:
          type: integer
          minimum: 0
          maximum: 9999
          description: Required. ID of the recorded tour to remove.

