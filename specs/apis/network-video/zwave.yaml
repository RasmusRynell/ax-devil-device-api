provenance:
  completeness: complete
  open_questions:
  - "Results are nested as documented (data.net.*, data.node.*, data.interface.<commandClass>.*); the generator cannot unwrap them, so users reach the payload through result.interface.<commandClass> and similar."
  - "getNodeList: deviceCategory is ``code`` in the response syntax and examples but ``id`` in the parameter table; both are modeled as optional. secureInclusionFailed is <integer> in the table but boolean in the description and examples; modeled as boolean. vendorProductType is in the syntax and examples but missing from the table."
  - "getBinarySwitchState: the table names data.interface.binaryswitch.lastUpdated/targetState (lower case s); the response syntax uses binarySwitch, which is modeled."
  - "getWakeUpInfo: the table lists nodeId and association.lastUpdated; the response syntax uses wakeUp.nodeID and wakeUp.lastUpdated, which are modeled."
  - "getFirmwareInfo: the table names maxFramerateSize and types fixedFragmentSize as boolean; the syntax has maxFragmentSize and fixedFragmentSize <integer>. Modeled as maxFragmentSize and boolean."
  - "requestFirmwareBackup: the table names backPath; the syntax uses backupPath, which is modeled."
  - "getNotificationState: the table puts lastUpdated at notification.lastUpdated; the syntax puts it in notification.report, which is modeled. vendorAlarmType has no Optional marker but 'defaults to 0 when not in use'; modeled as optional."
  - "getAllNotificationEventSupport: zwaveAlarmTypeList.type is <integer> in the table and <string> in the syntax; modeled as string like getNotificationCapabilities."
  - "getAntiTheftUnlockState: the table names centralScene.lastUpdated; modeled as antiTheftUnlock.lastUpdated per the syntax."
  - "setConfiguration: useDefault has no Optional marker and is modeled as required; paramValue and paramSize are 'not required if useDefault is true' and are modeled as optional."
  - "getMeterReading: unit and rateType 'default to noPreference'; noPreference is accepted in requests although the unit and rate type tables do not list it. importExport must not be used in requests."
  - "setTemperatureThreshold/getTemperatureThreshold: the wire values of unit (Celsius/Fahrenheit) are not given; the sensor unit table suggests celsius and fahrenheit. Kept as a free string."
  - "setIoFunction* do not say whether they replace an existing I/O function of the endpoint; modeled as write/patch."
  - "The examples report roleType alwaysOnSlave (code 5) while the role type table names code 5 alwaysOnEndNode; name fields of device class objects are free strings."
  - "The multilevel sensor event example uses sensorType lumSensor while the sensor type table names luminSensor."
  - "The general error table ends with '...' (list incomplete). 2107 is a transport-level error with HTTP 4XX/5XX."
  - "Common examples use the URL 'http://<servername>http://<servername>/axis-cgi/zwave.cgi' (doc typo)."
  migrated_from: v1
  curated: true
