          type: integer
          description: The vendor specific alarm type that defaults to 0 when not in use. `-1` indicates no favorites
            when retrieving from the cache.
        zwaveAlarmType:
          type: string
          description: The alarm/notification type that defaults to `latest` if not used.
        zwaveEvent:
          type: integer
          description: Valid only when operating in push mode and defaults to 0 (latest) when not used.
    result:
      type: object
      properties:
        interface:
          type: object
          x-name: GetNotificationStateResultInterface
          properties:
            interfaceDescriptor: {type: integer, description: The interface descriptor.}
            notification:
              type: object
              x-name: GetNotificationStateResultInterfaceNotification
              properties:
                report:
                  type: object
                  x-name: GetNotificationStateResultInterfaceNotificationReport
                  description: An alarm/notification report.
                  properties:
                    vendorAlarmType: {type: integer, description: The vendor specific alarm type.}
                    vendorAlarmLevel: {type: integer, description: The vendor specific alarm level.}
                    extendedInfoValid:
                      type: boolean
                      description: True if the extended information fields should be considered valid. Please note
                        that this is only valid if the Alarm/Notification Command Class supports version 2 and above.
                    extendedInfoAlarmStatus:
                      type: string
                      description: The Z-Wave alarm/notification status. See the *Z-Wave alarm statuses* table below
                        for available statuses. Please note that this is only valid if the Alarm/Notification Command
                        Class supports version 2 and above.
                    extendedInfoAlarmType: {type: string, description: The Z-Wave alarm/notification type.}
                    extendedInfoAlarmEvent:
                      type: integer
                      description: The Z-Wave event. Please note that this is only valid if the Alarm/Notification
                        Command Class supports version 2 and above.
                    extendedInfoParameterLength:
                      type: integer
                      description: The event parameter length measured in bytes. 0 means that no parameters are
                        present. Please note that this is only valid if the Alarm/Notification Command Class supports
                        version 2 and above.
                    extendedInfoParameterType: {type: string, description: The event parameter type.}
                    extendedInfoParameter:
                      type: integer
                      description: The event parameter that is only available if `extendedInfoParameterType` is
                        not set to `location`. Please note that this is only valid if the Alarm/Notification Command
                        Class supports version 2 and above.
                    extendedInfoLocation:
                      type: string
                      description: The UTF-8 encoded event parameter that is only available if `extendedInfoParameterType`
                        is set to `location`. Please note that this is only valid if the Alarm/Notification Command
                        Class supports version 2 and above.
                lastUpdated:
                  type: string
                  description: The last updated time, presented in the ISO 8601 basic format (YYYYMMDDThhmmss).
  set_notification_state:
    summary: This method should be used when you want to set the state of a specific Z-Wave alarm/notification type
      when the device is operating in push mode, or clear a...
    description: This method should be used when you want to set the state of a specific Z-Wave alarm/notification
      type when the device is operating in push mode, or clear a persistent notification when the device is operating
      in pull mode. Please note that this method is only applicable if the Alarm/Notification Command Class supports
      version 2 or above.
    effect: write
    write: patch
    binding: {method: setNotificationState}
    params:
      type: object
      required: [interfaceDescriptor, zwaveAlarmType, status]
      properties:
        interfaceDescriptor: {type: integer, description: The interface descriptor.}
        zwaveAlarmType:
          type: string
          description: The alarm/notification type. The most common alarm/notification types can be found in the
            *Common Z-Wave alarm types* table in [getNotificationCapabilities](#getnotificationcapabilities)
        status:
          type: integer
          description: 'For alarms operating in push mode: `0` = disable an unsolicited report. `255` = enable an
            unsolicited report. For alarms operating in pull mode: `0` = clears a persistent notification.'
  get_central_scene_capabilities:
    summary: This method should be used when you want to check supported scene capabilities, including the maximum
      supported scenes and key attributes, of either the end...
    effect: read
    binding: {method: getCentralSceneCapabilities}
    params:
      type: object
      required: [interfaceDescriptor]
      properties:
        interfaceDescriptor: {type: integer, description: The interface descriptor.}
        refresh:
          type: boolean
          description: '`true` if the capabilities should be fetched from the end node, `false` if it should be
            retrieved from the cache (default value).'
    result:
      type: object
      properties:
        interface:
          type: object
          x-name: GetCentralSceneCapabilitiesResultInterface
          properties:
            interfaceDescriptor: {type: integer, description: The interface descriptor.}
            centralScene:
              type: object
              x-name: GetCentralSceneCapabilitiesResultInterfaceCentralScene
              properties:
                lastUpdated:
                  type: string
                  description: The last updated time, presented in the ISO 8601 basic format (YYYYMMDDThhmmss).
                maxSceneCount: {type: integer, description: The maximum number of scenes.}
                slowRefresh: {type: boolean, description: '`true` if slow refresh is supported, `false` if it isn’t.'}
                keyAttributes:
                  type: array
                  items:
                    type: object
                    x-name: GetCentralSceneCapabilitiesResultInterfaceCentralSceneKeyAttributesItem
                    properties:
                      sceneNumber: {type: integer, description: The scene number.}
                      support:
                        type: array
                        items: {type: string}
                        description: An array of key attributes defined in the *Central scene key attributes* table
                          below.
                  description: Only valid if the Central Scene Command Class supports version 2 and above.
  get_central_scene_configuration:
    summary: This method should be used when you want to check the configuration value of a scene notification in
      the end node.
    effect: read
    binding: {method: getCentralSceneConfiguration}
    params:
      type: object
      required: [interfaceDescriptor]
      properties:
        interfaceDescriptor: {type: integer, description: The interface descriptor.}
    result:
      type: object
      properties:
        interface:
          type: object
          x-name: GetCentralSceneConfigurationResultInterface
          properties:
            interfaceDescriptor: {type: integer, description: The interface descriptor.}
            centralScene:
              type: object
              x-name: GetCentralSceneConfigurationResultInterfaceCentralScene
              properties:
                lastUpdated:
                  type: string
                  description: The last updated time, presented in the ISO 8601 basic format (YYYYMMDDThhmmss).
                slowRefresh:
                  type: boolean
                  description: The slow refresh status of the `keyHeldDown` notification. `true` if enabled, `false`
                    otherwise.
  set_central_scene_configuration:
    summary: This method should be used when you want to configure a scene notification.
    effect: write
    write: patch
    binding: {method: setCentralSceneConfiguration}
    params:
      type: object
      required: [interfaceDescriptor, slowRefresh]
      properties:
        interfaceDescriptor: {type: integer, description: The interface descriptor.}
        slowRefresh: {type: boolean, description: '`true` if slow refresh should be used, `false` otherwise.'}
  get_central_scene_state:
    summary: This method should be used when you want to check the cached central scene data.
    effect: read
    binding: {method: getCentralSceneState}
    params:
      type: object
      required: [interfaceDescriptor]
      properties:
        interfaceDescriptor: {type: integer, description: The interface descriptor.}
    result:
      type: object
      properties:
        interface:
          type: object
          x-name: GetCentralSceneStateResultInterface
          properties:
            interfaceDescriptor: {type: integer, description: The interface descriptor.}
            centralScene:
              type: object
              x-name: GetCentralSceneStateResultInterfaceCentralScene
              properties:
                lastUpdated:
                  type: string
                  description: The last updated time, presented in the ISO 8601 basic format (YYYYMMDDThhmmss).
                sequenceNumber: {type: integer, description: The sequence number incremented when a new report is
                    issued.}
                keyAttribute:
                  type: string
                  description: The key attribute. The available key attributes are specified in the *Central scene
                    key attributes* table in [getCentralSceneCapabilities](#getcentralscenecapabilities).
                sceneNumber: {type: integer, description: The actual scene identifier.}
                slowRefresh:
                  type: boolean
                  description: The status for the slow refresh of the `keyHeldDown` notification. `true` if enabled,
                    `false` otherwise.
  get_anti_theft_unlock_state:
    summary: This method should be used when you want to retrieve the current anti-theft unlock state from either
      the end node or the last known state from the cache.
    effect: read
    binding: {method: getAntiTheftUnlockState}
    params:
      type: object
      required: [interfaceDescriptor]
      properties:
        interfaceDescriptor: {type: integer, description: The interface descriptor.}
        refresh:
          type: boolean
          description: '`true` if the state is fetched from the end node and `false` if the state is retrieved from
            the cache (default value).'
    result:
      type: object
      properties:
        interface:
          type: object
          x-name: GetAntiTheftUnlockStateResultInterface
          properties:
            interfaceDescriptor: {type: integer, description: The interface descriptor.}
            centralScene:
              type: object
              x-name: GetAntiTheftUnlockStateResultInterfaceCentralScene
              properties:
                lastUpdated:
                  type: string
                  description: The last updated time, presented in the ISO 8601 basic format (YYYYMMDDThhmmss).
            antiTheftUnlock:
              type: object
              x-name: GetAntiTheftUnlockStateResultInterfaceAntiTheftUnlock
              properties:
                stateNum:
                  type: integer
                  description: Indicates the number of state changes. Please note that the counter will loop from
                    0 when it reaches `0xFFFF`.
                state: {type: boolean, description: '`true` if locked, `false` otherwise.'}
                restricted: {type: boolean, description: '`true` if the node is running in restricted mode.'}
                hint:
                  type: string
                  description: A hex string consisting of between 0–10 bytes and containing hints that helps you
                    retrieve the Magic Code needed to unlock.
                manufacturerID:
                  type: integer
                  description: The manufacturer ID belonging to the company whose product has locked the node.
                entityID:
                  type: integer
                  description: The entity ID, a unique identifier for the entity that locked the node.
  set_anti_theft_unlock_state:
    summary: This method should be used when you want to unlock a node.
    effect: write
    write: patch
    binding: {method: setAntiTheftUnlockState}
    params:
      type: object
      required: [interfaceDescriptor, code]
      properties:
        interfaceDescriptor: {type: integer, description: The interface descriptor.}
        code:
          type: string
          description: The Magic Code used to unlock the node with a hex string between 1–10 bytes, where every
            byte is represented by two characters. For example, 0x01 0x02 0xFF would be presented as 0102FF.
  set_temperature_threshold:
    summary: This method should be used when you want to set the value for a temperature threshold that will activate
      when the temperature goes above or below the specified...
    description: This method should be used when you want to set the value for a temperature threshold that will
      activate when the temperature goes above or below the specified threshold. Omitting any optional parameters
      means that the current value for those parameters are kept. Please note that your device needs to support
      Multilevel Sensor Command Class to use this method.
    effect: write
    write: patch
    binding: {method: setTemperatureThreshold}
    params:
      type: object
      required: [endpointDescriptor, active]
      properties:
        endpointDescriptor: {type: integer, description: The endpoint descriptor.}
        active:
          type: boolean
          description: Defines the state of the temperature threshold functionality. Can be either active `true`
            or inactive `false`.
        warningRule:
          type: string
          description: Defines when the temperature threshold event should be triggered. Can be either `above` or
            `below`.
        threshold:
          type: integer
          description: The threshold value that may be either above or below the target temperature depending on
            `warningRule`. Hysteresis is not included.
        unit:
          type: string
          description: The supported temperature units. Can be either Celsius or Fahrenheit.
  get_temperature_threshold:
    summary: This method should be used when you want to check the current settings for the temperature threshold.
    description: This method should be used when you want to check the current settings for the temperature threshold.
      Please note that your device needs to support Multilevel Sensor Command Class to use this method.
    effect: read
    binding: {method: getTemperatureThreshold}
    params:
      type: object
      required: [endpointDescriptor]
      properties:
        endpointDescriptor: {type: integer, description: The endpoint descriptor.}
        unit:
          type: string
          description: The supported temperature unit. Can be either Celsius (default) or Fahrenheit.
    result:
      type: object
      properties:
        active:
          type: boolean
          description: Defines the state of the temperature threshold functionality. Can be either active `true`
            or inactive `false`.
        warningRule:
          type: string
          description: Defines when the temperature threshold event should be triggered. Can be either `above` or
            `below` the specified value, however `unknown` will be returned if no value has been set.
        threshold:
          type: integer
          description: The threshold value that may be either above or below the target temperature depending on
            `warningRule`. Hysteresis is not included. `0` will be returned if no value has been set.
  set_io_function_binary_switch:
    summary: This method should be used when you want to set the binary-switch I/O functionality for an end node.
    effect: write
    write: patch
    binding: {method: setIoFunctionBinarySwitch}
    params:
      type: object
      required: [endpointDescriptor, ioPortNumber, invert]
      properties:
        endpointDescriptor: {type: integer, description: The endpoint descriptor.}
        ioPortNumber: {type: integer, description: The I/O port number.}
        invert:
          type: boolean
          description: '`true` turns on the Binary-switch when the I/O port is low, `false` turns on the Binary-switch
            when the I/O port is high.'
  set_io_function_one_shot:
    summary: This method should be used when you want to set the One-shot I/O functionality for an end node.
    effect: write
    write: patch
    binding: {method: setIoFunctionOneShot}
    params:
      type: object
      required:
      - endpointDescriptor
      - ioPortNumber
      - alarmType
      - event
      - invert
      - duration
      properties:
        endpointDescriptor: {type: integer, description: The endpoint descriptor.}
        ioPortNumber: {type: integer, description: The I/O port number.}
        alarmType: {type: integer, description: The alarm/notification type.}
        event:
          type: integer
          description: The event that sets the I/O port to high for a duration of time.
        invert:
          type: boolean
          description: '`true` turns on the Binary-switch when the I/O port is low, `false` turns on the Binary-switch
            when the I/O port is high.'
        duration:
          type: integer
          description: Specifies the time, in seconds, that the I/O port should be kept high or low depending on
            the invert flag before returning back to its default value.
  set_io_function_set_reset:
    summary: This method should be used when you want to use the Set and Reset I/O functionality for an end node.
    effect: write
    write: patch
    binding: {method: setIoFunctionSetReset}
    params:
      type: object
      required:
      - endpointDescriptor
      - ioPortNumber
      - setAlarmType
      - setEvent
      - resetAlarmType
      - resetEvent
      - invert
      properties:
        endpointDescriptor: {type: integer, description: The endpoint descriptor.}
        ioPortNumber: {type: integer, description: The I/O port number.}
        setAlarmType: {type: integer, description: The alarm/notification type for the set event.}
        setEvent: {type: integer, description: The event that sets the I/O port to high.}
        resetAlarmType: {type: integer, description: The alarm/notification type for the reset event.}
        resetEvent: {type: integer, description: The reset event that resets the I/O port to low.}
        invert:
          type: boolean
          description: '`true` inverts the action where the set event sets the I/O port to low and the reset event
            will set it back to high, while `false` uses the set event to set the I/O port to high and reset will
            set it back to low.'
  set_io_function_toggle:
    summary: This method should be used when you want to set the Toggle I/O functionality for an end node.
    effect: write
    write: patch
    binding: {method: setIoFunctionToggle}
    params:
      type: object
      required: [endpointDescriptor, ioPortNumber, alarmType, event]
      properties:
        endpointDescriptor: {type: integer, description: The endpoint descriptor.}
        ioPortNumber: {type: integer, description: The I/O port number.}
        alarmType: {type: integer, description: The alarm/notification type.}
        event:
          type: integer
          description: The I/O toggle event. In this case, the I/O port should be set to high if it was previously
            low, or low if it was high.
  remove_io_function:
    summary: This method should be used when you want to remove the I/O functionality from an end node.
    effect: write
    write: delete
    binding: {method: removeIoFunction}
    params:
      type: object
      required: [endpointDescriptor]
      properties:
        endpointDescriptor: {type: integer, description: The endpoint descriptor.}
  get_io_configuration:
    summary: This method should be used when you want to retrieve the current I/O configuration for an end node.
    effect: read
    binding: {method: getIoConfiguration}
    params:
      type: object
      required: [endpointDescriptor]
      properties:
        endpointDescriptor: {type: integer, description: The endpoint descriptor.}
    result:
      type: object
      properties:
        endpointDescriptor: {type: integer, description: The given endpointDescriptor.}
        ioConfiguration:
          type: object
          x-name: GetIoConfigurationResultIoConfiguration
          properties:
            ioFunction:
              type: string
              description: The I/O function used by the end node configuration. Current values are `Set/Reset`,
                `Toggle`, `One-shot` and `Binary-switch`.
            enabled: {type: boolean, description: A boolean indicating if the configuration is currently used.}
            ioPortNumber: {type: integer, description: The I/O port number.}
            alarmType:
              type: integer
              description: The alarm/notification type for the set event. This parameter is not used by the configuration
                if the value is `0`.
            event:
              type: integer
              description: The event used by the I/O function. This parameter is not used by the configuration if
                the value is `0`.
            resetAlarmType:
              type: integer
              description: The alarm/notification type for the reset event valid for the `Set/Reset` I/O function.
                This parameter is not used by the configuration if the value is `0`.
            resetEvent:
              type: integer
              description: The reset event valid for the `Set/Reset` I/O function. This parameter is not used by
                the configuration if the value is `0`.
            invert:
              type: boolean
              description: A boolean indicating if the I/O action should be inverted. This parameter is valid for
                the I/O functions `Set/Reset`, `One-shot` and `Binary-switch`.
            duration:
              type: integer
              description: Specifies the duration, in seconds, when the I/O port should be high/low. This parameter
                is only valid for the I/O function `One-shot`.
  get_all_notification_event_support:
    summary: This method should be used when you want to retrieve all notification events supported by the end node.
    effect: read
    binding: {method: getAllNotificationEventSupport}
    params:
      type: object
      required: [interfaceDescriptor]
      properties:
        interfaceDescriptor: {type: integer, description: The interface descriptor.}
        refresh:
          type: boolean
          description: '`true` if the supported types is fetched from the end node and `false` if it is retrieved
            from the cached. Retrieves from the cache by default.'
    result:
      type: object
      properties:
        interface:
          type: object
          x-name: GetAllNotificationEventSupportResultInterface
          properties:
            interfaceDescriptor: {type: integer, description: The interface descriptor.}
            notification:
              type: object
              x-name: GetAllNotificationEventSupportResultInterfaceNotification
              properties:
                lastUpdated:
                  type: string
                  description: The last updated time, presented in the ISO 8601 basic format (YYYYMMDDThhmmss).
                zwaveAlarmTypeList:
                  type: array
                  items:
                    type: object
                    x-name: GetAllNotificationEventSupportResultInterfaceNotificationZwaveAlarmTypeListItem
                    properties:
                      type: {type: integer, description: The alarm/notification type.}
                      code:
                        type: integer
                        description: A code denoting the alarm/notification type. The most common alarm/notification
                          can be found in the table *Common Z-Wave alarm types* in [getNotificationCapabilities](#getnotificationcapabilities).
                      zwaveEventList:
                        type: array
                        items:
                          type: object
                          x-name: GetAllNotificationEventSupportResultInterfaceNotificationZwaveAlarmTypeListItemZwaveEventListItem
                          properties:
                            type:
                              type: string
                              description: An event name denoting the supported event for a specific alarm/notification
                                type.
                            code:
                              type: integer
                              description: A code denoting the supported event for a specific alarm/notification
                                type.
                        description: Lists the events supported by the specified alarm/notification type.
                  description: A list containing the supported Z-Wave alarm/notification types and their corresponding
                    zwaveEventList.

