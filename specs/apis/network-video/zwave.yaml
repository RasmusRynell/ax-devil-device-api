provenance:
  completeness: complete
  open_questions:
  - Common example 1 curl URL is 'http://<servername>http://<servername>/axis-cgi/zwave.cgi' and HTTP tab uses absolute
    URL (doc typos).
  - Requests use apiVersion "<Major>" (e.g. "1") while responses report "<major>.<minor>".
  - General error table ends with '...' (list incomplete). 2107 has HTTP code '4XX, 5XX'.
  - 'Response field casing inconsistent: data.interface.binarySwitch.* vs data.interface.binaryswitch.lastUpdated/targetState.'
  - data.interface.notification.zwaveAlarmTypeList.type documented both as <integer> and <string>.
  - Multilevel sensor event example uses 'lumSensor' but the sensor type table names 'luminSensor'.
  - 'Required/optional for params inferred from ''*Optional*'' markers: params without the marker are marked required=true.'
  - Response schemas are generated from the documented data.* parameter tables; nesting of arrays inferred from
    [<object>] types; full response syntax is preserved in response.notes.
  - Operation code 6, 9-12 are not listed in the Available operations table.
  - 'migration: effect-guessed: write semantics guessed from the method name: set_enabled=write/patch, reset_network=write/replace,
    set_endpoint_info=write/patch, set_s2_grant_keys=write/patch, set_configuration=write/patch, set_binary_switch_state=write/patch,
    set_basic_state=write/patch, set_wake_up_info=write/patch, reset_meter=write/replace, set_indicator_value=write/patch,
    set_notification_state=write/patch, set_central_scene_configuration=write/patch, set_anti_theft_unlock_state=write/patch,
    set_temperature_threshold=write/patch, set_io_function_binary_switch=write/patch, set_io_function_one_shot=write/patch,
    set_io_function_set_reset=write/patch, set_io_function_toggle=write/patch'
  - 'migration: effect-unknown: effect could not be inferred from the method name: abort_operation, refresh_network,
    replace_failed_node, accept_s2, refresh_node, request_firmware_update, request_firmware_backup, request_firmware_activation'
  - 'migration: dropped-keywords: x-codes x4, x-codes-by-generic-class x1, x-enum-descriptions x3'
  migrated_from: v1
  curated: false
