# Migrated from the v1 corpus by codegen/migrate_v1.py; not yet curated.
format: 2
id: zwave
name: Z-Wave API
summary: 'Set up and use the Z-Wave wireless network on Axis devices: network/node management (async operations),
  S2/SmartStart security, and command-class operations...'
section: network-video
family: jsonrpc
status: released
python:
  module: zwave
  class: ZWave
docs:
- https://developer.axis.com/vapix/network-video/z-wave-api/
access: admin
discovery:
- {api_discovery: zwave}

binding:
  path: /axis-cgi/zwave.cgi
  major: 1
  versions: ['1.0']
  negotiation:
    get_supported_versions: {key: apiVersions}
  params_placement: params

errors:
  1100: {description: Internal error (also out-of-memory)., kind: internal}
  1200: {description: Z-Wave is disabled.}
  1201: {description: Open file error.}
  2100: {description: API version not supported., kind: unsupported}
  2101: {description: Invalid JSON., kind: invalid_argument}
  2102: {description: Method not supported., kind: unsupported}
  2103: {description: Required parameter missing., kind: invalid_argument}
  2104: {description: Invalid parameter value specified., kind: invalid_argument}
  2105: {description: Authorization failed., kind: access_denied}
  2106: {description: Authentication failed.}
  2107: {description: 'Transport-level error (HTTP 4XX, 5XX).'}
  2200: {description: Bad interface descriptor.}
  2201: {description: Command Class Version not supported., kind: unsupported}
  2202: {description: Bad endpoint descriptor.}
  2203: {description: Timeout.}
  2204: {description: Operation already in progress.}
  2205: {description: Maximum nodes reached.}

types:
  OperationType:
    type: object
    description: Network operation {code, name}.
    properties:
      code: {type: integer, enum: [1, 2, 3, 4, 5, 7, 8, 13]}
      name:
        type: string
        enum:
        - operationInitialize
        - operationAddNode
        - operationRemoveNode
        - operationReplaceFailedNode
        - operationRemoveFailedNode
        - operationRefreshNetwork
        - operationResetNetwork
        - operationRefreshNode
  OperationStatus:
    type: object
    description: Operation status {status, name}. Status codes are reused per operation group (generic, add node,
      remove node, replace failed node, network refresh).
    properties:
      status: {type: integer}
      name:
        type: string
        enum:
        - operationStatusNone
        - operationStatusError
        - operationStatusNoNet
        - operationStatusAborted
        - addNodeStatusProtocolDone
        - addNodeStatusGetNodeInfo
        - addNodeStatusProtocolStart
        - addNodeStatusRequestedKeyReady
        - addNodeStatusDSKReady
        - addNodeStatusOnBehalfRequestedKeyReady
        - addNodeStatusOnBehalfDSKReady
        - removeNodeStatusLearnReady
        - removeNodeStatusFound
        - removeNodeStatusRemoving
        - replaceNodeStatusReady
        - replaceNodeStatusProtocolDone
        - replaceNodeStatusSecureInclusion
        - replaceNodeStatusGetNodeInfo
        - networkRefreshStatusTopology
        - networkRefreshStatusNeighbor
        - networkRefreshStatusGetNodeInfo
  SensorType:
    type: string
    enum:
    - gpSensor
    - luminSensor
    - powerSensor
    - humidSensor
    - veloSensor
    - directionSensor
    - atmSensor
    - baroSensor
    - solarSensor
    - dewSensor
    - rainSensor
    - tideSensor
    - weightSensor
    - voltageSensor
    - currentSensor
    - co2Sensor
    - airSensor
    - tankSensor
    - distSensor
    - angleSensor
    - rotationSensor
    - waterTempSensor
    - soilTempSensor
    - seismicIntSensor
    - seismicMagSensor
    - uvSensor
    - elecResistivitySensor
    - elecCondSensor
    - loudnessSensor
    - moistSensor
    - frequencySensor
    - timeSensor
    - targetTempSensor
    - pm2_5Sensor
    - ch2oSensor
    - radonSensor
    - ch4Sensor
    - vocSensor
    - coLvlSensor
    - soilHumidSensor
    - soilReactivitySensor
    - soilSalinitySensor
    - heartRateSensor
    - bloodPressureSensor
    - muscleMassSensor
    - fatMassSensor
    - boneMassSensor
    - tbwSensor
    - bmrSensor
    - bmiSensor
    - xAccSensor
    - yAccSensor
    - zAccSensor
    - smokeDensitySensor
    - waterFlowSensor
    - waterPressureSensor
    - rfSignalSensor
    - pm10Sensor
    - respiratoryRateSensor
    - relativeModSensor
    - boilerTempSensor
    - dhwTempSensor
    - outsideTempSensor
    - exhaustTempSensor
    - chlorineLvlSensor
    - waterAcidSensor
    - waterOxiRedSensor
    - lfhfRatioSensor
    - motionSensor
    - appliedForceSensor
    - returnAirTempSensor
    - supplyAirTempSensor
    - condenserCoilTempSensor
    - evaporatorCoilTempSensor
    - liquidLineTemp
    - dischargeLineTempSensor
    - suctionPressureSensor
    - dischargePressureSensor
    - defrostTempSensor
    - ozoneSensor
    - so2Sensor
    - no2Sensor
    - nh3Sensor
    - pbSensor
    - pm1Sensor
    - personEnteringCounter
    - personExitingCounter
    - unknown
  BasicDeviceClass: {type: string}
  GenericDeviceClass: {type: string}
  RoleType: {type: string}
  NodeType: {type: string}
  SpecificDeviceClass: {type: string, description: Codes are scoped by Generic Device Class.}
  CommandClassShortName:
    type: string
    enum:
    - antiTheftUnlock
    - association
    - basic
    - battery
    - binarySwitch
    - centralScene
    - configuration
    - firmwareUpdate
    - indicator
    - meter
    - multilevelSensor
    - notification
    - wakeUp

operations:
  set_enabled:
    summary: This method should be used when you want to enable or disable the Z-Wave operation on your device.
    effect: write
    write: patch
    binding: {method: setEnabled}
    params:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: The state of the Z-Wave operation. Can be either *enabled* or *disabled*.
    examples:
    - title: Set up a Z-Wave network
      request:
        params: {enabled: true}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/z-wave-api/#set-up-a-z-wave-network
  get_enabled:
    summary: This method should be used when you want to check the state of the Z-Wave functionality.
    effect: read
    binding: {method: getEnabled}
    result:
      type: object
      properties:
        enabled:
          type: boolean
          description: Indicates if Z-Wave is enabled on your device. Can be either *true* or *false*.
    examples:
    - title: Set up a Z-Wave network
      request:
        params: {}
      response:
        data: {enabled: true}
      source: https://developer.axis.com/vapix/network-video/z-wave-api/#set-up-a-z-wave-network
  add_node:
    summary: This method should be used when you want to add a new Z-Wave device to the network.
    effect: write
    write: create
    binding: {method: addNode}
    params:
      type: object
      properties:
        deviceSpecificKey:
          type: string
          description: 'Needs to be in the following format and only consist of numbers between 0–9: xxxxx-xxxxx-xxxxx-xxxxx-xxxxx-xxxxx-xxxxx-xxxxx.'
    examples:
    - title: Set up a Z-Wave network
      request:
        params: {}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/z-wave-api/#set-up-a-z-wave-network
  remove_node:
    summary: This method should be used when you want to remove a Z-Wave device from the network.
    effect: write
    write: delete
    binding: {method: removeNode}
    examples:
    - title: Remove a node
      request:
        params: {}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/z-wave-api/#remove-a-node
    - title: Abort operation
      request:
        params: {}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/z-wave-api/#abort-operation
  get_operation:
    summary: This method should be used when you want to retrieve an ongoing Z-Wave network operation.
    effect: read
    binding: {method: getOperation}
    result:
      type: object
      properties:
        net:
          type: object
          x-name: GetOperationResultNet
          properties:
            operation:
              type: object
              x-name: GetOperationResultNetOperation
              properties:
                code: {type: integer, description: The current network operation.}
                name: {type: string, description: The nice name for the current operation.}
            operationStatus:
              type: object
              x-name: GetOperationResultNetOperationStatus
              properties:
                status: {type: integer, description: The progress status of an ongoing network operation.}
                name:
                  type: string
                  description: The nice name for the progress status of an ongoing network operation.
            prevOperation:
              type: object
              x-name: GetOperationResultNetPrevOperation
              properties:
                code: {type: integer, description: The previous network operation.}
                name: {type: string, description: The nice name for the previous network operation.}
    examples:
    - title: Set up a Z-Wave network
      request:
        params: {}
      response:
        data:
          net:
            operation: {code: 0, name: operationNone}
            operationStatus: {status: 0, name: operationStatusNone}
            prevOperation: {code: 2, name: operationAddNode}
      source: https://developer.axis.com/vapix/network-video/z-wave-api/#set-up-a-z-wave-network
    - title: Replace a failing node
      request:
        params: {}
      response:
        data:
          net:
            operation: {code: 0, name: operationNone}
            operationStatus: {status: 0, name: operationStatusNone}
            prevOperation: {code: 2, name: operationAddNode}
      source: https://developer.axis.com/vapix/network-video/z-wave-api/#replace-a-failing-node
  abort_operation:
    summary: This method should be used when you want to abort an ongoing network operation.
    effect: unknown
    binding: {method: abortOperation}
    examples:
    - title: Abort operation
      request:
        params: {}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/z-wave-api/#abort-operation
  reset_network:
    summary: This method should be used when you want to reset the Z-Wave network to the factory default settings.
    effect: write
    write: replace
    binding: {method: resetNetwork}
    examples:
    - title: Reset network
      request:
        params: {}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/z-wave-api/#reset-network
  refresh_network:
    summary: This method should be used when you want to refresh the Z-Wave network and its network topology, routing
      table and internal network data structures.
    effect: unknown
    binding: {method: refreshNetwork}
    examples:
    - title: Replace a failing node
      request:
        params: {}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/z-wave-api/#replace-a-failing-node
  get_node_list:
    summary: This method should be used when you want to retrieve either all of, or a subset of available nodes.
    effect: read
    binding: {method: getNodeList}
    params:
      type: object
      properties:
        nodeIDs:
          type: array
          items: {type: integer}
          description: Retrieves a subset of nodes by specifying a list of node IDs.
    result:
      type: object
      properties:
        net:
          type: object
          x-name: GetNodeListResultNet
          properties:
            node:
              type: array
              items:
                type: object
                x-name: GetNodeListResultNetNodeItem
                properties:
                  nodeDescriptor: {type: integer, description: The node descriptor.}
                  nodeID:
                    type: integer
                    description: The node ID. Can be re-used, but must have a value less than 232 in accordance
                      with current Z-Wave standards.
                  nodeProperty:
                    type: object
                    x-name: GetNodeListResultNetNodeItemNodeProperty
                    properties:
                      securityCapabilities:
                        type: array
                        items: {type: string}
                        description: Security capabilities included in the node. Available options are *S0* and
                          *S2*.
                      includedSecurely: {type: boolean, description: '*True* if securely included, otherwise *False*.'}
                      supportIdentification:
                        type: boolean
                        description: '*True* if the node is able to identify itself, e.g. a blinking LED.'
                  vendorID: {type: integer, description: The vendor ID of the device (manufacturer specific).}
                  vendorProductID: {type: integer, description: The product ID (manufacturer specific).}
                  deviceCategory:
                    type: object
                    x-name: GetNodeListResultNetNodeItemDeviceCategory
                    description: The device category. A complete list of the different categories and codes can
                      be found in the *Device categories* table below.
                    properties:
                      name: {type: string, description: The name of the device category.}
                      id: {type: integer, description: The device category ID.}
                  nodeAliveState:
                    type: string
                    description: The node alive state. Valid values are `alive`, `down` or `sleeping`, but `unavailable`
                      might also show up during the startup.
                  isSecure: {type: boolean, description: '*True* if the node has secure interfaces. *False* otherwise.'}
                  secureInclusionFailed:
                    type: integer
                    description: '*True* if the secure inclusion for the node failed. *False* otherwise.'
                  isFLiRSCapable:
                    type: boolean
                    description: '*True* if the node is a Frequency Listening Routing End Node (FLiRS) device, which
                      means that it is a battery powered device that wakes up with low latency whenever it is called'
                  isSleepCapable:
                    type: boolean
                    description: '*True* if the node is capable of sleep, which means being non-listening and supporting
                      the Wake up command class.'
                  s2GrantKeys:
                    type: array
                    items: {type: string}
                    description: Describes the keys used for secure inclusion. The different keys are defined in
                      the table *Requested keys of the joining device* below. Please note that the node was included
                      non-securely if this parameter is empty.
              description: Lists the nodes on the Z-Wave network.
    examples:
    - title: Set up a Z-Wave network
      request:
        params: {}
      response:
        data:
          net:
            node:
            - nodeDescriptor: 1
              nodeID: 6
              nodeProperty: {securityCapabilities: [S0, S2], includedSecurely: true, supportIdentification: false}
              vendorID: 868
              vendorProductID: 1
              vendorProductType: 3
              deviceCategory: {name: onOffSwitch, code: 2}
              nodeAliveState: sleeping
              isSecure: true
              secureInclusionFailed: false
              isFLiRSCapable: false
              isSleepCapable: true
              s2GrantKeys: [S2Key0, S2Key1, S0LegacyKey]
      source: https://developer.axis.com/vapix/network-video/z-wave-api/#set-up-a-z-wave-network
    - title: Retrieve device information
      request:
        params: {}
      response:
        data:
          net:
            node:
            - nodeDescriptor: 1
              nodeID: 6
              nodeProperty: {securityCapabilities: [S0, S2], includedSecurely: true, supportIdentification: false}
              vendorID: 868
              vendorProductID: 1
              vendorProductType: 3
              deviceCategory: {name: onOffSwitch, code: 2}
              nodeAliveState: sleeping
              isSecure: true
              secureInclusionFailed: false
              isFLiRSCapable: false
              isSleepCapable: true
              s2GrantKeys: [S2Key0, S2Key1, S0LegacyKey]
      source: https://developer.axis.com/vapix/network-video/z-wave-api/#retrieve-device-information
    - title: Retrieve the last known device information
      request:
        params: {}
      response:
        data:
          net:
            node:
            - nodeDescriptor: 1
              nodeID: 6
              nodeProperty: {securityCapabilities: [S0, S2], includedSecurely: true, supportIdentification: false}
              vendorID: 868
              vendorProductID: 1
              vendorProductType: 3
              deviceCategory: {name: onOffSwitch, code: 2}
              nodeAliveState: sleeping
              isSecure: true
              secureInclusionFailed: false
              isFLiRSCapable: false
              isSleepCapable: true
              s2GrantKeys: [S2Key0, S2Key1, S0LegacyKey]
      source: https://developer.axis.com/vapix/network-video/z-wave-api/#retrieve-the-last-known-device-information
    - title: Replace a failing node
      request:
        params: {}
      response:
        data:
          net:
            node:
            - nodeDescriptor: 1
              nodeID: 6
              nodeProperty: {securityCapabilities: [S0, S2], includedSecurely: true, supportIdentification: false}
              vendorID: 868
              vendorProductID: 1
              vendorProductType: 3
              deviceCategory: {name: onOffSwitch, code: 2}
              nodeAliveState: sleeping
              isSecure: true
              secureInclusionFailed: false
              isFLiRSCapable: false
              isSleepCapable: true
              s2GrantKeys: [S2Key0, S2Key1, S0LegacyKey]
      source: https://developer.axis.com/vapix/network-video/z-wave-api/#replace-a-failing-node
  get_endpoint_list:
    summary: This method should be used when you want to retrieve the node endpoints.
    effect: read
    binding: {method: getEndpointList}
    params:
      type: object
      required: [nodeDescriptor]
      properties:
        nodeDescriptor: {type: integer, description: The node descriptor listing the endpoints.}
    result:
      type: object
      properties:
        node:
          type: object
          x-name: GetEndpointListResultNode
          properties:
            nodeDescriptor: {type: integer, description: The node descriptor listing the endpoints.}
            endpoint:
              type: array
              items:
                type: object
                x-name: GetEndpointListResultNodeEndpointItem
                properties:
                  endpointDescriptor: {type: integer, description: 'The endpoint descriptor, that allows access
                      to the endpoint.'}
                  endpointID: {type: integer, description: The endpoint ID.}
                  genericDeviceClass:
                    type: object
                    x-name: GetEndpointListResultNodeEndpointItemGenericDeviceClass
                    description: The Generic Device Class. See the *Generic Device Class identifiers* table in [Role
                      Type](#role-type) for a complete list of available classes and the section [Device Classes](#device-classes)
                      for an explanation.
                    properties:
                      name: {type: string, description: The name of the Generic Device Class.}
                      code: {type: integer, description: The code of the Generic Device Class.}
                  specificDeviceClass:
                    type: object
                    x-name: GetEndpointListResultNodeEndpointItemSpecificDeviceClass
                    description: The Specific Device Class. See the *Specific Device Class identifiers* table in
                      [Role Type](#role-type) for a complete list of available classes and the section [Device Classes](#device-classes)
                      for an explanation.
                    properties:
                      name: {type: string, description: The name of the Specific Device Class.}
                      code: {type: integer, description: The code of the Specific Device Class.}
                  endpointName: {type: string, description: The UTF-8 encoded endpoint name.}
                  endpointLocation: {type: string, description: The UTF-8 encoded endpoint location.}
                  zwavePlusVersion:
                    type: integer
                    description: The version field of the *Z-Wave+ Info Report Command*, a sub-category of *Z-Wave+
                      Info command class*. This value will be 0 if the node doesn’t support Z-Wave+.
                  roleType:
                    type: object
                    x-name: GetEndpointListResultNodeEndpointItemRoleType
                    description: The role type field of the *Z-Wave+ Info Report Command*, a sub-category of *Z-Wave+
                      Info command class* and only applicable if the Z-Wave+ version is higher than 0.
                    properties:
                      name: {type: string, description: The name of the role type.}
                      code: {type: integer, description: The code of the role type.}
                  nodeType:
                    type: object
                    x-name: GetEndpointListResultNodeEndpointItemNodeType
                    description: The node type field of the *Z-Wave+ Info Report Command*, a sub-category of the
                      *Z-Wave+ Info command class* and only applicable if the Z-Wave+ version is higher than 0.
                    properties:
                      name: {type: string, description: The node type name.}
                      code: {type: integer, description: The node type code.}
                  installerIcon: {type: integer, description: The Z-Wave+ installer icon type.}
                  userIcon: {type: integer, description: The Z-Wave+ user icon type.}
                  aggregatedEndpointList:
                    type: array
                    items: {type: integer}
                    description: ID container for the aggregated members of the endpoint that allows a Multi Channel
                      device to implement functionality related to multiple endpoints.
              description: Lists the endpoints belonging to the node.
    examples:
    - title: Set up a Z-Wave network
      request:
        params: {nodeDescriptor: 1}
      response:
        data:
          node:
            nodeDescriptor: 1
            endpoint:
            - endpointDescriptor: 1
              endpointID: 2
              genericDeviceClass: {name: switchBinary, code: 16}
              specificDeviceClass: {name: powerSwitch, code: 1}
              endpointName: Mini plug
              endpointLocation: Office
              zwavePlusVersion: 1
              roleType: {name: alwaysOnSlave, code: 5}
              nodeType: {name: zwavePlusNode, code: 0}
              installerIcon: 1792
              userIcon: 1792
              aggregatedEndpointList: []
      source: https://developer.axis.com/vapix/network-video/z-wave-api/#set-up-a-z-wave-network
    - title: Retrieve device information
      request:
        params: {nodeDescriptor: 1}
      response:
        data:
          node:
            nodeDescriptor: 1
            endpoint:
            - endpointDescriptor: 1
              endpointID: 2
              genericDeviceClass: {name: switchBinary, code: 16}
              specificDeviceClass: {name: powerSwitch, code: 1}
              endpointName: Mini plug
              endpointLocation: Office
              zwavePlusVersion: 1
              roleType: {name: alwaysOnSlave, code: 5}
              nodeType: {name: zwavePlusNode, code: 0}
              installerIcon: 1792
              userIcon: 1792
              aggregatedEndpointList: []
      source: https://developer.axis.com/vapix/network-video/z-wave-api/#retrieve-device-information
    - title: Retrieve the last known device information
      request:
        params: {nodeDescriptor: 1}
      response:
        data:
          node:
            nodeDescriptor: 1
            endpoint:
            - endpointDescriptor: 1
              endpointID: 2
              genericDeviceClass: {name: switchBinary, code: 16}
              specificDeviceClass: {name: powerSwitch, code: 1}
              endpointName: Mini plug
              endpointLocation: Office
              zwavePlusVersion: 1
              roleType: {name: alwaysOnSlave, code: 5}
              nodeType: {name: zwavePlusNode, code: 0}
              installerIcon: 1792
              userIcon: 1792
              aggregatedEndpointList: []
      source: https://developer.axis.com/vapix/network-video/z-wave-api/#retrieve-the-last-known-device-information
  get_endpoint_interface_list:
    summary: This method should be used when you want to list the various endpoint interfaces.
    effect: read
    binding: {method: getEndpointInterfaceList}
    params:
      type: object
      required: [endpointDescriptor]
      properties:
        endpointDescriptor: {type: integer, description: The endpoint descriptor for the interfaces list.}
    result:
      type: object
      properties:
        endpoint:
          type: object
          x-name: GetEndpointInterfaceListResultEndpoint
          properties:
            endpointDescriptor: {type: integer, description: The endpoint descriptor for the interfaces list.}
            interface:
              type: array
              items:
                type: object
                x-name: GetEndpointInterfaceListResultEndpointInterfaceItem
                properties:
                  interfaceDescriptor: {type: integer, description: The descriptor used to access the interface.}
                  name:
                    type: string
                    description: The interface name, based on the corresponding Z-Wave Command Class name. See [Command
                      Class](#command-class) for a complete list of available Command Classes.
                  simulatedVersion:
                    type: integer
                    description: The Command Class version, upgradable by the device database and equal to the real
                      version below if not upgraded.
                  realVersion:
                    type: integer
                    description: The Command Class version supported by your device. Will be `0` for a simulated
                      interface.
                  accessSupport:
                    type: object
                    x-name: GetEndpointInterfaceListResultEndpointInterfaceItemAccessSupport
                    description: The interface accessibility support.
                    properties:
                      secure: {type: boolean, description: '*true* if the interface can be securely accessed.'}
                      unsecure: {type: boolean, description: '*true* if the interface can be accessed insecurely.'}
              description: An interface list belonging to the endpoint.
    examples:
    - title: Retrieve device information
      request:
        params: {endpointDescriptor: 1}
      response:
        data:
          endpoint:
            endpointDescriptor: 1
            interface:
            - interfaceDescriptor: 8388870
              name: battery
              simulatedVersion: 1
              realVersion: 1
              accessSupport: {secure: false, unsecure: true}
      source: https://developer.axis.com/vapix/network-video/z-wave-api/#retrieve-device-information
    - title: Retrieve the last known device information
      request:
        params: {endpointDescriptor: 1}
      response:
        data:
          endpoint:
            endpointDescriptor: 1
            interface:
            - interfaceDescriptor: 8388870
              name: battery
              simulatedVersion: 1
              realVersion: 1
              accessSupport: {secure: false, unsecure: true}
      source: https://developer.axis.com/vapix/network-video/z-wave-api/#retrieve-the-last-known-device-information
  get_summary_list:
    summary: This method should be used when you want to retrieve a smaller selection of information from all nodes
      and endpoints on the Z-Wave network that is otherwise...
    effect: read
    binding: {method: getSummaryList}
    result:
      type: object
      properties:
        net:
          type: object
          x-name: GetSummaryListResultNet
          properties:
            node:
              type: array
              items:
                type: object
                x-name: GetSummaryListResultNetNodeItem
                properties:
                  descriptor: {type: integer, description: The node descriptor.}
                  id:
                    type: integer
                    description: The node ID. Can be re-used, but must have a value less than 232 in accordance
                      with current Z-Wave standards.
                  deviceCategory:
                    type: string
                    description: The device category. A complete list of the different categories and codes can
                      be found in the *Device categories* table in [getNodeList](#getnodelist).
                  aliveState:
                    type: string
                    description: The node alive state. Valid values are `alive`, `down` or `sleeping`, but `unavailable`
                      might also show up during the startup.
                  securityWarning:
                    type: string
                    description: An error message. Available messages can be found in the table below.
                  endpoint:
                    type: array
                    items:
                      type: object
