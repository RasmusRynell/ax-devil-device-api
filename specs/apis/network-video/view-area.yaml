# Migrated from the v1 corpus by codegen/migrate_v1.py; not yet curated.
format: 2
id: view-area
name: View Area API
summary: List view areas (virtual channels covering subsections of the full camera view) and set/reset their geometry.
section: network-video
family: jsonrpc
status: released
python:
  module: view_area
  class: ViewArea
docs:
- https://developer.axis.com/vapix/network-video/view-area-api/
access: viewer
discovery:
- {api_discovery: view-area}

binding:
  path: /axis-cgi/viewarea/configure.cgi
  major: 1
  versions: ['1.0']
  negotiation:
    get_supported_versions: {key: apiVersions}
  params_placement: params

errors:
  101: {description: The requested API version is not supported, kind: unsupported}
  102: {description: Method unsupported, kind: unsupported}
  103: {description: Internal error, kind: internal}

types:
  RectangularGeometry:
    type: object
    description: Rectangle related to the canvas. Only listed if the geometry can be configured.
    properties:
      horizontalOffset:
        type: integer
        minimum: 0
        description: Offset of the rectangle's left edge relative to the left edge of the canvas.
      horizontalSize: {type: integer, minimum: 0, description: Width of the rectangle.}
      verticalOffset:
        type: integer
        minimum: 0
        description: Offset of the top edge of the rectangle relative to the top edge of the canvas.
      verticalSize: {type: integer, minimum: 0, description: Height of the rectangle.}
  Size:
    type: object
    properties:
      horizontal: {type: integer, minimum: 0}
      vertical: {type: integer, minimum: 0}
  Grid:
    type: object
    description: Grid that a geometry is applied to on the canvas due to device limitations.
    properties:
      horizontalOffset:
        type: integer
        minimum: 0
        description: Offset of the first vertical grid line relative to the left edge of the canvas.
      horizontalSize: {type: integer, minimum: 0, description: Distance between vertical grid lines.}
      verticalOffset:
        type: integer
        minimum: 0
        description: Offset of the first horizontal grid line relative to the top edge of the canvas.
      verticalSize: {type: integer, minimum: 0, description: Distance between horizontal grid lines.}
  ViewArea:
    type: object
    properties:
      id: {type: integer, minimum: 0, description: Identifies the view area.}
      source:
        type: integer
        minimum: 0
        description: Identifies the image source that created the view areas.
      camera:
        type: integer
        minimum: 0
        description: Identifies the view area used by streaming, PTZ and other APIs.
      configurable:
        type: boolean
        description: Defines if a view can be configured. Some view areas can not be configured.
      rectangularGeometry: {$ref: '#/types/RectangularGeometry'}
      canvasSize:
        $ref: '#/types/Size'
        description: Size of the overview image the geometry is defined on. Only listed if configurable.
      minSize:
        $ref: '#/types/Size'
        description: Minimum size a view area can have. Only listed if configurable.
      maxSize:
        $ref: '#/types/Size'
        description: Maximum size a view area can have. Only listed if configurable.
      grid: {$ref: '#/types/Grid', description: Only listed if configurable.}
  ViewAreaListData:
    type: object
    properties:
      viewAreas:
        type: array
        items: {$ref: '#/types/ViewArea'}

operations:
  list:
    summary: Retrieve a complete listing of available view areas and how they have been configured.
    effect: read
    binding: {method: list, path: /axis-cgi/viewarea/info.cgi}
    result: {$ref: '#/types/ViewAreaListData'}
    examples:
    - title: List view areas
      request:
        params: {}
      response:
        data:
          viewAreas:
          - {id: 1000001, source: 0, camera: 1, configurable: false}
          - id: 1001002
            source: 1
            camera: 2
            configurable: true
            rectangularGeometry: {horizontalOffset: 128, horizontalSize: 480, verticalOffset: 64, verticalSize: 270}
            canvasSize: {horizontal: 1920, vertical: 1080}
            minSize: {horizontal: 256, vertical: 144}
            maxSize: {horizontal: 1920, vertical: 1080}
            grid: {horizontalOffset: 1, horizontalSize: 2, verticalOffset: 0, verticalSize: 2}
      source: https://developer.axis.com/vapix/network-video/view-area-api/#list-view-areas
  set_geometry:
    summary: Set the geometry of a view area.
    description: The geometry is not always aligned with the canvas grid and the video aspect ratio might make it
      impossible to align on all sides; the geometry will align to the best possible fit. It is recommended to update
      the local view area geometry to what is provided by the response, as it may differ from the request.
    access: admin
    effect: write
    write: patch
    binding: {method: setGeometry}
    params:
      type: object
      properties:
        viewArea:
          type: object
          x-name: SetGeometryRequestViewArea
          required: [id, rectangularGeometry]
          properties:
            id: {type: integer, minimum: 0, description: Identifies the area that should be configured.}
            rectangularGeometry:
              $ref: '#/types/RectangularGeometry'
              description: Geometry for the view area as a rectangle related to the canvas.
    result: {$ref: '#/types/ViewAreaListData'}
    errors:
      200: {description: Invalid view area ID, kind: invalid_argument}
      201: {description: View area is not configurable}
      202: {description: Invalid geometry, kind: invalid_argument}
    examples:
    - title: set_geometry
      request:
        params:
          viewArea:
            id: 1000002
            rectangularGeometry: {horizontalOffset: 0, horizontalSize: 960, verticalOffset: 0, verticalSize: 540}
      response:
        error: {code: 201, message: View area is not configurable}
      source: https://developer.axis.com/vapix/network-video/view-area-api/#set-the-geometry-of-a-view-area
  reset_geometry:
    summary: Restore the geometry of a view area back to its default values.
    access: admin
    effect: write
    write: replace
    binding: {method: resetGeometry}
    params:
      type: object
      properties:
        viewArea:
          type: object
          x-name: ResetGeometryRequestViewArea
          required: [id]
          properties:
            id: {type: integer, minimum: 0, description: Identifies the area that should be configured.}
    result: {$ref: '#/types/ViewAreaListData'}
    errors:
      200: {description: Invalid view area ID, kind: invalid_argument}
      201: {description: View area is not configurable}
    examples:
    - title: Reset geometry (common example; note key 'viewAreas' differs from spec 'viewArea')
      request:
        params:
          viewAreas: {id: 1000001}
      response:
        error: {code: 201, message: View area is not configurable}
      source: https://developer.axis.com/vapix/network-video/view-area-api/#reset-the-geometry-of-a-view-area

