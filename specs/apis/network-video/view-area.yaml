provenance:
  completeness: complete
  open_questions:
  - resetGeometry common example uses params.viewAreas while the spec section uses params.viewArea.
  - getSupportedVersions example returns apiVersions ["1.3", "2.1"] and error code 8000, while all other examples
    use 1.0 and the general error table lists only 101-103.
  - setGeometry description says the response shows the requested (not aligned) geometry, while the common example
    says to update local geometry from the response since it may differ - contradictory.
  - 'Response body syntax blocks are missing a comma after rectangularGeometry; configure.cgi getSupportedVersions
    example has a missing quote ("method": getSupportedVersions").'
  - AXIS OS minimum version not stated.
  - 'migration: negotiation: getSupportedVersions exists on several paths; one negotiation used'
