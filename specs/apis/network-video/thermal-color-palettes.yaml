# Migrated from the v1 corpus by codegen/migrate_v1.py; not yet curated.
format: 2
id: thermal-color-palettes
name: Thermal imaging color palettes
summary: 'Select pseudocolor palettes for thermal cameras: per-stream (palette= URL argument), global (Image.I0.Appearance.Palette)
  and isotherm palettes.'
section: network-video
family: cgi
status: released
python:
  module: thermal_color_palettes
  class: ThermalColorPalettes
docs:
- https://developer.axis.com/vapix/network-video/thermal-imaging/
access: viewer
discovery:
- param: {name: Properties.Image.Palette.Palette, value: 'yes'}
- param: {name: Properties.Image.Palette.StreamPalette, value: 'yes'}
- param: {name: Properties.Image.Palette.StreamPalette, value: 'no'}

binding: {path: /axis-cgi/param.cgi}

operations:
  list_palettes:
    summary: List available palettes (enum entries of Image.I#.Appearance.Palette).
    effect: read
    binding:
      method: GET
      query: {action: listdefinitions, listformat: xmlschema, group: Image.*.Appearance.Palette}
      reply: xml
    result: {x-xml: true}
    examples:
    - title: Global + isotherm palettes (AXIS Q2901-E)
      request:
        query: {}
      response:
        status: 200
        text: |-
          <parameterDefinitions xmlns="http://www.axis.com/ParameterDefinitionsSchema" ... version="1.0">
            <model>AXIS Q2901-E</model>
            <firmwareVersion>5.55.4</firmwareVersion>
            <group name="root"><group name="Image"><group name="I0"><group name="Appearance">
              <parameter name="Palette" value="Red-hot" securityLevel="7714" niceName="Palette">
                <type><enum>
                  <entry value="White-hot"/><entry value="Black-hot"/><entry value="Planck"/><entry value="Axis"/><entry value="Rainbow"/><entry value="Red-hot"/><entry value="Nightvision"/>
                  <entry value="Iso-Fire-WH"/><entry value="Iso-Fire-BH"/><entry value="Iso-Planck-WH"/><entry value="Iso-Axis-WH"/><entry value="Iso-Midrange-WH"/><entry value="Iso-Midrange-BH"/><entry value="Iso-Rainbow-WH"/>
                </enum></type>
              </parameter>
            </group></group></group></group>
          </parameterDefinitions>
      source: https://developer.axis.com/vapix/network-video/thermal-imaging/#using-global-palettes
  set_global_palette:
    summary: Change the global palette (also the default for streams without palette argument).
    effect: write
    write: patch
    binding:
      method: GET
      query: {action: update}
      reply: text
    params:
      type: object
      required: [Image.I0.Appearance.Palette]
      properties:
        Image.I0.Appearance.Palette: {type: string, description: 'Palette name from list_palettes, e.g. Axis, Iso-Axis-WH.'}

sources:
- url: https://developer.axis.com/vapix/network-video/thermal-imaging/
