    summary: Subscribe to the event stream over RTSP (same syntax as video/audio streams plus event arguments).
    description: Only subscribe to events of interest; subscriptions start internal services and may cause performance
      problems. On connect, all stateful events send a notification with their current state.
    effect: read
    binding:
      rtsp: {}
    params:
      type: object
      properties:
        event:
          type: string
          enum: ['on', 'off']
          default: 'off'
          description: Whether event metadata should be available in the stream.
        eventtopic:
          type: string
          default: ''
          description: Comma-separated list of event topic filters (ONVIF ConcreteSet dialect, using filter namespaces
            onvif/axis instead of tns1/tnsaxis).
        eventcontent:
          type: string
          default: ''
          description: Event content filter (ONVIF ItemFilter dialect), e.g. boolean(//SimpleItem[@Name="port" and
            @Value="1"]). Spaces and special characters (incl. quotes) should be percent-encoded.
        video: {type: integer, enum: [0, 1], default: 1, description: '0 = no video, 1 = video.'}
        audio: {type: integer, enum: [0, 1], default: 1, description: '0 = no audio, 1 = audio.'}

