  retrieved_at: '2026-10-11'

provenance:
  completeness: complete
  open_questions:
  - Which methods are accepted on which CGI (admin/operator/viewer.cgi) is inferred from per-method user levels.
  - Error code 1101 means "Invalid profile ID", "Unsupported rotation value" and "Invalid object ID" in different
    methods.
  - setViewportConfig description says values "between 0 and 180" but only 0 and 180 are supported; listed as Viewer
    level for a set method.
  - Version history lists params (maxObjectSpeed, minObjectSizeDegrees, svgFrameColours) not documented elsewhere.
  - The docs show response apiVersion 1.8 but the version history only lists 1.0; binding.versions may need 1.8.
  - addProfile request syntax shows empty params; fields come from the parameter table.
  - SetTemporaryZone event timeout range 3..120 vs setTempZone 5..120 and action 5..120.
  - Error codes 1201/1202 (color IDs) reference color combinations not otherwise documented.
  - The docs do not say whether radarProfiles items in setRadarAutotrackingSettings add or update profiles.
  - Events and actions are delivered via the VAPIX event service (spec id not linked).
  migrated_from: v1
  curated: true
