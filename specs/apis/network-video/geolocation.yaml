# Migrated from the v1 corpus by codegen/migrate_v1.py; not yet curated.
format: 2
id: geolocation
name: Geolocation API
summary: Set and get the geographical position (latitude, longitude, heading, free text) of a device; orientation
  API mentioned.
section: network-video
family: cgi
status: released
python:
  module: geolocation
  class: Geolocation
docs:
- https://developer.axis.com/vapix/network-video/geolocation-api/
access: admin
discovery:
- param: {name: Properties.API.HTTP.Version, value: '3'}
- param: {name: Properties.Geolocation.Geolocation, value: 'yes'}
- param: {name: Properties.Geolocation.Version, value: '0.01'}
- param: {name: Properties.Geoorientation.Geoorientation, value: 'yes'}
- param: {name: Properties.Geoorientation.Version, value: '0.01'}
requires:
  firmware: '6.25'

binding: {path: /axis-cgi/geolocation/get.cgi}

types:
  Coordinate: {type: string, description: ISO-6709 Annex H coordinate.}
  GetPositionResult:
    type: object
    description: PositionResponse (SchemaVersion=1.0) / Success / GetSuccess
    properties:
      Location:
        type: object
        x-name: GetPositionResultLocation
        properties:
          Lat:
            $ref: '#/types/Coordinate'
            x-xml: {child: Lat}
          Lng:
            $ref: '#/types/Coordinate'
            x-xml: {child: Lng}
          Heading:
            type: integer
            minimum: 0
            maximum: 360
            x-xml: {child: Heading}
      Text:
        type: string
        x-xml: {child: Text}
      ValidPosition:
        type: boolean
        x-xml: {child: ValidPosition}
      ValidHeading:
        type: boolean
        x-xml: {child: ValidHeading}
    x-xml: {root: Success/GetSuccess}

operations:
  get_position:
    summary: Get position information (latitude, longitude, heading, text, validity flags).
    effect: read
    binding: {method: GET, reply: xml}
    result: {$ref: '#/types/GetPositionResult'}
    examples:
    - title: Get complete position data
      request:
        query: {}
      response:
        status: 200
        text: |-
          <PositionResponse SchemaVersion="1.0">
              <Success>
                  <GetSuccess>
                      <Location>
                          <Lat>51.0</Lat>
                          <Lng>-0.1</Lng>
                          <Heading>30</Heading>
                      </Location>
                      <Text>Free text</Text>
                      <ValidPosition>true</ValidPosition>
                      <ValidHeading>false</ValidHeading>
                  </GetSuccess>
              </Success>
          </PositionResponse>
      source: https://developer.axis.com/vapix/network-video/geolocation-api/#get-complete-position-data
  set_position:
    summary: Set new position information (some or all fields).
    effect: write
    write: patch
    binding:
      path: /axis-cgi/geolocation/set.cgi
      method: GET
      reply:
        xml: {error_elements: [Error, GeneralError, SetError]}
    params:
      type: object
      properties:
        lat:
          $ref: '#/types/Coordinate'
          description: New value for latitude (DD, DDMM or DDMMSS, WGS-84).
        lng: {$ref: '#/types/Coordinate', description: New value for longitude.}
        heading:
          type: integer
          minimum: 0
          maximum: 360
          description: New value for heading. Direction of the device in degrees; integers 0–360, 0 = North (e.g.
            90 = East, 270 = West). (unit=degrees)
        text: {type: string, description: 'New value for free text (location tag, e.g. "floor 2").'}
    errors:
      1: {description: Invalid parameter, kind: invalid_argument}
      2: {description: Invalid value, kind: invalid_argument}
      3: {description: Internal Error, kind: internal}
    examples:
    - title: Set position using DD units
      request:
        query: {lat: '51.1234', lng: '013.1234', heading: '30', text: '"freetext"'}
      response:
        status: 200
        text: |-
          <PositionResponse SchemaVersion="1.0">
              <Success>
                  <GeneralSuccess />
              </Success>
          </PositionResponse>
      source: https://developer.axis.com/vapix/network-video/geolocation-api/#set-position
    - title: Set position using DDMM units
      request:
        query: {lat: '5112.3456', lng: '01312.3456', heading: '30', text: '"freetext"'}
      response:
        status: 200
        text: |-
          <PositionResponse SchemaVersion="1.0">
              <Success>
                  <GeneralSuccess />
              </Success>
          </PositionResponse>
      source: https://developer.axis.com/vapix/network-video/geolocation-api/#set-position
    - title: Set position using DDMMSS units
      request:
        query: {lat: '511234.5678', lng: '0131234.5678', heading: '30', text: '"free'}
      response:
        status: 200
        text: |-
          <PositionResponse SchemaVersion="1.0">
              <Success>
                  <GeneralSuccess />
              </Success>
          </PositionResponse>
      source: https://developer.axis.com/vapix/network-video/geolocation-api/#set-position

