provenance:
  completeness: partial
  open_questions:
  - Orientation API (geoorientation, action=get/set, heading/installation height/tilt/roll, AXIS OS 11.5) is announced
    but no CGI path, parameters or responses are documented; the 'API specification' section instead repeats position/get
    and position/set twice (second copy adds heading). Mirrored HTML matches; likely a doc defect.
  - How ValidPosition / ValidHeading are set is not documented (no set.cgi parameter for them).
  - position/set parameter table omits heading; the duplicate section includes it.
  - Examples quote text values (text="freetext"); whether quotes are stored literally is unclear. Spaces in 'free
    text' / 'floor 2' are unencoded in examples.
  - Error response lists ErrorCode 1/2/3 in one SetError element — syntax listing of possible codes, not a real
    response.
  - Return value 'Error' of get.cgi is only described as defaults (0 and empty string).
  - Mentioned unit types DMS/DMM vs DDMM/DDMMSS naming inconsistent.
  - 'migration: xml-unmapped: set_position: no response schema in v1; result is the raw XML element'
  - 'migration: dropped-section: v1 section notes not carried over'
