  sha256_md: d0f8e666851770f9a01612742ccbc9ff386eb305eb90dc22911e73e0cac44f95
  retrieved_at: '2026-10-11'

provenance:
  completeness: partial
  open_questions:
  - The Orientation API (geoorientation: heading, installation height, tilt and roll, AXIS OS 11.5, selected with action=get/set) is announced but no CGI path, parameters or responses are documented, so it is not modelled.
  - How ValidPosition and ValidHeading are set is not documented; set.cgi has no parameter for them.
  - Examples quote the text value (text="freetext"); whether the quotes are stored literally is unclear. The examples also leave spaces in 'free text' unencoded.
  - The error response lists ErrorCode 1, 2 and 3 in one SetError element as a syntax listing of the possible codes; a real reply carries one.
  - The docs say GET/POST for both CGIs; only GET is modelled.
  - The unit names DD, DDMM and DDMMSS are used in the examples but DMS and DMM in the introduction.
  migrated_from: v1
  curated: true
