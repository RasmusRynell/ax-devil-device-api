format: 2
id: rate-control
name: Rate control
summary: Control the bitrate (VBR / MBR / ABR) of video streams via param.cgi defaults (Image.I#.RateControl) and
  RTSP URL options.
section: network-video
family: cgi
status: released
python:
  module: rate_control
  class: RateControl
docs:
- https://developer.axis.com/vapix/network-video/rate-control/
access: admin
discovery:
- param: {name: Properties.Image.RateControl.ABR.ABR, value: 'yes'}

binding: {path: /axis-cgi/param.cgi}

operations:
  list_rate_control:
    summary: Get the current default rate control parameters for an image view.
    effect: read
    binding:
      method: GET
      query: {action: list}
      reply: text_kv
    params:
      type: object
      required: [group]
      properties:
        group:
          type: string
          description: 'Image.I#.RateControl, # is 0–N where N is Properties.Image.NbrOfViews.'
    result:
      type: object
      additionalProperties: {type: string}
  update_rate_control:
    summary: Set default rate control parameters for an image view.
    effect: write
    write: patch
    binding:
      path: /axis-cgi/admin/param.cgi
      method: GET
      query: {action: update}
      reply: text
    params:
      type: object
      properties:
        root.Image.I#.RateControl.Mode:
          type: string
          enum: [vbr, mbr, abr]
          default: vbr
          x-python-name: mode
          description: Specifies whether the rate controller should operate in VBR, MBR or ABR. MaxBitrate and Priority
            are ignored in ABR mode; ABR.TargetBitrate and ABR.MaxBitrate are used instead.
        root.Image.I#.RateControl.Priority:
          type: string
          enum: [none, quality, framerate, fullframerate]
          default: framerate
          x-python-name: priority
          description: 'MBR only. Prioritize frame rate or quality. none: used if Mode is ABR or VBR. fullframerate:
            tries to prevent frame drops in the rate controller.'
        root.Image.I#.RateControl.MaxBitrate:
          type: integer
          minimum: 0
          default: 0
          x-python-name: max_bitrate
          description: MBR only. The maximum bitrate allowed for the stream. If 0, at least 50000 will be used depending
            of product, resolution or frame rate. (unit=kbit/s)
        root.Image.I#.RateControl.ABR.TargetBitrate:
          type: integer
          minimum: 0
          default: 0
          x-python-name: abr_target_bitrate
          description: ABR only. The maximum average bitrate allowed over ABR.RetentionTime days. If 0, at least
            50000 will be used. Not all values are realistic. (unit=kbit/s)
        root.Image.I#.RateControl.ABR.MaxBitrate:
          type: integer
          minimum: 0
          default: 0
          x-python-name: abr_max_bitrate
          description: ABR only. The maximum instantaneous bitrate allowed. If 0, at least 50000 will be used. (unit=kbit/s)
        root.Image.I#.RateControl.ABR.RetentionTime:
          type: integer
          minimum: 1
          maximum: 3652
          default: 7
          x-python-name: abr_retention_time
          description: ABR only. The desired retention, measured in days. (unit=days)

