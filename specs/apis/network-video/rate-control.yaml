format: 2
id: rate-control
name: Rate control
summary: Read and change the default bitrate control (VBR, MBR, ABR) of the video streams of an image view through param.cgi.
section: network-video
family: cgi
status: released
python:
  module: rate_control
  class: RateControl
docs:
- https://developer.axis.com/vapix/network-video/rate-control/
access: admin
discovery:
- param: {name: Properties.Image.RateControl.ABR.ABR, value: 'yes'}
- param: {name: Properties.Image.RateControl.Version, value: '1.1', compare: '>='}

binding: {path: /axis-cgi/param.cgi}

types:
  Mode:
    type: string
    enum: [vbr, mbr, abr]
    description: Variable (vbr), maximum (mbr) or average (abr) bitrate.
  Priority:
    type: string
    enum: [none, quality, framerate, fullframerate]
    description: Whether frame rate or quality is prioritized in MBR mode. ``none`` lets both be affected.

  RateControl:
    type: object
    description: The default rate control parameters of one image view (the names are those below ``root.Image.I<n>.RateControl.``).
    properties:
      Mode: {$ref: '#/types/Mode'}
      Priority: {$ref: '#/types/Priority'}
      MaxBitrate: {type: integer, minimum: 0, description: The maximum bitrate in kbit/s in MBR mode.}
      ABR.TargetBitrate: {type: integer, minimum: 0, x-python-name: abr_target_bitrate, description: The maximum average bitrate in kbit/s in ABR mode.}
      ABR.MaxBitrate: {type: integer, minimum: 0, x-python-name: abr_max_bitrate, description: The maximum instantaneous bitrate in kbit/s in ABR mode.}
      ABR.RetentionTime: {type: integer, minimum: 1, maximum: 3652, x-python-name: abr_retention_time, description: The desired retention in days in ABR mode.}

operations:
  list_rate_control:
    summary: Get the default rate control parameters of an image view.
    description: >-
      ``n`` is the image view index, from 0 to Properties.Image.NbrOfViews minus one. The values are Mode (vbr, mbr or
      abr), Priority (none, quality, framerate or fullframerate), MaxBitrate, ABR.TargetBitrate, ABR.MaxBitrate (all in
      kbit/s, 0 means the product default of at least 50000) and ABR.RetentionTime (days, 1 to 3652). A product returns
      only the parameters it supports.
    effect: read
    binding:
      method: GET
      query: {action: list, group: 'Image.I{n}.RateControl'}
      reply: {text_kv: {strip_prefix: 'root.Image.I{n}.RateControl.'}}
    params:
      type: object
      required: [n]
      properties:
        n: {type: integer, minimum: 0, description: The image view index.}
    positional: [n]
    result: {$ref: '#/types/RateControl'}
    examples:
    - title: Get the default rate control parameters of image view 0
      request: {query: {group: Image.I0.RateControl}}
      response:
        status: 200
        text: "root.Image.I0.RateControl.Mode=vbr\nroot.Image.I0.RateControl.Priority=framerate\nroot.Image.I0.RateControl.MaxBitrate=0\n"
      source: https://developer.axis.com/vapix/network-video/rate-control/#getting-and-setting-the-default-rate-control-parameters-for-image-view
  set_rate_control:
    summary: Set default rate control parameters of an image view.
    description: >-
      In MBR mode MaxBitrate and Priority apply. In ABR mode ABR.TargetBitrate, ABR.MaxBitrate and ABR.RetentionTime
      apply and MaxBitrate and Priority are ignored. Only the given parameters change.
    effect: write
    write: patch
    binding:
      path: /axis-cgi/admin/param.cgi
      method: GET
      query: {action: update}
      reply: text_ok
    params:
      type: object
      required: [n]
      properties:
        n: {type: integer, minimum: 0, description: The image view index.}
        root.Image.I{n}.RateControl.Mode: {$ref: '#/types/Mode', x-python-name: mode}
        root.Image.I{n}.RateControl.Priority: {$ref: '#/types/Priority', x-python-name: priority}
        root.Image.I{n}.RateControl.MaxBitrate: {type: integer, minimum: 0, x-python-name: max_bitrate, description: The maximum bitrate in kbit/s in MBR mode.}
        root.Image.I{n}.RateControl.ABR.TargetBitrate: {type: integer, minimum: 0, x-python-name: abr_target_bitrate, description: The maximum average bitrate in kbit/s in ABR mode.}
        root.Image.I{n}.RateControl.ABR.MaxBitrate: {type: integer, minimum: 0, x-python-name: abr_max_bitrate, description: The maximum instantaneous bitrate in kbit/s in ABR mode.}
        root.Image.I{n}.RateControl.ABR.RetentionTime: {type: integer, minimum: 1, maximum: 3652, x-python-name: abr_retention_time, description: The desired retention in days in ABR mode.}
    positional: [n]
    examples:
    - title: Set the maximum bitrate to 1000 kbit/s and prioritize quality
      request:
        query:
          root.Image.I0.RateControl.Mode: mbr
          root.Image.I0.RateControl.MaxBitrate: '1000'
          root.Image.I0.RateControl.Priority: quality
      response: {status: 200, text: OK}
      source: https://developer.axis.com/vapix/network-video/rate-control/#getting-and-setting-the-default-rate-control-parameters-for-image-view
    - title: Set the average bitrate parameters
      request:
        query:
          root.Image.I0.RateControl.Mode: abr
          root.Image.I0.RateControl.ABR.TargetBitrate: '500'
          root.Image.I0.RateControl.ABR.MaxBitrate: '1000'
          root.Image.I0.RateControl.ABR.RetentionTime: '30'
      response: {status: 200, text: OK}
      source: https://developer.axis.com/vapix/network-video/rate-control/#set-the-average-bitrate-parameters-in-axis-cgiparamcgi
  get_rtsp_stream_with_rate_control:
    summary: Build the RTSP URL of a stream with rate control settings that apply to that stream only.
    description: >-
      The settings override the defaults of ``list_rate_control``. If any rate control option is given,
      ``videobitratemode`` must be given as well, otherwise the device answers 400 Bad Request. Settings that do not
      apply to the mode are ignored. If both ``videoabrmaxbitrate`` and ``videoabrtargetbitrate`` are given, the maximum
      must not be smaller than the target.
    effect: read
    binding: {rtsp: {}}
    params:
      type: object
      properties:
        videobitratemode: {$ref: '#/types/Mode'}
        videobitratepriority: {$ref: '#/types/Priority'}
        videomaxbitrate: {type: integer, minimum: 0, description: The maximum bitrate in kbit/s (MBR).}
        videoabrtargetbitrate: {type: integer, minimum: 0, description: The target average bitrate in kbit/s (ABR).}
        videoabrmaxbitrate: {type: integer, minimum: 0, description: The maximum instantaneous bitrate in kbit/s (ABR).}
        videoabrretentiontime: {type: integer, minimum: 1, maximum: 3652, description: The retention time in days (ABR).}

sources:
- url: https://developer.axis.com/vapix/network-video/rate-control/
  sha256_md: 10209817acfaf44adf5bf164b03472b5100f43ea8b2652f64a78d719f6d7da68
  retrieved_at: '2026-10-11'

provenance:
  completeness: partial
  open_questions:
  - 'The typed read of the rate control values is not expressible: a fixed query argument cannot embed the image view index (group=Image.I{n}.RateControl), so list_rate_control takes the group and returns the key/value map; the typed write uses templated names.'
  - The identification lists Image.IO.RateControl.Mode and MaxBitrate (letter O), presumably Image.I0 (zero); these are not Name=value probes and are not used for discovery.
  - The event data of the ABR stream status (abr error, low_bitrate, scale_width and others) is only named in prose; the events are not modelled.
  - dynamic_fps is described as "1 if dynamic GOP is turned on" (a copy and paste error).
  - The security levels are not stated; the examples use /axis-cgi/param.cgi for list and /axis-cgi/admin/param.cgi for update.
  - The body of the update reply is not shown; param.cgi answers OK, so the reply is read as OK.
  - The list example reply is a constructed sample; the docs show only the request.
  migrated_from: v1
  curated: true
