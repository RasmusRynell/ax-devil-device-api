format: 2
id: rate-control
name: Rate control
summary: Read and change the default bitrate control (VBR, MBR, ABR) of the video streams of an image view through param.cgi.
section: network-video
family: cgi
status: released
python:
  module: rate_control
  class: RateControl
docs:
- https://developer.axis.com/vapix/network-video/rate-control/
access: admin
discovery:
- param: {name: Properties.Image.RateControl.ABR.ABR, value: 'yes'}
- param: {name: Properties.Image.RateControl.Version, value: '1.1', compare: '>='}

binding: {path: /axis-cgi/param.cgi}

operations:
  list_rate_control:
    summary: 'Get the default rate control parameters of an image view as ``{"Image.I0.RateControl.Mode": "vbr"}`` (``root.`` removed).'
    description: >-
      Pass the parameter group of the image view, for example ``Image.I0.RateControl``; the number ranges from 0 to
      Properties.Image.NbrOfViews minus one. The values are Mode (vbr, mbr or abr), Priority (none, quality,
      framerate or fullframerate), MaxBitrate, ABR.TargetBitrate, ABR.MaxBitrate (all in kbit/s, 0 means the
      product default of at least 50000) and ABR.RetentionTime (days, 1 to 3652).
    effect: read
    binding:
      method: GET
      query: {action: list}
      reply: {text_kv: {strip_prefix: "root."}}
    params:
      type: object
      required: [group]
      properties:
        group: {type: string, description: 'The parameter group, Image.I<n>.RateControl.'}
    positional: [group]
    result: {type: object, additionalProperties: {type: string}}
    examples:
    - title: Get the default rate control parameters of image view 0
      request: {query: {group: Image.I0.RateControl}}
      response:
        status: 200
        text: "root.Image.I0.RateControl.Mode=vbr\nroot.Image.I0.RateControl.Priority=framerate\nroot.Image.I0.RateControl.MaxBitrate=0\n"
      source: https://developer.axis.com/vapix/network-video/rate-control/#getting-and-setting-the-default-rate-control-parameters-for-image-view
  update_rate_control:
    summary: 'Set default rate control parameters, e.g. ``{"root.Image.I0.RateControl.Mode": "mbr"}``.'
    description: >-
      The keys are parameters of Image.I<n>.RateControl, written with the ``root.`` prefix as in the docs. Mode is
      vbr, mbr or abr (default vbr). In MBR mode MaxBitrate and Priority apply. In ABR mode ABR.TargetBitrate,
      ABR.MaxBitrate and ABR.RetentionTime apply
      and MaxBitrate and Priority are ignored. Only the given parameters change.
    effect: write
    write: patch
    binding:
      path: /axis-cgi/admin/param.cgi
      method: GET
      query: {action: update}
      reply: text_ok
    params:
      type: object
      required: [parameters]
      properties:
        parameters: {type: object, additionalProperties: {type: string}, x-style: spread}
    positional: [parameters]
    examples:
    - title: Set the maximum bitrate to 1000 kbit/s and prioritize quality
      request:
        query:
          root.Image.I0.RateControl.Mode: mbr
          root.Image.I0.RateControl.MaxBitrate: '1000'
          root.Image.I0.RateControl.Priority: quality
      response: {status: 200, text: OK}
      source: https://developer.axis.com/vapix/network-video/rate-control/#getting-and-setting-the-default-rate-control-parameters-for-image-view
    - title: Set the average bitrate parameters
      request:
        query:
          root.Image.I0.RateControl.Mode: abr
          root.Image.I0.RateControl.ABR.TargetBitrate: '500'
          root.Image.I0.RateControl.ABR.MaxBitrate: '1000'
          root.Image.I0.RateControl.ABR.RetentionTime: '30'
      response: {status: 200, text: OK}
      source: https://developer.axis.com/vapix/network-video/rate-control/#set-the-average-bitrate-parameters-in-axis-cgiparamcgi

