# Migrated from the v1 corpus by codegen/migrate_v1.py; not yet curated.
format: 2
id: disk-properties
name: Disk properties API (Edge storage)
summary: Configure disk properties - required file system (autoformat), disk encryption and passphrase, cleanup
  max age/policy, disk alert levels - via...
section: network-video
family: cgi
status: released
python:
  module: disk_properties
  class: DiskProperties
docs:
- https://developer.axis.com/vapix/network-video/edge-storage-api/
access: admin
discovery:
- param: {name: Properties.LocalStorage.RequiredFileSystem, value: 'yes'}
- param: {name: Properties.LocalStorage.DiskEncryption, value: 'yes'}

binding: {path: /axis-cgi/disks/properties/setrequiredfs.cgi}

operations:
  set_required_fs:
    summary: Enable and set (or disable with none) the required file system used to automatically format SD cards.
    description: If set, each mounted SD card not using the required file system (or undeterminable) is formatted
      automatically (data lost). Locked cards are not reformatted; an unlocked card is formatted on next mount.
      Setting it while a card is mounted reformats on remount. Called autoformat in the web interface. Check current
      setting with list.cgi.
    effect: write
    write: patch
    binding:
      method: GET
      reply:
        xml: {error_elements: [Error, GeneralError]}
    params:
      type: object
      required: [schemaversion, diskid, filesystem]
      properties:
        schemaversion:
          type: integer
          description: Required. Major version of the XML schema to use for the response.
        diskid: {type: string, description: Required. The Disk ID.}
        filesystem:
          type: string
          enum: [none, ext4]
          description: Required. none = disable required file system; ext4. Check support with getcapabilities.cgi.
            (Table types it <integer>.)
    errors:
      10: {description: Error while processing the request.}
      20: {description: Invalid request., kind: invalid_argument}
      30: {description: Specified file system is not supported., kind: unsupported}
      40: {description: Specified version is not supported., kind: unsupported}
  enable_disk_encryption:
    summary: Enable disk encryption (disk must be unmounted; then format and mount).
    effect: write
    write: patch
    binding: {path: /axis-cgi/disks/properties/enablediskencryption.cgi, method: GET, reply: xml}
    params:
      type: object
      required: [schemaversion, diskid, passphrase]
      properties:
        schemaversion:
          type: integer
          description: Required. Major version of the XML schema to use for the response.
        diskid: {type: string, description: Required. The Disk ID.}
        passphrase:
          type: string
          maxLength: 512
          description: Required. Passphrase for disk encryption. Max 512 bytes.
    errors:
      10: {description: Error while processing the request.}
      20: {description: Invalid request., kind: invalid_argument}
      40: {description: Specified version is not supported., kind: unsupported}
      50: {description: Invalid disk ID., kind: invalid_argument}
      100: {description: The disk does not support disk encryption.}
      110: {description: Invalid passphrase., kind: invalid_argument}
      140: {description: Encryption is already enabled.}
      160:
        description: The disk is mounted. Encryption can only be enabled/disabled when the disk is unmounted.
    examples:
    - title: Enable disk encryption with passphrase secret
      request:
        query: {schemaversion: '1', diskid: SD_DISK, passphrase: secret}
      response:
        status: 200
        text: |-
          <?xml version="1.0" encoding="UTF-8"?>
          <DiskPropertiesResponse xmlns="http://www.axis.com/vapix/http_cgi/disks/properties1" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://www.axis.com/vapix/http_cgi/disks/properties1http://www.axis.com/vapix/http_cgi/disks/properties/disk_properties1.xsd" SchemaVersion="1.0">
            <Success>
              <GeneralSuccess />
            </Success>
          </DiskPropertiesResponse>
  disable_disk_encryption:
    summary: Disable disk encryption (disk must be unmounted; then format and mount; recordings removed by format).
    effect: write
    write: patch
    binding: {path: /axis-cgi/disks/properties/disablediskencryption.cgi, method: GET, reply: xml}
    params:
      type: object
      required: [schemaversion, diskid]
      properties:
        schemaversion:
          type: integer
          description: Required. Major version of the XML schema to use for the response.
        diskid: {type: string, description: Required. The Disk ID.}
    errors:
      10: {description: Error while processing the request.}
      20: {description: Invalid request., kind: invalid_argument}
      40: {description: Specified version is not supported., kind: unsupported}
      50: {description: Invalid disk ID., kind: invalid_argument}
      100: {description: The disk does not support disk encryption.}
      160:
        description: The disk is mounted. Encryption can only be enabled/disabled when the disk is unmounted.
    examples:
    - title: Disable disk encryption
      request:
        query: {schemaversion: '1', diskid: SD_DISK}
      response:
        status: 200
        text: |-
          <?xml version="1.0" encoding="UTF-8"?>
          <DiskPropertiesResponse xmlns="http://www.axis.com/vapix/http_cgi/disks/properties1" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://www.axis.com/vapix/http_cgi/disks/properties1http://www.axis.com/vapix/http_cgi/disks/properties/disk_properties1.xsd" SchemaVersion="1.0">
            <Success>
              <GeneralSuccess />
            </Success>
          </DiskPropertiesResponse>
  change_disk_passphrase:
    summary: Change the disk encryption passphrase (disk must be mounted; ongoing recordings not disrupted).
    effect: write
    write: patch
    binding: {path: /axis-cgi/disks/properties/changediskpassphrase.cgi, method: GET, reply: xml}
    params:
      type: object
      required: [schemaversion, diskid, newpassphrase, oldpassphrase]
      properties:
        schemaversion:
          type: integer
          description: Required. Major version of the XML schema to use for the response.
        diskid: {type: string, description: Required. The Disk ID.}
        newpassphrase: {type: string, maxLength: 512, description: 'Required. New passphrase, max 512 bytes.'}
        oldpassphrase: {type: string, description: Required. Current passphrase.}
    errors:
      10: {description: Error while processing the request.}
      20: {description: Invalid request., kind: invalid_argument}
      40: {description: Specified version is not supported., kind: unsupported}
      50: {description: Invalid disk ID., kind: invalid_argument}
      100: {description: The disk does not support disk encryption.}
      120: {description: Invalid new passphrase., kind: invalid_argument}
      130: {description: The oldpassphrase does not match the existing passphrase.}
      150: {description: The disk is unmounted. Passphrase can only be changed when the disk is mounted.}
    examples:
    - title: Change the passphrase
      request:
        query:
          schemaversion: '1'
          diskid: SD_DISK
          newpassphrase: verysecret
          oldpassphrase: secret
      response:
        status: 200
        text: |-
          <?xml version="1.0" encoding="UTF-8"?>
          <DiskPropertiesResponse xmlns="http://www.axis.com/vapix/http_cgi/disks/properties1" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://www.axis.com/vapix/http_cgi/disks/properties1http://www.axis.com/vapix/http_cgi/disks/properties/disk_properties1.xsd" SchemaVersion="1.0">
            <Success>
              <GeneralSuccess />
            </Success>
          </DiskPropertiesResponse>
  set_cleanup_max_age:
    summary: Update cleanup max age (days unlocked recordings are kept; used with cleanup policy fifo; recordings
      also deleted when free space is low).
    effect: write
    write: patch
    binding: {path: /axis-cgi/disks/properties/setcleanupmaxage.cgi, method: GET, reply: xml}
    params:
      type: object
      required: [schemaversion, diskid, maxage]
      properties:
        schemaversion:
          type: integer
          description: Required. Major version of the XML schema to use for the response.
        diskid: {type: string, description: Required. The Disk ID.}
        maxage: {type: integer, minimum: 0, maximum: 7000, description: Required. 0-7000 days.}
    errors:
      10: {description: Error while processing the request.}
      20: {description: Invalid request., kind: invalid_argument}
      40: {description: Specified version is not supported., kind: unsupported}
      50: {description: Invalid disk ID., kind: invalid_argument}
      100: {description: The disk does not support disk encryption.}
      110: {description: Invalid passphrase., kind: invalid_argument}
      140: {description: Encryption is already enabled.}
      160:
        description: The disk is mounted. Encryption can only be enabled/disabled when the disk is unmounted.
  set_cleanup_policy:
    summary: Update cleanup policy.
    effect: write
    write: patch
    binding: {path: /axis-cgi/disks/properties/setcleanuppolicy.cgi, method: GET, reply: xml}
    params:
      type: object
      required: [schemaversion, diskid, cleanuppolicy]
      properties:
        schemaversion:
          type: integer
          description: Required. Major version of the XML schema to use for the response.
        diskid: {type: string, description: Required. The Disk ID.}
        cleanuppolicy:
          type: string
          enum: [fifo, none]
          description: Required. fifo = delete automatically per cleanupmaxage; none = manual deletion (recordings
            still deleted when free space is low).
    errors:
      10: {description: Error while processing the request.}
      20: {description: Invalid request., kind: invalid_argument}
      40: {description: Specified version is not supported., kind: unsupported}
      50: {description: Invalid disk ID., kind: invalid_argument}
      100: {description: The disk does not support disk encryption.}
      110: {description: Invalid passphrase., kind: invalid_argument}
      140: {description: Encryption is already enabled.}
      160:
        description: The disk is mounted. Encryption can only be enabled/disabled when the disk is unmounted.
  set_disk_alert_levels:
    summary: Set disk alert levels that trigger the storage alert event (alert=True once any property reaches its
      level; False when all are below again).
    effect: write
    write: patch
    binding: {path: /axis-cgi/disks/properties/setdiskalertlevels.cgi, method: GET, reply: xml}
    params:
      type: object
      required: [schemaversion, diskid]
      properties:
        schemaversion:
          type: integer
          description: Required. Major version of the XML schema to use for the response.
        diskid: {type: string, description: Required. The Disk ID.}
        wear:
          type: integer
          minimum: 0
          description: Wear level (>=0) that triggers a storage alert event.
        temperature:
          type: integer
          minimum: 0
          description: Disk temperature in Kelvin (>=0) that triggers a storage alert event. (unit=K)
    errors:
      10: {description: Error while processing the request.}
      20: {description: Invalid request., kind: invalid_argument}
      40: {description: Specified version is not supported., kind: unsupported}
      50: {description: Invalid disk ID., kind: invalid_argument}
      100: {description: The disk does not support disk encryption.}
      110: {description: Invalid passphrase., kind: invalid_argument}
      140: {description: Encryption is already enabled.}
      160:
        description: The disk is mounted. Encryption can only be enabled/disabled when the disk is unmounted.
  get_disk_alert_levels:
    summary: Get the alert levels for a disk.
    access: operator
    effect: read
    binding: {path: /axis-cgi/disks/properties/getdiskalertlevels.cgi, method: GET, reply: xml}
    params:
      type: object
      required: [schemaversion, diskid]
      properties:
        schemaversion:
          type: integer
          description: Required. Major version of the XML schema to use for the response.
        diskid: {type: string, description: Required. The Disk ID.}
    result: {x-xml: true}
    errors:
      10: {description: Error while processing the request.}
      20: {description: Invalid request., kind: invalid_argument}
      40: {description: Specified version is not supported., kind: unsupported}
      50: {description: Invalid disk ID., kind: invalid_argument}
      100: {description: The disk does not support disk encryption.}
      110: {description: Invalid passphrase., kind: invalid_argument}
      140: {description: Encryption is already enabled.}
      160:
        description: The disk is mounted. Encryption can only be enabled/disabled when the disk is unmounted.
  get_schema_versions:
    summary: List supported XML schema versions for the Disk properties API and whether they are deprecated.
    access: operator
    effect: read
    binding: {path: /axis-cgi/disks/properties/schemaversions.cgi, method: GET, reply: xml}
    result: {x-xml: true}

