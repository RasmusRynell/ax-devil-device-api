format: 2
id: on-screen-directional-indicator
name: On-screen directional indicator
summary: Name PTZ zones (pan/tilt/zoom ranges) so the zone name can be shown in the text overlay; parameter based
  (PTZ.Locator).
section: network-video
family: cgi
status: released
python:
  module: osdi
  class: OnScreenDirectionalIndicator
docs:
- https://developer.axis.com/vapix/network-video/on-screen-directional-indicator/
access: operator

binding: {path: /axis-cgi/param.cgi}

operations:
  get_max_zones:
    summary: Check the number of supported OSDI zones for an image source.
    access: viewer
    effect: read
    binding:
      method: GET
      query: {action: list}
      reply: text_kv
    params:
      type: object
      required: [group]
      properties:
        group: {type: string, description: root.PTZ.Locator.L<n>.MaxZones}
    result:
      type: object
      additionalProperties: {type: string}
  add_zone:
    summary: Create an OSDI zone parameter group.
    effect: write
    write: create
    binding:
      method: GET
      query: {action: add, template: ptzlocator}
      reply: text
    params:
      type: object
      required: [group]
      properties:
        group: {type: string, description: root.PTZ.Locator.L<n>.Zone}
        root.PTZ.Locator.L#.Zone.Z.Enabled:
          type: boolean
          enum: ['yes', 'no']
          x-python-name: enabled
          description: Determines if the zone is currently used.
        root.PTZ.Locator.L#.Zone.Z.Name: {type: string, x-python-name: name, description: Identifies the zone.}
        root.PTZ.Locator.L#.Zone.Z.Pan:
          type: string
          pattern: ^-?[0-9.]+:-?[0-9.]+$
          x-python-name: pan
          description: The pan coordinates, presented in degrees, for the zone. Format <float>:<float>. (unit=degrees)
        root.PTZ.Locator.L#.Zone.Z.Tilt:
          type: string
          pattern: ^-?[0-9.]+:-?[0-9.]+$
          x-python-name: tilt
          description: The tilt coordinates, presented in degrees, for the zone. Format <float>:<float>. (unit=degrees)
        root.PTZ.Locator.L#.Zone.Z.Zoom:
          type: string
          pattern: ^[0-9]+:[0-9]+$
          x-python-name: zoom
          description: If set, specifies the zoom levels and when the zone should be considered active. If not set,
            the zoom level is not taken into consideration for this zone.
  list_zones:
    summary: List the PTZ.Locator.L#.Zone.Z# parameters (generic Parameter management API).
    access: viewer
    effect: read
    binding:
      method: GET
      query: {action: list}
      reply: text_kv
    params:
      type: object
      required: [group]
      properties:
        group: {type: string, description: 'Parameter group to list, e.g. root.PTZ.Locator.L0.Zone.'}
    result:
      type: object
      additionalProperties: {type: string}
  update_zones:
    summary: Update one or more PTZ.Locator.L#.Zone.Z# parameters (generic Parameter management API).
    effect: write
    write: patch
    binding:
      method: GET
      query: {action: update}
      reply: text
    params:
      type: object
      required: [PTZ.Locator.L#.Zone.Z#.<param>]
      properties:
        PTZ.Locator.L#.Zone.Z#.<param>:
          type: string
          description: One or more <full parameter name>=<value> pairs; see param_cgi_groups for parameters and
            valid values.
  remove_zone:
    summary: Delete a zone parameter group (removes the zone).
    effect: write
    write: delete
    binding:
      method: GET
      query: {action: remove}
      reply: text
    params:
      type: object
      required: [group]
      properties:
        group: {type: string, description: root.PTZ.Locator.L<n>.Zone.Z<m>}

