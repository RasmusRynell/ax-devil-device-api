provenance:
  completeness: partial
  open_questions:
  - HTTP URLs are derived from the generic Device Configuration mapping; the page only shows abstract paths. API id, version status, permissions, AXIS OS requirement and error responses are not stated.
  - GET current-loop.v1.status example returns a single object, while the single-property example indexes status['My-SensorId']; the status is modelled as a collection keyed by sensorId.
  - Whether configuration items can be added or removed is not documented, so no add/remove operations exist. Which fields the device always returns is not documented; only sensorId is required.
  - Event topics tns1:CameraApplicationPlatform/tnsaxis:Alarm|Fault|Metadata are generic ACAP-platform topics; the full topic path and source fields are not documented.
  - Only engineeringUnit and physicalValue have single-property examples; the other properties are reachable through the entity operations.
  migrated_from: v1
  curated: true
