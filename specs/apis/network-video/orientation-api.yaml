format: 2
id: orientation-api
name: Orientation API
summary: Retrieve camera lens orientation (longitudinal and lateral angles) from built-in gyroscopes/accelerometers.
section: network-video
family: cgi
status: released
python:
  module: orientation
  class: Orientation
docs:
- https://developer.axis.com/vapix/network-video/orientation-api/
access: operator
discovery:
- param: {name: Properties.Orientation.Reporting, value: 'yes'}

binding: {path: /axis-cgi/orientation/getschemaversions.cgi}

errors:
  10: {description: Error while processing the request.}
  20: {description: Invalid request., kind: invalid_argument}
  40: {description: Specified version is not supported., kind: unsupported}

types:
  SchemaVersion:
    type: object
    required: [VersionNumber]
    properties:
      VersionNumber:
        type: string
        description: Schema version, major.minor.
        x-xml: {child: VersionNumber}
      Deprecated:
        type: boolean
        description: If true, this version of the XML schema is deprecated and should not be used.
        x-xml: {child: Deprecated}
  SchemaVersions:
    type: object
    x-xml: {root: Success/GetSchemaVersionsSuccess}
    required: [SchemaVersion]
    properties:
      SchemaVersion:
        type: array
        items: {$ref: '#/types/SchemaVersion'}
        x-xml: {path: SchemaVersion}
  LongitudinalAngle:
    type: object
    description: The lens rotation around its longitudinal axis.
    x-xml: {root: Success/GetLongitudinalValueSuccess/LongitudinalValue}
    required: [Value]
    properties:
      Value: {type: integer, minimum: 0, maximum: 359, description: The angle in degrees (0 to 359)., x-xml: {child: Value}}
  LateralAngle:
    type: object
    description: The angle between the lens longitudinal axis and a line perpendicular to the ground; 0 is straight down, 180 straight up.
    x-xml: {root: Success/GetLateralValueSuccess/LateralValue}
    required: [Value]
    properties:
      Value: {type: integer, minimum: 0, maximum: 180, description: The angle in degrees (0 to 180)., x-xml: {child: Value}}

operations:
  get_schema_versions:
    summary: Retrieve supported XML schema versions.
    effect: read
    binding: {method: GET, reply: xml}
    result: {$ref: '#/types/SchemaVersions'}
    examples:
    - title: Retrieve supported XML schema versions.
      request:
        query: {}
      response:
        status: 200
        text: |-
          <?xml version="1.0" encoding="utf-8"?>
          <OrientationResponse xmlns="http://www.axis.com/vapix/http_cgi/orientation1" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://www.axis.com/vapix/http_cgi/orientation1 http://www.axis.com/vapix/http_cgi/orientation1" SchemaVersion="1.0">
            <Success>
              <GetSchemaVersionsSuccess>
                <SchemaVersion>
                  <VersionNumber>1.0</VersionNumber>
                  <Deprecated>false</Deprecated>
                </SchemaVersion>
              </GetSchemaVersionsSuccess>
            </Success>
          </OrientationResponse>
      source: https://developer.axis.com/vapix/network-video/orientation-api/#common-examples
  get_longitudinal_value:
    summary: Get the longitudinal angle.
    effect: read
    binding: {path: /axis-cgi/orientation/getlongitudinalvalue.cgi, method: GET, reply: xml}
    params:
      type: object
      required: [schemaversion]
      properties:
        schemaversion:
          type: integer
          description: The major version of the XML schema to use for the response.
    result: {$ref: '#/types/LongitudinalAngle'}
    examples:
    - title: Get the longitudinal angle.
      request:
        query: {schemaversion: '1'}
      response:
        status: 200
        text: |-
          <?xml version="1.0" encoding="utf-8"?>
          <OrientationResponse xmlns="http://www.axis.com/vapix/http_cgi/orientation1" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://www.axis.com/vapix/http_cgi/orientation1 http://www.axis.com/vapix/http_cgi/orientation1" SchemaVersion="1.0">
            <Success>
              <GetLongitudinalValueSuccess>
                <LongitudinalValue>
                  <Value>180</Value>
                </LongitudinalValue>
              </GetLongitudinalValueSuccess>
            </Success>
          </OrientationResponse>
      source: https://developer.axis.com/vapix/network-video/orientation-api/#common-examples
  get_lateral_value:
    summary: Get the lateral angle.
    effect: read
    binding: {path: /axis-cgi/orientation/getlateralvalue.cgi, method: GET, reply: xml}
    params:
      type: object
      required: [schemaversion]
      properties:
        schemaversion:
          type: integer
          description: The major version of the XML schema to use for the response.
    result: {$ref: '#/types/LateralAngle'}
    examples:
    - title: Get the lateral angle.
      request:
        query: {schemaversion: '1'}
      response:
        status: 200
        text: |-
          <?xml version="1.0" encoding="utf-8"?>
          <OrientationResponse xmlns="http://www.axis.com/vapix/http_cgi/orientation1" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://www.axis.com/vapix/http_cgi/orientation1 http://www.axis.com/vapix/http_cgi/orientation1" SchemaVersion="1.0">
            <Success>
              <GetLateralValueSuccess>
                <LateralValue>
                  <Value>72</Value>
                </LateralValue>
              </GetLateralValueSuccess>
            </Success>
          </OrientationResponse>
      source: https://developer.axis.com/vapix/network-video/orientation-api/#common-examples

