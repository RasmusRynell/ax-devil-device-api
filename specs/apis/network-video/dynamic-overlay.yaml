provenance:
  completeness: complete
  open_questions:
  - 'https://developer.axis.com/vapix/network-video/overlay-api/#list: data.textOverlay[].fontSize described as
    "The outline color for the overlay" (copy-paste).'
  - Request syntax templates are pseudo-JSON with enum/range placeholders; parameters only present in the template
    were added with inferred=true.
  - reference parameter is deprecated (removal in API version 13.0) in favor of setText per doc note; text of that
    note is garbled in the mirror.
  - remove section bullet says method="list" (copy-paste).
  - Doc examples use curl --data @sample_code.json; request bodies are taken from the JSON samples.
  - 'migration: effect-guessed: write semantics guessed from the method name: set_text=write/patch, set_image=write/patch'
  migrated_from: v1
  curated: false
