provenance:
  completeness: complete
  open_questions:
  - recording_group.xsd referenced by the responses is not mirrored; element types are derived from the prose.
  - The docs mark only recordinggroupid as optional (create, list); the other create/update parameters are treated as optional.
  - The update/delete success tables mention CreateSuccess although the body is GeneralSuccess; the list table says ListSuccess appears in creations (copy/paste errors).
  - Which errors apply to which operation is not stated; all codes are listed at API level.
  - The create and list examples are constructed from the documented body syntax (placeholders replaced by sample values).
  - This CGI API shares the discovery id recording-group with the DCA recording-group API (recording-group-config); the module is named recording_group_cgi to keep them apart.
  - AXIS OS minimum not stated.
  migrated_from: v1
  curated: true
