provenance:
  completeness: partial
  open_questions:
  - The generic update_serial_parameters operation is kept for parameters without a typed operation and for combining groups in one request.
  - The port argument of serial.cgi is used in the examples but not in the parameter table; the numbering of ports against PortManager indices ("port 2 (PortManager.P0)") is unclear.
  - Whether write and read can be combined in one serial.cgi request is not stated, so they are separate operations.
  - The reply of write and the error format of serial.cgi are not documented.
  - 'The docs example "Serial.Ser1.BaudRate=9600&DataBits=8" omits the group prefix for DataBits; the spec example uses Serial.Ser1.DataBits.'
  - The remote port groups (RemotePort.R#, RemotePortServer, Listener, PTZServer) are documented twice on the page with identical content.
  - The default of the Listener Port is the expression 1024 + #.
  - The read example reply is a constructed sample; the docs only describe the #hex# format.
  migrated_from: v1
  curated: true
