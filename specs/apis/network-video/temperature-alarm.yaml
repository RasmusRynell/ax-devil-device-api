  sha256_md: 73f1394bae1b30679e93cf7bcd42a09115d0d19b6ba75396499fdff51312fa51
  retrieved_at: '2026-10-11'

provenance:
  completeness: complete
  open_questions:
  - get_zone_status takes no arguments per the reference; the docs request example passes id=2 but the response shows ZoneId 0 (all zones are returned).
  - Several curl examples in the Markdown are mangled (HTTP block embedded in --data); request URLs are taken from the HTTP tab.
  - Only id is documented as required for set.cgi. Whether omitted arguments keep an existing zone's values (patch) or reset to defaults is not stated, so the write semantics are recorded as create. Only emissivity has a documented default (0.95); it is not sent unless given.
  - No error codes for invalid coordinates or emissivity are documented beyond 10/20/40.
  - Temperature1.xsd is not mirrored; temperature value types (integer vs decimal) are not stated for the status and spot temperature (number is used).
  - The replies of the set, remove and temperature scale calls are the General success response; the spot temperature example reply is constructed from the body syntax.
  - The temperature scale is global; the isotherm API also uses it.
  migrated_from: v1
  curated: true
