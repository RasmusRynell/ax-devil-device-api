provenance:
  completeness: complete
  open_questions:
  - Request syntax blocks miss a comma after "method" in several methods (invalid JSON).
  - getIsothermLevels response syntax misses a comma after min.
  - 'Required/optional status of most params is not stated; required=true marked only where inferred (inferred:
    true).'
  - addArea/updateArea list error code 1200 for both 'Maximum amount of areas in preset reached' and 'Preset does
    not exist'.
  - addGroup security level Operator but updateGroup/removeGroup Administrator.
  - 'addGroup presetNbr: ''It will be ignored for non PTZ cameras, where it must be an existing preset number''
    (contradictory wording).'
  - addOverlayChannel/removeOverlayChannel syntax shows imagesource/overlayChannel as strings ("<int>"), described
    as <int>; Content-Type written 'application-json'.
  - listSpotMeters/listOverlayChannels syntax shows values quoted as strings ("<int>", "<boolean>").
  - getSpotTemperature failure HTTP code is blank in the doc.
  - Example error 1101 'Request is denied - not a thermal camera' is not in the general error table.
  - maxDeviationAreas shown as a 2-element array mixing maxAreaId/maxAreaTemp and minAreaId/minAreaTemp objects.
  - getIsothermLevels refers to parameter 'Image.IO.Appearance.Palette' (letter O instead of zero).
  - 'migration: effect-guessed: write semantics guessed from the method name: set_temperature_scale=write/patch,
    set_isotherm_levels=write/patch, update_area=write/patch, set_tgt_configuration=write/patch, update_group=write/patch'
  - 'migration: dropped-keywords: maxProperties x10'
  migrated_from: v1
  curated: false
