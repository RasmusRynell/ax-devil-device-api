            x-name: GetGroupStatusResultGrouplistItem
            properties:
              id: {type: integer}
              triggered: {type: boolean}
              details:
                type: object
                x-name: GetGroupStatusResultGrouplistItemDetails
                description: Dynamic content; may be empty.
                properties:
                  name: {type: string}
                  currentDeviation: {type: number}
                  threshold: {type: integer}
                  memberAreas:
                    type: array
                    items:
                      type: object
