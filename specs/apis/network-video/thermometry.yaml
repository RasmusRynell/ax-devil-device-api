- url: https://developer.axis.com/vapix/network-video/thermometry/
  sha256_md: ea215a237cfd19284910520bd9640c7ce9acaa255a1e88972dec8dd876259f0d
  retrieved_at: '2026-10-11'

provenance:
  completeness: complete
  open_questions:
    - The docs do not say which parameters of addArea and addGroup are required. name, detectionType, measurement, threshold and vertices (areas), and name, measurement and threshold (groups) are treated as required.
    - addArea/updateArea list error 1200 for both "maximum number of areas in preset reached" and "preset does not exist".
    - addGroup is Operator level while updateGroup/removeGroup are Administrator.
    - 'addGroup presetNbr: "it will be ignored for non PTZ cameras, where it must be an existing preset number" is contradictory wording.'
    - The listAreas image-source example shows the response key "arealist"; the API specification and other examples use "areaList", which is used here. The same example shows areaOverlay "if triggered"; the enum value if_triggered is used.
    - The getAreaStatus example shows maxPos/minPos; the parameter table says maxCoordinates/minCoordinates, which are used here.
    - Error 1101 "Request is denied - not a thermal camera" appears only in an example, not in the general error table.
    - maxDeviationAreas is a 2-element array mixing max* and min* objects.
    - The docs refer to the palette parameter as Image.IO.Appearance.Palette (letter O instead of zero).
    - set_isotherm_levels treats omitted min as "lowest possible"; whether other omitted fields keep their value is not stated (treated as patch).
  migrated_from: v1
  curated: true
