# Migrated from the v1 corpus by codegen/migrate_v1.py; not yet curated.
format: 2
id: thermometry
name: Thermometry
summary: 'Configure temperature monitoring on temperature-calibrated thermal cameras: isotherm levels, detection
  areas, spot meter, area groups, guard tour, overlay...'
section: network-video
family: jsonrpc
status: released
python:
  module: thermometry
  class: Thermometry
docs:
- https://developer.axis.com/vapix/network-video/thermometry/
access: operator
discovery:
- {api_discovery: thermometry}

binding:
  path: /axis-cgi/thermometry.cgi
  major: 1
  versions: ['1.0', '1.1', '1.2', '1.3']
  negotiation:
    get_supported_versions: {key: apiVersions}
  params_placement: params

errors:
  1100: {description: Internal error (also out-of-memory)., kind: internal}
  2100: {description: API version not supported., kind: unsupported}
  2101: {description: Invalid JSON format., kind: invalid_argument}
  2102: {description: Method not supported., kind: unsupported}
  2103: {description: Required parameter missing., kind: invalid_argument}
  2104: {description: Invalid parameter value specified., kind: invalid_argument}
  2105: {description: Invalid arguments, kind: invalid_argument}
  2106: {description: Invalid request method, kind: invalid_argument}
  2107: {description: Invalid content length, kind: invalid_argument}
  2108: {description: Invalid content type, kind: invalid_argument}
  2109: {description: Authorization failed, kind: access_denied}
  2110: {description: Authentication failed}

types:
  Area:
    type: object
    properties:
      id: {type: integer}
      imagesource: {type: integer}
      enabled: {type: boolean}
      name: {type: string}
      detectionType: {type: string, enum: [above, below, increase, decrease]}
      measurement: {type: string, enum: [maximum, minimum, average]}
      threshold: {type: integer}
      delay: {type: integer}
      vertices:
        type: array
        items:
          type: array
          items: {type: number}
      areaOverlay: {type: string, enum: [none, always, if_triggered]}
      temperatureOverlay: {type: boolean}
      presetNbr: {type: integer}
  Group:
    type: object
    properties:
      id: {type: integer}
      enabled: {type: boolean}
      name: {type: string}
      measurement: {type: string, enum: [maximum, minimum, average, inherit]}
      threshold: {type: integer}
      delay: {type: integer}
      areaIds:
        type: array
        items: {type: integer}
      groupOverlay: {type: boolean}
      presetNbr: {type: integer}

operations:
  get_configuration_capabilities:
    summary: Retrieve the thermometric limits and configuration values.
    effect: read
    binding: {method: getConfigurationCapabilities}
    result:
      type: object
      properties:
        currentTemperatureScale: {type: string, enum: [celsius, fahrenheit]}
        minTemperature: {type: integer, description: Minimum measurable temperature in the current scale.}
        maxTemperature: {type: integer}
        maxNumberOfAreas: {type: integer, description: Per preset on PTZ cameras.}
        maxNumberOfVertices: {type: integer}
        maxDelayTime: {type: integer, description: seconds}
        defaultDelayTime: {type: integer, description: seconds}
        maxNameLength: {type: integer}
        maxGroups: {type: integer, description: Max area groups per preset. Added in 1.2.}
        imagesources:
          type: array
          items: {type: integer}
          description: Valid image sources active as thermal input channels. Added in 1.3.
        overlayChannels:
          type: array
          items: {type: integer}
          description: Channels that can have area overlays enabled. Added in 1.3.
    examples:
    - title: List thermometry configuration capabilities
      request:
        params: {}
      response:
        data:
          currentTemperatureScale: celsius
          minTemperature: -40
          maxTemperature: 350
          maxNumberOfAreas: 10
          maxNumberOfVertices: 10
          maxDelayTime: 300
          defaultDelayTime: 5
          maxNameLength: 60
      source: https://developer.axis.com/vapix/network-video/thermometry/#list-thermometry-configuration-capabilities
  set_temperature_scale:
    summary: Set the temperature scale (Celsius default or Fahrenheit).
    effect: write
    write: patch
    binding: {method: setTemperatureScale}
    params:
      type: object
      required: [unit]
      properties:
        unit: {type: string, enum: [celsius, fahrenheit], description: Temperature scale.}
    examples:
    - title: Set temperature scale
      request:
        params: {unit: fahrenheit}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/thermometry/#set-temperature-scale
  get_isotherm_levels:
    summary: Retrieve the isotherm levels (for Iso- palettes) and whether the palette overlay is rendered.
    description: Only meaningful with isothermal palettes (names begin with 'Iso-'); palette selected via Image.I0.Appearance.Palette
      (param.cgi).
    effect: read
    binding: {method: getIsothermLevels}
    result:
      type: object
      properties:
        high: {type: integer}
        middle: {type: integer}
        low:
          type: integer
          description: Lowest temperature colored by the palette; between low and min appear in grayscale.
        min: {type: integer, description: Lowest temperature shown in the image. API 1.2+.}
        renderOverlay:
          type: boolean
          description: true if the palette (with the three levels marked) is included in the video stream.
    examples:
    - title: List isotherm levels
      request:
        params: {}
      response:
        data: {high: 100, middle: 50, low: 10, renderOverlay: true}
      source: https://developer.axis.com/vapix/network-video/thermometry/#list-isotherm-levels
  set_isotherm_levels:
    summary: Set the isotherm levels (unique, rising order) and palette overlay.
    effect: write
    write: patch
    binding: {method: setIsothermLevels}
    params:
      type: object
      required: [high, middle, low]
      properties:
        high:
          type: integer
          description: Range [minTemperature+3, maxTemperature] (getConfigurationCapabilities).
        middle: {type: integer, description: 'Range [minTemperature+2, maxTemperature-1].'}
        low: {type: integer, description: 'Range [minTemperature+1, maxTemperature-2].'}
        min:
          type: integer
          description: Optional, API 1.2+. If omitted set to the lowest possible temperature. Range [minTemperature,
            maxTemperature-3].
        renderOverlay: {type: boolean, description: Include the color palette (levels marked) in the video stream.}
    since_fields: {params.min: '1.2'}
    examples:
    - title: Set isotherm levels
      request:
        params: {high: 100, middle: 50, low: 10, renderOverlay: true}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/thermometry/#set-isotherm-levels
  add_area:
    summary: Add a temperature detection area (polygon) with alarm conditions.
    access: admin
    effect: write
    write: create
    binding: {method: addArea}
    params:
      type: object
      properties:
        imagesource:
          type: integer
          description: The image source for the area. Area overlays default to the image source they were created
            on.
        enabled: {type: boolean, description: Enables the area monitoring if true.}
        name:
          type: string
          description: The area name; must be unique. Maximum length from getConfigurationCapabilities.maxNameLength.
        detectionType:
          type: string
          enum: [above, below, increase, decrease]
          description: 'above/below: alarm if the value goes above/below the threshold. increase/decrease: alarm
            if the temperature increases/decreases faster than threshold divided by delay time.'
        measurement:
          type: string
          enum: [maximum, minimum, average]
          description: Alarm depends on the maximum, minimum or average temperature in the area.
        threshold:
          type: integer
          description: Temperature value that activates the trigger; for increase/decrease the temperature change
            during the delay time (must be positive). Range from getConfigurationCapabilities.
        delay:
          type: integer
          minimum: 0
          description: Seconds the trigger condition must be true before alarm (0 = immediately); for increase/decrease
            the time window. Max/default from getConfigurationCapabilities. (unit=seconds)
        vertices:
          type: array
          items:
            type: array
            items: {type: number, minimum: -1, maximum: 1}
            description: minItems=2, maxItems=2
          description: Polygon vertices [[x, y],...], normalized -1..1 (upper right [1,1], lower left [-1,-1]) for
            an unrotated, unmirrored image. (minItems=3)
        areaOverlay:
          type: string
          enum: [none, always, if_triggered]
          description: If/when the area is included in the video stream (overlay turns from green to red when triggered).
        temperatureOverlay:
          type: boolean
          description: Show the chosen measurement value when the area overlay is visible.
        presetNbr:
          type: integer
          description: Preset number; ignored on non-PTZ cameras, must be an existing preset on PTZ cameras.
    result:
      type: object
      properties:
        id: {type: integer, description: The area id.}
    errors:
      1200: {description: Preset does not exist., kind: not_found}
      2104: {description: The specified name is already in use.}
    examples:
    - title: Add a temperature detection area
      request:
        params:
          imagesource: 0
          enabled: true
          name: Area 1
          detectionType: above
          measurement: average
          threshold: 100
          delay: 5
          vertices:
          - [-0.5, -0.5]
          - [0.5, -0.5]
          - [0.5, 0.5]
          - [-0.5, 0.5]
          areaOverlay: always
          temperatureOverlay: true
          presetNbr: 1
      response:
        data: {id: 0}
      source: https://developer.axis.com/vapix/network-video/thermometry/#add-a-temperature-detection-area
  update_area:
    summary: Update an existing temperature detection area.
    access: admin
    effect: write
    write: patch
    binding: {method: updateArea}
    params:
      type: object
      required: [id]
      properties:
        id: {type: integer, description: The area ID.}
        imagesource:
          type: integer
          description: The image source for the area. Area overlays default to the image source they were created
            on.
        enabled: {type: boolean, description: Enables the area monitoring if true.}
        name:
          type: string
          description: The area name; must be unique. Maximum length from getConfigurationCapabilities.maxNameLength.
        detectionType:
          type: string
          enum: [above, below, increase, decrease]
          description: 'above/below: alarm if the value goes above/below the threshold. increase/decrease: alarm
            if the temperature increases/decreases faster than threshold divided by delay time.'
        measurement:
          type: string
          enum: [maximum, minimum, average]
          description: Alarm depends on the maximum, minimum or average temperature in the area.
        threshold:
          type: integer
          description: Temperature value that activates the trigger; for increase/decrease the temperature change
            during the delay time (must be positive). Range from getConfigurationCapabilities.
        delay:
          type: integer
          minimum: 0
          description: Seconds the trigger condition must be true before alarm (0 = immediately); for increase/decrease
            the time window. Max/default from getConfigurationCapabilities. (unit=seconds)
        vertices:
          type: array
          items:
            type: array
            items: {type: number, minimum: -1, maximum: 1}
            description: minItems=2, maxItems=2
          description: Polygon vertices [[x, y],...], normalized -1..1 (upper right [1,1], lower left [-1,-1]) for
            an unrotated, unmirrored image. (minItems=3)
        areaOverlay:
          type: string
          enum: [none, always, if_triggered]
          description: If/when the area is included in the video stream (overlay turns from green to red when triggered).
        temperatureOverlay:
          type: boolean
          description: Show the chosen measurement value when the area overlay is visible.
        presetNbr:
          type: integer
          description: Preset number; ignored on non-PTZ cameras, must be an existing preset on PTZ cameras.
    errors:
      1200: {description: Preset does not exist., kind: not_found}
      2104: {description: The specified name is already in use.}
    examples:
    - title: Modify a temperature detection area
      request:
        params:
          id: 0
          imagesource: 0
          enabled: true
          name: Area 1
          detectionType: below
          measurement: minimum
          threshold: 100
          delay: 5
          vertices:
          - [-0.5, -0.5]
          - [0.5, -0.5]
          - [0.5, 0.5]
          - [-0.5, 0.5]
          areaOverlay: if_triggered
          temperatureOverlay: true
          presetNbr: 2
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/thermometry/#modify-a-temperature-detection-area
  remove_areas:
    summary: Remove one or several areas.
    access: admin
    effect: write
    write: delete
    binding: {method: removeAreas}
    params:
      type: object
      required: [areas]
      properties:
        areas:
          type: array
          items: {type: integer}
          description: IDs of the areas to remove. Max per request from getConfigurationCapabilities.
    errors:
      1200: {description: 'Area [x] could not be found'}
    examples:
    - title: Remove temperature detection areas
      request:
        params: {areas: [0, 1, 3]}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/thermometry/#remove-temperature-detection-areas
  list_areas:
    summary: List temperature detection areas for a preset (0 = all presets), optionally filtered by image source.
    effect: read
    binding: {method: listAreas}
    params:
      type: object
      properties:
        presetNbr: {type: integer, description: Preset number; 0 returns all areas for all presets.}
        imagesource: {type: integer, description: Optional filter by image source (API 1.3+).}
    result:
      type: object
      properties:
        areaList:
          type: array
          items: {$ref: '#/types/Area'}
    since_fields: {params.imagesource: '1.3'}
    examples:
    - title: List temperature detection areas
      request:
        params: {presetNbr: 0}
      response:
        data:
          areaList:
          - id: 0
            imagesource: 0
            enabled: true
            name: Area 1
            detectionType: below
            measurement: minimum
            threshold: 100
            delay: 5
            vertices:
            - [-0.5, -0.5]
            - [0.5, -0.5]
            - [0.5, 0.5]
            - [-0.5, 0.5]
            areaOverlay: if triggered
            temperatureOverlay: true
            presetNbr: 0
          - id: 1
            imagesource: 1
            enabled: true
            name: Area 2
            detectionType: below
            measurement: minimum
            threshold: 100
            delay: 5
            vertices:
            - [-0.5, -0.5]
            - [0.5, -0.5]
            - [0.5, 0.5]
            - [-0.5, 0.5]
            areaOverlay: if triggered
            temperatureOverlay: true
            presetNbr: 0
      source: https://developer.axis.com/vapix/network-video/thermometry/#list-temperature-detection-areas
  get_area_status:
    summary: 'Current temperature and trigger status of active areas (PTZ: current preset, empty if not on a preset).'
    effect: read
    binding: {method: getAreaStatus}
    result:
      type: object
      properties:
        areaList:
          type: array
          items:
            type: object
            x-name: GetAreaStatusResultAreaListItem
            properties:
              id: {type: integer}
              avg: {type: integer}
              min: {type: integer}
              max: {type: integer}
              minCoordinates:
                type: array
                items: {type: number}
                description: First pixel found with min temperature.
              maxCoordinates:
                type: array
                items: {type: number}
              triggered: {type: boolean}
              imagesource: {type: integer, description: Added in 1.3.}
    errors:
      1200: {description: Could not get status for areas}
    examples:
    - title: Check area status
      request:
        params: {}
      response:
        data:
          areaList:
          - id: 0
            avg: 5
            min: 0
            max: 10
            maxPos: [0.91, 0.12]
            minPos: [-0.63, -0.31]
            triggered: true
      source: https://developer.axis.com/vapix/network-video/thermometry/#check-area-status
  add_spot_temperature:
    summary: Activate the (single) spot meter at given coordinates; replaces any existing one.
    effect: write
    write: create
    binding: {method: addSpotTemperature}
    params:
      type: object
      required: [spotCoordinates, coordinateSystem]
      properties:
        spotCoordinates:
          type: array
          items: {type: number}
          description: Coordinates [x, y] of the pixel of interest.
        coordinateSystem:
          type: string
          enum: [coord_neg1_1, coord_0_1]
          description: 'coord_neg1_1: origin in the middle, -1..1 increasing left->right and bottom->top. coord_0_1:
            origin upper left, 0..1.'
        imagesource: {type: integer, description: Image source channel showing the spot meter. API 1.3+.}
    since_fields: {params.imagesource: '1.3'}
    errors:
      2104: {description: Invalid channel number specified., kind: invalid_argument}
    examples:
    - title: Add a spot temperature
      request:
        params: {spotCoordinates: [0.37, -0.95], coordinateSystem: coord_neg1_1}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/thermometry/#add-a-spot-temperature
  get_spot_temperature:
    summary: Get the temperature at the spot set by addSpotTemperature.
    effect: read
    binding: {method: getSpotTemperature}
    params:
      type: object
      properties:
        coordinateSystem:
          type: string
          enum: [coord_neg1_1, coord_0_1]
          description: 'coord_neg1_1: origin in the middle, -1..1 increasing left->right and bottom->top. coord_0_1:
            origin upper left, 0..1. Need not match the one used in addSpotTemperature.'
        imagesource: {type: integer, description: API 1.3+.}
    result:
      type: object
      properties:
        spotTemperature: {type: number}
        spotCoordinates:
          type: array
          items: {type: number}
        renderOverlay: {type: boolean, description: Whether the spot meter overlay is activated.}
    since_fields: {params.imagesource: '1.3'}
    errors:
      2104: {description: Invalid channel number specified., kind: invalid_argument}
    examples:
    - title: Check spot temperature
      request:
        params: {coordinateSystem: coord_neg1_1}
      response:
        data: {spotTemperature: 7, spotCoordinates: [-0.53, 0.45], renderOverlay: true}
      source: https://developer.axis.com/vapix/network-video/thermometry/#check-spot-temperature
  remove_spot_temperature:
    summary: Remove the rendering of the spot meter.
    effect: write
    write: delete
    binding: {method: removeSpotTemperature}
    params:
      type: object
      properties:
        imagesource: {type: integer, description: Image source channel to remove the spot meter from. API 1.3+.}
    since_fields: {params.imagesource: '1.3'}
    errors:
      2104: {description: Invalid channel number specified., kind: invalid_argument}
    examples:
    - title: Remove a spot temperature
      request:
        params: {}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/thermometry/#remove-a-spot-temperature
  get_tgt_configuration:
    summary: Retrieve the thermometric guard tour configuration (PTZ).
    access: admin
    effect: read
    since: '1.1'
    binding: {method: getTgtConfiguration}
    result:
      type: object
      properties:
        pauseOnAlarm: {type: boolean, description: Guard tour paused on the preset when an event is active.}
        autoResume:
          type: boolean
          description: Only valid if pauseOnAlarm; resume automatically after event becomes inactive.
    errors:
      1202:
        description: 'Method not supported: No guard tour settings available since camera is fixed.'
        kind: unsupported
    examples:
    - title: Get TGT configuration
      request:
        params: {}
      response:
        data: {pauseOnAlarm: true, autoResume: true}
      source: https://developer.axis.com/vapix/network-video/thermometry/#get-tgt-configuration
  set_tgt_configuration:
    summary: Set the thermometric guard tour configuration.
    access: admin
    effect: write
    write: patch
    since: '1.1'
    binding: {method: setTgtConfiguration}
    params:
      type: object
      properties:
        pauseOnAlarm: {type: boolean, description: Pause guard tour on the preset while an event is active.}
        autoResume:
          type: boolean
          description: Only valid if pauseOnAlarm is true; otherwise the tour must be restarted manually.
    errors:
      1202:
        description: 'Method not supported: No guard tour settings available since camera is fixed.'
        kind: unsupported
    examples:
    - title: Set TGT configuration
      request:
        params: {pauseOnAlarm: true, autoResume: true}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/thermometry/#set-tgt-configuration
  add_group:
    summary: Add an area group to monitor temperature deviation across areas.
    effect: write
    write: create
    since: '1.2'
    binding: {method: addGroup}
    params:
      type: object
      properties:
        enabled:
          type: boolean
          description: Requested enabled state; actual value returned in the response (locked to false until >=2
            areas).
        name:
          type: string
          description: Group name; max length from getConfigurationCapabilities (too long -> 2104, not unique ->
            1200).
        measurement:
          type: string
          enum: [maximum, minimum, average, inherit]
          description: Value per area used for analysis; inherit lets each area's own setting decide.
        threshold:
          type: integer
          minimum: 1
          description: Allowed temperature difference in the group before alarm; positive, >= 1.
        delay:
          type: integer
          minimum: 0
          description: Seconds the trigger condition must be true before alarm (0 = immediately). Max from getConfigurationCapabilities.
            (unit=seconds)
        areaIds:
          type: array
          items: {type: integer}
          description: Area IDs in the group (fully replaces on update). At least 2 to start analysis; fewer (or
            0) allowed but locks enabled=false.
        groupOverlay:
          type: boolean
          description: Whether to display an area overlay when the group is triggered.
        presetNbr:
          type: integer
          description: Preset number for the group; ignored for non-PTZ cameras. Cannot be changed by updateGroup.
    result:
      type: object
      properties:
        id: {type: integer}
        enabled: {type: boolean, description: Actual status; false if configuration incomplete.}
    errors:
      1200:
        description: Group area configuration is invalid (area(s) disabled, not existing, not in valid preset, or
          area limit reached).
        kind: invalid_argument
  update_group:
    summary: Update an existing group (presetNbr cannot be changed).
    access: admin
    effect: write
    write: patch
    since: '1.2'
    binding: {method: updateGroup}
    params:
      type: object
      required: [id]
      properties:
        id: {type: integer, description: The ID of the group to update.}
        enabled:
          type: boolean
          description: Requested enabled state; actual value returned in the response (locked to false until >=2
            areas).
        name:
          type: string
          description: Group name; max length from getConfigurationCapabilities (too long -> 2104, not unique ->
            1200).
        measurement:
          type: string
          enum: [maximum, minimum, average, inherit]
          description: Value per area used for analysis; inherit lets each area's own setting decide.
        threshold:
          type: integer
          minimum: 1
          description: Allowed temperature difference in the group before alarm; positive, >= 1.
        delay:
          type: integer
          minimum: 0
          description: Seconds the trigger condition must be true before alarm (0 = immediately). Max from getConfigurationCapabilities.
            (unit=seconds)
        areaIds:
          type: array
          items: {type: integer}
          description: Area IDs in the group (fully replaces on update). At least 2 to start analysis; fewer (or
            0) allowed but locks enabled=false.
        groupOverlay:
          type: boolean
          description: Whether to display an area overlay when the group is triggered.
    result:
      type: object
      properties:
        enabled: {type: boolean, description: Actual enabled state after update.}
    errors:
      1200:
        description: Group area configuration is invalid (area(s) disabled, not existing, not in valid preset, or
          area limit reached).
        kind: invalid_argument
    examples:
    - title: Modify a group
      request:
        params:
          id: 2
          enabled: true
          name: Group 1
          measurement: minimum
          threshold: 10
          delay: 5
          areaIds: [3, 4]
          groupOverlay: true
      response:
        data: {enabled: true}
      source: https://developer.axis.com/vapix/network-video/thermometry/#modify-a-group
  remove_group:
    summary: Remove one group, or all groups (id 0).
    access: admin
    effect: write
    write: delete
    since: '1.2'
    binding: {method: removeGroup}
    params:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          minimum: 0
          description: Group ID; 0 removes all groups for all presets. Non-existing group -> error.
    errors:
      1200: {description: Group ID is invalid., kind: invalid_argument}
    examples:
    - title: Remove a group
      request:
        params: {id: 1}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/thermometry/#remove-a-group
  list_groups:
    summary: List groups for a preset (0 or omitted = all presets).
    effect: read
    since: '1.2'
    binding: {method: listGroups}
    params:
      type: object
      properties:
        presetNbr:
          type: integer
          description: Optional. 0/omitted = all presets; non-existing preset -> error.
    result:
      type: object
      properties:
        grouplist:
          type: array
          items: {$ref: '#/types/Group'}
    errors:
      1200: {description: Preset does not exist., kind: not_found}
    examples:
    - title: List all groups
      request:
        params: {presetNbr: 0}
      response:
        data:
          grouplist:
          - id: 2
            enabled: true
            name: Group 2
            measurement: minimum
            threshold: 10
            delay: 5
            areaIds: [2, 3]
            groupOverlay: true
            presetNbr: 0
      source: https://developer.axis.com/vapix/network-video/thermometry/#list-all-groups
  get_group_status:
    summary: 'Current trigger status of active groups (PTZ: current preset, empty if not on a preset).'
