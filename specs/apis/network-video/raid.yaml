# Migrated from the v1 corpus by codegen/migrate_v1.py; not yet curated.
format: 2
id: raid
name: RAID Management
summary: Set up and monitor a RAID (status, component devices, sync progress, capabilities, recreate with another
  level); emits tnsaxis:Storage/RAID events.
section: network-video
family: jsonrpc
status: released
python:
  module: raid
  class: Raid
docs:
- https://developer.axis.com/vapix/network-video/raid-management/
access: operator
discovery:
- {api_discovery: raid}

binding:
  path: /axis-cgi/disks/raid.cgi
  major: 1
  versions: ['1.0']
  negotiation:
    get_supported_versions: {key: apiVersions}
  params_placement: params

errors:
  1200: {description: Generic RAID error.}
  1201: {description: RAID level not supported., kind: unsupported}
  1202: {description: Component device error.}
  1100: {description: Internal error., kind: internal}
  2101: {description: Invalid JSON, kind: invalid_argument}
  2102: {description: Method not supported., kind: unsupported}
  2103: {description: Required parameter missing., kind: invalid_argument}
  2104: {description: Invalid parameter value specified., kind: invalid_argument}
  2105: {description: Authorization failed., kind: access_denied}
  2106: {description: Authentication failed.}
  2107: {description: Transport level error.}

types:
  RaidLevel: {type: string, enum: [raid0, raid1, raid5, raid6, raid10]}
  RaidStatus:
    type: string
    enum: [active, degraded, syncing, failure]
    description: active = optimal performance; degraded = missing data redundancy; syncing = synchronizing data
      between components; failure = the RAID has failed.
  ComponentStatus:
    type: string
    enum: [connected, missing, spare]
    description: connected = available in the active RAID; missing = not detected; spare = marked as a hot-spare.
  Component:
    type: object
    properties:
      componentId: {type: string, description: The component device ID. Maps to a hard drive slot.}
      componentStatus: {$ref: '#/types/ComponentStatus'}
      serialNumber: {type: string}
      capacity: {type: integer, description: Capacity in gigabytes.}
  Raid:
    type: object
    properties:
      status: {$ref: '#/types/RaidStatus'}
      syncProgress:
        type: integer
        minimum: 0
        maximum: 100
        description: Percentage of completion during an active sync. 100 when active and not syncing; 0 when degraded
          or failed.
      syncTimeRemaining:
        type: integer
        description: Estimated seconds until an active sync finishes; 0 when not syncing.
      raidLevel: {type: string, description: Configured RAID level.}
      components:
        type: array
        items: {$ref: '#/types/Component'}

operations:
  get_status:
    summary: Check the RAID state and its component devices (connected/missing, serial numbers).
    effect: read
    binding: {method: getStatus}
    result:
      type: object
      properties:
        raids:
          type: array
          items: {$ref: '#/types/Raid'}
    examples:
    - title: get_status
      request:
        params: {}
      response:
        data:
          raids:
          - status: degraded
            syncProgress: 0
            syncTimeRemaining: 0
            raidLevel: raid5
            components:
            - {componentStatus: connected, componentId: '0', serialNumber: ABC123, capacity: 1234}
            - {componentStatus: missing, componentId: '1', serialNumber: unknown, capacity: 0}
            - {componentStatus: connected, componentId: '2', serialNumber: CAB312, capacity: 1234}
      source: https://developer.axis.com/vapix/network-video/raid-management/#check-raid-status
  get_capabilities:
    summary: Retrieve product supported RAID levels.
    effect: read
    binding: {method: getCapabilities}
    result:
      type: object
      properties:
        raidLevels:
          type: array
          items: {$ref: '#/types/RaidLevel'}
    examples:
    - title: get_capabilities
      request:
        params: {}
      response:
        data: {raidLevels: [raid0, raid1, raid5, raid6, raid10]}
      source: https://developer.axis.com/vapix/network-video/raid-management/#retrieve-capabilities
  recreate_raid_on_all_components:
    summary: Set up a RAID on all available components (destroys the active RAID and its data).
    description: Stops, destroys and replaces the active RAID with a new one. Unmount first with /axis-cgi/disks/mount.cgi.
      Creates a logical device in a syncing state usable immediately; it must be formatted and mounted. Can create
      a RAID on fewer components as long as the level is supported for that number.
    access: admin
    effect: unknown
    binding: {method: recreateRaidOnAllComponents}
    params:
      type: object
      required: [raidLevel]
      properties:
        raidLevel:
          type: string
          enum: [raid0, raid1, raid5, raid6, raid10]
          description: The RAID-level. Use getCapabilities for supported levels.
    examples:
    - title: recreate_raid_on_all_components
      request:
        params: {raidLevel: raid10}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/raid-management/#change-raid-level

