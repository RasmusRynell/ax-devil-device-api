format: 2
id: event-service
name: Event service (VAPIX Event service API, event1)
summary: SOAP web service (namespace http://www.axis.com/vapix/ws/event1) to list event instances (topic tree),
  manage scheduled/recurring events and emit virtual input...
section: network-video
family: soap
status: released
python:
  module: event_service
  class: EventService
docs:
- https://developer.axis.com/vapix/network-video/event-and-action-services/
access: admin
requires:
  firmware: '5.50'

binding:
  namespace: http://www.axis.com/vapix/ws/event1
  namespaces:
    aev: http://www.axis.com/vapix/ws/event1
    wstop: http://docs.oasis-open.org/wsn/t-1
    wsnt: http://docs.oasis-open.org/wsn/b-2
    tns1: http://www.onvif.org/ver10/topics
    tnsaxis: http://www.axis.com/2009/event/topics

types:
  NewScheduledEvent:
    type: object
    description: Description of the scheduled event.
    required: [Schedule]
    properties:
      EventID:
        type: string
        description: The Event ID. If omitted, an autogenerated Event ID will be assigned.
      Name: {type: string, description: User defined name for this schedule.}
      Schedule: {$ref: '#/types/Schedule'}
  ScheduledEvents:
    type: object
    properties:
      ScheduledEvent:
        type: array
        items: {$ref: '#/types/ScheduledEvent'}
        description: Description of the scheduled event.
  ScheduledEvent:
    type: object
    required: [EventID, Schedule]
    properties:
      EventID: {type: string, description: The Event ID.}
      Name: {type: string, description: User defined name for the schedule.}
      Schedule: {$ref: '#/types/Schedule'}
  Schedule:
    type: object
    description: Description of the schedule.
    required: [ICalendar]
    properties:
      ICalendar: {$ref: '#/types/ICalendar', description: Schema specification in iCalendar format.}
  ICalendar:
    type: object
    description: Simple content (xs:string) with attributes.
    properties:
      Dialect:
        type: string
        description: The dialect of the ICalendar value. Must be http://www.axis.com/vapix/ws/ical1 (XML attribute)
      value: {type: string, description: Element text content.}
  ScheduleFilter:
    type: object
    properties:
      ScheduleType:
        $ref: '#/types/ScheduledType'
        description: 'The schedule type to be included in the list: Interval - include only interval schedules Pulse
          - include only pulse schedules.'
  ScheduledType: {type: string, enum: [Interval, Pulse]}

operations:
  get_event_instances:
    summary: List all events that can currently occur in the Axis product.
    effect: read
    binding: {action: 'http://www.axis.com/vapix/ws/event1/GetEventInstances', element: GetEventInstances}
    result:
      type: object
      properties:
        wstop:TopicSet: {description: 'wstop:TopicSet event topic tree (see notes).'}
  add_scheduled_event:
    summary: Add a scheduled event.
    effect: write
    write: create
    binding: {action: 'http://www.axis.com/vapix/ws/event1/AddScheduledEvent', element: AddScheduledEvent}
    params:
      type: object
      required: [NewScheduledEvent]
      properties:
        NewScheduledEvent: {$ref: '#/types/NewScheduledEvent'}
    result:
      type: object
      properties:
        EventID: {type: string, description: The Event ID.}
  remove_scheduled_event:
    summary: Remove a schedule.
    effect: write
    write: delete
    binding:
      action: http://www.axis.com/vapix/ws/event1/RemoveScheduledEvent
      element: RemoveScheduledEvent
    params:
      type: object
      required: [EventID]
      properties:
        EventID: {type: string, description: Event ID of the scheduled event to be removed.}
  get_scheduled_events:
    summary: List scheduled events.
    effect: read
    binding:
      action: http://www.axis.com/vapix/ws/event1/GetScheduledEvents
      element: GetScheduledEvents
    params:
      type: object
      properties:
        ScheduleFilter: {$ref: '#/types/ScheduleFilter', description: Optional. Filter the schedules to be included.}
    result:
      type: object
      properties:
        ScheduledEvents: {$ref: '#/types/ScheduledEvents', description: List of requested scheduled events.}
  change_virtual_input_state:
    summary: Change the state of a virtual input port.
    effect: write
    write: patch
    binding:
      action: http://www.axis.com/vapix/ws/event1/ChangeVirtualInputState
      element: ChangeVirtualInputState
    params:
      type: object
      required: [port, active]
      properties:
        port: {type: integer}
        active: {type: boolean}
    result:
      type: object
      properties:
        stateChanged: {type: boolean}

