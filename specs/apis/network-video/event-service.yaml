format: 2
id: event-service
name: Event service (VAPIX Event service API, event1)
summary: SOAP web service (namespace http://www.axis.com/vapix/ws/event1) to list event instances (topic tree),
  manage scheduled/recurring events and emit virtual input...
section: network-video
family: soap
status: released
python:
  module: event_service
  class: EventService
docs:
- https://developer.axis.com/vapix/network-video/event-and-action-services/
access: admin
discovery:
- service: {namespace: 'http://www.axis.com/vapix/ws/event1'}
requires:
  firmware: '5.50'

binding:
  namespace: http://www.axis.com/vapix/ws/event1
  namespaces:
    aev: http://www.axis.com/vapix/ws/event1
    wstop: http://docs.oasis-open.org/wsn/t-1
    wsnt: http://docs.oasis-open.org/wsn/b-2
    tns1: http://www.onvif.org/ver10/topics
    tnsaxis: http://www.axis.com/2009/event/topics

types:
  NewScheduledEvent:
    type: object
    description: Description of the scheduled event.
    required: [Schedule]
    properties:
      EventID:
        type: string
        description: The Event ID. If omitted, an autogenerated Event ID will be assigned.
      Name: {type: string, description: User defined name for this schedule.}
      Schedule: {$ref: '#/types/Schedule'}
  ScheduledEvents:
    type: object
    properties:
      ScheduledEvent:
        type: array
        items: {$ref: '#/types/ScheduledEvent'}
        description: Description of the scheduled event.
  ScheduledEvent:
    type: object
    required: [EventID, Schedule]
    properties:
      EventID: {type: string, description: The Event ID.}
      Name: {type: string, description: User defined name for the schedule.}
      Schedule: {$ref: '#/types/Schedule'}
  Schedule:
    type: object
    description: Description of the schedule.
    required: [ICalendar]
    properties:
      ICalendar: {$ref: '#/types/ICalendar'}
  ICalendar:
    type: object
    required: ['#text']
    description: A schedule in the supported subset of iCalendar (RFC 5545), as the text of the element ``ICalendar``.
    properties:
      '@Dialect':
        type: string
        x-python-name: dialect
        x-xml: {attribute: Dialect}
        description: The dialect of the value. Must be ``http://www.axis.com/vapix/ws/ical1`` (the default of the WSDL, so it may be left out; the docs examples do).
      '#text':
        type: string
        x-python-name: value
        x-xml: text
        description: 'DTSTART, DTEND (interval schedules only) and RRULE, e.g. "DTSTART:20111212T06:00 DTEND:20111212T09:00 RRULE:FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR". The start and end are the product''s local time without a time zone.'
  ScheduleFilter:
    type: object
    properties:
      ScheduleType:
        $ref: '#/types/ScheduledType'
        description: 'The schedule type to be included in the list: Interval - include only interval schedules Pulse
          - include only pulse schedules.'
  ScheduledType: {type: string, enum: [Interval, Pulse]}

operations:
  get_event_instances:
    summary: List all events that can currently occur in the Axis product.
    effect: read
    binding: {action: 'http://www.axis.com/vapix/ws/event1/GetEventInstances', element: GetEventInstances}
    description: >-
      The reply element ``GetEventInstancesResponse`` is returned as an ``xml.etree.ElementTree.Element``: it holds a
      ``wstop:TopicSet`` tree whose element names are the topics, so it cannot be a typed result. Walk it by local name.
    result: {x-xml: true}
    examples:
    - title: List the event instances
      request:
        body: '<m:GetEventInstances xmlns:m="http://www.axis.com/vapix/ws/event1" />'
        params: {}
      response:
        text: '<aev:GetEventInstancesResponse xmlns:aev="http://www.axis.com/vapix/ws/event1" xmlns:wstop="http://docs.oasis-open.org/wsn/t-1" xmlns:tns1="http://www.onvif.org/ver10/topics" xmlns:tnsaxis="http://www.axis.com/2009/event/topics"><wstop:TopicSet><tns1:AudioSource><tnsaxis:TriggerLevel aev:NiceName="Audio detection" wstop:topic="true"><aev:MessageInstance aev:isProperty="true"><aev:SourceInstance><aev:SimpleItemInstance aev:NiceName="Channel" Type="xsd:int" Name="channel"><aev:Value>1</aev:Value></aev:SimpleItemInstance></aev:SourceInstance><aev:DataInstance><aev:SimpleItemInstance aev:NiceName="Above alarm level" Type="xsd:boolean" Name="triggered" isPropertyState="true" /></aev:DataInstance></aev:MessageInstance></tnsaxis:TriggerLevel></tns1:AudioSource></wstop:TopicSet></aev:GetEventInstancesResponse>'
      source: https://developer.axis.com/vapix/network-video/event-and-action-services/#list-events-using-http
  add_scheduled_event:
    summary: Add a scheduled event.
    effect: write
    write: create
    binding: {action: 'http://www.axis.com/vapix/ws/event1/AddScheduledEvent', element: AddScheduledEvent}
    params:
      type: object
      required: [NewScheduledEvent]
      properties:
        NewScheduledEvent: {$ref: '#/types/NewScheduledEvent'}
    result:
      type: object
      properties:
        EventID: {type: string, description: The Event ID.}
    examples:
    - title: Create an interval schedule, 6 am to 9 am Monday through Friday
      request:
        params:
          NewScheduledEvent:
            Name: My schedule
            Schedule:
              ICalendar: {'#text': 'DTSTART:20111212T06:00 DTEND:20111212T09:00 RRULE:FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR'}
      source: https://developer.axis.com/vapix/network-video/event-and-action-services/#create-a-scheduled-event
  remove_scheduled_event:
    summary: Remove a schedule.
    effect: write
    write: delete
    binding:
      action: http://www.axis.com/vapix/ws/event1/RemoveScheduledEvent
      element: RemoveScheduledEvent
    params:
      type: object
      required: [EventID]
      properties:
        EventID: {type: string, description: Event ID of the scheduled event to be removed.}
  get_scheduled_events:
    summary: List scheduled events.
    effect: read
    binding:
      action: http://www.axis.com/vapix/ws/event1/GetScheduledEvents
      element: GetScheduledEvents
    params:
      type: object
      properties:
        ScheduleFilter: {$ref: '#/types/ScheduleFilter', description: Optional. Filter the schedules to be included.}
    result:
      type: object
      properties:
        ScheduledEvents: {$ref: '#/types/ScheduledEvents', description: List of requested scheduled events.}
  change_virtual_input_state:
    summary: Change the state of a virtual input port; this emits a (stateful) virtual input event.
    effect: action
    binding:
      action: http://www.axis.com/vapix/ws/event1/ChangeVirtualInputState
      element: ChangeVirtualInputState
    params:
      type: object
      required: [port, active]
      properties:
        port: {type: integer}
        active: {type: boolean}
    result:
      type: object
      properties:
        stateChanged: {type: boolean}

sources:
- url: https://developer.axis.com/vapix/network-video/event-and-action-services/
  sha256_md: 871fd7e46fd74e2dc9ae6a727b44ed1b5f0c15eefcde1bd0a19086dc8edc2c2d
  retrieved_at: '2026-10-11'

provenance:
  completeness: complete
  open_questions:
  - Security levels for SOAP operations are not documented; the API default (admin) is kept.
  - 'Topic names for IP address added/removed lack the tnsaxis: prefix on the last segment (Network/AddressAdded) as documented.'
  - 'Media clip event topics are documented starting with tnsaxis:MediaClip (no tns1: root).'
  - 'Open casing event: Source instance "Not applicable" yet a value table (JunctionBox) is shown.'
  - Fault SOAP subcodes/reasons are not documented beyond WSDL fault element names, so no errors are declared.
  - SOAPAction values are not documented; <namespace>/<operation> is assumed (the HTTP example for GetEventInstances confirms it for that operation).
  - The v1 spec typed ICalendar with a Dialect attribute (http://www.axis.com/vapix/ws/ical1, from the WSDL); the docs show <aev:ICalendar> without it, so the Dialect attribute is optional (the WSDL gives it a default) and ICalendar is an object with the schedule text in ``value``.
  - 'The only documented examples for add_scheduled_event are C# code; the example is derived from it and has no response. Reply shapes of add_scheduled_event, get_scheduled_events, remove_scheduled_event and change_virtual_input_state are undocumented (taken from the WSDL via v1).'
  - Duplicates no service_json spec; the event service is SOAP only.
  migrated_from: v1
  curated: true
