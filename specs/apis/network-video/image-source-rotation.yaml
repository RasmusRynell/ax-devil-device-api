format: 2
id: image-source-rotation
name: Image source rotation
summary: param.cgi parameters to detect and control image source rotation and auto rotation.
section: network-video
family: cgi
status: released
python:
  module: image_source_rotation
  class: ImageSourceRotation
docs:
- https://developer.axis.com/vapix/network-video/image-source-rotation/
access: viewer
requires:
  firmware: '8.40'

binding: {path: /axis-cgi/param.cgi}

operations:
  list_image_source:
    summary: Query ImageSource.I# parameters (SourceRotation, Rotation, AutoRotationEnabled).
    effect: read
    binding:
      method: GET
      query: {action: list}
      reply:
        text_kv: {strip_prefix: root.}
    params:
      type: object
      required: [group]
      properties:
        group:
          type: string
          description: 'e.g. ImageSource.I0. # ranges from 0 to number of image sources - 1.'
    result:
      type: object
      additionalProperties: {type: string}
    examples:
    - title: Check if image source rotation is present
      request:
        query: {group: ImageSource.I0}
      response:
        status: 200
        text: |-
          ...
          root.ImageSource.I0.SourceRotation=yes
          root.ImageSource.I0.Rotation=180
          ...
      source: https://developer.axis.com/vapix/network-video/image-source-rotation/#image-source-rotation
    - title: Check auto rotation
      request:
        query: {group: ImageSource.I0}
      response:
        status: 200
        text: |-
          ...
          root.ImageSource.I0.AutoRotationEnabled=yes
          ...
      source: https://developer.axis.com/vapix/network-video/image-source-rotation/#auto-rotation
  set_rotation:
    summary: Set the image source rotation angle.
    access: operator
    effect: write
    write: patch
    binding:
      method: GET
      query: {action: update}
      reply: text
    params:
      type: object
      required: [ImageSource.I#.Rotation]
      properties:
        ImageSource.I#.Rotation:
          type: integer
          enum: [0, 90, 180, 270]
          description: 'Desired rotation angle from the set defined by Properties.Image.Rotation (typically 0, 90,
            180, 270). # = image source index.'
  set_auto_rotation_enabled:
    summary: Enable or disable auto rotation.
    access: operator
    effect: write
    write: patch
    binding:
      method: GET
      query: {action: update}
      reply: text
    params:
      type: object
      required: [ImageSource.I#.AutoRotationEnabled]
      properties:
        ImageSource.I#.AutoRotationEnabled: {type: string, enum: ['yes', 'no']}

