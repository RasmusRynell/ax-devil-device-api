format: 2
id: dewarped-views
name: Dewarped views
summary: param.cgi parameters and stream arguments for using the view modes (dewarped views) of Axis 360°/180° cameras.
section: network-video
family: cgi
status: released
python:
  module: dewarped_views
  class: DewarpedViews
docs:
- https://developer.axis.com/vapix/network-video/dewarped-views/
access: admin
discovery:
- param: {name: Properties.Image.Dewarp, value: 'yes'}

binding: {path: /axis-cgi/param.cgi}

operations:
  list_parameters:
    summary: List dewarping-related parameters (Properties.Image.Dewarp, Properties.Image.NbrOfViews, Properties.Image.I<#>.*,
      Image.*.Name, Image.I<#>.Enabled...
    effect: read
    binding:
      method: GET
      query: {action: list}
      reply:
        text_kv: {strip_prefix: root.}
    params:
      type: object
      required: [group]
      properties:
        group: {type: string, description: 'Parameter group, wildcards allowed (e.g. Image.*.Name).'}
    result:
      type: object
      additionalProperties: {type: string}
    examples:
    - title: Identification
      request:
        query: {group: Properties.Image.Dewarp}
      response: {status: 200, text: Properties.Image.Dewarp=yes}
      source: https://developer.axis.com/vapix/network-video/dewarped-views/#identification
    - title: Number of views
      request:
        query: {group: Properties.Image.NbrOfViews}
      response: {status: 200, text: <int>}
      source: https://developer.axis.com/vapix/network-video/dewarped-views/#enable-and-configure-views
    - title: Supported resolutions/rotations for view mode Overview
      request:
        query: {group: Properties.Image.I0}
      response:
        status: 200
        text: |-
          root.Properties.Image.I0.Rotation=0,180
          root.Properties.Image.I0.Resolution=2592x1944,2048x1536,1600x1200,1280x960,1024x768,
          800x600,640x480,480x360,320x240,240x180,160x120
      source: https://developer.axis.com/vapix/network-video/dewarped-views/#check-valid-resolutions-and-rotations
  set_camera_tilt_orientation:
    summary: Set the camera orientation (mounting position), which affects view modes and PTZ.
    effect: write
    write: patch
    binding: {method: GET, reply: text}
    params:
      type: object
      required: [ImageSource.I0.CameraTiltOrientation]
      properties:
        ImageSource.I0.CameraTiltOrientation: {type: integer, enum: [-90, 0, 90]}

