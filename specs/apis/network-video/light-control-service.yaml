    summary: Enable automatic light intensity control.
    effect: write
    write: patch
    binding:
      action: http://www.axis.com/vapix/ws/light/SetAutomaticIntensityMode
      element: SetAutomaticIntensityMode
    params:
      type: object
      required: [LightID, Automatic]
      properties:
        LightID: {type: string, description: The Light ID}
        Automatic: {type: boolean}
  set_manual_intensity:
    summary: Set the intensity manually.
    effect: write
    write: patch
    binding: {action: 'http://www.axis.com/vapix/ws/light/SetManualIntensity', element: SetManualIntensity}
    params:
      type: object
      required: [LightID, Intensity]
      properties:
        LightID: {type: string, description: The Light ID}
        Intensity: {type: integer, description: The intensity to set.}
  set_individual_intensity:
    summary: Set the intensity individually.
    effect: write
    write: patch
    binding:
      action: http://www.axis.com/vapix/ws/light/SetIndividualIntensity
      element: SetIndividualIntensity
    params:
      type: object
