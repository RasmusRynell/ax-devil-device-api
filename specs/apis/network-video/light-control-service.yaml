  namespaces: {ali: 'http://www.axis.com/vapix/ws/light'}

types:
  LightInformationList:
    type: object
    properties:
      LightInformation:
        type: array
        items: {$ref: '#/types/LightInformation'}
        description: Light Information.
  LightInformation:
    type: object
    required:
    - LightID
    - LightType
    - Enabled
    - SynchronizeDayNightMode
    - LightState
    - AutomaticIntensityMode
    - AutomaticAngleOfIlluminationMode
    - Error
    - ErrorInfo
    properties:
      LightID: {type: string, description: The Light ID}
      LightType: {type: string, description: The light type.}
      Enabled: {type: boolean, description: The light is enabled.}
      SynchronizeDayNightMode: {type: boolean, description: Indicating if the light is synchronized with day night.}
      LightState: {type: boolean, description: Indicating if the light ON or OFF.}
      AutomaticIntensityMode: {type: boolean, description: Indicating if the mode of automatic intensity.}
      AutomaticAngleOfIlluminationMode: {type: boolean, description: Indicating if the mode of automatic angle of
          illumination.}
      Error: {type: boolean, description: An error has occurred.}
      ErrorInfo: {type: string, description: Error description.}
  Capabilities:
    type: object
    required:
    - AutomaticIntensitySupport
    - ManualIntensitySupport
    - IndividualIntensitySupport
    - GetCurrentIntensitySupport
    - ManualAngleOfIlluminationSupport
    - AutomaticAngleOfIlluminationSupport
    - DayNightSynchronizeSupport
    properties:
      AutomaticIntensitySupport: {type: boolean, description: SetAutomaticIntensityMode is supported.}
      ManualIntensitySupport: {type: boolean, description: GetManualIntensity and SetManualIntensity are supported.}
      IndividualIntensitySupport:
        type: boolean
        description: GetIndividualIntensity, SetIndividualIntensity and GetNumberOfLeds are supported.
      GetCurrentIntensitySupport: {type: boolean, description: GetCurrentIntensity is supported.}
      ManualAngleOfIlluminationSupport: {type: boolean, description: SetManualAngleOfIllumination is supported.}
      AutomaticAngleOfIlluminationSupport: {type: boolean, description: SetAutomaticAngleOfIlluminationMode is supported.}
      DayNightSynchronizeSupport: {type: boolean, description: SetLightSynchronizeDayNightMode is supported.}
  IntRangeList:
    type: object
    properties:
      IntRange:
        type: array
        items: {$ref: '#/types/IntRange'}
        description: A list of IntRange objects.
  IntRange:
    type: object
    required: [Low, High]
    properties:
      Low: {type: integer, description: The lowest value in the range.}
      High: {type: integer, description: The highest value in the range.}

operations:
  activate_light:
    summary: Activate the light.
    effect: action
    binding: {action: 'http://www.axis.com/vapix/ws/light/ActivateLight', element: ActivateLight}
    params:
      type: object
      required: [LightID]
      properties:
        LightID: {type: string, description: The Light ID}
  deactivate_light:
    summary: Deativate the light.
    effect: action
    binding: {action: 'http://www.axis.com/vapix/ws/light/DeactivateLight', element: DeactivateLight}
    params:
      type: object
      required: [LightID]
      properties:
        LightID: {type: string, description: The Light ID}
  enable_light:
    summary: Enable the light functionality.
    effect: write
    write: patch
    binding: {action: 'http://www.axis.com/vapix/ws/light/EnableLight', element: EnableLight}
    params:
      type: object
      required: [LightID]
      properties:
        LightID: {type: string, description: The Light ID}
  disable_light:
    summary: Disable the light functionality.
    effect: write
    write: patch
    binding: {action: 'http://www.axis.com/vapix/ws/light/DisableLight', element: DisableLight}
    params:
      type: object
      required: [LightID]
      properties:
        LightID: {type: string, description: The Light ID}
