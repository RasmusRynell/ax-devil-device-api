      type: object
      required: [LightInfo]
      properties:
        LightInfo: {$ref: '#/types/LightInformationList', description: Available light information.}
  get_service_capabilities:
    summary: List the light service capablilities.
    effect: read
    binding:
      action: http://www.axis.com/vapix/ws/light/GetServiceCapabilities
      element: GetServiceCapabilities
    result:
      type: object
      required: [Capabilities]
      properties:
        Capabilities:
          $ref: '#/types/Capabilities'
          description: Capabilities supported by the Light Control Service.
