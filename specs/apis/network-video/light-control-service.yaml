    summary: Get number of IR leds
    effect: read
    binding: {action: 'http://www.axis.com/vapix/ws/light/GetNumberOfLeds', element: GetNumberOfLeds}
    params:
      type: object
      required: [LightID]
      properties:
        LightID: {type: string, description: The Light ID}
    result:
      type: object
      required: [NrOfLeds]
      properties:
        NrOfLeds: {type: integer, description: Number of IR leds provided in the request.}
  get_light_status:
    summary: Get the light status of a given Light ID.
    effect: read
    binding: {action: 'http://www.axis.com/vapix/ws/light/GetLightStatus', element: GetLightStatus}
    params:
      type: object
      required: [LightID]
      properties:
        LightID: {type: string, description: The Light ID}
    result:
      type: object
      required: [Status]
      properties:
        Status: {type: boolean, description: The light is active or inactive.}
  get_light_information:
    summary: List light control information.
    effect: read
    binding:
      action: http://www.axis.com/vapix/ws/light/GetLightInformation
      element: GetLightInformation
