        LedID: {type: integer, description: The Led ID}
    result:
      type: object
      required: [Intensity]
      properties:
        Intensity: {type: integer, description: Intensity provided in the request.}
  get_current_intensity:
    summary: Get the current intensity.
    effect: read
    binding:
      action: http://www.axis.com/vapix/ws/light/GetCurrentIntensity
      element: GetCurrentIntensity
    params:
