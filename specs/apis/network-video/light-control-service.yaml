format: 2
id: light-control-service
name: Light control service API
summary: Legacy SOAP web service (namespace http://www.axis.com/vapix/ws/light) to control built-in lights; superseded
  by the Light control API.
section: network-video
family: soap
status: deprecated
python:
  module: light_control_service
  class: LightControlService
docs:
