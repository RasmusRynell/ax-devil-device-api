            eventFilterList:
            - {topicFilter: 'onvif:Device/axis:IO/VirtualPort', qos: 0, retain: none}
            - {topicFilter: 'onvif:Device/axis:Status/SystemReady', qos: 0, retain: none}
            - {topicFilter: 'onvif:Device/axis:Status//.', qos: 0, retain: none}
      source: https://developer.axis.com/vapix/network-video/mqtt-event-bridge/#get-event-publication-configuration
    - title: Get event publication configuration (error)
