types:
  EventFilter:
    type: object
    properties:
      topicFilter: {type: string, description: A subscription filter that should be used in the Event system.}
      qos:
        type: integer
        enum: [0, 1, 2]
        default: 0
        description: A Qos policy that should be used when publishing any event from this filter. Possible values
          are `0`, `1`, `2`. Default value is `0`.
      retain:
        type: string
        enum: [none, property, all]
        default: none
        description: A retain policy that should be used when publishing any event from this filter.
  MqttFilter:
    type: object
    properties:
      topicFilter:
        type: string
        description: An MQTT subscription topic filter that should be used together with the external broker. Please
          note that `+` and `#` are only allowed for stateless event conversions, i.e. when the `isStateData` is
          set to false.
      useDeviceTopicPrefix:
        type: boolean
        default: false
        description: Governs the use of the device topic prefixes on subscriptions.
      qos:
        type: integer
        enum: [0, 1, 2]
        default: 0
        description: The MQTT subscription QoS that should be used together with the external broker. Possible values
          are 0, 1, 2. Default value is 0.
      isStateData:
        type: boolean
        default: false
        description: Specifies if matching MQTT messages contain state data.
  EventPublicationConfig:
    type: object
    properties:
      topicPrefix:
        type: string
        enum: [default, custom]
        default: default
        description: Controls the topic prefix.
      customTopicPrefix:
        type: string
        description: Specifies which custom topic prefix that should be used. If `topicPrefix` is set to `custom`,
          this parameter will also be required.
      appendEventTopic:
        type: boolean
        default: true
        description: If this parameter is set to true (its default value), the topic of the event will be appended
          to the prefix. [doc type column says String; description and examples use boolean]
      includeTopicNamespaces:
        type: boolean
        default: true
        description: Specifies if ONVIF topic namespaces should be included in the MQTT message topic. The default
          value is `true`.
      includeSerialNumberInPayload:
        type: boolean
        default: false
        description: Specifies if a serial number should be included in the payload message. The default value is
          `false`.
      eventFilterList:
        type: array
        items: {$ref: '#/types/EventFilter'}
  MqttSubscriptionConfig:
    type: object
    properties:
      mqttFilterList:
        type: array
        items: {$ref: '#/types/MqttFilter'}

operations:
  configure_event_publication:
    summary: Select events that should be published (configures event publishing).
    effect: write
    write: replace
    binding: {method: configureEventPublication}
    params:
      type: object
      required: [eventFilterList]
      properties:
        topicPrefix:
          type: string
          enum: [default, custom]
          default: default
          description: Controls the topic prefix.
        customTopicPrefix:
          type: string
          description: Specifies which custom topic prefix that should be used. If `topicPrefix` is set to `custom`,
            this parameter will also be required.
        appendEventTopic:
          type: boolean
          default: true
          description: If this parameter is set to true (its default value), the topic of the event will be appended
            to the prefix. [doc type column says String; description and examples use boolean]
        includeTopicNamespaces:
          type: boolean
          default: true
          description: Specifies if ONVIF topic namespaces should be included in the MQTT message topic. The default
            value is `true`.
        includeSerialNumberInPayload:
          type: boolean
          default: false
          description: Specifies if a serial number should be included in the payload message. The default value
            is `false`.
        eventFilterList:
          type: array
          items:
            type: object
            x-name: ConfigureEventPublicationRequestEventFilterListItem
            properties:
              topicFilter: {type: string, description: A subscription filter that should be used in the Event system.}
              qos:
                type: integer
                enum: [0, 1, 2]
                default: 0
                description: A Qos policy that should be used when publishing any event from this filter. Possible
                  values are `0`, `1`, `2`. Default value is `0`.
              retain:
                type: string
                enum: [none, property, all]
                default: none
                description: A retain policy that should be used when publishing any event from this filter.
          description: 'A list of filters that should be applied on messages originating from the Event system.
            If a message matches multiple filters it will be published several times. [doc type: Object list]'
    examples:
    - title: Configure an event publication
      request:
        params:
          eventFilterList:
          - {topicFilter: 'onvif:PTZController/axis:PTZReady'}
          - {topicFilter: 'onvif:Device/axis:IO/VirtualInput'}
          - {topicFilter: 'onvif:Device/axis:Status//.'}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/mqtt-event-bridge/#configure-an-event-publication
    - title: Configure an event publication (error)
      request:
