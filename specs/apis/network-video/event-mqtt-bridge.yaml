format: 2
id: event-mqtt-bridge
name: MQTT Event Bridge
summary: 'Bridge Event Service events and MQTT: publish selected device events to the broker and convert subscribed MQTT messages
  into events.'
section: network-video
family: jsonrpc
status: released
python:
  module: mqtt_event_bridge
  class: MqttEventBridge
docs:
- https://developer.axis.com/vapix/network-video/mqtt-event-bridge/
access: admin
discovery:
- api_discovery: event-mqtt-bridge
binding:
  path: /axis-cgi/mqtt/event.cgi
  major: 1
  versions:
  - '1.0'
  - '1.1'
  negotiation:
    get_supported_versions:
      key: apiVersions
  params_placement: params
errors:
  1100:
    description: Internal error.
    kind: internal
  2100:
    description: API version not supported.
    kind: unsupported
  2101:
    description: Invalid JSON format.
    kind: invalid_argument
  2102:
    description: Method not supported.
    kind: unsupported
  2103:
    description: Required parameter missing or invalid.
    kind: invalid_argument
  2104:
    description: Invalid parameter value specified.
    kind: invalid_argument
  2105:
    description: Authorization failure.
    kind: access_denied
  2106:
    description: Request size too large.
    kind: invalid_argument
types:
  Qos:
    enum:
    - 0
    - 1
    - 2
    default: 0
  Retain:
    enum:
    - none
    - property
    - all
    default: none
    description: 'none: all messages are sent non-retained. property: events are sent non-retained and property states retained.
      all: all messages are sent retained.'
  TopicPrefix:
    enum:
    - default
    - custom
    default: default
    description: default uses <serial number>/event as the prefix; custom uses customTopicPrefix.
  EventFilter:
    type: object
    description: Selects events to publish.
    required:
    - topicFilter
    properties:
      topicFilter:
        type: string
        description: A subscription filter for the Event system, based on ONVIF "Concrete topic expressions".
      qos:
        $ref: '#/types/Qos'
        description: QoS policy used when publishing events from this filter. Default 0.
      retain:
        $ref: '#/types/Retain'
        description: Retain policy used when publishing events from this filter. Default none.
  EventPublicationConfig:
    type: object
    description: Event publication settings, as reported by the device.
    properties:
      topicPrefix:
        $ref: '#/types/TopicPrefix'
        description: Controls the topic prefix.
      customTopicPrefix:
        type: string
        description: The custom topic prefix. Required if topicPrefix is custom.
      appendEventTopic:
        type: boolean
        default: true
        description: Append the topic of the event to the prefix. Default true. (The docs type column says String; the description
          and examples use a boolean.)
      includeTopicNamespaces:
        type: boolean
        default: true
        description: Include ONVIF topic namespaces in the MQTT message topic. Default true.
      includeSerialNumberInPayload:
        type: boolean
        default: false
        description: Include the serial number in the payload message. Default false.
      eventFilterList:
        type: array
        items:
          $ref: '#/types/EventFilter'
        description: Filters applied to messages from the Event system. A message that matches several filters is published
          several times.
  ConfigureEventPublicationRequest:
    type: object
    description: Arguments of configure_event_publication. Replaces the event publication configuration.
    required:
    - eventFilterList
    properties:
      topicPrefix:
        $ref: '#/types/TopicPrefix'
        description: Controls the topic prefix.
      customTopicPrefix:
        type: string
        description: The custom topic prefix. Required if topicPrefix is custom.
      appendEventTopic:
        type: boolean
        default: true
        description: Append the topic of the event to the prefix. Default true. (The docs type column says String; the description
          and examples use a boolean.)
      includeTopicNamespaces:
        type: boolean
        default: true
        description: Include ONVIF topic namespaces in the MQTT message topic. Default true.
      includeSerialNumberInPayload:
        type: boolean
        default: false
        description: Include the serial number in the payload message. Default false.
      eventFilterList:
        type: array
        items:
          $ref: '#/types/EventFilter'
        description: Filters applied to messages from the Event system. A message that matches several filters is published
          several times.
  EventPublicationConfigResult:
    type: object
    required:
    - eventPublicationConfig
    properties:
      eventPublicationConfig:
        $ref: '#/types/EventPublicationConfig'
        description: All options used for event publishing.
  MqttFilter:
    type: object
    description: Selects incoming MQTT messages to convert to events.
    required:
    - topicFilter
    properties:
      topicFilter:
        type: string
        description: 'An MQTT subscription topic filter used with the external broker. + and # are only allowed for stateless
          conversions (isStateData false).'
      useDeviceTopicPrefix:
        type: boolean
        default: false
        description: Prefix topicFilter with the device topic prefix of the MQTT client configuration. Default false.
      qos:
        $ref: '#/types/Qos'
        description: MQTT subscription QoS used with the external broker. Default 0.
      isStateData:
        type: boolean
        default: false
        description: If true, matching messages are converted to stateful (property) events; otherwise to stateless events.
          Default false.
  ConfigureMqttSubscriptionRequest:
    type: object
    description: Arguments of configure_mqtt_subscription. Replaces the subscription configuration.
    required:
    - mqttFilterList
    properties:
      mqttFilterList:
        type: array
        items:
          $ref: '#/types/MqttFilter'
        description: MQTT topic filters used to subscribe to the external broker. Matching messages are converted to internal
          events.
  MqttSubscriptionConfig:
    type: object
    properties:
      mqttFilterList:
        type: array
        items:
          $ref: '#/types/MqttFilter'
  MqttSubscriptionConfigResult:
    type: object
    required:
    - mqttSubscriptionConfig
    properties:
      mqttSubscriptionConfig:
        $ref: '#/types/MqttSubscriptionConfig'
        description: All subscription options.
operations:
  configure_event_publication:
    summary: Select the events to publish to the MQTT broker.
    effect: write
    write: replace
    binding:
      method: configureEventPublication
    params:
      $ref: '#/types/ConfigureEventPublicationRequest'
    examples:
    - title: Configure an event publication
      request:
        params:
          eventFilterList:
          - topicFilter: onvif:PTZController/axis:PTZReady
          - topicFilter: onvif:Device/axis:IO/VirtualInput
          - topicFilter: onvif:Device/axis:Status//.
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/mqtt-event-bridge/#configure-an-event-publication
    - title: Configure an event publication fails
      request:
        params:
          eventFilterList:
          - topicFilter: onvif:PTZController/axis:PTZReady
          - topicFilter: onvif:Device/axis:IO/VirtualInput
          - topicFilter: onvif:Device/axis:Status//.
      response:
        error:
          code: 1100
          message: Internal Error
      source: https://developer.axis.com/vapix/network-video/mqtt-event-bridge/#configure-an-event-publication
    description: Event publication is only enabled once filters are set. Filters apply to topics only; payload filtering is
      not possible.
    round_trip:
      from: EventPublicationConfig
  get_event_publication_config:
    summary: Return the event publication configuration.
    effect: read
    binding:
      method: getEventPublicationConfig
    result:
      $ref: '#/types/EventPublicationConfigResult'
    examples:
    - title: Get event publication configuration
      request:
        params: {}
      response:
        data:
          eventPublicationConfig:
            topicPrefix: default
            customTopicPrefix: ''
            appendEventTopic: true
            includeTopicNamespaces: true
            includeSerialNumberInPayload: false
            eventFilterList:
            - topicFilter: onvif:Device/axis:IO/VirtualPort
              qos: 0
              retain: none
            - topicFilter: onvif:Device/axis:Status/SystemReady
              qos: 0
              retain: none
            - topicFilter: onvif:Device/axis:Status//.
              qos: 0
              retain: none
      source: https://developer.axis.com/vapix/network-video/mqtt-event-bridge/#get-event-publication-configuration
    - title: Get event publication configuration fails
      request:
        params: {}
      response:
        error:
          code: 1100
          message: Internal Error
      source: https://developer.axis.com/vapix/network-video/mqtt-event-bridge/#get-event-publication-configuration
  configure_mqtt_subscription:
    summary: 'Configure the MQTT subscription: incoming MQTT messages converted to events.'
    effect: write
    write: replace
    binding:
      method: configureMqttSubscription
    params:
      $ref: '#/types/ConfigureMqttSubscriptionRequest'
    examples:
    - title: Configure MQTT subscription
      request:
        params:
          mqttFilterList:
          - topicFilter: building/A/door/10/opened
            qos: 1
            isStateData: false
          - topicFilter: building/A/window/10/state
            qos: 0
            isStateData: true
          - topicFilter: building/+/window/#
            qos: 1
            isStateData: false
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/mqtt-event-bridge/#configure-mqtt-subscription
    - title: Configure MQTT subscription fails
      request:
        params:
          mqttFilterList:
          - topicFilter: building/A/door/10/opened
            qos: 1
            isStateData: false
          - topicFilter: building/A/window/10/state
            qos: 0
            isStateData: true
          - topicFilter: building/+/window/#
            qos: 1
            isStateData: false
      response:
        error:
          code: 1100
          message: Internal Error
      source: https://developer.axis.com/vapix/network-video/mqtt-event-bridge/#configure-mqtt-subscription
    since: '1.1'
    description: A subscription is required to enable MQTT message to event conversion. Messages published by other clients
      on the same broker can be consumed within the platform.
    round_trip:
      from: MqttSubscriptionConfig
  get_mqtt_subscription_config:
    summary: Return the MQTT subscription configuration.
    effect: read
    binding:
      method: getMqttSubscriptionConfig
    result:
      $ref: '#/types/MqttSubscriptionConfigResult'
    examples:
    - title: Retrieve MQTT subscription configuration
      request:
        params: {}
      response:
        data:
          mqttSubscriptionConfig:
            mqttFilterList:
            - topicFilter: building/A/door/10/opened
              useDeviceTopicPrefix: false
              qos: 1
              isStateData: false
            - topicFilter: building/A/window/10/state
              useDeviceTopicPrefix: false
              qos: 0
              isStateData: true
            - topicFilter: building/+/window/#
              useDeviceTopicPrefix: false
              qos: 1
              isStateData: false
      source: https://developer.axis.com/vapix/network-video/mqtt-event-bridge/#retrieve-mqtt-subscription-configurations
    - title: Retrieve MQTT subscription configuration fails
      request:
        params: {}
      response:
        error:
          code: 1100
          message: Internal Error
      source: https://developer.axis.com/vapix/network-video/mqtt-event-bridge/#retrieve-mqtt-subscription-configurations
    since: '1.1'
sources:
- url: https://developer.axis.com/vapix/network-video/mqtt-event-bridge/
  sha256_md: 64bea450e6949b5924834499cabfe9ad5e865333fa48f8ddc7c97a7b9ab261a6
  retrieved_at: '2026-10-11'
provenance:
  completeness: complete
  open_questions:
  - The parameter table types appendEventTopic as String, but the description and examples use a boolean; a boolean is used.
  - The event topic created for converted incoming MQTT messages is not documented on this page.
  - The examples of the subscription methods use apiVersion 1.1, so they are gated with since 1.1. The page does not say which
    version added useDeviceTopicPrefix.
  - The getSupportedVersions example returns apiVersion 2.1 while the methods use 1.0 and 1.1.
  - The ID event-mqtt-bridge differs from the page slug mqtt-event-bridge.
  - The minimum AXIS OS version is not stated.
  migrated_from: v1
  curated: true
