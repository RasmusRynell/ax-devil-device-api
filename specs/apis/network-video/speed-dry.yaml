format: 2
id: speed-dry
name: Speed dry API
summary: Shake a PTZ dome so water runs off and dries faster (one-shot speed dry); get speed dry capabilities.
section: network-video
family: cgi
status: released
python:
  module: speed_dry
  class: SpeedDry
docs:
- https://developer.axis.com/vapix/network-video/pantiltzoom-api/
access: viewer
discovery:
- param: {name: Properties.API.HTTP.Version, value: '3'}
- param: {name: Properties.SpeedDry.SpeedDry, value: 'yes'}
requires:
  firmware: '5.65'

binding: {path: /axis-cgi/com/ptz.cgi}

operations:
  speed_dry:
    summary: Execute a one-shot speed dry operation through ptz.cgi.
    description: >-
      After the operation has finished the device is idle for about 20 seconds, during which other speed dry requests are
      discarded. The reply carries no success or failure information.
    effect: action
    binding:
      method: GET
      query: {auxiliary: speeddry}
      reply: xml
  get_capabilities:
    summary: Get the speed dry capabilities (one ``path type`` line per supported attribute).
    effect: read
    binding: {path: /axis-cgi/speeddry/getcapabilities.cgi, method: GET, reply: text}
    result: {type: string}
    examples:
    - title: Get speed dry capabilities
      request:
        query: {}
      response:
        status: 200
        text: |-
          operations/oneshot/@method xs:enum
          operations/oneshot/@runtime xs:integer
          operations/oneshot/@idletime xs:integer
      source: https://developer.axis.com/vapix/network-video/pantiltzoom-api/#common-examples-2
  oneshot:
    summary: Initiate a one-shot speed dry operation.
    effect: action
    binding: {path: /axis-cgi/speeddry/oneshot.cgi, method: GET, reply: xml}
    examples:
    - title: Initiate a speed dry operation
      request:
        query: {}
      response: {status: 200, text: ''}
      source: https://developer.axis.com/vapix/network-video/pantiltzoom-api/#common-examples-2

sources:
- url: https://developer.axis.com/vapix/network-video/pantiltzoom-api/
  sha256_md: b1dc685e0bec7a017399a605bfd9687f3d7fa81ef8e929c4a119a65719e79416
  retrieved_at: '2026-10-11'

provenance:
  completeness: partial
  open_questions:
  - The arguments of oneshot.cgi (the method, runtime and idletime attributes listed by getcapabilities.cgi) are not documented, so oneshot takes none.
  - The general success response lists both 200 application/json and 204 No content; the documented bodies are empty. An error replies with a speeddryResponse/GeneralError XML body; the xml codec raises it and accepts an empty success body.
  - The capabilities response in the docs says "sx:integer" for idletime (typo for xs:integer); corrected in the example.
  - Access is "Administrator, Operator, Viewer with PTZ control" for the ptz.cgi call; getcapabilities.cgi and oneshot.cgi access is not stated.
  - No API Discovery id is stated.
  migrated_from: v1
  curated: true
