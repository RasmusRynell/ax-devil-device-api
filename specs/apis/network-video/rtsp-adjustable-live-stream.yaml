# Migrated from the v1 corpus by codegen/migrate_v1.py; not yet curated.
format: 2
id: rtsp-adjustable-live-stream
name: RTSP Adjustable Live Stream
summary: Change a subset of an ongoing RTSP stream's settings (compression, fps, keyframe interval, max bitrate,
  zipstream strength) without restarting it.
section: network-video
family: cgi
status: released
python:
  module: rtsp_adjustable_live_stream
  class: RtspAdjustableLiveStream
docs:
- https://developer.axis.com/vapix/network-video/rtsp-adjustable-live-stream/
access: viewer
discovery:
- param: {name: Properties.API.RTSP.AdjustableStreamSettings}

binding: {path: /axis-cgi/param.cgi}

operations:
  get_adjustable_stream_settings_property:
    summary: Retrieve the supported adjustable stream settings via param.cgi.
    description: The feature is supported if the property exists and lists one or more settings.
    effect: read
    binding:
      method: GET
      query: {action: list, group: root.Properties.API.RTSP.AdjustableStreamSettings}
      reply:
        text_kv: {strip_prefix: root.}
    result:
      type: object
      additionalProperties: {type: string}
    examples:
    - title: Read the adjustable stream settings property
      request:
        query: {}
      response:
        status: 200
        text: root.Properties.API.RTSP.AdjustableStreamSettings="compression,fps,videokeyframeinterval,videomaxbitrate,videozstrength"
      source: https://developer.axis.com/vapix/network-video/rtsp-adjustable-live-stream/#propertiesapirtspadjustablestreamsettings
  open_adjustable_stream_url:
    summary: Build the RTSP URL of a live stream with adjustable live stream enabled.
    description: 'Open the URL with an RTSP client. While the stream runs, the client can send GET_PARAMETER
      Adjustable-Stream-Settings to list the settings it may change and SET_PARAMETER Adjustable-Stream-Configuration
      (for example "fps=30,compression=30,videomaxbitrate=100000") to apply them; supported settings are compression,
      fps, videokeyframeinterval, videomaxbitrate and videozstrength, and they behave like the URL options of the
      Video streaming API. Both RTSP methods must be driven by the RTSP client; they are not operations of this
      library. Values above those used when the stream was started are not recommended, as some players cannot
      handle them.'
    effect: read
    binding:
      rtsp:
        query: {adjustablelivestream: '1'}
    params:
      type: object
      properties:
        videozprofile:
          type: string
          description: videozprofile=storage is incompatible with this API; 400 Bad Request is returned if used.
    examples:
    - title: Request a video stream with the default settings and the adjustable live stream enabled
      request: {}
      response: {url: 'rtsp://camera.test:554/axis-media/media.amp?adjustablelivestream=1'}
      source: https://developer.axis.com/vapix/network-video/rtsp-adjustable-live-stream/#adjust-the-stream-quality

sources:
