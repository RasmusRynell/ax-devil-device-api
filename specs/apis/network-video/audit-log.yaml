format: 2
id: audit-log
name: Audit log
summary: Retrieve the audit log (entire or tail) and the version of /axis-cgi/auditlog.cgi.
section: network-video
family: cgi
status: released
python:
  module: audit_log
  class: AuditLog
docs:
- https://developer.axis.com/vapix/network-video/audit-log/
access: admin
discovery:
- {api_discovery: audit-log}

binding: {path: /axis-cgi/auditlog.cgi}

operations:
  get_audit_log:
    summary: Request a list of the entire audit log, or the tail end of it.
    effect: read
    binding: {method: GET, reply: text}
    params:
      type: object
      properties:
        tail:
          type: integer
          description: The number of recent entries that should be retrieved (from the tail end of the log). All
            entries will be retrieved if this parameter is not specified.
    result: {type: string}
    errors:
      400: {description: An invalid request method was provided., kind: invalid_argument}
      401: {description: The user was unauthorized., kind: access_denied}
      500: {description: Some unexpected error occurred., kind: internal}
    examples:
    - title: Retrieve entire audit log
      request:
        query: {}
      response: {status: 200, text: audit log entries}
      source: https://developer.axis.com/vapix/network-video/audit-log/#retrieve-entire-audit-log
    - title: Retrieve tail of audit log (last nine entries)
      request:
        query: {tail: '9'}
      response:
        status: 200
        text: |-
          2025-07-22T15:38:25.307+00:00 axis-abcdef123456 [ INFO    ] fwmgr[4518]: Entity Management: Upgrade completed (12.6+snapshot-20250722).
