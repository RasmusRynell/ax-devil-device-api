  get_cgi_version:
    summary: Check the current CGI version.
    effect: read
    binding:
      method: GET
      query: {version: 'true'}
      reply: text
    params:
      type: object
      properties:
        version:
          type: boolean
          enum: ['true', 'false']
          default: false
          description: Specifies whether to retrieve the CGI version. Defaults to false. If set to true, it takes
            precedence over other parameters and only the version number is retrieved.
    result: {type: string}
    errors:
      400: {description: An invalid request method was provided., kind: invalid_argument}
      401: {description: The user was unauthorized., kind: access_denied}
    examples:
    - title: Retrieve CGI version
      request:
        query: {}
      response: {status: 200, text: 1.0.0}
      source: https://developer.axis.com/vapix/network-video/audit-log/#retrieve-cgi-version

