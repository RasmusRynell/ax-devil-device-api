          2025-07-22T15:39:58.917+00:00 axis-abcdef123456 [ INFO    ] sshd-session[7445]: Authentication: judy@192.168.0.87 Authentication successful (SSH).
          2025-07-22T15:40:08.825+00:00 axis-abcdef123456 [ INFO    ] sshd-session[7457]: Authentication: chris@192.168.0.87 Authentication failed (SSH).
          2025-07-22T15:40:13.561+00:00 axis-abcdef123456 [ INFO    ] sshd-session[7457]: Authentication: chris@192.168.0.87 Authentication successful (SSH).
          2025-07-22T15:40:42.707+00:00 axis-abcdef123456 [ INFO    ] sshd-session[7457]: Authentication: chris Logged out (SSH).
          2025-07-22T15:40:46.612+00:00 axis-abcdef123456 [ INFO    ] sshd-session[7499]: Authentication: judy@192.168.0.87 Authentication failed (SSH).
          2025-07-22T15:40:48.365+00:00 axis-abcdef123456 [ INFO    ] sshd-session[7499]: Authentication: judy@192.168.0.87 Authentication successful (SSH).
          2025-07-22T16:09:59.358+00:00 axis-abcdef123456 [ INFO    ] sshd-session[7445]: Authentication: judy Logged out (SSH).
