- url: https://developer.axis.com/vapix/network-video/decoder2-api/
  sha256_md: 6d4283f55e83f28e1fad78e85c074ed3e4bb3af9873e44fd5129758b24fd06c9
  retrieved_at: '2026-10-11'
provenance:
  completeness: partial
  open_questions:
  - 'The Line-out Control methods (setEnabled, getEnabled) are not modeled: the docs give no CGI path for them (every other method names its CGI, in the use cases or the method sections), and none of the documented CGIs (player.cgi, layout.cgi, mediasource.cgi, decodercapabilities.cgi) is stated to carry them. Add set_line_out_enabled(enabled) and get_line_out_enabled() once the path is known.'
  - Security levels of the methods are not documented; admin is assumed. No getSupportedVersions method is documented.
  - API discovery states version 3.0, but all examples send apiVersion 2.0. Version 3.0 is used.
  - 'Method name mismatches in the docs: listSequence (headings) vs listSequences (tables and examples); SetUnsecureConnectionAllowed
    (heading) vs setUnsecureConnectionAllowed; the request examples of the capability methods use the method names getCameraCapabilitiesRequest
    and so on.'
  - The getSequence example used actionOnPlaybackEnd triggerFreeze, which is not a documented value; corrected to triggerFreezePlayback.
  - deleteSequence documents a forceSWDecoder parameter that describes media sources; it probably belongs to setMediaSources
    or setSequence.
  - 'getDecoderCapabilities: the example has maxVPUInstances (not in the table) and maxStreams (the table says maxstreams).'
  - getMediaSources lists manufacturer values com.axis.camera and com.axis.acs, setMediaSources lists com.axis.camera and
    other. The setMediaSources values are used.
  - The fileId of a file media source is described as "The media source ID".
  - Whether setMediaSources can update an existing mediaSourceId, and whether the device assigns IDs when mediaSourceId is
    omitted, is not stated; the effect is modeled as create.
  - Whether setSequence replaces or merges an existing sequence is not stated; it is modeled as a replace because views is
    required.
  - 'playMediaSource: only resumeTimeout is marked optional in the parameter table, so the other parameters are required.'
  - The docs also document an older API major (apiVersion 2.0 in examples); this spec covers major 3 only.
  migrated_from: v1
  curated: true
