- url: https://developer.axis.com/vapix/network-video/decoder2-api/
  sha256_md: 6d4283f55e83f28e1fad78e85c074ed3e4bb3af9873e44fd5129758b24fd06c9
  retrieved_at: '2026-10-11'

provenance:
  completeness: partial
  open_questions:
  - 'ID clash: Decoder2''s API discovery id is ''decoder'' (version 3.0); the legacy Decoder API has no discovery
    id. This spec uses file id decoder2 (see top-level id) to avoid clashing with decoder.yaml.'
  - CGI path for Line-out Control (setEnabled/getEnabled) is not documented.
  - Security levels for all methods are not documented; no getSupportedVersions method documented.
  - Examples use apiVersion 2.0 while API discovery states version 3.0.
  - 'Method name mismatches: listSequence (headings/links) vs listSequences (tables/examples); SetUnsecureConnectionAllowed
    heading vs setUnsecureConnectionAllowed; getCameraCapabilities example request uses method ''getCameraCapabilitiesRequest''.'
  - getSequence example uses actionOnPlaybackEnd 'triggerFreeze' (not in the enum).
  - deleteSequence table lists forceSWDecoder (describes media sources; likely belongs to setMediaSources/setSequence).
  - getDecoderCapabilities example contains maxVPUInstances (not in table) and maxStreams vs table 'maxstreams'.
  - getMediaSources manufacturer valid values listed as com.axis.camera/com.axis.acs vs setMediaSources com.axis.camera/other.
  - setMediaSources describes fileId as 'The media source ID'.
