format: 2
id: decoder2
name: Decoder 2
summary: 'Configure and control playback on Axis decoders: media sources, sequences and views, player control, capabilities
  and line-out.'
section: network-video
family: jsonrpc
status: released
python:
  module: decoder2
  class: Decoder2
docs:
- https://developer.axis.com/vapix/network-video/decoder2-api/
access: admin
discovery:
- api_discovery: decoder
requires:
  firmware: '12.2'
binding:
  path: /axis-cgi/decoder/player.cgi
  major: 3
  versions:
  - '3.0'
  negotiation:
    fixed: '3.0'
  params_placement: params
errors:
  1100:
    description: Internal error.
    kind: internal
  2100:
    description: API version not supported.
    kind: unsupported
  2101:
    description: Invalid JSON.
    kind: invalid_argument
  2102:
    description: Method not supported.
    kind: unsupported
  2103:
    description: Required parameter missing.
    kind: invalid_argument
  2104:
    description: Invalid parameter value specified.
    kind: invalid_argument
  2105:
    description: Authorization failed.
    kind: access_denied
types:
  Pane:
    type: object
    description: Where a media source is drawn in the view. The origin (0, 0) is the upper left corner of the view and (1,
      1) the lower right.
    required:
    - left
    - right
    - top
    - bottom
    properties:
      left:
        type: number
        minimum: 0
        maximum: 1
        description: Left edge is 0, middle 0.5 and right edge 1.
      right:
        type: number
        minimum: 0
        maximum: 1
        description: Left edge is 0, middle 0.5 and right edge 1.
      top:
        type: number
        minimum: 0
        maximum: 1
        description: Top edge is 0, middle 0.5 and bottom edge 1.
      bottom:
        type: number
        minimum: 0
        maximum: 1
        description: Top edge is 0, middle 0.5 and bottom edge 1.
  PlaybackEndAction:
    enum:
    - triggerError
    - triggerFreezePlayback
    - triggerNextView
    - triggerRestartPlayback
    default: triggerFreezePlayback
    description: What a pane does when its media source ends. triggerError shows a default error image, triggerFreezePlayback
      stops and shows the last frame, triggerNextView switches to the next view (or the first after the last), triggerRestartPlayback
      restarts the media from the beginning.
  Segment:
    type: object
    description: A pane, a media source and the end-of-playback action.
    required:
    - mediaSourceId
    - pane
    properties:
      mediaSourceId:
        type: integer
        minimum: 0
        maximum: 999
        description: The media source ID.
      actionOnPlaybackEnd:
        $ref: '#/types/PlaybackEndAction'
        description: Defaults to triggerFreezePlayback.
      pane:
        $ref: '#/types/Pane'
  View:
    type: object
    description: A screen area divided into segments.
    required:
    - segments
    properties:
      duration:
        type: integer
        minimum: 1
        maximum: 86400
        description: The view's duration in seconds (1 s to 24 h). Ignored on single-view sequences.
      segments:
        type: array
        items:
          $ref: '#/types/Segment'
  Sequence:
    type: object
    description: A sequence of views.
    required:
    - views
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 24
        description: The sequence ID.
      name:
        type: string
        maxLength: 64
      views:
        type: array
        items:
          $ref: '#/types/View'
  SetSequenceRequest:
    type: object
    description: Arguments of set_sequence.
    required:
    - views
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 24
        description: The sequence ID. If a sequence with this ID exists it is updated; otherwise one is created with this
          ID. Omit it to create a new sequence.
      name:
        type: string
        maxLength: 64
        description: The sequence name.
      views:
        type: array
        items:
          $ref: '#/types/View'
  SequenceId:
    type: object
    required:
    - id
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 24
        description: The ID of the sequence.
  SequenceSummary:
    type: object
    required:
    - id
    properties:
      id:
        type: integer
        minimum: 0
        maximum: 24
      name:
        type: string
        maxLength: 64
      duration:
        type: integer
        description: Total run time of the sequence in seconds.
  SequenceList:
    type: object
    required:
    - sequences
    properties:
      sequences:
        type: array
        items:
          $ref: '#/types/SequenceSummary'
  DeleteSequenceRequest:
    type: object
    required:
    - id
    properties:
      id:
        type: integer
        description: The sequence ID.
      forceSWDecoder:
        type: boolean
        description: 'Documented as: use software decoding instead of the VPU for this media source; with more views than
          the maximum VPU instances, the extra sources must use software decoding. It looks misplaced in deleteSequence.'
  Manufacturer:
    enum:
    - com.axis.camera
    - other
    description: com.axis.camera for Axis cameras (use externalIPDeviceStreamParameters); other for non-Axis devices (use
      videoUri). getMediaSources documents com.axis.camera and com.axis.acs.
  StreamSource:
    type: object
    description: A live stream.
    properties:
      externalIPDeviceInfoId:
        type: string
        description: The ID from the External IP Device Information API, which lets the decoder get the credentials of the
          device securely.
      manufacturer:
        $ref: '#/types/Manufacturer'
      externalIPDeviceStreamParameters:
        type: string
        description: Stream parameters, only for com.axis.camera, for example camera=1&resolution=1920x1080&fps=25&videocodec=h264.
      videoUri:
        type: string
        maxLength: 255
        description: The video URI, only for third party cameras (manufacturer other).
  FileSource:
    type: object
    description: A file on the decoder.
    properties:
      fileId:
        type: string
        description: The file, for example USB/imagename.jpg.
  MediaSourceType:
    enum:
    - stream
    - file
  MediaSource:
    type: object
    description: A media source configuration.
    required:
    - mediaSourceType
    properties:
      mediaSourceId:
        type: integer
        minimum: 0
        maximum: 999
        description: The media source ID.
      name:
        type: string
        maxLength: 64
      description:
        type: string
        maxLength: 250
      hasAudio:
        type: boolean
        description: True if audio should be enabled for the media source.
      mediaSourceType:
        $ref: '#/types/MediaSourceType'
        description: stream for a live stream, file for a file.
      stream:
        $ref: '#/types/StreamSource'
      file:
        $ref: '#/types/FileSource'
  SetMediaSourcesRequest:
    type: object
    required:
    - mediaSources
    properties:
      mediaSources:
        type: array
        items:
          $ref: '#/types/MediaSource'
  MediaSourceIds:
    type: object
    required:
    - ids
    properties:
      ids:
        type: array
        items:
          type: integer
        description: The IDs of the media sources that were created.
  MediaSourceList:
    type: object
    required:
    - mediaSources
    properties:
      mediaSources:
        type: array
        items:
          $ref: '#/types/MediaSource'
  DeleteMediaSourcesRequest:
    type: object
    required:
    - ids
    properties:
      ids:
        type: array
        items:
          type: integer
        description: The IDs of the media sources that should be deleted.
  PlaySequenceRequest:
    type: object
    required:
    - id
    properties:
      id:
        type: integer
        description: The sequence ID.
      viewIndex:
        type: integer
        description: The view index to start playing from.
      resumeTimeout:
        type: integer
        description: Seconds the new sequence plays before the currently playing sequence resumes.
  PauseSequenceRequest:
    type: object
    properties:
      resumeTimeout:
        type: integer
        description: Seconds before the previous sequence resumes.
  Priority:
    enum:
    - high
    - medium
    - low
  PlayMediaSourceRequest:
    type: object
    required:
    - highResolutionId
    - mediumResolutionId
    - lowResolutionId
    - priority
    - combineMediaSources
    properties:
      highResolutionId:
        type: integer
        description: A media source ID suited for a single stream.
      mediumResolutionId:
        type: integer
        description: A media source ID suited to play alongside half the maximum number of simultaneous streams.
      lowResolutionId:
        type: integer
        description: A media source ID suited to play alongside the maximum number of simultaneous streams.
      resumeTimeout:
        type: integer
        description: Seconds after which the interrupted sequence resumes.
      priority:
        $ref: '#/types/Priority'
        description: Which media source is played if more than one is requested.
      combineMediaSources:
        type: boolean
        description: Media sources are shown side by side if all requests set this to true.
  StopMediaSourceRequest:
    type: object
    required:
    - highResolutionId
    properties:
      highResolutionId:
        type: integer
        description: The ID of the media source that should be stopped.
  PlayViewRequest:
    type: object
    properties:
      viewIndex:
        type: integer
        description: Index in the currently playing sequence of the view to play.
  CurrentPosition:
    type: object
    required:
    - sequenceId
    - sequenceIndex
    - currentViewTime
    properties:
      sequenceId:
        type: integer
        minimum: 0
        maximum: 24
        description: The sequence ID.
      sequenceIndex:
        type: integer
        minimum: 0
        maximum: 999
        description: The index of the active view.
      currentViewTime:
        type: integer
        description: Seconds the active view has been playing.
  GetCameraCapabilitiesRequest:
    type: object
    required:
    - externalIPDeviceInfoId
    properties:
      externalIPDeviceInfoId:
        type: string
        description: The external IP device info ID.
  AudioSource:
    type: object
    properties:
      audioSourceIndex:
        type: string
      enabled:
        type: string
      codec:
        type: string
      inputType:
        type: string
      name:
        type: string
  VideoSource:
    type: object
    properties:
      imageGroupIndex:
        type: string
      name:
        type: string
      source:
        type: string
      enabled:
        type: string
      maxFPS:
        type: string
      resolution:
        type: array
        items:
          type: string
  CameraCapabilities:
    type: object
    description: Capabilities of an Axis camera. Values are strings, including yes/no flags and indexes.
    properties:
      codec:
        type: array
        items:
          type: string
        description: Video compression formats, for example h264 and h265.
      audioSources:
        type: array
        items:
          $ref: '#/types/AudioSource'
      videoSources:
        type: array
        items:
          $ref: '#/types/VideoSource'
  DecoderCapabilities:
    type: object
    properties:
      resolutions:
        type: array
        items:
          type: string
        description: Resolutions supported by the HDMI port, for example 3840x2160@30.
      maxVPUInstances:
        type: integer
        description: Documented only in the example.
      maxStreams:
        type: integer
        description: Documented as maxstreams in the table, maxStreams in the example.
      streamingProtocols:
        type: array
        items:
          type: string
        description: For example rtspt, rtsph, rtspsh.
      audioCodingFormats:
        type: array
        items:
          type: string
      videoCodingFormats:
        type: array
        items:
          type: string
      imageCodingFormats:
        type: array
        items:
          type: string
      mediaTypes:
        type: array
        items:
          type: string
  UnsecureConnectionAllowed:
    type: object
    required:
    - UnsecureConnectionAllowed
    description: Whether unencrypted (HTTP) connections are allowed when fetching camera capabilities.
    properties:
      UnsecureConnectionAllowed:
        type: boolean
operations:
  set_sequence:
    summary: Create a new sequence or update an existing one.
    description: Views of segments, each segment a pane, a media source and an end-of-playback action. If the view duration
      is shorter than the file, the decoder switches view before the playback ends. If the file is shorter than the view duration,
      the decoder acts on the end-of-playback action.
    effect: write
    write: replace
    binding:
      method: setSequence
      path: /axis-cgi/decoder/layout.cgi
    params:
      $ref: '#/types/SetSequenceRequest'
    result:
      $ref: '#/types/SequenceId'
    examples:
    - title: Create a sequence with a single view and media source
      request:
        params: &id001
          name: A Sequence Name
          views:
          - duration: 30
            segments:
            - mediaSourceId: 0
              actionOnPlaybackEnd: triggerRestartPlayback
              pane:
                left: 0
                top: 0
                right: 1
                bottom: 1
      response:
        data:
          id: 0
      source: https://developer.axis.com/vapix/network-video/decoder2-api/#setsequence
    - title: Create a sequence with a single view and multiple media sources
      request:
        params:
          name: A Sequence Name
          views:
          - duration: 30
            segments:
            - mediaSourceId: 0
              actionOnPlaybackEnd: triggerRestartPlayback
              pane:
                left: 0
                top: 0
                right: 0.5
                bottom: 0.5
            - mediaSourceId: 1
              pane:
                left: 0.5
                top: 0
                right: 1
                bottom: 0.5
            - mediaSourceId: 2
              pane:
                left: 0
                top: 0.5
                right: 0.5
                bottom: 1
            - mediaSourceId: 5
              actionOnPlaybackEnd: triggerNextView
              pane:
                left: 0.5
                top: 0.5
                right: 1
                bottom: 1
      response:
        data:
          id: 0
      source: https://developer.axis.com/vapix/network-video/decoder2-api/#setsequence
    - title: Create a sequence with multiple views and multiple media sources
      request:
        params:
          name: A Sequence Name
          views:
          - duration: 30
            segments:
            - mediaSourceId: 0
              actionOnPlaybackEnd: triggerRestartPlayback
              pane:
                left: 0
                top: 0
                right: 0.5
                bottom: 0.5
            - mediaSourceId: 1
              pane:
                left: 0.5
                top: 0
                right: 1
                bottom: 0.5
            - mediaSourceId: 2
              pane:
                left: 0
                top: 0.5
                right: 0.5
                bottom: 1
            - mediaSourceId: 5
              actionOnPlaybackEnd: triggerNextView
              pane:
                left: 0.5
                top: 0.5
                right: 1
                bottom: 1
          - duration: 60
            segments:
            - mediaSourceId: 4
              actionOnPlaybackEnd: triggerFreezePlayback
              pane:
                left: 0
                top: 0
                right: 0.5
                bottom: 0.5
            - mediaSourceId: 6
              actionOnPlaybackEnd: triggerError
              pane:
                left: 0.5
                top: 0
                right: 1
                bottom: 0.5
            - mediaSourceId: 7
              pane:
                left: 0
                top: 0.5
                right: 0.5
                bottom: 1
            - mediaSourceId: 8
              pane:
                left: 0.5
                top: 0.5
                right: 1
                bottom: 1
          - duration: 120
            segments:
            - mediaSourceId: 9
              pane:
                left: 0
                top: 0
                right: 0.5
                bottom: 0.5
            - mediaSourceId: 10
              pane:
                left: 0.5
                top: 0
                right: 1
                bottom: 0.5
            - mediaSourceId: 3
              actionOnPlaybackEnd: triggerError
              pane:
                left: 0
                top: 0.5
                right: 0.5
                bottom: 1
            - mediaSourceId: 4
              actionOnPlaybackEnd: triggerError
              pane:
                left: 0.5
                top: 0.5
                right: 1
                bottom: 1
      response:
        data:
          id: 0
      source: https://developer.axis.com/vapix/network-video/decoder2-api/#setsequence
    - title: Internal error
      request:
        params: *id001
      response:
        error:
          code: 1100
          message: Internal error
      source: https://developer.axis.com/vapix/network-video/decoder2-api/#setsequence
  get_sequence:
    summary: Fetch the configuration of a sequence.
    effect: read
    binding:
      method: getSequence
      path: /axis-cgi/decoder/layout.cgi
    params:
      $ref: '#/types/SequenceId'
    result:
      $ref: '#/types/Sequence'
    examples:
    - title: Get a sequence
      request:
        params: &id002
          id: 1
      response:
        data:
          name: A Sequence Name
          views:
          - duration: 30
            segments:
            - mediaSourceId: 0
              actionOnPlaybackEnd: triggerRestartPlayback
              pane:
                left: 0
                top: 0
                right: 0.5
                bottom: 0.5
            - mediaSourceId: 1
              actionOnPlaybackEnd: triggerFreezePlayback
              pane:
                left: 0.5
                top: 0
                right: 1
                bottom: 0.5
            - mediaSourceId: 2
              actionOnPlaybackEnd: triggerError
              pane:
                left: 0
                top: 0.5
                right: 0.5
                bottom: 1
            - mediaSourceId: 5
              actionOnPlaybackEnd: triggerNextView
              pane:
                left: 0.5
                top: 0.5
                right: 1
                bottom: 1
          - duration: 60
            segments:
            - mediaSourceId: 4
              actionOnPlaybackEnd: triggerFreezePlayback
              pane:
                left: 0
                top: 0
                right: 0.5
                bottom: 0.5
            - mediaSourceId: 6
              actionOnPlaybackEnd: triggerError
              pane:
                left: 0.5
                top: 0
                right: 1
                bottom: 0.5
            - mediaSourceId: 7
              actionOnPlaybackEnd: triggerError
              pane:
                left: 0
                top: 0.5
                right: 0.5
                bottom: 1
            - mediaSourceId: 8
              actionOnPlaybackEnd: triggerError
              pane:
                left: 0.5
                top: 0.5
                right: 1
                bottom: 1
          - duration: 120
            segments:
            - mediaSourceId: 9
              actionOnPlaybackEnd: triggerError
              pane:
                left: 0
                top: 0
                right: 0.5
                bottom: 0.5
            - mediaSourceId: 10
              actionOnPlaybackEnd: triggerError
              pane:
                left: 0.5
                top: 0
                right: 1
                bottom: 0.5
            - mediaSourceId: 3
              actionOnPlaybackEnd: triggerError
              pane:
                left: 0
                top: 0.5
                right: 0.5
                bottom: 1
            - mediaSourceId: 4
              actionOnPlaybackEnd: triggerError
              pane:
                left: 0.5
                top: 0.5
                right: 1
                bottom: 1
      source: https://developer.axis.com/vapix/network-video/decoder2-api/#getsequence
    - title: Internal error
      request:
        params: *id002
      response:
        error:
          code: 1100
          message: Internal error
      source: https://developer.axis.com/vapix/network-video/decoder2-api/#getsequence
  list_sequences:
    summary: Fetch the identifiers (id, name, duration) of all sequences.
    effect: read
    binding:
      method: listSequences
      path: /axis-cgi/decoder/layout.cgi
    result:
      $ref: '#/types/SequenceList'
    examples:
    - title: List sequences
      request:
        params: &id003 {}
      response:
        data:
          sequences:
          - name: A Sequence Name
            id: 1
            duration: 360
          - name: A Sequence Name 2
            id: 2
            duration: 240
          - name: A Sequence Name 3
            id: 3
            duration: 120
      source: https://developer.axis.com/vapix/network-video/decoder2-api/#listsequence
    - title: Internal error
      request:
        params: *id003
      response:
        error:
          code: 1100
          message: Internal error
      source: https://developer.axis.com/vapix/network-video/decoder2-api/#listsequence
  delete_sequence:
    summary: Delete a sequence configuration.
    effect: write
    write: delete
    binding:
      method: deleteSequence
      path: /axis-cgi/decoder/layout.cgi
    params:
      $ref: '#/types/DeleteSequenceRequest'
    examples:
    - title: Delete a sequence
      request:
        params: &id004
          id: 0
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/decoder2-api/#deletesequence
    - title: Internal error
      request:
        params: *id004
      response:
        error:
          code: 1100
          message: Internal error
      source: https://developer.axis.com/vapix/network-video/decoder2-api/#deletesequence
  set_media_sources:
    summary: Create media source configurations, streams or files.
    description: Configure the device first with the External IP Device Information API; its externalIPDeviceInfoId lets the
      decoder reach the device securely.
    effect: write
    write: create
    binding:
      method: setMediaSources
      path: /axis-cgi/decoder/mediasource.cgi
    params:
      $ref: '#/types/SetMediaSourcesRequest'
    result:
      $ref: '#/types/MediaSourceIds'
    examples:
    - title: Create media sources
      request:
        params: &id005
          mediaSources:
          - mediaSourceId: 10
            name: baker street
            description: Camera at baker street
            hasAudio: false
            mediaSourceType: stream
            stream:
              externalIPDeviceInfoId: 1701335688966-dac8ff0a-09de-abfb-83cf-753ad2f760f8
              manufacturer: com.axis.camera
              externalIPDeviceStreamParameters: camera=1&resolution=1920x1080&fps=25&videocodec=h264
          - mediaSourceId: 12
            name: baker street
            description: Camera at baker street
            hasAudio: false
            mediaSourceType: stream
            stream:
              externalIPDeviceInfoId: 1701335688966-dac8ff0a-09de-abfb-83cf-753ad2f760f9
              manufacturer: other
              videoUri: rtsp://192.168.0.90/axis-media/media.amp?camera=1&resolution=1280x720&fps=30&videocodec=h264
          - mediaSourceId: 11
            name: media sources 1
            description: Description 1
            hasAudio: false
            mediaSourceType: file
            file:
              fileId: USB/imagename.jpg
      response:
        data:
          ids:
          - 10
          - 11
          - 12
      source: https://developer.axis.com/vapix/network-video/decoder2-api/#setmediasources
    - title: Internal error
      request:
        params: *id005
      response:
        error:
          code: 1100
          message: Internal error
      source: https://developer.axis.com/vapix/network-video/decoder2-api/#setmediasources
  get_media_sources:
    summary: Get the configuration of all media sources.
    effect: read
    binding:
      method: getMediaSources
      path: /axis-cgi/decoder/mediasource.cgi
    result:
      $ref: '#/types/MediaSourceList'
    examples:
    - title: Get media sources
      request:
        params: &id006 {}
      response:
        data:
          mediaSources:
          - mediaSourceId: 10
            name: baker street
            description: Camera at baker street
            hasAudio: false
            mediaSourceType: stream
            stream:
              externalIPDeviceInfoId: 1701335688966-dac8ff0a-09de-abfb-83cf-753ad2f760f8
              manufacturer: com.axis.camera
              externalIPDeviceStreamParameters: camera=1&resolution=1920x1080&fps=25&videocodec=h264
          - mediaSourceId: 12
            name: baker street
            description: Camera at baker street
            hasAudio: false
            mediaSourceType: stream
            stream:
              externalIPDeviceInfoId: 1701335688966-dac8ff0a-09de-abfb-83cf-753ad2f760f9
              manufacturer: other
              videoUri: rtsp://192.168.0.90/axis-media/media.amp?camera=1&resolution=1280x720&fps=30&videocodec=h264
          - mediaSourceId: 11
            name: media sources 1
            description: Description 1
            hasAudio: false
            mediaSourceType: file
            file:
              fileId: USB/imagename.jpg
      source: https://developer.axis.com/vapix/network-video/decoder2-api/#getmediasources
    - title: Internal error
      request:
        params: *id006
      response:
        error:
          code: 1100
          message: Internal error
      source: https://developer.axis.com/vapix/network-video/decoder2-api/#getmediasources
  delete_media_sources:
    summary: Delete one or several media source configurations.
    effect: write
    write: delete
    binding:
      method: deleteMediaSources
      path: /axis-cgi/decoder/mediasource.cgi
    params:
      $ref: '#/types/DeleteMediaSourcesRequest'
    examples:
    - title: Delete media sources
      request:
        params: &id007
          ids:
          - 0
          - 10
          - 11
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/decoder2-api/#deletemediasources
    - title: Internal error
      request:
        params: *id007
      response:
        error:
          code: 1100
          message: Internal error
      source: https://developer.axis.com/vapix/network-video/decoder2-api/#deletemediasources
  play_sequence:
    summary: Start playing a sequence.
    description: A single-view sequence plays until it is stopped.
    effect: action
    binding:
      method: playSequence
      path: /axis-cgi/decoder/player.cgi
    params:
      $ref: '#/types/PlaySequenceRequest'
