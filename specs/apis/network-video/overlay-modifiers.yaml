format: 2
id: overlay-modifiers
name: Overlay modifiers
summary: GET /axis-cgi/overlaymodifiers.cgi lists supported overlay modifier groups and modifiers (%/# markup expanded
  in overlay text, file names, notifications).
section: network-video
family: cgi
status: released
python:
  module: overlay_modifiers
  class: OverlayModifiers
docs:
- https://developer.axis.com/vapix/network-video/overlay-api/
access: admin
discovery:
- param: {name: Properties.OverlayModifiers.OverlayModifiers, value: 'yes'}
requires:
  firmware: '5.1'

binding: {path: /axis-cgi/overlaymodifiers.cgi}

types:
  Modifier:
    type: object
    required: [mod]
    properties:
      mod:
        type: string
        description: 'A modifier always starts with % or # followed by one or two characters and an index.'
      index:
        type: boolean
        description: 'Present (true) for modifiers that require an additional index, e.g. #U, #TC, #TF.'

operations:
  get_overlay_modifiers:
    summary: Retrieve supported overlay modifiers grouped by functional group.
    access: operator
    effect: read
    binding: {method: GET, reply: json}
    params:
      type: object
      properties:
        context:
          type: integer
          description: Integer user data either echoed in the response or returned as 0 when left out. [in=query
            inferred; syntax shows no query string]
    result:
      type: object
      properties:
        apiVersion: {type: string}
        context: {type: integer}
        method: {type: string}
        data:
          type: object
          x-name: GetOverlayModifiersResultData
          properties:
            groups:
              type: object
              additionalProperties:
                type: array
                items: {$ref: '#/types/Modifier'}
              description: Map group name -> array of modifiers.
    examples:
    - title: Present supported modifiers
      request:
        query: {}
      response:
        status: 200
        text: |-
          {
            "apiVersion": "0.2",
            "context": 1,
            "method": "getOverlayModifiers",
            "data": {
              "groups": {
                "data": [
                  {"mod": "%c"},
                  {"mod": "%D"},
                  {"mod": "%F"},
                  {"mod": "%X"}
                ],
                ........
                "sysinfo": [
                  {"mod": "#i"},
                  {"mod": "#m"},
                  {"mod": "#M"},
                  {"mod": "#n"},
                  {"mod": "#TC", "index": true},
                  {"mod": "#TF", "index": true}
                ],
                ........
              }
            }
          }
      source: https://developer.axis.com/vapix/network-video/overlay-api/#present-supported-modifiers

