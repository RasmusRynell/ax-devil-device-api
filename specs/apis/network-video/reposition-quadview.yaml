format: 2
id: reposition-quadview
name: QuadView configuration
summary: Reorder the four dewarped sub views of a fisheye quad view, and enable/disable QuadEye (quad view plus
  a centre overview).
section: network-video
family: jsonrpc
status: released
python:
  module: quadview_configuration
  class: QuadViewConfiguration
docs:
- https://developer.axis.com/vapix/network-video/quadview-configuration/
access: operator
discovery:
- {api_discovery: reposition-quadview}
- param: {name: Properties.QuadOverview.QuadViewOrder, value: 'yes'}
- param: {name: Properties.QuadOverview.QuadOverview, value: 'yes'}

binding:
  path: /axis-cgi/quadviewsetup.cgi
  major: 1
  versions: ['1.0']
  negotiation:
    get_supported_versions: {key: apiVersions}
  params_placement: params

errors:
  1100: {description: Internal error, kind: internal}
  2100: {description: API version not supported, kind: unsupported}
  2101: {description: Invalid JSON, kind: invalid_argument}
  2102: {description: Method not supported, kind: unsupported}
  2103: {description: Required parameter missing, kind: invalid_argument}
  2104: {description: Invalid parameter value specified, kind: invalid_argument}

types:
  SubViewOrder:
    type: array
    items: {type: integer, minimum: 1, maximum: 4}
    description: "Four sub view IDs in the order top left, top right, bottom left, bottom right. Each ID is the part of the overview that is dewarped into that view (1 to 4)."

  QuadEyeValue:
    enum: ["true", "false"]
    description: "Whether QuadEye (quad view plus a centre overview) is enabled. The device returns it as a string."

  OrderResult:
    type: object
    required: [id]
    properties:
      id: {$ref: "#/types/SubViewOrder"}

  SetOrderRequest:
    type: object
    required: [id]
    properties:
      id: {$ref: "#/types/SubViewOrder", description: New order of the four sub views.}

  QuadEyeResult:
    type: object
    required: [quadeye]
    properties:
      quadeye: {$ref: "#/types/QuadEyeValue"}

  SetQuadEyeValueRequest:
    type: object
    required: [quadeye]
    properties:
      quadeye: {type: boolean, description: Whether QuadEye should be enabled.}

operations:
  get_order:
    summary: Get the order of the sub views in the quad view.
    effect: read
    binding: {method: getOrder}
    result: {$ref: "#/types/OrderResult"}
    examples:
      - title: Get the current order of the sub views
        request: {params: {}}
        response: {data: {id: [1, 2, 3, 4]}}
        source: https://developer.axis.com/vapix/network-video/quadview-configuration/#get-the-current-order-of-the-sub-views

  set_order:
    summary: Set the order of the sub views in the quad view.
    description: The device may override the order when the mounting parameter ``root.ImageSource.IO.CameraTiltOrientation`` is used. Returns the order now in effect.
    effect: write
    write: replace
    binding: {method: setOrder}
    params: {$ref: "#/types/SetOrderRequest"}
    positional: [id]
    result: {$ref: "#/types/OrderResult"}
    examples:
      - title: Switch the top-right and bottom-left sub views
        request: {params: {id: [1, 4, 2, 3]}}
        response: {data: {id: [1, 4, 2, 3]}}
        source: https://developer.axis.com/vapix/network-video/quadview-configuration/#reorder-the-sub-views

  get_quad_eye_value:
    summary: Read whether QuadEye (quad view plus overview) is enabled.
    effect: read
    binding: {method: getQuadEyeValue}
    result: {$ref: "#/types/QuadEyeResult"}
    examples:
      - title: Get the status of QuadEye
        request: {params: {}}
        response: {data: {quadeye: "false"}}
        source: https://developer.axis.com/vapix/network-video/quadview-configuration/#get-the-status-of-the-quadeye

  set_quad_eye_value:
    summary: Enable or disable QuadEye (quad view plus overview).
    description: Returns the value now in effect.
    effect: write
    write: patch
    binding: {method: setQuadEyeValue}
    params: {$ref: "#/types/SetQuadEyeValueRequest"}
    positional: [quadeye]
    result: {$ref: "#/types/QuadEyeResult"}
    examples:
      - title: Enable QuadEye
        request: {params: {quadeye: true}}
        response: {data: {quadeye: "true"}}
        source: https://developer.axis.com/vapix/network-video/quadview-configuration/#enable-and-disable-the-quadeye

sources:
- url: https://developer.axis.com/vapix/network-video/quadview-configuration/
  sha256_md: 5ae804aff6b7c08f1ad501dad264b8183c75b1561553c0d1d3944531704a90f5
  retrieved_at: '2026-10-11'

provenance:
  completeness: complete
  open_questions:
  - Example text says reordered views are '1, 2, 4, 3' but the request/response shows [1, 4, 2, 3].
  - Mounting parameter written root.ImageSource.IO.CameraTiltOrientation (letter O; likely I0).
  - setQuadEyeValue takes a boolean but data.quadeye is returned as a string 'true'/'false'.
  - Success tables for setOrder/getQuadEyeValue say method='addText' (copy/paste).
  - The API Discovery id 'reposition-quadview' is stated only for the order feature; no separate discovery id for
    QuadEye.
  - AXIS OS minimum version not stated.
  migrated_from: v1
  curated: true
