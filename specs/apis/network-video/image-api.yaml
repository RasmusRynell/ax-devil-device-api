format: 2
id: image-api
name: Parameter management for video channels
summary: param.cgi parameters (Image, Image.I#.*, ImageSource.I#, Properties.Image.*) holding per-video-channel
  stream defaults, and the stream URL options that...
section: network-video
family: cgi
status: released
python:
  module: image_parameters
  class: ImageParameters
docs:
- https://developer.axis.com/vapix/network-video/parameter-management/image-api/
access: viewer

binding: {path: /axis-cgi/param.cgi}

operations:
  list_image_parameters:
    summary: List video channel / image source / Properties.Image parameters.
    effect: read
    binding:
      method: GET
      query: {action: list}
      reply: text_kv
    params:
      type: object
      properties:
        group:
          type: string
          description: e.g. Image, Image.I0.Appearance, ImageSource.I0, Properties.Image (see parameter-management
            list).
    result:
      type: object
      additionalProperties: {type: string}
  update_image_parameters:
    summary: Update writable video channel parameters.
    access: operator
    effect: write
    write: patch
    binding:
      method: GET
      query: {action: update}
      reply: text
    params:
      type: object
      required: [<group.name>]
      properties:
        <group.name>:
          type: object
          additionalProperties: {type: string}
          x-python-name: parameters
          description: Parameter=value pairs from param_cgi_groups.

