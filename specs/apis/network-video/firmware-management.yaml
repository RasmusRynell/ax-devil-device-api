# Migrated from the v1 corpus by codegen/migrate_v1.py; not yet curated.
format: 2
id: firmware-management
name: Firmware management API
summary: Firmware status, upgrade (multipart), commit, rollback, purge, factory default, stop auto-rollback, reboot
  via /axis-cgi/firmwaremanagement.cgi.
section: network-video
family: jsonrpc
status: released
python:
  module: firmware_management
  class: FirmwareManagement
docs:
- https://developer.axis.com/vapix/network-video/firmware-management-api/
access: admin
discovery:
- {api_discovery: fwmgr}
requires:
  firmware: '7.40'

binding:
  path: /axis-cgi/firmwaremanagement.cgi
  major: 1
  versions: ['1.0']
  negotiation:
    get_supported_versions: {key: apiVersions}
  params_placement: params

errors:
  400:
    description: Message could not be parsed or contains unknown parameters or values.
    kind: invalid_argument
  405: {description: Unknown method in request.}
  417: {description: API version not compatible., kind: unsupported}
  423: {description: System is busy with another firmware management request., kind: unavailable}
  500: {description: Unexpected internal error., kind: internal}

operations:
  status:
    summary: Retrieve the current firmware status of the Axis product.
    effect: unknown
    binding: {method: status}
    result:
      type: object
      properties:
        activeFirmwareVersion: {type: string, description: Current firmware version.}
        activeFirmwarePart: {type: string, description: Current firmware part number.}
        inactiveFirmwareVersion:
          type: string
          description: Inactive firmware version. Only present if an inactive firmware exists; reported as UNKNOWN
            if the inactive firmware doesn't support automatic rollback parameters.
        isCommited:
          type: boolean
          description: True if current firmware is committed; false if uncommitted and will rollback on reboot.
            Only present if an inactive firmware exists. (Spelling isCommited as documented.)
        pendingCommit:
          type: string
          enum: [started]
          description: 'Pending auto commit. ''started'': current firmware will be committed once the device has
            finished booting. Only present if active firmware is uncommitted and an automatic commit is pending.'
        timeToRollback:
          type: integer
          description: Seconds left to automatic rollback. Only present if active firmware is uncommitted and an
            automatic rollback is pending.
        lastUpgradeAt:
          type: string
          description: When the product was upgraded. Only present if an inactive firmware exists. (format=date-time)
    examples:
    - title: Check the current firmware status
      request:
        params: {}
      response:
        data:
          activeFirmwareVersion: 7.50.3
          activeFirmwarePart: '1234568'
          inactiveFirmwareVersion: 7.40.1.2
          isCommited: true
          lastUpgradeAt: '2018-08-12T11:55:12+01:00'
      source: https://developer.axis.com/vapix/network-video/firmware-management-api/#rollback-to-previous-firmware
  upgrade:
    summary: Upgrade the firmware; the product reboots as part of this method.
    description: Only allowed if the current firmware is committed.
    effect: unknown
    binding: {method: upgrade}
    params:
      type: object
      properties:
        factoryDefaultMode:
          type: string
          enum: [none, soft, hard]
          default: none
          description: 'Reset parameters to factory default values. All applications/ACAPs are removed or restored
            to pre-installed versions on hard and soft. Required as hard for downgrades. Values: none: Upgrade and
            preserve the current settings (default); soft: All parameters set to factory defaults except those listed
            in factoryDefault (network settings, system time, 802.1X); hard: All parameters set to factory defaults'
        autoCommit:
          type: string
          enum: [never, boot, started, default]
          description: 'When the new firmware is automatically committed. Ignored if the new firmware doesn''t support
            automatic rollback. Values: never: Never committed automatically; must be committed via commit; boot:
            Committed when it starts booting; started: Committed when the device has finished booting; default:
            Same as never if autoRollback is not default; otherwise boot if factoryDefaultMode is not none, else
            started'
        autoRollback:
          type: string
          description: '''never'' (no automatic rollback; still rolls back on major fault or power loss before commit),
            a numeric string = minutes after boot until automatic rollback unless committed (example ''50''), or
            ''default'' (same as never...'
    result:
      type: object
      properties:
        firmwareVersion: {type: string, description: New firmware version.}
    errors:
      409:
        description: Upgrade without factory default not allowed to an older firmware version.
        kind: unsupported
      410: {description: Upgrade failed due to firmware version revoked., kind: unsupported}
      412: {description: Upgrade not allowed due to active firmware is uncommitted.}
      415: {description: Upgrade failed due to invalid image., kind: invalid_argument}
      421: {description: Upgrade failed due to image not matching device.}
      422:
        description: Upgrade failed due to image missing a mandatory digital signature.
        kind: invalid_argument
      424: {description: Upgrade failed due to image referencing an unknown custom firmware certificate.}
  commit:
    summary: Commit the current firmware and stop automatic rollback if pending.
    effect: unknown
    binding: {method: commit}
    result:
      type: object
      properties:
        firmwareVersion: {type: string, description: Current firmware version.}
    examples:
    - title: Commit the firmware upgrade
      request:
        params: {}
      response:
        data: {firmwareVersion: 7.50.3}
  rollback:
    summary: Roll back firmware and configuration to the state before the most recent upgrade (product reboots).
    description: Only the most recent upgrade can be rolled back; applications and their data are not rolled back.
      Can be used whether or not the active firmware is committed. Not available after a purge or a factory default.
    effect: unknown
    binding: {method: rollback}
    errors:
      404: {description: No old firmware exists to rollback to.}
    examples:
    - title: Rollback to previous firmware
      request:
        params: {}
      response:
        data: {}
  purge:
    summary: Purge previous firmware to prevent rollback.
    effect: unknown
    binding: {method: purge}
    errors:
      412: {description: Active firmware is not committed.}
    examples:
    - title: Purge previous firmware
      request:
        params: {}
      response:
        data: {}
  factory_default:
    summary: Reset parameters to factory defaults; the product reboots.
    description: If the current firmware is committed, any inactive or pending firmware is purged. If not committed
      and no automatic rollback is pending, the current firmware is committed and the inactive firmware purged.
      Replaces factorydefault.cgi and hardfactorydefault.cgi.
    effect: unknown
    binding: {method: factoryDefault}
    params:
      type: object
      properties:
        factoryDefaultMode: {type: string, enum: [soft, hard], default: soft}
  stop_auto:
    summary: Stop the pending auto rollback timer.
    effect: action
    binding: {method: stopAuto}
  reboot:
    summary: Reboot using the active firmware.
    description: Replaces restart.cgi.
    effect: action
    binding: {method: reboot}

sources:
- url: https://developer.axis.com/vapix/network-video/firmware-management-api/
  sha256_md: 8e895a48e918a67b8edce59d9fa992677c3e4a1d4041cc524fb3048651c3727b
