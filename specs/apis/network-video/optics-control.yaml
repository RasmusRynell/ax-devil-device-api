provenance:
  completeness: complete
  open_questions:
  - 'https://developer.axis.com/vapix/network-video/optics-control/#model: method table lists performAutoFocus and
    getSupportedVersion; API specification uses performAutofocus and getSupportedVersions.'
  - Tables use opticsID while syntax and examples use opticsId (wire name likely opticsId).
  - Request syntax templates omit a comma after "method" (doc typo).
  - Examples use apiVersion 1.1 while Identification says API version 1.2; syntax shows apiVersion "<Major>".
  - 'https://developer.axis.com/vapix/network-video/optics-control/#setircompensation: enable description says "active
    temperature compensation" (copy-paste from setTemperatureCompensation).'
  - No per-method error codes; all errors in General error codes.
  - 'migration: effect-guessed: write semantics guessed from the method name: set_focus=write/patch, set_relative_focus=write/patch,
    set_magnification=write/patch, set_relative_magnification=write/patch, reset=write/replace, set_focus_window=write/patch,
    set_temperature_compensation=write/patch, set_ir_cut_filter_state=write/patch, set_ir_compensation=write/patch'
  - 'migration: effect-unknown: effect could not be inferred from the method name: calibrate, perform_autofocus'
  migrated_from: v1
  curated: false
