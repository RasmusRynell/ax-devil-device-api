# Migrated from the v1 corpus by codegen/migrate_v1.py; not yet curated.
format: 2
id: optics-control
name: Optics Control API
summary: JSON API (/axis-cgi/opticscontrol.cgi) for zoom, focus (absolute/relative/autofocus/window), calibration,
  reset, temperature and IR compensation and IR cut...
section: network-video
family: jsonrpc
status: released
python:
  module: optics_control
  class: OpticsControl
docs:
- https://developer.axis.com/vapix/network-video/optics-control/
access: admin
discovery:
- {api_discovery: optics-control}

binding:
  path: /axis-cgi/opticscontrol.cgi
  major: 1
  versions: ['1.2']
  negotiation:
    get_supported_versions: {key: apiVersions}
  params_placement: params

errors:
  1100: {description: Internal error, kind: internal}
  1200: {description: Temperature out of range}
  1300: {description: Focus not found, kind: not_found}
  2100: {description: API version not supported, kind: unsupported}
  2101: {description: Invalid JSON, kind: invalid_argument}
  2102: {description: Method not supported, kind: unsupported}
  2103: {description: Required parameter missing, kind: invalid_argument}
  2104: {description: Invalid parameter value specified, kind: invalid_argument}
  2105: {description: Authorization failed, kind: access_denied}
  2106: {description: Authentication failed}

operations:
  get_optics:
    summary: Retrieves information about all available optics.
    description: This method retrieves all optics along with their status and abilities.
    access: operator
    effect: read
    binding: {method: getOptics}
    result:
      type: object
      properties:
        numberOfOptics:
          type: integer
          minimum: 0
          maximum: 255
          description: The number of optics available on the device.
        optics:
          type: array
          items:
            type: object
            x-name: GetOpticsResultOpticsItem
            properties:
              opticsId: {type: string, description: The optics ID.}
              focusPosition:
                type: number
                description: The current position of the focus shown as a value between 0 and 1.
              focusMoving: {type: boolean, description: Shows if the focus is moving.}
              focusWindowUpperLeftX:
                type: number
                description: The distance from the upper left corner of the image to the upper left corner of the
                  focus window on the X-plane. Has a value between 0 and 1, with 0 being the top edge of the image
                  and 1 being the bottom.
              focusWindowUpperLeftY:
                type: number
                description: The distance from the upper left corner of the image to the upper left corner of the
                  focus window on the Y-plane. Has a value between 0 and 1, with 0 being the top edge of the image
                  and 1 being the bottom.
              focusWindowWidth:
                type: number
                description: The width of the focus window in a value between 0 and 1. represents the window having
                  100% width of the image. Please note that `focusWindowUpperLeftX+focusWindowWidth` can not exceed
                  1.
              focusWindowHeight:
                type: number
                description: The height of the focus window in a value between 0 and 1. 1 represents the window
                  having 100% height of the image. Please not that `focusWindowUpperLeftY+focusWindowHeight` can
                  not exceed 1.
              magnification:
                type: number
                description: The current magnification of the zoom lens. This is omitted if the optics doesn’t support
                  zoom.
              zoomMoving:
                type: boolean
                description: Shows if the zoom lens is moving. This is omitted if the optics doesn’t support zoom.
              temperatureCompensation: {type: boolean, description: Shows if the temperature compensation is enabled.}
              irCutFilterState:
                type: string
                enum: ['on', 'off', auto]
                description: 'Shows the current IRCut Filter setting. Possible vaues are: `on`: Filter is forced
                  on. `off`: Filter is forced off. `auto`: Filter state is set by software algorithms.'
              irCompensation: {type: boolean, description: Shows if the IR compensation is enabled.}
          description: Omitted if `numberOfOptics` is zero.
    examples:
    - title: Retrieve optics information
      request:
        params: {}
      response:
        data:
          numberOfOptics: 2
          optics:
          - opticsId: '0'
            focusPosition: 0.5
            focusMoving: false
            focusWindowUpperLeftX: 0.3
            focusWindowUpperLeftY: 0.2
            focusWindowWidth: 0.4
            focusWindowHeight: 0.5
            magnification: 1.4
            zoomMoving: false
            temperatureCompensation: true
            irCutFilterState: auto
            irCompensation: true
          - opticsId: '1'
            focusPosition: 0.3
            focusMoving: false
            focusWindowUpperLeftX: 0.3
            focusWindowUpperLeftY: 0.2
            focusWindowWidth: 0.4
            focusWindowHeight: 0.5
            magnification: 1.6
            zoomMoving: false
            temperatureCompensation: true
            irCutFilterState: auto
            irCompensation: true
      source: https://developer.axis.com/vapix/network-video/optics-control/#retrieve-optics-information
    - title: Retrieve optics information (error response)
      request:
        params: {}
      response:
        error: {code: 1100, message: Internal error}
      source: https://developer.axis.com/vapix/network-video/optics-control/#retrieve-optics-information
  get_capabilities:
    summary: Retrieves information about the optics capabilities.
    description: This method retrieves the capabilities of all available optics.
    access: operator
    effect: read
    binding: {method: getCapabilities}
    result:
      type: object
      properties:
        numberOfOptics:
          type: integer
          minimum: 0
          maximum: 255
          description: The number of optics available on the device.
        optics:
          type: array
          items:
            type: object
            x-name: GetCapabilitiesResultOpticsItem
            properties:
              opticsId: {type: string, description: The optics ID.}
              capabilities:
                type: array
                items:
                  type: string
                  enum:
                  - focus
                  - zoom
                  - irCutFilter
                  - calibrateFocus
                  - calibrateZoom
                  - compensateTemperature
                  - compensateIr
                description: List the optics capabilities listed in the tablebelow.
              maxMagnification:
                type: number
                description: The maximum possible magnification that can be set. Only available for devices where
                  zoom is available.
          description: Omitted if `numberOfOptics` is zero.
    examples:
    - title: Retrieve optics capabilities
      request:
        params: {}
      response:
        data:
          numberOfOptics: 1
          optics:
          - opticsId: '0'
            capabilities:
            - focus
            - zoom
            - irCutFilter
            - calibrateFocus
            - calibrateZoom
            - compensateTemperature
            - compensateIr
            maxMagnification: 2.4
      source: https://developer.axis.com/vapix/network-video/optics-control/#retrieve-optics-capabilities
    - title: Retrieve optics capabilities (error response)
      request:
        params: {}
      response:
        error: {code: 1100, message: Internal error}
      source: https://developer.axis.com/vapix/network-video/optics-control/#retrieve-optics-capabilities
  set_focus:
    summary: Sets a focus position on one or more of the optics.
    description: This method sets a focus position for one or more optics.
    effect: write
    write: patch
    binding: {method: setFocus}
    params:
      type: object
      properties:
        optics:
          type: array
          items:
            type: object
            x-name: SetFocusRequestOpticsItem
            properties:
              opticsId:
                type: string
                description: The optics ID to set the focus on. [type taken from the syntax template]
              position:
                type: number
                description: The new focus position. Can be a value between 0 and 1. [type taken from the syntax
                  template]
          description: Container (not itself listed in the parameter table).
    examples:
    - title: Set focus
      request:
        params:
          optics:
          - {opticsId: '0', position: 0.2}
          - {opticsId: '1', position: 0.3}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/optics-control/#set-focus
    - title: Set focus (error response)
      request:
        params:
          optics:
          - {opticsId: '0', position: 0.2}
          - {opticsId: '1', position: 0.3}
      response:
        error: {code: 1200, message: Internal error}
      source: https://developer.axis.com/vapix/network-video/optics-control/#set-focus
  set_relative_focus:
    summary: Changes the focus relative to the current position on one or more optics.
    description: This method changes the current focus with relative focus movement.
    effect: write
    write: patch
    binding: {method: setRelativeFocus}
    params:
      type: object
      properties:
        optics:
          type: array
          items:
            type: object
            x-name: SetRelativeFocusRequestOpticsItem
            properties:
              opticsId:
                type: string
                description: The optics ID to change the relative focus on. [type taken from the syntax template]
              type:
                type: string
                enum: [+bigStep, -bigStep, +smallStep, -smallStep, numerical]
                description: 'Possible values: `+bigStep`, `-bigStep`, `+smallStep`, `-smallStep`, `numerical`.
                  [type taken from the syntax template]'
              value:
                type: number
                description: The desired focus offset. Use it when `params.optics[].type` is set to `numerical`.
                  [type taken from the syntax template]
          description: Container (not itself listed in the parameter table).
    examples:
    - title: Change the focus relative to the current position
      request:
        params:
          optics:
          - {opticsId: '0', type: +bigStep}
          - {opticsId: '1', type: numerical, value: -0.1}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/optics-control/#change-the-focus-relative-to-the-current-position
    - title: Change the focus relative to the current position (error response)
      request:
        params:
          optics:
          - {opticsId: '0', type: +bigStep}
          - {opticsId: '1', type: numerical, value: -0.1}
      response:
        error: {code: 1100, message: Internal error}
      source: https://developer.axis.com/vapix/network-video/optics-control/#change-the-focus-relative-to-the-current-position
  set_magnification:
    summary: Sets a magnification on one or more of the optics.
    description: This method sets the magnification for one or more optics. Please note that this is only available
      on products with the capability zoom. See [getCapabilities](#getcapabilities) to find out if your product
      supports specific capabilities.
    effect: write
    write: patch
    binding: {method: setMagnification}
    params:
      type: object
      properties:
        optics:
          type: array
          items:
            type: object
            x-name: SetMagnificationRequestOpticsItem
            properties:
              opticsId:
                type: string
                description: The optics ID to set magnification on. [type taken from the syntax template]
              magnification:
                type: number
                description: The new magnification value. Can be a value between 1 and `maxMagnification` in the
                  `getOptics` call. [type taken from the syntax template]
          description: Container (not itself listed in the parameter table).
    examples:
    - title: Set magnification
      request:
        params:
          optics:
          - {opticsId: '0', magnification: 1.4}
          - {opticsId: '1', magnification: 1.5}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/optics-control/#set-magnification
    - title: Set magnification (error response)
      request:
        params:
          optics:
          - {opticsId: '0', magnification: 1.4}
          - {opticsId: '1', magnification: 1.5}
      response:
        error: {code: 1100, message: Internal error}
      source: https://developer.axis.com/vapix/network-video/optics-control/#set-magnification
    - title: Set magnification (error response)
      request:
        params:
          optics:
          - {opticsId: '0', magnification: 1.4}
          - {opticsId: '1', magnification: 1.5}
      response:
        error: {code: 1100, message: Internal error}
      source: https://developer.axis.com/vapix/network-video/optics-control/#set-magnification
    - title: Set magnification (error response)
      request:
        params:
          optics:
          - {opticsId: '0', magnification: 1.4}
          - {opticsId: '1', magnification: 1.5}
      response:
        error: {code: 1200, message: Temperature out of range}
      source: https://developer.axis.com/vapix/network-video/optics-control/#set-magnification
  set_relative_magnification:
    summary: Changes the magnification relative to the current position on one or more optics.
    description: This method changes the current magnification with relative magnification movement.
    effect: write
    write: patch
    binding: {method: setRelativeMagnification}
    params:
      type: object
      properties:
        optics:
          type: array
          items:
            type: object
            x-name: SetRelativeMagnificationRequestOpticsItem
            properties:
              opticsId:
                type: string
                description: The optics ID to change the relative magnification on. [type taken from the syntax
                  template]
              type:
                type: string
                enum: [+bigStep, -bigStep, +smallStep, -smallStep, numerical]
                description: 'Possible values: `+bigStep`, `-bigStep`, `+smallStep`, `-smallStep`, `numerical`.
                  [type taken from the syntax template]'
              value:
                type: number
                description: The desired magnification offset. Use it when `params.optics[].type` is set to `numerical`.
                  [type taken from the syntax template]
          description: Container (not itself listed in the parameter table).
    examples:
    - title: Change the magnification relative to the current position
      request:
        params:
          optics:
          - {opticsId: '0', type: +bigStep}
          - {opticsId: '1', type: numerical, value: -0.1}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/optics-control/#change-the-magnification-relative-to-the-current-position
    - title: Change the magnification relative to the current position (error response)
      request:
        params:
          optics:
          - {opticsId: '0', type: +bigStep}
          - {opticsId: '1', type: numerical, value: -0.1}
      response:
        error: {code: 1100, message: Internal error}
      source: https://developer.axis.com/vapix/network-video/optics-control/#change-the-magnification-relative-to-the-current-position
  calibrate:
    summary: Calibrates the optics.
    description: This method calibrates the optics for both zoom and focus, which is useful for optics that ended
      up in an undefined state and needs a re-calibration. This is only available on devices where either `calibrateFocus`
      or `calibrateZoom` is present.
    effect: unknown
    binding: {method: calibrate}
    params:
      type: object
      properties:
        optics:
          type: array
          items:
            type: object
            x-name: CalibrateRequestOpticsItem
            properties:
              opticsId:
                type: string
                description: The optics ID to calibrate. [type taken from the syntax template]
              focus:
                type: boolean
                description: Whether to calibrate focus in optics `opticsID`. Default value is false if this parameter
                  does not get set. [type taken from the syntax template]
              zoom:
                type: boolean
                description: Whether to calibrate zoom in optics `opticsID`. Default value is false if this parameter
                  does not get set and ignored if no zoom is available on the device. [type taken from the syntax
                  template]
          description: Container (not itself listed in the parameter table).
    examples:
    - title: Calibrate optics
      request:
        params:
          optics:
          - {opticsId: '0', zoom: true, focus: true}
          - {opticsId: '1', zoom: true, focus: true}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/optics-control/#calibrate-optics
    - title: Calibrate optics (error response)
      request:
        params:
          optics:
          - {opticsId: '0', zoom: true, focus: true}
          - {opticsId: '1', zoom: true, focus: true}
      response:
        error: {code: 1200, message: Internal error}
      source: https://developer.axis.com/vapix/network-video/optics-control/#calibrate-optics
  perform_autofocus:
    summary: Starts an automatic focus search.
    effect: unknown
    binding: {method: performAutofocus}
    params:
      type: object
      properties:
        optics:
          type: array
          items:
            type: object
            x-name: PerformAutofocusRequestOpticsItem
            properties:
              opticsId:
                type: string
                description: The optics ID to perform autofocus on. [type taken from the syntax template]
          description: 'Container (not itself listed in the parameter table). Sub-fields: optics[].opticsID (string):
            The optics ID to perform autofocus on. [type taken from the syntax template]'
    examples:
    - title: Perform autofocus
      request:
        params:
          optics:
          - {opticsId: '0'}
          - {opticsId: '1'}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/optics-control/#perform-autofocus
    - title: Perform autofocus (error response)
      request:
        params:
          optics:
          - {opticsId: '0'}
          - {opticsId: '1'}
      response:
        error: {code: 1300, message: Focus not found}
      source: https://developer.axis.com/vapix/network-video/optics-control/#perform-autofocus
    - title: Perform autofocus (error response)
      request:
        params:
          optics:
          - {opticsId: '0'}
          - {opticsId: '1'}
      response:
        error: {code: 1100, message: Internal error}
      source: https://developer.axis.com/vapix/network-video/optics-control/#perform-autofocus
  reset:
    summary: Resets the optics back to their default position.
    description: This method resets the optics back to their default position.
    effect: write
    write: replace
    binding: {method: reset}
    params:
      type: object
      properties:
        optics:
          type: array
          items:
            type: object
            x-name: ResetRequestOpticsItem
            properties:
              opticsId: {type: string, description: 'The optics ID to reset. [type taken from the syntax template]'}
              focus:
                type: boolean
                description: Whether to calibrate focus in optics `opticsID`. Default value is false if this parameter
                  does not get set. [type taken from the syntax template]
              zoom:
                type: boolean
                description: Whether to calibrate zoom in optics `opticsID`. Default value is false if this parameter
                  does not get set and ignored if no zoom is available on the device. [type taken from the syntax
                  template]
          description: Container (not itself listed in the parameter table).
    examples:
    - title: Reset optics to the default position
      request:
        params:
          optics:
          - {opticsId: '0', focus: true, zoom: false}
          - {opticsId: '1', focus: true, zoom: false}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/optics-control/#reset-optics-to-the-default-position
    - title: Reset optics to the default position (error response)
      request:
        params:
          optics:
          - {opticsId: '0', focus: true, zoom: false}
          - {opticsId: '1', focus: true, zoom: false}
      response:
        error: {code: 1200, message: Internal error}
      source: https://developer.axis.com/vapix/network-video/optics-control/#reset-optics-to-the-default-position
  set_focus_window:
    summary: Sets the window in which autofocus will optimize the focus.
    description: This method sets the window where the automatic focus search should optimize the focus.
    effect: write
    write: patch
    binding: {method: setFocusWindow}
    params:
      type: object
      properties:
        optics:
          type: array
          items:
            type: object
            x-name: SetFocusWindowRequestOpticsItem
            properties:
              opticsId:
                type: string
                description: The optics ID to set the focus window on. [type taken from the syntax template]
              upperLeftX:
                type: number
                description: Specifies the upper windows upper left corner distance from the full image upper left
                  corner along the X-plane and given as a number between 0 to 1, representing the percentage of
                  the whole image.
              upperLeftY:
                type: number
                description: Specifies the upper windows upper left corner distance from the full image upper left
                  corner along the Y-plane and given as a number between 0 to 1, representing the percentage of
                  the whole image.
              width:
                type: number
                description: Specifies the upper windows width and is given as a number between 0 and 1, representing
                  the percentage of the whole image width.
              height:
                type: number
                description: Specifies the upper windows height and is given as a number between 0 and 1, representing
                  the percentage of the whole image height.
          description: Container (not itself listed in the parameter table).
    examples:
    - title: Set focus window
      request:
        params:
          optics:
          - {opticsId: '0', upperLeftX: 0.25, upperLeftY: 0.3, width: 0.5, height: 0.4}
          - {opticsId: '1', upperLeftx: 0.3, upperLeftY: 0.25, width: 0.4, height: 0.5}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/optics-control/#set-focus-window
    - title: Set focus window (error response)
      request:
        params:
          optics:
          - {opticsId: '0', upperLeftX: 0.25, upperLeftY: 0.3, width: 0.5, height: 0.4}
          - {opticsId: '1', upperLeftx: 0.3, upperLeftY: 0.25, width: 0.4, height: 0.5}
      response:
        error: {code: 1200, message: Internal error}
      source: https://developer.axis.com/vapix/network-video/optics-control/#set-focus-window
  set_temperature_compensation:
    summary: Sets the state for the active temperature compensation.
    description: This method sets the active temperature compensation that should be used. This method is only available
      if `compensateTemperature` is true. Please note that the active focus compensation might not work as well
      if your device has a non-standard lens.
    effect: write
    write: patch
    binding: {method: setTemperatureCompensation}
    params:
      type: object
      properties:
        optics:
          type: array
          items:
            type: object
            x-name: SetTemperatureCompensationRequestOpticsItem
            properties:
              opticsId:
                type: string
                description: The optics ID to set temperature compensation on. [type taken from the syntax template]
              enable:
                type: boolean
                description: Specifies if active temperature compensation should be enabled or disabled. [type taken
                  from the syntax template]
          description: Container (not itself listed in the parameter table).
  set_ir_cut_filter_state:
    summary: Sets the state for the IRCut filter.
    description: This method sets the desired state of the IRCut filter to either `on/off/auto`. The settings `on`
      and `off` reflect the manual state while `auto` leaves the decision of the IRCut filter state to the software
      algorithms.
    access: operator
    effect: write
    write: patch
    binding: {method: setIrCutFilterState}
    params:
      type: object
      properties:
        optics:
          type: array
          items:
            type: object
            x-name: SetIrCutFilterStateRequestOpticsItem
            properties:
              opticsId:
                type: string
                description: The optics ID to set the IRCut filter on. [type taken from the syntax template]
              irCutFilterState:
                type: string
                enum: ['on', 'off', auto]
                description: 'Specifies that state for the IRCut filter. Valid values are: `on`: Filter is forced
                  on. `off`: Filter is forced off. `auto`: The decision is made by the software algorithm. [type
                  not stated]'
          description: Container (not itself listed in the parameter table).
    examples:
    - title: Turn off the IRCut filter
      request:
        params:
          optics:
          - {opticsId: '0', irCutFilterState: 'off'}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/optics-control/#turn-off-the-ircut-filter
    - title: Turn off the IRCut filter (error response)
      request:
        params:
          optics:
          - {opticsId: '0', irCutFilterState: 'off'}
      response:
        error: {code: 1200, message: Internal error}
      source: https://developer.axis.com/vapix/network-video/optics-control/#turn-off-the-ircut-filter
  set_ir_compensation:
    summary: Sets the state for the active IR compensation.
    description: This method decides if IR compensation should be used.
    effect: write
    write: patch
    binding: {method: setIrCompensation}
    params:
      type: object
      properties:
        optics:
          type: array
          items:
            type: object
            x-name: SetIrCompensationRequestOpticsItem
            properties:
              opticsId:
                type: string
                description: The optics ID to set the IR compensation on. [type taken from the syntax template]
              enable:
                type: boolean
                description: Specifies if active temperature compensation should be enabled or disabled. [type taken
                  from the syntax template]
          description: Container (not itself listed in the parameter table).

