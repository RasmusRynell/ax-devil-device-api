provenance:
  completeness: complete
  open_questions:
  - getCapabilities response syntax lists only some capabilities and limits; the table lists all (incl. horizon
    straightening, getFieldOfView, set/getStitchingEnabled and horizonStraightening* limits). Syntax shows rotateAngle/restore
    literal true.
  - getParallaxCompensationDistance response syntax key spelled parallaxComensationDistance; table and examples
    should be checked against a device.
  - Request syntax blocks are invalid JSON (missing comma after method, trailing commas).
  - setStitchingEnabled use-case example omits params.stitchingEnabled.
  - Range of horizonStraighteningTilt not stated (only via limits horizonStraighteningTiltMin/Max); table key horizonStraighteningStretchMin
    lacks "=".
  - Exact API version history (1.x vs 3.x) not documented; which version introduced horizon straightening / stitchingEnabled
    unknown.
  - AXIS OS minimum version not stated.
  - 'migration: other-majors: API also documents major(s) 1; this spec covers major 3 only. A separate spec (module
    suffix _v2 for later majors) is needed for the others'
  - 'migration: effect-guessed: write semantics guessed from the method name: set_blending_amount=write/patch, set_parallax_compensation_distance=write/patch,
    set_horizon_straightening_enabled=write/patch, set_horizon_straightening_tilt=write/patch, set_horizon_straightening_stretch_enabled=write/patch,
    set_horizon_straightening_stretch_amount=write/patch, set_stitching_enabled=write/patch'
  - 'migration: effect-unknown: effect could not be inferred from the method name: rotate_angle, restore'
