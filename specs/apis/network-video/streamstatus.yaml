types:
  Stream:
    type: object
    properties:
      destination_address: {type: string, description: The IPv4 or IPv6 address of the client.}
      destination_port: {type: integer, description: The port of the client.}
      direction: {type: string, enum: [incoming, outgoing], description: Direction of the stream.}
      encrypted: {type: boolean, description: Indicates whether the stream is encrypted or not.}
      id:
        type: integer
        minimum: 1
        description: The ID of the stream. It should be one or greater than one.
      media: {type: string, enum: [audio, metadata, video], description: The media type.}
      mime:
        type: string
        enum:
        - audio/mpeg
        - application/x-onvif-metadata+xml
        - video/x-h264
        - audio/x-opus
        - audio/x-adpcm
        - audio/x-mulaw
        - audio/x-raw
        - image/jpeg
        - video/x-h265
        description: The MIME type.
      multicast: {type: boolean, description: Optional. Indicates whether the stream uses multicast or not.}
      options:
        type: object
        additionalProperties: {type: string}
        description: Container for URL options in a stream request. See Video streaming public parameter description
          / RTSP URL parameter specification.
      path: {type: string, description: The server path.}
      source_address: {type: string, description: The IPv4 or IPv6 address of the server.}
      source_port: {type: integer, description: The port of the server.}
      state:
        type: string
        enum: [paused, playing]
        description: The current state of the streaming pipeline.
      stream_protocol: {type: string, description: The stream protocol that is used.}
      transport_protocol: {type: string, enum: [TCP, UDP], description: The transport protocol that is used.}
      user_agent: {type: string, description: Information about the client.}

operations:
  get_all_streams:
    summary: List all running streams on a device.
    effect: read
    binding: {method: getAllStreams}
    result:
      type: object
      properties:
        streams:
          type: array
          items: {$ref: '#/types/Stream'}
    errors:
      2106: {description: Authentication failed. Couldn't authenticate.}
    examples:
    - title: List all running streams
      request:
        params: {}
      response:
        data:
          streams:
          - destination_address: 192.168.0.1
            destination_port: 32986
            direction: outgoing
            encrypted: false
            id: 11
            media: video
            mime: video/x-h264
            multicast: false
            options: {audio: '0', video: '1'}
            path: /axis-media/media.amp
            source_address: 192.168.0.141
            source_port: 50000
            state: playing
            stream_protocol: RTP
            transport_protocol: UDP
            user_agent: GStreamer/1.22.0
      source: https://developer.axis.com/vapix/network-video/stream-status-api/#getallstreams

