format: 2
id: streamstatus
name: Stream status API
summary: List running (RTSP) streams on a device via /axis-cgi/streamstatus.cgi.
section: network-video
family: jsonrpc
status: released
python:
  module: stream_status
  class: StreamStatus
docs:
