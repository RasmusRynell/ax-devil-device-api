format: 2
id: clear-view
name: Clear view
summary: Activate lens/dome cleaning functions (wiper, speed dry) and query their capabilities and status.
section: network-video
family: jsonrpc
status: released
python:
  module: clear_view
  class: ClearView
docs:
- https://developer.axis.com/vapix/network-video/clear-view/
access: operator
discovery:
- param: {name: Properties.API.HTTP.Version, value: '3'}
- param: {name: Properties.ClearView.ClearView, value: 'yes'}
requires:
  firmware: '7.10'

binding:
  path: /axis-cgi/clearviewcontrol.cgi
  major: 2
  versions: ['2.1']
  negotiation:
    get_supported_versions: {key: apiVersions}
  params_placement: params

errors:
  1000: {description: Invalid parameter value., kind: invalid_argument}
  1001: {description: The requested Clear View device ID is not supported., kind: unsupported}
  1002: {description: Device in incompatible state.}
  1003: {description: Requested duration outside supported limits.}
  1005: {description: Temperature out of range.}
  2000: {description: Out of memory.}
  2001: {description: Access forbidden (similar to HTTP 403)., kind: access_denied}
  2002: {description: HTTP request type not supported. Only POST supported., kind: unsupported}
  2003: {description: The requested API version is not supported., kind: unsupported}
  2004: {description: Method not supported., kind: unsupported}
  4000: {description: The provided JSON input was invalid., kind: invalid_argument}
  4001: {description: A mandatory input parameter was not found in the input., kind: not_found}
  4002: {description: The type of a provided JSON parameter was incorrect., kind: invalid_argument}
  8000: {description: Internal error., kind: internal}

types:
  ServiceInfo:
    type: object
    properties:
      id: {type: integer, description: The ID of the clear view device.}
      type:
        type: string
        enum: [wiper, speeddry]
        description: Defined types are wiper and speeddry.
      durationVariable: {type: boolean, description: The duration control (whether duration can be set).}
      durationMin: {type: integer, description: Present if durationVariable = true. Seconds (inferred).}
      durationMax: {type: integer, description: Present if durationVariable = true. Seconds (inferred).}
      durationDefault: {type: integer, description: 'The default duration, measured in seconds.'}
      stoppable: {type: boolean, description: Whether the stop command is supported for the device.}
      idleTimeMin:
        type: integer
        description: Included if the device needs to rest between runs, measured in seconds.
  Status:
    type: object
    properties:
      id: {type: integer, description: The ID of the clear view device.}
      state: {type: string, enum: [idle, running, waiting]}
      stopsIn: {type: integer, description: 'Present if state is running (seconds, inferred).'}
      availableIn:
        type: integer
        description: Present if idleTimeMin > 0 and state is running or waiting (seconds, inferred).

operations:
  get_service_info:
    summary: Retrieves the Clear view service information (static values only).
    effect: read
    binding: {method: getServiceInfo}
    result:
      type: object
      properties:
        serviceInfo:
          type: array
          items: {$ref: '#/types/ServiceInfo'}
    examples:
    - title: Get service info
      request:
        params: {}
      response:
        data:
          serviceInfo:
          - id: 0
            type: wiper
            durationVariable: true
            durationMin: 5
            durationMax: 120
            durationDefault: 5
            idleTimeMin: 0
            stoppable: true
          - id: 1
            type: speeddry
            durationVariable: false
            durationDefault: 10
            idleTimeMin: 15
            stoppable: false
      source: https://developer.axis.com/vapix/network-video/clear-view/#get-service-info
  get_status:
    summary: Retrieves the Clear view service status for one service (dynamic values).
    effect: read
    binding: {method: getStatus}
    params:
      type: object
      required: [id]
      properties:
        id: {type: integer, description: The device ID (from getServiceInfo).}
    result:
      type: object
      properties:
        status: {$ref: '#/types/Status'}
    examples:
    - title: Response syntax (API specification)
      request:
        params: {id: 0}
      response:
        data:
          status: {state: running, stopsIn: 3, availableIn: 13}
      source: https://developer.axis.com/vapix/network-video/clear-view/#getstatus
  start:
    summary: Initiates the Clear view function for one service (default or specified duration).
    effect: action
    binding: {method: start}
    params:
      type: object
      required: [id]
      properties:
        id: {type: integer, description: The device ID.}
        duration:
          type: integer
          description: 'The duration, measured in seconds. Default: durationDefault. (unit=s)'
    examples:
    - title: Start with default duration
      request:
        params: {id: 0}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/clear-view/#start-cleaning-view
    - title: Start with duration 30
      request:
        params: {id: 0, duration: 30}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/clear-view/#start-cleaning-view
  stop:
    summary: Halts a currently running Clear view function on a service.
    effect: action
    binding: {method: stop}
    params:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          description: The device ID. Only services with stoppable=true can be stopped (inferred from getServiceInfo).
    examples:
    - title: Stop cleaning view
      request:
        params: {id: 1}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/clear-view/#stop-cleaning-view

