format: 2
id: io-port-management
name: I/O port management
summary: Retrieve I/O port info/capabilities, configure ports (name, usage, direction, normal state, output state)
  and run output state sequences via...
section: network-video
family: jsonrpc
status: released
python:
  module: io_port_management
  class: IoPortManagement
docs:
