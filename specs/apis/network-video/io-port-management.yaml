provenance:
  completeness: complete
  open_questions:
  - setStateSequence table types params.port as <integer>; syntax/examples use string (modelled as string).
  - getPorts error example uses code 4004, which is not in the error table.
  - setStateSequence is documented with Security level Viewer although it changes output state (verify).
  - 'Example text says port 0 "has readonly=0" while the response shows readonly: true.'
  - Event topics are listed without data/source fields; namespace URIs not stated on page.
  migrated_from: v1
  curated: true
