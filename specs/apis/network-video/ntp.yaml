provenance:
  completeness: complete
  open_questions:
  - Example curl URLs are malformed ("http://<servername>http://<servername>/axis-cgi/ntp.cgi").
  - getNTPInfo param table says method="getNtpInfo" while syntax uses getNTPInfo.
  - setNTPClientConfiguration table uses params.client.NTSKEServerCACerts while syntax uses params.NTSKEServerCACerts.
  - Overview mentions a server section in getNTPInfo response, which is not documented.
  - Example timeOffset -12.34 and minpoll 2/maxpoll 2.
  - 'Doc says "The minimum value should not be lower than the maximum values" (likely inverted: minpoll should not
    exceed maxpoll).'
  - Example IP 13.8.343.12 is not a valid IPv4 address (doc example).
  - Error subCode 4 is not listed.
  - getSupportedVersions security level stated as Administrator.
  - 'migration: effect-guessed: write semantics guessed from the method name: set_ntp_client_configuration=write/patch'
  migrated_from: v1
  curated: false
