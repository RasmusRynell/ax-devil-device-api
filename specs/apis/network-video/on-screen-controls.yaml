format: 2
id: on-screen-controls
name: On-screen controls API
summary: List the features an operator can trigger from a video client, in several languages. Add, remove, enable
  and disable feature descriptions.
section: network-video
family: jsonrpc
status: released
python:
  module: on_screen_controls
  class: OnScreenControls
docs:
- https://developer.axis.com/vapix/network-video/on-screen-controls/
access: admin
discovery:
- param: {name: Properties.PackageManager.PackageManager, value: 'yes'}
- param: {name: Properties.AddOnFramework.Version, value: '1.0'}
requires:
  firmware: '7.10'

binding:
  path: /local/axis-onscreencontrols/onscreencontrols.cgi
  major: 1
  versions: ['1.0', '1.1', '1.3', '1.4']
  negotiation:
    get_supported_versions: {key: apiVersions}
  params_placement: params

errors:
  1001: {description: Out of memory., kind: internal}
  1002: {description: Error in the CGI request., kind: invalid_argument}
  1003: {description: CGI request is an invalid method., kind: invalid_argument}
  2001: {description: Error in the database., kind: internal}
  2002: {description: Invalid locale., kind: invalid_argument}
  2003: {description: Invalid JSON., kind: invalid_argument}
  2004: {description: Unsupported API version., kind: unsupported}
  2005: {description: Missing data param., kind: invalid_argument}
  9999: {description: Internal error., kind: internal}

types:
  FeatureGroup:
    type: object
    description: A group of features, possibly with nested groups. The root group is named ``root``.
    required: [name]
    properties:
      name: {type: string, description: "Name of the group in English, used as an identifier."}
      niceName:
        type: string
        description: Translated name of the group according to the requested locale.
      featureGroups:
        type: array
        items: {$ref: '#/types/FeatureGroup'}
        description: Nested groups, used for grouping features together like PTZ features. Features added with
          addFeatures are placed in a post install group, and then an individual group for the specific request.
      features:
        type: array
        items: {$ref: '#/types/Feature'}
        description: The features located in this group.
      status:
        type: string
        enum: [enabled, disabled]
        description: Whether the group is enabled. Appears in examples only; not in the field tables.
  Feature:
    type: object
    description: One feature, with the request a client sends to the camera to trigger it.
    required: [name]
    properties:
      name: {type: string, description: "Name of the feature in English, used as an identifier."}
      niceName: {type: string, description: Translated name of the feature according to the requested locale.}
      user:
        type: array
        items: {type: string, enum: [operator, admin, event]}
        description: Recommended user level for accessing this feature.
      info: {type: string, description: Translated information string about the feature.}
      requestType:
        type: string
        enum: [GET, POST]
        description: How the CGI request should be sent to the camera.
      requestPayload:
        type: string
        enum: [JSON, BINARY]
        description: The format of the request payload. SOAP and XML are reserved for future use.
      requestURL:
        type: string
        description: URL that triggers the feature; ``<param>`` placeholders are replaced by parameter values.
      response:
        type: boolean
        description: Whether the request returns a value to the video client.
      vmsHint:
        type: array
        items: {$ref: '#/types/VmsHint'}
        description: Client side actions that are suitable when the button is pressed. Not mandatory.
      vmsReq:
        type: array
        items: {$ref: '#/types/VmsReq'}
        description: Requirements on the client that must be fulfilled for the button to be useful.
      jsonTemplate:
        type: string
        description: Template for the JSON payload of a POST request; only present when requestPayload is JSON.
      parameters:
        type: object
        additionalProperties: {$ref: '#/types/RequestUrlParameter'}
        description: The parameters to use in requestURL, keyed by parameter name.
  RequestUrlParameter:
    type: object
    description: One parameter of a feature request. Which fields apply depends on ``type``.
    properties:
      type:
        type: string
        description: "Parameter type: a range, a geometric type (coordinate, line, box, polygon), a string, a multiOption,
          transmitAudioData, or a JSON-only type (fixed, context, keyOnly)."
      niceName: {type: string, description: Short description (one or two words) of the parameter.}
      info: {type: string, description: Optional information about the parameter.}
      Key: {type: string, x-python-name: key, description: String to use as a key for parameters in a JSON payload.}
      jsonVariableFormat: {$ref: '#/types/JsonVariableFormat', description: Format of the value in a JSON payload.}
      value: {type: string, description: "Value for the JSON-only types ``fixed`` and ``context``."}
      defaultValue: {type: string, description: "Default value for range, string and multiOption parameters."}
      unit:
        type: string
        enum: [integer, fraction]
        description: Range parameters, the type of value.
      min: {type: string, description: "Range parameters, minimum value."}
      max: {type: string, description: "Range parameters, maximum value."}
      step: {type: string, description: "Range parameters, step size."}
      values:
        type: array
        items: {$ref: '#/types/MultiOptionValue'}
        description: multiOption parameters, the possible values.
      contentType:
        oneOf:
        - {type: string}
        - type: array
          items: {type: string}
        description: "transmitAudioData parameters, the accepted audio content types: g711, g726, axis-mulaw-128."
  MultiOptionValue:
    type: object
    properties:
      value: {type: string, description: Value that should be part of requestURL.}
      niceName: {type: string, description: Translated name.}
  JsonVariableFormat:
    enum: [string, integer, fraction, exponent, boolean, 'null']
  VmsHint:
    enum:
    - windowClose
    - audioOutDisable
    - audioOutEnable
    - audioOutToggle
    - audioInDisable
    - audioInEnable
    - audioInToggle
    - hidden
  VmsReq:
    description: "eventStream: the button produces an event in the Dynamic Event Stream."
    enum: [eventStream]
  Languages:
    type: object
    required: [languages]
    properties:
      languages:
        type: array
        items: {$ref: '#/types/Language'}
  Language:
    type: object
    required: [language, locale]
    properties:
      language: {type: string, description: Name of the language.}
      locale: {type: string, description: "Locale specifier, for example en-us."}
  FeatureDescription:
    type: object
    required: [featureDescription]
    properties:
      featureDescription: {$ref: '#/types/FeatureGroup', description: 'Root feature group (name "root").'}
  FeaturesByLocale:
    type: object
    description: Feature descriptions keyed by locale.
    additionalProperties: {$ref: '#/types/FeatureGroup'}
  AddedFeatures:
    type: object
    required: [addedFeatures]
    properties:
      addedFeatures:
        type: array
        items: {$ref: '#/types/AddedFeature'}
  AddedFeature:
    type: object
    required: [name, locales]
    properties:
      name: {type: string, description: Name of the added feature group.}
      locales:
        type: array
        items: {$ref: '#/types/Language'}
        description: The locales the feature group was added for.

operations:
  languages:
    summary: Get a list of supported languages and locales.
    access: viewer
    effect: read
    binding: {method: languages}
    result: {$ref: '#/types/Languages'}
    examples:
    - title: Languages
      request:
        params: {}
      response:
        data:
          languages:
          - {language: English, locale: en-us}
          - {language: Svenska, locale: sv-se}
          - {language: Deutsch, locale: de-de}
      source: https://developer.axis.com/vapix/network-video/on-screen-controls/#languages
  features:
    summary: Get descriptions of available features in one of the supported languages.
    description: Features without a description in the requested locale fall back to en-us. An unsupported locale gives an error.
    access: viewer
    effect: read
    since_fields: {"params.channel": "1.4"}
    binding: {method: features}
    params:
      type: object
      properties:
        locale: {type: string, default: en-us, description: "A locale specifier, for example en-us, from the languages operation."}
        acceptLocaleMismatch:
          type: boolean
          default: false
          description: If set to true, feature information that is not available in the given locale or in English
            will be included in the response in the first found language. Otherwise it will be ignored. Defaults
            to false.
        channel:
          type: integer
          description: A channel/source specifier that filters the returning information. If set, the default returned
            information will contain both the features with the chosen channel ID and the features without a channel
            ID.
    result: {$ref: '#/types/FeatureDescription'}
    examples:
    - title: Get a list of features that support the Swedish language
      request:
        params: {locale: sv-sv, acceptLocaleMismatch: false}
      response:
        error: {code: 2002, message: The given locale is not supported.}
      x-contract: {skip: "The docs show this error as {errorCode, errorMsg} instead of {code, message}."}
      source: https://developer.axis.com/vapix/network-video/on-screen-controls/#get-a-list-of-features-that-support-the-swedish-language
    - title: Use a feature that accepts audio data
      request:
        params: {locale: en-us}
      response:
        data:
          featureDescription:
            name: root
            niceName: ''
            featureGroups:
            - name: transmitAudio
              niceName: Play audio
              featureGroups: []
              features:
              - user: [operator]
                name: transmitAudio
                niceName: Play audio
                info: Play audio
                requestType: POST
                requestPayload: BINARY
                response: false
                requestURL: /axis-cgi/audio/transmit.cgi
                parameters:
                  audio: {type: transmitAudioData, contentType: [g711, g726, axis-mulaw-128]}
              status: enabled
            features: []
      source: https://developer.axis.com/vapix/network-video/on-screen-controls/#use-a-feature-that-accepts-audio-data
  add_features:
    summary: Add information about a manually installed feature.
    description: Saves the feature descriptions for the given locale.
    effect: write
    write: create
    binding: {method: addFeatures}
    params:
      type: object
      required: [locale, language, featureDescription]
      properties:
        locale:
          type: string
          pattern: ^[a-z]{2}(-[a-z]{2})?$
          description: Must be formatted in on of two ways, `ab` or `ab-xy`.
        language: {type: string, description: Name of the language.}
        featureDescription:
          $ref: '#/types/FeatureGroup'
          description: The feature group to add. The field table points to the feature structure, but the examples pass a feature group.
    examples:
    - title: Add features
      request:
        params:
          locale: en-us
          language: English
          featureDescription:
            name: featureGroup_identifier
            niceName: featureGroup niceName
            featureGroups: []
            features:
            - user: [operator]
              name: colorLevel
              niceName: Color Level
              info: Choose color level
              requestType: GET
              requestURL: /axis-cgi/param.cgi?action=update&root.ImageSource.I0.Sensor.ColorLevel=<color>
              parameters: {}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/on-screen-controls/#add-features
  list_added_features:
    summary: Get a list of manually added features.
    access: admin
    effect: read
    binding: {method: listAddedFeatures}
    result: {$ref: '#/types/AddedFeatures'}
    examples:
    - title: List added features
      request:
        params: {}
      response:
        data:
          addedFeatures:
          - name: featureGroup_identifier
            locales:
            - {locale: en-us, language: English}
            - {locale: de-de, language: Deutsch}
            - {locale: es-es, language: Espanol}
          - name: featureGroup_identifier_2
            locales:
            - {locale: de-de, language: Deutsch}
          - name: featureGroup_identifier_3
            locales:
            - {locale: es-es, language: Espanol}
      source: https://developer.axis.com/vapix/network-video/on-screen-controls/#list-added-features
  remove_features:
    summary: Remove information about a manually installed feature.
    description: Removes the feature group added for a locale.
    effect: write
    write: delete
    binding: {method: removeFeatures}
    params:
      type: object
      required: [locale, name]
      properties:
        locale:
          type: string
          description: The locale for which the feature group should be removed.
        name: {type: string, description: The feature group to remove.}
    examples:
    - title: Remove features
      request:
        params: {locale: en-us, name: featureGroup_identifier}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/on-screen-controls/#remove-features
  get_all_features:
    summary: Get a collection of feature descriptions in all available languages.
    description: 'A CGI method for retrieving all feature descriptions in all available languages. The returned
      collection contains all feature descriptions arranged in JSON objects identical with [Features](#features-api-specification),
      using locales as keys. The locales are the same as returned by [Languages](#languages-api-specification).
      '
    since: '1.1'
    access: viewer
    effect: read
    binding: {method: getAllFeatures}
    params:
      type: object
      properties:
        showDisabled: {type: boolean, description: Include disabled features. Used in the docs' example only; the docs say the method takes no parameters.}
    result: {$ref: '#/types/FeaturesByLocale'}
    examples:
    - title: Get a collection of all feature descriptions
      request:
        params: {}
      response:
        data:
          en-us:
            name: root
            niceName: ''
            featureGroups:
            - name: PTZ
              niceName: PTZ
              featureGroups: []
              features:
              - user: [operator]
                name: SpeedDry
                niceName: Speed Dry
                info: Remove water from the camera dome.
                requestType: GET
                response: false
                requestURL: /axis-cgi/com/ptz.cgi?auxiliary=speeddry
            features: []
          de-de:
            name: root
            niceName: ''
            featureGroups:
            - name: PTZ
              niceName: PTZ
              featureGroups: []
              features:
              - user: [operator]
                name: SpeedDry
                niceName: Speed Dry
                info: Wasser aus der Kamera entfernen.
                requestType: GET
                response: false
                requestURL: /axis-cgi/com/ptz.cgi?auxiliary=speeddry
            features: []
          sv-sv:
            name: root
            niceName: ''
            featureGroups:
            - name: PTZ
              niceName: PTZ
              featureGroups: []
              features:
              - user: [operator]
                name: SpeedDry
                niceName: Speed Dry
                info: Avlägsna vatten från kameran.
                requestType: GET
                response: false
                requestURL: /axis-cgi/com/ptz.cgi?auxiliary=speeddry
            features: []
      source: https://developer.axis.com/vapix/network-video/on-screen-controls/#get-a-collection-of-all-feature-descriptions
    - title: Get a collection of all feature descriptions (error response)
      request:
        params: {}
      response:
        error: {code: 9999, message: Internal error}
      source: https://developer.axis.com/vapix/network-video/on-screen-controls/#get-a-collection-of-all-feature-descriptions
    - title: Get a collection of all feature descriptions including disabled features
      request:
        params: {showDisabled: true}
      response:
        data:
          en-us:
            name: root
            niceName: ''
            featureGroups:
            - name: PTZ
              niceName: PTZ
              featureGroups: []
              features:
              - user: [operator]
                name: SpeedDry
                niceName: Speed Dry
                info: Remove water from the camera dome.
                requestType: GET
                response: false
                requestURL: /axis-cgi/com/ptz.cgi?auxiliary=speeddry
            features: []
            status: disabled
          de-de:
            name: root
            niceName: ''
            featureGroups:
            - name: PTZ
              niceName: PTZ
              featureGroups: []
              features:
              - user: [operator]
                name: SpeedDry
                niceName: Speed Dry
                info: Wasser aus der Kamera entfernen.
                requestType: GET
                response: false
                requestURL: axis-cgi/com/ptz.cgi?auxiliary=speeddry
            features: []
            status: enabled
          sv-sv:
            name: root
            niceName: ''
            featureGroups:
            - name: PTZ
              niceName: PTZ
              featureGroups: []
              features:
              - user: [operator]
                name: SpeedDry
                niceName: Speed Dry
                info: Avlägsna vatten från kameran.
                requestType: GET
                response: false
                requestURL: /axis-cgi/com/ptz.cgi?auxiliary=speeddry
            features: []
            status: disabled
      source: https://developer.axis.com/vapix/network-video/on-screen-controls/#get-a-collection-of-all-feature-descriptions-including-disabled-features
    - title: Get a collection of all feature descriptions including disabled features (error response)
      request:
        params: {showDisabled: true}
      response:
        error: {code: 9999, message: Internal error}
      source: https://developer.axis.com/vapix/network-video/on-screen-controls/#get-a-collection-of-all-feature-descriptions-including-disabled-features
  enable_feature:
    summary: Show the option to enable/disable a feature.
    description: Changes the status of a feature to ``enabled``.
    since: '1.3'
    effect: write
    write: patch
    binding: {method: enableFeature}
    params:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: The name of the feature that should be enabled.
    examples:
    - title: Enable features
      request:
        params: {name: IR}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/on-screen-controls/#enable-features
    - title: Enable features (error response)
      request:
        params: {name: IR}
      response:
        error: {code: 2005, message: Feature not found.}
      source: https://developer.axis.com/vapix/network-video/on-screen-controls/#enable-features
  disable_feature:
    summary: Remove the option to enable/disable a feature.
    description: Changes the status of a feature to ``disabled``.
    since: '1.3'
    effect: write
    write: patch
    binding: {method: disableFeature}
    params:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: The name of the feature that should be disabled.
    examples:
    - title: Disable features
      request:
        params: {name: IR}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/on-screen-controls/#disable-features
    - title: Disable features (error response)
      request:
        params: {name: IR}
      response:
        error: {code: 2005, message: Feature not found.}
      source: https://developer.axis.com/vapix/network-video/on-screen-controls/#disable-features

sources:
- url: https://developer.axis.com/vapix/network-video/on-screen-controls/
  sha256_md: 8cf8384956679349ff5828ce8db5b46d04fccc0e54885beb6f449394d394abae
  retrieved_at: '2026-10-11'

provenance:
  completeness: complete
  open_questions:
  - 'Versions: the method pages and examples use 1.0 to 1.4 (since: getAllFeatures 1.1, enableFeature and disableFeature 1.3), but the getSupportedVersions example returns ["1.1", "2.0"] with apiVersion 2.0. The spec binds major 1; major 2 is not documented beyond that example.'
  - The channel parameter of features is gated at 1.4 because only the 1.4 example uses it; the field table gives no version.
  - Per-method apiVersion lines are minimum versions; the docs do not say when later minors changed behaviour.
  - RequestUrlParameter.type valid values are spread over several tables without a single list, so type is a free string. The range, string, multiOption, JSON-only and transmitAudioData fields are merged into one model.
  - Range fields defaultValue, min, max and step are typed String in the docs.
  - transmitAudioData contentType is typed String in the table but is an array in the example; both are accepted.
  - addFeatures locale "Must be formatted in on of two ways, ab or ab-xy" - the pattern is inferred.
  - The field "Key" in the requestURL parameter structure is capitalized in the docs (wire name uncertain).
  - addFeatures featureDescription links to the feature structure, but the examples pass a feature group; modelled as a feature group.
  - status (enabled, disabled) appears on feature groups in examples only, and getAllFeatures showDisabled only in an example; neither is in a field table.
  - The unsupported-locale example error uses {errorCode, errorMsg} instead of {code, message}; the example is skipped in contract tests.
  - Error 2005 is described as "Missing data param" but the enableFeature and disableFeature examples use it for "Feature not found.".
  - Application identification (the addon.cgi status method lists axis-onscreencontrols as active) cannot be expressed as a discovery entry.
  - listAddedFeatures example contains a typo ("langauge"), corrected in the spec example.
  migrated_from: v1
  curated: true
