provenance:
  completeness: complete
  open_questions:
  - Per-method apiVersion lines (since) are 1.0 for most methods while examples use 1.4; when each later minor version
    was introduced is not documented.
  - RequestURLParameter.type valid values are spread over several tables (range, geometric types, string, multiOption,
    json-only types, transmitAudioData) without an explicit single list.
  - Range fields defaultValue/min/max/step are typed String in the doc.
  - addFeatures locale "Must be formatted in on of two ways, ab or ab-xy" — pattern inferred.
  - Field "Key" in requestURL parameter structure is capitalized in the doc (wire name uncertain).
  - 'migration: other-majors: API also documents major(s) 1; this spec covers major 2 only. A separate spec (module
    suffix _v2 for later majors) is needed for the others'
  - 'migration: effect-unknown: effect could not be inferred from the method name: languages, features, enable_feature,
    disable_feature'
  - 'migration: discovery: discovery method other dropped'
  migrated_from: v1
  curated: false
