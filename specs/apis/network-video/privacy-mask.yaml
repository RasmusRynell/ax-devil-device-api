format: 2
id: privacy-mask
name: Privacy mask API
summary: Create, update, remove, locate and toggle privacy masks through ``privacymask.cgi`` (follows pan/tilt/zoom) and the ``Image.I#.Overlay.MaskWindows`` parameters.
section: network-video
family: cgi
status: released
python:
  module: privacy_mask
  class: PrivacyMask
docs:
  - https://developer.axis.com/vapix/network-video/overlay-api/
access: admin
discovery:
  - api_discovery: privacy-mask
  - param: {name: Properties.API.HTTP.Version, value: "3"}
  - param: {name: Properties.PrivacyMask.PrivacyMask, value: "yes"}
binding:
  path: /axis-cgi/privacymask.cgi

types:
  PixelPoint:
    type: object
    required: [x, y]
    properties:
      x: {type: integer, description: Horizontal pixel coordinate. Outside the current view it may be negative or larger than the image width.}
      y: {type: integer, description: Vertical pixel coordinate. Outside the current view it may be negative or larger than the image height.}
  MaskPixels:
    type: object
    description: A privacy mask with pixel coordinates in the camera's maximum resolution at rotation 0.
    required: [id, name, enabled, zoomlowlimit, position]
    properties:
      id: {type: integer}
      name: {type: string}
      enabled: {type: boolean}
      zoomlowlimit: {type: integer, description: Zoom position below which the mask is hidden.}
      zoom_visible:
        type: boolean
        description: Whether the position polygon is visible given the ``zoomlowlimit`` setting. Not always present.
      position:
        type: array
        items: {$ref: "#/types/PixelPoint"}
        description: >-
          External corners (set by the user), up to ``Properties.PrivacyMask.MaxNbrOfCorners``. Empty if the
          mask is not visible at the current camera position.
      all_position:
        type: array
        items: {$ref: "#/types/PixelPoint"}
        description: The corners in ``position`` plus any helper corners added by the service. Not always present.
  MaskList:
    type: object
    required: [listpx]
    properties:
      listpx:
        type: array
        items: {$ref: "#/types/MaskPixels"}
        x-python-name: masks
  MaskPosition:
    type: object
    required: [position]
    properties:
      position:
        type: array
        items: {$ref: "#/types/PixelPoint"}
        description: Corners of the mask. Empty if the mask is not visible at the current camera position.

operations:
  add_mask:
    summary: Add a new mask with a unique name.
    description: >-
      Give either ``width`` and ``height`` (percent of the image, optionally with ``center``), or
      ``pxpolygon``. The device replies 204 No content.
    effect: write
    write: create
    binding:
      method: GET
      query: {action: add}
      reply: text
    params: &mask_params
      type: object
      required: [name]
      properties:
        name: &mask_name
          type: string
          maxLength: 128
          description: Unique name that identifies the mask.
        imagesource: &image_source
          type: integer
          minimum: 0
          description: Image source index, 0 to the number of image sources - 1. The device uses 0 when omitted.
        width:
          type: number
          minimum: 0.0
          maximum: 100.0
          description: Width of the mask in percent of the image width.
        height:
          type: number
          minimum: 0.0
          maximum: 100.0
          description: Height of the mask in percent of the image height.
        center:
          type: string
          pattern: ^[0-9]+(\.[0-9]+)?,[0-9]+(\.[0-9]+)?$
          description: >-
            Center of the mask as ``<x>,<y>`` in percent of the image width and height (0.0 to 100.0), used with
            ``width`` and ``height``. The mask is placed in the center of the picture when omitted.
        pxpolygon:
          type: string
          pattern: ^-?[0-9]+,-?[0-9]+(:-?[0-9]+,-?[0-9]+)*$
          description: >-
            Pixel coordinates of the corners as ``<x1>,<y1>:<x2>,<y2>:...`` in the camera's maximum resolution
            at rotation 0. The number of corners and the shape follow ``Properties.PrivacyMask.MaxNbrOfCorners``
            and ``Properties.PrivacyMask.Polygon``.
        zoomlowlimit:
          type: integer
          minimum: 0
          maximum: 19999
          description: >-
            Minimum VAPIX zoom position for the mask to be rendered; at wider zoom values the mask is not
            rendered. 0 when omitted. Up to 19999 when digital zoom is supported.
    positional: [name]
    examples:
      - title: Add a privacy mask to the center of the image
        request: {query: {name: mask1, imagesource: 2, width: 20.0, height: 20.0}}
        response: {status: 204, text: ""}
        source: https://developer.axis.com/vapix/network-video/overlay-api/#privacy-mask-api
      - title: Add and position a privacy mask
        request: {query: {name: mask1, width: 20.0, height: 20.0, center: "20.0,20.0"}}
        response: {status: 204, text: ""}
        source: https://developer.axis.com/vapix/network-video/overlay-api/#privacy-mask-api
      - title: Add a privacy mask using pixel coordinates
        request: {query: {name: mask1, pxpolygon: "500,500:800,500:700,700:400,700"}}
        response: {status: 204, text: ""}
        source: https://developer.axis.com/vapix/network-video/overlay-api/#privacy-mask-api

  update_mask:
    summary: Change the position and/or size of an existing mask.
    description: Give either ``width`` and ``height`` (optionally with ``center``), or ``pxpolygon``.
    effect: write
    write: patch
    binding:
      method: GET
      query: {action: update}
      reply: text
    params: *mask_params
    positional: [name]

  remove_mask:
    summary: Remove an existing mask.
    effect: write
    write: delete
    binding:
      method: GET
      query: {action: remove}
      reply: text
    params:
      type: object
      required: [name]
      properties:
        name: *mask_name
        imagesource: *image_source
    positional: [name]

  goto_mask:
    summary: Center the camera on an existing mask.
    effect: action
    binding:
      method: GET
      query: {action: goto}
      reply: text
    params:
      type: object
      required: [name]
      properties:
        name: *mask_name
        imagesource: *image_source
    positional: [name]

  enable_all_masks:
    summary: Enable all masks.
    description: Sets ``Image.I#.Overlay.MaskWindows.M#.Enabled`` to yes for all configured masks. Needs ``Properties.PrivacyMask.MainSwitch=yes``.
    effect: write
    write: patch
    binding:
      method: GET
      query: {action: enable_all}
      reply: text
    params:
      type: object
      properties:
        imagesource: *image_source
    positional: [imagesource]
    examples:
      - title: Enable all privacy masks
        request: {query: {}}
        response: {status: 204, text: ""}
        source: https://developer.axis.com/vapix/network-video/overlay-api/#privacy-mask-api

  disable_all_masks:
    summary: Disable all masks, for example in an emergency when nothing vital should be hidden.
    description: Sets ``Image.I#.Overlay.MaskWindows.M#.Enabled`` to no for all configured masks. Needs ``Properties.PrivacyMask.MainSwitch=yes``.
    effect: write
    write: patch
    binding:
      method: GET
      query: {action: disable_all}
      reply: text
    params:
      type: object
      properties:
        imagesource: *image_source
    positional: [imagesource]
    examples:
      - title: Disable all privacy masks
        request: {query: {}}
        response: {status: 204, text: ""}
        source: https://developer.axis.com/vapix/network-video/overlay-api/#privacy-mask-api

  list_masks:
    summary: List all masks with pixel coordinates.
    description: >-
      Coordinates are in the camera's maximum resolution at rotation 0. Supported if ``listpxjson`` is listed in
      ``Properties.PrivacyMask.Query``.
    access: operator
    effect: read
    binding:
      method: GET
      query: {query: listpxjson}
      reply: json
    params:
      type: object
      properties:
        imagesource: *image_source
    positional: [imagesource]
    result: {$ref: "#/types/MaskList"}

  get_mask_position:
    summary: Pixel coordinates of a named mask.
    description: >-
      Coordinates are in the camera's maximum resolution at rotation 0. Supported if ``positionpxjson`` is listed
      in ``Properties.PrivacyMask.Query``.
    access: operator
    effect: read
    binding:
      method: GET
      query: {query: positionpxjson}
      reply: json
    params:
      type: object
      required: [name]
      properties:
        name: *mask_name
        imagesource: *image_source
    positional: [name]
    result: {$ref: "#/types/MaskPosition"}

  list_mask_window_parameters:
    summary: 'Parameter values as ``{"Image.I0.Overlay.MaskWindows.M0.Name": "..."}`` (``root.`` removed).'
    description: >-
      List groups such as ``Image.I0.Overlay.MaskWindows``. Per image source: ``Color``
      (black, grey, white, red, blurred, or hardware dependent mosaic, chameleon) and ``MosaicScale`` (3-16);
      per mask ``M#``: ``Enabled``, ``Name``, ``XPos``, ``YPos``, ``Width``, ``Height`` (pixels) and ``ZoomLowLimit``.
    access: operator
    effect: read
    binding:
      path: /axis-cgi/param.cgi
      method: GET
      query: {action: list}
      accept: text/plain
      reply: {text_kv: {strip_prefix: "root."}}
    params:
      type: object
      required: [group]
      properties:
        group: {type: array, items: {type: string}, minItems: 1, x-style: csv}
    positional: [group]
    result: {type: object, additionalProperties: {type: string}}

  add_mask_window:
    summary: Create a mask ``M0``, ``M1``, ... from the ``0_maskwindows`` template with ``param.cgi``.
    description: >-
      ``group`` is e.g. ``Image.I0.Overlay.MaskWindows``. Pass initial values as full parameter names with a bare
      ``M`` for the new mask, e.g. ``{"Image.I0.Overlay.MaskWindows.M.Enabled": "yes",
      "Image.I0.Overlay.MaskWindows.M.Width": "250", "Image.I0.Overlay.MaskWindows.M.Name": "mask1"}``.
      Masks made this way do not follow pan/tilt/zoom changes.
    effect: write
    write: create
    binding:
      path: /axis-cgi/param.cgi
      method: GET
      query: {action: add, template: 0_maskwindows}
      reply: text
    params:
      type: object
      required: [group, parameters]
      properties:
        group: {type: string, description: 'Parent group, e.g. ``Image.I0.Overlay.MaskWindows``.'}
        parameters: {type: object, additionalProperties: {type: string}, x-style: spread}
    positional: [group, parameters]
    result: {type: string}

  update_mask_window_parameters:
    summary: 'Update mask parameters, e.g. ``{"Image.I0.Overlay.MaskWindows.M1.Name": "mask2_old"}``.'
    description: Only the given parameters change.
    effect: write
    write: patch
    binding:
      path: /axis-cgi/param.cgi
      method: GET
      query: {action: update}
      reply: text_ok
    params:
      type: object
      required: [parameters]
      properties:
        parameters: {type: object, additionalProperties: {type: string}, x-style: spread}
    positional: [parameters]

  remove_mask_windows:
    summary: Remove masks with ``param.cgi``, e.g. ``["Image.I0.Overlay.MaskWindows.M0"]``.
    effect: write
    write: delete
    binding:
      path: /axis-cgi/param.cgi
      method: GET
      query: {action: remove}
      reply: text_ok
    params:
      type: object
      required: [group]
      properties:
        group: {type: array, items: {type: string}, minItems: 1, x-style: csv}
    positional: [group]

sources:
  - url: https://developer.axis.com/vapix/network-video/overlay-api/
    sha256_md: b0b0e35e78f9ef81356c81bfa471e755c4378f76e4aa474447a4ad96a1b54ca5
    retrieved_at: "2026-10-11"
provenance:
  completeness: complete
  open_questions:
    - privacymask.cgi success is documented as 204 No content; the examples assume the empty body is accepted by the text reply.
    - The security level is stated as Administrator for privacymask.cgi; list queries are assumed Operator from "List security level Operator".
    - pxpolygon is documented as ``<int>`` but the value is a string of coordinate pairs.
    - The "Using param.cgi" tables name the group Image.IO (letter O) and the first table header reads Image.I#.Overlay:MaskWindows.
    - The positionpxjson response syntax has a trailing comma (pseudo-JSON); real replies are assumed valid JSON.
    - The "Disable all privacy masks" step 2 enables all masks (action=enable_all), as documented.
    - The reply of the param.cgi add action for template 0_maskwindows is not shown; it is returned as text.
    - 'Whether the camera needs one of width+height or pxpolygon is a runtime rule ("Requires either"); it is not enforced by the schema.'
  migrated_from: v1
  curated: true
