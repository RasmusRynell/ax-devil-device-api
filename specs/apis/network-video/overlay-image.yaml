format: 2
id: overlay-image
name: Overlay image API
summary: Manage the overlay images on the camera and the default image (listing, validating, deleting).
section: network-video
family: jsonrpc
status: released
python:
  module: overlay_image
  class: OverlayImage
docs:
- https://developer.axis.com/vapix/network-video/overlay-api/
access: admin
discovery:
- {api_discovery: overlayimage}

binding:
  path: /axis-cgi/manageoverlayimages.cgi
  major: 1
  versions: ['1.0']
  negotiation:
    get_supported_versions: {key: apiVersions}
  params_placement: params

errors:
  1000: {description: Internal error., kind: internal}
  1001: {description: The requested API version is not supported., kind: unsupported}
  1002: {description: Invalid method., kind: invalid_argument}
  1003: {description: Invalid parameter., kind: invalid_argument}
  1004: {description: The provided input was invalid., kind: invalid_argument}
  1005: {description: Image size is too big., kind: invalid_argument}
  1006: {description: Unsupported image format., kind: unsupported}
  1007: {description: Not enough space left on the device., kind: unavailable}
  1008: {description: Alpha is not supported., kind: unsupported}
  1009: {description: Scale-to-resolution is not supported., kind: unsupported}
  1010: {description: Image already exists.}
  1011: {description: Image is being used by a dynamic overlay.}
  1012: {description: Image is being used by a legacy overlay.}
  1013: {description: Image is being used as default image.}
  1014: {description: Image is being used by an overlay.}

types:
  ImageFormat:
    enum: [bmp, jpeg, png, svg]

  SupportedFormats:
    type: object
    required: [formats]
    properties:
      formats:
        type: array
        items: {$ref: "#/types/ImageFormat"}
        description: List of supported image formats.

  ValidateImageHeaderRequest:
    type: object
    required: [type, width, height]
    properties:
      type: {$ref: "#/types/ImageFormat", description: The image type. One of the formats returned by ``supported_formats``.}
      width: {type: integer, description: The width of the image.}
      height: {type: integer, description: The height of the image.}

  ImageSupport:
    type: object
    required: [supportsAlpha, supportsScaling]
    properties:
      supportsAlpha: {type: boolean, description: Whether an alpha value may be specified for this image.}
      supportsScaling: {type: boolean, description: Whether scale-to-resolution is supported for this image.}

  OverlayImageFile:
    type: object
    required: [path, scaleWithResolution]
    properties:
      path: {type: string, description: The path identifying the image.}
      scaleWithResolution: {type: boolean, description: Whether the image is scaled with the stream resolution.}

  ImageList:
    type: object
    required: [files]
    properties:
      files:
        type: array
        items: {$ref: "#/types/OverlayImageFile"}
        description: The available images.

  ImagePathRequest:
    type: object
    required: [path]
    properties:
      path: {type: string, description: The path identifying the image.}

  ImagePath:
    type: object
    required: [path]
    properties:
      path: {type: string, description: The path that should be used when referring to the image.}

operations:
  supported_formats:
    summary: Get the image formats the camera supports.
    access: operator
    effect: read
    binding: {method: supportedFormats}
    result: {$ref: "#/types/SupportedFormats"}

  validate_image_header:
    summary: Check whether an image is supported, based on its header data.
    description: Checks that an image with these properties is supported, has an acceptable size and fits in the device memory. Invalid parameters give an error response whose code tells what is wrong.
    access: operator
    effect: read
    binding: {method: validateImageHeader}
    params: {$ref: "#/types/ValidateImageHeaderRequest"}
    result: {$ref: "#/types/ImageSupport"}

  list_images:
    summary: List all overlay images on the camera.
    access: operator
    effect: read
    binding: {method: listImages}
    result: {$ref: "#/types/ImageList"}
    examples:
      - title: List images
        request: {params: {}}
        response:
          data:
            files:
              - {path: /etc/overlays/image1.ov1, scaleWithResolution: true}
              - {path: /etc/overlays/image2.ov1, scaleWithResolution: false}
        source: https://developer.axis.com/vapix/network-video/overlay-api/#list-available-images

  delete_image:
    summary: Delete an overlay image.
    access: operator
    effect: write
    write: delete
    binding: {method: deleteImage}
    params: {$ref: "#/types/ImagePathRequest"}
    positional: [path]
    errors:
      1011: {description: Image is being used by a dynamic overlay.}
      1012: {description: Image is being used by a legacy overlay.}
      1013: {description: Image is being used as default image.}
      1014: {description: Image is being used by an overlay.}
    examples:
      - title: Delete an image
        request: {params: {path: /etc/overlays/image.ovl}}
        response: {data: {}}
        source: https://developer.axis.com/vapix/network-video/overlay-api/#delete-an-image

  get_default_image:
    summary: Get the currently configured default image.
    access: operator
    effect: read
    binding: {method: getDefaultImage}
    result: {$ref: "#/types/ImagePath"}

  set_default_image:
    summary: Set the default overlay image.
    access: operator
    effect: write
    write: patch
    binding: {method: setDefaultImage}
    params: {$ref: "#/types/ImagePathRequest"}
    positional: [path]
    examples:
      - title: Set the default image
        request: {params: {path: /etc/overlays/image.ovl}}
        response: {data: {}}
        source: https://developer.axis.com/vapix/network-video/overlay-api/#set-the-default-image

sources:
- url: https://developer.axis.com/vapix/network-video/overlay-api/
  sha256_md: b0b0e35e78f9ef81356c81bfa471e755c4378f76e4aa474447a4ad96a1b54ca5
  retrieved_at: '2026-10-11'

provenance:
  completeness: complete
  open_questions:
  - getSupportedVersions response field documented as data.apiVersion[] (other APIs use apiVersions).
  - AXIS OS requirement not stated.
  - uploadOverlayImage (/axis-cgi/uploadoverlayimage.cgi, multipart/form-data with a JSON part and an image part) is not modelled; the format has no multipart binding.
  - Error examples in the docs show the error code as a string ("1003"), unlike the integer in the response syntax.
    validate_image_header'
  migrated_from: v1
  curated: true
