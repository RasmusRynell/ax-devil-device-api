provenance:
  completeness: complete
  open_questions:
  - No schemaversion argument is documented for the isotherm CGIs (unlike other XML CGIs).
  - Iso-Fire-WH description repeats 'between the lower and middle limits' for both yellow and orange.
  - Relationship between limits ordering (lower<middle<upper) not stated; no validation errors documented beyond 10/20/40.
  - Isotherm1.xsd is not in raw/specs.
  - The get_limits example is a reconstruction from the documented body syntax, not a device reply.
  migrated_from: v1
  curated: true
