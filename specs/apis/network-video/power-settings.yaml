format: 2
id: power-settings
name: Power settings
summary: 'Control device power: power saving, delayed power down, status, consumers, profiles, configurations, dynamic
  power mode, history, PoE warning overlay and IO port power.'
section: network-video
family: jsonrpc
status: released
python: {module: power_settings, class: PowerSettings}
docs: ['https://developer.axis.com/vapix/network-video/power-settings/']
access: admin
discovery:
- {api_discovery: power-settings}
binding:
  path: /axis-cgi/power-settings.cgi
  major: 1
  versions: ['1.0', '1.1', '1.2', '1.4', '1.5', '1.6', '1.7', '1.9']
  negotiation:
    get_supported_versions: {key: apiVersions}
  params_placement: params
errors:
  100: {description: The requested API version is not supported, kind: unsupported}
  4001: {description: Mandatory input parameters were not found in the input, kind: invalid_argument}
  4002: {description: The type of a provided JSON parameter was incorrect, kind: invalid_argument}
  8000: {description: Internal error, kind: internal}
types:
  PowerConsumer:
    type: object
    properties:
      powerConsumer: {type: string, description: Name of the power consumer.}
      type: {type: string, description: Consumer type.}
      maxPower: {type: number, description: Maximum power in watts used by the consumer.}
      adjustablePower: {type: boolean, description: Whether the consumer power can be adjusted.}
      enabled: {type: boolean, description: Whether the consumer is enabled.}
    required: [powerConsumer]
    description: A part of the device whose power use can be limited.
    x-read-only: [type, adjustablePower]
  ProfileLabel:
    type: string
    enum: [disableHeaters, highPerformance, lowPower, temperatureRange, enableIo, enableHdmiAndAudio]
    description: 'disableHeaters: heaters disabled. highPerformance: optimized for performance. lowPower: optimized
      for low power. temperatureRange: suggested range given by lowerTemperature and upperTemperature. enableIo:
      12V IO enabled (only used if other profiles have it disabled). enableHdmiAndAudio: HDMI and audio enabled
      (only used if other profiles have them disabled).'
  PowerProfile:
    type: object
    properties:
      powerProfile: {type: string, description: Profile name.}
      powerRank: {type: integer, description: 'Ranks power usage relative to other profiles, lowest to highest.'}
      lowerTemperature: {type: integer, description: Lowest profile-specific temperature limit (full functionality
          not guaranteed below).}
      upperTemperature: {type: integer, description: Highest profile-specific temperature limit.}
      labels:
        type: array
        items: {$ref: '#/types/ProfileLabel'}
      default: {type: boolean, description: Whether this is the default profile.}
      consumers:
        type: array
        items: {$ref: '#/types/ProfileConsumer'}
    required: [powerProfile]
  ProfileConsumer:
    type: object
    description: Setting of a power consumer when a profile is used.
    required: [powerConsumer]
    properties:
      powerConsumer: {type: string, description: Consumer name.}
      maxPower: {type: number, description: Maximum power in watts when the profile is used.}
      enabled: {type: boolean, description: Whether the consumer is active when the profile is used.}
  Capabilities:
    type: object
    description: Supported power features. Fields missing on older API versions are absent.
    properties:
      powerSavingSupport: {type: boolean, description: Power saving mode supported.}
      delayedPowerDownSupport: {type: boolean, description: Delayed power down mode supported.}
      powerProfileSupport: {type: boolean, description: Power profiles supported.}
      powerConsumerSupport: {type: boolean, description: Power consumers supported.}
      powerStatusSupport:
        description: Power status supported. The device returns the integer -1 (instead of a boolean) when the parameter
          is not available on the device, and the model keeps that -1.
        oneOf:
          - type: boolean
          - const: -1
      powerConfigurationSupport: {type: boolean, description: Power configurations supported.}
      dynamicPowerModeSupport: {type: boolean, description: Dynamic power mode supported.}
      powerHistorySupport: {type: boolean, description: Power history supported.}
      disablePowerWarningOverlaySupport: {type: boolean, description: Device can toggle the power warning overlay.}
      ioPortPowerSupport: {type: boolean, description: Device can toggle IO Port Power on or off.}
  PowerSavingMode:
    type: object
    required: [powerSavingMode]
    properties:
      powerSavingMode: {type: boolean, description: true if power saving mode is active.}
  SetPowerSavingModeRequest:
    type: object
    required: [powerSavingMode]
    properties:
      powerSavingMode: {type: boolean, description: 'true activates, false deactivates power saving mode.'}
  DelayedPowerDownMode:
    type: object
    required: [delayedPowerDownMode]
    properties:
      delayedPowerDownMode: {type: boolean, description: true if delayed power down mode is active.}
      delayTime: {type: integer, minimum: 0, description: Delay time in seconds; not used if delayedPowerDownMode
          is false.}
  SetDelayedPowerDownModeRequest:
    type: object
    required: [delayedPowerDownMode]
    properties:
      delayedPowerDownMode: {type: boolean, description: 'true activates, false deactivates delayed power down mode.'}
      delayTime: {type: integer, minimum: 0, description: Delay time in seconds. Not used if delayedPowerDownMode
          is false. (unit=s)}
  PowerUsage:
    type: object
    description: Power use statistics.
    properties:
      currentPower: {type: number, description: Power in watts currently used.}
      averagePower: {type: number, description: Average power in watts used.}
      maxPower: {type: number, description: Maximum power in watts used.}
  PowerStatus:
    type: object
    properties:
      usage: {$ref: '#/types/PowerUsage'}
      psePoeClass: {type: integer, description: PoE class according to the hardware power source equipment.}
      lldpPoeClass: {type: integer, description: PoE class according to LLDP software negotiation.}
      powerRequested: {type: number, description: Power in watts requested by the device.}
  PowerConsumerList:
    type: object
    required: [consumers]
    properties:
      consumers:
        type: array
        items: {$ref: '#/types/PowerConsumer'}
  SetPowerConsumerRequest:
    type: object
    required: [powerConsumer]
    properties:
      powerConsumer: {type: string, description: Name of the power consumer.}
      maxPower: {type: number, description: Maximum power in watts used by the consumer. (unit=W)}
      enabled: {type: boolean, description: Whether the consumer is enabled.}
  PowerProfileList:
    type: object
    required: [profiles]
    properties:
      currentPowerProfile: {type: string, description: Name of the active profile.}
      profiles:
        type: array
        items: {$ref: '#/types/PowerProfile'}
  SetPowerProfileRequest:
    type: object
    required: [powerProfile]
    properties:
      powerProfile: {type: string, description: Name of the profile to apply.}
  PowerConfiguration:
    type: object
    description: A selectable power configuration.
    required: [index, name]
    properties:
      index: {type: integer, description: Index of the power configuration.}
      name: {type: string, description: Name of the power configuration.}
  PowerConfigurationList:
    type: object
    required: [powerConfigurations]
    properties:
      powerConfigurations:
        type: array
        items: {$ref: '#/types/PowerConfiguration'}
  ActivePowerConfiguration:
    type: object
    required: [index]
    properties:
      index: {type: integer, description: Index of the active power configuration.}
  SetActivePowerConfigurationRequest:
    type: object
    required: [index]
    properties:
      index: {type: integer, description: Index of the power configuration to set.}
  DynamicPowerMode:
    type: object
    required: [dynamicPowerMode]
    properties:
      dynamicPowerMode: {type: boolean, description: true if dynamic power mode is active.}
  SetDynamicPowerModeRequest:
    type: object
    required: [dynamicPowerMode]
    properties:
      dynamicPowerMode: {type: boolean, description: 'true enables, false disables dynamic power mode.'}
  GetPowerHistoryRequest:
    type: object
    required: [requestedTimeSpan]
    properties:
      requestedTimeSpan: {type: integer, minimum: 0, description: Requested time length in seconds. Acquired span
          will likely differ (closest set of data points with highest resolution). Must be >= 0 or error 302. (unit=s)}
  PowerHistory:
    type: object
    required: [acquiredTimeSpan, numberOfSamples, endTimeStamp, powerMeasurements, powerAverage]
    properties:
      acquiredTimeSpan: {type: integer, description: Length of the acquired time span in seconds.}
      numberOfSamples: {type: integer, description: Number of data points in powerMeasurements.}
      endTimeStamp: {type: string, description: ISO8601 time stamp of the last data point. (format=date-time)}
      powerMeasurements:
        type: array
        items: {type: number}
        description: Data points in watts.
      powerAverage: {type: number, description: Average power in watts over the acquired span.}
  PowerWarningOverlay:
    type: object
    required: [enabled]
    properties:
      enabled: {type: boolean, description: State of the power warning overlay functionality.}
  SetPowerWarningOverlayRequest:
    type: object
    required: [enable]
    properties:
      enable: {type: boolean, description: 'true = enabled, false = disabled.'}
  IoPortPower:
    type: object
    required: [enabled]
    properties:
      enabled: {type: boolean, description: IO Port Power state.}
  SetIoPortPowerRequest:
    type: object
    required: [enable]
    properties:
      enable: {type: boolean, description: 'true = enabled, false = disabled.'}
operations:
  get_capabilities:
    summary: Retrieve which power features the device supports.
    access: operator
    effect: read
    binding: {method: getCapabilities}
    result: {$ref: '#/types/Capabilities'}
    examples:
    - title: Get the capabilities
      request:
        params: {}
      response:
        data: {powerSavingSupport: true, delayedPowerDownSupport: false, powerProfileSupport: true, powerConsumerSupport: true,
          powerStatusSupport: true, powerConfigurationSupport: false, dynamicPowerModeSupport: true, powerHistorySupport: true}
      source: https://developer.axis.com/vapix/network-video/power-settings/#power-saving-mode
  get_power_saving_mode:
    summary: Retrieve the current state of the power saving mode.
    access: operator
    effect: read
    binding: {method: getPowerSavingMode}
    result: {$ref: '#/types/PowerSavingMode'}
    errors:
      300: {description: Power saving mode is not supported., kind: unsupported}
    examples:
    - title: Power saving mode
      request:
        params: {}
      response:
        data: {powerSavingMode: true}
      source: https://developer.axis.com/vapix/network-video/power-settings/#power-saving-mode
  set_power_saving_mode:
    summary: Apply a new state to the power saving mode (no reboot needed).
    access: operator
    effect: write
    write: patch
    binding: {method: setPowerSavingMode}
    params: {$ref: '#/types/SetPowerSavingModeRequest'}
    errors:
      300: {description: Power saving mode is not supported., kind: unsupported}
      301: {description: Unable to store Power saving mode., kind: internal}
    examples:
    - title: Power saving mode
      request:
        params: {powerSavingMode: true}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/power-settings/#power-saving-mode
    positional: [powerSavingMode]
  get_delayed_power_down_mode:
    summary: Retrieve the state of delayed power down mode (vehicle ignition pin).
    access: operator
    effect: read
    binding: {method: getDelayedPowerDownMode}
    result: {$ref: '#/types/DelayedPowerDownMode'}
    errors:
      300: {description: Delayed power down mode is not supported., kind: unsupported}
    examples:
    - title: Delayed power down mode
      request:
        params: {}
      response:
        data: {delayedPowerDownMode: true, delayTime: 30}
      source: https://developer.axis.com/vapix/network-video/power-settings/#delayed-power-down-mode
    since: '1.1'
  set_delayed_power_down_mode:
    summary: Apply delayed power down mode and its delay timer.
    access: operator
    effect: write
    write: patch
    binding: {method: setDelayedPowerDownMode}
    params: {$ref: '#/types/SetDelayedPowerDownModeRequest'}
    errors:
      300: {description: Delayed power down mode is not supported., kind: unsupported}
      301: {description: Unable to set delayed power down mode., kind: internal}
    examples:
    - title: Delayed power down mode
      request:
        params: {delayedPowerDownMode: true, delayTime: 30}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/power-settings/#delayed-power-down-mode
    since: '1.1'
  get_power_status:
    summary: 'Retrieve the power status: usage statistics, PoE classes and requested power.'
    access: operator
    effect: read
    binding: {method: getPowerStatus}
    result: {$ref: '#/types/PowerStatus'}
    errors:
      300: {description: Power status is not supported., kind: unsupported}
    examples:
    - title: Power status information
      request:
        params: {}
      response:
        data:
          usage: {currentPower: 60.0, averagePower: 60.0, maxPower: 60.0}
          psePoeClass: 4
          lldpPoeClass: 4
          powerRequested: 30.0
      source: https://developer.axis.com/vapix/network-video/power-settings/#power-status-information
    since: '1.2'
  get_power_consumers:
    summary: Retrieve all available power consumers.
    effect: read
    binding: {method: getPowerConsumers}
    result: {$ref: '#/types/PowerConsumerList'}
    errors:
      300: {description: Power consumers is not supported., kind: unsupported}
    examples:
    - title: Check power consumer information
      request:
        params: {}
      response:
        data:
          consumers:
          - {powerConsumer: WindowHeater, type: Heater, maxPower: 5.0, adjustablePower: true, enabled: true}
      source: https://developer.axis.com/vapix/network-video/power-settings/#check-power-consumer-information
    since: '1.2'
  set_power_consumer:
    summary: Apply properties (max power, enabled) to a power consumer.
    effect: write
    write: patch
    binding: {method: setPowerConsumer}
    params: {$ref: '#/types/SetPowerConsumerRequest'}
    errors:
      300: {description: Power consumers is not supported., kind: unsupported}
      301: {description: Unable to set power consumer., kind: internal}
      302: {description: Invalid parameter value for power consumer., kind: invalid_argument}
    examples:
    - title: Configure power consumers
      request:
        params: {powerConsumer: WindowHeater, maxPower: 5.0, enabled: true}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/power-settings/#configure-power-consumers
    since: '1.2'
  get_power_profiles:
    summary: Retrieve the available pre-defined power profiles and the current profile.
    effect: read
    binding: {method: getPowerProfiles}
    result: {$ref: '#/types/PowerProfileList'}
    errors:
      300: {description: Power profiles is not supported., kind: unsupported}
    examples:
    - title: Retrieve power profile information
      request:
        params: {}
      response:
        data:
          currentPowerProfile: Default
          profiles:
          - powerProfile: Default
            powerRank: 10
            lowerTemperature: -50
            upperTemperature: 50
            labels: [highPerformance, temperatureRange]
            default: true
            consumers:
            - {powerConsumer: WindowHeater, maxPower: 5.0, enabled: true}
          - powerProfile: LimitedTemperatureRange
            powerRank: 1
            lowerTemperature: 0
            upperTemperature: 50
            labels: [lowPower, temperatureRange, disableHeaters]
            default: false
            consumers:
            - {powerConsumer: WindowHeater, maxPower: 5.0, enabled: false}
      source: https://developer.axis.com/vapix/network-video/power-settings/#retrieve-power-profile-information
    since: '1.2'
  set_power_profile:
    summary: Apply a pre-defined power profile.
    effect: write
    write: patch
    binding: {method: setPowerProfile}
    params: {$ref: '#/types/SetPowerProfileRequest'}
    errors:
      300: {description: Power profiles is not supported., kind: unsupported}
      301: {description: Unable to set power profile., kind: internal}
      302: {description: Invalid parameter value for power profile., kind: invalid_argument}
    examples:
    - title: Set a pre-defined power profile
      request:
        params: {powerProfile: LimitedTemperatureRange}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/power-settings/#set-a-pre-defined-power-profile
    positional: [powerProfile]
    since: '1.2'
  get_power_configurations:
    summary: Retrieve the available power configurations.
    effect: read
    binding: {method: getPowerConfigurations}
    result: {$ref: '#/types/PowerConfigurationList'}
    errors:
      300: {description: Power configurations are not supported., kind: unsupported}
    examples:
    - title: Power configurations
      request:
        params: {}
      response:
        data:
          powerConfigurations:
          - {index: 0, name: PoE 4}
          - {index: 1, name: PoE 3}
      source: https://developer.axis.com/vapix/network-video/power-settings/#power-configurations
    since: '1.4'
  get_active_power_configuration:
    summary: Retrieve the active power configuration.
    effect: read
    binding: {method: getActivePowerConfiguration}
    result: {$ref: '#/types/ActivePowerConfiguration'}
    errors:
      300: {description: Power configurations are not supported., kind: unsupported}
    examples:
    - title: Power configurations
      request:
        params: {}
      response:
        data: {index: 0}
      source: https://developer.axis.com/vapix/network-video/power-settings/#power-configurations
    since: '1.4'
  set_active_power_configuration:
    summary: Set the active power configuration.
    effect: write
    write: patch
    binding: {method: setActivePowerConfiguration}
    params: {$ref: '#/types/SetActivePowerConfigurationRequest'}
    errors:
      300: {description: Power configurations are not supported., kind: unsupported}
      301: {description: 'Unable to set power configuration, index out of bounds.', kind: internal}
      302: {description: Invalid parameter value for power configuration., kind: invalid_argument}
    examples:
    - title: Power configurations
      request:
        params: {index: 2}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/power-settings/#power-configurations
    positional: [index]
    since: '1.4'
  get_dynamic_power_mode:
    summary: Retrieve the dynamic power mode state.
    effect: read
    binding: {method: getDynamicPowerMode}
    result: {$ref: '#/types/DynamicPowerMode'}
    errors:
      300: {description: Dynamic power mode is not supported., kind: unsupported}
    examples:
    - title: Dynamic power mode
      request:
        params: {}
      response:
        data: {dynamicPowerMode: true}
      source: https://developer.axis.com/vapix/network-video/power-settings/#dynamic-power-mode
    since: '1.5'
  set_dynamic_power_mode:
    summary: Enable or disable dynamic power mode (lower performance/power during inactivity).
    effect: write
    write: patch
    binding: {method: setDynamicPowerMode}
    params: {$ref: '#/types/SetDynamicPowerModeRequest'}
    errors:
      300: {description: Dynamic power mode is not supported., kind: unsupported}
      301: {description: Unable to set dynamic power mode., kind: internal}
      302: {description: Invalid parameter value for dynamic power mode., kind: invalid_argument}
    examples:
    - title: Dynamic power mode
      request:
        params: {dynamicPowerMode: false}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/power-settings/#dynamic-power-mode
    positional: [dynamicPowerMode]
    since: '1.5'
  get_power_history:
    summary: Retrieve persistent long-term power history data.
    effect: read
    binding: {method: getPowerHistory}
    params: {$ref: '#/types/GetPowerHistoryRequest'}
    result: {$ref: '#/types/PowerHistory'}
    errors:
      300: {description: Power history is not supported., kind: unsupported}
      301: {description: Unable to retrieve power history data., kind: internal}
      302: {description: Invalid parameter value for power history., kind: invalid_argument}
    examples:
    - title: Power history
      request:
        params: {requestedTimeSpan: 7200}
      response:
        data:
          acquiredTimeSpan: 14400
          numberOfSamples: 16
          endTimeStamp: '2023-01-23T14:00:01.549356Z'
          powerMeasurements: [49.939, 49.893, 49.933, 49.954, 49.949, 49.936, 49.847, 49.929, 49.923, 49.952, 49.962,
            49.858, 49.973, 49.964, 49.882, 49.964]
          powerAverage: 49.929
      source: https://developer.axis.com/vapix/network-video/power-settings/#power-history
    positional: [requestedTimeSpan]
    since: '1.6'
  get_power_warning_overlay:
    summary: Check whether the insufficient-PoE text overlay warning is enabled.
    description: If enabled, the system shows the overlay when appropriate. Some products support changing the power
      configuration with set_active_power_configuration instead of disabling the overlay.
    effect: read
    binding: {method: getPowerWarningOverlay}
    result: {$ref: '#/types/PowerWarningOverlay'}
    errors:
      300: {description: Disable Power Warning Overlay is not supported., kind: unsupported}
      301: {description: Unable to disable Power Warning Overlay., kind: internal}
    since: '1.7'
    examples:
    - title: Check the power warning overlay
      request:
        params: {}
      response:
        data: {enabled: true}
      source: https://developer.axis.com/vapix/network-video/power-settings/#disable-the-power-warning-overlay
      x-contract: {skip: No documented example; response is constructed from the field table.}
  set_power_warning_overlay:
    summary: Enable or disable the power warning overlay.
    effect: write
    write: patch
    binding: {method: setPowerWarningOverlay}
    params: {$ref: '#/types/SetPowerWarningOverlayRequest'}
    errors:
      300: {description: Disable Power Warning Overlay is not supported., kind: unsupported}
      301: {description: Unable to disable Power Warning Overlay., kind: internal}
    examples:
    - title: Disable the power warning overlay
      request:
        params: {enable: false}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/power-settings/#disable-the-power-warning-overlay
    positional: [enable]
    since: '1.7'
  get_io_port_power:
    summary: Check whether the 12V IO Port Power output on the IO connector is enabled.
    effect: read
    binding: {method: getIoPortPower}
    result: {$ref: '#/types/IoPortPower'}
    errors:
      300: {description: IO Port Power is not supported., kind: unsupported}
    examples:
    - title: Get the current state of the IO Port Power
      request:
        params: {}
      response:
        data: {enabled: true}
      source: https://developer.axis.com/vapix/network-video/power-settings/#get-the-current-state-of-the-io-port-power
    since: '1.9'
  set_io_port_power:
    summary: Turn the 12V IO Port Power on or off.
    effect: write
    write: patch
    binding: {method: setIoPortPower}
    params: {$ref: '#/types/SetIoPortPowerRequest'}
    errors:
      300: {description: IO Port Power is not supported., kind: unsupported}
      301: {description: Unable to set IO Port Power to its new state., kind: internal}
      302: {description: Invalid parameter value for set IO Port Power., kind: invalid_argument}
    examples:
    - title: Enable IO Port Power
      request:
        params: {enable: true}
      response:
        data: {}
      source: https://developer.axis.com/vapix/network-video/power-settings/#enable-io-port-power
    positional: [enable]
    since: '1.9'
    description: The extra power can then be used by another consumer in the camera, such as the heater, IR or deep
      learning.
sources:
- {url: 'https://developer.axis.com/vapix/network-video/power-settings/', sha256_md: bfe8d12be14696c465248950e42880ba606c2b9023862558671abefeb4ad6396,
  retrieved_at: '2026-10-11'}
provenance:
  completeness: complete
  open_questions: [powerStatusSupport is described as boolean but "will be -1 if the parameter isn't available".,
    Error tables after getPowerHistory are titled "Error codes for setDynamicPowerMode" (copy/paste)., getPowerWarningOverlay
      lists error 301 "Unable to disable Power Warning Overlay" for a get method., labels described as <object>
      but syntax shows an array of strings., setIoPortPower request syntax missing colon ("enable" <boolean>).,
    'Per-operation since values are inferred from the apiVersion used in the documentation examples for each feature
      (1.0 power saving, 1.1 delayed power down, 1.2 status/consumers/profiles, 1.4 configurations, 1.5 dynamic
      power mode, 1.6 history, 1.7 warning overlay, 1.9 IO port power); the docs never state them.', getPowerWarningOverlay
      has no example in the docs; the one here is constructed from the field table., 'Capability fields introduced
      after a given API version are assumed absent on older versions, so all are optional.', AXIS OS minimum version
      not stated., 'getPowerConsumers, getPowerProfiles and later methods require Administrator; getCapabilities
      through getPowerStatus require Operator.']
  migrated_from: v1
  curated: true
