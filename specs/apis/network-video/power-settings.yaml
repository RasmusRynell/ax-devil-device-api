provenance:
  completeness: complete
  open_questions:
  - powerStatusSupport is described as boolean but "will be -1 if the parameter isn't available".
  - Which apiVersion introduced each feature is not documented (examples use 1.0-1.9).
  - getPowerWarningOverlay/getIoPortPower request syntax shows an empty params object; unclear if required.
  - Error tables after getPowerHistory are titled "Error codes for setDynamicPowerMode" (copy/paste).
  - getPowerWarningOverlay lists error 301 "Unable to disable Power Warning Overlay" for a get method.
  - labels described as <object> but syntax shows an array of strings.
  - setIoPortPower request syntax missing colon ("enable" <boolean>).
  - AXIS OS minimum version not stated.
  - 'migration: effect-guessed: write semantics guessed from the method name: set_power_saving_mode=write/patch,
    set_delayed_power_down_mode=write/patch, set_power_consumer=write/patch, set_power_profile=write/patch, set_active_power_configuration=write/patch,
    set_dynamic_power_mode=write/patch, set_power_warning_overlay=write/patch, set_io_port_power=write/patch'
  migrated_from: v1
  curated: false
