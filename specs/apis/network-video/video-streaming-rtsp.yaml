# Migrated from the v1 corpus by codegen/migrate_v1.py; not yet curated.
format: 2
id: video-streaming-rtsp
name: Video streaming over RTSP
summary: 'RTSP media streaming from rtsp://<servername>/axis-media/media.amp: commands, URL parameters (incl.'
section: network-video
family: cgi
status: released
python:
  module: video_streaming_rtsp
  class: RtspHelper
docs:
- https://developer.axis.com/vapix/network-video/video-streaming/
access: viewer
discovery:
- param: {name: Properties.API.RTSP.Version, value: '2.01'}
- param: {name: Properties.API.RTSP.RTSPAuth, value: 'yes'}

binding: {path: /axis-cgi/alwaysmulti.sdp}

operations:
  get_always_multicast_sdp:
    summary: Get the SDP of an always-multicast stream (continuously running multicast; reduces connect latency).
    description: 'Requires Network.RTP.R0.AlwaysMulticastVideo=yes. Protected by HTTP authentication; viewer, operator
      and admin can request. Identification: Properties.API.HTTP.Version=3, AXIS OS 5.40 and later. Since AXIS OS
      5.40.'
    effect: read
    binding: {method: GET, reply: text}
    params:
      type: object
      properties:
        camera: {type: string, description: Desired video source.}
    result: {type: string}
    examples:
    - title: get_always_multicast_sdp
      request:
        query: {camera: '1'}
      response:
        status: 200
        text: |-
          v=0
          o=- 1284464363092904 1284464363092904 IN IP4 axis
          s=Multicast presentation
          e=NONE
          t=0 0
          a=range:npt=0.000000-
          m=video 50000 RTP/AVP 96
          c=IN IP4 239.225.149.138/0
          b=AS:50000
          a=framerate:25.0
          a=transform:1,0,0;0,1,0;0,0,1
          a=rtpmap:96 H264/90000
          a=fmtp:96 packetization-mode=1; profile-level-id=420029;
          sprop-parameter-sets=Z0IAKeKQFgJNgScFAQXh4kRU,aM48gA==
      source: https://developer.axis.com/vapix/network-video/video-streaming/#always-multicast
  describe_url:
    summary: Build the RTSP URL of a media stream (the URL of DESCRIBE, SETUP and PLAY).
    description: 'The same URL is used by the RTSP commands DESCRIBE, SETUP (with /trackID=n) and PLAY; sending them,
      and the other commands (OPTIONS, PAUSE, TEARDOWN, SET_PARAMETER Renew-Stream, GET_PARAMETER) and tunnelling
      RTSP over HTTP, is the job of an RTSP client. Parameters are sent in field order, so the video options after
      streamprofile override the values saved in the stream profile. The video URL options of the Image API
      (camera, fps, compression, ...) are also accepted by the device but are not listed here.'
    effect: read
    binding:
      rtsp: {}
    params:
      type: object
      properties:
        streamprofile:
          type: string
          description: Name of a saved stream profile (StreamProfile.S#.Name). Values can be overridden by parameters
            after it.
        videocodec:
          type: string
          enum: [av1, h264, h265, jpeg]
          description: 'Video format (Image API URL option); av1 is platform dependent, h265 product dependent. Default: h264 for RTSP.'
        resolution:
          type: string
          description: Resolution of the stream (Image API URL option), for example 640x480.
        recordingid: {type: string, description: Name of a saved recording.}
        audio:
          type: integer
          enum: [0, 1]
          default: 1
          description: 'Whether audio shall be available in the stream. 0 = No audio, 1 = Audio. (Metadata table:
            default configurable, see Audio.A0.Enabled.)'
        pull:
          type: integer
          enum: [0, 1]
          default: 0
          description: 'For PLAY when downloading a recording: 1 = stream as fast as possible (only useful with
            RTSP over HTTP); 0 = default, pull disabled, real-time playback.'
        video:
          type: integer
          enum: [0, 1]
          default: 1
          description: Whether video should be made available in the stream.
        event:
          type: string
          enum: ['off', 'on']
          default: 'off'
          description: Whether event metadata should be made available in the stream.
        eventtopic:
          type: string
          description: 'Event topic filter: <filter1>[,<filter2>...], Topic Expression of the ConcreteSet dialect
            with prefixes onvif (http://www.onvif.org/ver10/topics) and axis (http://www.axis.com/2009/event/topics).'
        eventcontent:
          type: string
          description: MessageContent filter expression in the ItemFilter dialect (ONVIF); may be URL encoded. Only
            useful when event=on.
        ptz:
          type: string
          enum: [none, all, status, position]
          description: 'PTZ metadata. Values: none: No PTZ status or position information; all: Both PTZ status
            and position; status: PTZ status; position: PTZ position'
        analytics:
          type: string
          enum: ['off', box, polygon]
          description: 'Scene (analytics) metadata. Values: off: No scene data; box: Bounding box and object classification
            (if supported/configured); polygon: Polygon and bounding box and object classification (if supported/configured)'
        ptz_pantilt_coordinate_space:
          type: string
          enum: [generic, degrees, digital]
          description: 'Coordinate space for pan/tilt positions; only with ptz=all|position. Values: generic: http://www.onvif.org/ver10/tptz/PantiltSpaces/PositionGenericSpace;
            degrees: http://www.onvif.org/ver10/tptz/PantiltSpaces/SphericalPositionSpaceDegrees; digital: http://www.onvif.org/ver10/tptz/PantiltSpaces/DigitalPositionSpace'
        ptz_zoom_coordinate_space:
          type: string
          enum: [generic, digital]
          description: 'Coordinate space for zoom positions; only with ptz=all|position. Values: generic: http://www.onvif.org/ver10/tptz/ZoomSpaces/PositionGenericSpace;
            digital: http://www.onvif.org/ver10/tptz/ZoomSpaces/NormalizedDigitalPosition'
    examples:
    - title: DESCRIBE a 640x480 H.264 stream
      request: {params: {videocodec: h264, resolution: 640x480}}
      response: {url: 'rtsp://camera.test:554/axis-media/media.amp?videocodec=h264&resolution=640x480'}
      source: https://developer.axis.com/vapix/network-video/video-streaming/#rtsp-describe
  ssm_describe_url:
    summary: 'Source-specific multicast (SSM): SDP includes a=source-filter; SETUP with Transport: RTP/AVP;multicast;
      tracks addressed as /stream=<n>.'
    description: Requires Network.RTP.R0.VideoAddress, Network.RTP.R0.VideoPort (0 = dynamically allocated by the
      RTSP server; otherwise static), Network.RTP.R0.TTL (and AudioAddress/AudioPort for audio, with ?audio=1).
      The SSM implementation does not support RTCP receiver feedback.
    effect: read
    binding:
      rtsp: {path: /axis-media/ssm/media.amp}
    params:
      type: object
      properties:
        audio: {type: integer, enum: [0, 1]}
    examples:
    - title: Source-specific multicast URL
      request: {}
      response: {url: 'rtsp://camera.test:554/axis-media/ssm/media.amp'}
      source: https://developer.axis.com/vapix/network-video/video-streaming/#source-specific-multicast

