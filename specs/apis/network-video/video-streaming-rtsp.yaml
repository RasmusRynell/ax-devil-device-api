provenance:
  completeness: complete
  open_questions:
  - Example 5 SETUP URL 'rtsp:///<servername>//axis-media/...' contains extra slashes (doc typo).
  - 'audio default: RTSP URL table says 1; metadata table says configurable via Audio.A0.Enabled.'
  - Only videocodec and resolution of the Image API video URL options are modelled (the docs examples use them); the rest are defined on the Image API page and are not duplicated
    here.
  - SSM DESCRIBE/SETUP responses lack the RTSP status line; 'a=range:npt=now-a=control:...' lines are concatenated
    in the doc.
  - Always multicast SDP response content type not stated.
  - SET_PARAMETER note says 'See example 2 below' but refers to Example 11.
  - Renew-Stream is a body parameter; schema param 'in' has no text/parameters body location, so 'in' is omitted.
  - 'BLOCKED(RTSP session command): RTSP over HTTP (GET channel) needs an RTSP client driving a session; the library only builds URLs'
  - 'BLOCKED(RTSP session command): RTSP over HTTP (POST channel) needs an RTSP client driving a session; the library only builds URLs'
  - 'BLOCKED(RTSP session command): RTSP OPTIONS needs an RTSP client driving a session; the library only builds URLs'
  - 'BLOCKED(RTSP session command): RTSP SETUP needs an RTSP client driving a session; the library only builds URLs'
  - 'BLOCKED(RTSP session command): RTSP PLAY (same URL as describe_url; needs an RTSP client)'
  - 'BLOCKED(RTSP session command): RTSP PAUSE needs an RTSP client driving a session; the library only builds URLs'
  - 'BLOCKED(RTSP session command): RTSP TEARDOWN needs an RTSP client driving a session; the library only builds URLs'
  - 'BLOCKED(RTSP session command): RTSP SET_PARAMETER Renew-Stream needs an RTSP client driving a session; the library only builds URLs'
  - 'BLOCKED(RTSP session command): RTSP GET_PARAMETER needs an RTSP client driving a session; the library only builds URLs'
