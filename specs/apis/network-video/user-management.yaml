format: 2
id: user-management
name: Add, modify and delete user accounts (pwdgrp.cgi)
summary: Add, update, remove and list user accounts with password and group membership via ``/axis-cgi/pwdgrp.cgi``.
section: network-video
family: cgi
status: released
python:
  module: user_management
  class: UserManagement
docs:
- https://developer.axis.com/vapix/network-video/system-settings/
access: admin
discovery:
- {api_discovery: user-management}
- param: {name: Properties.API.HTTP.Version, value: '3'}
requires:
  firmware: '5.00'

binding: {path: /axis-cgi/pwdgrp.cgi}

types:
  UserName:
    type: string
    minLength: 1
    maxLength: 14
    pattern: ^[a-zA-Z0-9]+$
    description: The user account name, 1 to 14 characters from a-z, A-Z and 0-9.
  SecondaryGroups:
    type: string
    pattern: ^(viewer|operator|admin|ptz)(:(viewer|operator|admin|ptz))*$
    description: >-
      Colon separated secondary group names that set the access rights, in any order: ``viewer`` (Viewer),
      ``viewer:ptz`` (Viewer with PTZ control), ``operator:viewer`` (Operator), ``operator:viewer:ptz`` (Operator with PTZ
      control), ``admin:operator:viewer`` (Administrator) and ``admin:operator:viewer:ptz`` (Administrator with PTZ control).
  AddUserRequest:
    type: object
    required: [user, pwd, grp, sgrp]
    properties:
      user: {$ref: '#/types/UserName'}
      pwd:
        type: string
        minLength: 1
        maxLength: 64
        description: The password for the account. It must contain one or more characters and comply with any configured passphrase policy.
      grp:
        type: string
        description: An existing primary group name. The recommended value is ``users``; ``root`` is supported but should only be used when creating the initial user account.
      sgrp: {$ref: '#/types/SecondaryGroups'}
      comment:
        type: string
        description: Description of the user account; may be empty. Optional in device software and service releases since autumn 2019, required before.
      strict_pwd:
        type: integer
        minimum: 1
        maximum: 1
        description: Set to 1 to enforce the VAPIX password standard (ASCII characters 0x20-0x7E, at most 64 characters).
  UpdateUserRequest:
    type: object
    required: [user]
    properties:
      user: {$ref: '#/types/UserName'}
      pwd:
        type: string
        minLength: 1
        maxLength: 64
        description: The new password. It must comply with any configured passphrase policy.
      grp: {type: string, description: The primary group.}
      sgrp: {$ref: '#/types/SecondaryGroups'}
      comment: {type: string, description: Description of the user account.}
      strict_pwd:
        type: integer
        minimum: 1
        maximum: 1
        description: Set to 1 to enforce the VAPIX password standard.
  UserRequest:
    type: object
    required: [user]
    properties:
      user: {$ref: '#/types/UserName'}

operations:
  add_user:
    summary: Create a new user account; returns the device message (``"Created account joe."``).
    description: >-
      The arguments are sent in the request body, as the docs advise against putting credentials in the URL. The initial
      administrator account can be created without authentication, and on devices older than AXIS OS 11.5 it must be named
      ``root``; the role must be Administrator with PTZ control. The device reports failures as a text line starting with
      ``Error:`` and a message, with no numeric code (HTTP 200, except HTTP 401 for the two initial-admin cases). The documented
      messages are: ``consult the system log file.`` (generic), ``action operation type.`` (action omitted or not add, update,
      remove or get), ``account user name.`` (no or invalid user name), ``malformed action operation, <action>.`` (user name
      not appropriate for the action), ``not a valid initial admin user.`` and ``initial admin user must be created first.``
      (no admin exists yet, HTTP 401) and ``invalid password.`` (password shorter than 1 or longer than 64 characters, or
      against the passphrase policy).
    effect: write
    write: create
    binding:
      method: POST
      encoding: form
      query: {action: add}
      reply: text
      auth: if_challenged
    params: {$ref: '#/types/AddUserRequest'}
    result: {type: string}
    examples:
    - title: Create the initial admin account
      request: {form: {user: root, pwd: foo, grp: root, sgrp: 'admin:operator:viewer:ptz'}}
      response: {status: 200, text: Created account root.}
      source: https://developer.axis.com/vapix/network-video/system-settings/#add-modify-and-delete-user-accounts
    - title: Create a new user account with administrator and PTZ control privileges
      request: {form: {user: joe, pwd: foo, grp: users, sgrp: 'admin:operator:viewer:ptz', comment: Joe}}
      response: {status: 200, text: Created account joe.}
      source: https://developer.axis.com/vapix/network-video/system-settings/#add-modify-and-delete-user-accounts
    - title: Create an account with enforced VAPIX password standards
      request:
        form:
          user: joe
          pwd: foo
          grp: users
          sgrp: admin:operator:viewer:ptz
          comment: Joe
          strict_pwd: 1
      response: {status: 200, text: Modified the account joe.}
      source: https://developer.axis.com/vapix/network-video/system-settings/#add-modify-and-delete-user-accounts
  update_user:
    summary: Change the given properties of an existing user account; returns the device message (``"Modified account joe."``).
    effect: write
    write: patch
    binding:
      method: POST
      encoding: form
      query: {action: update}
      reply: text
    params: {$ref: '#/types/UpdateUserRequest'}
    result: {type: string}
    examples:
    - title: Change the password of an existing account
      request: {form: {user: joe, pwd: bar}}
      response: {status: 200, text: Modified account joe.}
      source: https://developer.axis.com/vapix/network-video/system-settings/#add-modify-and-delete-user-accounts
  remove_user:
    summary: Remove an existing user account; returns the device message (``"Removed account joe."``).
    effect: write
    write: delete
    binding:
      method: POST
      encoding: form
      query: {action: remove}
      reply: text
    params: {$ref: '#/types/UserRequest'}
    positional: [user]
    result: {type: string}
    examples:
    - title: Remove an account
      request: {form: {user: joe}}
      response: {status: 200, text: Removed account joe.}
      source: https://developer.axis.com/vapix/network-video/system-settings/#add-modify-and-delete-user-accounts
  get_users:
    summary: 'List the user accounts that belong to each group, as ``{"admin": "\"root,joe\""}``.'
    description: >-
      The keys are the groups ``admin``, ``operator``, ``viewer`` and ``ptz`` (access rights; a user is listed in every
      group it has rights to) and ``digusers`` (all created users). Each value is a double-quoted, comma separated list
      of user names.
    effect: read
    binding:
      method: GET
      query: {action: get}
      accept: text/plain
      reply: text_kv
    result: {type: object, additionalProperties: {type: string}}
    examples:
    - title: List groups and users
      request: {query: {}}
      response:
        status: 200
        text: |-
          admin="root,joe"
          operator="root,joe,ellen"
          viewer="root,joe,ellen,frank"
          ptz="root,joe,ellen"
          digusers="root,joe,ellen,frank"
      source: https://developer.axis.com/vapix/network-video/system-settings/#add-modify-and-delete-user-accounts

sources:
- url: https://developer.axis.com/vapix/network-video/system-settings/
  sha256_md: d28df24ddffb90aed4af428b4f38527a37c97844f0cdfc2d16594a87a0cd9ca3
  retrieved_at: '2026-10-11'

provenance:
  completeness: complete
  open_questions:
  - 'OPEN (needs a runtime/format change): the pwdgrp.cgi failures are documented only as message lines (``Error: account user name.``), with no numeric codes. The spec format keys ``errors`` by code, and the cgi runtime only produces a code when the text after ``Error:`` is a number, so message-keyed entries never match and were removed; the failures currently raise a generic ApiError carrying the message. Matching by message needs a new errors-by-message feature, which would give the kinds: generic and password errors internal/invalid_argument, malformed requests invalid_argument, the two initial-admin errors access_denied. The HTTP 401 cases are raised by the runtime as AuthError before the body is read.'
  - The values of get_users are double-quoted comma separated lists (``"root,joe"``); the text_kv codec now strips the quotes and returns the comma separated string, because splitting only applies to a result model that declares an array field.
  - The parameter table marks user, pwd, grp, sgrp and comment all as "Required if action=add" (copy/paste artefact). comment is optional since autumn 2019; which arguments update and remove require is not stated, so update takes only user as required and remove takes user.
  - Example 6 (add with strict_pwd=1) shows the reply "Modified the account joe." although it is an add; probably a doc error, kept verbatim.
  - The docs recommend POST with the arguments in the body, but do not state the Content-Type or the reply for POST; form encoding is assumed. The GET form with query arguments is also supported by the device.
  - add_user sends credentials only if challenged because the initial administrator account is created without authentication.
  - The sgrp group names may come in any order, so the colon separated list is validated by pattern rather than by the six documented values.
  migrated_from: v1
  curated: true
