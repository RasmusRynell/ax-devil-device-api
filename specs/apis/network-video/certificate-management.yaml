# Migrated from the v1 corpus by codegen/migrate_v1.py; not yet curated.
format: 2
id: certificate-management
name: Certificate management API
summary: Create, upload, list and delete client/CA certificates and private keys via SOAP web services (Axis certificates
  service + ONVIF device service), set the HTTPS...
section: network-video
family: soap
status: released
python:
  module: certificate_management
  class: CertificateManagement
docs:
- https://developer.axis.com/vapix/network-video/certificate-management-api/
access: admin

binding: {namespace: 'http://www.onvif.org/ver10/device/wsdl'}

operations:
  create_certificate2:
    summary: Create a self-signed certificate (generated by the device; only for initial configuration — replace
      with a CA-signed certificate afterwards).
    effect: write
    write: create
    binding:
      action: http://www.axis.com/vapix/ws/certificates/CreateCertificate2
      element: CreateCertificate2
      namespace: http://www.axis.com/vapix/ws/certificates
    params:
      type: object
      required: [Id, Subject]
      properties:
        Id: {type: string, description: 'acertificates:Id — certificate ID.'}
        Subject:
          type: object
          x-name: CreateCertificate2RequestSubject
          description: acertificates:Subject with acert:C, ST, L, O, OU, CN elements (empty elements allowed in
            the example).
          properties:
            C: {type: string}
            ST: {type: string}
            L: {type: string}
            O: {type: string}
            OU: {type: string}
            CN: {type: string}
        ValidNotBefore: {type: string, description: 'e.g. 2020-10-16T04:08:32. Required-ness not stated.'}
        ValidNotAfter: {type: string, description: 'e.g. 2040-10-16T04:08:32.'}
  get_client_certificates:
    summary: Return a list of the currently uploaded client certificates (sent to external servers to validate the
      device).
    effect: read
    binding: {action: 'http://www.onvif.org/ver10/device/wsdl/GetCertificates', element: GetCertificates}
  get_ca_certificates:
    summary: Return a list of the currently uploaded CA certificates (used by the device to validate external servers).
    effect: read
    binding:
      action: http://www.onvif.org/ver10/device/wsdl/GetCACertificates
      element: GetCACertificates
  delete_certificates:
    summary: Delete either a CA certificate or a client certificate.
    effect: write
    write: delete
    binding:
      action: http://www.onvif.org/ver10/device/wsdl/DeleteCertificates
      element: DeleteCertificates
    params:
      type: object
      required: [CertificateID]
      properties:
        CertificateID: {type: string}
  load_certificate_with_private_key:
    summary: Upload a client certificate where the certificate and corresponding private key are two separate files.
    effect: unknown
    binding:
      action: http://www.onvif.org/ver10/device/wsdl/LoadCertificateWithPrivateKey
      element: LoadCertificateWithPrivateKey
    params:
      type: object
      properties:
        CertificateWithPrivateKey:
          type: object
          x-name: LoadCertificateWithPrivateKeyRequestCertificateWithPrivateKey
          required: [CertificateID]
          properties:
            CertificateID: {type: string}
            Certificate:
              type: object
              x-name: LoadCertificateWithPrivateKeyRequestCertificateWithPrivateKeyCertificate
              required: [Data]
              properties:
                Data: {type: string, description: Certificate payload.}
            PrivateKey:
              type: object
              x-name: LoadCertificateWithPrivateKeyRequestCertificateWithPrivateKeyPrivateKey
              required: [Data]
              properties:
                Data: {type: string, description: Private key payload.}
  load_ca_certificates:
    summary: Upload a CA certificate.
    effect: unknown
    binding:
      action: http://www.onvif.org/ver10/device/wsdl/LoadCACertificates
      element: LoadCACertificates
    params:
      type: object
      properties:
        CACertificate:
          type: object
          x-name: LoadCaCertificatesRequestCACertificate
          required: [CertificateID]
          properties:
            CertificateID: {type: string}
            Certificate:
              type: object
              x-name: LoadCaCertificatesRequestCACertificateCertificate
              required: [Data]
              properties:
                Data: {type: string, description: CA certificate payload.}
  load_pkcs12:
    summary: Upload a password-protected PKCS#12 container holding both the client certificate and its private key.
    effect: unknown
    binding:
      action: http://www.axis.com/vapix/ws/certificates/LoadPkcs12
      element: LoadPkcs12
      namespace: http://www.axis.com/vapix/ws/certificates
    params:
      type: object
      properties:
        Pkcs12:
          type: object
          x-name: LoadPkcs12RequestPkcs12
          required: [Id, Certificate, Password]
          properties:
            Id: {type: string, description: 'acert:Id'}
            Certificate: {type: string, description: 'acert:Certificate — PKCS#12 payload.'}
            Password: {type: string, description: 'acert:Password'}
  set_web_server_tls_configuration:
    summary: Select a previously uploaded client certificate to be used for HTTPS connections (Set HTTPS certificate).
    effect: write
    write: patch
    binding:
      action: http://www.axis.com/vapix/ws/webserver/SetWebServerTlsConfiguration
      element: SetWebServerTlsConfiguration
      namespace: http://www.axis.com/vapix/ws/webserver
    params:
      type: object
      properties:
        Configuration:
          type: object
          x-name: SetWebServerTlsConfigurationRequestConfiguration
          required: [Tls]
          properties:
            Tls: {type: boolean}
            ConnectionPolicies:
              type: object
              x-name: SetWebServerTlsConfigurationRequestConfigurationConnectionPolicies
              description: aweb:Admin/Operator/Viewer, e.g. Https. For AXIS OS 7.10 and over remove the Operator
                and Viewer elements (example targets 6.50).
              properties:
                Admin: {type: string}
                Operator: {type: string}
                Viewer: {type: string}
            Ciphers:
              type: array
              items: {type: string}
              description: acert:Cipher list; listed ciphers are subject to change with AXIS OS updates.
            CertificateSet:
              type: object
              x-name: SetWebServerTlsConfigurationRequestConfigurationCertificateSet
              properties:
                Certificates:
                  type: object
                  x-name: SetWebServerTlsConfigurationRequestConfigurationCertificateSetCertificates
                  required: [Id]
                  properties:
                    Id: {type: string, description: 'acert:Id naming the certificate to set (must be included).'}
                CACertificates: {type: array}
                TrustedCertificates: {type: array}
  set_dot1x_configuration:
    summary: Assign an uploaded certificate to the wired IEEE 802.1x configuration (then configurable with setWired8021XConfiguration).
    effect: write
    write: patch
    binding:
      action: http://www.onvif.org/ver10/device/wsdl/SetDot1XConfiguration
      element: SetDot1XConfiguration
    params:
      type: object
      properties:
        Dot1XConfiguration:
          type: object
          x-name: SetDot1xConfigurationRequestDot1XConfiguration
          required: [Dot1XConfigurationToken, Identity, EAPMethod]
          properties:
            Dot1XConfigurationToken: {type: string, description: e.g. EAPTLS_WIRED}
            Identity: {type: string}
            EAPMethod: {type: integer, description: e.g. 13 (EAP-TLS).}
            EAPMethodConfiguration:
              type: object
              x-name: SetDot1xConfigurationRequestDot1XConfigurationEAPMethodConfiguration
              properties:
                TLSConfiguration:
                  type: object
                  x-name: SetDot1xConfigurationRequestDot1XConfigurationEAPMethodConfigurationTLSConfiguration
                  required: [CertificateID]
                  properties:
                    CertificateID: {type: string, description: 'Must be the certificate common name, e.g. Default(self-signed).'}

