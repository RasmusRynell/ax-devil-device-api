format: 2
id: certificate-management
name: Certificate management API
summary: Create, upload, list and delete client/CA certificates and private keys via SOAP web services (Axis certificates
  service + ONVIF device service), set the HTTPS certificate and assign a certificate to IEEE 802.1x.
section: network-video
family: soap
status: released
python:
  module: certificate_management
  class: CertificateManagement
docs:
- https://developer.axis.com/vapix/network-video/certificate-management-api/
access: admin
discovery:
- service: {namespace: 'http://www.axis.com/vapix/ws/certificates'}

binding:
  namespace: http://www.onvif.org/ver10/device/wsdl
  namespaces:
    acertificates: http://www.axis.com/vapix/ws/certificates
    acert: http://www.axis.com/vapix/ws/cert
    tds: http://www.onvif.org/ver10/device/wsdl
    tt: http://www.onvif.org/ver10/schema
    aweb: http://www.axis.com/vapix/ws/webserver

types:
  CertificateIds:
    type: object
    description: A list of certificates by Id (acert:Id).
    properties:
      'acert:Id': {type: array, items: {type: string}}
  CertificateData:
    type: object
    description: A payload holder (tt:Data).
    required: ['tt:Data']
    properties:
      'tt:Data': {type: string, description: The payload.}

operations:
  create_certificate2:
    summary: Create a self-signed certificate (generated by the device; only for initial configuration, replace
      it with a CA-signed certificate afterwards).
    effect: write
    write: create
    binding:
      action: http://www.axis.com/vapix/ws/certificates/CreateCertificate2
      element: CreateCertificate2
      namespace: http://www.axis.com/vapix/ws/certificates
    params:
      type: object
      required: ['acertificates:Id', 'acertificates:Subject']
      properties:
        'acertificates:Id': {type: string, description: Certificate ID.}
        'acertificates:Subject':
          type: object
          x-name: CertificateSubject
          description: The certificate subject; empty elements are allowed.
          properties:
            'acert:C': {type: string, description: Country.}
            'acert:ST': {type: string, description: State or province.}
            'acert:L': {type: string, description: Locality.}
            'acert:O': {type: string, description: Organization.}
            'acert:OU': {type: string, description: Organizational unit.}
            'acert:CN': {type: string, description: Common name.}
        'acertificates:ValidNotBefore': {type: string, description: 'Start of validity, e.g. 2020-10-16T04:08:32.'}
        'acertificates:ValidNotAfter': {type: string, description: 'End of validity, e.g. 2040-10-16T04:08:32.'}
    examples:
    - title: Create a self-signed certificate
      request:
        body: '<acertificates:CreateCertificate2 xmlns="http://www.axis.com/vapix/ws/certificates" xmlns:acertificates="http://www.axis.com/vapix/ws/certificates" xmlns:acert="http://www.axis.com/vapix/ws/cert" xmlns:tt="http://www.onvif.org/ver10/schema" xmlns:aweb="http://www.axis.com/vapix/ws/webserver"><acertificates:Id>Certificate_ID</acertificates:Id><acertificates:Subject><acert:C>SE</acert:C><acert:ST /><acert:L /><acert:O /><acert:OU /><acert:CN>172.25.154.47</acert:CN></acertificates:Subject><acertificates:ValidNotBefore>2020-10-16T04:08:32</acertificates:ValidNotBefore><acertificates:ValidNotAfter>2040-10-16T04:08:32</acertificates:ValidNotAfter></acertificates:CreateCertificate2>'
        params:
          'acertificates:Id': Certificate_ID
          'acertificates:Subject':
            'acert:C': SE
            'acert:ST': ''
            'acert:L': ''
            'acert:O': ''
            'acert:OU': ''
            'acert:CN': 172.25.154.47
          'acertificates:ValidNotBefore': '2020-10-16T04:08:32'
          'acertificates:ValidNotAfter': '2040-10-16T04:08:32'
      source: https://developer.axis.com/vapix/network-video/certificate-management-api/#create-self-signed-certificate
  get_client_certificates:
    summary: Return a list of the currently uploaded client certificates (sent to external servers to validate the
      device).
    effect: read
    binding: {action: 'http://www.onvif.org/ver10/device/wsdl/GetCertificates', element: GetCertificates}
    examples:
    - title: List the client certificates
      request: {params: {}}
      source: https://developer.axis.com/vapix/network-video/certificate-management-api/#getclientcertificates
  get_ca_certificates:
    summary: Return a list of the currently uploaded CA certificates (used by the device to validate external servers).
    effect: read
    binding:
      action: http://www.onvif.org/ver10/device/wsdl/GetCACertificates
      element: GetCACertificates
    examples:
    - title: List the CA certificates
      request: {params: {}}
      source: https://developer.axis.com/vapix/network-video/certificate-management-api/#getcacertificates
  delete_certificates:
    summary: Delete either a CA certificate or a client certificate.
    effect: write
    write: delete
    binding:
      action: http://www.onvif.org/ver10/device/wsdl/DeleteCertificates
      element: DeleteCertificates
    params:
      type: object
      required: [CertificateID]
      properties:
        CertificateID: {type: string}
    examples:
    - title: Delete a certificate
      request: {params: {CertificateID: Certificate_ID}}
      source: https://developer.axis.com/vapix/network-video/certificate-management-api/#deletecertificates
  load_certificate_with_private_key:
    summary: Upload a client certificate where the certificate and corresponding private key are two separate files.
    effect: write
    write: create
    binding:
      action: http://www.onvif.org/ver10/device/wsdl/LoadCertificateWithPrivateKey
      element: LoadCertificateWithPrivateKey
    params:
      type: object
      required: [CertificateWithPrivateKey]
      properties:
        CertificateWithPrivateKey:
          type: object
          x-name: CertificateWithPrivateKey
          required: ['tt:CertificateID']
          x-masked: ['tt:PrivateKey']
          properties:
            'tt:CertificateID': {type: string}
            'tt:Certificate': {$ref: '#/types/CertificateData'}
            'tt:PrivateKey': {$ref: '#/types/CertificateData'}
    examples:
    - title: Upload a certificate and its private key
      request:
        params:
          CertificateWithPrivateKey:
            'tt:CertificateID': Certificate_ID
            'tt:Certificate': {'tt:Data': Certificate Payload}
            'tt:PrivateKey': {'tt:Data': Private Key Payload}
      source: https://developer.axis.com/vapix/network-video/certificate-management-api/#upload-certificate--private-key
  load_ca_certificates:
    summary: Upload a CA certificate.
    effect: write
    write: create
    binding:
      action: http://www.onvif.org/ver10/device/wsdl/LoadCACertificates
      element: LoadCACertificates
    params:
      type: object
      required: [CACertificate]
      properties:
        CACertificate:
          type: object
          x-name: CaCertificate
          required: ['tt:CertificateID']
          properties:
            'tt:CertificateID': {type: string}
            'tt:Certificate': {$ref: '#/types/CertificateData'}
    examples:
    - title: Upload a CA certificate
      request:
        params:
          CACertificate:
            'tt:CertificateID': Certificate_ID
            'tt:Certificate': {'tt:Data': '....CA Certificate Payload....'}
      source: https://developer.axis.com/vapix/network-video/certificate-management-api/#upload-ca-certificate
  load_pkcs12:
    summary: Upload a password-protected PKCS#12 container holding both the client certificate and its private key.
    effect: write
    write: create
    binding:
      action: http://www.axis.com/vapix/ws/certificates/LoadPkcs12
      element: LoadPkcs12
      namespace: http://www.axis.com/vapix/ws/certificates
    params:
      type: object
      required: [Pkcs12]
      properties:
        Pkcs12:
          type: object
          x-name: Pkcs12Container
          required: ['acert:Id', 'acert:Certificate', 'acert:Password']
          x-masked: ['acert:Password']
          properties:
            'acert:Id': {type: string}
            'acert:Certificate': {type: string, description: The PKCS#12 payload.}
            'acert:Password': {type: string}
    examples:
    - title: Upload a PKCS#12 certificate
      request:
        body: '<acertificates:LoadPkcs12 xmlns="http://www.axis.com/vapix/ws/certificates" xmlns:acertificates="http://www.axis.com/vapix/ws/certificates" xmlns:acert="http://www.axis.com/vapix/ws/cert" xmlns:tt="http://www.onvif.org/ver10/schema" xmlns:aweb="http://www.axis.com/vapix/ws/webserver"><Pkcs12><acert:Id>PFX-Sample Certificate</acert:Id><acert:Certificate>...Certificate Payload...</acert:Certificate><acert:Password>password</acert:Password></Pkcs12></acertificates:LoadPkcs12>'
        params:
          Pkcs12:
            'acert:Id': PFX-Sample Certificate
            'acert:Certificate': ...Certificate Payload...
            'acert:Password': password
      source: https://developer.axis.com/vapix/network-video/certificate-management-api/#upload-pkcs12-certificate
  set_web_server_tls_configuration:
    summary: Select a previously uploaded client certificate to be used for HTTPS connections (Set HTTPS certificate).
    effect: write
    write: patch
    binding:
      action: http://www.axis.com/vapix/ws/webserver/SetWebServerTlsConfiguration
      element: SetWebServerTlsConfiguration
      namespace: http://www.axis.com/vapix/ws/webserver
    params:
      type: object
      required: [Configuration]
      properties:
        Configuration:
          type: object
          x-name: WebServerTlsConfiguration
          required: [Tls]
          properties:
            Tls: {type: boolean}
            'aweb:ConnectionPolicies':
              type: object
              x-name: ConnectionPolicies
              description: Connection policy per role, e.g. Https. For AXIS OS 7.10 and later the example omits Operator
                and Viewer.
              properties:
                'aweb:Admin': {type: string}
                'aweb:Operator': {type: string}
                'aweb:Viewer': {type: string}
            'aweb:Ciphers':
              type: object
              x-name: TlsCiphers
              description: The enabled ciphers; the listed ciphers are subject to change with AXIS OS updates.
              properties:
                'acert:Cipher': {type: array, items: {type: string}}
            'aweb:CertificateSet':
              type: object
              x-name: TlsCertificateSet
              properties:
                'acert:Certificates': {$ref: '#/types/CertificateIds'}
                'acert:CACertificates': {$ref: '#/types/CertificateIds'}
                'acert:TrustedCertificates': {$ref: '#/types/CertificateIds'}
    examples:
    - title: Set the HTTPS certificate (AXIS OS 6.50)
      request:
        body: '<aweb:SetWebServerTlsConfiguration xmlns="http://www.axis.com/vapix/ws/webserver" xmlns:acertificates="http://www.axis.com/vapix/ws/certificates" xmlns:acert="http://www.axis.com/vapix/ws/cert" xmlns:tt="http://www.onvif.org/ver10/schema" xmlns:aweb="http://www.axis.com/vapix/ws/webserver"><Configuration><Tls>true</Tls><aweb:ConnectionPolicies><aweb:Admin>Https</aweb:Admin><aweb:Operator>Https</aweb:Operator><aweb:Viewer>Https</aweb:Viewer></aweb:ConnectionPolicies><aweb:Ciphers><acert:Cipher>ECDHE-ECDSA-AES128-GCM-SHA256</acert:Cipher><acert:Cipher>ECDHE-RSA-AES128-GCM-SHA256</acert:Cipher><acert:Cipher>ECDHE-ECDSA-AES256-GCM-SHA384</acert:Cipher><acert:Cipher>ECDHE-RSA-AES256-GCM-SHA384</acert:Cipher><acert:Cipher>ECDHE-ECDSA-CHACHA20-POLY1305</acert:Cipher><acert:Cipher>ECDHE-RSA-CHACHA20-POLY1305</acert:Cipher><acert:Cipher>DHE-RSA-AES128-GCM-SHA256</acert:Cipher><acert:Cipher>DHE-RSA-AES256-GCM-SHA384</acert:Cipher></aweb:Ciphers><aweb:CertificateSet><acert:Certificates><acert:Id>CertificateName</acert:Id></acert:Certificates><acert:CACertificates /><acert:TrustedCertificates /></aweb:CertificateSet></Configuration></aweb:SetWebServerTlsConfiguration>'
        params:
          Configuration:
            Tls: true
            'aweb:ConnectionPolicies':
              'aweb:Admin': Https
              'aweb:Operator': Https
              'aweb:Viewer': Https
            'aweb:Ciphers':
              'acert:Cipher':
              - ECDHE-ECDSA-AES128-GCM-SHA256
              - ECDHE-RSA-AES128-GCM-SHA256
              - ECDHE-ECDSA-AES256-GCM-SHA384
              - ECDHE-RSA-AES256-GCM-SHA384
              - ECDHE-ECDSA-CHACHA20-POLY1305
              - ECDHE-RSA-CHACHA20-POLY1305
              - DHE-RSA-AES128-GCM-SHA256
              - DHE-RSA-AES256-GCM-SHA384
            'aweb:CertificateSet':
              'acert:Certificates': {'acert:Id': [CertificateName]}
              'acert:CACertificates': {}
              'acert:TrustedCertificates': {}
      source: https://developer.axis.com/vapix/network-video/certificate-management-api/#set-https-certificate
  set_dot1x_configuration:
    summary: Assign an uploaded certificate to the wired IEEE 802.1x configuration (then configurable with setWired8021XConfiguration).
    effect: write
    write: patch
    binding:
      action: http://www.onvif.org/ver10/device/wsdl/SetDot1XConfiguration
      element: SetDot1XConfiguration
    params:
      type: object
      required: [Dot1XConfiguration]
      properties:
        Dot1XConfiguration:
          type: object
          x-name: Dot1XConfiguration
          required: ['tt:Dot1XConfigurationToken', 'tt:Identity', 'tt:EAPMethod']
          properties:
            'tt:Dot1XConfigurationToken': {type: string, description: 'e.g. EAPTLS_WIRED'}
            'tt:Identity': {type: string}
            'tt:EAPMethod': {type: integer, description: 'e.g. 13 (EAP-TLS).'}
            'tt:EAPMethodConfiguration':
              type: object
              x-name: EapMethodConfiguration
              properties:
                'tt:TLSConfiguration':
                  type: object
                  x-name: TlsConfiguration
                  required: ['tt:CertificateID']
                  properties:
                    'tt:CertificateID': {type: string, description: 'Must be the certificate common name, e.g. Default(self-signed).'}
    examples:
    - title: Assign a certificate to the wired IEEE 802.1x configuration
      request:
        body: '<tds:SetDot1XConfiguration xmlns:tds="http://www.onvif.org/ver10/device/wsdl" xmlns="http://www.onvif.org/ver10/device/wsdl" xmlns:acertificates="http://www.axis.com/vapix/ws/certificates" xmlns:acert="http://www.axis.com/vapix/ws/cert" xmlns:tt="http://www.onvif.org/ver10/schema" xmlns:aweb="http://www.axis.com/vapix/ws/webserver"><Dot1XConfiguration><tt:Dot1XConfigurationToken>EAPTLS_WIRED</tt:Dot1XConfigurationToken><tt:Identity>identity</tt:Identity><tt:EAPMethod>13</tt:EAPMethod><tt:EAPMethodConfiguration><tt:TLSConfiguration><tt:CertificateID>Default(self-signed)</tt:CertificateID></tt:TLSConfiguration></tt:EAPMethodConfiguration></Dot1XConfiguration></tds:SetDot1XConfiguration>'
        params:
          Dot1XConfiguration:
            'tt:Dot1XConfigurationToken': EAPTLS_WIRED
            'tt:Identity': identity
            'tt:EAPMethod': 13
            'tt:EAPMethodConfiguration':
              'tt:TLSConfiguration':
                'tt:CertificateID': Default(self-signed)
      source: https://developer.axis.com/vapix/network-video/certificate-management-api/#assign-a-certificate-to-the-ieee-8021x-configuration

sources:
- url: https://developer.axis.com/vapix/network-video/certificate-management-api/
  sha256_md: 8634ae32cb63e64aad0ac877f909ca2faff8f21519e1be854c69482506d832e7
  retrieved_at: '2026-10-11'

provenance:
  completeness: partial
  open_questions:
  - The page documents no responses, faults, SOAPAction values or security levels, and links no WSDL; operations have no result type (replies are ignored) and the examples carry no response. The list operations (get_client_certificates, get_ca_certificates) therefore return nothing useful until the reply is documented (presumably ONVIF tds:GetCertificatesResponse and tds:GetCACertificatesResponse).
  - SOAPAction values are assumed as <namespace>/<operation>.
  - No identification section; discovery uses the Axis certificates namespace via the Entry service (assumed to be listed there). The ONVIF device and webserver namespaces are not used for discovery.
  - The examples use Content-Type application/xml rather than application/soap+xml for SOAP 1.2.
  - 'Set HTTPS certificate: the page says to remove the Operator and Viewer connection policies on AXIS OS 7.10 and later, without explaining why. The Certificates, CACertificates and TrustedCertificates lists are modelled as repeated acert:Id; only one Id is shown.'
  - Whether set_web_server_tls_configuration and set_dot1x_configuration replace or patch the configuration is not stated; patch is assumed.
  - The expected id of the device-configuration REST counterpart is a guess (cert-config).
  migrated_from: v1
  curated: true
