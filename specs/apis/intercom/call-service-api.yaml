- url: https://developer.axis.com/vapix/intercom/call-service-api/
  sha256_md: b20672e5352912addf046575bf17b074cbbb733a379db9c3181e944a4b2bcccc
  retrieved_at: '2026-10-11'

provenance:
  completeness: complete
  open_questions:
  - The page states no access levels; the API default admin is kept. The page gives no discovery for the service
    beyond the SIP properties.
  - The 'with stream parameters' and 'with SIP proxies' JSON examples are wrong against the SIPAccount table (StreamParameters
    is placed beside SIPAccount, and the proxy list is named SIPAccount); the examples are corrected to StreamParameters
    inside SIPAccount and SIPProxies.
  - SIPAccount lists Password, Registrar, PublicDomain, SIPProxies and Attribute as mandatory fields, but the prose
    says only UserId is mandatory and the peer-to-peer example sends only UserId; only UserId is required.
  - The Set* operations 'add or update' an item by its identifier; the page does not say whether omitted fields
    of an existing item are kept, so they are marked replace. SetSIPConfiguration documents KeepCurrent (default
    true keeps current values, false resets to defaults).
  - The service capabilities section contains a stray ServiceCapabilities table with MaxLimit for GetPortList/GetPort,
    copied from another API; it is ignored.
  - The fault example on the page uses /vapix/axast and axast:PerformSpeakerTest (copied from the Auto speaker test
    service); HTTP 400 is assumed for axcall faults too.
  - GetSupportedSIPAccountAttributes lists DisableTCPSwitch, MaxCallDuration and RegistrationInterval as data fields
    next to AttributeInfo; modelled as documented.
  - SetDTMFEvent and SetDTMFTrigger request tables spell DTMEvent and DTMTrigger; the DTMFEvent and DTMFTrigger
    names from the syntax are used.
  - AllowedURIs and AccessList are typed String in the table while the examples show arrays; modelled as arrays
    of strings. AllowedUsers has the undefined type UserAuthentication and is an untyped list.
  - SIPAccountStatus.IsDefault appears in examples but not in the table; RegURI is null in the simple response.
  - Responses with a single item in a list (for example the plural Set* results) may be returned as a scalar by
    the device (see GAP(single-element-list) in other specs); no example here shows it.
  - The simplified Call response CallId differs from the JSON example.
  - The version history is not on the page; since values come from the 'Supported from API version' notes. The service
    has no version negotiation, so they are documentation only.
  migrated_from: v1
  curated: true
