    effect: write
    write: patch
    binding: {method: POST, body: object}
    params:
      type: object
      properties:
        Configuration: {$ref: '#/types/Configuration', description: Configuration to set (POST/PUT).}
        imageFile:
          type: object
          description: ImageFile used to update an image (ImageFile type not documented).
    result:
      type: object
      properties:
        Configuration: {$ref: '#/types/Configuration'}
  set_configuration:
    summary: Replace the configuration (SetConfiguration).
    effect: write
    write: replace
    binding: {method: PUT, body: object}
    params:
      type: object
      properties:
        Configuration: {$ref: '#/types/Configuration', description: Configuration to set (POST/PUT).}
        imageFile:
          type: object
          description: ImageFile used to update an image (ImageFile type not documented).

