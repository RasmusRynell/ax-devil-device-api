provenance:
  completeness: partial
  open_questions:
  - Required/optional status of most request fields is not documented (only "(optional)" markers in syntax blocks); all
    fields are optional.
  - The docs describe the Configuration resource as one REST endpoint (GET, POST, PUT /vapix/intercom/Configuration) and
    show the equivalent commands (GetConfiguration, UpdateConfiguration, SetConfiguration) over POST /vapix/intercom;
    the examples are the command examples, whose bodies are the same for the REST calls.
  - The documented responses of SetConfiguration and UpdateConfiguration are {}; the REST description allows an optional
    Configuration, which is modelled.
  - ImageFile type (Configuration resource, includeImageFile, imageFile) is not defined.
  - The GetConfiguration example lists CardTypes with "..", not valid JSON.
  - 'The documented Configuration table types CallButtonConfigurations as "CallButtonConfigurations"; the syntax shows an
    array of CallButtonConfiguration (used).'
  - The docs do not say whether the device masks Password and the DESFire or MIFARE keys in GetConfiguration.
  - The enumerations of the docs are partly product dependent (see ServiceCapabilities); a product may support fewer
    values than the enums list. ColorName values (or #RRGGBB) are left as strings.
  - Faults come as HTTP 400 with a body of Fault, FaultCode, FaultReason and FaultMsg; only the status is modelled.
  - 'The other intercom functions (GetServiceCapabilities, GetServerReport, card reader and IP access functions, keypress
    and feedback functions) are POST /vapix/intercom commands and are not part of this spec.'
  - 'BLOCKED(Google JSON codec): the websocket function calls and the notification topics (RFID, MainState, KeyPin,
    KeypadState) need the Google JSON codec of the intercom websocket and are not modelled here.'
  migrated_from: v1
  curated: true
