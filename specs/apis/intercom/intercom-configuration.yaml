provenance:
  completeness: complete
  open_questions:
  - Required/optional status of most request fields is not documented (only "(optional)" markers in syntax blocks);
    required flags are inferred.
  - AttributeInfo has Name/Value/Type here, unlike Call service (Name/Type/Default).
  - KeyPin event refers to CardReaderConfiguration.SensitiveKeyPinEventEnabled while CardReaderConfiguration defines
    SensitivePINEventEnabled.
  - Configuration table uses CallButtonConfigurations type "CallButtonConfigurations"; syntax shows array of CallButtonConfiguration.
  - ImageFile type (Configuration resource, includeImageFile) is not defined.
  - GetConfiguration example lists CardTypes with "..", not valid JSON (kept as raw).
  - Error codes for Probe/UpdateIPAccessConfiguration, GetCardData, SetUiFeedback, InjectKeySequence not documented.
  - 'Namespace prefix axdsapi: is required for websocket function subscriptions; whether HTTP requests accept prefixed
    names is not stated.'
  - Simple-format response for GetConfiguration includes "..." truncation.
  - 'migration: json-untyped: set_configuration: JSON reply without schema; result omitted'
  - 'migration: types-dropped: types not referenced by any migrated operation: AccesscontrolIntegrationProtocol,
    AttributeInfo, CallButtonIdleBehavior, CallButtonInformation, CardData, CardDataSources, CardOutputFormat, CardType,
    CardTypeCategory, CardTypeNames, ColorName, CompatibilityFlag, ContactsInformation, FacilityCodeOverrideMode,
    FeedbackSourceType, IOPinName, IPAccessOption, IPAccessScheme, IPIntegrationProtocol, Id, IntegerValidator,
    IntercomReaderIds, Key, KeypadState, KeypressOutputFormat, LedControlType, MainState, Name, ParityType, PinSourceType,
    ProbeIPAccessStatus, ReaderIdWithMask, RegisteredReaderPolicy, RunStyleType, ServiceCapabilities, TagPresentedInfo,
    TagUidType, TargetLedType, UIHighLevelFeedback, UiAudioFeedback, UiGraphicFeedback, UiLed, UiLedFeedback'
  - 'migration: dropped-section: v1 section events not carried over'
  - 'migration: dropped-section: v1 section versioning not carried over'
  - 'migration: dropped-keywords: 6 bytes. x2, counted backwards from the last data bit. x1, counted from the first
    data bit. x1, examples x1, state 0 (typically red). x1, state 00 (typically off). x1, state 1 (typically green).
    x1, typically hexadecimal. x1'
