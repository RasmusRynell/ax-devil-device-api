provenance:
  completeness: partial
  open_questions:
  - 'BLOCKED(websocket): the WebSocket functions on /vapix/intercomws (axev:subscribe, axev:getSupported, axev:notify
    and the axdsapi: prefixed function subscriptions) are not bound; the Intercom events (RFID, KeyPin, MainState,
    KeypadState) are delivered through them or the event service.'
  - 'Not bound: the REST resource /vapix/intercom/Configuration (GET, POST for UpdateConfiguration, PUT for SetConfiguration)
    duplicates get_configuration, update_configuration and set_configuration. Its imageFile and includeImageFile
    members use an ImageFile type that is not defined.'
  - 'The service also accepts JSON-RPC 2.0 and Google JSON requests; only the raw form {"<function>": {...}} is
    bound, with unprefixed function names as in the cURL examples.'
  - Which request fields are required is mostly not documented (only '(optional)' markers in syntax blocks); required
    flags are inferred.
  - No access levels are documented; the API default admin is kept. Error codes for ProbeIPAccessConfiguration,
    UpdateIPAccessConfiguration, GetCardData, SetUiFeedback and InjectKeySequence are not documented.
  - Several string members are documented as non-normative enums (AccesscontrolIntegrationProtocol, CardTypeNames,
    ColorName, IOPinName, ParityType, CardOutputFormat, RunStyleType, UIHighLevelFeedback, ProbeIPAccessStatus...)
    whose supported values come from ServiceCapabilities; they are plain strings.
  - AttributeInfo has Name, Value and Type here, unlike the Call service (Name, Type, Default).
  - The KeyPin event refers to SensitiveKeyPinEventEnabled while CardReaderConfiguration defines SensitivePINEventEnabled.
  - The Configuration table gives CallButtonConfigurations the type CallButtonConfigurations; the syntax block shows
    an array of CallButtonConfiguration.
  - The GetConfiguration cURL example response is abridged ('..' inside CardTypes) and is skipped.
  - The Password of IPAccessConfiguration and the card keys are not documented as masked in responses.
  migrated_from: v1
  curated: true
