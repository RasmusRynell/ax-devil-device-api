provenance:
  completeness: partial
  open_questions:
    - "No discovery probe: the docs only say the service is found through the entry service's GetServices (SOAP), which is not a supported discovery entry."
    - 'Several message tables look copy-pasted. GetIdPointList is documented as returning `IdPointInfo` items (the guide says IdPoints with their configuration) and GetIdDataConfigurationList as returning `IdPointConfiguration` items (probably IdDataConfiguration); both are modelled as documented and need checking against a device.'
    - 'The tables name the IdPoint identifier `Token` in IdPointInfo, IdPoint and IdPointConfiguration, while every example and the XML use `token`; the examples win. IdPointInfo.token is left optional because no IdPointInfo response is shown.'
    - 'The JSON response examples show a single token as a plain string (`{"Token": "floor-idpoint-token"}`) although the tables say a list; Token in the set results accepts both.'
    - 'tt:BinaryData (Graphics and Audio of FeedbackMessage) and axtid:IdPointWhiteList are referenced but not defined in the docs and are left untyped. The structure of the IdPoint WhiteList entries and their state (Active, Invalid, PendingAdd, PendingRemove) is therefore unknown.'
    - 'SecureChannelStatus.Reason is described as "Status of the secure channel"; it is modelled as the SecureChannel enumeration (Unknown, ConnectionLost, ConnectionEstablished, NotSupported, NoKey) which the docs define just before it.'
    - 'The IdDataEncoding enumeration in the API section has 15 values, the guide table 10 (a subset); the API list is used. The IdDataFieldMap Map syntax differs between the guide (`bB..B`, `xX..X`) and the API (`0bBBB`, `0xhh`, `sSSS`); the field is a plain string.'
    - 'SetIdPoint is called `SetIdPointList` in its Name field and has access class READ_SYSTEM although it writes. The Configuration table says `IdPoint.RS-485HD.Protocol` is "valid when Reader.Type is RS-485FD", which should say RS-485HD. The whitelist parameter is `IdPoint.Whitelist.IdData.Name` in the table but spelled differently on the Peripherals page.'
    - 'The EndOfPIN field is `EndOfPin` in the XML example and `EndOfPIN` in JSON and the field list; the JSON name is used. The set request messages are named `GeSetIdPointConfigurationRequest` and `GetISetIdPointConfigurationResponse`, and the GetIdPoint response field `IdPointI` (typos).'
    - 'The shown values of Action are `Access` (default) and, on the Peripherals page, `AccessDoorWithoutUnlock`; the example in the guide uses `Action1`. The field is a plain string. IdPointCapabilities.AdditionalCapabilities is "not specified" and left untyped.'
    - The ONVIF access classes are not mapped to a VAPIX role; the API default admin is kept, except GetServiceCapabilities (PRE_AUTH), which is anonymous.
  migrated_from: v1
  curated: true
