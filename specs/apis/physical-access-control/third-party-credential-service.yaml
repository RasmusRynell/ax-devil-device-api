format: 2
id: third-party-credential-service
name: Third party credential service
summary: The third party credential service handles credentials that are issued by third-party providers, as opposed
  to the normal credential management provided by the...
section: physical-access-control
family: service_json
status: released
python:
  module: third_party_credential_service
  class: ThirdPartyCredentialService
docs:
- https://developer.axis.com/vapix/physical-access-control/third-party-credential-service/
- https://developer.axis.com/vapix/physical-access-control/
- https://developer.axis.com/vapix/physical-access-control/event-logger-service/
- https://developer.axis.com/vapix/physical-access-control/access-control-service/
- https://developer.axis.com/vapix/physical-access-control/door-control-service/
- https://developer.axis.com/vapix/physical-access-control/peripherals/
access: admin

binding: {path: /vapix/axtpc}

errors:
  ter:NotFound: {description: The requested resource was not found, kind: not_found}
  ter:InvalidArgument: {description: "The request contained an invalid argument; the fault reason has more details", kind: invalid_argument}
  ter:ResourceExists: {description: The requested resource already exists}
  ter:NetworkError: {description: Network error, kind: unavailable}
  ter:CurlError: {description: Unspecified CURL error}
  ter:ConnectionError: {description: Failed to connect to the network resource, kind: unavailable}
  ter:Timeout: {description: Network request timed out, kind: unavailable}
  ter:CredentialProviderError: {description: Error from the credential provider}
  ter:GeneralProviderError: {description: "Unspecified error when communicating with the provider; the fault reason has more details"}
  ter:AuthenticationFailed: {description: "Failed to authenticate with the credential provider; check the provider login credentials"}
  ter:Unavailable: {description: The credential provider is currently unavailable, kind: unavailable}
  ter:CriticalInternalError: {description: Critical internal error, kind: internal}

types:
  ReferenceToken:
    type: string
    description: Reference token of an entity.

  Attribute:
    type: object
    description: A name with an optional value and type.
    required: [Name]
    properties:
      Name: {type: string, description: Name of the attribute.}
      type: {type: string, description: "Type of the value: `int`, `bool` or `string`."}
      Value: {type: string, description: Value of the attribute.}

  ConfigurationInfo:
    type: object
    description: A configuration setting and its description.
    properties:
      Name: {type: string, description: Name of the setting.}
      Value: {type: string, description: Value of the setting.}
      Enums:
        type: array
        items: {type: string}
        description: Suggested or allowed values.
      Type: {type: string, description: "Type of the setting, for example `string`."}
      DependOnName: {type: string, description: Name of the setting this one depends on.}
      DependOnValue: {type: string, description: Value of the setting this one depends on.}
      Description: {type: string, description: Description of the setting.}

  HIDMobilePartNumberInfo:
    type: object
    description: A part number of the HID Mobile Access account.
    properties:
      token: {type: string, description: Unique id of the part number. Use it as `DefaultPartNumberToken`.}
      Name: {type: string, description: Human readable name of the part number.}
      Description: {type: string, description: Description of the part number.}
      Quantity: {type: integer, description: The number of mobile IDs (card numbers) that can still be issued from the part number.}

  HIDMobileConfiguration:
    type: object
    description: >-
      Configuration of the HID Mobile Access credential provider. An empty configuration disables the provider.
    x-masked: [ClientSecret, ProxyPassword]
    x-read-only: [PartNumbers]
    properties:
      PartNumbers:
        type: array
        items: {$ref: "#/types/HIDMobilePartNumberInfo"}
        description: The part numbers of the account. Only returned by get_provider_configuration.
      ClientId: {type: string, description: The client id (login) of the HID Mobile Access account.}
      ClientSecret: {type: string, description: The password of the HID Mobile Access account. Shown as `***` in responses.}
      ProxyURL: {type: string, description: HTTP(S) proxy URL.}
      ProxyPort: {type: string, description: HTTP(S) proxy port.}
      ProxyUser: {type: string, description: HTTP(S) proxy user name.}
      ProxyPassword: {type: string, description: HTTP(S) proxy password.}
      DefaultPartNumberToken: {type: string, description: "Token of the part number to use when `set_third_party_credential` names none."}
      PortalApiURL: {type: string, description: URL of the HID Mobile Access portal API. Only to override the built-in default.}
      IdpURL: {type: string, description: URL of the HID Mobile Access authentication API. Only to override the built-in default.}
      CardIdDataName: {type: string, description: "Name of the credential IdData element that receives the card number. Default `CardNr`."}

  ProviderConfigurationInfo:
    type: object
    description: Wrapper for the configuration of each provider.
    properties:
      HIDMobileConfig: {$ref: "#/types/HIDMobileConfiguration", description: Configuration of HID Mobile Access.}

  HIDMobileOptions:
    type: object
    description: HID Mobile Access options of a credential.
    properties:
      PartNumberToken: {type: string, description: Token of the part number used to create the credential's mobile id.}
      InvitationCode: {type: string, description: "The invitation code sent to the user's e-mail address; it can be entered by hand in the HID Mobile Access app."}

  ThirdPartyOptions:
    type: object
    description: Wrapper for the provider specific options of a credential.
    properties:
      HIDMobileOptions: {$ref: "#/types/HIDMobileOptions", description: Options of HID Mobile Access.}

  IdData:
    type: object
    description: One identification value of a credential, for example a card number or a PIN.
    properties:
      Name: {type: string, description: "Name of the field, for example `CardNr` or `PIN`."}
      Value: {type: string, description: The value to match against.}

  CredentialAccessProfile:
    type: object
    description: A reference to an access profile, optionally restricted in time.
    properties:
      AccessProfile: {$ref: "#/types/ReferenceToken", description: Token of the access profile.}
      ValidFrom: {type: string, description: Start of the validity period. Empty or null for no restriction.}
      ValidTo: {type: string, description: End of the validity period. Empty or null for no restriction.}

  Credential:
    type: object
    description: A regular access control credential, as returned by the device.
    required: [token]
    properties:
      token: {$ref: "#/types/ReferenceToken", description: A service-unique identifier of the credential.}
      UserToken: {type: string, description: Token of the user of the credential.}
      Description: {type: string, description: Description of the credential.}
      ValidFrom: {type: string, description: When the credential starts to be valid. Empty or null for no restriction.}
      ValidTo: {type: string, description: When the credential stops being valid. Empty or null for no restriction.}
      Enabled: {type: boolean, description: Whether the credential is enabled.}
      Status: {type: string, description: "Status of the credential, for example `Enabled`, or `NotActivated` until the provider has issued a card."}
      IdData:
        type: array
        items: {$ref: "#/types/IdData"}
        description: The identification data of the credential.
      Attribute:
        type: array
        items: {$ref: "#/types/Attribute"}
        description: "Attributes of the credential. For HID Mobile Access `Email`, `FirstName` and `LastName` are needed to create a mobile user."
      AuthenticationProfile:
        type: array
        items: {$ref: "#/types/ReferenceToken"}
        description: Overrides the authentication profiles of the access profiles.
      CredentialAccessProfile:
        type: array
        items: {$ref: "#/types/CredentialAccessProfile"}
        description: The access profiles of the credential.

  CredentialInput:
    type: object
    description: A regular access control credential to create.
    x-nullable: [ValidFrom, ValidTo]
    properties:
      token: {$ref: "#/types/ReferenceToken", description: Token of the credential.}
      UserToken: {type: string, description: Token of the user of the credential.}
      Description: {type: string, description: Description of the credential.}
      ValidFrom: {type: string, description: When the credential starts to be valid. Empty or null for no restriction.}
      ValidTo: {type: string, description: When the credential stops being valid. Empty or null for no restriction.}
      Enabled: {type: boolean, description: Whether the credential is enabled.}
      Status: {type: string, description: Status of the credential.}
      IdData:
        type: array
        items: {$ref: "#/types/IdData"}
        description: "The identification data of the credential. Do not set the id data the provider writes (`CardNr` by default); it is overwritten when the card is issued."
      Attribute:
        type: array
        items: {$ref: "#/types/Attribute"}
        description: "Attributes of the credential. For HID Mobile Access `Email`, `FirstName` and `LastName` are needed to create a mobile user."
      AuthenticationProfile:
        type: array
        items: {$ref: "#/types/ReferenceToken"}
        description: Overrides the authentication profiles of the access profiles.
      CredentialAccessProfile:
        type: array
        items: {$ref: "#/types/CredentialAccessProfile"}
        description: The access profiles of the credential.

  ThirdPartyCredential:
    type: object
    description: A regular access control credential with the options of the third-party provider.
    properties:
      Credential: {$ref: "#/types/Credential", description: The regular access control credential.}
      Options: {$ref: "#/types/ThirdPartyOptions", description: Provider specific options.}

  ThirdPartyCredentialInput:
    type: object
    description: A third-party credential to create.
    properties:
      Credential: {$ref: "#/types/CredentialInput", description: The regular access control credential.}
      Options: {$ref: "#/types/ThirdPartyOptions", description: "Provider specific options, for example the part number to generate the mobile id from."}

  ProvidersResult:
    type: object
    properties:
      Providers:
        type: array
        items: {$ref: "#/types/ConfigurationInfo"}
        description: The supported credential providers.

  GetProviderConfigurationRequest:
    type: object
    required: [ProviderName]
    properties:
      ProviderName: {$ref: "#/types/ReferenceToken", description: "Provider to use, as returned by get_providers."}
      ProviderActions:
        type: array
        items: {$ref: "#/types/Attribute"}
        description: Additional actions and options for the provider.

  GetProviderConfigurationResult:
    type: object
    required: [Configuration]
    properties:
      Configuration: {$ref: "#/types/ProviderConfigurationInfo", description: Configuration of the provider.}

  SetProviderConfigurationRequest:
    type: object
    required: [ProviderName, Configuration]
    properties:
      ProviderName: {$ref: "#/types/ReferenceToken", description: "Provider to use, as returned by get_providers."}
      ProviderActions:
        type: array
        items: {$ref: "#/types/Attribute"}
        description: Additional actions and options for the provider.
      Configuration: {$ref: "#/types/ProviderConfigurationInfo", description: "Configuration of the provider. An empty `HIDMobileConfig` disables it."}

  SetThirdPartyCredentialRequest:
    type: object
    required: [ProviderName, ThirdPartyCredential]
    properties:
      ProviderName: {$ref: "#/types/ReferenceToken", description: "Provider to use, as returned by get_providers."}
      ProviderActions:
        type: array
        items: {$ref: "#/types/Attribute"}
        description: >-
          Additional actions and options for the provider, as `{Name: ...}` attributes: `ForceUpdate` forces an update
          to the HID Mobile service and overwrites any old user with the same e-mail, `SendInvitationOnly` only sends a
          new invitation e-mail and writes nothing locally, `NoLocalModification` leaves the access control credential
          unchanged when the card number has been issued.
      ThirdPartyCredential: {$ref: "#/types/ThirdPartyCredentialInput", description: The credential to create.}

  TokenResult:
    type: object
    required: [Token]
    properties:
      Token: {$ref: "#/types/ReferenceToken", description: Token of the added credential.}

  GetThirdPartyCredentialListRequest:
    type: object
    required: [ProviderName]
    properties:
      ProviderName: {$ref: "#/types/ReferenceToken", description: "Provider to use, as returned by get_providers."}
      ProviderActions:
        type: array
        items: {$ref: "#/types/Attribute"}
        description: Additional actions and options for the provider.
      Limit: {type: integer, description: "Maximum number of entries to return. If absent, or higher than the device supports, the device decides."}
      StartReference: {$ref: "#/types/ReferenceToken", description: Start returning entries from this reference.}

  ThirdPartyCredentialList:
    type: object
    properties:
      NextStartReference: {$ref: "#/types/ReferenceToken", description: "StartReference to use in the next call to get the following items. Absent when there are no more items."}
      ThirdPartyCredentials:
        type: array
        items: {$ref: "#/types/ThirdPartyCredential"}
        description: The credentials.

  ThirdPartyCredentialTokenRequest:
    type: object
    required: [ProviderName, Token]
    properties:
      ProviderName: {$ref: "#/types/ReferenceToken", description: "Provider to use, as returned by get_providers."}
      ProviderActions:
        type: array
        items: {$ref: "#/types/Attribute"}
        description: "Additional actions and options for the provider. For removal `NoLocalModification` removes only the third-party credential and keeps the local access control credential; for a get `ForceUpdate` also contacts the provider."
      Token: {$ref: "#/types/ReferenceToken", description: Token of the credential.}

  ThirdPartyCredentialEmailRequest:
    type: object
    required: [ProviderName, Email]
    properties:
      ProviderName: {$ref: "#/types/ReferenceToken", description: "Provider to use, as returned by get_providers."}
      ProviderActions:
        type: array
        items: {$ref: "#/types/Attribute"}
        description: "Additional actions and options for the provider. For removal `NoLocalModification` removes only the third-party credential and keeps the local access control credential; for a get `ForceUpdate` also contacts the provider."
      Email: {type: string, description: E-mail address of the credential.}

  ThirdPartyCredentialResult:
    type: object
    required: [ThirdPartyCredential]
    properties:
      ThirdPartyCredential: {$ref: "#/types/ThirdPartyCredential", description: The requested credential.}

operations:
  get_providers:
    summary: Get the supported third-party credential providers.
    description: >-
      The `ProviderName` of the other calls must be one of the returned provider names. HID Mobile Access
      (`HIDMobileAccess`) is the only provider. The API is only supported by AXIS A1001.
    effect: read
    binding: {operation: "axtpc:GetProviders"}
    result: {$ref: "#/types/ProvidersResult"}
    examples:
      - title: Get the supported providers
        request: {params: {}}
        response:
          data:
            Providers:
              - {Name: ProviderName, Value: HIDMobileAccess, Type: string, Enums: [HIDMobileAccess]}
        source: https://developer.axis.com/vapix/physical-access-control/third-party-credential-service/#get-supported-providers

  get_provider_configuration:
    summary: Get the configuration of a credential provider.
    description: The client secret is masked and the response lists the part numbers of the account.
    effect: read
    binding: {operation: "axtpc:GetProviderConfiguration"}
    params: {$ref: "#/types/GetProviderConfigurationRequest"}
    result: {$ref: "#/types/GetProviderConfigurationResult"}
    examples:
      - title: Get the HID Mobile Access configuration
        request: {params: {ProviderName: HIDMobileAccess}}
        response:
          data:
            Configuration:
              HIDMobileConfig:
                ClientId: 1824-SRV443124455
                ClientSecret: "***"
                ProxyURL: wwwproxy.se.axis.com
                ProxyPort: "3128"
                PartNumbers:
                  - {token: CRD633ZZ-TST0030, Name: Company part number, Description: Part numbers for inner doors, Quantity: 42}
                DefaultPartNumberToken: CRD633ZZ-TST0030
                PortalApiURL: https://ma.api.assaabloy.com/credential-management/
                IdpURL: https://idp.hidglobal.com/idp/SISDOMAIN/
                CardIdDataName: CardNr
        source: https://developer.axis.com/vapix/physical-access-control/third-party-credential-service/#retrieve-the-configuration-of-a-credential-provider

  set_provider_configuration:
    summary: Set the configuration of a credential provider.
    description: >-
      One configuration exists per provider; a new call overwrites it. An empty configuration disables the provider.
    effect: write
    write: replace
    binding: {operation: "axtpc:SetProviderConfiguration"}
    params: {$ref: "#/types/SetProviderConfigurationRequest"}
    examples:
      - title: Configure HID Mobile Access
        request:
          params:
            ProviderName: HIDMobileAccess
            ProviderActions: []
            Configuration:
              HIDMobileConfig:
                ClientId: 1824-SRV443124455
                ClientSecret: HIDpassword123!
                ProxyURL: http://wwwproxy.se.axis.com
                ProxyPort: "3128"
                DefaultPartNumberToken: CRD633ZZ-TST0030
                PortalApiURL: https://test-ma.api.assaabloy.com/credential-management/
                IdpURL: https://test.idp.hidglobal.com/idp/SISDOMAIN/
        response: {data: {}}
        source: https://developer.axis.com/vapix/physical-access-control/third-party-credential-service/#configuring-a-credential-provider
      - title: Disable the configuration
        request:
          params:
            ProviderName: HIDMobileAccess
            ProviderActions: []
            Configuration:
              HIDMobileConfig: {}
        response: {data: {}}
        source: https://developer.axis.com/vapix/physical-access-control/third-party-credential-service/#disable-a-configuration

  set_third_party_credential:
    summary: Create a third-party credential, with its user, at a provider.
    description: >-
      Creates a user and a credential linked to it. The credential has status `NotActivated` until the provider has
      issued a card; for HID Mobile Access that happens when the user accepts the invitation sent to the `Email`
      attribute, usually a couple of minutes after. The `Email`, `FirstName` and `LastName` attributes are needed for a
      new HID Mobile user.
    effect: write
    write: create
    binding: {operation: "axtpc:SetThirdPartyCredential"}
    params: {$ref: "#/types/SetThirdPartyCredentialRequest"}
    result: {$ref: "#/types/TokenResult"}
    examples:
      - title: Create a HID Mobile Access credential
        request:
          params:
            ProviderName: HIDMobileAccess
            ProviderActions: []
            ThirdPartyCredential:
              Options:
                HIDMobileOptions: {PartNumberToken: CRD633ZZ-TST0030}
              Credential:
                token: credential_token
                UserToken: user_token
                IdData: [{Name: PIN, Value: "1234"}]
                Attribute:
                  - {Name: Email, Value: kalle.karlsson@example.com}
                  - {Name: LastName, Value: Karlsson}
                  - {Name: FirstName, Value: Kalle}
        response: {data: {Token: credential_token}}
        source: https://developer.axis.com/vapix/physical-access-control/third-party-credential-service/#creating-third-party-credentials

  get_third_party_credential_list:
    summary: List the third-party credentials of a provider.
    description: >-
      Pages through the credentials. Pass the returned `NextStartReference` as `StartReference` in the next call and
      never reuse a reference.
    effect: read
    binding: {operation: "axtpc:GetThirdPartyCredentialList"}
    params: {$ref: "#/types/GetThirdPartyCredentialListRequest"}
    result: {$ref: "#/types/ThirdPartyCredentialList"}
    errors:
      ter:InvalidStartReference: {description: "StartReference is invalid or has timed out; start again from the beginning", kind: invalid_argument}

  get_third_party_credential:
    summary: Get a third-party credential by token.
    description: With the `ForceUpdate` provider action the call also asks the provider; normally the information is stored locally.
    effect: read
    binding: {operation: "axtpc:GetThirdPartyCredential"}
    params: {$ref: "#/types/ThirdPartyCredentialTokenRequest"}
    result: {$ref: "#/types/ThirdPartyCredentialResult"}
    examples:
      - title: Get a credential by token
        request: {params: {ProviderActions: [], ProviderName: HIDMobileAccess, Token: credential_token}}
        source: https://developer.axis.com/vapix/physical-access-control/third-party-credential-service/#retrieving-third-party-credentials

  get_third_party_credential_by_email:
    summary: Get a third-party credential by e-mail address.
    effect: read
    binding: {operation: "axtpc:GetThirdPartyCredentialByEmail"}
    params: {$ref: "#/types/ThirdPartyCredentialEmailRequest"}
    result: {$ref: "#/types/ThirdPartyCredentialResult"}
    examples:
      - title: Get a credential by e-mail address
        request:
          params: {ProviderActions: [], ProviderName: HIDMobileAccess, Email: kalle.karlsson@example.com}
        response:
          data:
            ThirdPartyCredential:
              Credential:
                token: credential_token
                UserToken: ""
                Description: ""
                ValidFrom: ""
                ValidTo: ""
                Enabled: true
                Status: Enabled
                IdData: [{Name: CardNr, Value: "18302"}, {Name: PIN, Value: "1234"}]
                Attribute:
                  - {Name: FirstName, Value: Kalle}
                  - {Name: LastName, Value: Karlsson}
                  - {Name: Email, Value: kalle.karlsson@example.com}
                AuthenticationProfile: []
                CredentialAccessProfile: []
              Options:
                HIDMobileOptions: {PartNumberToken: CRD633ZZ-TST0030, InvitationCode: BUFI-LH56-AJTD-KFGS}
        source: https://developer.axis.com/vapix/physical-access-control/third-party-credential-service/#retrieving-third-party-credentials

  remove_third_party_credential:
    summary: Remove a third-party credential by token.
    description: With the `NoLocalModification` provider action only the third-party credential is removed and the local access control credential stays.
    effect: write
    write: delete
    binding: {operation: "axtpc:RemoveThirdPartyCredential"}
    params: {$ref: "#/types/ThirdPartyCredentialTokenRequest"}
    examples:
      - title: Remove a credential by token
        request: {params: {ProviderName: HIDMobileAccess, ProviderActions: [], Token: credential_token}}
        source: https://developer.axis.com/vapix/physical-access-control/third-party-credential-service/#removing-credential-by-token

  remove_third_party_credential_by_email:
    summary: Remove a third-party credential by e-mail address.
    description: With the `NoLocalModification` provider action only the third-party credential is removed and the local access control credential stays.
    effect: write
    write: delete
    binding: {operation: "axtpc:RemoveThirdPartyCredentialByEmail"}
    params: {$ref: "#/types/ThirdPartyCredentialEmailRequest"}
    examples:
      - title: Remove a credential by e-mail address
        request: {params: {ProviderName: HIDMobileAccess, ProviderActions: [], Email: kalle.karlsson@example.com}}
        source: https://developer.axis.com/vapix/physical-access-control/third-party-credential-service/#removing-credential-by-e-mail

