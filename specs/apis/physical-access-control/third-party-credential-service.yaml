provenance:
  completeness: complete
  open_questions:
    - "No discovery probe: the docs only say the service is found through the entry service's GetServices (SOAP), which is not a supported discovery entry. The docs state that the API is only supported by AXIS A1001."
    - 'The GetProviderConfiguration JSON response example names the wrapper `HidMobileConfig`; the field tables and the XML use `HIDMobileConfig`, so the example is corrected to that.'
    - 'The "Disable a configuration" JSON example sends `ProviderAction`; the message table field is `ProviderActions`, so the example is corrected to that.'
    - 'The message tables type `ProviderActions` as `pt:Attribute`, which is not defined; it is mapped to the Attribute structure with Name, type and Value used in the examples. The `Email` field is typed `pt:ReferenceToken` in the tables and modelled as a plain string.'
    - 'The Credential structure comes from the access control service docs. Its request form (CredentialInput) has no required fields because the SetThirdPartyCredential example sends only token, UserToken, IdData and Attribute.'
    - The docs do not list the values of the credential Status (the examples show `Enabled`, and `NotActivated` and `Activated` in the text and XML).
    - The notification topics are spelled `tns1:Configuration/tns1:Credential/...` on the service page but `tns1:Configuration/Credential/...` in the event logger topics table. The error codes ter:NetworkError, ter:CredentialProviderError and ter:CriticalInternalError are listed in the API errors section but not in the message tables.
    - The ONVIF access classes (READ_SYSTEM_SENSITIVE, WRITE_SYSTEM) are not mapped to a VAPIX role; the API default admin is kept.
  migrated_from: v1
  curated: true
