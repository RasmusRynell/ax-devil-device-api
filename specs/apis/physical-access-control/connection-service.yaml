provenance:
  completeness: complete
  open_questions:
  - The API is only supported by AXIS A1001.
  - The peer field table is garbled in the source (ID rendered as I`D`, TrustState and ConnectionState merged into the
    DeviceUUID bullet); the types come from the PeerTrustState and PeerConnectionState sections and the GetPeerList example.
  - AddPeers takes aconn:Peer, but only ID and ExpectedAddress are meaningful in the request; the other Peer fields are
    marked read-only.
  - Access classes are READ_SYSTEM_SENSITIVE, ACTUATE and WRITE_SYSTEM and are not mapped to VAPIX roles; the API default
    admin is kept. No faults are documented.
  - The sample events for peer connection changes are logged by the event logger service and are not modelled here.
  migrated_from: v1
  curated: true
