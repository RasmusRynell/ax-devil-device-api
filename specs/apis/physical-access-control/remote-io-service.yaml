format: 2
id: remote-io-service
name: Remote I/O service
summary: 'Remote I/O service (axrio): add remote devices such as remote I/O modules (e.g.'
section: physical-access-control
family: service_json
status: released
python:
  module: remote_io_service
  class: RemoteIoService
docs:
- https://developer.axis.com/vapix/physical-access-control/peripherals/
- https://developer.axis.com/vapix/physical-access-control/
- https://developer.axis.com/vapix/physical-access-control/event-logger-service/
access: admin

discovery:
- service: {namespace: 'http://www.axis.com/vapix/ws/axrio'}

binding: {path: /vapix/axrio}

types:
  Device:
    type: object
    description: A remote device, such as a remote I/O module, to add to the door controller.
    properties:
      token: {type: string, description: Token of the device. Generated by the device when not given. The field name is not shown in the docs (see open questions).}
      Name: {type: string, description: Optional nicename.}
      Username: {type: string, description: A VAPIX user on the remote I/O module.}
      Password: {type: string, description: Password of that VAPIX user.}
      MACAddress: {type: string, description: "MAC address of the remote device, for example `00:40:8c:18:64:07`."}
      IPAddress: {type: string, description: IP address of the remote device. It need not be on the local network.}

  SetDeviceRequest:
    type: object
    required: [Device]
    properties:
      Device:
        type: array
        items: {$ref: "#/types/Device"}
        description: The devices to add.

  SetDeviceResult:
    type: object
    properties:
      Token: {type: string, description: Token of the added device. Pass it as `Address` to the discovery service's GetServiceProviderList to find the device's remote I/Os.}

operations:
  set_device:
    summary: Add a remote device, such as a remote I/O module, to the door controller.
    description: >-
      Up to two I/O modules can be added to one door controller. Adding a device connects it to the door controller,
      which then synchronizes events and schedules with it. Use the discovery service's GetServiceProviderList to find
      the device's IP and MAC address on the local network.
    effect: write
    write: create
    binding: {operation: "axrio:SetDevice"}
    params: {$ref: "#/types/SetDeviceRequest"}
    result: {$ref: "#/types/SetDeviceResult"}
    examples:
      - title: Add a remote I/O module
        request:
          params:
            Device:
              - {Name: AXIS A9188, Username: user, Password: pass, MACAddress: "00:40:8c:18:64:07", IPAddress: 172.25.11.13}
        response:
          data: {Token: "Axis-accc8e0c0ca1:1454410450.819540000"}
        source: https://developer.axis.com/vapix/physical-access-control/peripherals/#add-a-remote-device

sources:
