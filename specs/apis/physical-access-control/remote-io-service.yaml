  retrieved_at: '2026-10-11'
- url: https://developer.axis.com/vapix/physical-access-control/event-logger-service/
  sha256_md: df3688f4c13448b099bd1126f31cc26e1eaaae943bf21565bea22dc0dad6d998
  retrieved_at: '2026-10-11'

provenance:
  completeness: stub
  open_questions:
    - The Remote I/O service (axrio) is listed in the overview Identification table but has no API page; only SetDevice is documented, in the Peripherals guide. Operations to list or remove devices, the fault codes and the access class are not documented.
    - 'The guide says "if no token is specified, a token is generated automatically" but never shows the field name; `token` follows the other physical access control services.'
    - It is not documented whether SetDevice updates an existing device when a known token is given, whether the Token reply is a single string or a list when several devices are sent, or which Device fields are required.
  migrated_from: v1
  curated: true
