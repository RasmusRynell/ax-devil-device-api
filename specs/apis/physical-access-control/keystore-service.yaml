format: 2
id: keystore-service
name: Keystore service
summary: The axkey service implements a keystore.
section: physical-access-control
family: service_json
status: released
python:
  module: keystore_service
  class: KeystoreService
docs:
- https://developer.axis.com/vapix/physical-access-control/keystore-service/
- https://developer.axis.com/vapix/physical-access-control/
- https://developer.axis.com/vapix/physical-access-control/idpoint-service/
- https://developer.axis.com/vapix/physical-access-control/peripherals/
access: admin

discovery:
- service: {namespace: 'http://www.axis.com/vapix/ws/KeyStore'}

binding: {path: /vapix/axkey}

types:
  ReferenceToken:
    type: string
    description: Reference token of an entity.

  EncryptionKey:
    type: object
    description: An encryption key as returned by the device.
    required: [token]
    x-masked: [Key]
    x-read-only: [ModificationTime]
    properties:
      token: {$ref: "#/types/ReferenceToken", description: A service-unique identifier of the encryption key.}
      Key: {type: string, maxLength: 1024, description: "The cryptographic key. The device never reveals it; responses show `*****`."}
      Name: {type: string, description: Name of the key.}
      Description: {type: string, maxLength: 1024, description: Extra information about the key.}
      ModificationTime: {type: string, description: UTC time when the key was last updated. Set by the device; cannot be set with set_encryption_key.}

  EncryptionKeyInput:
    type: object
    description: An encryption key to add or update.
    required: [token, Key]
    properties:
      token: {$ref: "#/types/ReferenceToken", description: A service-unique identifier of the encryption key. An existing token updates that key.}
      Key: {type: string, maxLength: 1024, description: "The cryptographic key, for example a 16-byte value as 32 hex digits. The known key SCBK-D and the all-zero 16-byte value are rejected."}
      Name: {type: string, description: Name of the key.}
      Description: {type: string, maxLength: 1024, description: Extra information about the key.}

  EncryptionKeyList:
    type: object
    properties:
      NextStartReference: {type: string, description: "StartReference to use in the next call to get the following items. Absent when there are no more items."}
      EncryptionKey:
        type: array
        items: {$ref: "#/types/EncryptionKey"}
        description: The keys, without key values.

  SetEncryptionKeyRequest:
    type: object
    required: [EncryptionKey]
    properties:
      EncryptionKey:
        type: array
        minItems: 1
        items: {$ref: "#/types/EncryptionKeyInput"}
        description: The new versions of the encryption keys.

  TokenList:
    type: object
    properties:
      Token:
        type: array
        items: {$ref: "#/types/ReferenceToken"}
        description: Tokens of the added or updated keys.

  EncryptionKeys:
    type: object
    properties:
      EncryptionKey:
        type: array
        items: {$ref: "#/types/EncryptionKey"}

  TokensRequest:
    type: object
    required: [Token]
    properties:
      Token:
        type: array
        minItems: 1
        items: {$ref: "#/types/ReferenceToken"}
        description: Tokens of the encryption keys.

operations:
  get_encryption_key_list:
    summary: List the encryption keys, without their key values.
    description: >-
      Pages through the keys. Pass the returned `NextStartReference` as `StartReference` in the next call and never
      reuse a reference. The device may return fewer items than `Limit`.
    effect: read
    binding: {operation: "axkey:GetEncryptionKeyList"}
    params:
      type: object
      x-name: GetEncryptionKeyListRequest
      properties:
        Limit: {type: integer, description: "Maximum number of entries to return. If absent, or greater than the device supports, the device decides."}
        StartReference: {type: string, description: "Start returning entries from this reference. If absent, start from the beginning."}
    result: {$ref: "#/types/EncryptionKeyList"}
    errors:
      ter:InvalidStartReference: {description: "StartReference is invalid or has timed out; start again from the beginning.", kind: invalid_argument}

  set_encryption_key:
    summary: Add or update encryption keys.
    description: >-
      Adds the keys, or updates the keys whose token already exists. The modification time is set by the device.
    effect: write
    write: patch
    binding: {operation: "axkey:SetEncryptionKey"}
    params: {$ref: "#/types/SetEncryptionKeyRequest"}
    result: {$ref: "#/types/TokenList"}
    errors:
      ter:InvalidArgs: {description: Invalid key value, kind: invalid_argument}
    examples:
      - title: Add an encryption key
        request:
          params:
            EncryptionKey:
              - {Name: My key name, Description: My key description, token: my_key, Key: "00010203040506070809101112131415"}
        source: https://developer.axis.com/vapix/physical-access-control/keystore-service/#keystore-service-guide

  get_encryption_key:
    summary: Get one or more encryption keys, without their key values.
    effect: read
    binding: {operation: "axkey:GetEncryptionKey"}
    params: {$ref: "#/types/TokensRequest"}
    result: {$ref: "#/types/EncryptionKeys"}
    errors:
      ter:NotFound: {description: Encryption key not found, kind: not_found}

  remove_encryption_key:
    summary: Remove the encryption keys with the given tokens.
    effect: write
    write: delete
    binding: {operation: "axkey:RemoveEncryptionKey"}
    params: {$ref: "#/types/TokensRequest"}
    errors:
      ter:NotFound: {description: Encryption key not found, kind: not_found}

