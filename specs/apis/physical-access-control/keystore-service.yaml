provenance:
  completeness: complete
  open_questions:
    - 'The key identifier is documented as "Token" in the field list but sent as "token" in the JSON and XML examples; the examples win (wire name `token`).'
    - 'The JSON examples for SetEncryptionKey in this page and in the IdPoint page prefix the member name (`axkey:EncryptionKey`); unprefixed names are used everywhere else, and the example is kept here in the unprefixed form.'
    - 'The docs say Key is a required field but also that responses hide it ("*****", or empty for GetEncryptionKeyList); the response type leaves Key optional and masked and the request type requires it.'
    - The docs give no format for ModificationTime (presumably an xs:dateTime string) and no response example for any operation.
    - The ONVIF access classes (READ_SYSTEM_SENSITIVE, WRITE_SYSTEM) are not mapped to a VAPIX role; the API default admin is kept.
  migrated_from: v1
  curated: true
