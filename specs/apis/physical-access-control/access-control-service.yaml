provenance:
  completeness: complete
  open_questions:
  - The page gives no discovery probe; use the VAPIX Entry Service API (GetServices) and look for the namespaces
    http://www.onvif.org/ver10/accesscontrol/wsdl and http://www.axis.com/vapix/ws/pacs.
  - The access classes (PRE_AUTH, READ_SYSTEM, READ_SYSTEM_SENSITIVE, READ_SYSTEM_SECRET, ACTUATE, WRITE_SYSTEM)
    are not mapped to VAPIX roles; GetServiceCapabilities (PRE_AUTH) is anonymous and the API default admin is kept
    for the rest.
  - 'Tokens are optional on the entity types: the JSON examples add entities without a token and the device returns
    the allocated one, while the XML shows token="".'
  - The 'following fields are available' lists are not clear about which fields are always present, so only identifiers
    and names are required; examples show empty lists and empty strings for the rest.
  - SetCredentialResponse is documented as Credential items, while the system-integration examples return a Token
    list; both fields are optional in the result.
  - GetCredentialListResponse is documented as CredentialInfo items.
  - SetAccessPointResponse Token multiplicity is [1][unbounded] while the other Set responses use [0][unbounded].
  - Guide examples call pacsaxis:SetAuthenticationProfile while the API section documents the operation in namespace
    tac; the tac name is bound.
  - AntipassbackData.PassOkThreshold is 'in microseconds' (xs:long) in the guide and 'in seconds' in the API section;
    the unit is unresolved. Violation has no documented type (the example shows an empty string); AntiPassbackTimeout
    has a '0..tdb' range in the docs.
  - The API section names the predefined profile CardPlusPIN, while the default configuration shows CardPlusPin
    and REXOnly.
  - The Configuration entries of AccessControllerConfiguration are not documented; they are modelled as name and
    value pairs by analogy with DoorConfiguration.
  - ValidFrom and ValidTo are dateTime values shown as ISO 8601 strings (for example 1997-01-01T00:00:00Z) and may
    be null.
  - Types MatchOperator, MatchRule (a Field/Operator pair with no field table), Rule, AuthorizationProfile and AuthorizationProfileInfo
    are documented but no operation uses them; Extension members and the Area and AuthenticationProfile Extension
    are not modelled.
  - Message tables reference types in another namespace prefix than the section the structure is documented in;
    mapped by local name.
