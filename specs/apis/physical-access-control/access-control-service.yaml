format: 2
id: access-control-service
name: Access control service
summary: Manage access points, areas, access controllers, credentials, access and authentication profiles and anti-passback
  data, and request or verify access.
section: physical-access-control
family: service_json
status: released
python:
  module: access_control_service
  class: AccessControlService
docs:
- https://developer.axis.com/vapix/physical-access-control/access-control-service/
- https://developer.axis.com/vapix/physical-access-control/
- https://developer.axis.com/vapix/physical-access-control/event-logger-service/
- https://developer.axis.com/vapix/physical-access-control/peripherals/
- https://developer.axis.com/vapix/physical-access-control/system-integration-examples/
access: admin

binding: {path: /vapix/pacs}

types:
  ReferenceToken: {type: string, description: Reference token of an entity.}
  ServiceCapabilities:
    type: object
    description: Optional functionality of the service. Static; does not change during device operation.
    properties:
      MaxLimit:
        type: integer
        description: The maximum number of entries returned by a single GetList request. The device never returns
          more entities in a single response.
      DisableCredential: {type: boolean, description: True if EnableCredential and DisableCredential are supported.}
      GetAccessPoint: {type: boolean, description: True if GetAccessPointList and GetAccessPoint are supported.}
      SetAccessPoint: {type: boolean, description: True if SetAccessPoint is supported.}
      RemoveAccessPoint: {type: boolean, description: True if RemoveAccessPoint is supported.}
      GetArea: {type: boolean, description: True if GetAreaList and GetArea are supported.}
      SetArea: {type: boolean, description: True if SetArea is supported.}
      RemoveArea: {type: boolean, description: True if RemoveArea is supported.}
      GetCredential: {type: boolean, description: True if GetCredentialList and GetCredential are supported.}
      SetCredential: {type: boolean, description: True if SetCredential is supported.}
      RemoveCredential: {type: boolean, description: True if RemoveCredential is supported.}
      StandardAttributesSupported: {type: boolean, description: True if GetStandardAttributeList is supported.}
      VendorAttributesSupported: {type: boolean, description: True if GetVendorAttributeList is supported.}
  AccessPointCapabilities:
    type: object
    description: Optional functionality of one access point. Different access points may differ, and the capabilities
      may change if hardware settings change.
    properties:
      DisableAccessPoint:
        type: boolean
        description: The access point supports EnableAccessPoint and DisableAccessPoint.
      Duress: {type: boolean, description: The access point supports generation of duress events.}
      AnonymousAccess:
        type: boolean
        description: The access point has a REX switch or other input that allows anonymous access.
      AccessTaken:
        type: boolean
        description: The access point generates AccessTaken and AccessNotTaken events (anonymous versions too when
          AnonymousAccess is also true).
      ExternalAuthorization:
        type: boolean
        description: The access point supports ExternalAuthorization and generation of Request events (anonymous
          version too when AnonymousAccess is also true).
  AccessPointInfo:
    type: object
    description: 'Basic information about an AccessPoint: how access is controlled in one direction for a door (from
      which area to which area).'
    required: [token, Name, Entity, Capabilities]
    properties:
      token: {$ref: '#/types/ReferenceToken', description: A service-unique identifier of the AccessPoint.}
      Name:
        type: string
        description: A user readable name. It shall be up to 64 characters.
        maxLength: 64
      Description:
        type: string
        description: Optional user readable description. It shall be up to 1024 characters.
        maxLength: 1024
      AreaFrom:
        $ref: '#/types/ReferenceToken'
        description: Optional reference to the Area from which access is requested.
      AreaTo:
        $ref: '#/types/ReferenceToken'
        description: Optional reference to the Area to which access is requested.
      Entity:
        $ref: '#/types/ReferenceToken'
        description: Reference to the entity used to control access; typically a Door.
      EntityType: {type: string, description: 'Optional entity type; a Door (tdc:Door) is assumed if missing.'}
      Capabilities: {$ref: '#/types/AccessPointCapabilities', description: The capabilities for the AccessPoint.}
  AreaInfo:
    type: object
    description: Basic information about an Area.
    required: [token, Name]
    properties:
      token: {$ref: '#/types/ReferenceToken', description: A service-unique identifier of the Area.}
      Name:
        type: string
        description: User readable name. It shall be up to 64 characters.
        maxLength: 64
      Description:
        type: string
        description: User readable description. It shall be up to 1024 characters.
        maxLength: 1024
  AccessPointState:
    type: object
    description: State information for an AccessPoint.
    required: [Enabled]
    properties:
      Enabled:
        type: boolean
        description: Whether the AccessPoint is enabled. True by default if the DisableAccessPoint capability is
          not supported.
  Decision:
    type: string
    description: A choice of two options for an access request.
    enum: [Granted, Denied]
  Attribute:
    type: object
    description: A generic name and optional value and type that can be added to various data structures.
    required: [Name]
    properties:
      Name: {type: string, description: Name of the attribute.}
      type: {type: string, description: 'Type of the attribute: int, bool or string.'}
      Value: {type: string, description: Value of the attribute.}
  NameValue:
    type: object
    description: A generic name and value pair.
    required: [Name, Value]
    properties:
      Name: {type: string, description: Name.}
      Value: {type: string, description: Value.}
  IdPointDevice:
    type: object
    description: An IdPoint and the device it is on.
    required: [IdPoint]
    properties:
      IdPoint: {$ref: '#/types/ReferenceToken', description: Reference to an IdPoint.}
      DeviceUUID:
        type: string
        description: DeviceUUID of the device where the IdPoint is located. If empty or omitted, the IdPoint token
          refers to this device.
  ActionArgument:
    type: object
    description: An argument to be used with the Action of an AccessPoint.
    required: [Name, Value]
    properties:
      Name: {type: string, description: Name of the argument.}
      Value: {type: string, description: Value of the argument.}
      type: {type: string, description: Type of the argument.}
  AccessPoint:
    type: object
    description: The full configuration of an AccessPoint, the mapping between one or more IdPoints and an entity
      (typically a Door) used to control access.
    required: [Name, Entity]
    properties:
      token:
        $ref: '#/types/ReferenceToken'
        description: A service-unique identifier. May be omitted or empty when adding; the service then allocates
          a token.
      Name:
        type: string
        description: A user readable name. It shall be up to 64 characters.
        maxLength: 64
      Description:
        type: string
        description: Optional user readable description. It shall be up to 1024 characters.
        maxLength: 1024
      AreaFrom:
        $ref: '#/types/ReferenceToken'
        description: Optional reference to the Area from which access is requested.
      AreaTo:
        $ref: '#/types/ReferenceToken'
        description: Optional reference to the Area to which access is requested.
      Entity:
        $ref: '#/types/ReferenceToken'
        description: Reference to the entity used to control access; typically a Door.
      EntityType:
        type: string
        description: Optional entity type, for example axtdc:Door or tdc:Door. A Door is assumed if empty.
      DoorDeviceUUID:
        type: string
        description: DeviceUUID of the device the Door is on. If empty or omitted, the Door token refers to this
          device.
      Enabled: {type: boolean, description: Whether this AccessPoint is enabled.}
      IdPointDevice:
        type: array
        items: {$ref: '#/types/IdPointDevice'}
        description: The IdPoints, and their devices, that can request access here. May contain several, for example
          a fingerprint reader and a card reader.
      AuthenticationProfile:
        type: array
        items: {$ref: '#/types/ReferenceToken'}
        description: Tokens of the AuthenticationProfile items that apply for this AccessPoint.
      Attribute:
        type: array
        items: {$ref: '#/types/Attribute'}
        description: Optional attributes associated with the AccessPoint.
      ActionArgument:
        type: array
        items: {$ref: '#/types/ActionArgument'}
        description: Optional arguments to the Action.
      Action:
        type: string
        description: 'Action associated with the AccessPoint: typically Access, AccessDoor or AccessDoorWithoutUnlock.
          Access is used if empty.'
  Area:
    type: object
    description: An area and its settings.
    required: [Name]
    properties:
      token:
        $ref: '#/types/ReferenceToken'
        description: A service-unique identifier. May be omitted or empty when adding; the service then allocates
          a token.
      Name:
        type: string
        description: User readable name. It shall be up to 64 characters.
        maxLength: 64
      Description:
        type: string
        description: User readable description. It shall be up to 1024 characters.
        maxLength: 1024
      Attribute:
        type: array
        items: {$ref: '#/types/Attribute'}
        description: Attribute list for the Area.
  AccessControllerInfo:
    type: object
    description: Information for an AccessController, listing the AccessPoints it controls.
    required: [token, Name]
    properties:
      token:
        $ref: '#/types/ReferenceToken'
        description: A service-unique identifier of the AccessController.
      Name: {type: string, description: Short name of the AccessController.}
      Description: {type: string, description: Description of the AccessController.}
      AccessPoint:
        type: array
        items: {$ref: '#/types/ReferenceToken'}
        description: Tokens of the AccessPoint items the AccessController manages.
  AccessController:
    type: object
    description: The full configuration of an AccessController, which receives access requests from IdPoints and
      controls doors and other resources.
    required: [Name]
    properties:
      token:
        $ref: '#/types/ReferenceToken'
        description: A service-unique identifier. May be omitted or empty when adding; the service then allocates
          a token.
      Name: {type: string, description: Short name of the AccessController.}
      Description: {type: string, description: Description of the AccessController.}
      AccessPoint:
        type: array
        items: {$ref: '#/types/ReferenceToken'}
        description: Tokens of the AccessPoint items the AccessController manages.
  CredentialStatusEnum:
    type: string
    description: The status of a credential, for example the reason for being disabled. Also used as the Reason
      field in certain events. Enabled is the only state in which access can be granted.
    enum:
    - NotActivated
    - Enabled
    - Disabled
    - LockedOut
    - Lost
    - Stolen
    - Damaged
    - Destroyed
    - Inactive
    - MaxDays
    - MaxUses
    - Expired
  CredentialInfo:
    type: object
    description: Information about a Credential.
    required: [token, Enabled, Status]
    x-nullable: [ValidFrom, ValidTo]
    properties:
      token: {$ref: '#/types/ReferenceToken', description: A service-unique identifier of the Credential.}
      Enabled: {type: boolean, description: Whether the Credential is enabled.}
      Status:
        $ref: '#/types/CredentialStatusEnum'
        description: Status of the Credential, for example the reason for being disabled. Should normally be one
          of the CredentialStatusEnum values.
      UserToken:
        $ref: '#/types/ReferenceToken'
        description: Identifies the User of the Credential. Optional for security and privacy reasons.
      Description: {type: string, description: Description of the Credential.}
      ValidFrom:
        type: string
        description: When the Credential starts to be valid. If null, there is no restriction (valid from whenever).
      ValidTo:
        type: string
        description: When the Credential stops being valid. If null, there is no restriction (valid forever).
  IdData:
    type: object
    description: A single identification or authentication name and value, such as a card number or PIN.
    required: [Name, Value]
    properties:
      Name: {type: string, description: Name of the field.}
      Value: {type: string, description: The value to match against.}
  CredentialAccessProfile:
    type: object
    description: A reference from a Credential to an AccessProfile, optionally restricting the period further than
      the AccessProfile does.
    required: [AccessProfile]
    x-nullable: [ValidFrom, ValidTo]
    properties:
      AccessProfile: {$ref: '#/types/ReferenceToken', description: Reference to the AccessProfile.}
      ValidFrom:
        type: string
        description: Optional start of the period for the AccessProfile. If null, there is no additional restriction.
      ValidTo:
        type: string
        description: Optional end of the period for the AccessProfile. If null, there is no additional restriction.
  Credential:
    type: object
    description: 'A Credential: the information needed to authenticate a user and the AccessProfiles it is authorized
      through.'
    x-nullable: [ValidFrom, ValidTo]
    properties:
      token:
        $ref: '#/types/ReferenceToken'
        description: A service-unique identifier. May be omitted or empty when adding; the service then allocates
          a token.
      Enabled: {type: boolean, description: Whether the Credential is enabled.}
      Status:
        $ref: '#/types/CredentialStatusEnum'
        description: Status of the Credential, for example the reason for being disabled.
      IdData:
        type: array
        items: {$ref: '#/types/IdData'}
        description: The identification data for the credential.
      Attribute:
        type: array
        items: {$ref: '#/types/Attribute'}
        description: Attributes associated with the credential. ExtendedTime is a standard attribute.
      AuthenticationProfile:
        type: array
        items: {$ref: '#/types/ReferenceToken'}
        description: Tokens of AuthenticationProfile items that override the ones in an AccessProfile or AccessPolicy
          when set.
      CredentialAccessProfile:
        type: array
        items: {$ref: '#/types/CredentialAccessProfile'}
        description: AccessProfile items associated with the credential.
      UserToken:
        $ref: '#/types/ReferenceToken'
        description: Identifies the User of the Credential. Optional for security and privacy reasons.
      Description: {type: string, description: Description of the Credential.}
      ValidFrom:
        type: string
        description: When the Credential starts to be valid. If null, there is no restriction (valid from whenever).
      ValidTo:
        type: string
        description: When the Credential stops being valid. If null, there is no restriction (valid forever).
  AuthenticationProfileInfo:
    type: object
    description: Information about an AuthenticationProfile.
    required: [token, Name]
    properties:
      token:
        $ref: '#/types/ReferenceToken'
        description: A service-unique identifier of the AuthenticationProfile.
      Name: {type: string, description: Name of the AuthenticationProfile.}
      Description: {type: string, description: Description of the AuthenticationProfile.}
  IdFactor:
    type: object
    description: An IdData name and the IdMatchOperator used to check it.
    required: [IdDataName, IdMatchOperatorName]
    properties:
      IdDataName: {type: string, description: The Name of an IdData field to check.}
      IdMatchOperatorName: {type: string, description: A Name of an existing IdMatchOperator.}
      OperatorValue: {type: string, description: Information for certain operators; typically empty.}
  AuthenticationProfile:
    type: object
    description: 'The authentication requirements: which IdFactor items are required at which schedules. Referenced
      by an AccessPoint and can be overridden in an AccessProfile and a Credential.'
    required: [Name]
    properties:
      token:
        $ref: '#/types/ReferenceToken'
        description: A service-unique identifier. May be omitted or empty when adding; the service then allocates
          a token.
      Name: {type: string, description: Name of the AuthenticationProfile.}
      Description: {type: string, description: Description of the AuthenticationProfile.}
      Schedule:
        type: array
        items: {$ref: '#/types/ReferenceToken'}
        description: Tokens of the Schedule items that determine when the AuthenticationProfile is applicable.
      IdFactor:
        type: array
        items: {$ref: '#/types/IdFactor'}
        description: The IdFactor items needed to authenticate. All must be provided, in this order.
  IdMatchOperator:
    type: object
    description: Determines how the IdData value in a request is evaluated. ONVIF defines mandatory operators; vendors
      may add more.
    required: [Name]
    properties:
      Name: {type: string, description: Name of the IdMatchOperator.}
      Description: {type: string, description: Description of the operator.}
  RuleOperator:
    type: object
    description: Determines how the IdData value in a request and other conditions are evaluated. ONVIF defines
      mandatory operators; vendors may add more.
    required: [Name]
    properties:
      Name: {type: string, description: Name of the RuleOperator.}
      Description: {type: string, description: Description of the operator.}
  AccessProfileInfo:
    type: object
    description: Information about an AccessProfile.
    required: [token, Name]
    properties:
      token:
        $ref: '#/types/ReferenceToken'
        description: A service-unique identifier of the AccessProfile.
      Name: {type: string, description: Name of the AccessProfile.}
      Description: {type: string, description: Description of the AccessProfile.}
  AccessPolicy:
    type: object
    description: Authentication and authorization requirements for one AccessPoint, used by an AccessProfile.
    properties:
      AccessPoint:
        $ref: '#/types/ReferenceToken'
        description: Reference to the AccessPoint this AccessPolicy applies to.
      AuthorizationProfile:
        type: array
        items: {$ref: '#/types/ReferenceToken'}
        description: Tokens of the AuthorizationProfile items that apply to this policy (a placeholder for future
          extensions).
      Attribute:
        type: array
        items: {$ref: '#/types/Attribute'}
        description: Optional attributes that apply to the AccessPolicy.
      Schedule:
        type: array
        items: {$ref: '#/types/ReferenceToken'}
        description: Tokens of the Schedule items when authorized by this AccessPolicy if the other conditions are
          met.
  AccessProfile:
    type: object
    description: Determines which resources can be accessed and when, through AccessPolicy items, and which authentication
      profiles apply.
    required: [Name]
    x-nullable: [ValidFrom, ValidTo]
    properties:
      token:
        $ref: '#/types/ReferenceToken'
        description: A service-unique identifier. May be omitted or empty when adding; the service then allocates
          a token.
      Name: {type: string, description: Name of the AccessProfile.}
      Description: {type: string, description: Description of the AccessProfile.}
      Schedule:
        type: array
        items: {$ref: '#/types/ReferenceToken'}
        description: Tokens of the Schedule items that determine when the AccessProfile is applicable.
      AuthenticationProfile:
        type: array
        items: {$ref: '#/types/ReferenceToken'}
        description: Tokens of the authentication profiles for this AccessProfile. Overrides the list in the AccessPoint,
          so it is typically empty.
      Attribute:
        type: array
        items: {$ref: '#/types/Attribute'}
        description: Attributes associated with the AccessProfile.
      AccessPolicy:
        type: array
        items: {$ref: '#/types/AccessPolicy'}
        description: The AccessPolicy items that are allowed.
      Enabled: {type: boolean, description: Whether the AccessProfile is enabled.}
      ValidFrom:
        type: string
        description: When the AccessProfile starts to be valid. If null, there is no restriction on the start time.
      ValidTo:
        type: string
        description: When the AccessProfile stops being valid. If null, there is no restriction on the stop time.
  AccessControllerConfiguration:
    type: object
    description: The device and hardware configuration for an AccessController.
    required: [token]
    properties:
      token:
        $ref: '#/types/ReferenceToken'
        description: AccessController Id to use for set, remove and usage.
      DeviceUUID: {type: string, description: The device the AccessController is on.}
      Configuration:
        type: array
        items: {$ref: '#/types/NameValue'}
        description: Configuration settings for the AccessController as name and value pairs.
  CredentialStatistics:
    type: object
    description: Statistics related to Credential items.
    properties:
      NumberOfCredentials: {type: integer, description: Number of Credential items in the system.}
      NumberOfDisabledCredentials: {type: integer, description: Number of disabled Credential items in the system.}
  AntipassbackData:
    type: object
    description: One anti-passback monitoring entry.
    required: [CredentialToken]
    properties:
      CredentialToken: {$ref: '#/types/ReferenceToken', description: The Credential.}
      PassOkThreshold:
        type: integer
        description: Anti-passback timer value. The unit is documented as seconds in the API section and microseconds
          in the guide.
      CurrentArea: {$ref: '#/types/ReferenceToken', description: The current area token.}
      ByTime:
        type: boolean
        description: 'The anti-passback mode: false means Logical, true means TimedLogical.'
      Violation:
        type: string
        description: Whether monitoring has resulted in one or more violations (shown as an empty string in the
          example).

operations:
  get_service_capabilities:
    summary: This operation returns the capabilities of the Access Control service.
    description: An ONVIF compliant device which provides the Access Control service shall implement this method.
    effect: read
    binding: {operation: 'tac:GetServiceCapabilities'}
    result:
      type: object
      required: [Capabilities]
      properties:
        Capabilities:
          $ref: '#/types/ServiceCapabilities'
          description: The capability response message contains the requested Access Control service capabilities
            using a hierarchical XML capability structure.
    access: anonymous
  get_access_point_info_list:
    summary: This operation requests a list of all `AccessPointInfo` items provided by the device.
    description: An ONVIF compliant device which provides the Access Control service shall implement this method.
      A call to this method shall return a `StartReference` when not all data is returned and more data is available.
      The reference shall be valid for retrieving the next set of data. See section Retrieving system configuration.
      The number of items returned shall not be greater than `Limit` parameter.
    effect: read
    binding: {operation: 'tac:GetAccessPointInfoList'}
    params:
      type: object
      properties:
        Limit:
          type: integer
          description: Maximum number of entries to return. If not specified, less than one or higher than what
            the device supports, the number of items is determined by the device.
        StartReference:
          type: string
          description: Start returning entries from this start reference. If not specified, entries shall start
            from the beginning of the dataset.
    result:
      type: object
      properties:
        NextStartReference:
          type: string
          description: StartReference to use in next call to get the following items. If absent, no more items to
            get.
        AccessPointInfo:
          type: array
          items: {$ref: '#/types/AccessPointInfo'}
          description: List of AccessPointInfo items.
    errors:
      ter:InvalidStartReference:
        description: StartReference is invalid or has timed out. Client needs to start fetching from the beginning.
        kind: invalid_argument
  get_access_point_info:
    summary: This operation requests a list of `AccessPointInfo` items matching the given tokens.
    description: An ONVIF compliant device which provides Access Control service shall implement this method. The
      device shall ignore tokens it cannot resolve and shall return an empty list if there are no items matching
      specified tokens. The device shall not return a fault in this case. If the number of requested items is greater
      than `MaxLimit`, a `TooManyItems` fault shall be returned.
    effect: read
    binding: {operation: 'tac:GetAccessPointInfo'}
    params:
      type: object
      required: [Token]
      properties:
        Token:
          type: array
          items: {$ref: '#/types/ReferenceToken'}
          description: Tokens of AccessPointInfo items to get.
          minItems: 1
    result:
      type: object
      properties:
        AccessPointInfo:
          type: array
          items: {$ref: '#/types/AccessPointInfo'}
          description: List of AccessPointInfo items.
    errors:
      ter:TooManyItems:
        description: Too many items were requested, see MaxLimit capability.
        kind: invalid_argument
  get_area_info_list:
    summary: This operation requests a list of all `AreaInfo` items provided by the device.
    description: An ONVIF compliant device which provides the Access Control service shall implement this method.
      A call to this method shall return a `StartReference` when not all data is returned and more data is available.
      The reference shall be valid for retrieving the next set of data. See section Retrieving system configuration.
      The number of items returned shall not be greater than `Limit` parameter.
    effect: read
    binding: {operation: 'tac:GetAreaInfoList'}
    params:
      type: object
      properties:
        Limit:
          type: integer
          description: Maximum number of entries to return. If not specified, less than one or higher than what
            the device supports, the number of items is determined by the device.
        StartReference:
          type: string
          description: Start returning entries from this start reference. If not specified, entries shall start
            from the beginning of the dataset.
    result:
      type: object
      properties:
        NextStartReference:
          type: string
          description: StartReference to use in next call to get the following items. If absent, no more items to
            get.
        AreaInfo:
          type: array
          items: {$ref: '#/types/AreaInfo'}
          description: List of AreaInfo items. xs:string NextStartReference [0][1] tac:AreaInfo AreaInfo [0][unbounded]
    errors:
      ter:InvalidStartReference:
        description: StartReference is invalid or has timed out. Client needs to start fetching from the beginning.
        kind: invalid_argument
  get_area_info:
    summary: This operation requests a list of `AreaInfo` items matching the given tokens.
    description: An ONVIF compliant device which provides Access Control service shall implement this method. The
      device shall ignore tokens it cannot resolve and shall return an empty list if there are no items matching
      specified tokens. The device shall not return a fault in this case. If the number of requested items is greater
      than `MaxLimit`, a `TooManyItems` fault shall be returned.
    effect: read
    binding: {operation: 'tac:GetAreaInfo'}
    params:
      type: object
      required: [Token]
      properties:
        Token:
          type: array
          items: {$ref: '#/types/ReferenceToken'}
          description: Tokens of AreaInfo items to get.
          minItems: 1
    result:
      type: object
      properties:
        AreaInfo:
          type: array
          items: {$ref: '#/types/AreaInfo'}
          description: List of AreaInfo items.
    errors:
      ter:TooManyItems:
        description: Too many items were requested, see MaxLimit capability.
        kind: invalid_argument
  get_access_point_state:
    summary: This operation requests the `AccessPointState` for the `AccessPoint` instance specified by token.
    description: An ONVIF compliant device that provides Access Control service shall implement this method.
    effect: read
    binding: {operation: 'tac:GetAccessPointState'}
    params:
      type: object
      required: [Token]
      properties:
        Token:
          $ref: '#/types/ReferenceToken'
          description: Token of AccessPoint instance to get AccessPointState for.
    result:
      type: object
      required: [AccessPointState]
      properties:
        AccessPointState: {$ref: '#/types/AccessPointState', description: AccessPointState item.}
    errors:
      ter:NotFound: {description: AccessPoint is not found., kind: not_found}
  enable_access_point:
    summary: This operation allows enabling an access point.
    description: A device that signals support for `DisableAccessPoint` capability for a particular `AccessPoint`
      instance shall implement this command.
    effect: write
    write: patch
    binding: {operation: 'tac:EnableAccessPoint'}
    params:
      type: object
      required: [Token]
      properties:
        Token: {$ref: '#/types/ReferenceToken', description: Token of the AccessPoint instance to enable.}
    errors:
      ter:NotFound: {description: The specified token is not found., kind: not_found}
      ter:NotSupported: {description: The operation is not supported., kind: unsupported}
  disable_access_point:
    summary: This operation allows disabling an access point.
    description: A device that signals support for `DisableAccessPoint` capability for a particular `AccessPoint`
      instance shall implement this command.
    effect: write
    write: patch
    binding: {operation: 'tac:DisableAccessPoint'}
    params:
      type: object
      required: [Token]
      properties:
        Token: {$ref: '#/types/ReferenceToken', description: Token of the AccessPoint instance to disable.}
    errors:
