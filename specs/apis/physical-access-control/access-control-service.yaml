          minItems: 1
    result:
      type: object
      properties:
        Credential:
          type: array
          items: {$ref: '#/types/Credential'}
          description: List of Credential items (as documented in the message table).
        Token:
          type: array
          items: {$ref: '#/types/ReferenceToken'}
          description: Tokens of the added or updated Credential items (as shown in the examples).
    errors:
      ter:InvalidCredentialFault: {description: Invalid credential., kind: invalid_argument}
    examples:
    - title: Set a credential
      request:
        params:
          Credential:
          - token: Axis-00408c184bdb:1351593020.016190000
            UserToken: user_token1
            Description: Credential description
            ValidFrom: '1997-01-01T00:00:00Z'
            ValidTo: '2038-01-01T00:00:00Z'
            Enabled: true
            Status: Enabled
            IdData:
            - {Name: Card, Value: '12345678'}
            - {Name: PIN, Value: '1234'}
            Attribute: []
            AuthenticationProfile: []
            CredentialAccessProfile:
            - ValidFrom: '1997-01-01T00:00:00Z'
              ValidTo: '2038-01-01T00:00:00Z'
              AccessProfile: Axis-00408c184bdb:1351591416.539133000
      source: https://developer.axis.com/vapix/physical-access-control/access-control-service/#setting-the-credential
    - title: Add a credential without a token
      request:
        params:
          Credential:
          - Enabled: true
            Status: Enabled
            IdData:
            - {Name: PIN, Value: '1234'}
            - {Name: CardNr, Value: '12345678'}
            CredentialAccessProfile: []
            UserToken: Axis-00408c184bd9:1350638010.566278000
      response:
        data: {Token: ['Axis-00408c184bd9:1350638011.004953000']}
      source: https://developer.axis.com/vapix/physical-access-control/system-integration-examples/
  remove_credential:
    summary: Remove the specified `Credential` items.
    effect: write
    write: delete
    binding: {operation: 'pacsaxis:RemoveCredential'}
    params:
      type: object
      required: [Token]
      properties:
        Token:
          type: array
          items: {$ref: '#/types/ReferenceToken'}
          description: Tokens of the Credential items to remove.
          minItems: 1
    errors:
      ter:NotFound: {description: Credential is not found., kind: not_found}
  get_access_profile_info_list:
    summary: This operation requests a list of all `AccessProfileInfo` items provided by the device.
    description: An ONVIF compliant device which provides the Access Control service shall implement this method.
      A call to this method shall return a `StartReference` when not all data is returned and more data is available.
      The reference shall be valid for retrieving the next set of data. See section Retrieving system configuration.
      The number of items returned shall not be greater than `Limit` parameter. This function is mandatory.
    effect: read
    binding: {operation: 'pacsaxis:GetAccessProfileInfoList'}
    params:
      type: object
      properties:
        Limit:
          type: integer
          description: Maximum number of entries to return. If not specified, less than one or higher than what
            the device supports, the number of items is determined by the device.
        StartReference:
          type: string
          description: Start returning entries from this start reference. If not specified, entries shall start
            from the beginning of the dataset.
    result:
      type: object
      properties:
        NextStartReference:
          type: string
          description: StartReference to use in next call to get the following items. If absent, no more items to
            get.
        AccessProfileInfo:
          type: array
          items: {$ref: '#/types/AccessProfileInfo'}
          description: List of AccessProfileInfo items.
    errors:
      ter:InvalidStartReference:
        description: StartReference is invalid or has timed out. Client needs to start fetching from the beginning.
        kind: invalid_argument
  get_access_profile_info:
    summary: This operation requests a list of `AccessProfileInfo` items matching the given tokens.
    description: This method shall be supported if the `GetAccessProfile` service capability is true. At least one
      token shall be specified. The device shall ignore tokens it cannot resolve and may return an empty list if
      there are no items matching specified tokens. If the number of requested items is greater than `MaxLimit`,
      a `TooManyItems` fault shall be returned.
    effect: read
    binding: {operation: 'pacsaxis:GetAccessProfileInfo'}
    params:
      type: object
      required: [Token]
      properties:
        Token:
          type: array
          items: {$ref: '#/types/ReferenceToken'}
          description: Tokens of AccessProfileInfo items to get.
          minItems: 1
    result:
      type: object
      properties:
        AccessProfileInfo:
          type: array
          items: {$ref: '#/types/AccessProfileInfo'}
          description: List of AccessProfileInfo items.
    errors:
      ter:TooManyItems:
        description: Too many items were requested, see MaxLimit capability.
        kind: invalid_argument
  get_access_profile_list:
    summary: This operation requests a list of all of `AccessProfile` items provided by the device.
    description: This function shall be implemented if the `GetAccessProfile` service capability is true. A call
      to this method shall return a `StartReference` when not all data is returned and more data is available. The
      reference shall be valid for retrieving the next set of data. See section Retrieving system configuration.
      The number of items returned shall not be greater than `Limit` parameter.
    effect: read
    binding: {operation: 'pacsaxis:GetAccessProfileList'}
    params:
      type: object
      properties:
        Limit:
          type: integer
          description: Maximum number of entries to return. If not specified, less than one or higher than what
            the device supports, the number of items is determined by the device.
        StartReference:
          type: string
          description: Start returning entries from this start reference. If not specified, entries shall start
            from the beginning of the dataset.
    result:
      type: object
      properties:
        NextStartReference:
          type: string
          description: StartReference to use in next call to get the following items. If absent, no more items to
            get.
        AccessProfile:
          type: array
          items: {$ref: '#/types/AccessProfile'}
          description: List of AccessProfile items.
    errors:
      ter:InvalidStartReference:
        description: StartReference is invalid or has timed out. Client needs to start fetching from the beginning.
        kind: invalid_argument
  get_access_profile:
    summary: This operation requests a list of `AccessProfile` items matching the given tokens.
    description: This method shall be supported if the `GetAccessProfile` service capability is true. At least one
      token shall be specified. The device shall ignore tokens it cannot resolve and may return an empty list if
      there are no items matching specified tokens. If the number of requested items is greater than `MaxLimit`,
      a `TooManyItems` fault shall be returned.
    effect: read
    binding: {operation: 'pacsaxis:GetAccessProfile'}
    params:
      type: object
      required: [Token]
      properties:
        Token:
          type: array
          items: {$ref: '#/types/ReferenceToken'}
          description: Tokens of AccessProfile items to get.
          minItems: 1
    result:
      type: object
      properties:
        AccessProfile:
          type: array
          items: {$ref: '#/types/AccessProfile'}
          description: List of AccessProfile items.
    errors:
      ter:TooManyItems:
        description: Too many items were requested, see MaxLimit capability.
        kind: invalid_argument
  set_access_profile:
    summary: Add/update a list of `AccessProfile` items.
    description: If `AccessProfile` items with the specified tokens already exist, they will be updated. If not,
      they shall be added. If the `Token` field of any `AccessProfile` is empty, the service shall allocate a token
      for the `AccessProfile`. All tokens shall be returned in the response.
    effect: write
    write: replace
    binding: {operation: 'pacsaxis:SetAccessProfile'}
    params:
      type: object
      required: [AccessProfile]
      properties:
        AccessProfile:
          type: array
          items: {$ref: '#/types/AccessProfile'}
          description: The AccessProfile items to add/update.
          minItems: 1
    result:
      type: object
      properties:
        Token:
          type: array
          items: {$ref: '#/types/ReferenceToken'}
          description: Tokens of the added/updated AccessProfile items.
    errors:
      ter:InvalidAccessProfileFault: {description: Invalid access profile., kind: invalid_argument}
    examples:
    - title: Set an access profile
      request:
        params:
          AccessProfile:
          - token: Axis-00408c184bdb:1351591416.539133000
            Name: AccessProfile1
            Description: AccessProfile description
            Enabled: true
            Schedule: [standard_always]
            ValidFrom: '1997-01-01T00:00:00Z'
            ValidTo: '2038-01-01T00:00:00Z'
            AuthenticationProfile: []
            AccessPolicy:
            - AccessPoint: Axis-00408c184bdb:1351589192.102223000
              AuthorizationProfile: []
              Attribute: []
              Schedule: [standard_always]
      source: https://developer.axis.com/vapix/physical-access-control/access-control-service/#setting-the-access-profile
  remove_access_profile:
    summary: Remove the specified `AccessProfile` items.
    effect: write
    write: delete
    binding: {operation: 'pacsaxis:RemoveAccessProfile'}
    params:
      type: object
      required: [Token]
      properties:
        Token:
          type: array
          items: {$ref: '#/types/ReferenceToken'}
          description: Tokens of the AccessProfile items to remove.
          minItems: 1
    errors:
      ter:NotFound: {description: AccessProfile is not found., kind: not_found}
  get_authentication_profile_info_list:
    summary: This operation requests a list of all `AuthenticationProfileInfo` items provided by the device.
    description: An ONVIF compliant device which provides the Access Control service shall implement this method.
      A call to this method shall return a `StartReference` when not all data is returned and more data is available.
      The reference shall be valid for retrieving the next set of data. See section Retrieving system configuration.
      The number of items returned shall not be greater than `Limit` parameter.
    effect: read
    binding: {operation: 'tac:GetAuthenticationProfileInfoList'}
    params:
      type: object
      properties:
        Limit:
          type: integer
          description: Maximum number of entries to return. If not specified, less than one or higher than what
            the device supports, the number of items is determined by the device.
        StartReference:
          type: string
          description: Start returning entries from this start reference. If not specified, entries shall start
            from the beginning of the dataset.
    result:
      type: object
      properties:
        NextStartReference:
          type: string
          description: StartReference to use in next call to get the following items. If absent, no more items to
            get.
        AuthenticationProfileInfo:
          type: array
          items: {$ref: '#/types/AuthenticationProfileInfo'}
          description: List of AuthenticationProfileInfo items.
    errors:
      ter:InvalidStartReference:
        description: StartReference is invalid or has timed out. Client needs to start fetching from the beginning.
        kind: invalid_argument
  get_authentication_profile_info:
    summary: This operation requests a list of `AuthenticationProfileInfo` items matching the given tokens.
    description: An ONVIF compliant device which provides Access Control service shall implement this method. The
      device shall ignore tokens it cannot resolve and shall return an empty list if there are no items matching
      specified tokens. The device shall not return a fault in this case. If the number of requested items is greater
      than `MaxLimit`, a `TooManyItems` fault shall be returned.
    effect: read
    binding: {operation: 'tac:GetAuthenticationProfileInfo'}
    params:
      type: object
      required: [Token]
      properties:
        Token:
          type: array
          items: {$ref: '#/types/ReferenceToken'}
          description: Tokens of AuthenticationProfileInfo items to get.
          minItems: 1
    result:
      type: object
      properties:
        AuthenticationProfileInfo:
          type: array
          items: {$ref: '#/types/AuthenticationProfileInfo'}
          description: List of AuthenticationProfileInfo items.
    errors:
      ter:TooManyItems:
        description: Too many items were requested, see MaxLimit capability.
        kind: invalid_argument
  get_authentication_profile_list:
    summary: This operation requests a list of all `AuthenticationProfile` items provided by the device.
    description: An ONVIF compliant device which provides the Access Control service shall implement this method.
      A call to this method shall return a `StartReference` when not all data is returned and more data is available.
      The reference shall be valid for retrieving the next set of data. See section Retrieving system configuration.
      The number of items returned shall not be greater than `Limit` parameter.
    effect: read
    binding: {operation: 'tac:GetAuthenticationProfileList'}
    params:
      type: object
      properties:
        Limit:
          type: integer
          description: Maximum number of entries to return. If not specified, less than one or higher than what
            the device supports, the number of items is determined by the device.
        StartReference:
          type: string
          description: Start returning entries from this start reference. If not specified, entries shall start
            from the beginning of the dataset.
    result:
      type: object
      properties:
        NextStartReference:
          type: string
          description: StartReference to use in next call to get the following items. If absent, no more items to
            get.
        AuthenticationProfile:
          type: array
          items: {$ref: '#/types/AuthenticationProfile'}
          description: List of AuthenticationProfile items.
    errors:
      ter:InvalidStartReference:
        description: StartReference is invalid or has timed out. Client needs to start fetching from the beginning.
        kind: invalid_argument
    examples:
    - title: List the default authentication profiles
      request:
        params: {}
      response:
        data:
          AuthenticationProfile:
          - token: CardOnly
            Name: CardOnly
            Description: Card only
            IdFactor:
            - {IdDataName: Card, IdMatchOperatorName: IdDataEqual, OperatorValue: ''}
            Schedule: [standard_always]
          - token: PINOnly
            Name: PINOnly
            Description: PIN only
            IdFactor:
            - {IdDataName: PIN, IdMatchOperatorName: IdDataEqual, OperatorValue: ''}
            Schedule: [standard_always]
          - token: CardPlusPin
            Name: CardPlusPin
            Description: Card + PIN
            IdFactor:
            - {IdDataName: Card, IdMatchOperatorName: IdDataEqual, OperatorValue: ''}
            - {IdDataName: PIN, IdMatchOperatorName: IdDataEqual, OperatorValue: ''}
            Schedule: [standard_always]
          - token: REXOnly
            Name: REXOnly
            Description: REX only
            IdFactor:
            - {IdDataName: REX, IdMatchOperatorName: OperatorValueEqual, OperatorValue: Active}
            Schedule: [standard_always]
      source: https://developer.axis.com/vapix/physical-access-control/access-control-service/#retrieve-default-configuration
  get_authentication_profile:
    summary: This operation requests a list of `AuthenticationProfile` items matching the given tokens.
    description: An ONVIF compliant device which provides Access Control service shall implement this method. The
      device shall ignore tokens it cannot resolve and shall return an empty list if there are no items matching
      specified tokens. The device shall not return a fault in this case. If the number of requested items is greater
      than `MaxLimit`, a `TooManyItems` fault shall be returned.
    effect: read
    binding: {operation: 'tac:GetAuthenticationProfile'}
    params:
      type: object
      required: [Token]
      properties:
        Token:
          type: array
          items: {$ref: '#/types/ReferenceToken'}
          description: Tokens of AuthenticationProfile items to get.
          minItems: 1
    result:
      type: object
      properties:
        AuthenticationProfile:
          type: array
          items: {$ref: '#/types/AuthenticationProfile'}
          description: List of AuthenticationProfile items.
    errors:
      ter:TooManyItems:
        description: Too many items were requested, see MaxLimit capability.
        kind: invalid_argument
  set_authentication_profile:
    summary: Set (adds or modifies) the supplied list of `AuthenticationProfile` items to the internal storage/database.
    description: If the token attribute is empty, a new unique token will be generated by the service. All supplied
      and generated tokens are returned.
    effect: write
    write: replace
    binding: {operation: 'tac:SetAuthenticationProfile'}
    params:
      type: object
      required: [AuthenticationProfile]
      properties:
        AuthenticationProfile:
          type: array
          items: {$ref: '#/types/AuthenticationProfile'}
          description: List of AuthenticationProfile items to set.
          minItems: 1
    result:
      type: object
      properties:
        Token:
          type: array
          items: {$ref: '#/types/ReferenceToken'}
          description: List of supplied and generated tokens
  remove_authentication_profile:
    summary: Remove the specified `AuthenticationProfile` items.
    effect: write
    write: delete
    binding: {operation: 'tac:RemoveAuthenticationProfile'}
    params:
      type: object
      properties:
        Token:
          type: array
          items: {$ref: '#/types/ReferenceToken'}
          description: List of tokens for the AuthenticationProfile items to remove If list is empty, no profiles
            will be removed.
    errors:
      ter:NotFound: {description: AuthenticationProfile is not found., kind: not_found}
  get_id_match_operators:
    summary: Returns the `IdMatchOperator` items supported by the service.
    effect: read
    binding: {operation: 'pacsaxis:GetIdMatchOperators'}
    result:
      type: object
      properties:
        IdMatchOperator:
          type: array
          items: {$ref: '#/types/IdMatchOperator'}
          description: List of supported IdMatchOperator items.
  get_rule_operators:
    summary: Returns the `RuleOperator` items supported by the service.
    effect: read
    binding: {operation: 'pacsaxis:GetRuleOperators'}
    result:
      type: object
      properties:
        RuleOperator:
          type: array
          items: {$ref: '#/types/RuleOperator'}
          description: List of supported RuleOperator items.
  get_access_controller_configuration_list:
    summary: This operation requests a list of all of `AccessControllerConfiguration` items provided by the device.
    effect: read
    binding: {operation: 'pacsaxis:GetAccessControllerConfigurationList'}
    params:
      type: object
      properties:
        Limit:
          type: integer
          description: Maximum number of entries to return. If not specified, or higher than what the device supports,
            the number of items shall be determined by the device.
        StartReference:
          type: string
          description: Start returning entries from this start reference. If not specified, entries shall start
            from the beginning of the dataset.
    result:
      type: object
      properties:
        NextStartReference:
          type: string
          description: StartReference to use in next call to get the following items. If absent, no more items to
            get.
        AccessControllerConfiguration:
          type: array
          items: {$ref: '#/types/AccessControllerConfiguration'}
          description: List of AccessControllerConfiguration items.
    errors:
      ter:InvalidStartReference:
        description: StartReference is invalid or has timed out. Client need to start fetching from the beginning.
        kind: invalid_argument
    examples:
    - title: Get the default access controller configuration
      request:
        params: {}
      response:
        data:
          AccessControllerConfiguration:
          - token: Axis-00408c184bdb AccessController
            DeviceUUID: 5581ad80-95b0-11e0-b883-00408c184bdb
            Configuration: []
      source: https://developer.axis.com/vapix/physical-access-control/access-control-service/#retrieve-default-configuration
  get_access_controller_configuration:
    summary: This operation request a list of `AccessControllerConfiguration` items matching the given tokens.
    description: The device shall ignore tokens it cannot resolve and may return an empty list if there are no items
      matching specified tokens. If the number of requested items is greater than the max limit supported, a `TooManyItems`
      fault shall be returned
    effect: read
    binding: {operation: 'pacsaxis:GetAccessControllerConfiguration'}
    params:
      type: object
      required: [Token]
      properties:
        Token:
          type: array
          items: {$ref: '#/types/ReferenceToken'}
          description: Tokens of AccessControllerConfiguration items to get.
          minItems: 1
    result:
      type: object
      properties:
        AccessControllerConfiguration:
          type: array
          items: {$ref: '#/types/AccessControllerConfiguration'}
          description: List of AccessControllerConfiguration items.
    errors:
      ter:TooManyItems:
        description: Too many items were requested, see MaxLimit capability.
        kind: invalid_argument
  set_access_controller_configuration:
    summary: Add/update a list of `AccessControllerConfiguration` items.
    description: If `AccessController` items with the specified tokens already exist, they will be updated. If not,
      they will be added. If the `Token` field of any `AccessController` is empty, the service will allocate a token
      for the `AccessController`. All tokens are returned in the response.
    effect: write
    write: replace
    binding: {operation: 'pacsaxis:SetAccessControllerConfiguration'}
    params:
      type: object
      required: [AccessControllerConfiguration]
      properties:
        AccessControllerConfiguration:
          type: array
          items: {$ref: '#/types/AccessControllerConfiguration'}
          description: The AccessControllerConfiguration items to add/update.
          minItems: 1
    result:
      type: object
      properties:
        Token:
          type: array
          items: {$ref: '#/types/ReferenceToken'}
          description: The tokens of the added/updated AccessController items.
    errors:
      ter:InvalidArgs: {description: Invalid arguments., kind: invalid_argument}
      ter:NotAllowed: {description: The operation is not allowed., kind: access_denied}
  remove_access_controller_configuration:
    summary: Remove the specified `AccessControllerConfiguration` items.
    effect: write
    write: delete
    binding: {operation: 'pacsaxis:RemoveAccessControllerConfiguration'}
    params:
      type: object
      required: [Token]
      properties:
        Token:
          type: array
          items: {$ref: '#/types/ReferenceToken'}
          description: Tokens of AccessControllerConfiguration items to get.
          minItems: 1
    errors:
      ter:NotFound: {description: AccessController not found., kind: not_found}
  get_credential_statistics:
    summary: Get statistics related to the `Credential` items in the system.
    effect: read
    binding: {operation: 'pacsaxis:GetCredentialStatistics'}
    result:
      type: object
      required: [CredentialStatistics]
      properties:
        CredentialStatistics: {$ref: '#/types/CredentialStatistics'}
  get_master_db_state:
    summary: Returns the current state of the `MasterDB`.
    effect: read
    binding: {operation: 'pacsaxis:GetMasterDBState'}
    result:
      type: object
      required: [NbrTotalPages, NbrFreePages, SizeOnDisk]
      properties:
        NbrTotalPages: {type: integer, description: Number of total pages in the database.}
        NbrFreePages: {type: integer, description: Number of free pages in the database.}
        SizeOnDisk: {type: integer, description: Number of bytes the database occupies on disk.}
  re_open_master_db:
    summary: 'Reopens the `MasterDB`, optionally: \* deleting the current database \* opening the new one in a specified
      path and \* enabling encryption with a specific key.'
    effect: action
    binding: {operation: 'pacsaxis:ReOpenMasterDB'}
    result:
      type: object
      required: [NbrTotalPages, NbrFreePages, SizeOnDisk]
      properties:
        NbrTotalPages: {type: integer, description: Number of total pages in the database.}
        NbrFreePages: {type: integer, description: Number of free pages in the database.}
        SizeOnDisk: {type: integer, description: Number of bytes the database occupies on disk.}
  reset_antipassback_violation:
    summary: Reset anti-passback for the specified credential(s).
    description: If the credential is currently not in anti-passback violation, nothing happens.
    effect: action
    binding: {operation: 'pacsaxis:ResetAntipassbackViolation'}
    params:
      type: object
      required: [CredentialToken]
      properties:
        CredentialToken: {$ref: '#/types/ReferenceToken', description: Token of Credential}
    errors:
      ter:NotFound: {description: Credential token, kind: not_found}
  reset_all_antipassback_violations:
    summary: Reset anti-passback for all credentials.
    effect: action
    binding: {operation: 'pacsaxis:ResetAllAntipassbackViolations'}
  get_antipassback_data_list:
    summary: This operation requests a list of all of `AntipassbackData` items provided by the device.
    effect: read
    binding: {operation: 'pacsaxis:GetAntipassbackDataList'}
    params:
      type: object
      properties:
        Limit:
          type: integer
          description: Maximum number of entries to return. If not specified, or greater than the device supports,
            the number of items shall be determined by the device.
        StartReference:
          type: string
          description: Start returning entries from this start reference. If not specified, entries shall start
            from the beginning of the dataset.
    result:
      type: object
      properties:
        NextStartReference:
          type: string
          description: StartReference to use in next call to get the following items. If absent, no more items to
            get.
        AntipassbackData:
          type: array
          items: {$ref: '#/types/AntipassbackData'}
          description: List of AntipassbackData items.
    errors:
      ter:InvalidStartReference:
        description: StartReference is invalid or has timed out. Client needs to start fetching from the beginning.
        kind: invalid_argument
  set_antipassback_data:
    summary: set_antipassback_data
    effect: write
    write: replace
    binding: {operation: 'pacsaxis:SetAntipassbackData'}
    params:
      type: object
      required: [AntipassbackData]
      properties:
        AntipassbackData:
          type: array
          items: {$ref: '#/types/AntipassbackData'}
          description: List of AntipassbackData to set
          minItems: 1

