provenance:
  completeness: complete
  open_questions:
    - "No discovery probe: the docs only say the service is found through the entry service's GetServices (SOAP), which is not a supported discovery entry."
    - 'The ScheduleStatusReport example sends no Token, and the guide describes it as a report for all schedules, but the message table makes Token mandatory ([1][unbounded]). The table wins here, so the example is skipped; the device apparently accepts omission, which would make Token optional.'
    - 'The encoding of ServiceCapabilities.Component (a list of supported iCalendar components) is not documented; it is left untyped.'
    - 'The Interval and Pulse notification topics are spelled `tns1:Schedule/Interval` and `tns1:Schedule/Pulse` on the service page but `tns1:Schedule/tnsaxis:Interval` and `tns1:Schedule/tnsaxis:Pulse` in the event logger notification topics table.'
    - 'One JSON example in the system integration examples page uses the key `axschSetSchedule` (missing colon; presumably `axsch:SetSchedule`).'
    - The docs do not say which Schedule fields are always returned, so only token (and Token, Active and Exception of a status) are required in responses. The InitializationDone data structure (a device UUID token) belongs to an event and is not modelled.
    - The ONVIF access classes are not mapped to a VAPIX role; the API default admin is kept, except GetServiceCapabilities (PRE_AUTH), which is anonymous. ScheduleActive and ScheduleStatusReport have class ACTUATE but only read state.
  migrated_from: v1
  curated: true
