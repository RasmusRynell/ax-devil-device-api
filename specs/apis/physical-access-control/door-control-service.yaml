provenance:
  completeness: complete
  open_questions:
  - The access classes (PRE_AUTH, READ_SYSTEM, READ_SYSTEM_SENSITIVE, ACTUATE, WRITE_SYSTEM) are not mapped to VAPIX
    roles. GetServiceCapabilities is access anonymous and sent with
    auth if_challenged, so credentials go out only when the device asks for them; the API default admin is kept
    for the rest, which are sent with credentials from the first request.
  - The Extension request members (future extensions, types not defined on any page) are not modelled.
  - The fields of DoorCapabilities, ServiceCapabilities and DoorState are not shown in any JSON example; their JSON
    types follow the ONVIF definitions. Capability fields are therefore optional.
  - The Door table lists AccessTime, OpenTooLongTime, PreAlarmTime, ExtendedAccessTime, ExtendedOpenTooLongTime,
    HeartbeatInterval, PriorityConfiguration and DefaultPriority as available fields, but examples omit several
    of them, so only token and Name are required. Their durations are untyped in the table; examples use ISO 8601
    durations.
  - The commands document the tdc/axtdc namespaces differently from the section the data structure is in (GetDoorList
    returns tdc:Door, documented as axtdc:Door); mapped by local name.
  - UnlockDoor and ReleaseDoor examples show the follow-up GetDoorPriorityState response next to the request; the
    command responses are empty, so the examples use an empty response.
  - The ter:InvalidArgs fault of SetPriorityConfiguration is documented as 'The specified token is not found'.
  - SetDoor, SetDoorConfiguration, SetDoorScheduleConfiguration and SetPriorityConfiguration are documented as setting
    'the new version' (and unspecified configuration options become defaults), so they are marked replace.
  - The SetDoorConfiguration system-integration JSON examples omit token (the XML has token=""), so token is optional
    on DoorConfiguration; one example had the typo Lock.{LockWhenDoorOpens, corrected.
  migrated_from: v1
  curated: true
