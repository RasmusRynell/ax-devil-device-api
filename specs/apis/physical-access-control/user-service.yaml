provenance:
  completeness: complete
  open_questions:
    - 'The message tables say GetUserInfoResponse and GetUserListResponse "shall be empty"; this is taken as a copy-paste error and the responses are modelled as UserInfo and User lists, like GetUserInfoListResponse and GetUserResponse. GetUserList is also assumed to return NextStartReference.'
    - 'The tables name the MaxLimit capability a "GetList" limit and give no type; it is modelled as an integer. Because the capabilities are extendable and MaxLimit is not marked optional or required, it is left optional.'
    - 'Only the fields the docs list apart from "optional fields" (token, Name) are required in responses. The User Extension field ("for future extension") is not modelled, and the type of the Attribute `type` field is only shown as `string`.'
    - The ONVIF access classes are not mapped to a VAPIX role; the API default admin is kept, except GetServiceCapabilities (PRE_AUTH), which is anonymous.
    - ter:NotAllowed and ter:ActionNotSupported have no description in the docs.
  migrated_from: v1
  curated: true
