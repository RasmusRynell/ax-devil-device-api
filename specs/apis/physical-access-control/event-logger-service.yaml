provenance:
  completeness: partial
  open_questions:
    - "No discovery probe: the docs only say the service is found through the entry service's GetServices (SOAP), which is not a supported discovery entry."
    - 'FetchEvents2 and FetchAlarms2 are described only in the guide, not in the API specification. Their parameters are those of FetchEvents plus FilterSets, and the response shape is assumed to be the same.'
    - 'The GetEventDistributionConfig message table puts EventDistributionConfig in the request and leaves the response empty; the guide shows it in the response (as an array) and says the call takes no arguments. The guide wins.'
    - 'The FetchEvents "response" JSON example filters with `{"topic0": "AccessControl"}`; the filter structure and its XML form are Key and Value, so the example is corrected to `{Key: topic0, Value: AccessControl}`.'
    - 'The RemoveLoggedAlarm example carried a response with EventDistributionConfig in the migrated spec; the docs say the response is empty and no response is kept.'
    - 'GetIgnoreFilterList has access class WRITE_SYSTEM (GetAlarmFilterList is READ_SYSTEM_SENSITIVE); probably a doc slip. The ONVIF access classes are not mapped to a VAPIX role; the API default admin is kept, except GetServiceCapabilities (PRE_AUTH), which is anonymous.'
    - 'The ServiceCapabilities description of EnableGlobalEvents names the operations EnableGlobalEvents and DisableGlobalEvents, while the operations are EnableGlobalDistribution and DisableGlobalDistribution.'
    - Most field types of the event structures (rowid, UtcTime, Tags) are not given and come from the examples, and none of the FetchedEvent fields is marked as always present. The stored-event structures (LoggedEvent, LoggedAlarm, Declaration, DeclKeyValue, KeyValue, LocalSetting, Configuration) are not used by any operation and are not modelled.
    - Events are also delivered through ONVIF pull-point subscriptions and notification topics; those are not part of this API.
  migrated_from: v1
  curated: true
