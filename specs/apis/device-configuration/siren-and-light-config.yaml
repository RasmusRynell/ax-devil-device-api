sources:
- url: https://developer.axis.com/vapix/device-configuration/siren-and-light-api/
  sha256_md: 9fd3d572512beffe9c37ee6df923f71a89cdd2216c40b6bd0260ac59f4b5cdbc
  retrieved_at: '2026-10-11'
provenance:
  completeness: complete
  open_questions:
  - The docs example 'Update intensity of a function in a profile' sends PATCH /profiles/Test/functions/SignalingLED with
    a bare number, which is not a documented endpoint (the intensity property is /profiles/{profile}/functions/{function}/intensity).
    Not modelled as an example.
  - The docs example for beam shape support uses GET /functions/{function}/beamShape/beamShape_supported, but the API definition
    puts beamShape_supported on the function entity. Not modelled.
  - Per-property GET endpoints are only modelled where the docs exemplify them (maintenance mode supported/running, healthCheckSupported,
    beamShape default); other entity getters return the same data.
  - The docs patterns for NameString and DescriptionString use lookarounds (no leading or trailing space), which the Python regex engine used by the models does not support. They are rewritten as an equivalent pattern without lookarounds; the docs character class also has an escaped bracket sequence that is read as the characters [, ] and ^.
  - The docs example 'Add a function to the profile' uses the pattern name 'steady' while the pattern list shows 'Steady'.
  migrated_from: v1
  curated: true
