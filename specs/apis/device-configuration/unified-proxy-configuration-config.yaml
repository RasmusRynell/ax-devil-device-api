provenance:
  completeness: partial
  open_questions:
  - The docs list globalHttpProxy, globalHttpsProxy and globalNoProxyList only in the structure tree, the root SET fields and the use cases; there are no property definitions (datatype, permissions, nullability). Types are inferred from the examples and permissions are assumed to be admin.
  - The proxy URL format and validation rules are not documented.
  - The discovery id uses version v1 in the dca entry, but the documented REST root is v1beta; v1beta is assumed to be the version the device reports.
  migrated_from: v1
  curated: true
