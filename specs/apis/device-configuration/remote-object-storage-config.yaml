# Migrated from the v1 corpus by codegen/migrate_v1.py; not yet curated.
format: 2
id: remote-object-storage-config
name: Remote object storage
summary: The VAPIX® Remote Object Storage API makes it possible for the client to configure storage of recordings
  on a remote object store.
section: device-configuration
family: dca
status: released
python:
  module: remote_object_storage
  class: RemoteObjectStorage
docs:
- https://developer.axis.com/vapix/device-configuration/remote-object-storage-api/
access: admin
discovery:
- dca: {api: remote-object-storage, version: v1}

binding: {root: /config/rest/remote-object-storage/v1}

types:
  AuthorizationServer: {}
  AzureDestination:
    type: object
    properties:
      accountName: {type: string}
      container: {type: string}
      sas: {type: string}
      sharedKey: {type: string}
      url: {type: string}
  ClientAuthenticationMethod: {}
  DiskIdString:
    type: string
    minLength: 1
    maxLength: 50
    pattern: ^[a-zA-Z0-9_-]+$
    description: The disk ID.
  FailoverConfiguration:
    type: object
    description: Configuration for local failover storage, used to temporarily store objects that can't be uploaded
      to the remote object store. When set to null, failover is disabled.
    x-nullable: [diskId, storageLimit, uploadLimit]
    properties:
      diskId:
        $ref: '#/types/DiskIdString'
        description: 'The ID of the disk to store objects for failover in `MANUAL` mode, where it must be explicitly
          set. Default: null (not configured).'
      diskSelection:
        $ref: '#/types/FailoverDiskSelection'
        description: 'The failover disk selection mode. Default: `AUTO`.'
      storageLimit:
        $ref: '#/types/PositiveInteger'
        description: 'The maximum failover storage size, in kibibytes (KiB). Only applies in `MANUAL` mode. Default:
          null (unlimited).'
      uploadLimit:
        $ref: '#/types/PositiveInteger'
        description: 'The maximum upload bandwidth for objects stored in failover, in kbit/s. Default: null (unlimited).'
  FailoverDiskSelection: {type: string, enum: [AUTO, MANUAL], description: Failover disk selection mode.}
  IdString:
    type: string
    minLength: 1
    maxLength: 50
    pattern: ^[a-zA-Z0-9_]+$
    description: The ID for a destination
  PositiveInteger: {type: integer, minimum: 1, description: Positive integer value.}
  S3Destination:
    type: object
    properties:
      accessKeyId: {type: string}
      bucket: {type: string}
      region: {type: string}
      secretAccessKey: {type: string}
      sessionToken: {type: string}
      url: {type: string}
  RemoteObjectStorage:
    type: object
    description: The whole API tree.
    x-nullable: [failover]
    properties:
      failover:
        $ref: '#/types/FailoverConfiguration'
        description: Failover configuration. Defaults to `AUTO` disk selection when not explicitly set. Set to `null`
          to disable. See Failover configuration.
      destinations:
        type: array
        items: {$ref: '#/types/Destination'}
  Destination:
    type: object
    description: Destination collection
    x-nullable: [authorizationServer, azure, s3]
    properties:
      authorizationServer: {$ref: '#/types/AuthorizationServer', description: Authorization server configuration}
      azure: {$ref: '#/types/AzureDestination', description: Azure related settings}
      description: {type: string, description: Description of the destination}
      id: {$ref: '#/types/IdString', description: ID of the destination}
      s3: {$ref: '#/types/S3Destination', description: S3 related settings}
  AddDestinationRequest:
    type: object
    description: Arguments of ``add_destination``.
    required: [id]
    properties:
      id: {$ref: '#/types/IdString', description: ID of the destination}
      description: {type: string, description: Description of the destination}
      authorizationServer: {$ref: '#/types/AuthorizationServer', description: Authorization server configuration}
      azure: {$ref: '#/types/AzureDestination', description: Azure related settings}
      s3: {$ref: '#/types/S3Destination', description: S3 related settings}

operations:
  get_all:
    summary: All data of the Remote object storage API.
    effect: read
    binding: {method: GET, path: ''}
    result: {$ref: '#/types/RemoteObjectStorage'}
  set_failover:
    summary: Set the failover of the device.
    effect: write
    write: patch
    binding: {method: PATCH, path: /failover, body_field: failover, body: value}
    params:
      type: object
      required: [failover]
      properties:
        failover:
          $ref: '#/types/FailoverConfiguration'
          description: Failover configuration. Defaults to `AUTO` disk selection when not explicitly set. Set to
            `null` to disable. See Failover configuration.
  list_destinations:
    summary: List the destinations.
    effect: read
    binding: {method: GET, path: /destinations}
    result:
      type: array
      items: {$ref: '#/types/Destination'}
    examples:
    - title: Get all destinations
      request: {path: /destinations}
      response:
        status: 200
        body:
          status: success
          data:
          - id: aws1
            description: My S3 Destination
            s3:
              accessKeyId: '*****'
              secretAccessKey: '*****'
              sessionToken: '*****'
              region: us-east-1
              url: some.domain/some/url
              bucket: someBucket
          - id: azure1
            description: My Azure Destination
            azure:
              accountName: someAccountName
              sharedKey: '*****'
              sas: ''
              url: some.domain/some/url
              container: somecontainer
      source: https://developer.axis.com/vapix/device-configuration/remote-object-storage-api/
  get_destination:
    summary: Get one destination.
    effect: read
    binding: {method: GET, path: '/destinations/{ID}'}
    params:
      type: object
      x-name: DestinationIDRequest
      required: [ID]
      properties:
        ID: {type: string}
    result: {$ref: '#/types/Destination'}
    examples:
    - title: Update a storage destination
      request:
        path: /destinations/myDestination
        body:
          data:
            azure: {sas: newToken}
      response:
        status: 200
        body: {status: success}
      source: https://developer.axis.com/vapix/device-configuration/remote-object-storage-api/
  add_destination:
    summary: Add a destination.
    effect: write
    write: create
    binding: {method: POST, path: /destinations, body: object}
    params: {$ref: '#/types/AddDestinationRequest'}
    examples:
    - title: Add a new storage destination
      request:
        path: /destinations
        body:
          data:
            id: myDestination
            description: azure destination
            azure:
              accountName: someAccountName
              container: acontainer
              sharedKey: bXlwYXNzd29yZA==
              url: some.domain/example/url
      response:
        status: 201
        body: {status: success}
      source: https://developer.axis.com/vapix/device-configuration/remote-object-storage-api/
    - title: Add a new storage destination with external authorization
      request:
        path: /destinations
        body:
          data:
            id: myDestination2
            description: azure destination with authorization
            azure: {accountName: someAccountName, container: acontainer, url: some.domain/example/url}
            authorizationServer:
              clientAuthenticationMethod: private_key_jwt
              clientId: myClientId
              tokenEndpoint: some.domain/token/endpoint
      response:
        status: 201
        body: {status: success}
      source: https://developer.axis.com/vapix/device-configuration/remote-object-storage-api/
  remove_destination:
    summary: Remove a destination.
    effect: write
    write: delete
    binding: {method: DELETE, path: '/destinations/{ID}'}
    params:
      type: object
      x-name: DestinationIDRequest
      required: [ID]
      properties:
        ID: {type: string}
    examples:
    - title: Delete a storage destination
      request: {path: /destinations/myDestination}
      response:
        status: 200
        body: {status: success}
      source: https://developer.axis.com/vapix/device-configuration/remote-object-storage-api/
  set_destination_authorization_server:
    summary: Set the authorization server of a destination.
    effect: write
    write: patch
    binding:
      method: PATCH
      path: /destinations/{ID}/authorizationServer
      body_field: authorizationServer
      body: value
    params:
      type: object
      required: [ID, authorizationServer]
      properties:
        ID: {type: string}
        authorizationServer: {$ref: '#/types/AuthorizationServer', description: Authorization server configuration}
  set_destination_azure:
    summary: Set the azure of a destination.
    effect: write
    write: patch
    binding: {method: PATCH, path: '/destinations/{ID}/azure', body_field: azure, body: value}
    params:
      type: object
      required: [ID, azure]
      properties:
        ID: {type: string}
        azure: {$ref: '#/types/AzureDestination', description: Azure related settings}
  set_destination_description:
    summary: Set the description of a destination.
    effect: write
    write: patch
    binding:
      method: PATCH
      path: /destinations/{ID}/description
      body_field: description
      body: value
    params:
      type: object
      required: [ID, description]
      properties:
        ID: {type: string}
        description: {type: string, description: Description of the destination}
  set_destination_s3:
    summary: Set the s3 of a destination.
    effect: write
    write: patch
    binding: {method: PATCH, path: '/destinations/{ID}/s3', body_field: s3, body: value}
    params:
      type: object
      required: [ID, s3]
      properties:
        ID: {type: string}
        s3: {$ref: '#/types/S3Destination', description: S3 related settings}

