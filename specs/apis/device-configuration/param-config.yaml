# Migrated from the v1 corpus by codegen/migrate_v1.py; not yet curated.
format: 2
id: param-config
name: Param API
summary: Read, export, and import /axis-cgi/param.cgi parameters through the Device Configuration API framework.
section: device-configuration
family: dca
status: beta
python:
  module: param
  class: Param
docs:
- https://developer.axis.com/vapix/device-configuration/param-api/
access: admin
discovery:
- dca: {api: param, version: v2}

binding: {root: /config/rest/param/v2beta}

types:
  ParamValue:
    type: string
    description: 'All param.cgi parameter values are strings and map to string-typed properties. (Note: the doc''s
      group-retrieval and export examples show DSCP as the number 0.)'
  ParamGroupInstance:
    type: object
    description: Instance of a dynamic group inside a <Group>Collection; carries the key property groupId plus the
      instance's parameters/sub-groups.
    properties:
      groupId: {type: string, description: Instance identifier (e.g. "0" for root.IOPort.I0).}
    additionalProperties: true
  Param:
    type: object
    description: The whole API tree.
    properties: {}
  UpdateAllRequest:
    type: object
    description: Arguments of ``update_all``.
    properties:
      data: {}
      options: {}

operations:
  get_all:
    summary: All data of the Param API API.
    effect: read
    binding: {method: GET, path: ''}
    examples:
    - title: Get request to the root entity (parameters mapping, root.HTTPS.Enabled)
      request: {path: ''}
      response:
        body:
          data:
            HTTPS: {Enabled: 'yes'}
      source: https://developer.axis.com/vapix/device-configuration/param-api/#parameters
  get_all_2:
    summary: All data of the Param API API.
    effect: read
    binding: {method: GET, path: '/{objectPath}'}
    params:
      type: object
      x-name: ParamObjectPathRequest
      required: [objectPath]
      properties:
        objectPath: {type: string}
    result:
      oneOf:
      - {$ref: '#/types/ParamValue'}
      - {$ref: '#/types/Param'}
    examples:
    - title: Example of retrieving a single parameter
      request:
        path: ''
        body: {operation: GET, path: param.v2.Audio.MaxListeners}
      response:
        body: {status: success, data: '5'}
      source: https://developer.axis.com/vapix/device-configuration/param-api/#get-parameters
    - title: Group retrieval example
      request:
        path: ''
        body: {operation: GET, path: param.v2.Audio}
      response:
        body:
          status: success
          data: {DSCP: 0, MaxListeners: '5'}
      source: https://developer.axis.com/vapix/device-configuration/param-api/#get-parameters
  get_all_3:
    summary: All data of the Param API API.
    effect: read
    binding: {method: GET, path: /$export}
    examples:
    - title: Data export example for the sample API
      request: {path: /$export}
      response:
        status: 200
        body:
          status: success
          data:
            Audio: {DSCP: 0}
            AudioCollection:
            - {groupId: '0', Enabled: 'yes'}
      source: https://developer.axis.com/vapix/device-configuration/param-api/#export-parameters
  update_all:
    summary: Update the Param API settings.
    effect: write
    write: patch
    binding: {method: PATCH, path: /$import, body: object}
    params: {$ref: '#/types/UpdateAllRequest'}
    examples:
    - title: Import data example
      request:
        path: /$import
        body:
          data:
            Audio: {DSCP: 0}
            AudioCollection:
            - {groupId: '0', Enabled: 'no'}
            - {groupId: '1', Enabled: 'yes'}
      response:
        status: 200
        body: {status: success}
      source: https://developer.axis.com/vapix/device-configuration/param-api/#import-parameters

sources:
- url: https://developer.axis.com/vapix/device-configuration/param-api/
  sha256_md: f001cc133a7b27d48d1b303f4952e3e5e593040bfbd6e2f99de8791971efeaab
  retrieved_at: '2026-10-11'

provenance:
  completeness: partial
  open_questions:
  - 'The page documents no SET operation on individual properties (only GET, $export, $import); whether PATCH on
    a writable parameter property works is not stated. Source: https://developer.axis.com/vapix/device-configuration/param-api/'
  - 'Parameters are said to map to string-typed properties, but the group-retrieval and export/import examples show
    DSCP as the number 0. Source: https://developer.axis.com/vapix/device-configuration/param-api/#get-parameters'
  - 'Structure of the ''warning section'' reporting failed imports is not documented. Source: https://developer.axis.com/vapix/device-configuration/param-api/#import-parameters'
  - 'The sample model nests ''Audio'' at the same indentation level as ''entities'' (likely a YAML indentation slip
    in the doc). Source: https://developer.axis.com/vapix/device-configuration/param-api/#use-cases'
  - 'migration: name-collision: operation name get_all collides; numeric suffix added'
  - 'migration: anyof: anyOf converted to oneOf'
  migrated_from: v1
  curated: false
