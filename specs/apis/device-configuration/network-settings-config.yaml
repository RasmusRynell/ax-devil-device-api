format: 2
id: network-settings-config
name: Network settings API
summary: Configure the hostname and resolver, the wired uplink and VLANs, the switch ports, and manage the modem, SIM cards and cellular connection.
section: device-configuration
family: dca
status: beta
python:
  module: network_settings
  class: NetworkSettings
docs:
- https://developer.axis.com/vapix/device-configuration/network-settings-api/
access: admin
discovery:
- dca: {api: network-settings, version: v2}

binding: {root: /config/rest/network-settings/v2beta}

types:
  AccessPointName:
    type: string
    minLength: 0
    maxLength: 100
    pattern: ^[a-zA-Z0-9.-]*$
    description: The Access Point Name (APN).
  CellularConnectionStatus:
    type: string
    enum: [NOT_REGISTERED, REGISTERED, DATA_ENABLED, IP_ASSIGNED]
    description: The initial state is no network registration, followed by registered without data connection, then
      data connection without IP and finally IP assigned.
  DomainName: {type: string, description: Domain name type.}
  Hostname:
    type: string
    minLength: 1
    maxLength: 63
    pattern: ^[a-zA-Z]$|^[a-zA-Z0-9][a-zA-Z0-9.-]*[a-zA-Z0-9]$
    description: Hostname type
  Iccid: {type: string, description: The Integrated Circuit Card Identification number.}
  Imei: {type: string, minLength: 15, maxLength: 15, description: The IMEI type.}
  IpAddress: {type: string, description: The IPv4 or IPv6 address type.}
  Ipv4Address:
    type: string
    pattern: ^(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)$
    description: The IPv4 address type.
  AuthServerEnforced:
    type: string
    enum: [NONE, AUTHENTICATED, MACSEC_SECURED]
    description: The authentication server enforcement level.
  AuthState:
    type: string
    enum: [UNKNOWN, AUTHENTICATED, AUTHENTICATING, STOPPED, FAILED]
    description: The authentication state type.
  LinkMode:
    type: string
    enum: [UNKNOWN, AUTO, 10HD, 10FD, 100HD, 100FD, 1000HD, 1000FD]
    description: The link speed and duplex mode of the wired connection.
  LinkModes:
    type: array
    items: {$ref: '#/types/LinkMode'}
    description: A list of link modes.
  MacAddress:
    type: string
    pattern: ^([0-9A-Fa-f]{2}[:]){5}([0-9A-Fa-f]{2})$
    description: The MAC address type.
  MacSecState:
    type: string
    enum: [UNKNOWN, SECURED, CONNECTING, STOPPED, FAILED]
    description: The MACsec state type.
  Mtu: {type: integer, description: The maximum transmission unit type.}
  NameServers:
    type: array
    items: {$ref: '#/types/IpAddress'}
    maxItems: 3
    description: The name servers type.
  RadioGeneration: {type: string, enum: [4G, 5G], description: The radio generation type.}
  RadioInterface:
    type: string
    enum: [4G, 5GSA, 5GNSA, UNKNOWN]
    description: The connected radio interface type.
  RadioParameters:
    type: object
    description: The radio parameter object.
    required: [band, bandwidth, downlinkModulationCodingScheme, physicalCellId, signalStrength, txPower, uplinkModulationCodingScheme]
    properties:
      band: {type: integer, description: The radio band class.}
      bandwidth: {type: integer, description: The bandwidth (in MHz).}
      downlinkModulationCodingScheme:
        type: integer
        description: Typically 0-31 for 5G and 0-28 for 4G. Higher value means better signal quality and higher
          potential data rates.
      physicalCellId: {type: integer, description: The physical cell ID.}
      signalStrength: {$ref: '#/types/SignalStrength', description: The signal strength parameters.}
      txPower: {type: integer, description: The transmit power (in dBm/10).}
      uplinkModulationCodingScheme:
        type: integer
        description: Typically 0-31 for 5G and 0-28 for 4G. Higher value means better signal quality and higher
          potential data rates.
  RemoteAddresses:
    type: array
    items: {$ref: '#/types/MacAddress'}
    description: The remote addresses type.
  SearchDomains:
    type: array
    items: {$ref: '#/types/DomainName'}
    maxItems: 6
    description: The search domains type.
  SignalStrength:
    type: object
    description: The signal strength object.
    required: [rsrp, rsrq, rssi, snr, ssi]
    properties:
      rsrp: {type: integer, description: The Reference Signal Received Power (in dBm).}
      rsrq: {type: integer, description: The Reference Signal Received Quality (in dB).}
      rssi: {type: integer, description: The Received Signal Strength Indicator (in dBm).}
      snr: {type: integer, description: The Signal to noise ratio (in dB).}
      ssi: {$ref: '#/types/SignalStrengthIndex', description: The Signal Strength Index.}
  SignalStrengthIndex:
    type: integer
    minimum: -1
    maximum: 4
    description: The signal strength index ranging from 0 (weakest) to 4 (strongest), -1 if no signal.
  SimPin:
    type: string
    minLength: 4
    maxLength: 8
    pattern: ^[0-9]+$
    description: The SIM PIN type.
  SimPuk:
    type: string
    minLength: 8
    maxLength: 8
    pattern: ^[0-9]+$
    description: The SIM PUK type.
  SimSlotId:
    type: string
    minLength: 1
    maxLength: 2
    pattern: ^[0-9]+$
    description: A string index from 0 to 99.
  SimStatus:
    type: string
    enum:
    - PIN_DISABLED
    - UNLOCKED
    - LOCKED
    - BLOCKED
    - PERMANENTLY_BLOCKED
    - NO_SIM
    - UNKNOWN
    description: The PIN can be disabled, which means the SIM PIN is not required.
  LinkState: {type: string, enum: [UP, DOWN], description: The link state type.}
  Uplink: {type: string, enum: [NONE, WIRED, MODEM], description: The uplink device type.}
  VlanId:
    type: string
    pattern: ^([1-9][0-9]{0,2}|[1-3][0-9]{3}|40[0-8][0-9]|409[0-4])$
    description: The ID of the VLAN. Needs to be between 1 and 4094.
  NetworkSettings:
    type: object
    description: The whole API tree. Wired, modem and switch are only present when supported.
    x-read-only: [modem_supported, switch_supported, wired_supported]
    properties:
      modem_supported: {type: boolean, description: Whether the device supports a cellular modem.}
      switch_supported: {type: boolean, description: Indicates if switch is supported.}
      wired_supported: {type: boolean, description: Whether the device has a wired uplink.}
      system: {$ref: '#/types/SystemSettings'}
      wired: {$ref: '#/types/Wired'}
      modem: {$ref: '#/types/Modem'}
      switch: {$ref: '#/types/SwitchSettings'}
  SystemSettings:
    type: object
    description: The global network configuration
    required: [activeUplink, hostname, nameServers, searchDomains, staticHostname, staticSearchDomains, useDhcpHostname]
    x-read-only: [activeUplink, hostname, nameServers, searchDomains]
    properties:
      activeUplink: {$ref: '#/types/Uplink', description: Indicates which uplink is currently in use.}
      hostname: {$ref: '#/types/Hostname', description: The currently used hostname}
      nameServers: {$ref: '#/types/NameServers', description: The name servers currently in use.}
      searchDomains: {$ref: '#/types/SearchDomains', description: The search domains currently in use.}
      staticHostname:
        $ref: '#/types/Hostname'
        description: The statically configured hostname. It is used if `useDhcpHostname` is set to `false`, or if
          no `hostname` was obtained by DHCP.
      staticNameServers:
        $ref: '#/types/NameServers'
        description: The statically configured name servers. It is used if useDhcpResolver is set to false, or if
          no name servers were obtained by DHCP.
      staticSearchDomains:
        $ref: '#/types/SearchDomains'
        description: The statically configured search domains. It is used if useDhcpResolver is set to false, or
          if no search domains were obtained by DHCP.
      useDhcpHostname:
        type: boolean
        description: Checks which DHCP-assigned `hostname` should be used. If set to `false`, the `staticHostname`
          will be used.
  Wired:
    type: object
    description: The wired uplink configuration. Only available when wired_supported is true.
    required: [linkMode, macAddress, maxMtu, maxNumberOfVlans, minMtu, mtu, staticLinkMode, staticMtu, supportedLinkModes, vlans]
    x-read-only:
    - linkMode
    - lowerState
    - macAddress
    - maxMtu
    - maxNumberOfVlans
    - minMtu
    - mtu
    - supportedLinkModes
    properties:
      linkMode: {$ref: '#/types/LinkMode', description: The current link mode.}
      lowerState:
        $ref: '#/types/LinkState'
        description: Indicates if the wired network interface device status is UP or DOWN.
      macAddress: {$ref: '#/types/MacAddress', description: The MAC address of the wired device.}
      maxMtu: {$ref: '#/types/Mtu', description: The maximum supported MTU of the wired device}
      maxNumberOfVlans: {type: integer, description: The maximum number of supported VLANs.}
      minMtu: {$ref: '#/types/Mtu', description: The minimum supported MTU of the wired device}
      mtu: {$ref: '#/types/Mtu', description: The MTU of the wired device}
      useDhcpResolver:
        type: boolean
        description: Checks if any DHCP-assigned resolver information should be used. If set to false, the static
          resolver values will be used.
      staticLinkMode: {$ref: '#/types/LinkMode', description: The statically configured link mode.}
      staticMtu: {$ref: '#/types/Mtu', description: The statically configured MTU of the wired device}
      supportedLinkModes: {$ref: '#/types/LinkModes', description: The supported link modes.}
      vlans:
        type: array
        items: {$ref: '#/types/Vlan'}
        description: The configured VLANs.
  Vlan:
    type: object
    description: VLAN configurations.
    required: [id]
    properties:
      id: {$ref: '#/types/VlanId', description: The ID of the VLAN. Needs to be between 1 and 4094.}
  Modem:
    type: object
    description: The modem configuration and SIM management. When the modem is not ready, imei is null and sim is empty.
    required: [imei, sim]
    x-nullable: [imei]
    properties:
      imei: {$ref: '#/types/Imei', description: 'The IMEI of the modem, null if the modem is not ready.'}
      sim:
        type: array
        items: {$ref: '#/types/Sim'}
        description: The SIM slots.
  Sim:
    type: object
    description: The collection of SIM slots.
    required: [slotId, status]
    x-nullable: [iccid, pinRetries, provider, pukRetries]
    properties:
      iccid:
        $ref: '#/types/Iccid'
        description: The Integrated Circuit Card Identifier of the SIM, null if the SIM is absent.
      pinRetries:
        type: integer
        description: The number of attempts remaining for entering the SIM PIN, null if the SIM is absent.
      provider: {type: string, description: 'The name of the SIM provider, null if the SIM is absent.'}
      pukRetries:
        type: integer
        description: The number of attempts remaining for entering the SIM PUK, null if the SIM is absent.
      slotId: {$ref: '#/types/SimSlotId', description: The slot ID of the SIM.}
      status: {$ref: '#/types/SimStatus', description: The status of the SIM.}
      connection: {$ref: '#/types/CellularConnection', description: The cellular network connection of the SIM.}
  CellularConnection:
    type: object
    description: The cellular network connection.
    required: [connectionStatus, radioInterface]
    x-nullable: [operatorName]
    properties:
      connectionStatus: {$ref: '#/types/CellularConnectionStatus', description: The connection status.}
      operatorName: {type: string, description: 'The operator name, null if not connected to a cellular network.'}
      radioInterface: {$ref: '#/types/RadioInterface', description: The connected radio interface.}
      networkInterface:
        type: array
        items: {$ref: '#/types/NetworkInterface'}
        description: The network interfaces of the SIM.
  NetworkInterface:
    type: object
    description: The collection of network interfaces for this SIM.
    required: [accessPointName, interfaceName]
    x-nullable: [ipv4Info]
    properties:
      accessPointName: {type: string, description: The Access Point Name for this interface.}
      interfaceName: {type: string, description: The interface name.}
      ipv4Info:
        $ref: '#/types/Ipv4Info'
        description: The IPv4 information provided by the cellular network, null if an IPv4 connection is not established.
  Ipv4Info:
    type: object
    description: IPv4 information of a cellular interface. The docs name the type Ipv4AddressStruct but do not define it; the fields come from the examples.
    properties:
      ipAddress: {$ref: '#/types/Ipv4Address', description: The assigned IPv4 address.}
      origin: {type: string, description: 'How the address was obtained, for example CELLULAR.'}
      prefixLength: {type: integer, description: The network prefix length.}
  SwitchSettings:
    type: object
    description: Global switch configurations. Only available when switch_supported is true.
    properties:
      port:
        type: array
        items: {$ref: '#/types/SwitchPort'}
        description: The switch ports.
  SwitchPort:
    type: object
    description: Switch port configurations. security is left out when security_supported is false.
    required: [enabled, lowerState, portId, remoteAddresses, security_supported]
    x-read-only: [lowerState, portId, remoteAddresses, security_supported]
    properties:
      enabled: {type: boolean, description: Specifies if a network interface device is enabled.}
      lowerState:
        $ref: '#/types/LinkState'
        description: Indicates if the network interface device status is UP or DOWN.
      portId: {type: string, description: Switch port ID.}
      remoteAddresses:
        $ref: '#/types/RemoteAddresses'
        description: List all stored remote MAC addresses observed on the switch port.
      security_supported: {type: boolean, description: Indicates if security is supported.}
      security: {$ref: '#/types/PortSecurity', description: Security settings; only present when security_supported is true.}
  PortSecurity:
    type: object
    description: Switch port security configurations.
    x-read-only: [authState, macSecState]
    properties:
      authServerEnabled: {type: boolean, description: Indicates if the authentication server is enabled.}
      authServerEnforced:
        $ref: '#/types/AuthServerEnforced'
        description: Indicates if the authentication server is enforced.
      authState: {$ref: '#/types/AuthState', description: Indicates the authentication state of the port.}
      macSecState: {$ref: '#/types/MacSecState', description: Indicates the MACSec state of the port}
  UpdateSystemRequest:
    type: object
    description: Arguments of ``update_system``. Only the given settings change.
    properties:
      staticHostname:
        $ref: '#/types/Hostname'
        description: The statically configured hostname. It is used if `useDhcpHostname` is set to `false`, or if
          no `hostname` was obtained by DHCP.
      staticNameServers:
        $ref: '#/types/NameServers'
        description: The statically configured name servers. It is used if useDhcpResolver is set to false, or if
          no name servers were obtained by DHCP.
      staticSearchDomains:
        $ref: '#/types/SearchDomains'
        description: The statically configured search domains. It is used if useDhcpResolver is set to false, or
          if no search domains were obtained by DHCP.
      useDhcpHostname:
        type: boolean
        description: Checks which DHCP-assigned `hostname` should be used. If set to `false`, the `staticHostname`
          will be used.
  UpdatePortRequest:
    type: object
    description: Arguments of ``update_port``.
    required: [portId]
    properties:
      portId: {type: string, description: Switch port ID.}
      enabled: {type: boolean, description: Specifies if a network interface device is enabled.}
      security: {$ref: '#/types/PortSecurity', description: Security settings; only settable when security_supported is true.}
  UpdatePortSecurityRequest:
    type: object
    description: Arguments of ``update_port_security``.
    required: [portId]
    properties:
      portId: {type: string, description: Switch port ID.}
      authServerEnabled: {type: boolean, description: Indicates if the authentication server is enabled.}
      authServerEnforced:
        $ref: '#/types/AuthServerEnforced'
        description: Indicates if the authentication server is enforced.
  AddVlanRequest:
    type: object
    description: Arguments of ``add_vlan``.
    required: [id]
    properties:
      id: {$ref: '#/types/VlanId', description: The ID of the VLAN. Needs to be between 1 and 4094.}

operations:
  get_all:
    summary: All data of the Network settings API.
    effect: read
    binding: {method: GET, path: ''}
    result: {$ref: '#/types/NetworkSettings'}
  get_modem_supported:
    summary: Whether the device supports a cellular modem.
    effect: read
    binding: {method: GET, path: /modem_supported}
    result: {type: boolean}
  get_switch_supported:
    summary: Whether the device has a built-in switch.
    effect: read
    binding: {method: GET, path: /switch_supported}
    result: {type: boolean}
  get_wired_supported:
    summary: Whether the device has a wired uplink.
    effect: read
    binding: {method: GET, path: /wired_supported}
    result: {type: boolean}
  get_system:
    summary: Get the hostname and resolver settings, including the values currently in use.
    effect: read
    binding: {method: GET, path: /system}
    result: {$ref: '#/types/SystemSettings'}
    examples:
    - title: Get system settings
      request:
        path: /system
      response:
        status: 200
        body: {status: success, data: {hostname: realhostname, staticHostname: testhostname, useDhcpHostname: true, nameServers: [192.168.0.1, 192.168.1.2, '1234::77'], searchDomains: [axis.com, example.com], staticSearchDomains: [axis.com, example.com], activeUplink: WIRED}}
      source: https://developer.axis.com/vapix/device-configuration/network-settings-api/
  update_system:
    summary: Update the hostname and resolver settings; only the given fields change.
    effect: write
    write: patch
    binding: {method: PATCH, path: /system, body: object}
    params: {$ref: '#/types/UpdateSystemRequest'}
    round_trip:
      from: SystemSettings
    examples:
    - title: Set hostname settings
      request:
        path: /system
        body: {data: {staticHostname: myhostname, useDhcpHostname: false}}
      response:
        status: 200
        body: {status: success}
      source: https://developer.axis.com/vapix/device-configuration/network-settings-api/
    - title: Set resolver settings
      x-contract: {skip: "docs send useDhcpResolver to the system entity, but the tables define it on the wired entity"}
      request:
        path: /system
        body:
          data:
            staticNameServers: [192.168.0.1, 192.168.1.2, '1234::77']
            staticSearchDomains: [axis.com, example.com]
            useDhcpResolver: false
      response:
        status: 200
        body: {status: success}
      source: https://developer.axis.com/vapix/device-configuration/network-settings-api/
  set_system_static_hostname:
    summary: Set the static hostname.
    effect: write
    write: patch
    binding: {method: PATCH, path: /system/staticHostname, body_field: staticHostname, body: value}
    positional: [staticHostname]
    params:
      type: object
      required: [staticHostname]
      properties:
        staticHostname: {$ref: '#/types/Hostname', description: 'The statically configured hostname. It is used if `useDhcpHostname` is set to `false`, or if no `hostname` was obtained by DHCP.'}
  set_system_static_name_servers:
    summary: Set the static name servers.
    effect: write
    write: patch
    binding: {method: PATCH, path: /system/staticNameServers, body_field: staticNameServers, body: value}
    positional: [staticNameServers]
    params:
      type: object
      required: [staticNameServers]
      properties:
        staticNameServers: {$ref: '#/types/NameServers', description: 'The statically configured name servers. It is used if useDhcpResolver is set to false, or if no name servers were obtained by DHCP.'}
  set_system_static_search_domains:
    summary: Set the static search domains.
    effect: write
    write: patch
    binding: {method: PATCH, path: /system/staticSearchDomains, body_field: staticSearchDomains, body: value}
    positional: [staticSearchDomains]
    params:
      type: object
      required: [staticSearchDomains]
      properties:
        staticSearchDomains: {$ref: '#/types/SearchDomains', description: 'The statically configured search domains. It is used if useDhcpResolver is set to false, or if no search domains were obtained by DHCP.'}
  set_system_use_dhcp_hostname:
    summary: Use the DHCP-assigned hostname, or the static one when false.
    effect: write
    write: patch
    binding: {method: PATCH, path: /system/useDhcpHostname, body_field: useDhcpHostname, body: value}
    positional: [useDhcpHostname]
    params:
      type: object
      required: [useDhcpHostname]
      properties:
        useDhcpHostname: {type: boolean, description: 'Checks which DHCP-assigned `hostname` should be used. If set to `false`, the `staticHostname` will be used.'}
  get_wired:
    summary: Get the wired uplink configuration. Only available when wired_supported is true.
    effect: read
    binding: {method: GET, path: /wired}
    result: {$ref: '#/types/Wired'}
    examples:
    - title: Get wired configuration
      request: {path: /wired}
      response:
        status: 200
        body: {status: success, data: {linkMode: 1000FD, staticLinkMode: AUTO, supportedLinkModes: [AUTO, 10HD, 10FD, 100HD, 100FD, 1000HD, 1000FD], maxNumberOfVlans: 5, macAddress: 'b8:a4:4f:b4:fc:1d', maxMtu: 1500, minMtu: 68, mtu: 1500, staticMtu: 1500, vlans: []}}
      source: https://developer.axis.com/vapix/device-configuration/network-settings-api/
  set_wired_use_dhcp_resolver:
    summary: Use DHCP-assigned resolver information, or the static resolver values when false.
    effect: write
    write: patch
    binding: {method: PATCH, path: /wired/useDhcpResolver, body_field: useDhcpResolver, body: value}
    positional: [useDhcpResolver]
    params:
      type: object
      required: [useDhcpResolver]
      properties:
        useDhcpResolver:
          type: boolean
          description: Checks if any DHCP-assigned resolver information should be used. If set to false, the static resolver values will be used.
  set_wired_static_link_mode:
    summary: Set the static link mode of the wired uplink; AUTO negotiates it.
    description: An unsupported link mode can result in a connection loss.
    effect: write
    write: patch
    binding: {method: PATCH, path: /wired/staticLinkMode, body_field: staticLinkMode, body: value}
    positional: [staticLinkMode]
    params:
      type: object
      required: [staticLinkMode]
      properties:
        staticLinkMode: {$ref: '#/types/LinkMode', description: The statically configured link mode.}
    examples:
    - title: Set wired settings
      request:
        path: /wired/staticLinkMode
        body: {data: 100FD}
      response:
        status: 200
        body: {status: success}
      source: https://developer.axis.com/vapix/device-configuration/network-settings-api/
  set_wired_static_mtu:
    summary: Set the static MTU of the wired uplink.
    description: The value must be within minMtu and maxMtu. IPv6 requires an MTU of at least 1280.
    effect: write
    write: patch
    binding: {method: PATCH, path: /wired/staticMtu, body_field: staticMtu, body: value}
    positional: [staticMtu]
    params:
      type: object
      required: [staticMtu]
      properties:
        staticMtu: {$ref: '#/types/Mtu', description: The statically configured MTU of the wired device}
    examples:
    - title: Set the static MTU
      request:
        path: /wired/staticMtu
        body: {data: 1400}
      response:
        status: 200
        body: {status: success}
      source: https://developer.axis.com/vapix/device-configuration/network-settings-api/
  list_vlans:
    summary: List the configured VLANs.
    effect: read
    binding: {method: GET, path: /wired/vlans}
    result:
      type: array
      items: {$ref: '#/types/Vlan'}
    examples:
    - title: List VLANs
      request: {path: /wired/vlans}
      response:
        status: 200
        body: {status: success, data: [{id: '1'}, {id: '2'}]}
      source: https://developer.axis.com/vapix/device-configuration/network-settings-api/
  get_vlan:
    summary: Get one VLAN.
    effect: read
    binding: {method: GET, path: '/wired/vlans/{id}'}
    params:
      type: object
      x-name: VlanIdRequest
      required: [id]
      properties:
        id: {$ref: '#/types/VlanId'}
    result: {$ref: '#/types/Vlan'}
  add_vlan:
    summary: Add a VLAN with an id between 1 and 4094.
    effect: write
    write: create
    binding: {method: POST, path: /wired/vlans, body: object}
    params: {$ref: '#/types/AddVlanRequest'}
  remove_vlan:
    summary: Remove a VLAN.
    effect: write
    write: delete
    binding: {method: DELETE, path: '/wired/vlans/{id}'}
    params:
      type: object
      x-name: VlanIdRequest
      required: [id]
      properties:
        id: {$ref: '#/types/VlanId'}
  get_modem:
    summary: Get the modem configuration with SIM, connection and interface details. Only available when modem_supported is true.
    effect: read
    binding: {method: GET, path: /modem}
    result: {$ref: '#/types/Modem'}
    examples:
    - title: Get modem configuration
      request: {path: /modem}
      response:
        status: 200
        body: {status: success, data: {imei: '359918921411872', sim: [{connection: {connectionStatus: IP_ASSIGNED, networkInterface: [{accessPointName: '', interfaceName: wwan0, ipv4Info: {ipAddress: 172.26.248.70, origin: CELLULAR, prefixLength: 30}}], operatorName: '999 40', radioInterface: 5GSA}, iccid: '8900099200002070051', pinRetries: 3, provider: NDAC, pukRetries: 10, slotId: '1', status: UNLOCKED}]}}
      source: https://developer.axis.com/vapix/device-configuration/network-settings-api/
    - title: Get modem configuration when modem is not ready
      request: {path: /modem}
      response:
        status: 200
        body: {status: success, data: {imei: null, sim: []}}
      source: https://developer.axis.com/vapix/device-configuration/network-settings-api/
  list_sims:
    summary: List the SIM slots.
    effect: read
    binding: {method: GET, path: /modem/sim}
    result:
      type: array
      items: {$ref: '#/types/Sim'}
    examples:
    - title: Get SIM configuration
      request: {path: /modem/sim}
      response:
        status: 200
        body: {status: success, data: [{connection: {connectionStatus: IP_ASSIGNED, networkInterface: [{accessPointName: '', interfaceName: wwan0, ipv4Info: {ipAddress: 172.26.248.70, origin: CELLULAR, prefixLength: 30}}], operatorName: '999 40', radioInterface: 5GSA}, iccid: '8900099200002070051', pinRetries: 3, provider: NDAC, pukRetries: 10, slotId: '1', status: UNLOCKED}]}
      source: https://developer.axis.com/vapix/device-configuration/network-settings-api/
  get_sim:
    summary: Get one SIM slot.
    effect: read
    binding: {method: GET, path: '/modem/sim/{slotId}'}
    params:
      type: object
      x-name: SimSlotIdRequest
      required: [slotId]
      properties:
        slotId: {$ref: '#/types/SimSlotId'}
    result: {$ref: '#/types/Sim'}
  change_sim_pin:
    summary: Change the SIM PIN. Both the old and the new PIN are required.
    effect: action
    binding: {method: POST, path: '/modem/sim/{slotId}/changeSimPin', body: object}
    params:
      type: object
      required: [slotId, oldpin, newpin]
      x-masked: [oldpin, newpin]
      properties:
        slotId: {$ref: '#/types/SimSlotId'}
        oldpin: {$ref: '#/types/SimPin', description: The existing SIM PIN.}
        newpin: {$ref: '#/types/SimPin', description: The new SIM PIN.}
    examples:
    - title: Change SIM PIN
      request:
        path: /modem/sim/1/changeSimPin
        body: {data: {oldpin: '1234', newpin: '5678'}}
      response:
        status: 200
        body: {status: success, data: {}}
      source: https://developer.axis.com/vapix/device-configuration/network-settings-api/
  set_sim_protection:
    summary: Turn SIM PIN protection on or off.
    effect: action
    binding: {method: POST, path: '/modem/sim/{slotId}/setSimProtection', body: object}
    params:
      type: object
      required: [slotId, enable, pin]
      x-masked: [pin]
      properties:
        slotId: {$ref: '#/types/SimSlotId'}
        enable: {type: boolean, description: 'true if SIM PIN protection should be enabled, otherwise false.'}
        pin: {$ref: '#/types/SimPin', description: The SIM PIN.}
    examples:
    - title: Enable SIM protection
      request:
        path: /modem/sim/1/setSimProtection
        body: {data: {enable: true, pin: '1234'}}
      response:
        status: 200
        body: {status: success, data: {}}
      source: https://developer.axis.com/vapix/device-configuration/network-settings-api/
  unblock_sim:
    summary: Unblock a blocked SIM with its PUK and set a new PIN.
    description: The SIM is blocked after three incorrect PIN attempts.
    effect: action
    binding: {method: POST, path: '/modem/sim/{slotId}/unblockSim', body: object}
    params:
      type: object
      required: [slotId, pin, puk]
      x-masked: [pin, puk]
      properties:
        slotId: {$ref: '#/types/SimSlotId'}
        pin: {$ref: '#/types/SimPin', description: The new SIM PIN.}
        puk: {$ref: '#/types/SimPuk', description: The PUK code of the SIM.}
    examples:
    - title: Unblock a blocked SIM
      request:
        path: /modem/sim/1/unblockSim
        body: {data: {pin: '1122', puk: '12345678'}}
      response:
        status: 200
        body: {status: success, data: {}}
      source: https://developer.axis.com/vapix/device-configuration/network-settings-api/
  verify_sim_pin:
    summary: Unlock the SIM using the PIN, or just verify the PIN.
    effect: action
    binding: {method: POST, path: '/modem/sim/{slotId}/verifySimPin', body_field: pin, body: value}
    params:
      type: object
      required: [slotId, pin]
      x-masked: [pin]
      properties:
        slotId: {$ref: '#/types/SimSlotId'}
        pin: {$ref: '#/types/SimPin', description: The SIM PIN.}
    examples:
    - title: Unlock SIM
      request:
        path: /modem/sim/1/verifySimPin
        body: {data: '1234'}
      response:
        status: 200
        body: {status: success, data: {}}
      source: https://developer.axis.com/vapix/device-configuration/network-settings-api/
  get_sim_connection:
    summary: Get the cellular connection of a SIM.
    effect: read
    binding: {method: GET, path: '/modem/sim/{slotId}/connection'}
    params:
      type: object
      x-name: SimSlotIdRequest
      required: [slotId]
      properties:
        slotId: {$ref: '#/types/SimSlotId'}
    result: {$ref: '#/types/CellularConnection'}
    examples:
    - title: Get connection configuration
      request:
        path: /modem/sim/1/connection
      response:
        status: 200
        body: {status: success, data: {connectionStatus: IP_ASSIGNED, networkInterface: [{accessPointName: '', interfaceName: wwan0, ipv4Info: {ipAddress: 172.26.248.70, origin: CELLULAR, prefixLength: 30}}], operatorName: '999 40', radioInterface: 5GSA}}
      source: https://developer.axis.com/vapix/device-configuration/network-settings-api/
  get_radio_parameters:
    summary: Get the current radio parameters of the cellular connection.
    effect: action
    binding: {method: POST, path: '/modem/sim/{slotId}/connection/getRadioParameters', body_field: radioGeneration, body: value}
    params:
      type: object
      required: [slotId, radioGeneration]
      properties:
        slotId: {$ref: '#/types/SimSlotId'}
        radioGeneration: {$ref: '#/types/RadioGeneration', description: The radio generation to get parameters for.}
    result: {$ref: '#/types/RadioParameters'}
    examples:
    - title: Get radio parameters
      request:
        path: /modem/sim/1/connection/getRadioParameters
        body: {data: 5G}
      response:
        status: 200
        body: {status: success, data: {band: 78, bandwidth: 80, downlinkModulationCodingScheme: 0, physicalCellId: 50, signalStrength: {rsrp: -109, rsrq: -11, rssi: -98, snr: -67, ssi: 0}, txPower: 23, uplinkModulationCodingScheme: 13}}
      source: https://developer.axis.com/vapix/device-configuration/network-settings-api/
  list_network_interfaces:
    summary: List the network interfaces of a SIM connection.
    effect: read
    binding: {method: GET, path: '/modem/sim/{slotId}/connection/networkInterface'}
    params:
      type: object
      x-name: SimSlotIdRequest
      required: [slotId]
      properties:
        slotId: {$ref: '#/types/SimSlotId'}
    result:
      type: array
      items: {$ref: '#/types/NetworkInterface'}
    examples:
    - title: Get network interface configuration
      request:
        path: /modem/sim/1/connection/networkInterface
      response:
        status: 200
        body: {status: success, data: [{accessPointName: '', interfaceName: wwan0, ipv4Info: {ipAddress: 172.26.248.70, origin: CELLULAR, prefixLength: 30}}]}
      source: https://developer.axis.com/vapix/device-configuration/network-settings-api/
  get_network_interface:
    summary: Get one network interface of a SIM connection.
    effect: read
    binding: {method: GET, path: '/modem/sim/{slotId}/connection/networkInterface/{interfaceName}'}
    params:
      type: object
      x-name: NetworkInterfaceKeyRequest
      required: [slotId, interfaceName]
      properties:
        slotId: {$ref: '#/types/SimSlotId'}
        interfaceName: {type: string, description: The interface name.}
    result: {$ref: '#/types/NetworkInterface'}
  set_access_point_name:
    summary: Set the Access Point Name of a network interface.
    effect: action
    binding: {method: POST, path: '/modem/sim/{slotId}/connection/networkInterface/{interfaceName}/setAccessPointName', body_field: accessPointName, body: value}
    params:
      type: object
      required: [slotId, interfaceName, accessPointName]
      properties:
        slotId: {$ref: '#/types/SimSlotId'}
        interfaceName: {type: string, description: The interface name.}
        accessPointName: {$ref: '#/types/AccessPointName', description: The Access Point Name (APN).}
  get_switch:
    summary: Get the switch configuration. Only available when switch_supported is true.
    effect: read
    binding: {method: GET, path: /switch}
    result: {$ref: '#/types/SwitchSettings'}
    examples:
    - title: Get switch configuration
      request: {path: /switch}
      response:
        status: 200
        body: {status: success, data: {port: [{lowerState: UP, portId: '1', remoteAddresses: ['55:72:97:5a:c7:cf'], security_supported: false, enabled: true, security: {macSecState: SECURED, authServerEnabled: true, authServerEnforced: MACSEC_SECURED, authState: AUTHENTICATED}}, {lowerState: DOWN, portId: '2', remoteAddresses: [], security_supported: true, enabled: true, security: {macSecState: UNKNOWN, authServerEnabled: true, authServerEnforced: AUTHENTICATED, authState: UNKNOWN}}]}}
      source: https://developer.axis.com/vapix/device-configuration/network-settings-api/
  list_ports:
    summary: List the switch ports.
    effect: read
    binding: {method: GET, path: /switch/port}
    result:
      type: array
      items: {$ref: '#/types/SwitchPort'}
  get_port:
    summary: Get one switch port. The security settings are left out when security_supported is false.
    effect: read
    binding: {method: GET, path: '/switch/port/{portId}'}
    params:
      type: object
      x-name: PortIdRequest
      required: [portId]
      properties:
        portId: {type: string, description: Switch port ID.}
    result: {$ref: '#/types/SwitchPort'}
    examples:
    - title: Get switch port settings
      request:
        path: /switch/port/1
      response:
        status: 200
        body: {status: success, data: {lowerState: UP, portId: '1', remoteAddresses: ['55:72:97:5a:c7:cf'], security_supported: true, enabled: true, security: {macSecState: SECURED, authServerEnabled: true, authServerEnforced: MACSEC_SECURED, authState: AUTHENTICATED}}}
      source: https://developer.axis.com/vapix/device-configuration/network-settings-api/
  update_port:
    summary: Update a switch port; only the given fields change.
    description: The security settings can only be set when security_supported is true.
    effect: write
    write: patch
    binding: {method: PATCH, path: '/switch/port/{portId}', body: object}
    params: {$ref: '#/types/UpdatePortRequest'}
    examples:
    - title: Set switch port settings
      request:
        path: /switch/port/1
        body: {data: {enabled: true, security: {authServerEnabled: false, authServerEnforced: NONE}}}
      response:
        status: 200
        body: {status: success}
      source: https://developer.axis.com/vapix/device-configuration/network-settings-api/
  set_port_enabled:
    summary: Enable or disable a switch port.
    effect: write
    write: patch
    binding: {method: PATCH, path: '/switch/port/{portId}/enabled', body_field: enabled, body: value}
    positional: [portId, enabled]
    params:
      type: object
      required: [portId, enabled]
      properties:
        portId: {type: string, description: Switch port ID.}
        enabled: {type: boolean, description: Specifies if a network interface device is enabled.}
  get_port_security:
    summary: Get the security settings of a switch port. Only available when security_supported is true.
    effect: read
    binding: {method: GET, path: '/switch/port/{portId}/security'}
    params:
      type: object
      x-name: PortIdRequest
      required: [portId]
      properties:
        portId: {type: string, description: Switch port ID.}
    result: {$ref: '#/types/PortSecurity'}
  update_port_security:
    summary: Update the security settings of a switch port; only the given fields change.
    effect: write
    write: patch
    binding: {method: PATCH, path: '/switch/port/{portId}/security', body: object}
    params: {$ref: '#/types/UpdatePortSecurityRequest'}
  set_port_security_auth_server_enabled:
    summary: Enable or disable the authentication server of a switch port.
    effect: write
    write: patch
    binding: {method: PATCH, path: '/switch/port/{portId}/security/authServerEnabled', body_field: authServerEnabled, body: value}
    positional: [portId, authServerEnabled]
    params:
      type: object
      required: [portId, authServerEnabled]
      properties:
        portId: {type: string, description: Switch port ID.}
        authServerEnabled: {type: boolean, description: Indicates if the authentication server is enabled.}
  set_port_security_auth_server_enforced:
    summary: Set how strongly the authentication server is enforced on a switch port.
    effect: write
    write: patch
    binding: {method: PATCH, path: '/switch/port/{portId}/security/authServerEnforced', body_field: authServerEnforced, body: value}
    positional: [portId, authServerEnforced]
    params:
      type: object
      required: [portId, authServerEnforced]
      properties:
        portId: {type: string, description: Switch port ID.}
        authServerEnforced: {$ref: '#/types/AuthServerEnforced', description: Indicates if the authentication server is enforced.}

sources:
- url: https://developer.axis.com/vapix/device-configuration/network-settings-api/
  sha256_md: 9da02232acb573701173b85bf49313be171f82623d9d18e54d27b2204de0a576
  retrieved_at: '2026-10-11'

provenance:
  completeness: complete
  open_questions:
  - The docs define useDhcpResolver on the wired entity, but the system examples read and set it on the system entity. The tables are followed; the system set example is skipped.
  - The docs name the cellular IPv4 type Ipv4AddressStruct without defining it. Ipv4Info is inferred from the examples (ipAddress, origin, prefixLength).
  - The docs wired and switch GET examples wrap the singleton entity in a list; the plain object is used.
  - The docs VLAN add and remove examples show GET requests and are not carried over.
  - The root path is v2beta while the API is discovered as v2.
  migrated_from: v1
  curated: true
