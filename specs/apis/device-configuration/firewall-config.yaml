  retrieved_at: '2026-10-11'

provenance:
  completeness: complete
  open_questions:
  - The LimitPeriod table lists only NEWCONNECTIONS, while the examples use SECOND and MINUTE. The table is followed, so limit rules cannot be set with a period the examples use; the examples are skipped in the contract tests.
  - The MAC pattern in the docs has an unbalanced parenthesis; the leading group is added.
  - The docs example for reading activated shows the string "true"; the boolean is used.
  - The docs do not say which fields of setRules are required; all are optional here.
  migrated_from: v1
  curated: true
