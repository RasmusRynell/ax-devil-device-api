provenance:
  completeness: partial
  open_questions:
    - The API Definition section of the page is malformed (the structure tree shows only the root, the pairings collection is headed "id", and the feature, capability and plugin entities have bare headings). Entity paths were reconstructed from the use-case examples and prose.
    - The docs state the base path as v1beta everywhere except the plugin-check example (v1); v1beta is used, and the example is corrected to it.
    - The feature key is documented as category in the key-property line, URLs and every example, but the property table lists features_category; category is used.
    - The siren_light capabilities collection is documented with property pairing_id and key pairing, but the example returns pairing and is shown at .../siren_light/features/1 (the prose says features, the definition says capabilities); the definition is followed and the example is skipped.
    - certificate_common_name is listed as an optional add field but has no property definition; it is modelled as a string.
    - The password property lists no operations; the prose says it can be updated but never read. No operation to change it is exposed, and it is omitted from results.
    - Data type SLCapabilities is referenced but only SLCapability is defined; modelled as an array of siren/light. The collection operations (list_*, get_*) not shown in any example are inferred from the collection and key-property descriptions.
    - The docs response examples for this API omit the status field of the Device Configuration envelope; status success was added to the examples.
    - Per-property GET operations for pairing fields (address, username, ...) are not exposed; read the pairing instead.
  migrated_from: v1
  curated: true
