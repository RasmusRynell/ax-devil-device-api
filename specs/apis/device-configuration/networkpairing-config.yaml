provenance:
  completeness: partial
  open_questions:
  - 'Example ''Plugins'' uses GET /config/rest/networkpairing/v1/plugins/siren_light_supported, which does not map
    to an operation documented in the API definition section (not attached). Source: https://developer.axis.com/vapix/device-configuration/network-pairing-api/'
  - 'Example ''Get capabilities of paired device'' uses GET /config/rest/networkpairing/v1beta/plugins/siren_light/features/1,
    which does not map to an operation documented in the API definition section (not attached). Source: https://developer.axis.com/vapix/device-configuration/network-pairing-api/'
  - 'add field certificate_common_name of networkpairing.v1.pairings is listed as an operation field but is not
    defined as a property. Source: https://developer.axis.com/vapix/device-configuration/network-pairing-api/'
  - 'property networkpairing.v1.pairings.password lists no operations in the API definition. Source: https://developer.axis.com/vapix/device-configuration/network-pairing-api/'
  - 'The API Definition section of this page is malformed: the Structure tree only shows the root, the pairings
    collection is headed ''id'', and the features/capabilities/siren_light/profiles entities are headed with bare
    names. Entity paths were reconstructed from the use-case examples and the prose (networkpairing.v1.pairings,
    pairings.features, pairings.features.capabilities, plugins, plugins.siren_light, plugins.siren_light.capabilities,
    plugins.siren_light.profiles). Source: https://developer.axis.com/vapix/device-configuration/network-pairing-api/'
  - 'Base path: the plugin-check example uses /config/rest/networkpairing/v1/plugins/siren_light_supported while
    all other examples and the ''Path'' bullets use /config/rest/networkpairing/v1beta (beta API); v1beta is used.
    Source: https://developer.axis.com/vapix/device-configuration/network-pairing-api/'
  - 'The features collection''s key property is ''category'' but the only documented property is ''features_category'';
    the capabilities collection key is ''name''. Source: https://developer.axis.com/vapix/device-configuration/network-pairing-api/'
  - 'Example ''Get capabilities of paired device'' uses GET /config/rest/networkpairing/v1beta/plugins/siren_light/features/1
    and the prose says plugins.siren_light.features.{pairingID}, but the API definition names the collection ''capabilities''
    (Path: /networkpairing/v1beta/plugins/siren_light/capabilities) with property ''supported''. Source: https://developer.axis.com/vapix/device-configuration/network-pairing-api/'
  - 'nice_name is documented twice in the pairings collection (once with datatype string and no attributes, once
    with PairingNiceName). The password property lists no operations (write-only at add; ''can be updated but never
    read'' per prose, but no SET permission is given). Data type SLCapabilities is referenced but only SLCapability
    is defined. Source: https://developer.axis.com/vapix/device-configuration/network-pairing-api/'
  - 'migration: dropped-property-gets: 15 per-property GET operations dropped'
  - 'migration: dropped-keywords: x-inferred x1'
  migrated_from: v1
  curated: false
