    access: admin
  set_configuration_dashboard_title:
    summary: Set the dashboard title of a configuration.
    effect: write
    write: patch
    binding:
      method: PATCH
      path: /configurations/{sensor_id}/dashboardTitle
      body_field: dashboard_title
      body: value
    params:
      type: object
      required:
      - sensorId
      - dashboardTitle
      properties:
        sensorId:
          $ref: '#/types/SensorId'
        dashboardTitle:
          type: string
          description: Dashboard title
    access: admin
    examples:
    - title: Set a single configuration
      request:
        path: /configurations/My-SensorId/dashboardTitle
        body:
          data: newDashboard
      response:
        status: 200
        body:
          status: success
      source: https://developer.axis.com/vapix/device-configuration/environmental-sensor/air-quality-api/
  set_configuration_max_aqi:
    summary: Set the maximum AQI of a configuration.
