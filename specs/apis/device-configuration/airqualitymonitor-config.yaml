operations:
  get_all:
    summary: All data of the Air Quality monitor API API.
    effect: read
    binding: {method: GET, path: ''}
    result: {$ref: '#/types/Airqualitymonitor'}
  list_configurations:
    summary: List the configurations.
    effect: read
    binding: {method: GET, path: /configurations}
    result:
      type: array
      items: {$ref: '#/types/Configuration'}
    examples:
    - title: Get all configurations
      request: {path: /configurations}
      response:
        status: 200
        body:
          status: success
          data:
          - cloudMetadataEnable: false
            cloudMetadataFrequency: 1
            dashboardItems:
              hidden: []
              visible:
              - TEMPERATURE
              - HUMIDITY
              - CO2
              - NOX
              - PM1_0
              - PM2_5
              - PM4_0
              - PM10_0
              - VAPING
              - VOC
              - AQI
            dashboardTitle: Dashboard
            maxAqi: 500
            maxCo2: 40000
            maxHumidity: 100
            maxNox: 500
            maxPm10p0: 1000
            maxPm1p0: 1000
            maxPm2p5: 1000
            maxPm4p0: 1000
            maxTemperature: 45
            maxVoc: 500
            minAqi: 0
            minCo2: 0
            minHumidity: 0
            minNox: 0
            minPm10p0: 0
            minPm1p0: 0
            minPm2p5: 0
            minPm4p0: 0
            minTemperature: -10
            minVoc: 0
            sensorId: My-SensorId
            storageEnable: true
            storageMode: 1
            temperatureScale: CELSIUS
            validationPeriodAqi: 0
            validationPeriodCo2: 0
            validationPeriodHumidity: 0
            validationPeriodNox: 0
            validationPeriodPm10p0: 0
            validationPeriodPm1p0: 0
            validationPeriodPm2p5: 0
            validationPeriodPm4p0: 0
            validationPeriodTemperature: 0
            validationPeriodVaping: 0
            validationPeriodVoc: 0
            vapeSensitivity: 3
      source: https://developer.axis.com/vapix/device-configuration/environmental-sensor/air-quality-api/
  get_configuration:
    summary: Get one configuration.
    effect: read
    binding: {method: GET, path: '/configurations/{sensorId}'}
    params:
      type: object
      x-name: ConfigurationSensorIdRequest
      required: [sensorId]
      properties:
        sensorId: {description: Sensor ID}
    result: {$ref: '#/types/Configuration'}
    examples:
    - title: Get a single configuration
      request: {path: /configurations/My-SensorId/dashboardTitle}
      response:
        status: 200
        body: {status: success, data: Dashboard}
      source: https://developer.axis.com/vapix/device-configuration/environmental-sensor/air-quality-api/
  update_configuration:
    summary: Update a configuration.
    effect: write
    write: patch
    binding: {method: PATCH, path: '/configurations/{sensorId}', body: object}
    params: {$ref: '#/types/UpdateConfigurationRequest'}
    examples:
    - title: Set all configurations
      request:
        path: /configurations/My-SensorId
        body:
          data:
            cloudMetadataEnable: true
            cloudMetadataFrequency: 60
            dashboardItems:
              hidden: [PM1_0, PM2_5, PM4_0, PM10_0]
              visible: [TEMPERATURE, HUMIDITY, CO2, NOX, VAPING, VOC, AQI]
            dashboardTitle: newDashboard
            maxAqi: 111
            maxCo2: 11111
            maxHumidity: 66
            maxNox: 5
            maxPm10p0: 55
            maxPm1p0: 99
            maxPm2p5: 9
            maxPm4p0: 89
            maxTemperature: 40
            maxVoc: 321
            minAqi: 1
            minCo2: 27
            minHumidity: 64
            minNox: 37
            minPm10p0: 555
            minPm1p0: 777
            minPm2p5: 96
            minPm4p0: 45
            minTemperature: -1
            minVoc: 4
            storageEnable: false
            storageMode: 2
            temperatureScale: FAHRENHEIT
            validationPeriodAqi: 1
            validationPeriodCo2: 2
            validationPeriodHumidity: 3
            validationPeriodNox: 4
            validationPeriodPm10p0: 5
            validationPeriodPm1p0: 6
            validationPeriodPm2p5: 7
            validationPeriodPm4p0: 8
            validationPeriodTemperature: 9
            validationPeriodVaping: 10
            validationPeriodVoc: 11
            vapeSensitivity: 5
      response:
        status: 200
        body: {status: success}
      source: https://developer.axis.com/vapix/device-configuration/environmental-sensor/air-quality-api/
    - title: Set a single configuration
      request:
        path: /configurations/My-SensorId/dashboardTitle
        body: {data: newDashboard}
      response:
        status: 200
        body: {status: success}
      source: https://developer.axis.com/vapix/device-configuration/environmental-sensor/air-quality-api/
  set_configuration_cloud_metadata_enable:
    summary: Set the cloud metadata enable of a configuration.
    effect: write
    write: patch
    binding:
      method: PATCH
      path: /configurations/{sensorId}/cloudMetadataEnable
      body_field: cloudMetadataEnable
      body: value
    params:
      type: object
      required: [sensorId, cloudMetadataEnable]
      properties:
