        type: array
        items: {$ref: '#/types/Configuration'}
      sensors:
        type: array
        items: {$ref: '#/types/Sensor'}
  Configuration:
    type: object
    description: Configuration of air quality monitor
    required: [sensorId]
    x-read-only: [sensorId]
    properties:
      cloudMetadataEnable: {type: boolean, description: Cloud metadata enable}
      cloudMetadataFrequency: {description: Cloud metadata frequency}
      dashboardItems: {description: Dashboard items}
      dashboardTitle: {type: string, description: Dashboard title}
      maxAqi: {description: Maximum AQI}
      maxCo2: {description: Maximum CO2}
      maxHumidity: {description: Maximum humidity}
      maxNox: {description: Maximum NOx}
      maxPm10p0: {description: Maximum PM10.0}
      maxPm1p0: {description: Maximum PM1.0}
      maxPm2p5: {description: Maximum PM2.5}
      maxPm4p0: {description: Maximum PM4.0}
      maxTemperature: {description: Maximum temperature}
      maxVoc: {description: Maximum VOC}
      minAqi: {description: Minimum AQI}
      minCo2: {description: Minimum CO2}
      minHumidity: {description: Minimum humidity}
      minNox: {description: Minimum NOx}
      minPm10p0: {description: Minimum PM10.0}
      minPm1p0: {description: Minimum PM1.0}
      minPm2p5: {description: Minimum PM2.5}
      minPm4p0: {description: Minimum PM4.0}
      minTemperature: {description: Minimum temperature}
      minVoc: {description: Minimum VOC}
      sensorId: {description: Sensor ID}
      storageEnable: {type: boolean, description: Storage enable}
      storageMode: {description: Storage mode}
      temperatureScale: {description: Temperature scale unit}
      validationPeriodAqi: {description: Validation period AQI}
      validationPeriodCo2: {description: Validation period CO2}
      validationPeriodHumidity: {description: Validation period humidity}
      validationPeriodNox: {description: Validation period NOx}
      validationPeriodPm10p0: {description: Validation period PM10.0}
      validationPeriodPm1p0: {description: Validation period PM1.0}
      validationPeriodPm2p5: {description: Validation period PM2.5}
      validationPeriodPm4p0: {description: Validation period PM4.0}
      validationPeriodTemperature: {description: Validation period temperature}
      validationPeriodVaping: {description: Validation period vaping}
      validationPeriodVoc: {description: Validation period VOC}
      vapeSensitivity: {description: Vape sensitivity}
