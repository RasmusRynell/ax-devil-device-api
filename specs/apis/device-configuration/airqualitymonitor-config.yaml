format: 2
id: airqualitymonitor-config
name: Air Quality monitor API
summary: Read and configure air quality sensors, their limits and dashboard, and query their history.
section: device-configuration
family: dca
status: released
python:
  module: air_quality_monitor
  class: AirQualityMonitor
docs:
- https://developer.axis.com/vapix/device-configuration/environmental-sensor/air-quality-api/
access: admin
discovery:
- dca:
    api: airqualitymonitor
    version: v1
binding:
  root: /config/rest/airqualitymonitor/v1
types:
  AirQualityMonitor:
    type: object
    description: The whole API tree.
    properties:
      configurations:
        type: array
        items:
          $ref: '#/types/Configuration'
      sensors:
        type: array
        items:
          $ref: '#/types/Sensor'
  Configuration:
    type: object
    description: Configuration of air quality monitor
    required:
    - sensorId
    x-read-only:
    - sensorId
    properties:
      cloudMetadataEnable:
        type: boolean
        description: Cloud metadata enable
      cloudMetadataFrequency:
        $ref: '#/types/CloudMetadataFrequency'
        description: Cloud metadata frequency
      dashboardItems:
        $ref: '#/types/DashboardItems'
        description: Dashboard items
      dashboardTitle:
        type: string
        description: Dashboard title
      maxAqi:
        $ref: '#/types/Limit'
        description: Maximum AQI
      maxCo2:
        $ref: '#/types/Limit'
        description: Maximum CO2
      maxHumidity:
        $ref: '#/types/Limit'
        description: Maximum humidity
      maxNox:
        $ref: '#/types/Limit'
        description: Maximum NOx
      maxPm10p0:
        $ref: '#/types/Limit'
        description: Maximum PM10.0
      maxPm1p0:
        $ref: '#/types/Limit'
        description: Maximum PM1.0
      maxPm2p5:
        $ref: '#/types/Limit'
        description: Maximum PM2.5
      maxPm4p0:
        $ref: '#/types/Limit'
        description: Maximum PM4.0
      maxTemperature:
        $ref: '#/types/Limit'
        description: Maximum temperature
      maxVoc:
        $ref: '#/types/Limit'
        description: Maximum VOC
      minAqi:
        $ref: '#/types/Limit'
        description: Minimum AQI
      minCo2:
        $ref: '#/types/Limit'
        description: Minimum CO2
      minHumidity:
        $ref: '#/types/Limit'
        description: Minimum humidity
      minNox:
        $ref: '#/types/Limit'
        description: Minimum NOx
      minPm10p0:
        $ref: '#/types/Limit'
        description: Minimum PM10.0
      minPm1p0:
        $ref: '#/types/Limit'
        description: Minimum PM1.0
      minPm2p5:
        $ref: '#/types/Limit'
        description: Minimum PM2.5
      minPm4p0:
        $ref: '#/types/Limit'
        description: Minimum PM4.0
      minTemperature:
        $ref: '#/types/Limit'
        description: Minimum temperature
      minVoc:
        $ref: '#/types/Limit'
        description: Minimum VOC
      sensorId:
        $ref: '#/types/SensorId'
        description: Sensor ID
      storageEnable:
        type: boolean
        description: Storage enable
      storageMode:
        $ref: '#/types/StorageMode'
        description: Storage mode
      temperatureScale:
        $ref: '#/types/TemperatureScale'
        description: Temperature scale unit
      validationPeriodAqi:
        $ref: '#/types/ValidationPeriod'
        description: Validation period AQI
      validationPeriodCo2:
        $ref: '#/types/ValidationPeriod'
        description: Validation period CO2
      validationPeriodHumidity:
        $ref: '#/types/ValidationPeriod'
        description: Validation period humidity
      validationPeriodNox:
        $ref: '#/types/ValidationPeriod'
        description: Validation period NOx
      validationPeriodPm10p0:
        $ref: '#/types/ValidationPeriod'
        description: Validation period PM10.0
      validationPeriodPm1p0:
        $ref: '#/types/ValidationPeriod'
        description: Validation period PM1.0
      validationPeriodPm2p5:
        $ref: '#/types/ValidationPeriod'
        description: Validation period PM2.5
      validationPeriodPm4p0:
        $ref: '#/types/ValidationPeriod'
        description: Validation period PM4.0
      validationPeriodTemperature:
        $ref: '#/types/ValidationPeriod'
        description: Validation period temperature
      validationPeriodVaping:
        $ref: '#/types/ValidationPeriod'
        description: Validation period vaping
      validationPeriodVoc:
        $ref: '#/types/ValidationPeriod'
        description: Validation period VOC
      vapeSensitivity:
        $ref: '#/types/VapeSensitivity'
        description: Vape sensitivity
  Sensor:
    type: object
    description: Status of air quality sensor
    required:
    - sensorId
    properties:
      connected:
        type: boolean
        description: Sensor connection status
      defaultSensor:
        type: boolean
        description: True if it's a default sensor
      sensorId:
        $ref: '#/types/SensorId'
        description: Sensor ID
      type:
        type: string
        description: Sensor type name
  UpdateConfigurationRequest:
    type: object
    description: Arguments of ``update_configuration``.
    required:
    - sensorId
    properties:
      sensorId:
        $ref: '#/types/SensorId'
        description: Sensor ID
      cloudMetadataEnable:
        type: boolean
        description: Cloud metadata enable
      cloudMetadataFrequency:
        $ref: '#/types/CloudMetadataFrequency'
        description: Cloud metadata frequency
      dashboardItems:
        $ref: '#/types/DashboardItems'
        description: Dashboard items
      dashboardTitle:
        type: string
        description: Dashboard title
      maxAqi:
        $ref: '#/types/Limit'
        description: Maximum AQI
      maxCo2:
        $ref: '#/types/Limit'
        description: Maximum CO2
      maxHumidity:
        $ref: '#/types/Limit'
        description: Maximum humidity
      maxNox:
        $ref: '#/types/Limit'
        description: Maximum NOx
      maxPm10p0:
        $ref: '#/types/Limit'
        description: Maximum PM10.0
      maxPm1p0:
        $ref: '#/types/Limit'
        description: Maximum PM1.0
      maxPm2p5:
        $ref: '#/types/Limit'
        description: Maximum PM2.5
      maxPm4p0:
        $ref: '#/types/Limit'
        description: Maximum PM4.0
      maxTemperature:
        $ref: '#/types/Limit'
        description: Maximum temperature
      maxVoc:
        $ref: '#/types/Limit'
        description: Maximum VOC
      minAqi:
        $ref: '#/types/Limit'
        description: Minimum AQI
      minCo2:
        $ref: '#/types/Limit'
        description: Minimum CO2
      minHumidity:
        $ref: '#/types/Limit'
        description: Minimum humidity
      minNox:
        $ref: '#/types/Limit'
        description: Minimum NOx
      minPm10p0:
        $ref: '#/types/Limit'
        description: Minimum PM10.0
      minPm1p0:
        $ref: '#/types/Limit'
        description: Minimum PM1.0
      minPm2p5:
        $ref: '#/types/Limit'
        description: Minimum PM2.5
      minPm4p0:
        $ref: '#/types/Limit'
        description: Minimum PM4.0
      minTemperature:
        $ref: '#/types/Limit'
        description: Minimum temperature
      minVoc:
        $ref: '#/types/Limit'
        description: Minimum VOC
      storageEnable:
        type: boolean
        description: Storage enable
      storageMode:
        $ref: '#/types/StorageMode'
        description: Storage mode
      temperatureScale:
        $ref: '#/types/TemperatureScale'
        description: Temperature scale unit
      validationPeriodAqi:
        $ref: '#/types/ValidationPeriod'
        description: Validation period AQI
      validationPeriodCo2:
        $ref: '#/types/ValidationPeriod'
        description: Validation period CO2
      validationPeriodHumidity:
        $ref: '#/types/ValidationPeriod'
        description: Validation period humidity
      validationPeriodNox:
        $ref: '#/types/ValidationPeriod'
        description: Validation period NOx
      validationPeriodPm10p0:
        $ref: '#/types/ValidationPeriod'
        description: Validation period PM10.0
      validationPeriodPm1p0:
        $ref: '#/types/ValidationPeriod'
        description: Validation period PM1.0
      validationPeriodPm2p5:
        $ref: '#/types/ValidationPeriod'
        description: Validation period PM2.5
      validationPeriodPm4p0:
        $ref: '#/types/ValidationPeriod'
        description: Validation period PM4.0
      validationPeriodTemperature:
        $ref: '#/types/ValidationPeriod'
        description: Validation period temperature
      validationPeriodVaping:
        $ref: '#/types/ValidationPeriod'
        description: Validation period vaping
      validationPeriodVoc:
        $ref: '#/types/ValidationPeriod'
        description: Validation period VOC
      vapeSensitivity:
        $ref: '#/types/VapeSensitivity'
        description: Vape sensitivity
  SensorId:
    type: string
    description: Identifier of an air quality sensor; the key of both collections.
  Limit:
    type: number
    description: Lower or upper bound of a measured value, in the unit of that measurement.
  ValidationPeriod:
    type: integer
    description: Validation period of a measurement.
  CloudMetadataFrequency:
    type: integer
    description: Cloud metadata frequency.
  StorageMode:
    type: integer
    description: Storage mode.
  VapeSensitivity:
    type: integer
    description: Vape detection sensitivity.
  TemperatureScale:
    type: string
    description: Temperature scale unit, for example CELSIUS or FAHRENHEIT.
  MeasurementCategory:
    type: string
    description: Measurement category, for example PM2_5. The dashboard item names are the known categories.
  DashboardItems:
    type: object
    description: Which measurements the dashboard shows or hides.
    properties:
      hidden:
        type: array
        items:
          type: string
      visible:
        type: array
        items:
          type: string
  HistoryDataResult:
    type: object
    description: Historical measurements; measurement[i] was taken at timestamp[i].
    properties:
      measurement:
        type: array
        items:
          type: number
      timestamp:
        type: array
        items:
          type: integer
          description: Unix time in seconds.
  VapingRecord:
    type: object
    description: Times when vaping was detected.
    properties:
      timestamp:
        type: array
        items:
          type: integer
          description: Unix time in seconds.
  GetHistoryDataRequest:
    type: object
    description: Arguments of ``get_history_data``.
    required:
    - sensorId
    - category
    - startTime
    - endTime
    properties:
      sensorId:
        $ref: '#/types/SensorId'
      category:
        $ref: '#/types/MeasurementCategory'
      startTime:
        type: integer
        description: Start of the period, Unix time in seconds.
      endTime:
        type: integer
        description: End of the period, Unix time in seconds.
  GetVapingRecordRequest:
    type: object
    description: Arguments of ``get_vaping_record``.
    required:
    - sensorId
    - startTime
    - endTime
    properties:
      sensorId:
        $ref: '#/types/SensorId'
      startTime:
        type: integer
        description: Start of the period, Unix time in seconds.
      endTime:
        type: integer
        description: End of the period, Unix time in seconds.
  SensorIdRequest:
    type: object
    description: Arguments of the per-sensor reads.
    required:
    - sensorId
    properties:
      sensorId:
        $ref: '#/types/SensorId'
operations:
  get_all:
    summary: All data of the Air Quality monitor API API.
    effect: read
    binding:
      method: GET
      path: ''
    result:
      $ref: '#/types/AirQualityMonitor'
  list_configurations:
    summary: List the configurations.
    effect: read
    binding:
      method: GET
      path: /configurations
    result:
      type: array
      items:
        $ref: '#/types/Configuration'
    examples:
    - title: Get all configurations
      request:
        path: /configurations
      response:
        status: 200
        body:
          status: success
          data:
          - cloudMetadataEnable: false
            cloudMetadataFrequency: 1
            dashboardItems:
              hidden: []
              visible:
              - TEMPERATURE
              - HUMIDITY
              - CO2
              - NOX
              - PM1_0
              - PM2_5
              - PM4_0
              - PM10_0
              - VAPING
              - VOC
              - AQI
            dashboardTitle: Dashboard
            maxAqi: 500
            maxCo2: 40000
            maxHumidity: 100
            maxNox: 500
            maxPm10p0: 1000
            maxPm1p0: 1000
            maxPm2p5: 1000
            maxPm4p0: 1000
            maxTemperature: 45
            maxVoc: 500
            minAqi: 0
            minCo2: 0
            minHumidity: 0
            minNox: 0
            minPm10p0: 0
            minPm1p0: 0
            minPm2p5: 0
            minPm4p0: 0
            minTemperature: -10
            minVoc: 0
            sensorId: My-SensorId
            storageEnable: true
            storageMode: 1
            temperatureScale: CELSIUS
            validationPeriodAqi: 0
            validationPeriodCo2: 0
            validationPeriodHumidity: 0
            validationPeriodNox: 0
            validationPeriodPm10p0: 0
            validationPeriodPm1p0: 0
            validationPeriodPm2p5: 0
            validationPeriodPm4p0: 0
            validationPeriodTemperature: 0
            validationPeriodVaping: 0
            validationPeriodVoc: 0
            vapeSensitivity: 3
      source: https://developer.axis.com/vapix/device-configuration/environmental-sensor/air-quality-api/
    access: viewer
  get_configuration:
    summary: Get one configuration.
    effect: read
    binding:
      method: GET
      path: /configurations/{sensor_id}
    params:
      type: object
      x-name: SensorIdRequest
      required:
      - sensorId
      properties:
        sensorId:
          $ref: '#/types/SensorId'
    result:
      $ref: '#/types/Configuration'
    examples:
    - title: Get a single configuration
      request:
        path: /configurations/My-SensorId/dashboardTitle
      response:
        status: 200
        body:
          status: success
          data: Dashboard
      source: https://developer.axis.com/vapix/device-configuration/environmental-sensor/air-quality-api/
      x-contract:
        skip: Documents the per-property read of dashboardTitle (a bare string), which has no operation here; get_configuration
          returns the whole Configuration.
    access: viewer
  update_configuration:
    summary: Update a configuration.
    effect: write
    write: patch
    binding:
      method: PATCH
      path: /configurations/{sensor_id}
      body: object
    params:
      $ref: '#/types/UpdateConfigurationRequest'
    examples:
    - title: Set all configurations
      request:
        path: /configurations/My-SensorId
        body:
          data:
            cloudMetadataEnable: true
            cloudMetadataFrequency: 60
            dashboardItems:
              hidden:
              - PM1_0
              - PM2_5
              - PM4_0
              - PM10_0
              visible:
              - TEMPERATURE
              - HUMIDITY
              - CO2
              - NOX
              - VAPING
              - VOC
              - AQI
            dashboardTitle: newDashboard
            maxAqi: 111
            maxCo2: 11111
            maxHumidity: 66
            maxNox: 5
            maxPm10p0: 55
            maxPm1p0: 99
            maxPm2p5: 9
            maxPm4p0: 89
            maxTemperature: 40
            maxVoc: 321
            minAqi: 1
            minCo2: 27
            minHumidity: 64
            minNox: 37
            minPm10p0: 555
            minPm1p0: 777
            minPm2p5: 96
            minPm4p0: 45
            minTemperature: -1
            minVoc: 4
            storageEnable: false
            storageMode: 2
            temperatureScale: FAHRENHEIT
            validationPeriodAqi: 1
            validationPeriodCo2: 2
            validationPeriodHumidity: 3
            validationPeriodNox: 4
            validationPeriodPm10p0: 5
            validationPeriodPm1p0: 6
            validationPeriodPm2p5: 7
            validationPeriodPm4p0: 8
            validationPeriodTemperature: 9
            validationPeriodVaping: 10
            validationPeriodVoc: 11
            vapeSensitivity: 5
      response:
        status: 200
        body:
          status: success
      source: https://developer.axis.com/vapix/device-configuration/environmental-sensor/air-quality-api/
    access: admin
    round_trip:
      from: Configuration
  set_configuration_cloud_metadata_enable:
    summary: Set the cloud metadata enable of a configuration.
    effect: write
    write: patch
    binding:
      method: PATCH
      path: /configurations/{sensor_id}/cloudMetadataEnable
      body_field: cloud_metadata_enable
      body: value
    params:
      type: object
      required:
      - sensorId
      - cloudMetadataEnable
      properties:
        sensorId:
          $ref: '#/types/SensorId'
        cloudMetadataEnable:
          type: boolean
          description: Cloud metadata enable
    access: admin
  set_configuration_cloud_metadata_frequency:
    summary: Set the cloud metadata frequency of a configuration.
    effect: write
    write: patch
    binding:
      method: PATCH
      path: /configurations/{sensor_id}/cloudMetadataFrequency
      body_field: cloud_metadata_frequency
      body: value
    params:
      type: object
      required:
      - sensorId
      - cloudMetadataFrequency
      properties:
        sensorId:
          $ref: '#/types/SensorId'
        cloudMetadataFrequency:
          $ref: '#/types/CloudMetadataFrequency'
          description: Cloud metadata frequency
    access: admin
  set_configuration_dashboard_items:
    summary: Set the dashboard items of a configuration.
    effect: write
    write: patch
    binding:
      method: PATCH
      path: /configurations/{sensor_id}/dashboardItems
      body_field: dashboard_items
      body: value
    params:
