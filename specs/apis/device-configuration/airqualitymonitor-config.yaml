  class: Airqualitymonitor
docs:
- https://developer.axis.com/vapix/device-configuration/environmental-sensor/air-quality-api/
access: admin
discovery:
- dca: {api: airqualitymonitor, version: v1}

binding: {root: /config/rest/airqualitymonitor/v1}

types:
  Airqualitymonitor:
    type: object
    description: The whole API tree.
    properties:
