- url: https://developer.axis.com/vapix/device-configuration/environmental-sensor/air-quality-api/
  sha256_md: 8dd422efc8471ad832ea041a7c580aa075ac5178f869d2593c04ec35dc9fba38
  retrieved_at: '2026-10-11'
provenance:
  completeness: partial
  open_questions:
  - The docs have no Data types section. Field types, required request fields and the timestamp unit (Unix seconds) are inferred
    from the examples; limits are typed number, the other numeric settings integer.
  - temperatureScale, storageMode, vapeSensitivity, the history category and the dashboard item names have no documented value
    sets; CELSIUS, FAHRENHEIT, PM2_5 and the dashboard items appear only in examples.
  - The 40 per-property GET operations (GET /configurations/{sensor_id}/{property}) are documented but not modelled; get_configuration
    returns the whole configuration.
  - Error codes are not documented.
  migrated_from: v1
  curated: true
