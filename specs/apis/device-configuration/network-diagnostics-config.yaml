format: 2
id: network-diagnostics-config
name: Network diagnostics API
summary: Diagnose network issues with ping and TCP reachability tests, active connection lists and TCP retransmission statistics.
section: device-configuration
family: dca
status: released
python:
  module: network_diagnostics
  class: NetworkDiagnostics
docs:
- https://developer.axis.com/vapix/device-configuration/network-diagnostics/
access: admin
discovery:
- dca: {api: network-diagnostics, version: v1}

binding: {root: /config/rest/network-diagnostics/v1}

types:
  ConnectionEntry:
    type: object
    description: A single network connection entry
    required: [address, pid, port, process, protocol, service]
    x-nullable: [state]
    properties:
      address:
        $ref: '#/types/IpAddress'
        description: Local bound or remote peer IP address of the connection
      pid: {$ref: '#/types/PositiveInteger', description: Process ID of the owning process}
      port: {$ref: '#/types/PortNumber', description: Port number of the connection}
      process: {type: string, description: Name of the owning process}
      protocol: {$ref: '#/types/Protocol', description: Network protocol used by the connection}
      service:
        type: string
        description: IANA service name associated with the port number, e.g. http, https or ssh; empty if the port
          has no registered service name
      state: {$ref: '#/types/ConnectionState', description: Current state of the connection}
  ConnectionList:
    type: array
    items: {$ref: '#/types/ConnectionEntry'}
    description: A list of active network connections
  ConnectionState:
    type: string
    enum: [LISTEN, ESTABLISHED, TIME_WAIT, STATELESS]
    description: Connection state; UDP connections use STATELESS
  IpAddress: {type: string, description: IPv4 or IPv6 address type}
  IsoTimestamp:
    type: string
    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
    description: Timestamp of the spike in ISO 8601 RFC3339 format
  PingRequest:
    type: object
    description: Parameters for a ping request
    required: [address]
    properties:
      address: {$ref: '#/types/IpAddress', description: The IP address to ping}
  PortNumber: {type: integer, minimum: 1, maximum: 65535, description: A valid TCP or UDP port number}
  PositiveInteger:
    type: integer
    minimum: 0
    description: An integer which is either zero or greater than zero
  Protocol: {type: string, enum: [TCP, UDP], description: Network protocol identifier}
  TcpRetransmissionSpike:
    type: object
    description: Representation of a TCP retransmission spike
    required: [retransmissions, timestamp]
    properties:
      retransmissions: {$ref: '#/types/PositiveInteger', description: Magnitude of the spike}
      timestamp: {$ref: '#/types/IsoTimestamp', description: Timestamp of the spike}
  TcpTestRequest:
    type: object
    description: Data to be used in TCP connection request
    required: [address, port]
    x-nullable: [interface, timeout]
    properties:
      address: {$ref: '#/types/IpAddress', description: The IP address to send TCP connection request to}
      interface:
        type: string
        description: The local network interface to bind the connection to, such as eth0. If omitted, the operating
          system routing table will select the outgoing interface automatically
      port:
        $ref: '#/types/PortNumber'
        description: The port number to be used for TCP connection request
      timeout:
        $ref: '#/types/PositiveInteger'
        description: Optional timeout in seconds for TCP connection request. If omitted or set to 0, default 1 second-timeout
          is used
  TestResult:
    type: object
    description: Connectivity test result
    required: [success]
    properties:
      success: {type: boolean, description: Device or service reachability test result}
  NetworkDiagnostics:
    type: object
    description: The whole API tree.
    properties:
      connectivity: {$ref: '#/types/Connectivity'}
      netstats: {$ref: '#/types/Netstats'}
  Connectivity:
    type: object
    description: Interface for network connectivity tests.
    properties: {}
  Netstats:
    type: object
    description: Interface that retrieves network statistics
    required: [samplingInterval]
    x-read-only: [samplingInterval]
    properties:
      samplingInterval:
        type: integer
        description: The interval at which retransmissions and spikes are sampled in seconds.

operations:
  get_all:
    summary: All data of the Network diagnostics API.
    effect: read
    binding: {method: GET, path: ''}
    result: {$ref: '#/types/NetworkDiagnostics'}
  connection_list:
    summary: Get a list of active network connections.
    effect: action
    binding: {method: POST, path: /connectivity/connectionList, body: object}
    result:
      type: array
      items: {$ref: '#/types/ConnectionEntry'}
    examples:
    - title: Get active network connections
      response:
        status: 200
        body:
          status: success
          data:
          - {protocol: UDP, address: 0.0.0.0, port: 49152, state: STATELESS, service: unknown, pid: 5678, process: myapp}
          - {protocol: TCP, address: 192.168.0.100, port: 443, state: ESTABLISHED, service: https, pid: 1234, process: nginx}
      source: https://developer.axis.com/vapix/device-configuration/network-diagnostics/
  ping_test:
    summary: Test if an address is reachable via ICMP ping.
    effect: action
    binding: {method: POST, path: /connectivity/pingTest, body: object}
    params: {$ref: '#/types/PingRequest'}
    result: {$ref: '#/types/TestResult'}
    examples:
    - title: Ping test passed
      response:
        status: 200
        body: {status: success, data: {success: true}}
      source: https://developer.axis.com/vapix/device-configuration/network-diagnostics/
    - title: Ping test failed
      response:
        status: 200
        body: {status: success, data: {success: false}}
      source: https://developer.axis.com/vapix/device-configuration/network-diagnostics/
  tcp_test:
    summary: Test whether a service is reachable by performing a TCP connection request.
    description: Omitting the timeout or giving 0 uses the default of 1 second. Without an interface the routing table selects the outgoing interface.
    effect: action
    binding: {method: POST, path: /connectivity/tcpTest, body: object}
    params: {$ref: '#/types/TcpTestRequest'}
    result: {$ref: '#/types/TestResult'}
  get_netstats:
    summary: Get the network statistics settings.
    effect: read
    binding: {method: GET, path: /netstats}
    result: {$ref: '#/types/Netstats'}
  get_sampling_interval:
    summary: Get the interval (s) at which retransmissions and spikes are sampled.
    effect: read
    binding: {method: GET, path: /netstats/samplingInterval}
    result: {type: integer}
    examples:
    - title: Get sampling interval
      request: {path: /netstats/samplingInterval}
      response:
        status: 200
        body: {status: success, data: 300}
      source: https://developer.axis.com/vapix/device-configuration/network-diagnostics/
  tcp_retransmission_spikes:
    summary: Get the last N TCP retransmission spikes.
    description: Specifying 0 returns all buffered spikes. The device stores up to 1024 spikes and replaces the oldest ones when the limit is reached.
    effect: action
    binding: {method: POST, path: /netstats/tcpRetransmissionSpikes, body_field: count, body: value}
    positional: [count]
    params:
      type: object
      required: [count]
      properties:
        count: {$ref: '#/types/PositiveInteger', description: Number of spikes to get; 0 gets all recorded spikes.}
    result:
      type: array
      items: {$ref: '#/types/TcpRetransmissionSpike'}
    examples:
    - title: Get TCP retransmission spikes
      response:
        status: 200
        body:
          status: success
          data:
          - {retransmissions: 807, timestamp: '2026-02-19T11:00:08Z'}
          - {retransmissions: 103, timestamp: '2026-02-19T11:26:58Z'}
          - {retransmissions: 375, timestamp: '2026-02-19T11:26:31Z'}
          - {retransmissions: 511, timestamp: '2026-02-19T11:26:28Z'}
      source: https://developer.axis.com/vapix/device-configuration/network-diagnostics/
  tcp_retransmissions:
    summary: Get the number of TCP retransmissions in the last N hours.
    description: Specifying 0 returns the total recorded on the device. The device buffers a limited number of samples and overwrites older data after a few days.
    effect: action
    binding: {method: POST, path: /netstats/tcpRetransmissions, body_field: hours, body: value}
    positional: [hours]
    params:
      type: object
      required: [hours]
      properties:
        hours: {$ref: '#/types/PositiveInteger', description: Number of hours to look back; 0 gets all recorded retransmissions.}
    result: {type: integer, minimum: 0}
    examples:
    - title: Get TCP retransmissions
      response:
        status: 200
        body: {status: success, data: 1515}
      source: https://developer.axis.com/vapix/device-configuration/network-diagnostics/

sources:
- url: https://developer.axis.com/vapix/device-configuration/network-diagnostics/
  sha256_md: 5e39873fcd3bb0b42fc0b3bf4a4b7a12870ce19ccc2c4f46871b5113dd1c3cc5
  retrieved_at: '2026-10-11'

provenance:
  completeness: complete
  open_questions:
  - The docs show the tcpTest response as a boolean, while the TestResult table says an object with success; the table is followed.
  - Several docs examples use invalid URLs built from the dotted object path (network-diagnostics.v1.connectivity.pingTest); the framework path is used. They show no request bodies, so they are response-only.
  migrated_from: v1
  curated: true
