operations:
  get_all:
    summary: All data of the Speaker display notification API.
    effect: read
    binding: {method: GET, path: ''}
  simple:
    summary: A simple notification which can either be static or scrolling.
    effect: action
    binding: {method: POST, path: /simple, body: object}
    params:
      type: object
      properties:
        backgroundColor:
          $ref: '#/types/ColorFormat'
          description: Background color. Format is RGB in hex 6 digits '#RRGGBB'.
        duration:
          $ref: '#/types/SimpleDurationObject'
          description: Duration. Default is infinite repetitions.
        message:
          $ref: '#/types/SimpleMessageStr'
          description: The display message. Max length is 1000 characters.
        scrollDirection:
          $ref: '#/types/ScrollDirectionEnum'
          description: The scrolling direction. Can be either from right to left or bottom to top.
        scrollSpeed:
          $ref: '#/types/ScrollSpeedInt'
          description: Message scroll speed. 1 is slow and 10 is fast. 0 means no scrolling.
        textColor:
          $ref: '#/types/ColorFormat'
          description: The color of the message letters. Format is RGB in hex 6 digits '#RRGGBB'.
        textSize:
          $ref: '#/types/TextSizeEnum'
          description: The text size. Can be either small, medium or large.
    result: {$ref: '#/types/NotificationResponse'}
    examples:
    - title: Send a simple notification with horizontally scrolling large size text
      request:
        path: /simple
        body:
          data:
            message: A horizontally scrolling notification
            textColor: '#000000'
            backgroundColor: '#FFFFFF'
            textSize: large
            scrollDirection: fromRightToLeft
            scrollSpeed: 5
            duration: {type: repetitions, value: 3}
      response:
        status: 200
        body:
          status: success
          data: {duration: 15000}
      source: https://developer.axis.com/vapix/device-configuration/speaker-display-notification/
    - title: Send a simple notification with vertically scrolling medium size text
      request:
        path: /simple
        body:
          data:
            message: A vertically scrolling notification
            textColor: '#FFFFFF'
            backgroundColor: '#000000'
            textSize: medium
            scrollDirection: fromBottomToTop
            scrollSpeed: 8
            duration: {type: time, value: 10000}
      response:
        status: 200
        body:
          status: success
          data: {duration: 10000}
      source: https://developer.axis.com/vapix/device-configuration/speaker-display-notification/
    - title: Send a simple notification with non-scrolling medium size text with indefinite duration
      request:
        path: /simple
        body:
          data:
            message: A static text notification
            textColor: '#FFFFFF'
            backgroundColor: '#000000'
            textSize: medium
            scrollSpeed: 0
      response:
        status: 200
        body:
          status: success
          data: {duration: 0}
      source: https://developer.axis.com/vapix/device-configuration/speaker-display-notification/
  stop:
