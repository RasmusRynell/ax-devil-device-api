format: 2
id: lldp-config
name: LLDP Configuration API
summary: Activate and deactivate LLDP (Link Layer Discovery Protocol) and read neighbor information.
section: device-configuration
family: dca
status: released
python:
  module: lldp
  class: Lldp
docs:
- https://developer.axis.com/vapix/device-configuration/lldp-configuration-api/
access: admin
discovery:
- dca: {api: lldp, version: v1}

binding: {root: /config/rest/lldp/v1}

types:
  ChassisID:
    type: object
    description: The chassis ID type
    required: [subType, value]
    properties:
      subType: {$ref: '#/types/ChassisIDSubType', description: Chassis ID subtype}
      value: {type: string, description: A chassis ID of the type specified by the subType field}
  ChassisIDSubType:
    type: string
    enum:
    - ChassisComponent
    - InterfaceAlias
    - PortComponent
    - MACAddress
    - NetworkAddress
    - InterfaceName
    - LocallyAssigned
    description: The type of the identifier used for the chassis.
  MgmtIP:
    type: object
    description: The management IP type
    required: [subType, value]
    properties:
      subType: {$ref: '#/types/MgmtIPSubType', description: Management IP address subtype}
      value:
        type: string
        description: A management IP address of the type specified by the subType field
  MgmtIPSubType:
    type: string
    enum: [IPv4, IPv6]
    description: The type of the address used for the management IP
  Neighbor:
    type: object
    description: Neighbor information
    required: [TTL, age, chassisID, ifName, portID, protocol]
    x-nullable: [mgmtIP, portDescr, sysDescr, sysName]
    properties:
      TTL: {$ref: '#/types/PositiveInt', description: Time To Live}
      age:
        $ref: '#/types/PositiveInt'
        description: Age of the neighbor information in seconds from epoch
      chassisID: {$ref: '#/types/ChassisID', description: The chassis ID of the neighbor}
      ifName: {type: string, description: Name of the interface from which the information is received}
      mgmtIP: {$ref: '#/types/MgmtIP', description: Management IP of the neighbor}
      portDescr: {type: string, description: Port description of the neighbor}
      portID: {$ref: '#/types/PortID', description: Port ID of the neighbor}
      protocol: {$ref: '#/types/Protocol', description: The protocol used}
      sysDescr: {type: string, description: System description of the neighbor}
      sysName: {type: string, description: System hostname of the neighbor}
  PortID:
    type: object
    description: The port ID type
    required: [subType, value]
    properties:
      subType: {$ref: '#/types/PortIDSubType', description: Port ID subtype}
      value: {type: string, description: A port ID of the type specified by the subType field}
  PortIDSubType:
    type: string
    enum:
    - InterfaceAlias
    - PortComponent
    - MACAddress
    - NetworkAddress
    - InterfaceName
    - AgentCircuitID
    - LocallyAssigned
    description: The type of the identifier used for the port
  PositiveInt: {type: integer, minimum: 0, description: Positive integer type}
  Protocol:
    type: string
    enum: [LLDP, CDPv1, CDPv2]
    description: The protocol the neighbor information was received with
  Lldp:
    type: object
    description: The whole API tree.
    x-read-only: [neighbors]
    properties:
      activated: {type: boolean, description: LLDP state}
      neighbors:
        type: array
        items: {$ref: '#/types/Neighbor'}
        description: Information about neighbors on the interface

operations:
  get_all:
    summary: All data of the LLDP Configuration API.
    effect: read
    binding: {method: GET, path: ''}
    result: {$ref: '#/types/Lldp'}
  get_activated:
    summary: Whether LLDP is activated.
    effect: read
    binding: {method: GET, path: /activated}
    result: {type: boolean}
    examples:
    - title: Check if LLDP is active
      request: {path: /activated}
      response:
        status: 200
        body: {status: success, data: true, information: [string], warnings: [string]}
      source: https://developer.axis.com/vapix/device-configuration/lldp-configuration-api/
  list_neighbors:
    summary: Neighbor information from all LLDP configured interfaces.
    effect: read
    binding: {method: GET, path: /neighbors}
    result:
      type: array
      items: {$ref: '#/types/Neighbor'}
    examples:
    - title: Get all neighbors
      request: {path: /neighbors}
      response:
        status: 200
        body:
          status: success
          data:
          - TTL: 120
            age: 0
            chassisID: {subType: MACAddress, value: '34:98:b5:ab:5a:b3'}
            ifName: eth0
            mgmtIP: {subType: IPv4, value: 192.168.0.115}
            portDescr: null
            portID: {subType: LocallyAssigned, value: g1}
            protocol: LLDP
            sysDescr: GS110TPv3 8-Port Gigabit Smart Managed Pro Switch with PoE+ and 2 SFP Ports
            sysName: null
          - TTL: 120
            age: 10
            chassisID: {subType: MACAddress, value: 'ac:cc:8e:fd:1f:ca'}
            ifName: eth1
            mgmtIP: {subType: IPv4, value: 10.10.1.145}
            portDescr: eth0
            portID: {subType: MACAddress, value: 'ac:cc:8e:fd:1f:ca'}
            protocol: LLDP
            sysDescr: AXIS S3008 Recorder 11.10+snapshot-20240202
            sysName: ax-accc8efd1fca
          information: [string]
          warnings: [string]
      source: https://developer.axis.com/vapix/device-configuration/lldp-configuration-api/
  set_activated:
    summary: Activate or deactivate LLDP. Deactivating LLDP also deactivates fabric attach network automation and may affect PoE power negotiation.
    effect: write
    write: patch
    binding: {method: PATCH, path: /activated, body_field: activated, body: value}
    positional: [activated]
    params:
      type: object
      required: [activated]
      properties:
        activated: {type: boolean, description: LLDP state}
    examples:
    - title: Activate LLDP
      request:
        path: /activated
        body: {data: true}
      response:
        status: 200
        body: {status: success, information: [string], warnings: [string]}
      source: https://developer.axis.com/vapix/device-configuration/lldp-configuration-api/

sources:
- url: https://developer.axis.com/vapix/device-configuration/lldp-configuration-api/
  sha256_md: c5e6f55bcd4f5391369b1c69bdea4a553628d23597469df9fbbc871e80c79344
