format: 2
id: oidcsetup-config
name: OpenID Connect Setup
summary: Set up OpenID Connect so users can log in to the device with the authorization code flow.
section: device-configuration
family: dca
status: released
python:
  module: oidcsetup
  class: Oidcsetup
docs:
- https://developer.axis.com/vapix/device-configuration/openid-connect-setup/
access: admin
discovery:
- dca: {api: oidcsetup, version: v1}

binding: {root: /config/rest/oidcsetup/v1}

types:
  Claim: {type: string, minLength: 1, maxLength: 256, pattern: '^.*$', description: A claim name or claim and value.}
  RemoteUserClaim: {type: string, minLength: 1, maxLength: 64, pattern: '^(sub|email|preferred_username|("[a-zA-Z0-9]*"))$', description: "One of sub, email, preferred_username, or a quoted alphanumeric custom claim."}
  ClientId: {type: string, minLength: 1, maxLength: 256}
  ClientSecret: {type: string, minLength: 1, maxLength: 256}
  Proxy: {type: string, maxLength: 256, pattern: '^[\w "''.:\/\/?]*$'}
  ScopeList: {type: string, maxLength: 256, pattern: '^[\w "''.:\/\/?]*$'}
  MetadataUrl: {type: string, minLength: 1, maxLength: 256, pattern: '^[\w "''.:\-\/\/~?]+$'}

  AuthEntity:
    type: object
    description: Client authentication properties. The client secret is never returned.
    properties:
      OIDC_AuthzAdminClaim: {$ref: "#/types/Claim", description: "Claim and value that corresponds to admin access."}
      OIDC_AuthzOperatorClaim: {$ref: "#/types/Claim", description: "Claim and value that corresponds to operator access."}
      OIDC_AuthzScopes: {$ref: "#/types/ScopeList", description: "Optional list of additional scopes."}
      OIDC_AuthzViewerClaim: {$ref: "#/types/Claim", description: "Claim and value that corresponds to viewer access."}
      OIDC_ClientID: {$ref: "#/types/ClientId", description: "OIDC client ID."}

  BaseConfigEntity:
    type: object
    description: Required configuration for the OIDC client.
    properties:
      OIDC_OutgoingProxy: {$ref: "#/types/Proxy", description: "Proxy configuration. An empty string clears it."}
      OIDC_ProviderMetadataURL: {$ref: "#/types/MetadataUrl", description: "OIDC discovery API endpoint. Required format https://<host>/<optional directory>/.well-known/openid-configuration"}
      OIDC_RemoteUserClaim: {$ref: "#/types/RemoteUserClaim", description: "Claim identifying the logged in user (sub, email, preferred_username)."}
      OIDC_RequireClaim: {$ref: "#/types/Claim", description: "Claim validated for all requests."}
      AuthEntity: {$ref: "#/types/AuthEntity"}

  Oidcsetup:
    type: object
    description: The whole API tree.
    properties:
      BaseConfigEntity: {$ref: "#/types/BaseConfigEntity"}

  UpdateAuthEntityRequest:
    type: object
    description: Arguments of ``update_auth_entity``. Only the given fields change.
    properties:
      OIDC_AuthzAdminClaim: {$ref: "#/types/Claim", description: "Claim and value that corresponds to admin access."}
      OIDC_AuthzOperatorClaim: {$ref: "#/types/Claim", description: "Claim and value that corresponds to operator access."}
      OIDC_AuthzScopes: {$ref: "#/types/ScopeList", description: "Optional list of additional scopes."}
      OIDC_AuthzViewerClaim: {$ref: "#/types/Claim", description: "Claim and value that corresponds to viewer access."}
      OIDC_ClientID: {$ref: "#/types/ClientId", description: "OIDC client ID."}
      OIDC_ClientSecret: {$ref: "#/types/ClientSecret", description: "OIDC client secret. Write-only: the device never returns it."}

  UpdateBaseConfigEntityRequest:
    type: object
    description: Arguments of ``update_base_config_entity``. Only the given fields change.
    properties:
      OIDC_OutgoingProxy: {$ref: "#/types/Proxy", description: "Proxy configuration. An empty string clears it."}
      OIDC_ProviderMetadataURL: {$ref: "#/types/MetadataUrl", description: "OIDC discovery API endpoint. Required format https://<host>/<optional directory>/.well-known/openid-configuration"}
      OIDC_RemoteUserClaim: {$ref: "#/types/RemoteUserClaim", description: "Claim identifying the logged in user (sub, email, preferred_username)."}
      OIDC_RequireClaim: {$ref: "#/types/Claim", description: "Claim validated for all requests."}
      AuthEntity: {$ref: "#/types/UpdateAuthEntityRequest"}

  UpdateAllRequest:
    type: object
    description: Arguments of ``update_all``. Only the given fields change.
    properties:
      BaseConfigEntity: {$ref: "#/types/UpdateBaseConfigEntityRequest"}

operations:
  get_all:
    summary: All OpenID Connect settings.
    effect: read
    binding: {method: GET, path: ""}
    result: {$ref: "#/types/Oidcsetup"}

  update_all:
    summary: Update the OpenID Connect settings.
    effect: write
    write: patch
    binding: {method: PATCH, path: "", body: object}
    params: {$ref: "#/types/UpdateAllRequest"}

  get_base_config_entity:
    summary: Get the base configuration, including the client authentication settings.
    effect: read
    binding: {method: GET, path: /BaseConfigEntity}
    result: {$ref: "#/types/BaseConfigEntity"}
    examples:
      - title: Get all settings
        request: {path: /BaseConfigEntity}
        response: {status: 200, body: {status: success, data: {AuthEntity: {OIDC_AuthzAdminClaim: example-claim-admin, OIDC_AuthzOperatorClaim: example-claim-operator, OIDC_AuthzViewerClaim: example-claim-viewer, OIDC_AuthzScopes: "some:scope", OIDC_ClientID: example-id}, OIDC_OutgoingProxy: optional.proxy.settings, OIDC_ProviderMetadataURL: "https://example.metadata.uri", OIDC_RemoteUserClaim: email, OIDC_RequireClaim: example-claim}}}
        source: https://developer.axis.com/vapix/device-configuration/openid-connect-setup/

  update_base_config_entity:
    summary: Update the base configuration, optionally with the client authentication settings.
    effect: write
    write: patch
    binding: {method: PATCH, path: /BaseConfigEntity, body: object}
    params: {$ref: "#/types/UpdateBaseConfigEntityRequest"}
    round_trip:
      from: BaseConfigEntity
    examples:
      - title: Set all settings
        request: {path: /BaseConfigEntity, body: {data: {AuthEntity: {OIDC_AuthzAdminClaim: example-claim-admin, OIDC_AuthzOperatorClaim: example-claim-operator, OIDC_AuthzViewerClaim: example-claim-viewer, OIDC_AuthzScopes: "some:scope", OIDC_ClientID: example-id, OIDC_ClientSecret: example-secret}, OIDC_OutgoingProxy: optional.proxy.settings, OIDC_ProviderMetadataURL: "https://example.metadata.uri", OIDC_RemoteUserClaim: email, OIDC_RequireClaim: example-claim}}}
        response: {status: 200, body: {status: success}}
        source: https://developer.axis.com/vapix/device-configuration/openid-connect-setup/

  get_outgoing_proxy:
    summary: Get the outgoing proxy setting.
    effect: read
    binding: {method: GET, path: /BaseConfigEntity/OIDC_OutgoingProxy}
    result: {$ref: "#/types/Proxy"}

  set_outgoing_proxy:
    summary: Set the outgoing proxy setting.
    effect: write
    write: patch
    binding: {method: PATCH, path: /BaseConfigEntity/OIDC_OutgoingProxy, body_field: OIDC_OutgoingProxy, body: value}
    params:
      type: object
      required: [OIDC_OutgoingProxy]
      properties:
        OIDC_OutgoingProxy: {$ref: "#/types/Proxy"}
    examples:
      - title: Clear the outgoing proxy
        request: {path: /BaseConfigEntity/OIDC_OutgoingProxy, body: {data: ""}}
        response: {status: 200, body: {status: success}}
        source: https://developer.axis.com/vapix/device-configuration/openid-connect-setup/

  get_provider_metadata_url:
    summary: Get the provider metadata url setting.
    effect: read
    binding: {method: GET, path: /BaseConfigEntity/OIDC_ProviderMetadataURL}
    result: {$ref: "#/types/MetadataUrl"}

  set_provider_metadata_url:
    summary: Set the provider metadata url setting.
    effect: write
    write: patch
    binding: {method: PATCH, path: /BaseConfigEntity/OIDC_ProviderMetadataURL, body_field: OIDC_ProviderMetadataURL, body: value}
    params:
      type: object
      required: [OIDC_ProviderMetadataURL]
      properties:
        OIDC_ProviderMetadataURL: {$ref: "#/types/MetadataUrl"}

  get_remote_user_claim:
    summary: Get the remote user claim setting.
    effect: read
    binding: {method: GET, path: /BaseConfigEntity/OIDC_RemoteUserClaim}
    result: {$ref: "#/types/RemoteUserClaim"}

  set_remote_user_claim:
    summary: Set the remote user claim setting.
    effect: write
    write: patch
    binding: {method: PATCH, path: /BaseConfigEntity/OIDC_RemoteUserClaim, body_field: OIDC_RemoteUserClaim, body: value}
    params:
      type: object
      required: [OIDC_RemoteUserClaim]
      properties:
        OIDC_RemoteUserClaim: {$ref: "#/types/RemoteUserClaim"}

  get_require_claim:
    summary: Get the require claim setting.
    effect: read
    binding: {method: GET, path: /BaseConfigEntity/OIDC_RequireClaim}
    result: {$ref: "#/types/Claim"}

  set_require_claim:
    summary: Set the require claim setting.
    effect: write
    write: patch
    binding: {method: PATCH, path: /BaseConfigEntity/OIDC_RequireClaim, body_field: OIDC_RequireClaim, body: value}
    params:
      type: object
      required: [OIDC_RequireClaim]
      properties:
        OIDC_RequireClaim: {$ref: "#/types/Claim"}

  get_auth_entity:
    summary: Get the client authentication settings. The client secret is never returned.
    effect: read
    binding: {method: GET, path: /BaseConfigEntity/AuthEntity}
    result: {$ref: "#/types/AuthEntity"}

  update_auth_entity:
    summary: Update the client authentication settings.
    effect: write
    write: patch
    binding: {method: PATCH, path: /BaseConfigEntity/AuthEntity, body: object}
    params: {$ref: "#/types/UpdateAuthEntityRequest"}
    round_trip:
      from: AuthEntity

  get_authz_admin_claim:
    summary: Get the authz admin claim setting.
    effect: read
    binding: {method: GET, path: /BaseConfigEntity/AuthEntity/OIDC_AuthzAdminClaim}
    result: {$ref: "#/types/Claim"}

  set_authz_admin_claim:
    summary: Set the authz admin claim setting.
    effect: write
    write: patch
    binding: {method: PATCH, path: /BaseConfigEntity/AuthEntity/OIDC_AuthzAdminClaim, body_field: OIDC_AuthzAdminClaim, body: value}
    params:
      type: object
      required: [OIDC_AuthzAdminClaim]
      properties:
        OIDC_AuthzAdminClaim: {$ref: "#/types/Claim"}

  get_authz_operator_claim:
    summary: Get the authz operator claim setting.
    effect: read
    binding: {method: GET, path: /BaseConfigEntity/AuthEntity/OIDC_AuthzOperatorClaim}
    result: {$ref: "#/types/Claim"}

  set_authz_operator_claim:
    summary: Set the authz operator claim setting.
    effect: write
    write: patch
    binding: {method: PATCH, path: /BaseConfigEntity/AuthEntity/OIDC_AuthzOperatorClaim, body_field: OIDC_AuthzOperatorClaim, body: value}
    params:
      type: object
      required: [OIDC_AuthzOperatorClaim]
      properties:
        OIDC_AuthzOperatorClaim: {$ref: "#/types/Claim"}

  get_authz_scopes:
    summary: Get the authz scopes setting.
    effect: read
    binding: {method: GET, path: /BaseConfigEntity/AuthEntity/OIDC_AuthzScopes}
    result: {$ref: "#/types/ScopeList"}

  set_authz_scopes:
    summary: Set the authz scopes setting.
    effect: write
    write: patch
    binding: {method: PATCH, path: /BaseConfigEntity/AuthEntity/OIDC_AuthzScopes, body_field: OIDC_AuthzScopes, body: value}
    params:
      type: object
      required: [OIDC_AuthzScopes]
      properties:
        OIDC_AuthzScopes: {$ref: "#/types/ScopeList"}

  get_authz_viewer_claim:
    summary: Get the authz viewer claim setting.
    effect: read
    binding: {method: GET, path: /BaseConfigEntity/AuthEntity/OIDC_AuthzViewerClaim}
    result: {$ref: "#/types/Claim"}

  set_authz_viewer_claim:
    summary: Set the authz viewer claim setting.
    effect: write
    write: patch
    binding: {method: PATCH, path: /BaseConfigEntity/AuthEntity/OIDC_AuthzViewerClaim, body_field: OIDC_AuthzViewerClaim, body: value}
    params:
      type: object
      required: [OIDC_AuthzViewerClaim]
      properties:
        OIDC_AuthzViewerClaim: {$ref: "#/types/Claim"}

  get_client_id:
    summary: Get the client id setting.
    effect: read
    binding: {method: GET, path: /BaseConfigEntity/AuthEntity/OIDC_ClientID}
    result: {$ref: "#/types/ClientId"}

  set_client_id:
    summary: Set the client id setting.
    effect: write
    write: patch
    binding: {method: PATCH, path: /BaseConfigEntity/AuthEntity/OIDC_ClientID, body_field: OIDC_ClientID, body: value}
    params:
      type: object
      required: [OIDC_ClientID]
      properties:
        OIDC_ClientID: {$ref: "#/types/ClientId"}

  set_client_secret:
    summary: Set the client secret setting.
    effect: write
    write: patch
    binding: {method: PATCH, path: /BaseConfigEntity/AuthEntity/OIDC_ClientSecret, body_field: OIDC_ClientSecret, body: value}
    params:
      type: object
      required: [OIDC_ClientSecret]
      properties:
        OIDC_ClientSecret: {$ref: "#/types/ClientSecret"}

sources:
- url: https://developer.axis.com/vapix/device-configuration/openid-connect-setup/
  sha256_md: a88f409cd270b092feabe9439e280d038e2a6f0475d9d2b73d79d2aff6ec42b3
  retrieved_at: '2026-10-11'

provenance:
  completeness: complete
  open_questions:
    - The Proxy, ScopeList and MetadataUrl patterns are taken from the docs, which print them with doubled backslashes; they are read as single-escaped regexes and do not allow characters such as = or & in URLs.
  migrated_from: v1
  curated: true
