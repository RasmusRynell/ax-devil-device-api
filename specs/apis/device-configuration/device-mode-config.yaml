        description: The pending device mode if different from activeMode, otherwise same as activeMode
      restartRequired:
        type: boolean
        description: Indicates if a restart is required to apply the mode change. This is typically true for current
          implementations.
      availableModes:
        type: array
        items: {$ref: '#/types/AvailableMode'}
  AvailableMode:
    type: object
    description: The `availableModes` entity collection contains all device modes that are available on the device.
      Each mode is accessed by its ID (`fisheye`, `double-panorama`, etc.).
    required: [id]
    properties:
      id: {$ref: '#/types/ModeId', description: The device mode identifier (short descriptive string)}

