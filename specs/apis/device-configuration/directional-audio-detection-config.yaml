  retrieved_at: '2026-10-11'

provenance:
  completeness: complete
  open_questions:
  - The root example shows baseSettings.envReset, which the entity tables do not list; it is not modelled.
  - Per-property GET operations (for example baseSettings/enabled) are not modelled; read the entity instead.
  migrated_from: v1
  curated: true
