  PortType: {type: integer, minimum: 1, maximum: 65535, description: port number.}
  ServerNameType:
    type: string
    minLength: 1
    maxLength: 64
    pattern: ^[A-Za-z0-9-.]+$
    description: Client ID type.
  Virtualhost:
    type: object
    description: The whole API tree.
    properties:
      virtualhosts:
        type: array
        items: {$ref: '#/types/VirtualhostVirtualhost'}
  VirtualhostVirtualhost:
    type: object
    description: Modify Virtual Host or delete it.
    required: [server_name]
    properties:
      active: {$ref: '#/types/BooleanType', description: Enalble auth type.}
      auth_type: {$ref: '#/types/AuthType', description: The name of the authentication schema.}
      port: {$ref: '#/types/PortType', description: The port that the auth type will use.}
      server_name: {$ref: '#/types/ServerNameType', description: Server name for auth type.}
