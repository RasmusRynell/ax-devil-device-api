  completeness: partial
  open_questions:
  - 'The API definition lists only two entity names. Property names and types come from the two docs examples; types, units, the serversSource values, which fields are read-only (assumed: advertisedServers, synced, timeOffset, timeToNextSync) and permissions are not documented.'
  - 'Version conflict: the prose refers to network-time-sync.v2.ntp.client while examples use v1. The v1 path is used.'
  - 'The docs examples use an abstract {operation, path} form; they are mapped to the framework paths and HTTP methods.'
  - 'Maturity (beta or released), AXIS OS version and permissions are not stated.'
  migrated_from: v1
  curated: true
