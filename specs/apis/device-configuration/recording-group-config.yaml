format: 2
id: recording-group-config
name: Recording group API
summary: The VAPIX® Recording group API makes it possible to create, update, delete and retrieve information about
  recording groups.
section: device-configuration
family: dca
status: released
python:
  module: recording_group_config
  class: RecordingGroupConfig
docs:
- https://developer.axis.com/vapix/device-configuration/recording-group/
access: admin
discovery:
- dca: {api: recording-group, version: v2}

binding: {root: /config/rest/recording-group/v2}

types:
  ContainerFormatEnum:
    type: string
    enum: [matroska, mp4, cmaf, none, tar]
    description: Recording container format.
  ContentEncryption:
    type: object
    description: Indicates that a fixed key should be used to encrypt the recordings. Setting this means that only
      the provided key in the key field will be used to encrypt recordings.
    properties:
      key: {$ref: '#/types/HexadecimalEncryptionKey128Bit'}
      keyId: {$ref: '#/types/Uuid'}
  DataProducerOptions:
    type: object
    description: Contains the data options to use for recording. The possible producers and their configuration
      can be retrieved from the Recording Data Producer Registry.
    x-nullable: [dataDuration, dataSize, producerConfiguration]
    properties:
      dataDuration:
        $ref: '#/types/TargetAndMaxPositiveInteger'
        description: The target and max duration in seconds of data items stored in the archive. Only applicable
          when `containerFormat` is `tar`.
      dataSize:
        $ref: '#/types/TargetAndMaxPositiveInteger'
        description: The target and max size in bytes of data items stored in the archive. Only applicable when
          `containerFormat` is `tar`.
      producerConfiguration: {description: The producer specific configuration.}
      producerId: {$ref: '#/types/IdString', description: The id of the recording data producer to use.}
  Destination:
    type: object
    description: The destination to save recordings to.
    x-nullable: [remoteObjectStorage]
    properties:
      remoteObjectStorage: {$ref: '#/types/RemoteObjectStorage'}
  DestinationsArray:
    type: array
    items: {$ref: '#/types/Destination'}
    description: An array for destinations. Can contain only one destination. (minItems=1, maxItems=1)
  Encryption:
    type: object
    description: Contains data describing the encryption method and parameters to use on recordings.
    x-nullable: [contentEncryption, keyEncryption]
    properties:
      contentEncryption: {$ref: '#/types/ContentEncryption'}
      keyEncryption: {$ref: '#/types/KeyEncryption'}
      protectionScheme: {$ref: '#/types/ProtectionSchemeEnum'}
  HexadecimalEncryptionKey128Bit:
    type: string
    pattern: '''(^[a-fA-F0-9]{32}$)|(^*\*\*$)'
    description: A 128-bit hexadecimal encryption key.
  IdString:
    type: string
    minLength: 1
    maxLength: 50
    pattern: ^[a-zA-Z0-9_-]+$
    description: Identification string.
  KeyEncryption:
    type: object
    description: Indicates that generated/rotating keys are used to encrypt the recordings.
    x-nullable: [certificateIds, publicKeys]
    properties:
      certificateIds: {$ref: '#/types/StringArray'}
      keyRotationDuration: {$ref: '#/types/PositiveInteger'}
      publicKeys: {$ref: '#/types/PublicKeysArray'}
  KeyValue:
    type: object
    description: A key-value pair.
    properties:
      key: {$ref: '#/types/ObjectAttributeKeyString', description: The key string.}
      value: {$ref: '#/types/ObjectAttributeValueString', description: The value string.}
  ObjectAttributeArray:
    type: array
    items: {$ref: '#/types/KeyValue'}
    description: An array of key-value string pairs. (maxItems=3)
  ObjectAttributeKeyString:
    type: string
    minLength: 1
    maxLength: 200
    pattern: ^[a-zA-Z][a-zA-Z0-9_]*$
    description: A key for an object attribute. Each key will be prefixed with 'usrspan'.
  ObjectAttributeValueString:
    type: string
    minLength: 0
    maxLength: 200
    pattern: ^[^\x00-\x1F\x7F]*$
    description: A value for an object attribute.
  PositiveInteger: {type: integer, minimum: 0, description: Positive integer value.}
  ProtectionSchemeEnum: {type: string, enum: [CENC], description: The encryption scheme to use.}
  PublicKey:
    type: object
    description: Type for storing a public key and its id.
    properties:
      key: {type: string}
      keyId: {$ref: '#/types/Uuid'}
  PublicKeysArray:
    type: array
    items: {$ref: '#/types/PublicKey'}
    description: Array of RSA public keys and their key ids.
  RemoteObjectStorage:
    type: object
    description: Describes a remote object storage such as an Azure or Amazon S3 cloud server.
    properties:
      id: {$ref: '#/types/IdString'}
      postfix: {type: string}
      prefix: {type: string}
  StringArray:
    type: array
    items: {type: string}
    description: Array of strings.
  TargetAndMaxPositiveInteger:
    type: object
    description: A type for holding a target and max positive integer values.
    properties:
      max: {$ref: '#/types/PositiveInteger'}
      target: {$ref: '#/types/PositiveInteger'}
  Uuid:
    type: string
    minLength: 36
    maxLength: 36
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    description: RFC Universally Unique Identifier (UUID) format.
  RecordingGroup:
    type: object
    description: The whole API tree.
    properties:
      recordingGroups:
        type: array
        items: {$ref: '#/types/RecordingGroupRecordingGroup'}
  RecordingGroupRecordingGroup:
    type: object
    description: Recording group collection.
    x-nullable:
    - containerFormat
    - dataProducerOptions
    - description
    - encryption
    - maxRetentionTime
    - niceName
    - objectAttributes
    - postDuration
    - preDuration
    - segmentDuration
    - segmentSize
    - spanDuration
    - streamOptions
    properties:
      containerFormat:
        $ref: '#/types/ContainerFormatEnum'
        description: 'The output format of the recordings. Default: matroska.'
      dataProducerOptions:
        $ref: '#/types/DataProducerOptions'
        description: Options for recording data from the specified producer. This option cannot be used together
          with streamOptions, only one of them can be set.
      description: {type: string, description: Description for the recording group.}
      destinations:
        $ref: '#/types/DestinationsArray'
        description: Remote object storage destinations array. The recordings in this group will be stored on all
          destinations in this field if possible.
      encryption:
        $ref: '#/types/Encryption'
        description: 'The encryption options to use for encrypting recording segments. Default: no encryption.'
      id: {$ref: '#/types/IdString', description: ID for the recording group.}
      maxRetentionTime:
        $ref: '#/types/PositiveInteger'
        description: 'Max number of hours the recordings in the group will be stored for. Default: 0 (unlimited).'
      niceName: {type: string, description: User friendly name for the recording group.}
      objectAttributes:
        $ref: '#/types/ObjectAttributeArray'
        description: Optional, fixed, extra attributes to set on stored objects.
      postDuration: {$ref: '#/types/PositiveInteger', description: 'Post-trigger time in milliseconds. Default:
          0.'}
      preDuration: {$ref: '#/types/PositiveInteger', description: 'Pre-trigger time in milliseconds. Default: 0.'}
      segmentDuration:
        $ref: '#/types/TargetAndMaxPositiveInteger'
        description: 'The segment (recording files) duration in seconds. Target value may not be reached depending
          on segmentSize. Default: target/max = 15/30.'
      segmentSize:
        $ref: '#/types/TargetAndMaxPositiveInteger'
        description: 'The target/max segment size in bytes. Target value may not be reached depending on segmentDuration.
          Default: target/max = 15728640/26214400 (15MiB/25MiB).'
      spanDuration:
        $ref: '#/types/PositiveInteger'
        description: 'The span duration in seconds. A recording is logically made up of one or more spans. Default:
          3600.'
      streamOptions:
        type: string
        description: The stream options to use for recordings in the group. This option can't be used together with
          `dataProducerOptions`, only one of them can be set.
  AddRecordingGroupRequest:
    type: object
    description: Arguments of ``add_recording_group``.
    required: [destinations]
    properties:
      destinations:
        $ref: '#/types/DestinationsArray'
        description: Remote object storage destinations array. The recordings in this group will be stored on all
          destinations in this field if possible.
      id: {$ref: '#/types/IdString', description: ID for the recording group.}
      niceName: {type: string, description: User friendly name for the recording group.}
      description: {type: string, description: Description for the recording group.}
      maxRetentionTime:
        $ref: '#/types/PositiveInteger'
        description: 'Max number of hours the recordings in the group will be stored for. Default: 0 (unlimited).'
      containerFormat:
        $ref: '#/types/ContainerFormatEnum'
        description: 'The output format of the recordings. Default: matroska.'
      spanDuration:
        $ref: '#/types/PositiveInteger'
        description: 'The span duration in seconds. A recording is logically made up of one or more spans. Default:
          3600.'
      segmentDuration:
        $ref: '#/types/TargetAndMaxPositiveInteger'
        description: 'The segment (recording files) duration in seconds. Target value may not be reached depending
          on segmentSize. Default: target/max = 15/30.'
      segmentSize:
        $ref: '#/types/TargetAndMaxPositiveInteger'
        description: 'The target/max segment size in bytes. Target value may not be reached depending on segmentDuration.
          Default: target/max = 15728640/26214400 (15MiB/25MiB).'
      preDuration: {$ref: '#/types/PositiveInteger', description: 'Pre-trigger time in milliseconds. Default: 0.'}
      postDuration: {$ref: '#/types/PositiveInteger', description: 'Post-trigger time in milliseconds. Default:
          0.'}
      streamOptions:
        type: string
        description: The stream options to use for recordings in the group. This option can't be used together with
          `dataProducerOptions`, only one of them can be set.
      encryption:
        $ref: '#/types/Encryption'
        description: 'The encryption options to use for encrypting recording segments. Default: no encryption.'
      dataProducerOptions:
        $ref: '#/types/DataProducerOptions'
        description: Options for recording data from the specified producer. This option cannot be used together
          with streamOptions, only one of them can be set.
      objectAttributes:
        $ref: '#/types/ObjectAttributeArray'
        description: Optional, fixed, extra attributes to set on stored objects.

operations:
  get_all:
    summary: All data of the Recording group API API.
    effect: read
    binding: {method: GET, path: ''}
    result: {$ref: '#/types/RecordingGroup'}
    examples:
    - title: Get root entity
      request: {path: ''}
      response:
        status: 200
        body:
          data:
            recordingGroups:
            - containerFormat: matroska
              description: A group with parameters perfected for observing fast moving fish
              destinations:
              - remoteObjectStorage: {id: aws1, prefix: camera1, postfix: location1}
              id: SD_DISK_20230920_081416_196C2182
              maxRetentionTime: 168
              niceName: Nemo Finder
              postDuration: 0
              preDuration: 1000
              segmentDuration: {max: 20, target: 15}
              segmentSize: {max: 5000000, target: 4000000}
              spanDuration: 3600
              streamOptions: camera=1&videocodec=h264&fps=60&resolution=1920x1080&compression=30&audio=1
          status: success
      source: https://developer.axis.com/vapix/device-configuration/recording-group/
  list_recording_groups:
    summary: List the recording groups.
    effect: read
    binding: {method: GET, path: /recordingGroups}
    result:
      type: array
      items: {$ref: '#/types/RecordingGroupRecordingGroup'}
    examples:
    - title: Get All Recording Groups
      request: {path: /recordingGroups}
      response:
        status: 200
        body:
          data:
          - containerFormat: matroska
            description: A group with parameters perfected for observing fast moving fish
            destinations:
            - remoteObjectStorage: {id: aws1, prefix: camera1, postfix: location1}
            id: SD_DISK_20230920_081416_196C2182
            maxRetentionTime: 168
            niceName: Nemo Finder
            postDuration: 0
            preDuration: 1000
            segmentDuration: {max: 20, target: 15}
            segmentSize: {max: 5000000, target: 4000000}
            spanDuration: 3600
            streamOptions: camera=1&videocodec=h264&fps=60&resolution=1920x1080&compression=30&audio=1
          status: success
      source: https://developer.axis.com/vapix/device-configuration/recording-group/
  get_recording_group:
    summary: Get one recording group.
    effect: read
    binding: {method: GET, path: '/recordingGroups/{ID}'}
    params:
      type: object
      x-name: RecordingGroupRecordingGroupIDRequest
      required: [ID]
      properties:
        ID: {type: string}
    result: {$ref: '#/types/RecordingGroupRecordingGroup'}
  add_recording_group:
    summary: Add a recording group.
    effect: write
    write: create
    binding: {method: POST, path: /recordingGroups, body: object}
    params: {$ref: '#/types/AddRecordingGroupRequest'}
    examples:
    - title: No Encryption
      request:
        path: /recordingGroups
        body:
          data:
            containerFormat: cmaf
            description: A group with parameters perfected for observing fast moving fish
            destinations:
            - remoteObjectStorage: {id: aws1, prefix: camera1, postfix: location1}
            maxRetentionTime: 168
            niceName: Nemo Finder
            postDuration: 0
            preDuration: 1000
            segmentDuration: {max: 20, target: 15}
            segmentSize: {max: 5000000, target: 4000000}
            spanDuration: 3600
            streamOptions: camera=1&videocodec=h264&fps=60&resolution=1920x1080&compression=30&audio=1
      response:
        status: 200
        body: {status: success}
      source: https://developer.axis.com/vapix/device-configuration/recording-group/
    - title: Fixed Key Encryption
      request:
        path: /recordingGroups
        body:
          data:
            containerFormat: cmaf
            description: A group with parameters perfected for observing fast moving fish
            destinations:
            - remoteObjectStorage: {id: aws1, prefix: camera1, postfix: location1}
            encryption:
              contentEncryption: {key: 00112233445566778899AABBCCDDEEFF, keyId: aaaaaaaa-bbbb-cccc-dddd-ef0123456789}
              protectionScheme: CENC
            maxRetentionTime: 168
            niceName: Nemo Finder
            postDuration: 0
            preDuration: 1000
            segmentDuration: {max: 20, target: 15}
            segmentSize: {max: 5000000, target: 4000000}
            spanDuration: 3600
            streamOptions: camera=1&videocodec=h264&fps=60&resolution=1920x1080&compression=30&audio=1
      response:
        status: 200
        body: {status: success}
      source: https://developer.axis.com/vapix/device-configuration/recording-group/
    - title: Rotating Key Encryption
      request:
        path: /recordingGroups
        body:
          data:
            containerFormat: cmaf
            description: A group with parameters perfected for observing fast moving fish
            destinations:
            - remoteObjectStorage: {id: aws1, prefix: camera1, postfix: location1}
            encryption:
              keyEncryption:
                certificateIds: [certid1, certid2]
                publicKeys:
                - key: |-
                    -----BEGIN PUBLIC KEY-----
                    
                    -----END PUBLIC KEY-----
                  keyId: aaaaaaaa-bbbb-cccc-dddd-ef0123456789
                keyRotationDuration: 86400
              protectionScheme: CENC
            maxRetentionTime: 168
            niceName: Nemo Finder
            postDuration: 0
            preDuration: 1000
            segmentDuration: {max: 20, target: 15}
            segmentSize: {max: 5000000, target: 4000000}
            spanDuration: 3600
            streamOptions: camera=1&videocodec=h264&fps=60&resolution=1920x1080&compression=30&audio=1
      response:
        status: 200
        body: {status: success}
      source: https://developer.axis.com/vapix/device-configuration/recording-group/
  remove_recording_group:
    summary: Remove a recording group.
    effect: write
    write: delete
    binding: {method: DELETE, path: '/recordingGroups/{ID}'}
    params:
      type: object
      x-name: RecordingGroupRecordingGroupIDRequest
      required: [ID]
      properties:
        ID: {type: string}
    examples:
    - title: Delete a Recording Group
      request: {path: /recordingGroups/SD_DISK_20230920_081416_196C2182}
      response:
        status: 200
        body: {status: success}
      source: https://developer.axis.com/vapix/device-configuration/recording-group/
  set_recording_group_data_producer_options:
    summary: Set the data producer options of a recording group.
    effect: write
    write: patch
    binding:
      method: PATCH
      path: /recordingGroups/{ID}/dataProducerOptions
      body_field: dataProducerOptions
      body: value
    params:
      type: object
      required: [ID, dataProducerOptions]
      properties:
        ID: {type: string}
        dataProducerOptions:
          $ref: '#/types/DataProducerOptions'
          description: Options for recording data from the specified producer. This option cannot be used together
            with streamOptions, only one of them can be set.
  set_recording_group_object_attributes:
    summary: Set the object attributes of a recording group.
    effect: write
    write: patch
    binding:
      method: PATCH
      path: /recordingGroups/{ID}/objectAttributes
      body_field: objectAttributes
      body: value
    params:
      type: object
      required: [ID, objectAttributes]
      properties:
        ID: {type: string}
        objectAttributes:
          $ref: '#/types/ObjectAttributeArray'
          description: Optional, fixed, extra attributes to set on stored objects.

