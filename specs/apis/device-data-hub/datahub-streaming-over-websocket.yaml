provenance:
  completeness: complete
  open_questions:
  - 'The subscribe example uses topic names ''some.Topic''/''other.Topic'' (capital T) while listTopics shows ''some.topic'';
    case sensitivity of topic names is not stated. Source: https://developer.axis.com/vapix/device-data-hub/websocket/'
  - 'Format of instanceFilter (array of single-key objects?) and dataFilter jq expression semantics (AND/OR across
    entries) are not specified beyond the example. Source: https://developer.axis.com/vapix/device-data-hub/websocket/#method-subscribe'
  - 'Whether wssession token auth and Basic/Digest on the upgrade request can be combined, and the access level
    required, are not stated. Source: https://developer.axis.com/vapix/device-data-hub/websocket/#authentication'
  - 'Topic key names differ between topic families: PTZ topics use channelId (string), scene topics use channel_id
    (integer). Source: https://developer.axis.com/vapix/device-data-hub/topics/'
  - 'The in-session methods listTopics, unsubscribe, unsubscribeAll and listSubscriptions are not operations (session.request),
    so they have no contract examples; only connect(subscriptions=...) and its data-hub_v1:subscribe messages are checked.'
  - 'Not modelled: the data schemas of com.axis.scene.frame.v1, com.axis.scene.object_snapshot.v1 and com.axis.scene.object_track.v1
    (large JSON Schemas with nested $defs, mirrored only as raw .json files; the v1 migration produced wrong, duplicated
    types). TopicSample.data is an untyped mapping; only the two PTZ topic schemas are modelled as types.'
  migrated_from: v1
  curated: true
