types:
  PtzOpticalZoomStateV1:
    type: object
    required: [channelId]
    x-nullable: [hfov_deg, vfov_deg, zoom_mag, zoom_moving]
    properties:
      channelId: {type: string}
      hfov_deg: {type: number, minimum: 0, maximum: 360.0}
      vfov_deg: {type: number, minimum: 0, maximum: 360.0}
      zoom_mag: {type: number, minimum: 1.0, maximum: 100.0}
      zoom_moving: {type: boolean}
    additionalProperties: true
  PtzPanTiltStateV1:
    type: object
    required: [channelId]
    x-nullable:
    - pan_deg
    - pan_moving
    - pan_speed_deg_s
    - tilt_deg
    - tilt_moving
    - tilt_speed_deg_s
    properties:
      channelId: {type: string}
      pan_deg: {type: number, minimum: -360, maximum: 360.0}
      pan_moving: {type: boolean}
      pan_speed_deg_s: {type: number, minimum: -400, maximum: 400.0}
      tilt_deg: {type: number, minimum: -360, maximum: 360.0}
      tilt_moving: {type: boolean}
      tilt_speed_deg_s: {type: number, minimum: -400, maximum: 400.0}
    additionalProperties: true
  SceneFrameV1:
    type: object
    description: A detected and tracked object observed over time.
    required: [id, channel_id]
    x-nullable:
    - classes
    - duration
    - end_time
    - image
    - maximum_speed
    - minimum_speed
    - parts
    - path
    - start_time
    properties:
      channel_id:
        type: integer
        minimum: 1
        description: Uniquely identifies a source within a single device, for example, a video or radar sensor.
      classes:
        type: array
        items: {}
        description: Classification candidates for the track (e.g., person, vehicle).
      duration: {type: number, description: Total duration of the track in seconds.}
      end_time:
        type: string
        description: Timestamp of the last observation in the track. (format=date-time)
      id: {type: string, description: Globally unique identifier.}
      image: {description: Representative snapshot of the tracked object.}
      maximum_speed: {type: number, minimum: 0, description: Maximum measured speed of an object in m/s}
      minimum_speed: {type: number, minimum: 0, description: Minimum measured speed of an object in m/s}
      parts:
        type: array
        items: {}
        description: References to the original object tracks that were combined to create this track. (minItems=1)
      path:
        type: array
        items: {}
        description: Time-ordered samples of the track’s trajectory (timestamps and positions).
      start_time:
        type: string
        description: Timestamp of the first observation in the track. (format=date-time)
    additionalProperties: true
  SceneObjectSnapshotV1:
    type: object
    description: A detected and tracked object observed over time.
    required: [id, channel_id]
    x-nullable:
    - classes
    - duration
    - end_time
    - image
    - maximum_speed
    - minimum_speed
    - parts
    - path
    - start_time
    properties:
      channel_id:
        type: integer
        minimum: 1
        description: Uniquely identifies a source within a single device, for example, a video or radar sensor.
      classes:
        type: array
        items: {}
        description: Classification candidates for the track (e.g., person, vehicle).
      duration: {type: number, description: Total duration of the track in seconds.}
      end_time:
        type: string
        description: Timestamp of the last observation in the track. (format=date-time)
      id: {type: string, description: Globally unique identifier.}
      image: {description: Representative snapshot of the tracked object.}
      maximum_speed: {type: number, minimum: 0, description: Maximum measured speed of an object in m/s}
      minimum_speed: {type: number, minimum: 0, description: Minimum measured speed of an object in m/s}
      parts:
        type: array
        items: {}
        description: References to the original object tracks that were combined to create this track. (minItems=1)
      path:
        type: array
        items: {}
        description: Time-ordered samples of the track’s trajectory (timestamps and positions).
      start_time:
        type: string
        description: Timestamp of the first observation in the track. (format=date-time)
    additionalProperties: true
  SceneObjectTrackV1:
    type: object
    description: A detected and tracked object observed over time.
    required: [id, channel_id]
    x-nullable:
    - classes
    - duration
    - end_time
    - image
    - maximum_speed
    - minimum_speed
    - parts
    - path
    - start_time
    properties:
      channel_id:
        type: integer
        minimum: 1
        description: Uniquely identifies a source within a single device, for example, a video or radar sensor.
      classes:
        type: array
        items: {}
        description: Classification candidates for the track (e.g., person, vehicle).
      duration: {type: number, description: Total duration of the track in seconds.}
      end_time:
        type: string
        description: Timestamp of the last observation in the track. (format=date-time)
      id: {type: string, description: Globally unique identifier.}
      image: {description: Representative snapshot of the tracked object.}
      maximum_speed: {type: number, minimum: 0, description: Maximum measured speed of an object in m/s}
      minimum_speed: {type: number, minimum: 0, description: Minimum measured speed of an object in m/s}
      parts:
        type: array
        items: {}
        description: References to the original object tracks that were combined to create this track. (minItems=1)
      path:
        type: array
        items: {}
        description: Time-ordered samples of the track’s trajectory (timestamps and positions).
      start_time:
        type: string
        description: Timestamp of the first observation in the track. (format=date-time)
    additionalProperties: true
  Filter:
    type: object
    description: Subscription filter. The filters array currently supports one filter object.
    required: [topics]
    properties:
      topics:
        type: array
        items: {type: string}
        description: Lists of topics to subscribe to. Minimum one topic is required. (minItems=1)
      instanceFilter:
        type: array
        items:
          type: object
          additionalProperties: {type: string}
        description: Filters samples by instance key-value pairs.
      dataFilter:
        type: array
        items: {type: string}
        description: Filters samples using jq-style expressions.
  StartFrom:
    type: object
    properties:
      position:
        enum: [oldest, new]
        default: new
        description: oldest includes historical samples, new receives only new samples.
  Subscription:
    type: object
    description: Same structure as the data-hub_v1:subscribe params.
    properties:
      subscriptionId: {type: string}
      filters:
        type: array
        items: {$ref: '#/types/Filter'}
      startFrom: {$ref: '#/types/StartFrom'}
  TopicSampleParams:
    type: object
    required: [subscriptionId, topic, instance, data, timestamp, isHistorical]
    properties:
      subscriptionId: {type: string, description: Identifies the subscription that the sample matches.}
      topic: {type: string, description: Identifies the topic from which the sample was received.}
      instance:
        type: object
        additionalProperties: true
        description: Instance key-value pairs associated with the sample.
      data: {type: object, description: The topic sample data (see the topic data schemas).}
      timestamp: {type: string, description: 'When the sample was produced, ISO 8601. (format=date-time)'}
      isHistorical: {type: boolean, description: Whether the sample was cached before the subscription started.}

operations:
  connect:
    summary: Open the WebSocket session with Device Data Hub.
    effect: read
    binding:
      session:
        path: /vapix/ws/v1
        query: {apis: data-hub}
        codec: datahub

