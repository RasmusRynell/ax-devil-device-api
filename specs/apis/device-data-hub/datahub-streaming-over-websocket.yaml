format: 2
id: datahub-streaming-over-websocket
name: Device Data Hub WebSocket API
summary: Consume data from Device Data Hub (on-device pub/sub) over a JSON-RPC 2.0 WebSocket API.
section: device-data-hub
family: ws
status: released
python:
  module: device_data_hub_ws
  class: DeviceDataHubWebSocket
docs:
- https://developer.axis.com/vapix/device-data-hub/websocket/
- https://developer.axis.com/vapix/device-data-hub/topics/
- https://developer.axis.com/vapix/device-data-hub/
access: admin
discovery:
- {api_discovery: datahub-streaming-over-websocket}
requires:
  firmware: '12.11'

binding: {}

errors:
  -32700: {description: Invalid JSON, kind: invalid_argument}
  -32600: {description: Invalid request, kind: invalid_argument}
  -32601: {description: Method not found, kind: unsupported}
  -32602: {description: Invalid parameter value specified, kind: invalid_argument}
  -32603: {description: Internal error, kind: internal}
  2100: {description: API version not supported, kind: unsupported}
  2105: {description: Authorization failed, kind: access_denied}
  2107: {description: Transport level error}
  1200: {description: No such subscription. Data Hub specific error code., kind: not_found}

types:
  PtzOpticalZoomStateV1:
    type: object
    required: [channelId]
    x-nullable: [hfov_deg, vfov_deg, zoom_mag, zoom_moving]
    properties:
      channelId: {type: string}
      hfov_deg: {type: number, minimum: 0, maximum: 360.0}
      vfov_deg: {type: number, minimum: 0, maximum: 360.0}
      zoom_mag: {type: number, minimum: 1.0, maximum: 100.0}
      zoom_moving: {type: boolean}
    additionalProperties: true
  PtzPanTiltStateV1:
    type: object
    required: [channelId]
    x-nullable:
    - pan_deg
    - pan_moving
    - pan_speed_deg_s
    - tilt_deg
    - tilt_moving
    - tilt_speed_deg_s
    properties:
      channelId: {type: string}
      pan_deg: {type: number, minimum: -360, maximum: 360.0}
      pan_moving: {type: boolean}
      pan_speed_deg_s: {type: number, minimum: -400, maximum: 400.0}
      tilt_deg: {type: number, minimum: -360, maximum: 360.0}
      tilt_moving: {type: boolean}
      tilt_speed_deg_s: {type: number, minimum: -400, maximum: 400.0}
    additionalProperties: true
  Filter:
    type: object
    description: Subscription filter. The filters array currently supports one filter object.
    required: [topics]
    properties:
      topics:
        type: array
        items: {type: string}
        minItems: 1
        description: Lists of topics to subscribe to. Minimum one topic is required.
      instanceFilter:
        type: array
        items:
          type: object
          additionalProperties: {type: string}
        description: Filters samples by instance key-value pairs.
      dataFilter:
        type: array
        items: {type: string}
        description: Filters samples using jq-style expressions.
  StartFrom:
    type: object
    properties:
      position:
        type: string
        enum: [oldest, new]
        default: new
        description: oldest includes historical samples, new receives only new samples.
  Subscription:
    type: object
    description: Same structure as the data-hub_v1:subscribe params. Each WebSocket session supports up to 10 subscriptions,
      and up to 10 WebSocket sessions can be active concurrently.
    required: [filters]
    properties:
      subscriptionId: {type: string, description: 'Identifies the subscription. If omitted, the device assigns a unique ID.'}
      filters:
        type: array
        items: {$ref: '#/types/Filter'}
        minItems: 1
        description: The filter used to select the topics and data samples. The array currently supports one filter object.
      startFrom: {$ref: '#/types/StartFrom'}
  TopicSampleParams:
    type: object
    required: [subscriptionId, topic, instance, data, timestamp, isHistorical]
    properties:
      subscriptionId: {type: string, description: Identifies the subscription that the sample matches.}
      topic: {type: string, description: Identifies the topic from which the sample was received.}
      instance:
        type: object
        additionalProperties: true
        description: Instance key-value pairs associated with the sample.
      data: {type: object, description: The topic sample data (see the topic data schemas).}
      timestamp: {type: string, description: 'When the sample was produced, ISO 8601. (format=date-time)'}
      isHistorical: {type: boolean, description: Whether the sample was cached before the subscription started.}

operations:
  connect:
    summary: Open the WebSocket session with Device Data Hub and optionally subscribe to topics.
    description: 'Each entry of `subscriptions` (a `Subscription`: `subscriptionId`, `filters`, `startFrom`) is sent as a
      `data-hub_v1:subscribe` request right after the handshake. Matching samples arrive as `data-hub_v1:topicSample`
      notifications (`session.notifications()` yields `TopicSample`). The other methods are in-session requests:
      `session.request("data-hub_v1:listTopics", {})`, `data-hub_v1:unsubscribe` (`subscriptionId`), `data-hub_v1:unsubscribeAll`
      and `data-hub_v1:listSubscriptions`. The handshake uses Basic or Digest authentication, or a session token
      from `wssession.cgi` (`use_token=True`; valid for 15 seconds).'
    effect: read
    binding:
      session:
        path: /vapix/ws/v1
        query: {apis: data-hub}
        codec: datahub
    examples:
    - title: Connect to Device Data Hub
      request: {}
      source: https://developer.axis.com/vapix/device-data-hub/websocket/#connect-to-device-data-hub
    - title: Subscribe to data
      request:
        connect:
          subscriptions:
          - subscriptionId: subscription-1
            filters:
            - topics: [some.Topic, other.Topic]
        messages:
        - method: data-hub_v1:subscribe
          params:
            subscriptionId: subscription-1
            filters:
            - topics: [some.Topic, other.Topic]
      source: https://developer.axis.com/vapix/device-data-hub/websocket/#subscribe-to-data
    - title: Subscribe with instance and data filters, starting with new samples
      request:
        connect:
          subscriptions:
          - subscriptionId: subscription-1
            filters:
            - topics: [topic.name.1]
              instanceFilter: [{key-1: value-1}]
              dataFilter: [expression]
            startFrom: {position: new}
        messages:
        - method: data-hub_v1:subscribe
          params:
            subscriptionId: subscription-1
            filters:
            - topics: [topic.name.1]
              instanceFilter: [{key-1: value-1}]
              dataFilter: [expression]
            startFrom: {position: new}
      source: https://developer.axis.com/vapix/device-data-hub/websocket/#method-subscribe

