id: datahub-streaming-over-websocket
name: Device Data Hub WebSocket API
summary: Consume data from Device Data Hub (on-device pub/sub) over a JSON-RPC 2.0 WebSocket API.
section: device-data-hub
family: ws
status: released
python:
