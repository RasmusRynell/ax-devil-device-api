[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ax-devil-device-api"
version = "1.0.0.dev0"
description = "Typed sync and async Python client for Axis device VAPIX APIs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Rasmus Rynell", email = "Rynell.Rasmus@gmail.com"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Framework :: AsyncIO",
]
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.14",
]

[project.urls]
Homepage = "https://github.com/rasmusrynell/ax-devil-device-api"
Repository = "https://github.com/rasmusrynell/ax-devil-device-api.git"
Documentation = "https://github.com/rasmusrynell/ax-devil-device-api#readme"
"Bug Tracker" = "https://github.com/rasmusrynell/ax-devil-device-api/issues"

[dependency-groups]
dev = [
    "pytest",
    "anyio",
    "pyright",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ax_devil_device_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
